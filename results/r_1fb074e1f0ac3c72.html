const REPORT_DATA = {"patient_name":"Nicholas Ingham","dob":"13/04/1980","report_date":"2026-10-29","summary":"Customer is a 46-year-old male following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are larger than average (volume 7 out of 10). He trains eight or more times per week (five or more cardio sessions and three resistance sessions at hard intensity) with 10,000 to 15,000 daily steps. He sleeps 6 to 7 hours, is slow to get going on waking, though his energy through the day is steady and stress rarely feels hard to manage. He does not drink alcohol. He takes levothyroxine following a total thyroidectomy for thyroid cancer. He supplements with protein powder and creatine. He has had a previous blood test where everything was normal. He reports weight gain and difficulty losing weight for over a year. His goals are to lose body fat, build muscle and improve long-term health and longevity. He notes that managing weight since his thyroidectomy has been hard.\n\nThe first thing to address is the thyroid picture, because after a total thyroidectomy the levothyroxine dose replaces all thyroid output, and the balance between the dose and the body's needs is the single biggest lever for his weight, energy and body composition. His TSH, the signal the pituitary gland sends to tell the thyroid to produce more hormone, is 0.23, below the laboratory lower limit of 0.55. In someone with a thyroid gland, a suppressed TSH would suggest overproduction, but in his case it reflects the levothyroxine dose being set deliberately to keep TSH low, which is standard practice after thyroid cancer to reduce the risk of recurrence. His free T4, the circulating form of the main thyroid hormone, is 21.1, near the top of the range (11.5 to 22.7), which is exactly what the endocrinologist would want to see in this context. His free T3, the active form the body converts T4 into, is 5.4, comfortably within the ideal window of 4.5 to 6.5. The FT3 to FT4 ratio, which shows how efficiently the body converts T4 into T3, is 0.256, just below the ideal band of 0.27 to 0.40. This is marginal and may simply reflect the fact that his T4 is running high by design, which pushes the ratio down arithmetically. Both thyroid antibody tests, TPO and thyroglobulin, are negative, which is reassuring. The thyroid replacement is doing its job: the hormones are where they need to be, and the conversion is adequate. This means the difficulty losing weight is not being driven by undertreated hypothyroidism, which is genuinely useful information.\n\nHis cardiovascular profile is one of the strongest features of this report. Total cholesterol is 4.4, LDL is 2.26 (below the 2.6 optimal ceiling), and ApoB, the protein that carries harmful cholesterol particles into artery walls, is 0.66, well below the 0.8 optimal threshold. His HDL, the protective cholesterol that removes lipid from artery walls, is 1.6, above the 1.4 optimal floor for men, and his ApoA1, the protein on HDL particles, is 1.67. The ApoB to ApoA1 ratio, the single best summary of lipid-driven cardiovascular risk, is 0.40, comfortably below 0.7. His triglycerides are 1.33, within the laboratory range and only marginally above the optimal ceiling of 1.0. His Lp(a), an inherited lipoprotein that deposits cholesterol independently of LDL and cannot be changed by lifestyle, is below 25, which is ideal and means any future cardiovascular risk management can focus entirely on modifiable factors. His Cardiovascular Risk Score, a composite index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 5 out of 100, which is excellent. Remnant cholesterol, the atherogenic index of plasma and the Castelli II ratio all sit within their optimal bands. This is a lipid profile that reflects his training volume and alcohol-free lifestyle.\n\nHis liver is in good health. ALT at 41 is within the laboratory range of up to 56, though it sits above the tighter optimal ceiling of 30 for men. GGT, the enzyme most sensitive to liver stress, is 38, within range (4 to 73) and below the tighter optimal ceiling would be around 25 for a man of 46. AST is 30, well within range. The FIB-4 score, a calculation that screens for liver scarring using age, platelets, AST and ALT, is 1.09, below 1.45 and showing no sign of fibrosis. The APRI, another fibrosis screen, is 0.38, well within its optimal band. The De Ritis ratio (AST divided by ALT) is 0.73, just below the optimal band of 0.8 to 1.3, because ALT is modestly higher than AST; this pattern in an active man with no alcohol intake most commonly reflects the training load and is not a concern. Bilirubin is 12, mid-range. Albumin is 40, total protein 68, globulin 28, all healthy. Amylase and lipase, the pancreatic enzymes, are both within range.\n\nHis blood sugar control is mixed and deserves attention because it connects directly to his weight goal. His HbA1c, the three-month average of blood sugar, is 36 mmol/mol, which is ideal, below the 42 threshold for pre-diabetes and within the optimal band. His fasting glucose, however, is 5.7, at the top of the laboratory range (3.5 to 6.0) and above the optimal ceiling of 5.4. His fasting insulin is 7.37, within the laboratory range (2.6 to 24.9) and just inside the optimal band of 2 to 8. His HOMA-IR, a calculation that multiplies glucose and insulin to estimate how resistant the cells are to insulin's signal, is 1.87, above the upper limit of 1.5 and approaching the 1.9 threshold that is considered early insulin resistance. The estimated average glucose from his HbA1c is 6.1, within the optimal ceiling of 6.2 but only just. The TyG index, another insulin resistance screen built from triglycerides and glucose, is 8.71, within range (below 8.8) but above the optimal ceiling of 8.5. His C-peptide, a molecule released in equal amounts to insulin and used to measure pancreatic output, is 1.32, at the lower end of its range (1.1 to 4.4), which means the pancreas is not overworking; the insulin resistance is mild and is being driven by how the tissues respond rather than by excessive production. Put together, the HbA1c says the average is fine, but the fasting snapshot says the system is running warm. A fasting glucose of 5.7 with a HOMA-IR of 1.87 in a man who trains eight times a week and does not drink alcohol points toward dietary composition, specifically the frequency of sugary food (some days) and the larger-than-average portion sizes. The levothyroxine dose keeping TSH suppressed means thyroid hormone levels are adequate, so this is not a thyroid-driven metabolic slowdown. The insulin resistance, even at this mild level, is the most likely metabolic explanation for why weight loss feels disproportionately hard relative to the training volume.\n\nKidney function needs a careful look. His creatinine-based eGFR is above 90, which looks reassuring, but his cystatin C, a smaller protein filtered by the kidneys that is not affected by muscle mass or diet, is 1.16, above the upper limit of 1.1. The cystatin C-derived eGFR is 83, and the combined creatinine and cystatin C eGFR is also 83, both below the 90 optimal threshold. In a man who trains hard and takes creatine, the creatinine-based eGFR can overestimate kidney function because creatine supplementation raises creatinine independently of kidney health. The cystatin C result is the more reliable measure here, and an eGFR of 83 at 46 is mildly reduced. It is not in the range that causes concern about kidney disease (that would be below 60), but it is below where it should be at his age. His urea is 11.5, above the upper limit of 8.2, which is consistent with high protein intake and hard training, both of which raise urea production. The urea to creatinine ratio is 138.6, above the upper normal limit of 100 and well above the optimal ceiling of 90, which further supports the picture of high protein turnover. His uric acid is 297, within range and within the optimal band. His calculated serum osmolality is 303.2, above the upper normal limit of 295, which in the context of a concentrated urine sample (specific gravity 1.025) and high urea may simply reflect mild dehydration at the time of the blood draw. Given the creatine supplementation and the high training load, the cystatin C result is the one to watch. It would be worth mentioning to his GP and repeating in six months, and in the meantime ensuring hydration is adequate, particularly around training.\n\nHis inflammation markers are excellent. High-sensitivity CRP, the most sensitive measure of systemic inflammation, is 0.7, within the optimal band of below 1.0. ESR is 8, within range. The platelet to lymphocyte ratio and systemic immune-inflammation index are both within their optimal bands. This is a body under very little inflammatory stress.\n\nHis full blood count shows a few findings. His red blood cell count is 5.6, marginally above the upper limit of 5.5. His haemoglobin is 168, at the top of the male range (130 to 170) but within it. His haematocrit is 0.484, within range. The marginally elevated red cell count alongside a haemoglobin at the top of range is a pattern sometimes seen with high training volumes and is not concerning on its own, but it is worth the GP noting alongside the haematocrit if future tests show the same or higher values. His MCHC, the average concentration of haemoglobin within each red cell, is 347, marginally above the upper limit of 345; at this margin this is laboratory variation and not clinically meaningful. His neutrophils are 1.84, just below the lower limit of 2.0. Neutrophils are the white blood cells that respond first to bacterial infection. A count of 1.84 in an otherwise well man with no signs of infection and a normal total white cell count (4.74, within range) most likely represents benign ethnic neutropenia, which is common, or physiological variation related to the timing of the blood draw, exercise patterns, or circadian rhythm. His lymphocytes at 2.34, monocytes, eosinophils and basophils are all within range. Reticulocytes, the young red blood cells that show bone marrow activity, are within range at both percentage (1.28) and absolute count (71.68). Platelets are 198, healthy.\n\nHis iron studies are well balanced. Ferritin, the body's iron store, is 190, within the optimal band of 50 to 200 for men. Serum iron is 19.7, transferrin saturation is 34.71 percent (within the optimal 25 to 40 percent window), transferrin is 2.26 and iron binding capacity is 52.5, all within range. There is no iron deficiency and no iron overload.\n\nHis hormones are broadly healthy. Testosterone is 15.9, within the laboratory range of 8.4 to 28.7 but below the optimal band of 18 to 30. Free testosterone, the portion not bound to proteins and available for use, is 0.404, within range (0.13 to 1.04). His SHBG, sex hormone binding globulin, the protein that binds testosterone and makes it unavailable, is 24.5, within range (17.3 to 65.8) and at the lower end, which means a higher proportion of his total testosterone is free, partially compensating for the below-optimal total. Bioavailable testosterone is 8.84, within its optimal band. Free androgen index is 64.9, healthy. His LH and FSH, the pituitary hormones that drive testosterone production, are both within range, which means the pituitary-testicular axis is functioning normally and the below-optimal total testosterone is not a signal of disease. DHEA-S is 4.7, mid-range and healthy for 46. Oestradiol is 100, within range. Progesterone is 1.2, within the male range. Prolactin is 283, within range. Cortisol is 735, above the morning reference range upper limit of 619.4. A morning cortisol reading can vary substantially with the exact time of the blood draw, stress around venepuncture, and whether the sample was taken early enough in the morning window. At 735, it is modestly elevated but not at a level that suggests pathology such as Cushing's syndrome, which would typically produce values well above 800 alongside other clinical features. His steady energy, low stress levels, good sleep pattern and absence of other symptoms (central weight gain, easy bruising, muscle weakness) all argue against a cortisol disorder. This is most likely a physiological peak related to his high training load and the timing of the draw, but it is worth noting for the GP.\n\nHis vitamins and minerals are in good shape. Vitamin D is 99, within the optimal band of 75 to 120. Vitamin B12 is 554, within the optimal band of 500 to 900. Folate is 13, above the optimal floor of 8. Calcium, corrected calcium, phosphate and magnesium are all within range, with magnesium at 0.91, within the optimal band. Parathyroid hormone is 1.845, within range.\n\nHis immune markers are unremarkable. IgG, IgA, IgM and IgE are all within range. Rheumatoid factor is 4, well within range. Tissue transglutaminase IgA is negative, which excludes coeliac disease as a contributor to his symptoms.\n\nHis prostate markers are excellent. PSA is 0.57, well below the 2.5 threshold. Free PSA ratio is 0.649, very reassuring. CEA and CA19-9 are both within range.\n\nHis total antioxidant activity is 1.87, above the upper limit of 1.77. This is almost certainly driven by the creatine supplementation, which acts as an antioxidant in the blood. It is a positive finding rather than a concern.\n\nHis urinalysis is clean. No protein, glucose, ketones, blood, white cells, nitrites or significant bacterial growth.\n\nHis PhenoAge, a biological age estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 38.4 against a calendar age of 46, placing his biological age 7.6 years younger than his chronological age. This is an excellent result and reflects his training, clean inflammation markers and healthy metabolic profile.\n\nThe weight difficulty he describes, despite training eight or more times a week with 10,000 to 15,000 daily steps, is one of the most frustrating patterns for someone post-thyroidectomy. The thyroid replacement is adequate by every measure in this report: FT4 and FT3 are both where they should be. The explanation is more likely to sit in the combination of mild insulin resistance (HOMA-IR 1.87, fasting glucose 5.7), larger-than-average portions, sugary food some days, and a testosterone that, while not deficient, is below the optimal level for muscle building and fat loss. Addressing the insulin resistance through dietary composition, not through eating less overall, is the most direct route to unlocking the weight loss his training should be producing.","links":"The central thread in this report connects four findings: mild insulin resistance, a fasting glucose at the top of range, below-optimal testosterone and the difficulty losing weight despite a very high training volume. After a total thyroidectomy, the body depends entirely on levothyroxine for thyroid hormone, and the dose is clearly adequate, with FT4 at 21.1 and FT3 at 5.4. This rules out the most common post-thyroidectomy cause of weight difficulty, which is undertreated hypothyroidism. With that excluded, the metabolic picture shifts to insulin sensitivity. A HOMA-IR of 1.87 means the tissues are beginning to resist insulin's signal, requiring the pancreas to produce more insulin to clear the same amount of glucose. Insulin is also a storage hormone: when it is elevated, the body preferentially stores energy rather than releasing it from fat, which is the mechanism behind the weight plateau.\n\nThe dietary pattern is the most likely driver of the insulin resistance. The training volume and step count are exceptionally high, so energy expenditure is not the problem. Sugary food some days alongside larger-than-average portions means the total glycaemic load, the amount of sugar and starch hitting the bloodstream per meal, is high enough to keep fasting glucose at 5.7 and nudge the HOMA-IR above threshold. The triglycerides at 1.33, while within range, are above the optimal ceiling of 1.0, and the TyG index at 8.71 is above the optimal 8.5, both of which are consistent with this mild carbohydrate-driven insulin resistance pattern.\n\nThe testosterone at 15.9 is not deficient, and LH and FSH are both normal, so the testes are receiving the right signals from the pituitary. But at 46 with goals of building muscle and losing fat, a total testosterone below 18 means the hormonal environment is less favourable for those goals than it could be. Improving insulin sensitivity, optimising sleep duration (6 to 7 hours is below the 7 to 9 hour window that supports testosterone production), and maintaining the resistance training should all help nudge testosterone upward over the next three to six months.\n\nThe kidney picture is a loose end that needs monitoring. The creatinine-based eGFR of above 90 is misleading in the context of creatine supplementation, which raises creatinine independently. The cystatin C at 1.16 and the cystatin C-derived eGFR of 83 are the truer measures, and 83 at 46 is mildly below optimal. The urea of 11.5 and the urea to creatinine ratio of 138.6 are high, likely reflecting the high protein intake from both diet and supplementation. This does not mean protein is damaging the kidneys, but it does mean the kidneys are working harder to clear the byproducts, and at an eGFR of 83 it is worth ensuring hydration is consistently high and repeating cystatin C in six months.\n\nThe remaining findings are minor and unconnected. The neutrophils at 1.84, just below 2.0, are most likely benign variation in an otherwise well man with no infection markers. The cortisol at 735, modestly above the morning ceiling, is consistent with high training load and sample timing. The MCHC at 347 and red blood cell count at 5.6 are both marginally above their upper limits and are not clinically significant at these margins.","lifestyle":"Reduce sugary food from some days to no more than once a week, and when you do have something sweet, attach it to the end of a protein-rich meal rather than eating it on its own. Anchor: treat it as a weekend-only choice. Why: this is the single biggest lever for bringing fasting glucose down from 5.7 and HOMA-IR from 1.87 toward the 1.0 target.\nAdd a palm-sized portion of protein to every meal and snack before the carbohydrate. Anchor: protein goes on the plate first. Why: protein blunts the glucose and insulin response to the meal and supports the muscle-building goal at a testosterone of 15.9. Aim for 130 to 145 grams of protein per day (roughly 1.6 to 1.8 g per kilogram).\nSwap refined carbohydrates (white bread, white rice, pastry, sugary cereal) for whole grains, oats, sweet potato or legumes. Anchor: start with whichever meal currently has the most refined starch. Why: slower-releasing carbohydrate lowers the insulin demand per meal, which is the mechanism behind the HOMA-IR improvement.\nWalk for 10 to 15 minutes after your largest meal of the day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal, which directly addresses the fasting glucose of 5.7.\nIncrease sleep to 7 to 8 hours. Set a fixed wake time and work the bedtime backward. Get outside within an hour of waking for natural light and set a caffeine cut-off at 1 pm. Anchor: alarm at the same time every day including weekends. Why: sleep below 7 hours is associated with higher fasting glucose, higher cortisol, and lower testosterone production; improving it supports all three.\nDrink 2.5 to 3 litres of water across the day, with at least 500 ml before and during each training session. Anchor: a full bottle at your desk or in your bag refilled at each meal. Why: your urine specific gravity of 1.025 and serum osmolality of 303 suggest you are mildly under-hydrated, and adequate hydration supports the kidney function at a cystatin C eGFR of 83.\nIncrease vegetables and fruit from 2 to 3 portions to at least 5 per day, prioritising fibre-rich vegetables (broccoli, spinach, peppers, beans). Anchor: add one portion to lunch and one to dinner this week, build from there. Why: soluble fibre slows glucose absorption, feeds gut bacteria, and supports the cholesterol profile.\nCalorie target for gradual fat loss: approximately 2,400 to 2,600 kcal per day, based on a maintenance estimate of around 2,900 to 3,100 kcal for your weight, training volume and step count. Protein floor: 130 to 145 g per day. A realistic weight target range is 74 to 78 kg. Retest in four to six months and track HOMA-IR, fasting glucose, cystatin C and testosterone to see the plan working.","flags":"TSH 0.23, below the lower limit of 0.55. This is expected and intentional in a post-thyroidectomy patient on levothyroxine for thyroid cancer, where the dose is set to suppress TSH and reduce recurrence risk. FT4 at 21.1 and FT3 at 5.4 confirm adequate replacement. No action needed unless his endocrinologist changes the target.\nHOMA-IR 1.87, above the upper limit of 1.5, approaching the 1.9 early insulin resistance threshold. Fasting glucose 5.7 (top of range, above the 5.4 optimal ceiling). TyG index 8.71, above optimal 8.5. Driven by dietary composition in a highly active man; lifestyle changes are the first-line approach.\nCystatin C 1.16, above the upper limit of 1.1. Cystatin C-derived eGFR 83, combined eGFR 83, both below the 90 optimal threshold. Creatine supplementation makes the creatinine-based eGFR unreliable; cystatin C is the more accurate measure. Urea 11.5, above 8.2, and urea to creatinine ratio 138.6, above 100, consistent with high protein turnover. Worth a GP review and repeat in six months.\nCortisol 735, above the morning upper limit of 619.4. No clinical features of cortisol excess. Most likely reflects high training load and sample timing. Worth noting for the GP.\nNeutrophils 1.84, marginally below the lower limit of 2.0. No infection, no symptoms, total WBC within range. Most likely benign variation. Worth noting for the GP and repeating at next test.\nRed blood cell count 5.6, marginally above the upper limit of 5.5. Haemoglobin 168 at the top of range, haematocrit 0.484 within range. Not clinically significant at this margin but worth monitoring.\nMCHC 347, marginally above the upper limit of 345. At this margin, this is laboratory variation.\nTotal antioxidant activity 1.87, above the upper limit of 1.77. Likely driven by creatine supplementation. A positive finding.\nSerum osmolality 303.2, above the 275 to 295 range, consistent with mild dehydration at the time of the blood draw and supported by the concentrated urine (specific gravity 1.025).\nTestosterone 15.9, within the laboratory range of 8.4 to 28.7 but below the optimal band of 18 to 30. LH, FSH and SHBG are all within range, indicating normal pituitary signalling. Free and bioavailable testosterone are within their optimal bands.\nReassuring negatives: liver fibrosis excluded (FIB-4 1.09, APRI 0.38), inflammation absent (hsCRP 0.7, ESR 8), thyroid antibodies negative, coeliac excluded (tTG negative), prostate clear (PSA 0.57, free ratio 0.649), iron studies balanced (ferritin 190, saturation 34.7%), vitamin D optimal (99), B12 optimal (554), folate adequate (13), HbA1c ideal (36), cardiovascular risk score 5 out of 100, PhenoAge 38.4 against calendar age 46, urinalysis clean.","recommendations":"Discuss the cystatin C of 1.16 and the combined eGFR of 83 with the GP. Given the creatine supplementation, the cystatin C-based eGFR is the more reliable measure. A repeat cystatin C in six months will confirm whether this is stable.\nMention the cortisol of 735 at the next GP or endocrinologist appointment. In the absence of symptoms of cortisol excess, no investigation is needed, but it should be on record.\nNote the neutrophils at 1.84 for the GP. A repeat full blood count at the next test will confirm whether this is a consistent finding or normal variation.\nAt the next endocrinology review, discuss whether the current levothyroxine dose and TSH suppression target remain appropriate given the time since thyroidectomy and the cancer type. The replacement is working well by FT4 and FT3 levels.\nDiscuss the testosterone of 15.9 with the GP if, after six months of the lifestyle changes (sleep, diet, insulin sensitivity), it has not moved toward the optimal band. At 46, the pituitary signalling is normal and lifestyle optimisation is the appropriate first step.\nAddress mild insulin resistance through dietary composition changes: reduce sugary food frequency, prioritise protein and fibre at every meal, and use post-meal walks. Calorie target for fat loss: 2,400 to 2,600 kcal per day with a protein floor of 130 to 145 g per day. Retest HOMA-IR, fasting glucose, cystatin C and testosterone in four to six months.","supplementation":"Magnesium glycinate, 300 to 400 mg, taken before bed. Why: magnesium is within the optimal range at 0.91 but at his training volume (eight or more sessions a week at hard intensity), demand is high, and magnesium glycinate supports sleep quality, muscle recovery and insulin sensitivity.\nOmega-3 fish oil, 2 g EPA plus DHA combined per day, taken with a meal containing fat. Why: triglycerides at 1.33 are above the optimal ceiling of 1.0, and omega-3 lowers triglycerides, supports cardiovascular health and may improve insulin sensitivity.\nVitamin D3, 2,000 IU (50 mcg) daily with a fat-containing meal, paired with vitamin K2 MK-7, 100 mcg daily. Why: vitamin D is at 99, within the optimal band of 75 to 120, and a maintenance dose will keep it there through the winter months. K2 directs calcium into bone rather than soft tissue.\nCreatine monohydrate, continue at 3 to 5 g per day. Why: creatine supports his resistance training and muscle-building goal. The elevated total antioxidant activity (1.87) is a side effect of supplementation and not a concern. However, he should be aware that creatine raises creatinine and can mask a subtle decline in kidney function; the cystatin C eGFR is the key kidney marker to monitor.\nThe most important changes from this report are not supplements. They are reducing sugary food frequency, adding protein and fibre to every meal, extending sleep to 7 to 8 hours, and staying well hydrated to support kidney function at a cystatin C eGFR of 83.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 66 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 65.8. Weakest systems: kidney function 24%, thyroid 54%, hormones 55%. Biggest drags: Urea, Cortisol, HOMA-IR, TSH.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"38.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3765","lower_normal":"","upper_normal":"51","lower_optimal":"","upper_optimal":"46","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4510","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 38.4 against a calendar age of 46, this places his biological age 7.6 years younger than his chronological age. The main markers driving this favourable result are the excellent CRP of 0.7, the healthy albumin, the low white cell count and the well-controlled glucose. Addressing the fasting glucose and HOMA-IR should push PhenoAge even further below his calendar age.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0625","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built, regardless of age. At 5, this is excellent and well within the ideal band of 20 or below. The main factors keeping it low are the ApoB of 0.66, HDL of 1.6, Lp(a) below 25 and hsCRP of 0.7.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6267","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Blood glucose measures the concentration of sugar in the blood after fasting. At 5.7, this sits at the top of the laboratory range (3.5 to 6.0) and above the optimal ceiling of 5.4. In the context of his HOMA-IR of 1.87 and larger-than-average portions with sugary food some days, this suggests the tissues are beginning to resist insulin's glucose-clearing effect. Reducing the glycaemic load of meals through protein-first eating, swapping refined carbohydrates for whole grains, and cutting sugary food frequency is the most effective way to bring this back below 5.4.","low_causes":"Fasting, insulin therapy, reactive hypoglycaemia, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress response, corticosteroid use, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"%","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, giving a picture of average blood sugar over the past two to three months. At 5.5%, this is below the 6.0% threshold for pre-diabetes and well within the normal range. It confirms that despite the fasting glucose being at the top of range, the overall three-month average is healthy.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Pre-diabetes, type 2 diabetes, iron deficiency, splenectomy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5758","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the standard international unit. At 36, it is at the optimal ceiling, below the 42 threshold for pre-diabetes. This is the clearest single marker that long-term blood sugar control is good, even though the fasting snapshot suggests the system is running warm.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Pre-diabetes, type 2 diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"7.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4046","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar in check. At 7.37, this is within both the laboratory range (2.6 to 24.9) and the optimal band (2 to 8). On its own this looks healthy, but when combined with the fasting glucose of 5.7 in the HOMA-IR calculation, it reveals that the insulin is working harder than it should to keep glucose controlled, which is the definition of early insulin resistance.","low_causes":"Low-carbohydrate diet, pancreatic insufficiency, type 1 diabetes","high_causes":"Insulin resistance, high-carbohydrate diet, obesity, metabolic syndrome, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3556","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3737","upper_optimal_position":"0.5758","units":"ug/l","description":"C-peptide is released by the pancreas in equal amounts to insulin, making it a reliable measure of how much insulin the pancreas is actually producing. At 1.32 ug/L, this is at the lower end of the laboratory range (1.1 to 4.4), indicating the pancreas is not being overworked. This is consistent with the fasting insulin of 7.37 and tells us that the mild insulin resistance is a tissue-level problem rather than a pancreatic overproduction issue.","low_causes":"Low-carbohydrate diet, low insulin demand, type 1 diabetes, pancreatic insufficiency","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7900","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, the Homeostatic Model Assessment of Insulin Resistance, is calculated by multiplying fasting glucose by fasting insulin and dividing by a constant. It estimates how resistant the body's cells are to insulin's signal. At 1.87, this is above the upper limit of 1.5 and approaching the 1.9 threshold considered early insulin resistance. Below 1.0 is optimal, meaning the cells respond sensitively to insulin. At 1.87, the body is requiring nearly twice the ideal amount of insulin to clear glucose from the blood. In a man who trains eight or more times a week and does not drink alcohol, dietary composition is the most likely driver.","low_causes":"High insulin sensitivity, low-carbohydrate diet, very lean body composition","high_causes":"Insulin resistance, high-carbohydrate or high-sugar diet, excess caloric intake, visceral fat accumulation, sedentary lifestyle, chronic stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4357","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from the HbA1c and gives a picture of what the blood sugar has been averaging over the past two to three months. At 6.1, this is within the optimal band (below 6.2), confirming that overall glucose control has been good despite the fasting glucose being at the top of range on the day of the test.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.71","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4949","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index is calculated from fasting triglycerides and fasting glucose and is used as an alternative screen for insulin resistance. At 8.71, it is within the reference range (below 8.8) but above the optimal ceiling of 8.5, which aligns with the HOMA-IR finding and adds further weight to the mild insulin resistance picture. It is being driven by the combination of fasting glucose at 5.7 and triglycerides at 1.33.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"34.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4839","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation shows what proportion of the iron-carrying protein transferrin is loaded with iron. At 34.71%, this sits within the optimal band of 25 to 40%, indicating a healthy balance: enough iron is circulating to supply the bone marrow and muscles without any sign of overload.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron overload, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"19.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4704","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.5601","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood at the time of the draw. At 19.7, it is well within both the laboratory range (11.6 to 31.3) and the optimal band, confirming adequate iron availability for red blood cell production, energy metabolism and muscle function.","low_causes":"Iron deficiency, chronic disease, poor dietary intake, blood loss, malabsorption","high_causes":"Haemochromatosis, excessive supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3578","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.4","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream. At 2.26, it is within the laboratory range (2.15 to 3.65) but slightly below the optimal band of 2.4 to 3.2. Because ferritin (iron stores) is healthy at 190 and saturation is optimal, this low-normal transferrin most likely reflects adequate iron availability: the body does not need to produce as much carrier protein when stores are full.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"52.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4216","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"65","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3437","upper_optimal_position":"0.5514","units":"umol/l","description":"Total iron binding capacity measures how much iron the blood could carry if all the transferrin were fully loaded. At 52.5, it is within range and within the optimal band, confirming a well-balanced iron economy.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"190","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/ml","description":"Ferritin is the body's iron storage protein. At 190, it is within the optimal band of 50 to 200 for men, indicating healthy iron reserves that support red blood cell production, energy metabolism and immune function without any risk of overload.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption, heavy training","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"168","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6500","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. At 168, it is near the top of the male range (130 to 170) and just above the optimal ceiling of 165. This is consistent with his high training volume and excellent iron stores. It is not a concern on its own but is worth noting alongside the marginally elevated red blood cell count.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, high altitude, heavy training, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"x10/12/l","description":"Red blood cell count measures the number of red cells per litre of blood. At 5.6, it is marginally above the upper limit of 5.5. In the context of a haemoglobin at 168 and haematocrit of 0.484 (both within range), this marginal elevation is most commonly seen with intense endurance training and mild dehydration at the time of the draw. It does not indicate polycythaemia at these levels but should be noted for future monitoring.","low_causes":"Anaemia, blood loss, bone marrow failure, nutritional deficiency","high_causes":"Dehydration, high altitude, heavy training, polycythaemia vera, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.484","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6133","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.42","upper_optimal":"0.49","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"l/l","description":"Haematocrit measures the proportion of blood that is made up of red blood cells. At 0.484, it is within range and within the optimal band, confirming that the proportion of red cells to plasma is healthy despite the marginally elevated red cell count.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, heavy training, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"13.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4952","lower_normal":"11.5","upper_normal":"15","lower_optimal":"12","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"%","description":"Red cell distribution width measures how uniform the red blood cells are in size. At 13.2%, it is within the optimal band, indicating consistent red cell production with no nutritional deficiency or bone marrow stress.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"86.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fl","description":"Mean corpuscular volume measures the average size of each red blood cell. At 86.6, it is within the optimal band, indicating a healthy balance of iron, B12 and folate, the three nutrients that determine red cell size.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"Mean corpuscular haemoglobin measures the average amount of haemoglobin in each red blood cell. At 30, it is within the optimal band, confirming each red cell is carrying a healthy payload of oxygen-carrying protein.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, macrocytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"347","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6889","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Mean corpuscular haemoglobin concentration measures how concentrated the haemoglobin is within each red blood cell. At 347, it is 2 points above the upper limit of 345. At this margin, this is laboratory variation and is not clinically significant.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"198","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3949","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3654","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are the small cell fragments that form blood clots to stop bleeding. At 198, the count is within the optimal band, indicating healthy platelet production and no concerns about clotting or bleeding risk.","low_causes":"Viral infection, bone marrow disorders, autoimmune conditions, medications, liver disease","high_causes":"Iron deficiency, infection, inflammation, post-splenectomy, essential thrombocythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6222","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"fL","description":"Mean platelet volume measures the average size of each platelet. At 9.7, it is within the laboratory range (7.1 to 10.1) and slightly above the optimal ceiling of 9.5. Larger platelets are younger and more active, and a slightly higher MPV with a healthy platelet count is not a concern.","low_causes":"Bone marrow underproduction, aplastic anaemia","high_causes":"Active platelet production, inflammation, immune thrombocytopenia, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3744","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cell count measures the total number of immune cells in the blood. At 4.74, it is within the laboratory range (4 to 10) but slightly below the optimal band of 5 to 8. The lower count is driven by the neutrophils at 1.84 and does not indicate immune compromise; a lower total white cell count is common in fit, lean individuals and has even been associated with longevity in population studies.","low_causes":"Fitness, benign ethnic neutropenia, viral infection, medication, bone marrow suppression","high_causes":"Bacterial infection, inflammation, stress response, steroid use, smoking, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3227","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5333","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first to respond to bacterial infections. At 1.84, the count is marginally below the lower limit of 2.0. In an otherwise healthy 46-year-old with no signs of infection, no fever, and a clean CRP, this most likely represents benign variation. It is common in fit individuals and those of certain ethnic backgrounds (benign ethnic neutropenia affects up to 25 to 50 percent of people of African, Middle Eastern and some European descent). It is worth noting for the GP and repeating at the next test to confirm the pattern.","low_causes":"Benign ethnic neutropenia, heavy exercise, viral infection, medication, bone marrow disorders","high_causes":"Bacterial infection, inflammation, stress response, steroid use, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5567","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, including producing antibodies and fighting viral infections. At 2.34, the count is within the optimal band, indicating a healthy and well-functioning adaptive immune system.","low_causes":"Severe infection, steroid use, autoimmune disease, HIV, post-exercise","high_causes":"Viral infection, chronic lymphocytic leukaemia, stress response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4292","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf debris and pathogens and help coordinate the immune response. At 0.43, the count is within the optimal band, confirming healthy immune surveillance.","low_causes":"Bone marrow disorders, steroid therapy","high_causes":"Chronic inflammation, infection, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3889","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.05","upper_optimal":"0.35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and fighting parasitic infections. At 0.1, the count is within the optimal band, with no sign of allergic activation or parasitic disease.","low_causes":"Steroid use, acute stress","high_causes":"Allergic conditions, parasitic infection, asthma, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4074","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest white blood cells, involved in allergic and inflammatory responses. At 0.03, the count is within the optimal band and is entirely normal.","low_causes":"Acute allergic reaction, steroid use, hyperthyroidism","high_causes":"Chronic inflammation, myeloproliferative disorders, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. Their percentage shows how actively the marrow is producing new red cells. At 1.28%, this is within the optimal band, confirming healthy red cell turnover.","low_causes":"Iron, B12 or folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Haemolytic anaemia, blood loss, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"71.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4779","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells in circulation, independent of the total red cell count. At 71.68, this is within the optimal band, confirming the bone marrow is producing red cells at a healthy rate.","low_causes":"Iron, B12 or folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Haemolytic anaemia, blood loss, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"mm/hour","description":"Erythrocyte sedimentation rate measures how quickly red blood cells settle in a test tube over one hour, which increases with inflammation. At 8, this is within the optimal band and confirms the absence of systemic inflammation, consistent with the hsCRP of 0.7.","low_causes":"","high_causes":"Infection, autoimmune disease, malignancy, chronic inflammation, anaemia, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0700","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity C-reactive protein is the most sensitive blood marker for systemic inflammation. It is produced by the liver in response to inflammatory signals anywhere in the body. At 0.7, it is within the optimal band of below 1.0, indicating minimal systemic inflammation and low cardiovascular inflammatory risk. This is an excellent result for a 46-year-old.","low_causes":"","high_causes":"Infection, chronic inflammation, cardiovascular risk, obesity, autoimmune disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"84.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3880","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet to lymphocyte ratio is a comp d regulate calcium, can be damaged during thyroid surgery; this result confirms they are functioning normally.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4559","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.5709","units":"mmol/l","description":"Phosphate works with calcium in bone health and energy metabolism. At 1.1, it is within the optimal band, confirming healthy bone mineral metabolism alongside the calcium and PTH results.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malnutrition, antacid use","high_causes":"Kidney disease, hypoparathyroidism, excessive intake, cell breakdown","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle function and sleep regulation. At 0.91, it is within the optimal band of 0.85 to 1.05. Given his heavy training load of eight or more sessions per week, supplementation with magnesium glycinate is still worth considering because blood levels represent only about 1% of total body magnesium and demand increases with exercise.","low_causes":"Poor dietary intake, heavy sweating, alcohol, diuretics, proton pump inhibitors","high_causes":"Kidney disease, excessive supplementation, tissue breakdown","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"297","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4118","lower_normal":"220","upper_normal":"547","lower_optimal":"220","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4964","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines found in food and cells. At 297, it is within the optimal band for men (200 to 380), indicating healthy clearance by the kidneys and no increased risk of gout or kidney stone formation.","low_causes":"Low-purine diet, medication (allopurinol), liver disease","high_causes":"High-purine diet, kidney disease, metabolic syndrome, gout, dehydration, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"aniongap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"17.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"10","upper_normal":"20","lower_optimal":"10","upper_optimal":"18","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"mmol/L","description":"The anion gap, calculated from sodium, potassium, chloride and bicarbonate, measures the difference between measured cations and anions in the blood. It helps identify acid-base disturbances. At 17.6, it is within both the normal range (10 to 20) and the optimal band (10 to 18), indicating normal acid-base balance with no hidden metabolic acidosis.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Metabolic acidosis (lactic acidosis, diabetic ketoacidosis, renal failure, toxins)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the sodium reading for elevated glucose levels, which can dilute sodium. At 143, this is the same as the uncorrected sodium because glucose is only marginally elevated. It is reported for context and is not applicable at present.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"303.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8033","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Serum osmolality is a calculated measure of the concentration of dissolved particles in the blood, built from sodium, urea and glucose. At 303.2, it is above the upper limit of 295. The main driver here is the urea at 11.5, which is elevated from high protein intake and training, combined with likely mild dehydration at the time of the draw (supported by the concentrated urine at specific gravity 1.025). This does not indicate a kidney or hormonal problem; improving daily hydration should normalise it.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumincorrected FALSE","result_position":"0.5273","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells and cleared entirely by the kidneys. Unlike creatinine, it is not affected by muscle mass, diet or creatine supplementation, making it the most reliable single marker of kidney function in an active, supplementing individual. At 1.16, it is above the upper limit of 1.1, giving a cystatin C-derived eGFR of 83, which is mildly below the optimal threshold of 90 for a 46-year-old. This does not indicate kidney disease but it does suggest the kidneys are not filtering as efficiently as expected for his age. It is worth discussing with his GP, ensuring hydration is adequate, and repeating in six months.","low_causes":"","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"83","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6917","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined creatinine and cystatin C eGFR uses both markers to give the most accurate single estimate of kidney filtration rate. At 83, it confirms the cystatin C-derived eGFR and indicates mildly reduced filtration for his age. Since creatine supplementation inflates the creatinine-based eGFR, this combined measure is more trustworthy than the creatinine-based result alone.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"138.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8811","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish the cause of elevated urea. At 138.6, it is well above the upper limit of 100, indicating that urea is disproportionately elevated relative to creatinine. This pattern is characteristic of high protein intake and dehydration rather than intrinsic kidney disease, particularly when the creatinine itself is normal. In this case, the high dietary protein plus creatine supplementation explains the pattern.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6133","units":"g/l","description":"Total protein measures the combined albumin and globulin in the blood. At 68, it is within the optimal band, indicating healthy liver synthetic function and immune protein production.","low_causes":"Liver disease, malnutrition, kidney disease (protein loss), malabsorption","high_causes":"Dehydration, chronic inflammation, myeloma, chronic infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin"," r for long-term cardiovascular risk.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Familial hypercholesterolaemia, high saturated fat diet, insulin resistance, hypothyroidism, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.395","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2821","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is the single best summary of the balance between atherogenic (artery-damaging) and anti-atherogenic (artery-protecting) lipoproteins. At 0.395, it is well below the 0.7 lower risk threshold for men, indicating an excellent balance between harmful and protective particles.","low_causes":"","high_causes":"Elevated ApoB, low ApoA1, metabolic syndrome, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein that deposits cholesterol independently of LDL and also promotes blood clotting. Unlike LDL, it cannot be changed by diet or exercise. At below 25, this is within the ideal range (below 32). This is genuinely useful information because it means any future cardiovascular risk is driven entirely by modifiable factors like diet, exercise and medication, not by an inherited particle that can ,{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"2.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3633","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"The Lp(a)-corrected LDL subtracts the cholesterol carried by Lp(a) particles from the total LDL, giving a picture of the modifiable LDL fraction. At 2.18, it is within the reference range (below 3.0) but marginally above the optimal ceiling of 2.0. With an Lp(a) below 25, there is very little correction needed, and almost all of his LDL is modifiable through diet and lifestyle.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5868","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The atherogenic index of plasma is calculated from triglycerides and HDL and predicts the size and density of LDL particles. A negative value, as here at minus 0.08, indicates larger, less dense LDL particles, which are less likely to penetrate artery walls. This is a positive finding within the optimal band.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"1.41","within_normal":"TRUE","within_optimal":"TRUE","result
