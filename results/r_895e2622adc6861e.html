":"0.5","range_type":"normal"},{"key":"reticulocyteabs","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"61.272","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4085","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"This is the absolute number of reticulocytes rather than the percentage. At 61.3, this is within the ideal range and confirms healthy bone marrow output.","low_causes":"Iron, B12 or folate deficiency, bone marrow suppression","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"22.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by red blood cell count and is used to distinguish iron deficiency anaemia from thalassaemia trait when MCV is low. At 22.6, with a normal MCV of 93.5, the index does not apply and is reported for context only.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a tube over one hour. The faster they settle, the more inflammation is present, because inflammatory proteins make red cells clump and fall more quickly. At 40, this is more than three times the upper limit of 12 and confirms significant systemic inflammation. The combined pill is a well-recognised driver of raised ESR, and the autoimmune thyroid inflammation from the very high TPO antibodies is a second contributor. The GP should interpret this in context.","low_causes":"","high_causes":"Infection, autoimmune disease, the combined pill, cancer, anaemia, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"16.73","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3219","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the body's iron-carrying protein that is actually loaded with iron. At 16.73%, this is below the lower limit of 18% and below the optimal floor of 25%. This means the body has plenty of carrying capacity but not enough iron to fill it. This is the earliest stage of iron depletion, before haemoglobin drops, and is consistent with the elevated transferrin and iron binding capacity. The PPI she takes reduces stomach acid, which impairs iron absorption, and the diet is very low in fruit, vegetables and likely iron-rich foods.","low_causes":"Iron deficiency, PPI use, low dietary iron, chronic disease, blood loss","high_causes":"Haemochromatosis, iron overload, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"16.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4470","lower_normal":"9","upper_normal":"30.4","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4112","upper_optimal_position":"0.6137","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. At 16.3, this is within the laboratory range of 9 to 30.4 but towards the lower end of the optimal range of 14 to 27. Iron fluctuates through the day and with meals, so this is best read alongside transferrin saturation and ferritin, both of which point to early iron depletion.","low_causes":"Iron deficiency, PPI use, blood loss, poor dietary intake","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"3.88","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6872","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein the body produces to carry iron in the blood. At 3.88, this is marginally above the upper limit of 3.8. The body produces more transferrin when it needs more iron, so a raised level is the body's signal that iron supply is not meeting demand. This is consistent with the low transferrin saturation and the high iron binding capacity.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, combined pill, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"80.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7165","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/L","description":"TIBC measures the total amount of iron the blood could carry if every transferrin molecule were fully loaded. At 80.9, this is above the upper limit of 76.1, confirming that the body has produced extra carrying capacity in an effort to capture more iron. This is characteristic of early iron deficiency and is consistent with the raised transferrin and low saturation.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, combined pill, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3713","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3689","upper_optimal_position":"0.4994","units":"ng/mL","description":"Ferritin is the protein that stores iron in the body's tissues, mainly the liver and bone marrow. At 42, this is within the laboratory range and just above the optimal floor of 40, but it is not building a strong buffer. In the context of low transferrin saturation, high transferrin and high TIBC, the body is using its stores and not replenishing them adequately. Ferritin is also an acute phase protein, meaning it rises with inflammation, so the true iron stores may actually be slightly lower than 42 suggests given the elevated CRP and ESR.","low_causes":"Iron deficiency, blood loss, poor dietary intake, PPI use","high_causes":"Inflammation, infection, liver disease, haemochromatosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"138","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4615","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is the main electrolyte in the blood and is critical for fluid balance, nerve and muscle function. At 138, this is within the ideal range.","low_causes":"Excess fluid intake, diuretics, kidney disease, SSRI use","high_causes":"Dehydration, excess salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride works with sodium to maintain fluid balance and acid-base balance. At 102, this is within the ideal range.","low_causes":"Vomiting, PPI use, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4848","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is a buffer that helps maintain the blood's pH within a very narrow range. At 25, this is within the ideal range, confirming healthy acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Vomiting, PPI use, metabolic alkalosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6200","units":"mmol/L","description":"Urea is a waste product created when the body breaks down protein, filtered out by the kidneys. At 6.5, this is within the ideal range, confirming the kidneys are handling protein waste effectively.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5366","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3821","upper_optimal_position":"0.5203","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. At 74, this is within the laboratory range of 49 to 90 and just above the optimal ceiling of 72. This is a normal level and is used alongside cystatin C to estimate kidney filtration rate.","low_causes":"Low muscle mass, malnutrition","high_causes":"Kidney disease, dehydration, high protein diet, high muscle mass","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":"85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7083","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood, calculated from creatinine, age and sex. At 85, this is above the lower limit of 60 but below the optimal threshold of 90. The combined eGFR from creatinine and cystatin C is 82, which gives a more accurate picture. At 44, this is worth noting and worth rechecking at the next test, but it is not a concern on its own.","low_causes":"Kidney disease, dehydration, medications, reduced kidney blood flow","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"203","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3560","lower_normal":"184","upper_normal":"464","lower_optimal":"184","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4952","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced by the body. At 203, this is within the laboratory range and near the lower end. Low uric acid has some antioxidant benefit. This is a healthy level.","low_causes":"Low purine diet, liver disease, medications","high_causes":"High purine diet, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.03","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4682","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a protein produced at a constant rate by all nucleated cells and filtered by the kidneys. It is a more reliable marker of kidney function than creatinine because it is not influenced by muscle mass, diet or exercise. At 1.03, this is within the laboratory range of below 1.1 but above the optimal ceiling of 0.9. It is used to calculate the cystatin C eGFR of 82. Inflammation can mildly raise cystatin C, and with CRP at 11 and ESR at 40, this may be a contributing factor.","low_causes":"","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"82","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6833","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR combines both creatinine and cystatin C for the most accurate estimate of kidney filtration. At 82, this is above the lower limit of 60 but below the optimal threshold of 90. At 44, this is adequate but slightly below what would be expected. The elevated CRP and ESR may be mildly raising cystatin C and lowering the estimate. Worth monitoring at the next test, but not a concern on its own.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"87.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5989","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"This ratio compares urea and creatinine to help distinguish between different causes of kidney changes. At 87.8, this is within the ideal range, suggesting no pre-renal cause of the mildly reduced eGFR such as dehydration.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr_cys","name":"Calculated Cystatin C eGFR","group":"KIDNEY FUNCTION","padding":"1","one_sided":"0.5","low_causes":"","high_causes":"","result":"82","units":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","within_normal":"","within_optimal":"","description":"The result is 82.","result_position":""},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6267","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 75, this is within the ideal range, though the balance between albumin (37) and globulin (38) is slightly shifted toward globulin.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Dehydration, chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3958","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is a protein made by the liver that carries hormones, vitamins and medications through the blood and maintains fluid balance. At 37, this is within the laboratory range of 34 to 50 but below the optimal floor of 40. Albumin can be reduced by chronic inflammation, which is present here with CRP at 11 and ESR at 40, and by the combined pill. It is not a concern on its own but is consistent with the inflammatory picture.","low_causes":"Chronic inflammation, liver disease, kidney disease, malnutrition, combined pill","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"38","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7037","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"33","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/L","description":"Globulin is a group of proteins that includes immunoglobulins (antibodies) and other immune and transport proteins. At 38, this is above the upper limit of 36. Elevated globulin indicates the immune system is producing more protein than usual, which is consistent with the autoimmune thyroid inflammation shown by the very high TPO antibodies and the raised ESR and CRP. The individual immunoglobulins IgG, IgM and IgA are all within range, so this is a broad immune activation rather than a specific immunoglobulin excess.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic inflammation, autoimmune disease, infection, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3667","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"ALP is an enzyme found in the liver, bones and bile ducts. At 53, this is within the ideal range and confirms there is no bile duct obstruction or active bone turnover beyond normal.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down, processed by the liver and excreted in bile. At 9, this is within the ideal range and confirms healthy red cell turnover and liver processing.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, Gilbert's syndrome, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1696","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT is a liver enzyme that rises when liver cells are damaged or inflamed. At 19, this is below the optimal ceiling of 25 for women, confirming the liver is in good health with no sign of metabolic strain.","low_causes":"","high_causes":"Liver inflammation, fatty liver, alcohol, medications, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscles. At 23, this is within the ideal range. Combined with the healthy ALT, this confirms no liver cell damage.","low_causes":"","high_causes":"Liver disease, muscle damage, heart damage, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2552","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3448","units":"","description":"FIB-4 is a score calculated from age, AST, ALT and platelets that estimates the likelihood of liver fibrosis (scarring). At 0.74, this is well below the threshold of 1.45 and below the optimal ceiling of 1.0, making significant liver fibrosis very unlikely.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, older age, low platelets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4216","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/L","description":"GGT is a liver enzyme that is particularly sensitive to alcohol, medications and bile duct problems. At 13, this is well below the optimal ceiling of 25, confirming the liver is handling her medications without any detectable strain. This is a clean result.","low_causes":"","high_causes":"Alcohol, liver disease, medications, bile duct obstruction, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6174","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands to break down starch. At 105, this is within the ideal range and confirms healthy pancreatic function from this marker's perspective.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"69","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7305","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3475","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is an enzyme produced by the pancreas to digest fats. At 69, this is above the upper limit of 60 but only mildly so, at 15% above the ceiling. Pancreatitis typically produces lipase levels three or more times the upper limit, so this degree of elevation does not suggest pancreatic inflammation. GLP-1 receptor agonists are a well-recognised cause of mildly raised lipase, and this is the most likely explanation. It is worth mentioning to the GP but is not a concern in the absence of persistent abdominal pain.","low_causes":"","high_causes":"Pancreatitis, GLP-1 medications, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5088","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling and blood clotting. At 2.38, this is within the ideal range. The corrected calcium, which adjusts for the albumin level, is 2.51, also within range. Given the family history of osteoporosis, healthy calcium is reassuring.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5917","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.3","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium result for the albumin level, because albumin carries calcium in the blood and a low albumin can make calcium appear lower than it truly is. At 2.51, with albumin at 37, the corrected calcium is within the ideal range, confirming true calcium balance is healthy.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excess vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5326","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.6092","units":"mmol/L","description":"Phosphate works with calcium to build and maintain bones and teeth and is involved in energy production in every cell. At 1.3, this is within the ideal range.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malnutrition, PPI use","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5345","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is essential for muscle relaxation, nerve function, sleep and over 300 enzyme reactions in the body. At 0.88, this is within the optimal band of 0.85 to 1.05, supported by her magnesium supplementation. PPIs can reduce magnesium absorption, so maintaining the supplement is important.","low_causes":"PPI use, alcohol, poor diet, diabetes, diarrhoea","high_causes":"Kidney disease, excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8700","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is produced by the skin in response to sunlight and is essential for calcium absorption, bone health, immune regulation and mood. At 87, this is within the optimal band of 75 to 120, which is a good result and reflects her supplementation. Given the family history of osteoporosis and the autoimmune thyroid picture, maintaining vitamin D in this range is particularly important because vitamin D plays a role in immune modulation.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption, PPI use","high_causes":"Excessive supplementation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"3.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5396","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3796","upper_optimal_position":"0.6018","units":"pmol/L","description":"PTH, parathyroid hormone, regulates calcium and phosphate levels by controlling how much calcium the bones release and how much the kidneys retain. At 3.3, this is within the ideal range. With vitamin D at 87 and corrected calcium at 2.51, the calcium and bone metabolism system is in balance, which is reassuring given the family history of osteoporosis.","low_causes":"Excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"138","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the sodium level for the effect of blood glucose on fluid balance. At 138, with a normal glucose of 4.9, the corrected sodium is the same as the raw sodium, confirming true sodium balance. This is reported for context.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"287.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5400","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Serum osmolality estimates the concentration of dissolved particles in the blood and reflects fluid balance. At 287.4, this is within the ideal range, confirming healthy hydration and electrolyte balance.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"605","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5074","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. At 605, this is within the optimal band of 500 to 900. This is a reassuring result given that she takes a proton pump inhibitor, which reduces stomach acid and can impair B12 absorption over time. Her multivitamin likely contains B12 and is helping maintain this level.","low_causes":"PPI use, vegan or vegetarian diet, pernicious anaemia, malabsorption","high_causes":"Supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate, or vitamin B9, works alongside B12 in cell division, DNA repair and red blood cell production. At 11, this is within the optimal band, confirming adequate folate intake from diet and supplementation.","low_causes":"Poor diet, alcohol, malabsorption, medications","high_causes":"Supplementation, high folate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP, or C-reactive protein, is a protein produced by the liver in response to inflammation anywhere in the body. It is one of the most sensitive markers of systemic inflammation. At 11, this is more than double the upper limit of 5 and eleven times the optimal ceiling of 1.0. The combined pill is a well-recognised driver of elevated CRP, sometimes raising it two to five times above baseline. The autoimmune thyroid inflammation from the very high TPO antibodies is a second contributor, and chronic low-grade inflammation has been observed in some people with CFS. The GP should interpret this alongside the ESR of 40 and may wish to repeat both markers if the pill is ever changed.","low_causes":"","high_causes":"Infection, autoimmune disease, combined pill, obesity, chronic inflammation, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA125","group":"TUMOR MARKERS","result":"7.4","within_normal":"TRUE","within_optimal":"","result_position":"0.1057","lower_normal":"0","upper_normal":"35","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"","units":"U/mL","description":"CA125 is a protein that can be elevated in ovarian cancer but also in many benign conditions including endometriosis, fibroids, menstruation and inflammation. At 7.4, this is well within range and is a reassuring screening result.","low_causes":"","high_causes":"Ovarian cancer, endometriosis, fibroids, inflammation, pregnancy, menstruation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA15-3","group":"TUMOR MARKERS","result":"8","within_normal":"TRUE","within_optimal":"","result_position":"0.1333","lower_normal":"0","upper_normal":"30","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"","units":"U/mL","description":"CA15-3 is a protein associated with breast tissue. At 8, this is well within range and is a reassuring screening result, particularly given the family history of cancer.","low_causes":"","high_causes":"Breast cancer, ovarian cancer, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5019","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all the cholesterol in the blood, including HDL (protective), LDL (potentially harmful) and VLDL. At 5.2, this is marginally above the desirable ceiling of 5.18. However, total cholesterol is a blunt tool. In this case, a large proportion is the protective HDL at 2.2, and the more meaningful markers are LDL, ApoB and the ratios, which are discussed in their own entries.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet, hypothyroidism, genetic factors, combined pill, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4725","lower_normal":"0","upper_normal":"2.0","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"mmol/L","description":"Triglycerides are fats in the blood that the body uses for energy. At 1.89, this is within the non-fasting limit of 2.0 but nearly double the optimal ceiling of 1.0. The combined pill is a well-recognised driver of raised triglycerides, and insulin resistance compounds this because elevated insulin stimulates the liver to produce more VLDL particles, which carry triglycerides. Reducing refined carbohydrates and sugary food, and increasing omega-3 from oily fish, are the most effective dietary interventions.","low_causes":"Low fat diet, hyperthyroidism, malnutrition","high_causes":"Combined pill, insulin resistance, high sugar or refined carbohydrate diet, alcohol, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5513","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL, very low-density lipoprotein, is produced by the liver and carries triglycerides to the tissues. At 0.86, this is above the upper limit of 0.78. VLDL is directly linked to triglyceride production, and the same drivers apply: the combined pill and insulin resistance are stimulating the liver to produce more VLDL. This will improve as triglycerides come down with dietary change.","low_causes":"","high_causes":"Insulin resistance, combined pill, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7692","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL, high-density lipoprotein, is the protective cholesterol that carries excess cholesterol away from the arteries and back to the liver for disposal. At 2.2, this is excellent, well above the optimal threshold of 1.6 for women. HDL at this level is genuinely protective and is one of the strongest positives in the lipid profile.","low_causes":"Smoking, obesity, sedentary lifestyle, poor diet, insulin resistance","high_causes":"Exercise, genetics, moderate alcohol, combined pill","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5707","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, low-density lipoprotein, is the cholesterol that deposits in artery walls when there is too much of it. At 2.28, this is within the laboratory range and below the optimal ceiling of 2.6. However, the more accurate measure of cardiovascular risk is ApoB, which counts the actual number of LDL particles rather than the cholesterol they carry. Her ApoB at 0.99 is above target, which means there are more particles than the LDL number alone suggests.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet, hypothyroidism, genetics, combined pill, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2622","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"This ratio divides total cholesterol by HDL. At 2.36, this is well within the ideal range of below 3.5, driven by the excellent HDL of 2.2. A low ratio means the proportion of protective cholesterol is high relative to the total.","low_causes":"","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"42.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"%","description":"This shows what percentage of total cholesterol is the protective HDL. At 42.31%, this is excellent. More than four out of every ten cholesterol units in the blood are the protective type, which is a strong positive.","low_causes":"Low HDL, obesity, sedentary lifestyle","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol particles (LDL, VLDL, IDL). At 3, this is within the desirable range of below 4 and within the optimal range. This is a good result.","low_causes":"","high_causes":"Diet, insulin resistance, hypothyroidism, combined pill, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9036","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5714","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main protein on HDL particles and reflects the number of protective cholesterol carriers in the blood. At 2.53, this is excellent, well above the normal threshold of 1.4, and mirrors the high HDL cholesterol.","low_causes":"Smoking, obesity, sedentary lifestyle, metabolic syndrome","high_causes":"Exercise, genetics, combined pill","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL and IDL particle, making it the best single measure of the number of potentially harmful cholesterol particles in the blood. At 0.99, this is above the desirable ceiling of 0.9 and above the optimal target of below 0.8. Each ApoB particle can enter the artery wall and contribute to plaque formation, so the particle count matters more than the cholesterol carried. Given her father's death from coronary heart disease at 65, this is a marker to work on. The insulin resistance (driving VLDL production) and the early thyroid changes (slowing LDL clearance) are both contributing. Dietary changes, particularly increasing soluble fibre and omega-3 and reducing refined carbohydrates, are the first-line interventions.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Diet, insulin resistance, hypothyroidism, combined pill, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB:ApoA1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3250","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"","description":"This ratio compares the number of harmful particles (ApoB) to the number of protective particles (ApoA1). At 0.39, this is well within the lower-risk range of below 0.6, driven by the very high ApoA1 at 2.53. This means that despite the elevated ApoB, the protective side of the equation is strong. The ratio provides a more balanced view of cardiovascular risk than ApoB alone.","low_causes":"","high_causes":"High ApoB, low ApoA1","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined particle similar to LDL that carries cholesterol and promotes both plaque formation and blood clotting. Unlike LDL, Lp(a) cannot be changed by diet, exercise or most medications. At below 25, this is within the ideal range of below 32. This is genuinely useful information because it means the elevated ApoB is driven entirely by modifiable factors such as diet, insulin resistance and the combined pill, with no inherited component working against her.","low_causes":"","high_causes":"Genetic inheritance (not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"111","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4971","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3619","upper_optimal_position":"0.6095","units":"U/L","description":"Creatine kinase is an enzyme found in muscles, including the heart. It rises after exercise or muscle damage. At 111, this is within the ideal range, indicating no significant muscle damage from exercise or medication. This is reassuring given the fibromyalgia, as excessive muscle breakdown is not occurring.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, statin use, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"13.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3839","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4, or free thyroxine, is the main hormone produced by the thyroid gland and circulates in the blood ready for conversion into the active form, T3. At 13.2, this is within the laboratory range of 11.5 to 22.7 but below the optimal band of 14 to 20, sitting near the bottom of the range. In the context of TPO antibodies above 400 and a TSH of 3.5 that is above optimal, this suggests the thyroid is being pushed hard to maintain even this level of output. This is the pattern seen in early Hashimoto's thyroiditis, where the gland is still compensating but beginning to show strain.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, pituitary disease","high_causes":"Hyperthyroidism, Graves' disease, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5658","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH, thyroid stimulating hormone, is the signal the brain's pituitary gland sends to tell the thyroid to make more hormone. A higher TSH means the brain is detecting that thyroid hormone levels are lower than it wants and is pushing harder. At 3.5, this is within the laboratory range of 0.55 to 4.78 but above the optimal band of 1.0 to 2.5. In the context of the very high TPO antibodies, a TSH above optimal suggests the immune attack on the thyroid is beginning to reduce its output, and the brain is compensating by raising the signal. This is the early stage of the pattern associated with Hashimoto's thyroiditis.","low_causes":"Hyperthyroidism, Graves' disease, pituitary disease, excess thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3, or triiodothyronine, is the active thyroid hormone that actually drives metabolism, energy, body temperature and cognitive function. The body converts T4 into T3 in the liver, kidneys and other tissues. At 4.4, this is within the laboratory range of 2.6 to 7.1 but just below the optimal floor of 4.5. This means the active hormone is on the low side of ideal, which is consistent with the early thyroid strain seen in the TSH and FT4 results. Low FT3 can contribute to fatigue, brain fog, low mood and cold sensitivity.","low_causes":"Hypothyroidism, chronic illness, low calorie diet, selenium deficiency","high_causes":"Hyperthyroidism, Graves' disease, excess T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"> 400","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3261","units":"U/mL","description":"TPO antibodies, or thyroid peroxidase antibodies, are produced by the immune system when it attacks the thyroid gland. Thyroid peroxidase is the enzyme the thyroid uses to make thyroid hormones. At above 400, this is more than 29 times the upper limit of 13.8 and represents a strong positive result. This is the hallmark of an autoimmune condition called Hashimoto's thyroiditis, the most common cause of underactive thyroid. The immune system is actively attacking the thyroid gland, and the TSH at 3.5 and FT4 at 13.2 suggest the gland is beginning to lose capacity. Given the family history of autoimmune disease, this finding should be discussed with the GP, who may wish to monitor thyroid function at regular intervals or consider referral to endocrinology.","low_causes":"","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinab","name":"Thyroglobulin Antibody","group":"THYROID","result":"2.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3182","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies are another type of antibody that can attack the thyroid. At 2.8, this is below the upper limit of 4.4, meaning this particular antibody is negative. More than 80% of people have undetectable levels. In the context of the very high TPO antibodies, the negative thyroglobulin antibody means the autoimmune attack is focused on the TPO enzyme rather than the thyroglobulin protein, which is the more common pattern in Hashimoto's.","low_causes":"","high_causes":"Hashimoto's thyroiditis, thyroid cancer, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.333","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5107","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"This ratio compares active T3 to T4 and reflects how efficiently the body converts the storage hormone into its active form. At 0.333, this is within the ideal band, meaning conversion is working well despite the strain on the gland. The issue is that both inputs are below optimal, but the conversion ratio between them is healthy.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca199","name":"CA19-9","group":"TUMOR MARKERS","result":"< 1.2","within_normal":"TRUE","within_optimal":"","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"","units":"U/mL","description":"CA19-9 is a protein that can be elevated in pancreatic and gastrointestinal cancers. At below 1.2, this is very low and well within range. Given the family history of bowel cancer with a hereditary gene, this clean result is particularly reassuring, though it does not replace the formal bowel screening programme.","low_causes":"","high_causes":"Pancreatic cancer, bowel cancer, bile duct cancer, pancreatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"< 0.5","within_normal":"TRUE","within_optimal":"","result_position":"0.1087","lower_normal":"0","upper_normal":"2.3","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"","units":"ng/mL","description":"CEA, carcinoembryonic antigen, is a protein that can be elevated in bowel, lung and other cancers. At below 0.5, this is very low and well within range. This is a reassuring screening result alongside the clean CA19-9, particularly given the family history of bowel cancer.","low_causes":"","high_causes":"Bowel cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"10.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4807","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant immunoglobulin in the blood and provides long-term immunity against bacteria and viruses. At 10.7, this is within the laboratory range, confirming a healthy adaptive immune response.","low_causes":"Immune deficiency, medications, kidney disease","high_causes":"Chronic infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4800","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first immunoglobulin the body produces when it encounters a new infection. At 1.6, this is within the laboratory range, indicating a healthy initial immune response.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, autoimmune disease, lymphoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgA is the immunoglobulin that protects mucosal surfaces, including the gut, lungs and urinary tract. At 0.9, this is within the laboratory range. IgA is also used to validate the coeliac screen: because her IgA is within range, the negative tissue transglutaminase IgA result is reliable.","low_causes":"IgA deficiency (genetic), medications","high_causes":"Chronic infection, liver disease, IgA nephropathy, coeliac disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"101","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5050","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"80","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"IU/mL","description":"IgE is the immunoglobulin associated with allergic responses and parasitic infections. At 101, this is marginally above the upper limit of 100. At this margin, a single unit above range is not clinically significant but may reflect her asthma, a low-grade environmental allergy, or the immune activation seen in the rest of the results. It does not require investigation on its own.","low_causes":"Immune deficiency","high_causes":"Allergies, asthma, eczema, parasitic infection, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"5","within_normal":"TRUE","within_optimal":"","result_position":"0.1786","lower_normal":"0","upper_normal":"14","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"","units":"IU/mL","description":"Rheumatoid factor is an antibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. At 5, this is well below the upper limit of 14 and is negative. Given her mother had rheumatoid arthritis and she experiences joint pain and stiffness, a negative rheumatoid factor makes rheumatoid arthritis unlikely as a cause of her symptoms. It does not exclude it entirely, as a small proportion of people with rheumatoid arthritis are seronegative, but it is a reassuring finding.","low_causes":"","high_causes":"Rheumatoid arthritis, other autoimmune diseases, chronic infection","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.34","within_normal":"TRUE","within_optimal":"","result_position":"0.0236","lower_normal":"0","upper_normal":"7.19","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"","units":"CU","description":"Tissue transglutaminase IgA is the screening test for coeliac disease, an autoimmune condition where gluten triggers the immune system to attack the gut lining. At 0.34, this is negative and well below the upper limit of 7.19. Her IgA level is within range, which means this negative result is reliable. Coeliac disease is very unlikely as a cause of her IBS symptoms.","low_causes":"","high_causes":"Coeliac disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"2.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8582","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4752","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals. At 2.04, this is above the upper limit of 1.77, which is driven by supplementation with a multivitamin and vitamin D. An elevated TAA from supplementation is not a concern and simply reflects that antioxidant intake from supplements exceeds what the blood typically contains.","low_causes":"Poor diet, oxidative stress, chronic disease","high_causes":"Supplementation, antioxidant-rich diet, uric acid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"744","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7543","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3717","upper_optimal_position":"0.6179","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling through the day. At 744, this is above the morning reference range of 145.4 to 619.4. The combined pill increases cortisol binding globulin, a transport protein in the blood, which raises the total cortisol reading without necessarily increasing the active, free cortisol. This is the most likely explanation. However, given her stress pattern, fatigue and the fibromyalgia diagnosis, it is worth mentioning to the GP alongside the other hormonal findings from the pill.","low_causes":"Adrenal insufficiency, pituitary disease","high_causes":"Combined pill (increased CBG), stress, Cushing's syndrome, steroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"< 43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3125","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"100","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3540","upper_optimal_position":"0.5726","units":"pmol/L","description":"Oestradiol is the main form of oestrogen produced by the ovaries. At below 43, this is below the follicular phase range of 71.6 to 529.2. However, she is on the combined pill, which suppresses the ovaries' natural oestrogen production and replaces it with a synthetic oestrogen called ethinylestradiol, which this blood test does not measure. A low oestradiol on the combined pill is expected and does not indicate oestrogen deficiency. The synthetic oestrogen from the pill is providing oestrogen activity even though it does not appear in this test.","low_causes":"Combined pill (expected), menopause, premature ovarian insufficiency, low body weight","high_causes":"Ovulation, PCOS, obesity, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.9","within_normal":"TRUE","within_optimal":"","result_position":"0.1011","lower_normal":"0","upper_normal":"4.45","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is the hormone produced by the ovaries after ovulation to prepare the uterine lining for pregnancy. At 0.9, this is within the follicular phase range of 0 to 4.45. On the combined pill, ovulation is suppressed, so progesterone remains at a low, follicular-phase level. This is expected and not a concern.","low_causes":"Combined pill (expected), anovulation, menopause","high_causes":"Pregnancy, ovulation, luteal phase, progesterone therapy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"< 0.07","within_normal":"TRUE","within_optimal":"","result_position":"0.0063","lower_normal":"0","upper_normal":"5.6","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"","units":"mIU/mL","description":"LH, luteinising hormone, is produced by the pituitary gland and triggers ovulation and hormone production by the ovaries. At below 0.07, this is fully suppressed, which is expected and intended on the combined pill. The pill's synthetic hormones tell the pituitary there is no need to stimulate the ovaries, so LH drops to near zero.","low_causes":"Combined pill (expected), pituitary disease, stress, low body weight","high_causes":"Ovulation, PCOS, menopause","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"0.9","within_normal":"TRUE","within_optimal":"","result_position":"0.0441","lower_normal":"0","upper_normal":"10.2","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"","units":"mIU/mL","description":"FSH, follicle stimulating hormone, is produced by the pituitary gland and stimulates the ovaries to develop eggs. At 0.9, this is low, which is expected and intended on the combined pill. Like LH, FSH is suppressed because the pill's synthetic hormones signal the pituitary that no further stimulation is needed.","low_causes":"Combined pill (expected), pituitary disease, stress","high_causes":"Menopause, premature ovarian insufficiency, ovarian failure","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6032","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and is important for energy, mood, libido, muscle maintenance and bone density. At 0.5, this sits right on the lower limit of the laboratory range and below the optimal floor of 0.8. When combined with the very high SHBG above 180 (driven by the combined pill), almost all of this small amount of testosterone is bound and unavailable to tissues. Very low free testosterone is associated with fatigue, brain fog, low libido, difficulty building muscle and low mood.","low_causes":"Combined pill (via elevated SHBG), adrenal insufficiency, ageing","high_causes":"PCOS, adrenal hyperplasia, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"0.28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3211","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The free androgen index estimates the proportion of testosterone that is free and active, calculated from total testosterone and SHBG. At 0.28, this is below the lower limit of 0.5 and well below the optimal floor of 1.0. The very high SHBG (above 180) driven by the combined pill is binding almost all available testosterone, leaving virtually none free. This is the mechanism behind many of her symptoms: when free androgens are this low, energy, cognition, muscle maintenance and libido can all be affected.","low_causes":"Combined pill (elevated SHBG), hyperthyroidism","high_causes":"PCOS, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3935","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4029","upper_optimal_position":"0.5736","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. At 2.2 umol/L, this is within the laboratory range but below the optimal floor of 2.5. DHEA-S declines naturally with age, and at 44 this is within the expected range. It is the raw material the body uses to make testosterone, and with total testosterone already at the floor of range, a below-optimal DHEA-S means the supply chain is running lean.","low_causes":"Ageing, adrenal insufficiency, chronic illness, stress","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"237","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4393","lower_normal":"59","upper_normal":"619","lower_optimal":"100","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3577","upper_optimal_position":"0.5958","units":"uIU/mL","description":"Prolactin is a hormone primarily associated with milk production but also involved in immune regulation and reproductive function. At 237, this is within the ideal range for a non-pregnant woman. SSRIs can raise prolactin, so a normal level while on an SSRI is a positive finding.","low_causes":"","high_causes":"SSRIs, pituitary tumour, pregnancy, hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"> 180","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7625","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3677","upper_optimal_position":"0.5933","units":"nmol/L","description":"SHBG, sex hormone binding globulin, is a protein produced by the liver that binds sex hormones, particularly testosterone, and carries them in the blood. The more SHBG, the less free testosterone is available to act on tissues. At above 180, this is well above the upper limit of 146. The combined pill is the strongest single driver of elevated SHBG in women, because the synthetic oestrogen it delivers stimulates the liver to produce large amounts. This very high SHBG is the mechanism behind the below-range free testosterone of 0.003 and the below-range free androgen index of 0.28. It may also be binding some of the DHEA-S, further reducing the androgen supply.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS","high_causes":"Combined pill, hyperthyroidism, ageing, liver disease, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.003","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3236","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5972","units":"nmol/L","description":"Free testosterone is the fraction of total testosterone not bound to proteins, making it available to enter cells and exert its effects. At 0.003, this is below the lower limit of 0.01 and well below the optimal floor of 0.02. With SHBG above 180, the overwhelming majority of her already-low total testosterone of 0.5 is being bound and rendered inactive. This is the most direct measure of how much testosterone is actually available to her tissues, and at this level it is virtually absent. This may be contributing significantly to her fatigue, brain fog, joint stiffness, low mood and difficulty recovering from activity.","low_causes":"Combined pill (elevated SHBG), low total testosterone","high_causes":"PCOS, obesity, excess testosterone production","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone is the fraction that is either free or loosely bound to albumin, both of which can enter cells and exert effects. It excludes testosterone tightly bound to SHBG. At 0.05, this sits right on the floor of the reference range and well below the optimal floor of 0.12. With SHBG above 180, virtually all testosterone is tightly bound and unavailable. This confirms the picture from the free testosterone and the free androgen index: almost no testosterone is reaching her tissues.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"0.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol that is free and active. At 0.24, this is very low, which is expected on the combined pill because the pill suppresses natural oestradiol production and the synthetic oestrogen it provides is not measured by this test. This is reported for context.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"urineph","name":"Urine pH","group":"URINALYSIS","result":"5","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH measures the acidity of the urine. At 5, this is on the acidic side of the normal range of 4.5 to 8, which is typical and varies with diet and hydration.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineprotein","name":"Urine Protein","group":"URI
