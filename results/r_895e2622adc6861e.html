<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Emma Ingham","dob":"27/01/1982","report_date":"2026-11-06","summary":"Customer is a 44-year-old female following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are about average (volume 5 out of 10). She trains twice a week, one cardio and one resistance session at moderate intensity, with 2,000 to 5,000 daily steps. She sleeps eight or more hours but is slow to get going on waking, with an afternoon energy crash. Stress feels hard to manage some weeks. She does not drink alcohol. She uses prescribed THC therapy three to four times a week before bed for fibromyalgia. She takes an SSRI, the combined pill, a GLP-1 receptor agonist, and a proton pump inhibitor. She supplements with a multivitamin, magnesium and vitamin D. She has been diagnosed with fibromyalgia, chronic fatigue syndrome, IBS, major depressive disorder, anxiety disorder, asthma and acne vulgaris. Her symptoms are low energy and fatigue, brain fog, skin breakouts, and joint pain and stiffness, and she reports these have always been present. Her family history is significant: her mother had rheumatoid arthritis and osteoporosis and died at 59 from bowel cancer involving a hereditary gene, her father died at 65 from coronary heart disease and had Meige syndrome, and there is a family history of autoimmune disease. Her goals are to balance her hormones, improve her energy levels and improve her long-term health.\n\nThe most important finding in this report is that her thyroid peroxidase antibodies are above 400, which is more than 29 times the upper limit of 13.8, and this needs to go to her GP promptly. Thyroid peroxidase, or TPO, is an enzyme the thyroid gland uses to make thyroid hormones. When the immune system produces antibodies against it, the resulting inflammation gradually damages the gland's ability to produce hormones. This pattern is strongly associated with a condition called Hashimoto's thyroiditis, the most common cause of underactive thyroid. Her TSH, thyroid stimulating hormone, which is the signal the brain sends to tell the thyroid to work harder, is 3.5, and while that sits within the laboratory range of 0.55 to 4.78, it is above the optimal band of 1.0 to 2.5, which suggests the brain is already having to push the thyroid to maintain output. Her free T4, the main hormone the thyroid produces, is 13.2, sitting near the bottom of the laboratory range and below the optimal band of 14 to 20. Her free T3, the active form the body converts T4 into, is 4.4, just below the optimal band of 4.5 to 6.5. The thyroglobulin antibody, the other antibody tested, is 2.8, which is negative and below the 4.4 threshold. So the picture is one antibody massively positive, the other negative, with the gland just about keeping up but already showing signs of strain. This is important because an underactive thyroid can cause or worsen virtually every symptom she reports: fatigue, brain fog, joint stiffness, low mood, skin problems and difficulty with energy. It can also slow the clearance of cholesterol from the blood, which is relevant to her lipid results below. Given her family history of autoimmune disease and the strength of this antibody result, the GP should be aware of this finding and may wish to monitor TSH and free T4 at intervals or refer to endocrinology. This is not something to panic about, but it is the finding in this report that most directly connects to how she feels and it deserves medical attention.\n\nHer ESR, erythrocyte sedimentation rate, a measure of how quickly red blood cells settle in a tube and a broad marker of inflammation, is 40, more than three times the upper limit of 12. Her high-sensitivity CRP, another inflammatory marker that measures a protein the liver produces in response to inflammation, is 11, more than double the upper limit of 5 and well above the ideal of below 1.0. These two markers together confirm that there is a significant inflammatory process happening somewhere in the body. The combined pill is known to raise both ESR and CRP and may be contributing, but results this high should be reviewed by her GP in their own right rather than put down to the pill. Fibromyalgia itself does not typically raise inflammatory markers to this degree, but chronic fatigue syndrome can involve low-grade immune activation, and the very high TPO antibodies point to autoimmune thyroid inflammation as another contributor. The elevated globulin of 38, above the upper limit of 36, supports the picture of immune activation, because globulins include the immunoglobulins and other proteins the body produces when the immune system is working hard. Her IgE, the immunoglobulin associated with allergic responses, is 101, marginally above the upper limit of 100, which may reflect her asthma or a low-grade allergic tendency but at this margin is not a concern on its own. The GP should review and repeat the ESR and CRP and decide whether any further investigation is needed, bearing in mind the combined pill and the autoimmune thyroid picture.\n\nTurning to the positives, and there are genuine ones here. Her PhenoAge, a composite biological ageing score built from nine blood markers, is 38.1 against her calendar age of 44, meaning her blood work ages her nearly six years younger than she is. That is a strong result and suggests that despite her symptoms, the body is managing its core functions well. Her blood sugar control is excellent: fasting glucose is 4.9, within the ideal range of 4.0 to 5.4, and her HbA1c, a measure of average blood sugar over the past three months, is 34 mmol/mol, below the ideal ceiling of 36 and well below the pre-diabetes threshold of 42. This is particularly reassuring given that she is on a GLP-1 receptor agonist, which is clearly doing its job. Her liver is in very good health. ALT at 19 is below the optimal ceiling of 25, and GGT at 13 is well below the optimal ceiling of 25, which together mean the liver is under no metabolic strain. Her bilirubin, alkaline phosphatase and FIB-4 fibrosis score are all healthy, and the APRI score of 0.183 makes significant liver scarring very unlikely. Her kidney function is adequate, with a combined eGFR from creatinine and cystatin C of 82, which is above the lower limit of 60 but below the ideal of 90. At 44, this is worth noting but not a concern on its own. Her full blood count is healthy across the board: haemoglobin at 132, white cells at 6.56, platelets at 315, and all the differential counts sitting comfortably within range. Her vitamin B12 at 605 is within the optimal band of 500 to 900, and her folate at 11 is above the optimal floor of 8, both reassuring given that she takes a proton pump inhibitor, which can impair absorption of B12 over time. Her vitamin D at 87 is above the sufficient threshold of 50 and within the optimal band of 75 to 120, which shows her supplementation is working. Calcium and corrected calcium are both healthy, and her PTH at 3.3 is within range, confirming the calcium and vitamin D system is in balance. Magnesium at 0.88 is within the optimal band of 0.85 to 1.05, supported by her supplementation. Her tumour markers are all reassuringly low: CA125 at 7.4, CA15-3 at 8, CA19-9 below 1.2, and CEA below 0.5, all well within their respective limits. Given her family history of bowel cancer with a hereditary gene, the clean CEA and CA19-9 are particularly worth noting, though these markers are screening tools, not diagnostic tests, and do not replace the bowel screening programme. Her rheumatoid factor at 5, well below the upper limit of 14, and her tissue transglutaminase IgA, which is the coeliac screening test, being negative, are both useful negatives given her joint symptoms and IBS diagnosis. Her Lp(a), lipoprotein(a), a genetically determined particle that carries cholesterol and promotes clotting, is below 25 nmol/L, which is below the ideal ceiling of 32 and is genuinely good news. Because Lp(a) is inherited and cannot be changed by diet or exercise, knowing it is low means that any elevated cholesterol is driven entirely by modifiable factors.\n\nHer insulin, however, tells a different story from her glucose. Fasting insulin is 17.51, within the laboratory range of 2.6 to 24.9 but well above the optimal ceiling of 8. Her HOMA-IR, a calculation that combines fasting glucose and insulin to estimate insulin resistance, is 3.81, above both the upper limit of 1.5 and the threshold of 2.9 that indicates significant insulin resistance. Her C-peptide, a molecule released alongside insulin that confirms the pancreas is genuinely producing that much insulin, is 2.5 ug/L, within range. The TyG index, another insulin resistance marker built from triglycerides and glucose, is 8.91, above the upper limit of 8.8. So the glucose looks excellent because the pancreas is working very hard to keep it there, producing roughly double the ideal amount of insulin to do so. The GLP-1 medication is almost certainly helping, and without it the picture may have been worse. The combined pill can also worsen insulin resistance. This is not diabetes, and with the GLP-1 on board the glucose is beautifully controlled, but the underlying insulin resistance is a metabolic finding that diet and movement can improve further. The afternoon energy crash she describes is a classic symptom of insulin resistance: the large insulin output after a meal overshoots, blood sugar dips, and energy drops.\n\nHer lipid profile is mixed. Total cholesterol at 5.2 is marginally above the desirable ceiling of 5.18, and her ApoB, apolipoprotein B, which counts the actual number of cholesterol-carrying particles in the blood and is the best single predictor of cardiovascular risk, is 0.99, above the desirable ceiling of 0.9 and above the optimal target of below 0.8. Her LDL cholesterol at 2.28 is within range and below the optimal ceiling of 2.6, and her Lp(a)-corrected LDL, which removes the inherited component, is 2.2, confirming most of her LDL is modifiable. Her HDL at 2.2 is excellent, well above the optimal threshold of 1.6 for women, and her ApoA1 at 2.53 is strong. The ApoB to ApoA1 ratio at 0.39 is well below the lower-risk ceiling of 0.6, which is reassuring. Her triglycerides at 1.89 are above the ideal of below 1.0, and her VLDL at 0.86 is above the upper limit of 0.78. The combined pill is a well-recognised driver of raised triglycerides, and insulin resistance compounds this because insulin stimulates the liver to produce VLDL particles. Her cardiovascular risk score, a TrueVitals index from 0 to 100 that measures the risk being built from lipid, inflammatory and metabolic markers, is 50, above the flagged threshold of 40. This score carries no age adjustment, so it reflects the risk being accumulated rather than the probability of an event in the next ten years, which at 44 remains low. Given her father's death from coronary heart disease at 65, this is a number to take seriously and to improve. The ApoB and triglycerides are the modifiable components, and both will respond to dietary change and to addressing the insulin resistance.\n\nHer hormone profile is heavily shaped by the combined pill, and the results need to be read through that lens. The combined pill delivers synthetic oestrogen and progesterone, which suppresses the brain's signals to the ovaries. Her LH at below 0.07 and FSH at 0.9 confirm that suppression is complete. Her oestradiol at below 43 pmol/L is below the follicular range, which is expected on the combined pill because the pill replaces natural oestrogen with its synthetic equivalent, ethinylestradiol, which the blood test does not measure. Her progesterone at 0.9 is consistent with suppressed ovarian function on the pill. Her SHBG, sex hormone binding globulin, is above 180, well above the upper limit of 146. The combined pill is the most potent driver of SHBG elevation in women, because the synthetic oestrogen it delivers stimulates the liver to produce large amounts of SHBG. SHBG binds testosterone, and with SHBG this high, her free testosterone is just 0.003 nmol/L, below the lower limit of 0.01, and her free androgen index is 0.28, below the lower limit of 0.5. Her total testosterone at 0.5 sits on the very floor of the range. Bioavailable testosterone is 0.05, on the floor of its range. Very low free testosterone in women is associated with reduced libido, fatigue, difficulty building and maintaining muscle, brain fog and low mood, several of which she reports. The combined pill is the mechanism: it drives SHBG up, which traps the small amount of testosterone women produce, leaving almost none free to act on tissues. This does not mean the pill is wrong for her, but it does mean the GP should know, particularly because her symptoms of fatigue, brain fog and joint stiffness may be partly driven by this hormonal picture. Her cortisol at 744 is above the morning reference range of 145.4 to 619.4. The combined pill also raises cortisol binding globulin, which increases total cortisol in the blood without necessarily increasing the active, free cortisol. So the elevated number is most likely a pill-driven artefact rather than a sign of excess cortisol production, but given her stress pattern and fatigue, it is worth mentioning to the GP.\n\nHer iron studies show a pattern that needs attention. Ferritin, the body's iron store, is 42, within range and just above the optimal floor of 40 to 150 for women. Serum iron at 16.3 is within range. But her transferrin, the protein that carries iron in the blood, is 3.88, marginally above the upper limit of 3.8, and her total iron binding capacity is 80.9, above the upper limit of 76.1. Transferrin saturation, which shows what proportion of the carrying capacity is actually loaded with iron, is 16.73%, below the lower limit of 18% and below the optimal floor of 25%. This pattern, high carrying capacity with low saturation, means the body is reaching for more iron than it is getting. Menstrual losses on the combined pill are typically lighter, so the driver here is more likely dietary: with 0 to 1 portions of vegetables and fruit a day, the diet is likely low in both haem iron from red meat and the vitamin C that helps absorb non-haem iron. The proton pump inhibitor she takes also reduces stomach acid, which impairs iron absorption. Iron is needed to make haemoglobin, and while her haemoglobin at 132 is currently fine, the stores are not building and the body is clearly signalling that it wants more. Low iron can contribute to fatigue, brain fog and poor exercise recovery, all symptoms she reports.\n\nHer lipase at 69 is above the upper limit of 60. Lipase is an enzyme produced by the pancreas to digest fat. A mild elevation like this, just 15% above the limit, does not suggest pancreatitis, which typically produces lipase levels three or more times the upper limit. GLP-1 receptor agonists can raise lipase mildly as a known side effect, and this is the most likely explanation. It is worth mentioning to the GP but is not a concern at this level provided she has no persistent abdominal pain.\n\nHer urine shows white blood cells at 40, above the significance threshold of 10, with nitrites negative. This pattern can indicate a low-grade urinary tract infection, inflammation of the urinary tract, or vaginal contamination of the sample. In the absence of urinary symptoms such as burning, frequency or urgency, the most practical step is a repeat midstream sample with her GP if symptoms develop.\n\nHer total antioxidant activity at 2.04 is above the upper limit of 1.77, which is driven by her multivitamin and vitamin D supplementation and is not a concern.\n\nHer creatine kinase at 111 is healthy, her amylase at 105 is within range, and her prolactin at 237 is within the non-pregnant range. Her DHEA-S at 2.2 umol/L is within range. Her uric acid at 203 is within range though close to the lower limit of 184.\n\nTo summarise, the findings that matter most here are the very high TPO antibodies with a thyroid that is beginning to show strain, the significant insulin resistance despite excellent glucose control, the inflammatory markers that are elevated and need interpreting in the context of the pill and the autoimmune thyroid picture, the very low free testosterone driven by the pill, and the early iron depletion. Many of these overlap with her symptoms of fatigue, brain fog, joint pain and afternoon crashes, and several are modifiable. The plan below focuses on the dietary changes that will address the insulin resistance and iron stores, the GP conversations that will address the thyroid and hormonal picture, and the supplementation that will support recovery.","links":"The thread running through this report is that three separate processes are converging on the same set of symptoms. The first is autoimmune thyroid inflammation. TPO antibodies above 400 confirm the immune system is attacking the thyroid gland. The gland is still producing enough hormone to keep the blood levels within the laboratory range, but TSH is already drifting above optimal at 3.5 and free T4 at 13.2 is near the floor, which means the brain is having to push harder to maintain output. Hashimoto's thyroiditis is a slow process, and this is likely early in its course, but it explains fatigue, brain fog, joint stiffness, low mood and the general sense of not feeling well that she describes.\n\nThe second process is the metabolic effect of the combined pill. The pill drives SHBG above 180, which traps virtually all of her testosterone, leaving free testosterone at 0.003 and the free androgen index at 0.28, both well below range. It raises cortisol binding globulin, inflating cortisol to 744. It raises ESR and CRP, contributing to the inflammatory picture. And it raises triglycerides, which alongside the insulin resistance pushes VLDL above range and contributes to the elevated ApoB. The pill is doing what pills do, but the downstream effects on her hormones, inflammation and lipids are significant and are almost certainly contributing to her symptom burden.\n\nThe third process is insulin resistance. HOMA-IR at 3.81 confirms the pancreas is producing roughly double the ideal amount of insulin to keep glucose at 4.9. The GLP-1 medication is helping, and the glucose control it achieves is excellent, but the underlying resistance persists. Insulin resistance drives afternoon energy crashes, because the large insulin spike after a meal overshoots and glucose dips. It drives triglyceride production in the liver, which is why VLDL is elevated. And it creates a metabolic environment that promotes inflammation, which compounds the ESR and CRP picture.\n\nWhat was excluded matters too. Rheumatoid factor is negative, which makes rheumatoid arthritis unlikely despite her mother's history. Coeliac disease is excluded by the negative tissue transglutaminase. Liver disease is excluded by clean ALT, GGT, FIB-4 and APRI. Kidney function is adequate. The full blood count is healthy. Tumour markers are all reassuringly low. B12 and folate are both good despite the PPI. These negatives are genuinely useful because they narrow the field to the three processes above.\n\nThe loose end is the iron picture. Transferrin saturation at 16.73% below range, with elevated transferrin and iron binding capacity, means the body is reaching for iron it is not getting. The PPI impairs iron absorption, the diet is very low in fruit and vegetables (and likely in iron-rich foods), and ferritin at 42 is functional but not building a buffer. This is not anaemia, but it is early depletion, and it contributes to fatigue and poor recovery in someone with fibromyalgia and CFS.\n\nThe cardiovascular risk score of 50 is driven primarily by the ApoB of 0.99, the CRP of 11, the triglycerides of 1.89 and the HbA1c contributing a small amount. Given her father's death from coronary heart disease at 65, this score is important. The encouraging news is that nearly every driver is modifiable: ApoB will respond to dietary changes and potentially to thyroid treatment if hypothyroidism is confirmed, CRP will fall substantially if the pill is ever changed, triglycerides will improve with insulin resistance and diet, and the Lp(a) below 25 means there is no inherited component working against her.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, chicken, fish, beans or lentils. Anchor: protein goes on the plate before anything else. Why: protein slows the glucose spike that is driving your fasting insulin of 17.51 and your afternoon energy crash, and it supports muscle that your very low free testosterone of 0.003 is making harder to maintain.\nSwap white bread, pastry, cereal and sugary snacks for oats, rye bread, sweet potato or wholegrain alternatives, one meal at a time, starting with whatever you eat most often. Why: slower carbohydrates reduce the insulin demand behind your HOMA-IR of 3.81 and will lower your triglycerides of 1.89.\nAdd one extra portion of vegetables or fruit to every meal you already eat, building from your current 0 to 1 portions a day toward 5. Anchor: add them to whatever is already on the plate. Why: vegetables provide the fibre that slows glucose absorption, the vitamin C that helps your body absorb iron (your transferrin saturation is below range at 16.73%), and the folate and antioxidants that support long-term health.\nInclude iron-rich foods three to four times a week: red meat, liver, lentils, chickpeas, dark leafy greens, or fortified cereals. Pair them with a source of vitamin C such as peppers, tomatoes or citrus. Why: your iron stores are modest at 42 and your body is actively reaching for more iron, shown by your transferrin saturation of 16.73%.\nWalk for 15 minutes immediately after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal, directly addressing the insulin resistance behind your HOMA-IR of 3.81 and your afternoon crash.\nAdd one more resistance training session per week, building to two sessions, keeping intensity moderate and allowing a full rest day between sessions given your fibromyalgia. Why: resistance training improves insulin sensitivity more effectively than any supplement can, and it protects bone density, which matters given your family history of osteoporosis.\nSet a fixed caffeine cut-off at midday if you drink coffee or tea in the afternoon. Anchor: after lunch, switch to herbal tea or water. Why: caffeine after midday delays sleep onset even when you feel tired, and your pattern of sleeping 8 hours but waking slow to get going suggests sleep quality rather than quantity is the issue.\nGet outside within 30 minutes of waking, even for five minutes. Anchor: before you check your phone. Why: morning light resets the cortisol rhythm, which helps shift your energy from slow mornings and afternoon crashes toward a steadier pattern through the day.","flags":"TPO antibodies above 400, more than 29 times the upper limit of 13.8, with TSH at 3.5 (above optimal), FT4 at 13.2 (below optimal) and FT3 at 4.4 (below optimal). This pattern is strongly associated with Hashimoto's thyroiditis. The thyroglobulin antibody is negative at 2.8. GP review is recommended, with consideration of monitoring or endocrinology referral, particularly given the family history of autoimmune disease and the symptom overlap with fatigue, brain fog and joint pain.\nESR 40 (upper limit 12) and hs-CRP 11 (upper limit 5, optimal below 1.0). Significant inflammation that needs GP review in its own right. The combined pill and the autoimmune thyroid inflammation may both contribute, but the GP should repeat these and decide whether further investigation is needed.\nHOMA-IR 3.81 (upper limit 1.5), fasting insulin 17.51 (optimal below 8), TyG index 8.91 (upper limit 8.8). Significant insulin resistance with excellent glucose control (glucose 4.9, HbA1c 34). The GLP-1 medication is helping, but the underlying resistance is present and is driving the triglyceride and VLDL elevations. Diet and exercise are the primary levers.\nApoB 0.99 (desirable below 0.9, optimal below 0.8), total cholesterol 5.2, triglycerides 1.89 (optimal below 1.0), VLDL 0.86 (upper limit 0.78). Cardiovascular risk score 50 out of 100. The combined pill and insulin resistance are the main drivers. HDL at 2.2 and ApoB:ApoA1 ratio at 0.39 are strongly protective. Lp(a) below 25 confirms no inherited lipid component. Father died of coronary heart disease at 65, making this finding particularly relevant.\nSHBG above 180 (upper limit 146), free testosterone 0.003 (lower limit 0.01), free androgen index 0.28 (lower limit 0.5), total testosterone 0.5 (floor of range), bioavailable testosterone 0.05 (floor of range). The combined pill is the primary driver of the very high SHBG, which is binding virtually all available testosterone. This may be contributing to fatigue, brain fog, low mood and difficulty with muscle maintenance. GP should be aware.\nCortisol 744 (morning reference 145 to 619). Most likely elevated due to increased cortisol binding globulin from the combined pill, which raises total cortisol without necessarily increasing free cortisol. Worth mentioning to the GP alongside the SHBG finding.\nOestradiol below 43, LH below 0.07, FSH 0.9, progesterone 0.9. All consistent with ovarian suppression from the combined pill. The blood test does not measure the synthetic oestrogen the pill provides, so low oestradiol is expected and does not indicate deficiency.\nTransferrin saturation 16.73% (lower limit 18%, optimal 25 to 40%), transferrin 3.88 (upper limit 3.8), TIBC 80.9 (upper limit 76.1), ferritin 42 (optimal 40 to 150). Early iron depletion pattern with the body upregulating its iron-carrying capacity. The PPI impairs iron absorption and the diet is very low in fruit, vegetables and likely iron-rich foods. Not yet anaemia, but intervention is needed.\nGlobulin 38 (upper limit 36). Mildly elevated, consistent with the immune activation seen in the high TPO antibodies and the inflammatory markers. The individual immunoglobulins IgG, IgM and IgA are all within range.\nIgE 101 (upper limit 100). Marginally above range. May reflect her asthma or a low-grade allergic tendency. Not a concern at this margin.\nLipase 69 (upper limit 60). Mild elevation, 15% above range. GLP-1 receptor agonists are a recognised cause of mildly raised lipase. Not a concern in the absence of abdominal pain, but worth mentioning to the GP.\nUrine WBCs 40 (significance threshold 10), nitrites negative. May indicate a low-grade urinary tract infection, urinary tract inflammation, or sample contamination. Repeat midstream sample with GP if urinary symptoms develop.\nTotal antioxidant activity 2.04 (upper limit 1.77). Driven by supplementation. Not a concern.\nReassuring negatives: rheumatoid factor negative at 5 (mother had rheumatoid arthritis), making rheumatoid arthritis unlikely. Coeliac screen negative. All tumour markers well within range (CEA below 0.5, CA19-9 below 1.2, CA125 7.4, CA15-3 8), which is useful given the family history of bowel cancer. Liver function excellent with no sign of fibrosis. Full blood count healthy. B12 and folate both within optimal ranges despite the PPI. Vitamin D within optimal range. Calcium, PTH and phosphate all healthy. Kidney function adequate. Lp(a) below 25, confirming no inherited lipid risk component.","recommendations":"Discuss the TPO antibody result of above 400 with your GP. This is strongly associated with Hashimoto's thyroiditis, and with TSH already at 3.5 and FT4 at 13.2, the thyroid is beginning to show strain. The GP may wish to monitor TSH and FT4 every six to twelve months or refer to endocrinology, particularly given the family history of autoimmune disease and the overlap with your symptoms of fatigue, brain fog and joint stiffness.\nDiscuss the combined pill's effects on your blood results. It is driving SHBG above 180, which has reduced free testosterone to 0.003 (below range), and may be contributing to the cortisol of 744 and triglycerides of 1.89. Ask the GP to review and repeat the ESR of 40 and CRP of 11 in their own right, rather than putting them down to the pill. This does not mean the pill must be stopped, but the GP should weigh whether a progestogen-only method might achieve the same contraceptive benefit with fewer metabolic effects, particularly given your symptom burden.\nMention the insulin resistance to your GP. HOMA-IR is 3.81 with fasting insulin of 17.51, confirming significant insulin resistance despite excellent glucose control on the GLP-1 medication. The GP can track this at future tests, and the dietary changes below are the primary intervention.\nMention the lipase of 69 as a known GLP-1 side effect. The GP should be aware, and it should be rechecked if abdominal pain develops.\nMention the urine white blood cells of 40 to your GP. A repeat midstream sample is worthwhile if any urinary symptoms develop.\nDiscuss bowel cancer screening with your GP given your mother's death at 59 from bowel cancer involving a hereditary gene. You may be eligible for earlier or more frequent screening, and the GP can advise on whether genetic testing for the familial gene is appropriate.\nAim for at least 75 to 85 grams of protein a day (roughly 1.3 to 1.5 grams per kilogram of body weight), prioritising protein and fibre at every meal to address the insulin resistance. No calorie deficit is advised: at 57 kg and on a GLP-1 medication, eating enough matters more than eating less. Retest in four to six months with a panel that includes fasting insulin, HOMA-IR, HbA1c, TSH, FT4, FT3, full iron studies, CRP, ESR, ApoB and a lipid profile to track the thyroid, the insulin resistance and the lipid changes.","supplementation":"Vitamin D3 (cholecalciferol): continue at 2,000 IU daily, taken with your largest meal that contains fat. Your level at 87 is within the optimal band of 75 to 120, so maintain rather than increase. Why: supports immune regulation, bone density (relevant given your family history of osteoporosis) and mood.\nVitamin K2 (MK-7): 100 mcg daily, taken with your vitamin D. Why: K2 directs calcium into bones and teeth rather than arteries, which matters for both bone health and cardiovascular protection.\nMagnesium glycinate: continue at 300 to 400 mg before bed. Your level at 0.88 is within optimal, so maintain. Why: supports sleep quality, muscle recovery, and may help with the fibromyalgia symptoms.\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides (yours are 1.89, above optimal), reduces inflammation (your CRP is 11), and supports brain function, which is relevant to the brain fog you describe.\nIron (ferrous bisglycinate): 25 mg every other day, taken with a source of vitamin C such as orange juice, at least two hours away from your PPI. Why: your transferrin saturation is 16.73%, below the lower limit, and your ferritin at 42 is functional but not building a buffer. The PPI reduces iron absorption, so the form and timing matter. Take it on an empty stomach or with vitamin C, never with tea, coffee or dairy.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: your B12 at 605 is good, but PPIs impair B12 absorption over time, and sublingual delivery bypasses the stomach acid the PPI is suppressing. This is a protective measure.\nThe most important changes from this report are not supplements. They are adding protein and vegetables to every meal, reducing sugary and processed food, walking after meals, and having the GP conversation about the thyroid antibodies and the combined pill's metabolic effects.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 49.3; held to 49 by two or more systems rated \"See your GP\". Weakest systems: inflammation 3%, hormones 28%, glucose & insulin 33%. Biggest drags: HOMA-IR, High-Sensitivity CRP, Cortisol, Apolipoprotein B.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"38.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3888","lower_normal":"","upper_normal":"49","lower_optimal":"","upper_optimal":"44","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4490","units":"years","description":"PhenoAge is a composite biological ageing score developed by Yale researchers, calculated from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. At 38.1 against a calendar age of 44, this means her blood work ages her nearly six years younger than she is. The CRP of 11 would normally push PhenoAge upward, but the strong glucose, healthy white cell count, good albumin and excellent MCV, RDW and ALP are pulling it back down. This is a genuinely positive result that suggests her core physiology is ageing well despite the chronic conditions and the inflammatory markers.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the risk being built rather than the ten-year probability of an event. At 50, this is above the flagged threshold of 40, driven primarily by the CRP of 11, the ApoB of 0.99 and the triglycerides of 1.89. Because the score has no age term, a 44-year-old's ten-year event risk remains low, but the score reflects the metabolic and inflammatory burden being accumulated. Given her father's death from coronary heart disease at 65, this is a number to take seriously and to track. The CRP is likely inflated by the combined pill, the ApoB and triglycerides are driven by insulin resistance and the pill, and all are modifiable.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","up d sugar has been well controlled over the past three months.","low_causes":"","high_causes":"Sustained high blood sugar, insulin resistance, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"17.51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5562","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone the pancreas produces to move glucose from the blood into cells. A fasting level of 17.51 is within the laboratory range of 2.6 to 24.9 but is more than double the optimal ceiling of 8. This means the pancreas is having to produce a large amount of insulin to keep blood sugar at its current healthy level of 4.9. The higher the insulin needed to maintain normal glucose, the more resistant the cells have become to insulin's signal. The combined pill and insulin resistance are the likely drivers, and the GLP-1 medication is helping, but dietary changes, particularly reducing refined carbohydrates and increasing protein and fibre, are the most effective way to lower insulin demand.","low_causes":"Low carbohydrate diet, high insulin sensitivity, fasting","high_causes":"Insulin resistance, high carbohydrate diet, obesity, combined pill, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4747","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4343","units":"ug/L","description":"C-peptide is a molecule released by the pancreas in equal amounts alongside insulin. It confirms that the insulin in the blood is being produced by the body rather than injected. At 2.5 ug/L, this is within the laboratory range of 1.1 to 4.4, confirming the pancreas is genuinely producing the elevated insulin seen above. The level is above optimal, consistent with the insulin resistance pattern.","low_causes":"Low insulin production, type 1 diabetes, fasting","high_causes":"Insulin resistance, high carbohydrate intake, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"3.81","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting glucose and fasting insulin and estimates how resistant the body's cells are to insulin's signal. At 3.81, this is above the upper limit of 1.5 and well above the threshold of 2.9 that indicates significant insulin resistance. The glucose is excellent at 4.9, but only because the pancreas is producing roughly double the ideal amount of insulin to keep it there. The combined pill, dietary pattern and insulin resistance are the drivers, and the GLP-1 medication is helping. Dietary changes, increased movement and resistance training are the most effective interventions.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, high carbohydrate diet, obesity, combined pill, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE"  that carries oxygen from the lungs to the tissues. At 132, this is within the ideal range for a woman. Despite the early iron depletion pattern seen in the iron studies, haemoglobin has not been affected yet, which means the body is managing to maintain oxygen-carrying capacity.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, high altitude, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures how many red blood cells are in a given volume of blood. At 4.14, this is within the ideal range, confirming healthy red cell production.","low_causes":"Iron deficiency, B12 deficiency, chronic disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.387","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4233","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit measures the proportion of blood that is made up of red blood cells. At 0.387, this is within the ideal range, consistent with the healthy haemoglobin and red cell count.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key
