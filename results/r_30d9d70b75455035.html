const REPORT_DATA = {"patient_name":"Stephen lomax","dob":"29/12/1972","report_date":"2026-10-20","summary":"This is a 53-year-old male presenting with a BMI of 34.7, following a low-carb, high-protein diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are larger than average (volume 7 out of 10). He does no structured cardio or resistance training and takes fewer than 2,000 steps a day. He sleeps under 6 hours, waking exhausted or during the night, and feels tired on waking; stress feels hard to manage some weeks. He does not drink alcohol. He takes levothyroxine 100 micrograms daily (recently reduced from 175 to 200 micrograms on 3 September 2026) and 4 to 6 co-codamol 30/500 tablets daily, which he is trying to reduce. He has diagnosed Hashimoto's hypothyroidism and non-alcoholic fatty liver disease. His family history includes thyroid disease. A previous blood test flagged abnormalities. He reports low energy and fatigue, brain fog, bloating and digestive discomfort, and weight gain with difficulty losing weight, all present for over a year. He also reports frothy urine for 6 to 12 months, bilateral leg swelling for around 20 years, night-time urination, recent flank ache, lumbar spinal stenosis with a bulging disc, right-sided Eagle syndrome, jaw clicking, chronic tinnitus, memory lapses, worsening throat and jaw pain with sharp oesophageal-type spasms, and a recent episode of severe upper abdominal pain with vomiting, shivering, watery diarrhoea and pale stool. His goals are to lose body fat, build muscle, and improve long-term health and longevity.\n\nThe finding that matters most in this report, and the one that should go to his GP first, is that his thyroid is clearly undermedicated. His TSH is 6.39, well above the upper limit of 4.78, meaning the pituitary gland is having to shout louder than it should to get the thyroid to produce enough hormone. This is almost certainly the consequence of the levothyroxine dose being halved from 175 to 200 micrograms down to 100 micrograms seven weeks ago. His thyroid peroxidase antibodies are above 400, massively elevated against a limit of 13.8, and his thyroglobulin antibodies are 5.2 against a limit of 4.4, both positive. This confirms the autoimmune pattern associated with Hashimoto's thyroiditis, which his GP has already diagnosed. In Hashimoto's, the immune system gradually damages the thyroid gland, meaning it relies increasingly on replacement hormone. Cutting that replacement by roughly half has left his body short. The good news within this picture is that his free T4 is 17, comfortably within range, and his free T3, the active hormone that cells actually use, is 5.1, also well within range. This means the thyroid is still converting adequately for now, but the elevated TSH tells us it is being pushed hard to maintain that output, and the cushion is thin. A large part of his fatigue, brain fog, weight gain and difficulty losing weight is very likely driven by this undermedication. Hypothyroidism slows metabolic rate, impairs concentration and memory, promotes fluid retention that contributes to the leg swelling he describes, and makes fat loss markedly harder regardless of diet. It also slows the clearance of LDL cholesterol from the bloodstream, which is directly relevant to his lipid results below. His GP needs to review this dose urgently. The symptoms he described around the dose reduction, the cold sweaty forehead, nausea, and internal tremor, are consistent with the body adjusting to a sudden drop in thyroid hormone.\n\nHis second major finding is insulin resistance. His fasting insulin is 16.32 mIU/L, which is within the laboratory range of 2.6 to 24.9 but well above the optimal ceiling of 8. His HOMA-IR, a calculated index that combines fasting insulin and fasting glucose to estimate how resistant the body's cells are to insulin's signal, is 3.92 against an upper limit of 1.5. The laboratory note classifies anything above 2.9 as significant insulin resistance. His fasting glucose at 5.4 is within the ideal window, and his HbA1c at 39 mmol/mol (5.7%) is within the laboratory's normal range of below 42, so his blood sugar control has not tipped into pre-diabetes. But the insulin required to hold that glucose steady is roughly four times what an insulin-sensitive person would need. His TyG index, another measure of metabolic health built from triglycerides and glucose, is 9.9 against an upper limit of 8.8, reinforcing the same message. His C-peptide at 1.65 micrograms per litre (546 pmol/L) confirms the pancreas is producing insulin vigorously. This is the classic metabolic pattern of someone carrying significant visceral fat at a BMI of 34.7 with very low physical activity: the pancreas is working overtime to keep glucose in check, but the cells are becoming deaf to its signal. Left unchecked, this pattern progresses toward type 2 diabetes. His family history of type 2 diabetes makes this more urgent. The encouraging part is that insulin resistance is one of the most responsive findings in medicine to lifestyle change, specifically to increased movement, reduced refined carbohydrate, and gradual weight loss.\n\nHis lipid panel is significantly abnormal and is the third area his GP should review. His triglycerides are 4.64 mmol/L, nearly three times the fasting limit of 1.70. This is improved from 6.6 non-fasting in November 2025 and 3.3 fasting in May 2026, but it remains markedly elevated. Triglycerides are the fat the liver packages into particles for transport; when insulin resistance is present, the liver overproduces them. His VLDL, the lipoprotein that carries most of those triglycerides, is 2.11 against an upper limit of 0.78. His total cholesterol is 6.6 mmol/L against a desirable ceiling of 5.18. His HDL cholesterol, the protective fraction that removes cholesterol from artery walls and returns it to the liver, is 1.0, sitting right at the boundary of low risk at his sex, and well below the optimal level of 1.4. His non-HDL cholesterol, which captures all the atherogenic particles in one number, is 5.6 against a limit of 4.0. The laboratory was unable to calculate his LDL directly because the triglycerides are too high for the standard formula, but his ApoB, which counts every atherogenic particle regardless of size, is 0.95 against a target of below 0.9 and an optimal target of below 0.8. His ApoB to ApoA1 ratio is 0.65, which is below the 0.7 lower-risk threshold, and his ApoA1 at 1.46 is healthy, which provides some reassurance that the balance between harmful and protective particles is not as unfavourable as the raw cholesterol numbers suggest. His Lp(a) is below 25 nmol/L, well under the 32 threshold. Lp(a) is an inherited lipoprotein particle that deposits cholesterol, encourages clotting, and drives inflammation in artery walls. It cannot be changed by diet, exercise or medication, and once measured it goes on the permanent medical record. His being low is genuinely useful information because it means the entire lipid picture is driven by modifiable factors, specifically the insulin resistance, the weight, and the inactivity, rather than by an inherited particle he cannot change. The atherogenic index of plasma at 0.667, well above the 0.21 limit, summarises the metabolic dyslipidaemia pattern: high triglycerides, low HDL, small dense LDL particles. This is the lipid signature of insulin resistance, and it will improve substantially as insulin sensitivity improves. His cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 85 out of 100, which is flagged (above 40). It is driven primarily by the triglycerides, the low HDL and the ApoB, and will respond to the same interventions.\n\nHis hsCRP, which is high-sensitivity C-reactive protein, a marker of systemic inflammation produced by the liver, is 4.3 against an upper limit of 5 and an optimal target of below 1.0. At a BMI of 34.7 with insulin resistance and NAFLD, visceral fat is the most likely source of this low-grade inflammation. Visceral fat is metabolically active tissue that continuously releases inflammatory signals. An hsCRP at this level roughly doubles cardiovascular risk independent of cholesterol. His ESR, erythrocyte sedimentation rate, another inflammation marker that measures how quickly red blood cells settle in a tube, is 14 against an upper limit of 12, mildly elevated and consistent with the same chronic inflammatory state. However, his systemic immune-inflammation index at 208 and his platelet-to-lymphocyte ratio at 92.7 are both comfortably within their optimal ranges, which tells us there is no acute inflammatory process and no suggestion of anything more sinister driving the inflammation.\n\nHis testosterone is 7.7 nmol/L, below the laboratory lower limit of 8.4 and well below the recommended level of 12 and the optimal floor of 18. Testosterone is the primary male sex hormone; it drives energy, mood, motivation, muscle maintenance, fat distribution, libido and bone density. At 53 with a BMI of 34.7, very low activity, significant insulin resistance, and an undermedicated thyroid, multiple factors are suppressing it simultaneously. Excess body fat contains an enzyme called aromatase that converts testosterone into oestradiol; his oestradiol at 83 pmol/L is within range but sitting at a level consistent with significant aromatisation. His SHBG, sex hormone binding globulin, the protein that carries testosterone in the blood and determines how much is free and available, is 21.3, within range but toward the lower end. Insulin resistance directly suppresses SHBG, which paradoxically means more testosterone is free in the short term but overall production falls. His free testosterone at 0.186 nmol/L is within the laboratory range, and his bioavailable testosterone at 4.36 is within the optimal band, which tells us that what little testosterone he is making is at least reaching the tissues. His free androgen index at 36.15 is within range. His LH at 3.75 and FSH at 3.37 are both within their normal ranges, which means the pituitary gland is not compensating by increasing its signal to the testes, and this is a pattern that can be seen when obesity and illness suppress the hypothalamic-pituitary axis itself. His progesterone at 0.66 is below the male range of 0.89 to 3.88, but progesterone in men is a minor finding and does not require action on its own. His DHEA-S at 2 micromoles per litre (737 micrograms per decilitre) is within range and healthy for 53. His cortisol at 472 nmol/L is within the morning reference range and does not suggest adrenal dysfunction, though it sits at the higher end, which is consistent with the chronic pain, poor sleep and stress he reports. His prolactin at 224 is within range, which is reassuring because prolactin elevation from medication can suppress testosterone further. He should discuss the low testosterone with his GP. Addressing the thyroid, reducing weight, and beginning even modest physical activity may improve it meaningfully, but if it remains below range after those changes, further investigation with a repeat morning sample and consideration of replacement would be appropriate.\n\nTurning to the positives. His kidney function, which he was rightly concerned about given the frothy urine, leg swelling and flank ache, is reassuring on this panel. His creatinine-based eGFR is above 90. His Cystatin C, a more reliable marker of kidney filtration than creatinine because it is not affected by muscle mass, is 1.07 against a limit of 1.1, giving a cystatin C eGFR of 86. The combined creatinine and cystatin C eGFR is also 86, which sits just below the optimal threshold of 90 but is a reasonable result at 53 and is consistent with his previous eGFR of 85 in February, meaning kidney function is stable. His urea at 7.1 and urea-to-creatinine ratio at 86.6 are both within range. His urinalysis is entirely clean: no protein, no glucose, no blood, no white cells, no nitrites, no casts, no bacterial growth. The frothy urine he describes is not being caused by protein leak, which is the main concern with frothy urine, and his previous albumin-to-creatinine ratio of 0.7 from January 2026 also showed no significant protein leak. The bilateral leg swelling is much more likely to be related to his hypothyroidism, which causes a type of fluid retention called myxoedema, combined with his weight and very low activity level reducing venous return, rather than kidney disease.\n\nHis liver panel shows genuine improvement from his previously recorded results. His ALT at 24 is within range and below the optimal ceiling of 30, down from 29 in September. His AST at 21 is well within range. His GGT at 48 is within the male range of 4 to 73, markedly improved from the previously recorded 101. His ALP at 71 is within range. His bilirubin at 8, albumin at 43, and total protein at 79 are all normal. His FIB-4 score, which estimates the degree of liver scarring using age, platelets, AST and ALT, is 0.85, well below the 1.45 threshold, meaning there is no suggestion of significant fibrosis. His APRI score at 0.197 and his NAFLD fibrosis score at minus 1.88 both sit within their optimal ranges, reinforcing that despite having diagnosed NAFLD, there is no evidence of progressive scarring. His De Ritis ratio, AST divided by ALT, is 0.88, within the optimal band. The liver is functioning well by every measurable parameter on this panel. The NAFLD is likely driven by the same insulin resistance and triglyceride overproduction seen in his metabolic markers, and as those improve, the liver fat content typically reduces.\n\nHis ferritin at 264 is within the male range of 22 to 322 but above the optimal ceiling of 200. His previously recorded ferritin of 725 was markedly elevated; 264 represents a substantial fall and a move in the right direction. In the context of his NAFLD, insulin resistance and raised hsCRP, ferritin can be elevated as an acute phase reactant, meaning the body produces more of it during inflammation, rather than because iron stores are genuinely excessive. His serum iron at 19.6, transferrin at 2.77, iron binding capacity at 63.3, and transferrin saturation at 28.18% are all within their normal ranges and the saturation sits within the optimal window of 25 to 40%, which argues against true iron overload. The fall from 725 to 264 most likely reflects improvement in the inflammatory and metabolic drivers rather than iron depletion.\n\nHis full blood count is largely healthy. Haemoglobin at 149, red blood cells at 4.95, haematocrit at 0.426, MCV at 86.1, MCH at 30, platelets at 266, MPV at 8.9 and white cell count at 5.55 are all within their normal ranges. His lymphocytes, monocytes, eosinophils and basophils are all normal. His neutrophils at 2.24 are within range, sitting just above the lower limit of 2.0. His neutrophil-to-lymphocyte ratio at 0.78 is below the optimal floor of 1.0, which at this margin is simply a reflection of a healthy lymphocyte count relative to a low-normal neutrophil count and is not a concern. His MCHC at 349 is marginally above the upper limit of 345. MCHC is the mean concentration of haemoglobin in each red blood cell; at this margin, the most common explanation is a minor laboratory artefact related to temperature or sample handling, and it has no clinical significance. His reticulocyte percentage at 0.76 is within range, but his absolute reticulocyte count at 37.62 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. A low absolute count with normal haemoglobin and normal red cell indices is not causing anaemia, but it may reflect the bone marrow producing red cells at a slightly reduced rate, which can be seen with hypothyroidism (thyroid hormone stimulates red cell production) and with chronic opioid use (co-codamol contains codeine, which can mildly suppress bone marrow activity). His RDW at 14 is within range.\n\nHis prostate markers are excellent. PSA at 0.28 against a limit of 3.5 is very low, and the free PSA ratio at 0.571 is strongly reassuring. His tumour markers CA19-9 at 3.54 and CEA at 0.8 are both well within their normal ranges.\n\nHis IgA at 3.8 is above the upper limit of 3.5. IgA is the immunoglobulin that protects mucosal surfaces, including the gut, respiratory tract and urinary tract. A mild elevation can be seen with chronic mucosal inflammation, and given his digestive symptoms, the bloating, the recent severe abdominal episode with diarrhoea and pale stool, this may reflect chronic gut inflammation. His tissue transglutaminase IgA at 1.1 is negative, which rules out coeliac disease as the cause. His IgG at 11.8 and IgM at 1.0 are both within range. His IgE at 397 is nearly four times the upper limit of 100. IgE is the immunoglobulin involved in allergic responses and parasitic infections. At this level, it suggests a significant allergic tendency. This could be environmental (dust mites, animal dander, mould) or food-related, and it may be contributing to his chronic inflammation and possibly to some of his digestive symptoms. He should discuss this with his GP, who may consider allergy testing to identify the trigger. His rheumatoid factor is below 4, which is normal.\n\nHis vitamin D at 58 nmol/L is above the sufficiency threshold of 50 but below the optimal floor of 75. Given that he reported low vitamin D in August 2026, this represents some improvement, but at a BMI of 34.7, fat tissue sequesters vitamin D, meaning he needs a higher supplementation dose than someone of normal weight to reach and maintain optimal levels of 75 to 120. His vitamin B12 at 412 is within the laboratory range but below the optimal floor of 500. B12 is essential for nerve function, red blood cell production, and cognitive clarity, and suboptimal levels could be contributing to his brain fog and fatigue. His folate at 9 is within range and above the optimal floor of 8. His calcium at 2.48, corrected calcium at 2.46, magnesium at 0.94, and PTH at 1.9 are all within their normal and optimal ranges, which is a clean picture of bone mineral metabolism.\n\nHis amylase at 25 is below the lower limit of 30. Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. His lipase, the other pancreatic enzyme, is 28, within range. Mildly low amylase with normal lipase is a pattern sometimes seen with chronic pancreatic insufficiency, where the pancreas produces fewer digestive enzymes over time. This could contribute to bloating and digestive discomfort, and it is worth noting in the context of his recent severe abdominal episode. However, at this margin, it may also simply reflect normal variation, and the normal lipase is reassuring against significant pancreatic disease. His total antioxidant activity at 2.2 is above the upper limit of 1.77, which is a positive finding indicating strong antioxidant capacity and is likely boosted by dietary or supplemental antioxidants.\n\nHis creatine kinase at 123 is within range, indicating no significant muscle damage despite his chronic pain conditions.\n\nHis PhenoAge is 47.3 against a calendar age of 53, placing him biologically 5.7 years younger than his chronological age. This is a genuinely encouraging result in the context of all the metabolic findings above. It is built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, and the fact that most of these inputs are healthy is pulling his biological age down despite the metabolic and thyroid challenges. With the interventions outlined below, particularly correcting the thyroid dose, improving insulin sensitivity, and beginning regular movement, this gap should widen further in his favour.\n\nHis uric acid at 427 is within the laboratory range of 220 to 547 but above the optimal ceiling of 380. Uric acid is the end product of purine metabolism; elevated levels are closely associated with insulin resistance, visceral fat and raised triglycerides, exactly the metabolic picture seen here. It also raises the risk of gout, a painful inflammatory arthritis. As insulin sensitivity improves, uric acid typically falls. He does not need medication for this at present, but his GP should be aware of it in the context of his metabolic profile.","links":"The central thread running through this report is insulin resistance driven by excess body fat and near-complete physical inactivity at a BMI of 34.7 with fewer than 2,000 daily steps and no structured exercise. Insulin resistance is the mechanism behind the elevated triglycerides, the low HDL, the raised VLDL, the elevated ApoB, the raised hsCRP, the elevated ferritin trend, the raised uric acid, the fatty liver disease, and to a significant degree the low testosterone. It is one interconnected metabolic syndrome rather than a collection of separate problems, and the most important implication of that is that one set of changes, specifically increased movement, gradual weight loss, and dietary adjustment, will improve all of them simultaneously rather than requiring a different intervention for each.\n\nLayered on top of this metabolic picture is a thyroid that is now clearly undermedicated. The reduction from 175 to 200 micrograms of levothyroxine to 100 micrograms has left his TSH at 6.39 with strongly positive antibodies confirming Hashimoto's thyroiditis. Hypothyroidism worsens every component of the metabolic syndrome: it reduces metabolic rate, impairs LDL clearance from the bloodstream, promotes fluid retention, suppresses energy and motivation, slows gut transit contributing to bloating, and directly reduces testosterone production. Until the thyroid dose is corrected, the metabolic improvements from lifestyle change will be partially blunted. This is why the thyroid dose review is the single most time-sensitive action in this report.\n\nThe testosterone at 7.7 is being suppressed from multiple directions simultaneously: the excess body fat increasing aromatase conversion to oestradiol, the insulin resistance lowering SHBG and suppressing the hypothalamic signal, the hypothyroidism, and potentially the chronic codeine use (opioids are well recognised to suppress gonadotropins). Addressing the first three may lift testosterone enough to avoid replacement therapy, but if it remains below range after the thyroid is corrected and some weight has been lost, it should be formally investigated.\n\nTwo findings sit outside the metabolic story. The IgE at 397 suggests a significant allergic process that has not been identified. This may be entirely separate from the metabolic picture, or it may be contributing to the chronic inflammation reflected in the hsCRP and ESR. Identifying and managing the allergic trigger could reduce his inflammatory burden. The low amylase alongside his recent severe abdominal episode and chronic digestive symptoms raises the question of whether pancreatic exocrine function is adequate; this is worth exploring if digestive symptoms persist after the thyroid is corrected and dietary changes are made.\n\nWhat the bloods have excluded is also important. His kidneys are functioning well with no protein in the urine, which addresses his concern about the frothy urine directly. There is no evidence of liver fibrosis despite the NAFLD. There is no coeliac disease. The prostate is healthy. The tumour markers are clean. The immune system is intact. The bone mineral metabolism is balanced. These are all genuine positives in a 53-year-old man with multiple chronic conditions.","lifestyle":"Begin walking for 15 minutes immediately after your largest meal, every day. Plate in the sink, shoes on, out the door. Anchor: right after dinner. Why: a post-meal walk directly lowers the glucose and insulin response to that meal, which is the most immediate tool you have for your HOMA-IR of 3.92 and triglycerides of 4.64.\nBuild daily steps gradually from under 2,000 toward 7,500 over the next 8 weeks, adding 500 steps every few days. Anchor: set a phone reminder at 10am and 3pm to walk for 5 minutes. Why: at your current step count, even modest increases in daily movement measurably improve insulin sensitivity, lower triglycerides, and support testosterone.\nAdd a palm-sized portion of protein to every meal and eat the protein first, before carbohydrates. Why: protein blunts the insulin spike, supports muscle maintenance while losing weight, and improves satiety, reducing total calorie intake without hunger. Your target is 140 to 175 grams of protein per day.\nReduce sugar to rare occasions rather than some days. Swap sugary snacks for Greek yoghurt with berries, cheese with apple slices, or a handful of nuts. Anchor: restock these alternatives on your weekly shop. Why: each sugar hit spikes the insulin that is already four times too high.\nEat 4 to 5 portions of vegetables daily, up from 2 to 3, prioritising leafy greens, broccoli, peppers, onions and tomatoes. Add a side salad or portion of veg to lunch and dinner. Why: soluble fibre from vegetables lowers triglycerides, feeds beneficial gut bacteria that may ease your bloating, and adds volume to meals without adding calories.\nAim for a calorie intake of 2,000 to 2,200 kcal per day, which is a moderate deficit against your estimated maintenance of approximately 2,700 kcal. This should produce roughly 0.5 kg of weight loss per week. An initial target weight of 95 to 100 kg over the next 6 to 9 months would meaningfully improve every metabolic marker in this report.\nSet a fixed wake time 7 days a week, even at weekends, and get outside or open a window within 30 minutes of waking. Anchor: alarm goes off, curtains open immediately. Why: a consistent wake time and morning light exposure are the strongest drivers of sleep quality, and under 6 hours with exhausted waking is contributing to your cortisol, insulin resistance, fatigue and brain fog.\nCut caffeine entirely after midday. If you drink coffee, keep it to the morning. Why: caffeine has a half-life of 5 to 7 hours; an afternoon coffee is still in your system at midnight, fragmenting the sleep you are already short of.","flags":"TSH 6.39 against an upper limit of 4.78, with TPO antibodies above 400 (limit 13.8) and thyroglobulin antibodies 5.2 (limit 4.4), confirming autoimmune thyroid disease (Hashimoto's) and significant undermedication following the recent levothyroxine reduction from 175-200mcg to 100mcg. FT4 17 and FT3 5.1 are both still within range, indicating the thyroid is maintaining output under strain for now, but the elevated TSH shows this is not sustainable. GP review of levothyroxine dose is the most time-sensitive action in this report.\nTestosterone 7.7 nmol/L, below the lower limit of 8.4 and the recommended level of 12. Progesterone 0.66 nmol/L, below the lower limit of 0.89. LH 3.75 and FSH 3.37 are both within range, suggesting central suppression rather than primary testicular failure. Multiple drivers: BMI 34.7, insulin resistance, hypothyroidism, and chronic opioid use (co-codamol). Recommend addressing modifiable factors first and repeating a morning testosterone after the thyroid dose is corrected and some weight is lost; if still below range, formal investigation with a repeat paired sample.\nHOMA-IR 3.92 against an upper limit of 1.5, indicating significant insulin resistance. Fasting insulin 16.32 mIU/L (laboratory range, but above optimal ceiling of 8). Fasting glucose 5.4 and HbA1c 39 mmol/mol are within range but being held there by excessive insulin output. TyG index 9.9 against a limit of 8.8. C-peptide 546 pmol/L confirms vigorous pancreatic output. Family history of type 2 diabetes.\nTriglycerides 4.64 mmol/L (limit 1.70 fasting), VLDL 2.11 (limit 0.78), total cholesterol 6.6 (desirable below 5.18), HDL 1.0 (optimal above 1.4), non-HDL cholesterol 5.6 (limit 4.0), ApoB 0.95 (target below 0.9, optimal below 0.8), TC/HDL ratio 6.6 (limit 4.5), atherogenic index 0.667 (limit 0.21). LDL could not be calculated due to high triglycerides. This is the classic dyslipidaemia of insulin resistance and will respond to the same metabolic interventions. Lp(a) below 25 nmol/L confirms the entire lipid picture is modifiable.\nhsCRP 4.3 mg/L against an optimal target of below 1.0, consistent with chronic low-grade inflammation from visceral adiposity and insulin resistance. ESR 14 against a limit of 12, mildly elevated and concordant.\nIgE 397 IU/ml against an upper limit of 100. Suggests significant allergic sensitisation. Consider allergy testing (skin prick or specific IgE panel) to identify the trigger.\nIgA 3.8 g/L against an upper limit of 3.5. Mild elevation may reflect chronic mucosal inflammation. Coeliac excluded (tTG IgA 1.1, negative).\nReticulocyte absolute count 37.62 against a lower limit of 50, with normal haemoglobin and indices. May reflect mild bone marrow suppression from hypothyroidism and/or chronic opioid use. Monitor on retest.\nAmylase 25 IU/L, below the lower limit of 30, with lipase 28, within range. Mildly low amylase may suggest reduced pancreatic exocrine output, relevant in the context of his digestive symptoms and recent acute abdominal episode. Worth monitoring.\nVitamin D 58 nmol/L, sufficient but below optimal (75-120). Vitamin B12 412 pg/ml, within range but below optimal (500-900). Ferritin 264 ng/ml, within range but above optimal ceiling of 200, markedly improved from previous 725.\nUric acid 427 umol/L, within laboratory range but above optimal ceiling of 380. Associated with insulin resistance and elevated triglycerides. Monitor and reassess as metabolic profile improves.\nMCHC 349 against an upper limit of 345. Marginal, most likely laboratory variation, no clinical significance.\nReassuring negatives: kidney function stable with combined eGFR 86, no urinary protein, no haematuria, no casts; liver enzymes all within range with FIB-4 0.85, APRI 0.197 and NAFLD fibrosis score minus 1.88 all indicating no fibrosis; PSA 0.28 with free ratio 0.571 excellent; CA19-9 3.54 and CEA 0.8 both normal; coeliac negative; rheumatoid factor negative; calcium, magnesium and PTH all normal; cortisol within morning range; prolactin normal.","recommendations":"Discuss the elevated TSH of 6.39 with your GP as a priority. The levothyroxine dose reduction to 100mcg has left you undermedicated, and the dose needs to be reviewed. Bring the previous dose history (175-200mcg reduced to 100mcg on 3 September) and the symptoms you experienced around the change. A repeat TSH and FT4 six to eight weeks after any dose adjustment will confirm the response.\nDiscuss the testosterone of 7.7 nmol/L (below the 8.4 lower limit and recommended 12) with your GP. Multiple reversible causes are present (BMI, insulin resistance, hypothyroidism, opioid use). Recommend repeating a morning testosterone with SHBG and LH once the thyroid dose is corrected and some weight loss has occurred. If it remains below range after three to six months, formal investigation with endocrinology referral may be warranted.\nDiscuss the insulin resistance (HOMA-IR 3.92, fasting insulin 16.32) and lipid profile (triglycerides 4.64, ApoB 0.95, HDL 1.0) with your GP. Given the family history of type 2 diabetes, a structured approach including annual HbA1c monitoring and a lipid recheck after three to six months of lifestyle change is appropriate. If triglycerides remain above 2.3 and ApoB above 0.9 after sustained lifestyle change, medication may need to be considered.\nDiscuss the IgE of 397 (limit 100) with your GP. Consider referral for allergy testing (skin prick testing or specific IgE panel) to identify environmental or food allergens that may be driving chronic inflammation.\nDiscuss the recent acute abdominal episode (severe upper abdominal pain, vomiting, pale stool, diarrhoea) and the low amylase of 25 with your GP if not already investigated. An abdominal ultrasound and faecal elastase test would assess for gallbladder pathology and pancreatic exocrine insufficiency.\nDiscuss a structured plan to reduce co-codamol use with your GP. Codeine at 4 to 6 tablets daily contributes to constipation and bloating, may suppress testosterone and bone marrow function, and carries dependency risk. A pain management review considering non-opioid alternatives for lumbar stenosis and Eagle syndrome would be valuable.\nCalorie target: 2,000 to 2,200 kcal per day. Protein target: 140 to 175 g per day (1.3 to 1.6 g per kg). Target weight: 95 to 100 kg over 6 to 9 months. Retest in 4 to 6 months with: TSH, FT4, FT3, testosterone, SHBG, LH, fasting insulin, HOMA-IR, HbA1c, full lipid panel with ApoB, hsCRP, ferritin, vitamin D, B12, liver panel, reticulocyte count.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with your largest meal that contains fat. At a BMI of 34.7, fat tissue sequesters vitamin D, so you need a higher dose to move from your current 58 nmol/L into the optimal range of 75 to 120. Recheck in 4 months.\nVitamin K2 (MK-7): 200 mcg daily, taken with the vitamin D. K2 directs calcium into bones and teeth rather than arteries, and should always accompany vitamin D supplementation.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Your B12 at 412 is within range but below the optimal floor of 500, and suboptimal B12 may be contributing to your brain fog and fatigue. Sublingual absorption bypasses the gut, which is important given your digestive symptoms.\nOmega-3 fish oil: 2 to 3 g of combined EPA and DHA daily, taken with food. Omega-3 lowers triglycerides (yours are at 4.64), reduces inflammation (hsCRP 4.3), and supports cardiovascular health. Choose a high-strength product that delivers at least 1,000 mg EPA per dose.\nMagnesium (glycinate): 400 mg before bed. Your magnesium at 0.94 is within the optimal range, but glycinate specifically supports sleep quality, which at under 6 hours with exhausted waking is one of the most important areas to improve. It also supports insulin sensitivity.\nDO NOT take iron supplements. Your ferritin at 264 is above the optimal ceiling and your iron stores are adequate. Additional iron would be counterproductive.\nThe most important changes from this report are not supplements. They are correcting the levothyroxine dose with your GP, beginning daily walking, reducing calorie intake to 2,000 to 2,200 kcal with 140 to 175 g protein, and improving sleep duration and quality. These will do more for every abnormal marker in this report than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 50.6; held to 49 by two or more systems rated \"See your GP\". Weakest systems: lipids & cardiovascular 13%, immunology 17%, inflammation 25%. Biggest drags: Triglycerides, Remnant Cholesterol, TSH, Apolipoprotein B.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"47.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4078","lower_normal":"","upper_normal":"58","lower_optimal":"","upper_optimal":"53","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4569","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count). His PhenoAge of 47.3 against a calendar age of 53 places him biologically 5.7 years younger. This is a genuinely positive result driven by healthy albumin, creatinine, MCV, RDW, WBC and ALP. As his metabolic health improves and hsCRP falls, PhenoAge should move further in his favour.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is 85 out of 100, above 40, so it is flagged. It is a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, and it measures the risk being built rather than the ten-year chance of an event. The main contributors are ApoB at 0.95, hsCRP at 4.3 and a triglyceride-to-HDL ratio of 4.6.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT is an enzyme found mainly inside liver cells. When the liver is under strain, these cells release ALT into the bloodstream, so the level acts as a gauge of liver health. His ALT at 24 is below the optimal ceiling of 30, which represents a clean liver that is not under metabolic strain. Given his diagnosed NAFLD and previously elevated GGT, this is a genuinely encouraging result.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, medication effects, excessive alcohol, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5312","units":"IU/l","description":"AST is an enzyme found in the liver, heart and muscles. Unlike ALT, which is liver-specific, AST can rise with muscle damage or exercise as well. His AST at 21 is well within range and within the optimal band, confirming the liver is healthy and there is no muscle breakdown of concern.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver damage, muscle injury, heart conditions, strenuous exercise","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5526","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4348","units":"IU/l","description":"GGT is a liver enzyme that rises with bile duct stress, alcohol use, metabolic strain and certain medications. His GGT at 48 is within the male laboratory range of 4 to 73 but above the optimal ceiling of 25. However, this is a dramatic improvement from his previously recorded GGT of 101, which was above range. In the context of NAFLD and insulin resistance, a GGT in this area is expected, and the downward trend is a positive sign that the liver is under less strain than before.","low_causes":"","high_causes":"Fatty liver, alcohol, bile duct obstruction, medications, obesity, insulin resistance","padding":"1","one_sided":"0","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP is an enzyme found in the liver, bones and bile ducts. It can rise with bile duct obstruction, bone disease, or liver conditions. His ALP at 71 is comfortably within range and within the optimal band, providing additional reassurance about liver and bone health.","low_causes":"Zinc deficiency, malnutrition","high_causes":"Bile duct obstruction, bone disease, liver conditions, vitamin D deficiency","padding":"1","one_sided":"0","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is the yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. Elevated bilirubin can indicate liver or bile duct problems, or a harmless inherited condition called Gilbert's syndrome. His bilirubin at 8 is well within range and optimal, confirming the liver is processing waste efficiently.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, Gilbert's syndrome, haemolysis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, vitamins and medications, and maintains fluid balance by keeping water inside blood vessels. Low albumin can cause swelling and is a sign of liver disease, kidney loss or malnutrition. His albumin at 43 is within the optimal range, confirming good liver synthetic function and ruling out significant protein loss through the kidneys.","low_causes":"Liver disease, kidney disease (nephrotic syndrome), malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6267","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"82","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4400","upper_optimal_position":"0.6667","units":"g/l","description":"Total protein is the sum of albumin and globulin in the blood. It provides an overview of liver function, immune activity and nutritional status. His total protein at 79 is within the optimal range.","low_causes":"Liver disease, malnutrition, kidney loss","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins including immunoglobulins (antibodies) and transport proteins. His globulin at 36 sits at the upper limit of the laboratory range and above the optimal ceiling of 32. This is consistent with his elevated IgA and markedly elevated IgE, indicating the immune system is producing more antibodies than usual.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, allergic conditions","padding":"1","one_sided":"0","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2765","lower_normal":"30","upper_normal":"118","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3523","upper_optimal_position":"0.6023","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands that breaks down starch into sugars. His amylase at 25 is below the lower limit of 30. Mildly low amylase can suggest reduced pancreatic exocrine output, meaning the pancreas may not be producing enough digestive enzymes to break down food efficiently. In the context of his bloating, digestive discomfort and recent severe abdominal episode, this is worth monitoring. His lipase at 28 is within range, which is reassuring against acute pancreatic disease.","low_causes":"Chronic pancreatic insufficiency, pancreatic damage, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4397","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5816","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is a more specific marker of pancreatic function than amylase. His lipase at 28 is within the optimal range, which is reassuring that the pancreas is not acutely inflamed.","low_causes":"Chronic pancreatic insufficiency","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6380","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including protective HDL and potentially harmful LDL and VLDL. His total cholesterol at 6.6 is above the desirable ceiling of 5.18. This is being driven primarily by the very high triglycerides elevating VLDL, with contributions from suboptimal HDL. Total cholesterol is a blunt instrument; the breakdown into its component parts matters more.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, obesity, insulin resistance, hypothyroidism, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"4.64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats packaged by the liver and released into the bloodstream. They rise with excess carbohydrate intake, insulin resistance, excess body fat and hypothyroidism. His triglycerides at 4.64 are nearly three times the fasting limit of 1.70 and well above the optimal ceiling of 1.0. They are improved from 6.6 (non-fasting) in November 2025 and 3.3 (fasting) in May 2026 but remain markedly elevated. The insulin resistance (HOMA-IR 3.92) is the primary driver: when cells resist insulin's signal, the liver overproduces triglyceride-rich VLDL particles.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"Insulin resistance, excess carbohydrate, obesity, hypothyroidism, alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4808","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL is the protective cholesterol fraction. It removes excess cholesterol from artery walls and carries it back to the liver for disposal, a process called reverse cholesterol transport. Higher HDL means better protection. His HDL at 1.0 sits just below the lower-risk threshold of 1.04 and well below the optimal floor of 1.4 for men. At a BMI of 34.7 with no exercise, low HDL has a clear explanation: regular physical activity is the most powerful way to raise HDL, followed by weight loss and omega-3 intake.","low_causes":"Physical inactivity, obesity, insulin resistance, smoking, poor diet","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"Unable to calculate","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/l","description":"LDL cholesterol is the fraction that deposits cholesterol into artery walls when present in excess. The laboratory was unable to calculate his LDL because triglycerides above approximately 4.5 mmol/L make the standard formula unreliable. His ApoB, which directly counts every atherogenic particle including LDL, is a more reliable measure in this situation and is reported separately.","low_causes":"","high_causes":"Diet, obesity, insulin resistance, hypothyroidism, genetic factors","padding":"1","one_sided":"0","range_type":"normal"},{"key":"vldl","name":"VLDL Cholesterol (Calculated)","group":"LIPIDS & CARDIOVASCULAR","result":"2.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL particles are made by the liver and carry triglycerides to tissues for energy or storage. They are the precursors to LDL particles. His VLDL at 2.11 is nearly three times the upper limit of 0.78, directly reflecting the very high triglyceride production driven by insulin resistance.","low_causes":"","high_causes":"Insulin resistance, high carbohydrate intake, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful fractions (LDL, VLDL and remnant particles) in one number. His non-HDL at 5.6 is well above the 4.0 limit. Because LDL could not be calculated directly, non-HDL is particularly useful here as a summary of total atherogenic cholesterol burden.","low_causes":"","high_causes":"High triglycerides, elevated LDL, insulin resistance, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"6.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7333","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL to give a simple snapshot of cardiovascular risk. Lower is better. His ratio at 6.6 is well above the 4.5 limit, driven by both high total cholesterol and low HDL. As triglycerides fall and HDL rises with lifestyle change, this ratio will improve.","low_causes":"","high_causes":"High total cholesterol, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"15.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3788","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows what proportion of the cholesterol in the blood is protective. A healthy level is above 20%, and above 25% is optimal. His 15.15% is below the 20% floor, meaning a smaller fraction of his total cholesterol is protective. This reflects both the low HDL and the inflated total cholesterol from elevated triglycerides.","low_causes":"Low HDL, high total cholesterol, metabolic syndrome, inactivity","high_causes":"Regular exercise, healthy weight, good diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every atherogenic lipoprotein particle, including LDL, VLDL and Lp(a). Because each particle carries exactly one ApoB molecule, this marker directly counts the number of particles that can penetrate artery walls and deposit cholesterol. It is widely considered the single best predictor of cardiovascular risk. His ApoB at 0.95 is above the desirable limit of 0.9 and above the optimal target of below 0.8. Given that LDL could not be calculated, ApoB provides the most reliable measure of his atherogenic particle count.","low_causes":"","high_causes":"Insulin resistance, high triglycerides, obesity, hypothyroidism, high saturated fat diet, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6083","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles. It drives the protective process of reverse cholesterol transport. His ApoA1 at 1.46 is above the 1.20 threshold and within the optimal range, which is a genuine positive. It means the protective HDL particles he has are well structured and functional.","low_causes":"Physical inactivity, obesity, smoking, poor diet","high_causes":"Regular exercise, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB/A1 ratio is the balance between atherogenic and protective particles. Below 0.7 is lower risk, and below 0.6 is optimal. His ratio at 0.65 sits in the lower-risk zone, which is a more favourable picture than the raw cholesterol numbers suggest. This means that while the total particle burden is elevated, the balance between harmful and protective particles is not as skewed as the LDL and triglyceride numbers alone would imply.","low_causes":"","high_causes":"High ApoB, low ApoA1, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lp(a) is a genetically determined lipoprotein particle that deposits cholesterol, encourages blood clotting and drives inflammation in artery walls. It cannot be changed by diet, exercise or most medications, and once measured it goes on the permanent medical record. His Lp(a) is below 25 nmol/L, well under the 32 nmol/L threshold, which is genuinely useful information because it confirms the entire lipid picture is driven by modifiable factors, specifically insulin resistance, weight and inactivity, rather than by an inherited particle he cannot change.","low_causes":"","high_causes":"Inherited, cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose (Fasting)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the sugar in the blood after an overnight fast. It is the most immediate snapshot of blood sugar control. His glucose at 5.4 sits at the top of the optimal range, which is normal but only because his pancreas is producing a large amount of insulin to hold it there. Without that compensatory insulin output, his glucose would be higher.","low_causes":"Fasting, excessive insulin, medication, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, infection, medication","paddin nflammation","high_causes":"Haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"264","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6027","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5289","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve. His ferritin at 264 is within the male laboratory range of 22 to 322 but above the optimal ceiling of 200. However, this is a significant improvement from his previously recorded ferritin of 725. In the context of insulin resistance, NAFLD and raised hsCRP, ferritin often acts as an acute phase reactant, rising with inflammation rather than reflecting true iron excess. His normal transferrin saturation at 28% argues against haemochromatosis or true iron overload. The downward trend is encouraging and should continue as metabolic health improves.","low_causes":"Iron deficiency, blood loss, malabsorption, vegetarian diet","high_causes":"Inflammation, infection, liver disease, insulin resistance, haemochromatosis, iron supplementation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"6.39","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7949","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4393","upper_optimal_position":"0.4747","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and tells the thyroid how much hormone to make. When thyroid output is too low, TSH rises as the pituitary shouts louder. His TSH at 6.39 is above the upper limit of 4.78 and well above the optimal ceiling of 2.5. This confirms his thyroid is undermedicated following the dose reduction from 175-200mcg to 100mcg of levothyroxine. In someone with Hashimoto's thyroiditis, where the immune system is actively damaging the thyroid, the gland relies on replacement hormone, and halving the dose has left his body short.","low_causes":"Overmedication with levothyroxine, hyperthyroidism, pituitary dysfunction","high_causes":"Hypothyroidism, undermedication with levothyroxine, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5149","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues. His FT4 at 17 is within the optimal range, which means the thyroid is still producing adequate hormone for now. However, with a TSH of 6.39 pushing it hard, this output may not be sustainable without a dose adjustment.","low_causes":"Hypothyroidism, undermedication, pituitary disease","high_causes":"Hyperthyroidism, overmedication with levothyroxine","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells use directly. It is largely converted from T4 in peripheral tissues. His FT3 at 5.1 is within the optimal range, confirming that the body is still converting T4 to T3 effectively. This is a positive sign, but it does not negate the elevated TSH, which shows the system is under strain.","low_causes":"Hypothyroidism, severe illness, poor T4-to-T3 conversion, selenium deficiency","high_causes":"Hyperthyroidism, overmedication, T3 supplementation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tpoantibodies","name":"TPO Antibodies","group":"THYROID","result":">400","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are autoantibodies that attack thyroid peroxidase, an enzyme the thyroid needs to produce its hormones. Their presence is the hallmark of Hashimoto's thyroiditis, the autoimmune form of hypothyroidism. His TPO antibodies are above 400, massively elevated against a limit of 13.8, confirming active autoimmune thyroid disease. This is consistent with his known diagnosis and explains why the thyroid gland needs levothyroxine replacement.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tgantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"5.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6884","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies attack thyroglobulin, the protein l_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in cell division and red blood cell production. It is found in leafy greens, legumes and fortified foods. His folate at 9 is within the optimal range, indicating adequate dietary intake.","low_causes":"Poor diet, alcohol, malabsorption, medication (methotrexate)","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4587","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3826","upper_optimal_position":"0.5680","units":"pmol/L","description":"PTH is produced by the parathyroid glands and regulates calcium and phosphate levels. It rises when calcium or vitamin D are low, pulling calcium from bones to maintain blood levels. His PTH at 1.9 is within the optimal range, confirming healthy calcium regulation despite the suboptimal vitamin D. This means the body is not yet having to compensate for the low vitamin D by increasing PTH.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism, low calcium","padding":"1","one_sided":"0","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"2.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals and oxidative stress. His TAA at 2.2 is above the upper limit of 1.77. An elevated TAA is a positive finding, indicating strong antioxidant defences. This is commonly seen with dietary antioxidant intake or supplementation and does not indicate any pathology.","low_causes":"Poor diet, oxidative stress, chronic disease","high_causes":"High antioxidant intake from diet or supplements, polyphenol-rich foods","padding":"1","one_sided":"0","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"472","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5450","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.6146","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling through the day. It regulates energy, blood sugar, immune function and the stress response. His cortisol at 472 is within the morning optimal range. It sits toward the upper end, which is consistent with chronic pain, poor sleep and intermittent stress, but is not pathologically elevated.","low_causes":"Adrenal insufficiency, pituitary disease","high_causes":"Chronic stress, pain, poor sleep, Cushing's syndrome, corticosteroid medication","padding":"1","one_sided":"0","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"7.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2841","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone. It drives energy, mood, motivation, muscle maintenance, fat distribution, libido, bone density and red blood cell production. His testosterone at 7.7 is below the laboratory lower limit of 8.4 and well below the recommended level of 12 and the optimal floor of 18. Multiple factors are suppressing it simultaneously: excess body fat at BMI 34.7 (adipose tissue converts testosterone to oestradiol via the aromatase enzyme), insulin resistance (which suppresses SHBG and the hypothalamic signal), undermedicated hypothyroidism (thyroid hormone directly supports testosterone production), and chronic opioid use (codeine suppresses gonadotropins). His LH and FSH are both within range, which suggests central (hypothalamic-pituitary) suppression rather than primary testicular failure.","low_causes":"Obesity, insulin resistance, hypothyroidism, opioid use, ageing, chronic illness, pituitary disease","high_causes":"Exogenous testosterone, anabolic steroids","padding":"1","one_sided":"0","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.186","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3948","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"1.04","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3959","upper_optimal_position":"0.6667","units":"nmol/l","description":"Free testosterone is the fraction not bound to proteins and therefore available to act on tissues. His free testosterone at 0.186 is within the laboratory range but below the optimal floor of 0.3, reflecting the low total testosterone.","low_causes":"Low total testosterone, high SHBG, obesity, ageing","high_causes":"Low SHBG, exogenous testosterone","padding":"1","one_sided":"0","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"21.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3607","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3853","upper_optimal_position":"0.5928","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein that binds testosterone and oestradiol, controlling how much is free and available to tissues. Lower SHBG means more hormone is free, but it also reflects metabolic issues. His SHBG at 21.3 is within the laboratory range but below the optimal floor of 25. Low SHBG is directly associated with insulin resistance and metabolic syndrome, which is consistent with his metabolic picture.","low_causes":"Insulin resistance, obesity, metabolic syndrome, hypothyroidism","high_causes":"Hyperthyroidism, liver disease, ageing, oestrogen therapy","padding":"1","one_sided":"0","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"36.15","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3846","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The Free Androgen Index estimates how much testosterone is biologically available by dividing total testosterone by SHBG. His FAI at 36.15 is within the laboratory range but below the optimal floor of 40, consistent with the low total testosterone.","low_causes":"Low testosterone, high SHBG","high_causes":"PCOS (in females), low SHBG, exogenous testosterone","padding":"1","one_sided":"0","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2842","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men, produced mainly by aromatase conversion of testosterone in fat tissue, with smaller amounts from the testes and adrenals. In men, moderate levels are needed for bone health, brain function and libido, but excess levels from high body fat can suppress testosterone. His oestradiol at 83 is within range and within the optimal band. While this level is not elevated, at a BMI of 34.7, significant aromatase activity is expected, and the combination of a within-range oestradiol with a below-range testosterone is consistent with enhanced conversion.","low_causes":"Very low body fat, aromatase inhibitors","high_causes":"Obesity, high body fat, liver disease, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2742","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5698","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a minor role in mood, sleep and as a precursor to other hormones. His progesterone at 0.66 is below the lower limit of 0.89. In men, low progesterone is a minor finding and is not associated with significant clinical consequences. It does not require specific treatment.","low_causes":"Low adrenal output, stress","high_causes":"Congenital adrenal hyperplasia, supplementation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"3.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4188","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333",
