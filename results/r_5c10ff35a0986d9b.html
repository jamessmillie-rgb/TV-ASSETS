<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Alfie Ingham","dob":"14/10/2007","report_date":"2026-10-29","summary":"Customer is a 19-year-old male presenting with a BMI of 24.7, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are larger than average (volume 7 out of 10). He trains eight or more times per week (three cardio sessions and five or more resistance sessions at hard intensity) with 10,000 to 15,000 daily steps. He sleeps 7 to 8 hours and wakes feeling refreshed, with steady energy throughout the day and stress that rarely feels hard to manage. He does not drink alcohol. He supplements with vitamin D, magnesium, omega-3 fish oil and zinc. His family history includes thyroid disease. He has not had a previous blood test. He reports no formal symptoms but has noticed that whenever he falls ill, the lymph nodes in his neck swell and feel tender as expected, but they never return to their normal size once the illness has passed, and he says this has been the case for as long as he can remember. His goals are to improve long-term health and longevity, prevent disease and boost his immune system.\n\nThere is a great deal of good news in this report, and it is worth starting there because the overall picture is one of a young, fit, well-nourished body with a few specific findings that deserve attention. His liver is in excellent health. ALT at 28, AST at 28 and Gamma GT at 14 are all comfortably within range, and the FIB-4 score of 0.48 and APRI of 0.33 both confirm there is no sign of fibrosis or metabolic strain on the liver at all. His lipid profile is genuinely outstanding for any age and exceptional at 19. Total cholesterol is 3.2, LDL is just 1.26, HDL is 1.6, which is above the 1.4 level considered ideal for a man, and triglycerides are 0.7, well below the 1.0 optimal threshold. His ApoB, the protein that carries atherogenic cholesterol particles and the single best measure of how much cholesterol is actually getting into artery walls, is 0.46, comfortably below the 0.8 ideal target. His ApoB to ApoA1 ratio is 0.30, well below the 0.7 lower-risk threshold. His TG to HDL ratio, an indirect marker of small dense LDL particles, is 0.44, firmly in the ideal range. These numbers tell us that the cardiovascular plumbing is as clean as it gets. His blood sugar control is solid: fasting glucose at 5.2, HbA1c at 33 mmol/mol (well below the 42 pre-diabetes threshold), and his estimated average glucose of 5.6 all confirm healthy glycaemic regulation. His thyroid is working well. TSH at 3.24 sits within the laboratory range of 0.55 to 4.78, free T4 at 17 is in the ideal zone, and free T3 at 6.6 is within the laboratory range and only marginally above the optimal ceiling of 6.5, which at his age and training load is not a concern and is consistent with an active, efficient thyroid. The FT3 to FT4 ratio of 0.39 confirms good conversion. Both thyroid antibodies are negative, which is reassuring given the family history of thyroid disease. It does not mean he will never develop thyroid autoimmunity, but it means it is not happening now. His kidney function is healthy, with creatinine at 81 and an eGFR above 90 from creatinine and 94 from the combined creatinine and cystatin C calculation. His electrolytes are balanced, with sodium at 142, chloride at 105 and bicarbonate at 25. His calcium is 2.49 with a corrected calcium of 2.47, phosphate at 1.2 and magnesium at 0.93, all within optimal ranges, and his parathyroid hormone at 3.89 is within the normal range, confirming healthy bone mineral regulation. His immunoglobulins are all within range: IgG at 8.2, IgA at 1.8, IgM at 1.0 and IgE at 9.06, the last of which is very low and argues against any significant allergic or parasitic process. Rheumatoid factor is negative and coeliac screening is negative. His PSA is 0.16, essentially undetectable, and both tumour markers tested, CA19-9 and CEA, are well within range. His ESR, which is the rate at which red blood cells settle and a broad marker of inflammation, is just 2, about as low as it gets. His creatine kinase at 290 is within the 40 to 320 range, which at his training volume is expected and healthy. His urine is clean, with no protein, no glucose, no ketones, negative nitrites, no bacterial growth and no casts. His PhenoAge, a composite biological age score built from markers like albumin, glucose, CRP, white cell count and others, comes in at 13 against a calendar age of 19, meaning his body is ageing six years slower than average. That is an excellent result and reflects the training, the sleep quality and the clean metabolic profile.\n\nThere are, however, several findings that need discussing, and a couple that should go to his GP.\n\nThe most important finding in this report is a significantly raised lipoprotein(a), or Lp(a), at 146 nmol/L. Lp(a) is a genetically inherited particle that looks like LDL cholesterol but carries an extra protein called apolipoprotein(a) attached to it. It deposits cholesterol into artery walls, encourages blood clotting by interfering with the body's natural clot-dissolving system, and drives inflammation inside the vessel lining. Unlike every other lipid marker in this report, Lp(a) does not change with diet, exercise, weight loss or any lifestyle intervention. It is set by genetics and stays essentially the same for life. At 146 nmol/L, this sits in the moderate risk category (90 to 200 nmol/L). On its own, at 19, with LDL of 1.26 and ApoB of 0.46 and no other cardiovascular risk factors, the ten-year absolute risk of an event remains very low. But the importance of knowing this number at 19 is precisely that it gives him decades to manage every modifiable risk factor around it. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, comes in at 35 out of 100. That score is within the acceptable range (below 40) but above the ideal threshold of 20, and the entire gap between his score and ideal is being driven by the Lp(a), because every other input is excellent. His Lp(a)-corrected LDL, which removes the cholesterol carried inside Lp(a) particles to show what is truly modifiable, is just 0.79, confirming that his standard LDL management is already about as good as it gets. This is a finding he should record permanently and mention to his GP. First-degree relatives, particularly parents and siblings, should be offered Lp(a) testing because the trait is inherited. His GP does not need to do anything urgently, but it should sit in his medical record so that if any other cardiovascular risk factor changes in the future, it is considered in context.\n\nThe second finding that needs a GP conversation is a significantly low neutrophil count at 1.12, below the lower limit of 2.0. Neutrophils are the most abundant type of white blood cell and the body's first-response defence against bacterial infection. A count below 2.0 is called neutropenia. At 19, with no medications, no alcohol, steady energy, good sleep and no recurrent infections, the most likely explanation is benign ethnic neutropenia, which is common in people of certain ancestries, or a constitutional variant where the body simply runs a lower circulating neutrophil count as its normal baseline. However, at 1.12 this is low enough that it should be confirmed with a repeat full blood count through his GP. If it is consistently around this level and he is well, it can be accepted as his normal. But it needs documenting. His total white cell count at 4.5 is at the lower end of normal, which is consistent with the low neutrophil count pulling the total down, while his lymphocytes at 2.83, monocytes at 0.41, eosinophils at 0.11 and basophils at 0.03 are all within range. His Systemic Immune-Inflammation Index, which combines neutrophils, platelets and lymphocytes into a single score, is 83, below the lower end of the 100 to 600 reference range, and this is being driven entirely by the low neutrophil count rather than by any problem with the other cell lines. His platelet to lymphocyte ratio at 74.2 is marginally below the 80 lower optimal, again reflecting the cell line balance rather than any pathology.\n\nRegarding his lymph node concern, there is nothing in the blood work that suggests anything sinister. His inflammatory markers are low (CRP at 1.2, ESR at 2), his immunoglobulins are balanced, his white cell differential shows no abnormal pattern beyond the neutropenia, and there is no lymphocytosis or monocytosis that would raise concern about a lymphoproliferative process. Persistently enlarged lymph nodes in the neck that swell with illness and never fully regress are common in young people and are usually reactive, meaning the lymph nodes have simply been doing their job fighting off the various viral infections of childhood and adolescence and have retained some of that reactive tissue. If they are not growing between illnesses, not hard or fixed, and not associated with night sweats, unexplained weight loss or persistent fevers, they are very unlikely to represent anything concerning. That said, because this has been present for as long as he can remember, it would be reasonable to mention it to his GP at the same appointment as the neutrophil discussion, simply so it is documented.\n\nHis prolactin at 428 is above the upper limit of 375 uIU/mL. Prolactin is a hormone produced by the pituitary gland at the base of the brain, and in men it is normally present at low levels. Mildly elevated prolactin, known as hyperprolactinaemia, can be caused by stress at the time of the blood draw, recent intense exercise, recent food intake, or disrupted sleep, all of which can transiently raise the level. At 428, this is only modestly above the upper limit and falls within the range where a physiological explanation is most likely. However, because prolactin above range can occasionally reflect a small benign pituitary adenoma called a prolactinoma, or can be associated with medications (though he takes none), it is worth repeating on a fasted morning sample through his GP. If it remains elevated on repeat, further investigation with a pituitary MRI may be appropriate. His testosterone at 14.7 is within the laboratory range of 8.4 to 28.7 but sits below the 18 nmol/L optimal threshold for a 19-year-old male. At this age, testosterone should ideally be in the upper half of the range. His SHBG at 21.5 is at the lower end of the 17.3 to 65.8 range, which means more of the testosterone that is present is bioavailable (free testosterone at 0.376 and bioavailable testosterone at 8.82 are both within their respective ranges). A mildly elevated prolactin can suppress testosterone production, so if the prolactin normalises on repeat, the testosterone may improve. It would be worth repeating both together.\n\nHis HOMA-IR, which stands for Homeostatic Model Assessment of Insulin Resistance and is calculated from fasting glucose and fasting insulin, is 2.46, above the 1.5 upper limit of the ideal range and approaching the 2.9 threshold for significant insulin resistance. His fasting insulin at 10.65 is within the laboratory range of 2.6 to 24.9 but above the 2 to 8 optimal band. At a BMI of 24.7 with a heavy training load and no alcohol, this is mildly surprising. The most likely driver is the dietary sugar intake (sugary food some days) combined with larger-than-average portions and only 2 to 3 portions of vegetables and fruit a day. His HbA1c at 33 confirms that overall glucose control is excellent, so this is early insulin resistance at the receptor level, not a blood sugar problem yet. It is the easiest finding in this report to reverse: reducing sugary food to rarely, increasing vegetable and fibre intake, and ensuring protein is the foundation of every meal will bring insulin down within three to six months.\n\nHis haemoglobin at 177 is above the 170 upper limit, his red blood cell count at 5.61 is above the 5.5 limit, and his haematocrit (the proportion of blood made up of red cells) at 0.506 is just above the 0.50 limit. Together, these describe a mildly polycythaemic picture. At 19, training hard eight or more times per week with 10,000 to 15,000 steps a day, and living at or near sea level, the most likely explanation is a combination of training-induced erythropoiesis (hard training stimulates red cell production) and mild dehydration at the time of the draw. His reticulocyte percentage at 0.86 and absolute reticulocyte count at 48.2 (marginally below the 50 lower limit) suggest that the marrow is not actively overproducing red cells right now, which argues against a primary bone marrow problem and supports the idea that the existing red cell mass is mildly concentrated. His MCHC at 350, marginally above the 345 upper limit, is consistent with this mild haemoconcentration. His iron studies add context: transferrin saturation at 17.63% is just below the 18% lower limit, with serum iron at 12 (just inside the 11.6 lower boundary) and ferritin at 57. This tells us that iron stores are adequate but not generous, and the body is using iron efficiently for the heavy training load. The slightly low saturation is not iron deficiency but rather iron being actively consumed by a high demand for red cell production. Increasing iron-rich foods (red meat, dark leafy greens, lentils) and pairing them with vitamin C will support this.\n\nHis amylase at 219 and lipase at 265 are both well above their respective upper limits of 118 and 60. Amylase and lipase are digestive enzymes produced mainly by the pancreas, and they are the standard markers used to assess pancreatic health. Elevated levels are most commonly associated with inflammation of the pancreas (pancreatitis), but in a 19-year-old with no abdominal pain, no nausea, no vomiting, no alcohol intake and a clean liver profile, acute pancreatitis is extremely unlikely. There are several benign explanations: macroamylasaemia, where amylase binds to immunoglobulins and is cleared slowly from the blood, is one of the more common causes of a persistently elevated amylase without symptoms, and it is harmless. Some individuals simply have a higher baseline for these enzymes as a normal variant. However, because both enzymes are elevated and by a meaningful margin, this should be discussed with his GP. A repeat test in four to six weeks, ideally with a salivary amylase isoenzyme to distinguish pancreatic from salivary sources, would be the sensible next step. If both remain elevated and he remains well, macroamylasaemia or a constitutional variant becomes the working explanation.\n\nHis urea at 10.5 is above the 8.2 upper limit. Urea is a waste product of protein metabolism, and at his training volume with larger-than-average portions on a mixed diet, a high-protein intake is the overwhelmingly likely explanation. His creatinine at 81 and eGFR above 90 confirm that kidney function is normal and the kidneys are clearing waste efficiently. His urea to creatinine ratio at 129.6 is above the 100 upper limit, which again is consistent with high protein intake rather than kidney disease. No action is needed beyond noting it.\n\nHis cystatin C at 1.15 is marginally above the 1.1 upper limit. Cystatin C is a protein produced by all nucleated cells at a fairly constant rate, and it is used as an alternative measure of kidney filtration because, unlike creatinine, it is not affected by muscle mass. At 1.15, this is only just above the threshold, and the combined eGFR of 94 and the creatinine-based eGFR above 90 both confirm normal kidney function. This is worth noting but does not suggest kidney disease. A repeat in twelve months will confirm.\n\nHis serum osmolality is calculated at 299.7 mOsm/kg, above the 275 to 295 reference range, which is consistent with mild dehydration and supports the haemoconcentration explanation for the elevated haemoglobin and haematocrit.\n\nHis cortisol at 675 is above the morning reference range upper limit of 619.4. Cortisol follows a strong circadian rhythm, peaking in the early morning and falling through the day. A single morning cortisol just above the range limit, in someone who trains hard and was likely slightly stressed by the blood draw itself, is not clinically significant. It does not suggest Cushing's syndrome or adrenal disease. If he had symptoms of excess cortisol (unexplained weight gain, facial rounding, purple stretch marks, muscle weakness), further investigation would be warranted, but he has none of these.\n\nHis vitamin D at 65 nmol/L is sufficient (above the 50 threshold) but below the 75 to 120 optimal range. He is already supplementing vitamin D, so the dose should be increased slightly to bring the level into the optimal zone. His B12 at 424 is within the laboratory range but below the 500 optimal threshold. His folate at 12 is within range. His total antioxidant activity at 2.13 is above the 1.77 upper limit, which is being driven by his omega-3, zinc and vitamin D supplementation and is not a concern.\n\nHis oestradiol at 135 is within the male range (below 146.1), his progesterone at 2.5, LH at 4.19 and FSH at 4.36 are all within range, and his DHEA-S at 9.4 is healthy for his age. His free androgen index at 68.37 is within the 30 to 150 range.","links":"The most striking thread in this report is the contrast between an exceptionally clean metabolic and cardiovascular profile and a handful of findings that each deserve their own explanation. The lipid panel is about as good as it can be at any age, with every modifiable marker in the ideal range, and the Lp(a) at 146 nmol/L is the one element that cannot be changed. Because it is inherited and unchangeable, the practical message is to keep every modifiable marker exactly where it is now, for life, so that the Lp(a) never has company. The Cardiovascular Risk Score of 35 would be below 20 without the Lp(a), and that tells us the only risk being built is genetic, not behavioural.\n\nThe mildly elevated haemoglobin, haematocrit and red cell count, alongside the slightly above-range serum osmolality and the marginally low transferrin saturation, fit together as one story: a young man training hard, sweating heavily, and arriving at the blood draw mildly dehydrated. The low absolute reticulocyte count confirms the marrow is not overproducing red cells, and the slightly low iron saturation reflects iron being consumed by the demands of a high training load rather than a storage deficit (ferritin at 57 is adequate). Better hydration on the morning of a future test and slightly more dietary iron would be expected to normalise all of these.\n\nThe neutropenia at 1.12 stands apart from the other findings. It is not explained by training, diet or dehydration, and while benign ethnic or constitutional neutropenia is the most likely answer in someone who is well and not getting recurrent infections, it needs confirming with a repeat. The low neutrophil count pulls the total white cell count to the lower end of normal and drives the below-range Systemic Immune-Inflammation Index, but the rest of the immune system, including lymphocytes, monocytes, immunoglobulins and inflammatory markers, is functioning well.\n\nThe elevated amylase and lipase are the one finding without an obvious lifestyle explanation. In the absence of any symptoms, alcohol or liver disease, they are most likely either a benign variant or macroamylasaemia, but they need a repeat to confirm. The mildly raised prolactin may be a one-off physiological spike or may be persistent, and this only becomes clear on repeat testing. If prolactin is genuinely elevated, it could be contributing to the below-optimal testosterone, which at 14.7 is adequate but lower than ideal for a 19-year-old.\n\nThe HOMA-IR of 2.46 is the one finding that is clearly lifestyle-driven and clearly within his control. With sugary food some days and only 2 to 3 portions of vegetables, reducing sugar and increasing fibre will bring insulin sensitivity back towards optimal within a few months. Everything else in the glucose and metabolic picture is healthy, so this is early and highly reversible.","lifestyle":"Reduce sugary food and drinks from some days to rarely; swap for fruit, nuts or Greek yoghurt when a craving hits. Anchor: when you reach for something sweet, the replacement is already in the fridge. Why: your fasting insulin at 10.65 and HOMA-IR of 2.46 are being driven partly by frequent sugar, and cutting it is the fastest way to bring insulin sensitivity back to optimal.\nAdd a portion of vegetables or salad to every meal, building from 2 to 3 portions a day towards 5 or more. Anchor: vegetables go on the plate before anything else. Why: fibre slows glucose absorption and lowers the insulin response to every meal, directly targeting the HOMA-IR.\nInclude a source of iron-rich food at least once a day: red meat two to three times a week, dark leafy greens, lentils or fortified cereals on other days, paired with a source of vitamin C (peppers, citrus, tomatoes) at the same meal. Anchor: whenever you plate protein, ask whether it contains iron. Why: your transferrin saturation at 17.6% is just below ideal, and your training load is consuming iron faster than the diet is replacing it.\nIncrease daily water intake on heavy training days by 500ml to 1 litre above your current level. Anchor: carry a bottle to every session and finish it before you leave. Why: mild dehydration is concentrating your blood, pushing haemoglobin, haematocrit and osmolality above range.\nMaintain your current protein intake at 1.6 to 2.0 g per kg of body weight, which is 128 to 160 g per day, spread across at least three meals. Anchor: every meal has a palm-and-a-half of protein before you add carbohydrate. Why: your urea at 10.5 confirms you are eating enough protein for the training load, and maintaining this supports the testosterone and muscle recovery your goals depend on.\nKeep your current training structure but ensure at least one full rest day per week where intensity is genuinely low (a walk, not a session). Anchor: pick the same day each week so it becomes non-negotiable. Why: your cortisol at 675 is just above the morning range, and a guaranteed rest day keeps the stress-recovery balance honest.\nContinue the vitamin D supplement but increase the dose to 3,000 to 4,000 IU daily, taken with your largest meal. Why: your level at 65 is sufficient but below the 75 to 120 optimal band, and the current dose is not quite getting you there.\nYour calorie target to maintain your current weight at this training load is approximately 2,800 to 3,000 kcal per day (BMR of roughly 1,860 multiplied by an activity factor of 1.6, adjusted for your high step count). If your goal is to stay at 80 kg while improving body composition, keep calories at maintenance and let the training do the work.","flags":"Neutrophils 1.12, below the lower limit of 2.0. Neutropenia in a well 19-year-old with no medications or infections is most likely benign constitutional or ethnic neutropenia, but at this level it needs confirming with a repeat full blood count through the GP and documenting in his medical record.\nLp(a) 146 nmol/L, above the 32 nmol/L ideal threshold and in the moderate risk category (90 to 200). This is genetically inherited and unchangeable. All modifiable lipid markers are ideal. Should be recorded permanently in his medical record and first-degree relatives offered testing.\nProlactin 428 uIU/mL, above the 375 upper limit. Mildly elevated and may be physiological (stress, exercise, recent food). Needs a repeat on a fasted, rested morning sample. If persistently elevated, pituitary MRI may be indicated. Could be contributing to below-optimal testosterone.\nAmylase 219 IU/L (upper limit 118) and lipase 265 U/L (upper limit 60), both significantly elevated. No symptoms, no alcohol, clean liver. Most likely macroamylasaemia or a constitutional variant, but needs a repeat in four to six weeks with salivary isoenzyme differentiation.\nHOMA-IR 2.46, above the 1.5 ideal upper limit, with fasting insulin at 10.65 (above the 8 optimal ceiling). Early insulin resistance, lifestyle-driven, fully reversible with dietary changes to sugar and fibre intake.\nHaemoglobin 177 g/L (upper limit 170), red blood cell count 5.61 (upper limit 5.5), haematocrit 0.506 (upper limit 0.50), with calculated serum osmolality 299.7 (upper limit 295). Consistent with mild dehydration and training-induced erythropoiesis. Reticulocytes not elevated, arguing against a primary marrow problem. Discuss with GP at the same appointment as the neutrophil repeat.\nTransferrin saturation 17.63%, marginally below the 18% lower limit, with serum iron at 12 (just inside range) and ferritin at 57. Reflects iron being consumed by a heavy training load rather than true deficiency. Increase dietary iron.\nTestosterone 14.7 nmol/L, within range but below the 18 optimal for a 19-year-old male. May be partly suppressed by the elevated prolactin. Repeat alongside prolactin.\nCystatin C 1.15, marginally above the 1.1 limit, but combined eGFR 94 and creatinine eGFR above 90 confirm normal kidney function. Monitor on retest.\nUrea 10.5 mmol/L, above the 8.2 upper limit. Urea to creatinine ratio 129.6 (upper limit 100). Both consistent with high dietary protein intake. Kidney function confirmed normal. No action needed.\nCortisol 675 nmol/L, marginally above the morning upper limit of 619.4. Single sample, likely reflects training load. No features of cortisol excess. No action needed unless symptoms develop.\nVitamin D 65 nmol/L, sufficient but below the 75 to 120 optimal range. Increase supplementation dose.\nMCHC 350 g/L, marginally above the 345 upper limit. Consistent with mild haemoconcentration. Not clinically significant.\nAbsolute reticulocyte count 48.2, marginally below the 50 lower limit. In context of mild polycythaemia without marrow overproduction, this is consistent with a concentrated sample rather than marrow suppression.\nTotal antioxidant activity 2.13, above the 1.77 upper limit. Driven by supplementation with omega-3, zinc and vitamin D. Not a concern.\nReassuring negatives: liver function entirely normal (ALT 28, GGT 14, FIB-4 0.48), HbA1c 33 confirming excellent long-term glucose control, thyroid function normal with both antibodies negative despite family history, all immunoglobulins within range, coeliac screen negative, rheumatoid factor negative, PSA 0.16, tumour markers CEA and CA19-9 within range, ESR 2, urine clean with no growth, PhenoAge 13 (six years younger than calendar age).\nNot reported on this occasion: potassium.","recommendations":"Discuss the neutrophil count of 1.12 with your GP and request a repeat full blood count to confirm whether this is your normal baseline. If it is consistently below 2.0 and you are well, it can be documented as benign neutropenia, but it needs to be on record.\nAsk your GP to record the Lp(a) result of 146 nmol/L permanently in your medical notes. This is genetically inherited and does not change. Mention it at every future cardiovascular risk discussion. Ask whether your parents and siblings should be tested.\nRequest a repeat prolactin on a fasted, rested morning sample (ideally after sitting quietly for 15 to 20 minutes before the draw). If it remains above 375, your GP may consider a pituitary MRI to exclude a small prolactinoma.\nRequest a repeat testosterone at the same time as the prolactin repeat, to see whether the two are linked.\nDiscuss the elevated amylase (219) and lipase (265) with your GP. Request a repeat in four to six weeks. If both remain elevated and you have no symptoms, a salivary amylase isoenzyme test can help distinguish macroamylasaemia from a pancreatic source.\nMention the persistently enlarged cervical lymph nodes to your GP so they can be examined and documented. In the context of normal inflammatory markers and a normal immune profile, they are very likely reactive, but formal examination adds reassurance.\nRetest in six months with at minimum: full blood count (neutrophils), prolactin, testosterone, amylase, lipase, fasting insulin, HOMA-IR, vitamin D and cystatin C. Your calorie target is approximately 2,800 to 3,000 kcal per day at maintenance, with a protein floor of 128 to 160 g per day (1.6 to 2.0 g per kg).","supplementation":"Vitamin D3 (cholecalciferol): increase to 3,000 to 4,000 IU daily, taken with your largest meal containing fat. Your level at 65 is sufficient but below the 75 to 120 optimal range, and the current dose is not reaching it. Always pair with vitamin K2.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken at the same meal as vitamin D. Vitamin K2 directs calcium into bones rather than soft tissue and is an essential companion to vitamin D supplementation.\nMagnesium glycinate: continue at 300 to 400 mg before bed. Your magnesium at 0.93 is within the optimal range (0.85 to 1.05), and at your training volume this supports muscle recovery and sleep quality.\nOmega-3 fish oil: continue at 2 to 3 g of combined EPA and DHA daily. Your lipid profile is already excellent, and omega-3 supports the anti-inflammatory environment reflected in your low CRP and ESR.\nZinc: continue current supplementation. Your training load increases zinc turnover through sweat losses.\nSublingual methylcobalamin (B12): 1,000 mcg daily. Your B12 at 424 is within the laboratory range but below the 500 optimal threshold, and sublingual methylcobalamin is the most efficiently absorbed form.\nDo not take iron supplements. Your ferritin at 57 is adequate and your transferrin saturation is only marginally below range. The answer is more iron-rich food paired with vitamin C, not supplementation, which at adequate stores risks pushing iron into excess.\nThe most important changes from this report are not supplements. They are cutting sugary food to bring insulin sensitivity back to optimal, increasing vegetable and fibre intake to at least five portions a day, eating more iron-rich foods with vitamin C, and staying well hydrated around training.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 49.3. Weakest systems: digestive 0%, kidney function 24%, lipids & cardiovascular 39%. Biggest drags: Urea, Lipoprotein(a), Haemoglobin, Cortisol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2708","lower_normal":"","upper_normal":"24","lower_optimal":"","upper_optimal":"19","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3958","units":"years","description":"PhenoAge is a composite biological age score developed from markers including albumin, creatinine, glucose, C-reactive protein, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 13, this is six years younger than his calendar age of 19, which is an excellent result. The clean metabolic profile, low inflammation, healthy albumin and glucose are the main drivers of this favourable gap. His training, sleep quality and absence of alcohol are all contributing to a body that is ageing more slowly than average.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100, built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built, not the ten-year probability of an event. At 35, this is within the acceptable range (below 40) but above the ideal threshold of 20. The entire gap between his score and ideal is being driven by the Lp(a) at 146 nmol/L, because every other input is excellent. At 19, the ten-year absolute risk of a cardiovascular event remains very low, but the gap between his score and ideal highlights the window for acting on the Lp(a) by keeping every modifiable factor as clean as it currently is, for life.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose is the concentration of sugar circulating in the bloodstream after fasting. At 5.2 mmol/L, this sits within the optimal range of 4.0 to 5.4 and confirms that the body is regulating blood sugar efficiently. At 19 with a BMI of 24.7 and a heavy training load, this is exactly where it should be.","low_causes":"Prolonged fasting, excessive exercise, reactive hypoglycaemia","high_causes":"High sugar intake, insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, or coated with sugar, over the previous two to three months. It gives a longer-term view of blood sugar control than a single fasting glucose. At 5.2%, this is well below the 6.0% pre-diabetes threshold and confirms excellent long-term glucose management.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Pre-diabetes, diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. At 33 mmol/mol, it sits comfortably below the 36 optimal ceiling and well below the 42 pre-diabetes threshold. This confirms excellent blood sugar control over the past two to three months.","low_causes":"Haemolytic anaemia, blood loss","high_causes":"Pre-diabetes, diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"10.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4537","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to take up glucose from the blood. Fasting insulin reflects how hard the pancreas has to work to keep blood sugar normal. At 10.65 mIU/L, this is within the laboratory range of 2.6 to 24.9 but above the optimal ceiling of 8. The pancreas is producing more insulin than ideal to maintain the healthy fasting glucose of 5.2, which is an early sign of insulin resistance at the cellular level. At 19, this is driven by dietary sugar intake and can be reversed with dietary changes.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, high sugar or refined carbohydrate diet, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4596","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4343","units":"ug/L","description":"C-Peptide is released in equal amounts to insulin when the pancreas produces it, making it a reliable measure of how much insulin the body is actually manufacturing. At 2.35 ug/L, this is within the laboratory range but slightly above the optimal threshold, consistent with the mildly elevated fasting insulin. It confirms the pancreas is working harder than ideal to manage blood sugar, supporting the early insulin resistance picture seen in the HOMA-IR.","low_causes":"Type 1 diabetes, low carbohydrate intake, very high insulin sensitivity","high_causes":"Insulin resistance, type 2 diabetes, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9867","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR stands for Homeostatic Model Assessment of Insulin Resistance and is calculated from fasting glucose and fasting insulin. It estimates how resistant the body's cells are to the effects of insulin. Below 1.0 is optimal and means the body is highly insulin-sensitive. Above 1.9 indicates early insulin resistance. At 2.46, this is above the ideal range and approaching the 2.9 threshold for significant insulin resistance. At 19 with a BMI of 24.7 and no alcohol, the primary driver is likely the frequency of sugary food in the diet. This is fully reversible with dietary changes.","low_causes":"High insulin sensitivity, low carbohydrate diet, fasting","high_causes":"Insulin resistance, high sugar or refined carbohydrate diet, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood sugar level over the past two to three months. At 5.6 mmol/L, this is within the optimal range and confirms healthy long-term blood sugar regulation.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4528","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG Index combines fasting triglycerides and glucose to estimate insulin resistance without requiring an insulin measurement. At 7.97, this is within the optimal range. Interestingly, while the direct HOMA-IR (which uses measured insulin) shows early resistance at 2.46, the TyG index is optimal because triglycerides are very low. This suggests the insulin resistance is mild and has not yet affected lipid metabolism.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"17.63","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3300","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is currently loaded with iron. It reflects how much iron is actively available in the bloodstream for use. At 17.63%, this is just below the 18% lower limit. In the context of a ferritin of 57 (adequate iron stores), this suggests iron is being consumed quickly by the demands of heavy training and red cell production rather than being truly deficient. Increasing iron-rich foods paired with vitamin C will improve absorption and bring this into range.","low_causes":"Iron deficiency, chronic disease, high training load with inadequate dietary iron","high_causes":"Haemochromatosis, iron overload, liver disease, excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3401","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.5601","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. At 12 umol/L, this is just inside the lower end of the 11.6 to 31.3 range. Like the transferrin saturation, it suggests iron is being used up quickly by the body's demands. Serum iron fluctuates through the day and with meals, so a single reading at the lower end is not alarming, but combined with the saturation it supports the case for increasing dietary iron.","low_causes":"Iron deficiency, chronic disease, heavy exercise, poor dietary intake","high_causes":"Haemochromatosis, iron supplementation, liver damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4578","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.4","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to where it is needed. At 2.71 g/L, this is within the optimal range. A normal transferrin alongside a slightly low saturation confirms that the transport system is healthy and the issue is simply that iron demand from heavy training slightly exceeds supply.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"61.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5140","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/L","description":"Total iron binding capacity measures the total amount of iron that transferrin could carry if every binding site were filled. At 61.4 umol/L, this is within the optimal range and confirms that the iron transport system has adequate capacity. This is a healthy result.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3722","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/mL","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve. At 57 ng/mL, this is within the optimal range of 50 to 200 for a male. It confirms that iron stores are adequate, even though the circulating iron (transferrin saturation) is slightly below ideal. The stores are there, but the body is drawing on them to support the heavy training load.","low_causes":"Iron deficiency, heavy exercise, poor dietary intake, blood loss","high_causes":"Haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"177","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7250","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. At 177 g/L, this is above the 170 upper limit for males. In a 19-year-old training hard with signs of mild dehydration (elevated osmolality), this most likely reflects haemoconcentration, where a relatively lower plasma volume makes the red cell concentration appear higher. The reticulocyte count is not elevated, arguing against the bone marrow actively overproducing red cells. Improved hydration around training would be expected to bring this into range.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, altitude training, polycythaemia vera, heavy training","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.61","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7033","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. At 5.61, this is marginally above the 5.5 upper limit. Consistent with the elevated haemoglobin and haematocrit, this is best explained by mild dehydration concentrating the blood. The reticulocyte count is not elevated, confirming the marrow is not in overdrive.","low_causes":"Anaemia, blood loss, bone marrow disorders, nutritional deficiency","high_causes":"Dehydration, polycythaemia, heavy training, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.506","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6867","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.42","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. At 0.506, this is just above the 0.50 upper limit. This is the third marker confirming a mildly concentrated sample, consistent with dehydration at the time of the draw. Better hydration around training will support normalisation of these values.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, heavy training","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"13.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4952","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"%","description":"RDW measures the variation in size among red blood cells. A narrow distribution means the cells are uniform, which is healthy. At 13.2%, this is within the optimal range and confirms that the red cells are a consistent size, arguing against iron deficiency or B12/folate deficiency anaemia.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"90.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fL","description":"MCV measures the average size of each red blood cell. At 90.2 fL, this is within the optimal range. Normal-sized red cells confirm adequate iron, B12 and folate supply, which is important context for the slightly low transferrin saturation: the cells are being built properly, just the circulating iron is marginally low.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"31.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6333","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin inside each red blood cell. At 31.5 pg, this is within the optimal range and confirms that each red cell is carrying a healthy amount of oxygen-transporting protein.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"350","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC measures the average concentration of haemoglobin within each red blood cell. At 350 g/L, this is marginally above the 345 upper limit. In the context of the mildly concentrated sample (elevated haemoglobin, haematocrit and osmolality), this is consistent with mild haemoconcentration and is not clinically significant on its own.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, haemoconcentration, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"210","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are the small cell fragments that help blood clot. At 210, this is within the optimal range and confirms healthy clotting capacity.","low_causes":"Viral infection, bone marrow disorders, medications, autoimmune conditions","high_causes":"Inflammation, infection, iron deficiency, post-surgery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"9.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"MPV measures the average size of platelets. Larger platelets tend to be younger and more active. At 9.6 fL, this is within the optimal range and confirms normal platelet production.","low_causes":"Bone marrow suppression, inflammatory bowel disease","high_causes":"Increased platelet turnover, immune thrombocytopenia, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3611","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells circulating in the blood. At 4.5, this is within the laboratory range but at the lower end and below the 5.0 optimal threshold. The total is being pulled down by the low neutrophil count (1.12), while all other white cell types are within range. This is not a sign of immune weakness on its own but is a reflection of the neutrophil finding.","low_causes":"Benign neutropenia, viral infection, intense exercise, bone marrow disorders","high_causes":"Infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2747","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5333","units":"x10^9/L","description":"Neutrophils are the most common type of white blood cell and the body's frontline defence against bacterial infection. They rush to sites of infection and destroy bacteria by engulfing them. At 1.12, this is significantly below the 2.0 lower limit, a finding called neutropenia. In a well 19-year-old with no medications, no alcohol, no recurrent infections and no signs of illness, the most likely explanation is benign constitutional neutropenia, a normal variant where the body simply runs a lower circulating neutrophil count. This is common and is not associated with increased infection risk at these levels. However, it needs confirming with a repeat through the GP so it can be documented as a baseline.","low_causes":"Benign ethnic/constitutional neutropenia, viral infection, medications, bone marrow disorders, autoimmune conditions","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6383","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, including fighting viruses and producing antibodies. At 2.83, this is within the optimal range and confirms a healthy adaptive immune system.","low_causes":"Viral infection (acute), immunodeficiency, steroid use, stress","high_causes":"Viral infection, chronic infection, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key"
