:"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4208","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that mature into macrophages in tissues, cleaning up debris and helping to coordinate the immune response. At 0.41, this is within the optimal range.","low_causes":"Bone marrow disorders, severe infection","high_causes":"Chronic infection, inflammation, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and mediating allergic responses. At 0.11, this is within the optimal range and, combined with the very low IgE, argues against any significant allergic or parasitic process.","low_causes":"Steroid use, acute stress","high_causes":"Allergies, parasitic infection, asthma, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4074","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell and play a role in allergic and inflammatory responses. At 0.03, this is within the optimal range.","low_causes":"Acute allergic reaction, steroid use","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3933","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are newly released young red blood cells, and their percentage reflects how actively the bone marrow is producing red cells. At 0.86%, this is within the normal range and confirms that the marrow is not in overdrive, which is important in the context of the slightly elevated haemoglobin: it argues against a primary bone marrow problem and supports dehydration as the cause of the concentrated blood.","low_causes":"Bone marrow suppression, iron deficiency, B12 deficiency, chronic disease","high_causes":"Active blood loss recovery, haemolytic anaemia, erythropoietin stimulation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"48.246","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3216","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells in circulation. At 48.2, this is marginally below the 50 lower limit. In the context of a mildly elevated red cell count and haemoglobin with no signs of marrow overproduction, this supports the picture of haemoconcentration rather than a red cell production problem. The marrow is producing at a normal rate; the total just looks marginally low against a concentrated sample.","low_causes":"Bone marrow suppression, nutritional deficiency, aplastic anaemia","high_causes":"Recovery from blood loss, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2083","units":"mm/hour","description":"The erythrocyte sedimentation rate measures how quickly red blood cells settle in a tube over one hour. Faster settling suggests more inflammation. At 2 mm/hour, this is very low and confirms minimal systemic inflammation, which is reassuring in the context of the lymph node concern.","low_causes":"","high_causes":"Infection, inflammation, autoimmune disease, malignancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1200","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein is a marker of low-grade inflammation produced by the liver. It is used to assess both infection-related inflammation and cardiovascular risk. At 1.2 mg/L, this is within the laboratory range but above the 1.0 optimal threshold. At 19 with a BMI of 24.7, this is a very minor elevation and could reflect post-training inflammation, a mild viral exposure, or nothing at all. It is not a concern but is worth noting as a baseline.","low_causes":"","high_causes":"Infection, chronic inflammation, cardiovascular risk, obesity, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/L","description":"Sodium is the main electrolyte that regulates fluid balance and blood pressure. At 142 mmol/L, this is within the optimal range and confirms healthy fluid and electrolyte regulation.","low_causes":"Overhydration, heart failure, kidney disease, diuretics","high_causes":"Dehydration, high salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. At 105 mmol/L, this is within the optimal range.","low_causes":"Vomiting, diuretics, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"25.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4879","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, keeping blood pH in a narrow healthy range. At 25.1 mmol/L, this is within the optimal range and confirms healthy acid-base balance.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"10.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8200","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product generated when the body breaks down protein. It is filtered out by the kidneys. At 10.5 mmol/L, this is above the 8.2 upper limit. In a 19-year-old training hard with larger-than-average portions on a mixed diet, a high-protein intake is the most likely explanation. His creatinine at 81 and eGFR above 90 confirm that the kidneys are filtering normally, so the elevated urea reflects the amount of protein being metabolised rather than any kidney problem.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4701","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. At 81 umol/L, this is within the optimal range and confirms healthy kidney filtration.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The estimated glomerular filtration rate uses creatinine to estimate how well the kidneys are filtering blood. Above 90 is considered optimal kidney function. This confirms healthy kidneys at 19.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5227","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a protein produced by all cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not significantly affected by muscle mass, making it a useful alternative measure of kidney function. At 1.15, this is marginally above the 1.1 upper limit. However, the combined eGFR of 94 and the creatinine eGFR above 90 both confirm that kidney filtration is normal. A marginally elevated cystatin C can occur with inflammation (CRP 1.2) or thyroid function changes and does not, on its own, indicate kidney disease. It is worth monitoring on a future retest.","low_causes":"","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"372","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4883","lower_normal":"220","upper_normal":"547","lower_optimal":"220","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4964","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in protein-rich foods and produced during cell turnover. At 372 umol/L, this is within the optimal range for a male (200 to 380). Keeping it in this zone reduces the long-term risk of gout and kidney stones.","low_causes":"Low purine diet, liver disease, medications","high_causes":"High purine diet, kidney disease, gout, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7833","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and cystatin C to give the most accurate estimate of kidney filtration. At 94 mL/min, this is above the 90 optimal threshold and confirms healthy kidney function. The marginally elevated cystatin C on its own does not translate into a reduced filtration rate when combined with creatinine.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"129.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8311","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish whether an elevated urea is due to kidney disease or other causes like high protein intake or dehydration. At 129.6, this is above the 100 upper limit. With normal creatinine and eGFR, this is driven by the high urea from dietary protein intake and possibly mild dehydration, not kidney disease.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4400","upper_optimal_position":"0.6133","units":"g/L","description":"Total protein measures the combined albumin and globulin in the blood. At 72 g/L, this is within the optimal range and confirms adequate protein nutrition and healthy liver and immune function.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Dehydration, chronic infection, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, nutrients and drugs, and maintains blood pressure by holding fluid in the blood vessels. At 43 g/L, this is within the optimal range and reflects healthy liver synthetic function and adequate nutrition.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5370","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/L","description":"Globulins include immunoglobulins (antibodies) and transport proteins. At 29 g/L, this is within the optimal range and, alongside the normal immunoglobulin levels, confirms a healthy immune protein profile.","low_causes":"Immunodeficiency, malnutrition, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"156","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8571","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in bone, liver and bile ducts. At 156 IU/L, this is above the 116 upper limit of the adult reference range. However, at 19, bone growth may not yet be complete, and the growth plates (epiphyses) at the ends of long bones are a rich source of ALP. In adolescents and young adults up to the early twenties, ALP levels can remain elevated as a normal reflection of ongoing bone remodelling. With every other liver marker in healthy range (ALT 28, GGT 14, bilirubin 12, albumin 43), this is almost certainly bone-derived rather than liver-derived and is a normal finding for his age.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bone growth (adolescence), bone disease, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. At 12 umol/L, this is within the optimal range and confirms healthy red cell turnover and liver processing.","low_causes":"","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is a liver enzyme that leaks into the blood when liver cells are damaged. At 28 IU/L, this is within the optimal range for a male (below 30) and confirms the liver is under no metabolic strain.","low_causes":"","high_causes":"Liver disease, fatty liver, hepatitis, medications, alcohol, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4896","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart and muscles. At 28 IU/L, this is within the optimal range. At his training volume, a mild elevation would not be unusual, so 28 is a healthy result.","low_causes":"","high_causes":"Liver disease, muscle damage, heart disease, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1655","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3448","units":"","description":"The FIB-4 score uses age, ALT, AST and platelet count to estimate the likelihood of liver fibrosis (scarring). At 0.48, this is well within the ideal range and confirms there is no sign of liver fibrosis whatsoever.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, advanced liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3816","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4348","units":"IU/L","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme particularly sensitive to alcohol, medications and bile duct problems. At 14 IU/L, this is well within the optimal range (below 25) and confirms the liver is under no strain from any source. In someone who does not drink alcohol, this is expected but still reassuring.","low_causes":"","high_causes":"Alcohol, liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"219","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is a digestive enzyme that breaks down starch. It is produced mainly by the pancreas and salivary glands. At 219 IU/L, this is nearly double the 118 upper limit. In a 19-year-old with no abdominal pain, nausea or vomiting, no alcohol intake and a clean liver profile, acute pancreatitis is extremely unlikely. The most common benign explanation is macroamylasaemia, a harmless condition where amylase binds to immunoglobulins in the blood and is cleared more slowly, giving a persistently elevated reading. Some individuals also have a constitutionally higher baseline. However, because the elevation is significant and both amylase and lipase are raised, a repeat test in four to six weeks with salivary isoenzyme differentiation is recommended through the GP.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, macroamylasaemia, salivary gland disease, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"265","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3475","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a digestive enzyme that breaks down fats, produced almost exclusively by the pancreas. It is the more specific of the two pancreatic enzymes for pancreatic disease. At 265 U/L, this is over four times the 60 upper limit. As with the amylase, in the complete absence of symptoms, alcohol and liver disease, acute pancreatitis is very unlikely. Some individuals have a constitutionally elevated lipase, and macrolipasaemia (analogous to macroamylasaemia) is another benign explanation. A repeat test alongside the amylase will clarify whether this is a persistent finding, and if both remain elevated without symptoms, it can be accepted as a baseline after further investigation.","low_causes":"","high_causes":"Acute pancreatitis, chronic pancreatitis, macrolipasaemia, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5731","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is the mineral essential for bone strength, muscle contraction, nerve signalling and blood clotting. At 2.49 mmol/L, this is within the optimal range and confirms healthy calcium regulation, supported by the normal parathyroid hormone and vitamin D levels.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate picture of the physiologically active calcium. At 2.47 mmol/L, this is within the optimal range and confirms healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4943","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.5900","units":"mmol/L","description":"Phosphate works with calcium to build and maintain strong bones and teeth, and it plays a key role in energy production within cells. At 1.2 mmol/L, this is within the optimal range.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malnutrition, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excess vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.93","within_no tion":"0.6167","units":"mOsm/kg","description":"Serum osmolality measures the concentration of dissolved particles in the blood. At 299.7 mOsm/kg, this is above the 275 to 295 reference range, consistent with mild dehydration. This supports the picture of haemoconcentration seen in the elevated haemoglobin, haematocrit and urine specific gravity. Better hydration, particularly around training, will bring this into range.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6500","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function and mood regulation. At 65 nmol/L, this is above the 50 sufficiency threshold but below the 75 to 120 optimal range. He is already supplementing, which means the current dose is maintaining sufficiency but not reaching optimal. Increasing to 3,000 to 4,000 IU daily, taken with a meal containing fat for absorption, should bring this into the ideal zone within three months.","low_causes":"Low sun exposure, dark skin, obesity, poor dietary intake, malabsorption","high_causes":"Excess supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3.892","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5922","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3796","upper_optimal_position":"0.6196","units":"pmol/L","description":"Parathyroid hormone regulates calcium and phosphate levels in the blood. When calcium drops, PTH rises to pull calcium from bones and increase absorption from the gut. At 3.892 pmol/L, this is within the optimal range and confirms that the parathyroid glands are responding appropriately to healthy calcium levels.","low_causes":"Hypercalcaemia, magnesium deficiency, post-thyroid surgery","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"424","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4309","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. At 424 pg/mL, this is within the laboratory range but below the 500 optimal threshold. On a mixed diet that includes animal products, B12 intake is usually adequate, but the level suggests absorption could be better. Adding a sublingual methylcobalamin supplement at 1,000 mcg daily is the most effective way to bring this into the optimal zone, as the sublingual form bypasses any gut absorption issues.","low_causes":"Vegan or vegetarian diet, malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position" lthy fat metabolism. Low triglycerides are a strong positive marker for metabolic health.","low_causes":"Low fat diet, hyperthyroidism, malabsorption","high_causes":"High sugar or carbohydrate diet, obesity, alcohol, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2051","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. At 0.32 mmol/L, this is within the optimal range and reflects the healthy triglyceride level.","low_causes":"Low fat diet, hyperthyroidism","high_causes":"High carbohydrate diet, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7692","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6731","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol that removes excess cholesterol from artery walls and transports it back to the liver for disposal. At 1.6 mmol/L, this is above the 1.4 optimal threshold for a male and in the desirable high range. This is an excellent result that reflects his active lifestyle and clean metabolic profile.","low_causes":"Sedentary lifestyle, obesity, smoking, high refined carbohydrate diet","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4347","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the cholesterol that deposits into artery walls and drives atherosclerosis. At 1.26 mmol/L, this is well within the optimal range (below 2.6) and far below the 3.0 upper limit. This is an excellent result.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Genetics, high saturated fat diet, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2222","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio summarises the balance between total and protective cholesterol. At 2.0, this is well within the optimal range and is an excellent marker of cardiovascular health.","low_causes":"","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"%","description":"This shows what proportion of total cholesterol is made up of protective HDL. At 50%, half of all circulating cholesterol is the protective type. This is an outstanding result.","low_causes":"Obesity, sedentary lifestyle, poor diet","high_causes":"Regular exercise, healthy diet, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL. It captures all the atherogenic (artery-damaging) cholesterol in one number, including LDL, VLDL and lipoprotein(a). At 1.6 mmol/L, this is well within the optimal range and confirms an excellent atherogenic profile.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Genetics, high saturated fat diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6458","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. It reflects the functional capacity of the protective cholesterol system. At 1.55 g/L, this is above the 1.4 optimal threshold and confirms a robust anti-atherogenic profile.","low_causes":"Sedentary lifestyle, obesity, smoking, genetic variants","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2556","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every atherogenic lipoprotein particle (LDL, VLDL and Lp(a)). Because each particle carries exactly one ApoB molecule, this marker gives a direct count of how many potentially damaging particles are in the blood, making it the single best measure of atherogenic burden. At 0.46 g/L, this is well below the 0.8 optimal target and is an excellent result. It confirms that the number of atherogenic particles is very low.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Genetics, high saturated fat diet, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aporatio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.296774","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2120","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"","description":"The ApoB to ApoA1 ratio balances the number of atherogenic particles (ApoB) against the protective capacity (ApoA1). At 0.30, this is well within the lower-risk zone (below 0.7) and well below the ideal 0.5 threshold. This is the single best summary of cardiovascular lipid risk and it is excellent.","low_causes":"","high_causes":"High ApoB, low ApoA1, poor diet, sedentary lifestyle, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"146.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined particle similar to LDL but with an extra protein, apolipoprotein(a), attached. It deposits cholesterol into artery walls, promotes blood clotting by interfering with the body's natural clot-dissolving pathway, and drives inflammation within the vessel lining. Unlike LDL and ApoB, Lp(a) does not respond to diet, exercise or lifestyle changes. It is set by genetics and remains essentially the same for life. At 146 nmol/L, this is in the moderate risk category (90 to 200 nmol/L). The importance of knowing this at 19 is that every modifiable risk factor can be managed proactively for decades. His LDL, ApoB, HDL and triglycerides are all excellent, which means the only cardiovascular risk being built is genetic and unmodifiable. This should be recorded permanently in his medical record, and first-degree relatives (parents, siblings) should be offered Lp(a) testing.","low_causes":"","high_causes":"Genetics (inherited, does not change with lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio","group":"INFLAMMATION","result":"0.40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2873","lower_normal":"0.78","upper_normal":"3.53","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3600","upper_optimal_position":"0.4812","units":"","description":"The neutrophil-to-lymphocyte ratio divides neutrophils by lymphocytes to give a quick measure of the balance between innate and adaptive immunity. At 0.40, this is below the 1.0 lower limit, driven entirely by the low neutrophil count of 1.12 against healthy lymphocytes of 2.83. This does not reflect an immune imbalance per se but rather the constitutional neutropenia pulling the ratio down. If the neutrophil count is confirmed as his baseline on repeat testing, this ratio will always sit below range and can be accepted as normal for him.","low_causes":"Benign neutropenia, high lymphocyte count","high_causes":"Infection, systemic inflammation, physiological stress, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"74.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3778","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet-to-lymphocyte ratio is a marker of systemic inflammation. At 74.2, this is within the reference range. With healthy platelets (210) and lymphocytes (2.83), the balance reflects normal cell counts rather than any pathology. No concern.","low_causes":"High lymphocyte count, low platelet count","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"83","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3220","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The Systemic Immune-Inflammation Index (SII) combines neutrophils, platelets and lymphocytes into a single score. At 83, this is below the 100 lower limit of the reference range. This is being driven entirely by the low neutrophil count of 1.12, which pulls the numerator down. It does not reflect excessive inflammation or immune suppression; it is a mathematical consequence of the neutropenia. If his neutrophil count is confirmed as constitutionally low, this index will always sit below range for him.","low_causes":"Low neutrophil count (benign neutropenia), immunosuppression","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1467","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is an indirect marker of insulin resistance and small dense LDL particles. A lower ratio is better. At 0.44, this is well within the optimal range (below 0.87) and confirms healthy metabolic processing of fats despite the mildly elevated HOMA-IR. This is a strong positive.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2125","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It captures the cholesterol in triglyceride-rich remnant particles, which are increasingly recognised as an independent cardiovascular risk factor. At 0.34 mmol/L, this is within the optimal range (below 0.5) and is an excellent result.","low_causes":"","high_causes":"High triglycerides, metabolic syndrome, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"0.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1317","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL removes the cholesterol carried inside Lp(a) particles from the total LDL number, showing only the modifiable portion. At 0.79 mmol/L, this is well within the optimal range and confirms that the lifestyle-modifiable LDL is exceptionally low. The gap between the standard LDL of 1.26 and this corrected figure of 0.79 represents the cholesterol carried by Lp(a), which is genetic and unchangeable. This is important: it means there is very little he can do to further reduce LDL because it is already about as low as lifestyle can achieve.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.359","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5099","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The atherogenic index of plasma uses triglycerides and HDL to estimate the balance between pro-atherogenic and anti-atherogenic lipoproteins. At -0.359, this is within the optimal range and indicates a low-risk atherogenic profile. Negative values reflect a predominance of protective large HDL particles.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"0.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1129","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The LDL to HDL ratio compares atherogenic LDL against protective HDL. At 0.79, this is well within the optimal range and is an excellent result, confirming that protective cholesterol far outweighs the atherogenic portion.","low_causes":"","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4238","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main types of blood protein. At 1.48, this is within the optimal range and reflects a healthy balance between liver-produced albumin and immune-related globulins.","low_causes":"Liver disease, chronic infection, autoimmune disease","high_causes":"Immunodeficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.333","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1110","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"The APRI score (AST to Platelet Ratio Index) estimates liver fibrosis using AST and platelet count. At 0.333, this is well within the optimal range (below 0.5) and confirms no evidence of liver fibrosis.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-3.229","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"score","description":"The NAFLD Fibrosis Score estimates the likelihood of significant liver fibrosis in people at risk of non-alcoholic fatty liver disease, using age, BMI, platelets, albumin, AST and ALT. At -3.229, this is within the optimal range and confidently rules out significant fibrosis.","low_causes":"","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The De Ritis ratio divides AST by ALT. At 1.0, this is within the optimal range. A ratio above 2 can suggest alcoholic liver disease or cirrhosis, so a ratio of 1.0 is reassuring and confirms a healthy liver.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ck","name":"Creatine Kinase","group":"HEMATOLOGY","result":"290","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6310","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"U/L","description":"Creatine kinase is an enzyme released from muscle cells during exercise or muscle damage. At 290 U/L, this is within the laboratory range of 40 to 320 but above the optimal ceiling of 200. At his training volume (five or more resistance sessions and three cardio sessions per week at hard intensity), this level is expected and reflects normal training-related muscle turnover rather than injury. If he had rested for 48 hours before the test, it would likely be lower.","low_causes":"Sedentary lifestyle, low muscle mass","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"16.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index divides MCV by red blood cell count and is used to help distinguish iron deficiency anaemia from thalassaemia trait when MCV is low. His MCV is normal at 90.2, so this index does not apply and is reported for completeness only.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4970","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues. At 17 pmol/L, this sits within the optimal range of 14 to 20 and confirms healthy thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"3.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5453","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland to tell the thyroid how much hormone to make. When the thyroid is underactive, TSH rises to push it harder. At 3.24, this is within the laboratory range of 0.55 to 4.78 but above the 2.5 optimal ceiling. In isolation, a TSH of 3.24 is not abnormal, but given the family history of thyroid disease, it is worth monitoring. Both thyroid antibodies are negative, which is reassuring and means there is no current autoimmune attack on the thyroid. The free T4 at 17 and free T3 at 6.6 both confirm the thyroid is producing adequate hormones, so this TSH level is not causing any functional problem at present.","low_causes":"Hyperthyroidism, pituitary disease, excessive thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 (triiodothyronine) is the most active thyroid hormone, converted from T4 in tissues throughout the body. It drives metabolism, energy production and heat generation. At 6.6 pmol/L, this is within the laboratory range but marginally above the 6.5 upper bound of the optimal band. In practice the difference is small, and at 19 with heavy training a high-normal T3 is expected and supports the steady energy he reports.","low_causes":"Hypothyroidism, severe illness, low calorie intake, T4 to T3 conversion issues","high_causes":"Hyperthyroidism, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"TPO antibodies are immune proteins that attack thyroid peroxidase, an enzyme the thyroid needs to make hormones. Positive TPO antibodies are the hallmark of Hashimoto's thyroiditis, the most common cause of underactive thyroid. At below 6.6, these are negative, which is particularly reassuring given the family history of thyroid disease. It means there is no current autoimmune attack on the thyroid.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid autoimmunity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies attack thyroglobulin, a protein the thyroid uses to produce hormones. Like TPO antibodies, they are a marker of thyroid autoimmunity. At below 1.3, these are negative. More than 80% of the population have undetectable thyroglobulin antibodies, and this result confirms no autoimmune thyroid activity.","low_causes":"","high_causes":"Hashimoto's thyroiditis, thyroid autoimmunity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.388","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5840","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27 sponse.","low_causes":"Immunodeficiency, chronic lymphocytic leukaemia","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is the immunoglobulin that protects mucous membranes in the gut, respiratory tract and urinary system. At 1.8 g/L, this is within the laboratory range. An adequate IgA level is also necessary for the coeliac screening test to be valid, and his was positive for IgA, so the negative coeliac result is reliable.","low_causes":"IgA deficiency (genetic), medications","high_causes":"Chronic infection, liver disease, autoimmune conditions, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"9.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0453","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"IU/mL","description":"IgE is the immunoglobulin associated with allergic reactions and parasitic infections. At 9.06 IU/mL, this is very low and well within the optimal range (below 50). This argues strongly against any significant allergic process or parasitic infection.","low_causes":"","high_causes":"Allergies, asthma, eczema, parasitic infection, some autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"<4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/mL","description":"Rheumatoid factor is an antibody associated with rheumatoid arthritis and other autoimmune conditions. At below 4 IU/mL, this is negative and rules out rheumatoid arthritis as a cause of any joint symptoms.","low_causes":"","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.201","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0140","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"CU","description":"Tissue transglutaminase IgA is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten. At 0.201 CU, this is strongly negative (well below the 7.19 threshold) and effectively rules out coeliac disease while on a gluten-containing diet.","low_causes":"","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"2.13","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9220","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, which cause cellular damage. At 2.13 mmol/L, this is above the 1.77 upper limit of the reference range. This is being driven by his supplementation with omega-3 fish oil, zinc and vitamin D, all of which contribute to antioxidant capacity. This is not a concern and is a positive reflection of his supplement regimen.","low_causes":"Oxidative stress, poor diet, smoking, chronic disease","high_causes":"Antioxidant supplementation, high intake of antioxidant-rich foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"675","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7058","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3717","upper_optimal_position":"0.6179","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a strong daily rhythm, peaking in the early morning and falling through the day. At 675 nmol/L, this is marginally above the 619.4 morning upper limit. A single morning cortisol just above range, in someone who trains hard, is not clinically significant. There are no symptoms of cortisol excess (unexplained weight gain, facial rounding, muscle weakness, purple stretch marks), and the result is best interpreted as a normal variant within the morning peak.","low_causes":"Adrenal insufficiency, pituitary disease, chronic fatigue","high_causes":"Stress, intense exercise, blood draw anxiety, Cushing's syndrome, steroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"135","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4620","lower_normal":"0","upper_normal":"146.1","lower_optimal":"","upper_optimal":"130","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men, important for bone density, brain function and joint health. In males, it is produced through conversion of testosterone by an enzyme called aromatase. At 135 pmol/L, this is within the laboratory range (below 146.1) and within a reasonable zone. It is at the upper end of the reference, which is consistent with active aromatase conversion alongside the current testosterone level.","low_causes":"Low testosterone, low body fat, aromatase inhibitor use","high_causes":"Obesity, high body fat, liver disease, excess testosterone, aromatase overactivity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3456","upper_optimal_position":"0.6243","units":"nmol/L","description":"Progesterone in males is produced in small amounts by the adrenal glands and testes. It plays a role in brain function and serves as a precursor to other hormones including cortisol and testosterone. At 2.5 nmol/L, this is within the optimal range for a male.","low_causes":"Adrenal insufficiency","high_causes":"Adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"4.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4483","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3547","upper_optimal_position":"0.5684","units" mol/L optimal threshold for a 19-year-old male. At this age, testosterone should ideally be in the upper half of the range. The mildly elevated prolactin at 428 could be contributing to the below-optimal level, as prolactin can suppress the pituitary signals that drive testosterone production. A repeat of both prolactin and testosterone on a fasted, rested morning will clarify whether this is a persistent finding or a one-off.","low_causes":"Stress, poor sleep, obesity, pituitary disease, high prolactin, medications, varicocele","high_causes":"Anabolic steroid use, tumours, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"428","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7202","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3384","upper_optimal_position":"0.5909","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, primarily known for stimulating breast milk production in women but present in men at low levels. In men, elevated prolactin can suppress testosterone production and affect libido. At 428 uIU/mL, this is above the 375 upper limit. Mildly elevated prolactin can be caused by stress at the time of the blood draw, recent intense exercise, recent food intake, or disrupted sleep. At 428, the elevation is modest and falls within the range where a physiological explanation is most likely. However, persistently elevated prolactin can occasionally reflect a small benign pituitary growth called a prolactinoma, so it should be repeated on a fasted, rested morning sample through the GP. If it remains elevated on repeat, further investigation may be appropriate.","low_causes":"Dopamine agonist medication","high_causes":"Stress, exercise, prolactinoma, medications (antipsychotics, antidepressants), hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"68.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4399","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The free androgen index estimates how much testosterone is biologically available by taking into account the SHBG level. At 68.37, this is within the optimal range. Despite the below-optimal total testosterone, the low SHBG (21.5) means that a larger proportion of the testosterone that is present is unbound and available for use, which partly compensates.","low_causes":"High SHBG, low testosterone, hypogonadism","high_causes":"Low SHBG, high testosterone, PCOS (females), anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA-S","group":"HORMONES","result":"9.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5638","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3","upper_optimal":"11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3992","upper_optimal_position":"0.6049","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. At 9.4 umol/L, this is within the optimal range and is healthy for a 19-year-old. DHEA-S peaks in the early twenties and gradually declines with age, so this level reflects a healthy adrenal function.","low_causes":"Adrenal insufficiency, aging, chronic disease","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"21.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3622","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3863","upper_optimal_position":"0.5924","units":"nmol/L","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds testosterone and oestradiol, controlling how much is free and active. At 21.5 nmol/L, this is within the laboratory range but below the 25 optimal threshold. Low SHBG means more of the circulating testosterone is bioavailable, which is why the free androgen index at 68 and free testosterone at 0.376 are both healthy despite the below-optimal total testosterone. Low SHBG can be associated with insulin resistance, which is consistent with the HOMA-IR of 2.46 in this report. As insulin sensitivity improves with dietary changes, SHBG may rise.","low_causes":"Insulin resistance, obesity, hypothyroidism, anabolic steroid use, high androgen levels","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.376","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4234","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.25","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3773","upper_optimal_position":"0.5421","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to SHBG or albumin, making it immediately available to act on tissues. At 0.376 nmol/L, this is within the optimal range, confirming that despite the total testosterone being below optimal, enough is bioavailable for normal function. The low SHBG is the reason: less binding means more free hormone.","low_causes":"Low const data = REPORT_DATA;

  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}
