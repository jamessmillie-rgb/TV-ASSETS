al_position":"0.6666666667","lower_optimal_position":"0.3520","upper_optimal_position":"0.5770","units":"umol/L","description":"Total iron binding capacity measures the maximum amount of iron that transferrin in the blood can carry. It reflects the body's iron transport capacity and indirectly indicates iron status. Stephen's TIBC at 70.4 umol/L is within the laboratory range, consistent with his normal transferrin level.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"182","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3427","upper_optimal_position":"0.5260","units":"ng/mL","description":"Ferritin is the body's primary iron storage protein. One molecule of ferritin can hold up to 4,500 iron atoms, making it the most efficient form of iron reserve. The blood level reflects how much iron the body has in storage. Stephen's ferritin at 182 ng/mL is within the optimal range of 50 to 200 for men, confirming healthy iron reserves without excess.","low_causes":"Iron deficiency, chronic bleeding, malabsorption, vegetarian diet, heavy exercise","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"184","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3862","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3449","upper_optimal_position":"0.5816","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the early morning and declining through the day. It regulates blood sugar, immune function, inflammation, and energy availability. Stephen's cortisol at 184 nmol/L is within the morning reference range but sits toward the lower end. This could reflect the timing of the blood draw or a naturally lower cortisol rhythm. In the context of his reported fatigue, it is worth noting but does not indicate adrenal insufficiency, especially with all other markers healthy.","low_causes":"Adrenal insufficiency, chronic stress (adrenal fatigue pattern), late-morning blood draw, pituitary dysfunction","high_causes":"Acute stress, chronic psychological stress, Cushing's syndrome, corticosteroid medication, depression, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3252","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men. In men, it is produced from testosterone by an enzyme called aromatase and plays important roles in bone health, brain function, and cardiovascular protection. However, excessively high levels in men can suppress testosterone production and cause symptoms. Stephen's oestradiol at 95 pmol/L is well within the reference range and within the optimal ceiling, reflecting a healthy balance.","low_causes":"Low testosterone (as precursor), aromatase inhibitor use, extreme leanness","high_causes":"Obesity (increased aromatase activity), liver disease, alcohol, testosterone replacement therapy, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.17","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3646","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3370","upper_optimal_position":"0.5713","units":"nmol/L","description":"Progesterone in men is a precursor hormone that plays a role in the production of other hormones including testosterone and cortisol. It also has calming effects on the nervous system and supports sleep. Stephen's progesterone at 1.17 nmol/L is within the laboratory range. In men, progesterone levels are naturally low and carry less clinical significance than in women.","low_causes":"Adrenal insufficiency, aging, stress","high_causes":"Adrenal hyperplasia, certain testicular tumours, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"4.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4392","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3397","upper_optimal_position":"0.5449","units":"mIU/mL","description":"Luteinising hormone, LH, is produced by the pituitary gland in the brain and stimulates the testes to produce testosterone. It is part of the feedback loop that regulates testosterone levels. Stephen's LH at 4.65 is within the optimal range, indicating that the pituitary is functioning normally and sending appropriate signals to the testes. The fact that LH is mid-range while testosterone is below optimal suggests that the testes may be producing slightly less testosterone per unit of LH stimulation than ideal, which is a normal part of aging.","low_causes":"Pituitary dysfunction, anabolic steroid use, extreme stress, obesity","high_causes":"Primary testicular failure, aging, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"9.47","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5098","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"1.5","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3340","upper_optimal_position":"0.5161","units":"mIU/mL","description":"Follicle stimulating hormone, FSH, is produced by the pituitary gland and in men stimulates sperm production in the testes. Like LH, it is part of the hormonal feedback loop. Stephen's FSH at 9.47 is within the laboratory range. At 52, FSH can naturally trend upward as testicular function gradually changes with age. This is consistent with his age and not a concern.","low_causes":"Pituitary dysfunction, anabolic steroid use, extreme stress","high_causes":"Primary testicular failure, aging, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"14.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4432","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass maintenance, bone density, red blood cell production, fat distribution, cognitive function, mood, and libido. Stephen's testosterone at 14.7 nmol/L is within the laboratory range of 8.4 to 28.7 but falls below the 18 nmol/L optimal threshold. At 52, some decline from peak levels is expected, but sitting at 14.7 is lower than ideal and could be contributing to his difficulty losing weight, his brain fog, and his hair thinning. Testosterone supports lean muscle maintenance, which directly affects metabolic rate, and also influences cognitive clarity and mood. The same lifestyle interventions that address his insulin resistance, more resistance training, adequate sleep, and a modest calorie deficit with high protein, are also the most effective natural strategies for supporting testosterone levels.","low_causes":"Aging, obesity, insulin resistance, poor sleep, chronic stress, excessive alcohol, certain medications, pituitary dysfunction","high_causes":"Anabolic steroid use, testosterone replacement therapy, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"98","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3818","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3385","upper_optimal_position":"0.5538","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland. In men, elevated prolactin can suppress testosterone production and cause symptoms such as reduced libido and fatigue. Stephen's prolactin at 98 uIU/mL is within the laboratory range and at a healthy level, ruling out prolactin-related suppression of testosterone.","low_causes":"Generally not clinically significant in isolation","high_causes":"Pituitary tumour (prolactinoma), hypothyroidism, certain medications (antipsychotics, antidepressants), stress, chest wall irritation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"39.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3592","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3417","upper_optimal_position":"0.5278","units":"","description":"The free androgen index is calculated from total testosterone and SHBG. It provides an estimate of the biologically active testosterone. Stephen's FAI at 39.1 is within the laboratory range but just below the 40 optimal floor, consistent with his below-optimal total testosterone. This reflects slightly less androgen activity available to tissues than ideal.","low_causes":"Low testosterone, high SHBG, aging, liver disease, hyperthyroidism","high_causes":"High testosterone, low SHBG, insulin resistance, obesity, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA-Sulphate","group":"HORMONES","result":"4.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4351","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3531","upper_optimal_position":"0.4840","units":"umol/L","description":"DHEA-Sulphate is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It naturally declines with age. Stephen's DHEA-S at 4.4 umol/L, equivalent to approximately 1,621 ug/dL, is within the laboratory range. At 52, some decline from peak levels is normal. DHEA-S supports immune function, bone health, and overall vitality.","low_causes":"Aging, adrenal insufficiency, chronic stress, corticosteroid use","high_causes":"Adrenal hyperplasia, adrenal tumours, PCOS (in women), supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"37.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4189","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3836","upper_optimal_position":"0.5788","units":"nmol/L","description":"Sex hormone binding globulin is a protein produced by the liver that binds to sex hormones, primarily testosterone and oestradiol, in the blood. When bound to SHBG, these hormones are inactive. Only the unbound, or free, fraction is available to act on tissues. Stephen's SHBG at 37.6 nmol/L is within the optimal range of 25 to 55 for men. This is a healthy level, not too high (which would bind too much testosterone) or too low (which is associated with insulin resistance and metabolic syndrome).","low_causes":"Insulin resistance, obesity, hypothyroidism, corticosteroid use, anabolic steroid use","high_causes":"Aging, liver disease, hyperthyroidism, oral oestrogen use, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.278","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3877","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3521","upper_optimal_position":"0.5604","units":"nmol/L","description":"Free testosterone is the fraction of total testosterone not bound to SHBG or albumin, and therefore available to enter cells and exert its effects. It is calculated from total testosterone, SHBG, and albumin. Stephen's free testosterone at 0.278 nmol/L is within the laboratory range but just below the 0.3 optimal floor. This is consistent with his below-optimal total testosterone and reflects that the amount of testosterone available to his tissues is slightly lower than ideal.","low_causes":"Low total testosterone, high SHBG, aging, obesity, chronic illness","high_causes":"High total testosterone, low SHBG, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4715","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4795","units":"mIU/L","description":"Thyroid stimulating hormone is produced by the pituitary gland and tells the thyroid how much hormone to make. It works as a feedback signal: when thyroid hormone levels are low, TSH rises to stimulate more production. Stephen's TSH at 2.3 mIU/L is within the optimal range of 1.0 to 2.5, indicating the pituitary is satisfied with the thyroid output and does not need to push harder.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction, non-thyroidal illness","high_causes":"Hypothyroidism (underactive thyroid), Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"18.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5512","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3557","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4, or free thyroxine, is the inactive form of thyroid hormone that circulates in the blood and is converted to the active form, T3, in tissues throughout the body. It reflects the thyroid gland's production capacity. Stephen's free T4 at 18.8 pmol/L is within the optimal range of 14 to 20, confirming healthy thyroid hormone production.","low_causes":"Hypothyroidism, iodine deficiency, pituitary dysfunction, severe illness","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis (early stage)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5778","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4222","upper_optimal_position":"0.5889","units":"pmol/L","description":"Free T3, or free triiodothyronine, is the active form of thyroid hormone. It is produced mostly by the conversion of T4 in tissues such as the liver and kidneys and is responsible for driving metabolic rate, energy production, and heat generation. Stephen's free T3 at 5.9 pmol/L is within the optimal range of 4.5 to 6.5, confirming excellent thyroid hormone activation. This is important for energy and metabolism.","low_causes":"Poor T4-to-T3 conversion (illness, selenium deficiency, stress), hypothyroidism, calorie restriction","high_causes":"Hyperthyroidism, excessive thyroid medication, T3-specific supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase antibodies target an enzyme involved in thyroid hormone production. Elevated levels indicate autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Stephen's TPO antibodies at less than 6.6 U/mL are well below the 13.8 cut-off, confirming no autoimmune attack on the thyroid. This effectively rules out Hashimoto's thyroiditis.","low_causes":"Normal, e drops in the UK, will require a maintenance supplement of 2,000 IU daily.","low_causes":"Inadequate sun exposure, dark skin, obesity (fat sequesters vitamin D), malabsorption, aging, winter months","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.838","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2760","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3347","upper_optimal_position":"0.5680","units":"pmol/L","description":"Parathyroid hormone is produced by the four small parathyroid glands located behind the thyroid. It is the master regulator of calcium balance, stimulating calcium release from bones, calcium reabsorption in the kidneys, and vitamin D activation. Stephen's PTH at 0.838 pmol/L is marginally below the lower limit of 0.98. However, his corrected calcium at 2.44 is well within range, his vitamin D at 96 is optimal, and his magnesium at 1.04 is healthy. When calcium and vitamin D are both at good levels, the body simply does not need to produce much PTH. The most likely explanation is that the calcium-regulatory system is working efficiently rather than that there is any parathyroid gland problem. The lab also notes that PTH results should be viewed with caution if the sample was not promptly processed, which could contribute to a marginally lower reading. This does not require any action but is worth mentioning to his GP for completeness.","low_causes":"Adequate vitamin D and calcium suppressing PTH, hypoparathyroidism (rare), magnesium deficiency (severe), sample handling","high_causes":"Vitamin D deficiency, calcium deficiency, chronic kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"662","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5291","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4559","upper_optimal_position":"0.6160","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and energy metabolism. It is obtained primarily from animal products. Stephen's B12 at 662 pg/mL is within the optimal range of 500 to 900, confirming healthy B12 status and adequate dietary intake or absorption.","low_causes":"Vegan or vegetarian diet, pernicious anaemia, malabsorption, aging, metformin use, PPI use","high_causes":"Supplementation, liver disease, certain blood cancers","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate, or vitamin B9, is essential for DNA synthesis, red blood cell production, and methylation, a critical biochemical process that affects energy production, neurotransmitter balance, and detoxification. Stephen's folate at 9 ng/mL is within the laboratory range and just above the 8 ng/mL optimal floor. While this is technically within the optimal band, it is at the lower end and could benefit from a modest increase through more folate-rich foods such as leafy greens, legumes, and cruciferous vegetables, or a methylfolate supplement. Given his brain fog and fatigue symptoms, optimising folate supports the methylation pathways that influence both energy and cognitive function.","low_causes":"Inadequate dietary intake, alcohol, malabsorption, coeliac disease, certain medications (methotrexate, anticonvulsants)","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"126","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4357","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5238","units":"U/L","description":"Creatine kinase is an enzyme found in muscle tissue, including the heart and skeletal muscles. It rises when muscle cells are damaged, whether from intense exercise, injury, or disease. Stephen's CK at 126 U/L is within the laboratory range, reflecting no unusual muscle damage. This is consistent with his moderate training volume.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise (especially eccentric), muscle injury, rhabdomyolysis, myositis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5745","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, the unstable molecules that cause oxidative damage to cells. A higher level indicates better antioxidant protection. Stephen's TAA at 1.62 mmol/L is within the lab function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);

  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
