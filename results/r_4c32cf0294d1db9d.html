e sessions per week, and achieving a modest calorie deficit will all improve insulin sensitivity. Resistance training is particularly effective because muscle tissue is the largest consumer of glucose, and building more of it increases the number of receptor sites for insulin to act on.\n\nHis testosterone at 14.7 is within the laboratory range of 8.4 to 28.7 but sits below the 18 nmol/L optimal threshold. His free testosterone, the fraction not bound to proteins and therefore available to tissues, is 0.278, within range, and his free androgen index at 39.1 and SHBG at 37.6 are both healthy, meaning the issue is total production rather than excessive binding. At 52, some decline in testosterone is expected, but sitting at 14.7 is lower than ideal and could be contributing to his difficulty losing weight, his brain fog, and his hair thinning. Testosterone supports lean muscle maintenance, cognitive clarity, and metabolic rate. The encouraging aspect is that the same interventions that will improve his insulin sensitivity, more resistance training and a modest calorie deficit with adequate protein, will also support testosterone production. Sleep quality and duration also play a significant role in testosterone levels, and if Stephen is not consistently achieving seven to eight hours, this would be worth addressing.\n\nHis hs-CRP, high-sensitivity C-reactive protein, a marker of systemic low-grade inflammation, is 1.1. The lab range extends to 5.0, so this is well within range, but the optimal target for long-term cardiovascular and metabolic health is below 1.0. At 1.1, this is only marginally above optimal and may simply reflect his mild insulin resistance, his BMI, or low-level allergic inflammation. It is not a concern in isolation but is worth noting as something that should drift downward as his metabolic health improves.\n\nHis kidney function deserves a nuanced comment. His creatinine-based eGFR is 80, and his Cystatin C-based eGFR, which is generally considered more accurate because it is not influenced by muscle mass, also returns 80. Both are above the 60 threshold that defines clinical concern, but below the 90 that we consider optimal. At 52, some decline from peak filtration rate is expected, and an eGFR of 80 is consistent with normal age-related change. His urea at 5.1, sodium at 146, chloride at 102, bicarbonate at 23.2, and uric acid at 296 are all within range, and there is no protein in his urine, which together confirm there is no kidney disease. His sodium at 146 sits at the very top of its reference range of 133 to 146. This is within range but worth keeping an eye on. Adequate hydration, particularly around training, will help keep this comfortably mid-range.\n\nHis folate at 9 is within the laboratory range of 3 to 17 but sits just above the 8 ng/ml optimal floor. Given that folate works alongside B12 in methylation pathways that influence energy, mood, and cognitive function, and Stephen reports brain fog and fatigue, a modest increase through more leafy greens, legumes, or a supplement could be beneficial.\n\nHis parathyroid hormone, PTH, at 0.838 pmol/L is marginally below the lower limit of 0.98. PTH is the hormone that regulates calcium levels by signalling the bones to release calcium and the kidneys to retain it. His corrected calcium at 2.44 is well within range, and his vitamin D at 96 is optimal. The most likely explanation is that his healthy vitamin D level and adequate dietary calcium intake are keeping calcium levels stable without the need for much PTH stimulation, effectively a sign that the system is working efficiently rather than a sign of disease. The lab also notes that PTH results should be viewed with caution if the sample was not centrifuged and separated on the day of collection, which adds a possible pre-analytical factor. This does not require any action but is worth mentioning to his GP for completeness if he is having a routine review.\n\nHis MCHC at 349 is marginally above the upper limit of 345. MCHC, mean corpuscular haemoglobin concentration, measures how densely packed haemoglobin is within each red cell. At this margin, just 1.2% above the upper limit, and with every other red cell parameter entirely normal, this is most likely laboratory variation related to sample temperature or storage rather than any clinical abnormality. It does not require any action.\n\nRegarding the urine culture, the laboratory reported mixed growth consistent with probable contamination. The urinalysis itself is entirely clean, with no white cells, no nitrites, no blood, and no protein, which supports the laboratory's interpretation that this is a sample contamination finding rather than a genuine infection. No action is needed.\n\nIn summary, Stephen's blood work reveals an excellent cardiovascular and liver profile, healthy thyroid function, good iron stores, and a clean immune and prostate picture. The findings that connect most directly to his symptoms and goals are the early insulin resistance and below-optimal testosterone. Both are modifiable through the same set of changes: more resistance training, a structured calorie deficit with high protein intake, and attention to sleep. These are the interventions most likely to improve his energy, support weight loss, and address his brain fog.","links":"Stephen's results point to a clear set of practical steps that should help him move toward his goals of losing body fat, improving energy, and supporting long-term health.\n\nStarting with nutrition, at 83kg and 182cm with moderate activity, Stephen's estimated maintenance calories sit around 2,400 to 2,550 per day. To achieve a sustainable fat loss rate of around 0.5kg per week, a daily intake of 1,900 to 2,100 calories would be appropriate. Protein should be prioritised at 1.6 to 2.0g per kilogram of body weight, which gives a target of 133 to 166g of protein per day. This is important not only for muscle preservation during a calorie deficit but also because protein has the highest thermic effect of any macronutrient, meaning the body uses more energy to digest and process it, and because adequate protein intake supports testosterone production. Given the mild insulin resistance, Stephen would benefit from reducing refined carbohydrates, particularly sugars, white bread, pasta, and processed snacks, and replacing them with complex carbohydrate sources such as oats, sweet potatoes, legumes, and whole grains. These release glucose more slowly and reduce the insulin spikes that contribute to fat storage. Increasing soluble fibre intake through oats, beans, lentils, and vegetables will also help with both insulin sensitivity and cholesterol maintenance.\n\nResistance training is the single most impactful change Stephen could make. Moving from one session per week to three would significantly improve insulin sensitivity by increasing the amount of muscle tissue available to absorb glucose, support testosterone production, protect bone density at 52, and increase resting metabolic rate. Compound movements such as squats, deadlifts, rows, and presses are the most efficient choices. His two cardio sessions are valuable and should continue, ideally including at least one session of higher-intensity interval work, which has been shown to improve insulin sensitivity more effectively than steady-state cardio alone.\n\nSleep is a priority that often gets overlooked. Testosterone is produced primarily during deep sleep, and even one week of restricted sleep can reduce testosterone levels by 10 to 15%. Stephen should aim for seven to eight hours per night, with a consistent wake time, a cool bedroom around 18 degrees, and a caffeine cut-off by early afternoon. Getting outside within the first hour of waking helps set the circadian rhythm and supports both sleep quality and cortisol regulation.\n\nFor his GP, the findings worth discussing at a routine review are: HOMA-IR at 1.66, indicating early insulin resistance, which may warrant a repeat fasting insulin and glucose in six months to track the trend; testosterone at 14.7, below the optimal threshold but within the lab range, which is worth the GP having on record especially if symptoms persist despite lifestyle changes; PTH at 0.838, marginally below range, likely physiological given his excellent calcium and vitamin D levels but worth noting; and eGFR at 80, within normal age-related expectations but worth establishing as a baseline for future monitoring.\n\nA retest in six months focusing on fasting glucose, fasting insulin, HOMA-IR, HbA1c, testosterone, and a lipid panel would allow Stephen to measure the impact of any changes he makes. If his insulin resistance improves and testosterone rises, that would confirm the lifestyle interventions are working.","flags":"HOMA-IR: 1.66, above the 1.5 upper limit. Early insulin resistance. Fasting glucose 4.8 and HbA1c 34 are both excellent, indicating the pancreas is compensating adequately. HOMA-B 120 and C-Peptide 413.8 pmol/L confirm preserved beta-cell function. Likely driven by body composition and dietary carbohydrate load. Recommend repeat fasting insulin and glucose in six months alongside lifestyle modification.\n\nTestosterone: 14.7 nmol/L, within the lab range of 8.4 to 28.7 but below the 18 nmol/L optimal threshold. Free testosterone 0.278 nmol/L and SHBG 37.6 nmol/L are within range, indicating the issue is total production rather than excessive binding. At 52, some decline is expected. Worth monitoring if symptoms of low energy, brain fog, and difficulty losing weight persist despite lifestyle changes.\n\nPTH: 0.838 pmol/L, marginally below the lower limit of 0.98. Corrected calcium 2.44 mmol/L is within range and vitamin D 96 nmol/L is optimal. Most likely physiological suppression from adequate calcium and vitamin D. Pre-analytical factors may also contribute. No action required unless calcium or vitamin D change on future testing.\n\nMCHC: 349 g/L, marginally above the upper limit of 345. All other red cell indices normal. Most likely laboratory or sample-related variation. No clinical significance at this margin.\n\nhs-CRP: 1.1 mg/L, within the lab range of less than 5 but above the optimal target of less than 1.0. Marginal and likely related to mild insulin resistance or allergic inflammation. Not clinically actionable in isolation.\n\neGFR: 80 ml/min by both creatinine and Cystatin C calculations. Above the 60 clinical threshold but below the 90 optimal target. Consistent with normal age-related decline at 52. No proteinuria, normal urea and electrolytes. Establish as baseline for future monitoring.\n\nSodium: 146 mmol/L, at the very top of the reference range of 133 to 146. Within range but worth ensuring adequate hydration.\n\nUrine culture: Mixed growth reported as probable contamination. Urinalysis entirely clean with no WBCs, nitrites, blood, or protein. No clinical significance.\n\nReassuring negatives: Liver function entirely normal with clean GGT, ALT, AST, and FIB-4. Lipid profile excellent across all metrics including ApoB and Lp(a). Thyroid function optimal with negative antibodies. Iron studies balanced with ferritin, saturation, and transferrin all within optimal ranges. Prostate markers excellent. Tumour markers normal. Immunoglobulins within range. Coeliac screen negative. IgE within range. Full blood count normal. No haematological concerns. Vitamin D optimal. B12 healthy.","recommendations":"Increase resistance training from one session to three sessions per week, focusing on compound movements. This is the single most impactful change for insulin sensitivity, testosterone support, and body composition.\n\nSet a daily calorie target of 1,900 to 2,100 calories for gradual fat loss, with a protein target of 133 to 166g per day. Use a food tracking app for the first four to six weeks to calibrate portion sizes.\n\nReduce refined carbohydrates and increase complex carbohydrate sources such as oats, sweet potatoes, legumes, and whole grains to improve insulin sensitivity.\n\nIncrease soluble fibre intake through oats, beans, lentils, broccoli, and flaxseed.\n\nPrioritise sleep: aim for seven to eight hours per night, fixed wake time, cool bedroom, caffeine cut-off by 1pm, and morning outdoor light exposure within the first hour of waking.\n\nEnsure adequate hydration, particularly around training, aiming for 2.5 to 3 litres of water per day.\n\nDiscuss with GP: HOMA-IR 1.66, testosterone 14.7, PTH 0.838, and eGFR 80 as baseline values for future monitoring.\n\nRetest in six months: fasting glucose, fasting insulin, HOMA-IR, HbA1c, testosterone, and lipid panel to track the impact of changes.","supplementation":"Stephen's blood work does not reveal any severe deficiencies that demand urgent supplementation. His vitamin D is already optimal, his B12 is healthy, and his iron stores are well balanced. The following are worth considering as supportive additions alongside the lifestyle changes outlined above.\n\nMagnesium glycinate, 300 to 400mg, taken before bed. Stephen's serum magnesium at 1.04 is within range but near the top, which is actually a positive sign. However, magnesium glycinate supports sleep quality, insulin sensitivity, and muscle recovery, all of which are relevant to his goals. The glycinate form is well absorbed and has a calming effect that supports deeper sleep, which in turn supports testosterone production.\n\nOmega-3 fish oil, providing 2 to 3g of combined EPA and DHA daily, taken with a meal. While Stephen's lipid profile is already excellent, omega-3 fatty acids support anti-inflammatory pathways and may help bring his hs-CRP below the 1.0 optimal threshold. They also support brain function, which is relevant given his report of brain fog.\n\nFolate, as methylfolate, 400 to 800 micrograms daily. His folate at 9 is within range but only just above the optimal floor of 8. Folate is essential for methylation, a biochemical process that influences energy production, neurotransmitter synthesis, and DNA repair. A modest supplement, or increased dietary intake through leafy greens, legumes, and cruciferous vegetables, would help optimise this.\n\nVitamin D3, cholecalciferol, 2,000 IU daily with a fat-containing meal, as a maintenance dose. His level at 96 is optimal and this dose is intended to maintain it through the autumn and winter months when UV exposure drops. Vitamin K2 in the MK-7 form, 100 micrograms daily, should be taken alongside vitamin D3 to direct calcium into bones rather than soft tissues.\n\nThe most important changes from this report are not supplements. They are increasing resistance training to three sessions per week, structuring his calorie and protein intake to support gradual fat loss, and prioritising consistent, high-quality sleep. These three changes address the insulin resistance, below-optimal testosterone, and the symptoms of fatigue, brain fog, and difficulty losing weight far more effectively than any supplement can.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after a period without eating. It reflects how effectively the body manages blood sugar at rest. Stephen's result of 4.8 mmol/L is within the optimal range of 4.0 to 5.4, indicating that his body is maintaining blood sugar at a healthy baseline level. This is a positive finding, particularly in the context of his HOMA-IR being slightly above optimal, as it confirms that his pancreas is producing enough insulin to keep glucose well controlled even though his cells are beginning to show early resistance to insulin's effects.","low_causes":"Fasting, excessive insulin production, certain medications, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, high carbohydrate intake, certain medications, pancreatic dysfunction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, providing an average picture of blood sugar control over the previous two to three months. Stephen's result of 5.3% is well within the normal range and below the 6.0% pre-diabetes threshold, confirming good long-term blood sugar management.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units of mmol/mol. Stephen's result of 34 is comfortably below the 42 threshold for pre-diabetes and below the 36 optimal ceiling, confirming excellent average blood sugar control over the past two to three months.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"7.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4498","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5758","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing at rest. Insulin is the hormone that shuttles glucose from the blood into cells for energy. Stephen's result of 7.8 mIU/L is within the lab range and falls just within the optimal ceiling of 8.0. While this is technically within the optimal band, it is at the higher end and, when combined with his glucose level in the HOMA-IR calculation, produces a result that indicates early insulin resistance. The insulin level itself is not alarming, but the ratio of insulin required to manage a relatively normal glucose level suggests his cells are beginning to need more insulin stimulation than ideal.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, type 1 diabetes, pancreatic insufficiency","high_causes":"Insulin resistance, high carbohydrate diet, obesity, metabolic syndrome, polycystic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"413.75","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4030","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4959","units":"pmol/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It provides a reliable measure of how much insulin the pancreas is actually producing, because unlike insulin itself, C-Peptide is not partially cleared by the liver on its first pass. Stephen's result of 413.8 pmol/L, converted from 1.25 ug/L, is within the laboratory range and sits toward the lower end, confirming that his pancreas is producing insulin at a healthy and appropriate rate. This is reassuring in the context of his mildly elevated HOMA-IR, as it confirms the pancreas is not being overworked.","low_causes":"Type 1 diabetes, advanced type 2 diabetes with beta-cell exhaustion, exogenous insulin use","high_causes":"Insulin resistance, insulinoma, kidney disease reducing clearance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7200","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting glucose and fasting insulin. It estimates how hard the body has to work to keep blood sugar under control. A lower number means cells respond readily to insulin; a higher number means they are becoming resistant and the pancreas must produce more insulin to achieve the same effect. Stephen's result of 1.66 is above the 1.5 upper limit, indicating early insulin resistance. This is the most clinically relevant finding in the context of his difficulty losing weight, as elevated insulin promotes fat storage and inhibits fat breakdown. The good news is that this level of insulin resistance is entirely reversible through increased resistance training, reduced refined carbohydrate intake, and a modest calorie deficit.","low_causes":"High insulin sensitivity, low carbohydrate diet, very lean body composition, fasting","high_causes":"Excess body fat, high refined carbohydrate intake, sedentary lifestyle, poor sleep, chronic stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"120.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5556","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5278","units":"","description":"HOMA-B estimates the functional capacity of the beta cells in the pancreas, which are responsible for producing insulin. It is calculated from fasting insulin and fasting glucose. Stephen's result of 120 is within the healthy range of 80 to 200, confirming that his pancreatic beta cells are functioning well and producing insulin at an appropriate rate. This is reassuring because it means the early insulin resistance detected by his HOMA-IR is not because of any failure of the pancreas, but rather because his cells are becoming slightly less responsive to the insulin being produced.","low_causes":"Beta-cell dysfunction, long-standing type 2 diabetes, type 1 diabetes, chronic pancreatitis","high_causes":"Compensatory response to insulin resistance, high carbohydrate intake, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5600","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins perform essential functions including transporting hormones and nutrients, maintaining fluid balance, and supporting immune function. Stephen's result of 74 g/L is comfortably within the laboratory range, reflecting healthy liver synthetic function and adequate protein intake.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease with protein loss","high_causes":"Chronic inflammation, chronic infection, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3708","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones, vitamins, and medications, and serves as a marker of both liver health and nutritional status. Stephen's result of 43 g/L is within the optimal range, reflecting good liver function and adequate protein nutrition.","low_causes":"Liver disease, malnutrition, chronic inflammation, kidney disease with protein loss","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5741","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3444","upper_optimal_position":"0.6111","units":"g/L","description":"Globulin is a group of proteins in the blood that includes antibodies (immunoglobulins) and transport proteins. It is calculated by subtracting albumin from total protein. Stephen's result of 31 g/L is within the laboratory range, reflecting a normal immune and inflammatory protein level.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3857","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3476","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main protein groups in the blood. A balanced ratio suggests healthy liver function and a normally functioning immune system. Stephen's calculated ratio of 1.39 is within the laboratory range, reflecting a healthy balance between liver-produced albumin and immune-related globulin proteins.","low_causes":"Liver disease, chronic inflammation, autoimmune conditions, overproduction of globulins","high_causes":"Immune deficiency, underproduction of globulins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5238","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and intestines. In the context of a liver panel, it helps assess bile duct function. Stephen's result of 79 IU/L is comfortably within the laboratory range and consistent with healthy liver and bone metabolism at 52.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disorders, liver disease, vitamin D deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6042","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when the liver breaks down old red blood cells. It is processed by the liver and excreted in bile. Stephen's result of 19 umol/L is within the laboratory range but toward the upper end. This could reflect Gilbert's syndrome, a harmless inherited condition affecting 5 to 10% of the population where the liver is slightly slower at processing bilirubin. With all other liver markers clean, this is not a concern.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolytic anaemia, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3125","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, so it serves as a sensitive marker of liver cell health. Stephen's result of 35 IU/L is within the laboratory range of less than 56. However, the optimal threshold for men is below 30. At 35, this is not alarming and is within the range seen in healthy individuals, but it is marginally above optimal and worth noting. This could reflect mild metabolic strain, which may improve as his insulin sensitivity improves with lifestyle changes.","low_causes":"Generally not clinically significant","high_causes":"Liver inflammation, fatty liver disease, alcohol, medications, intense exercise, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST, aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. Like ALT, it rises when cells are damaged. Stephen's result of 23 IU/L is well within both the laboratory and optimal ranges, confirming no significant liver cell stress.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, heart disease, muscle damage, intense exercise, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3966","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the likelihood of liver fibrosis, or scarring, using age, ALT, AST, and platelet count. A lower score indicates a low probability of significant fibrosis. Stephen's score of 1.15 is below the 1.3 threshold for further investigation in people under 65, confirming a low risk of liver fibrosis.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis, age-related increase, low platelet count, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1918","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/L","description":"Gamma GT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol use, bile duct problems, and metabolic strain on the liver. It is often the first liver marker to rise when the liver is under stress. Stephen's result of 28 IU/L is within the laboratory range but above the optimal threshold of 25 for men. This is not a concern at this margin and reflects a generally healthy liver.","low_causes":"Generally not clinically significant","high_causes":"Alcohol consumption, fatty liver disease, bile duct obstruction, metabolic syndrome, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4242","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is an enzyme produced primarily by the pancreas and salivary glands that breaks down starches. It is used as a marker of pancreatic health. Stephen's result of 54 IU/L is within the laboratory range, confirming normal pancreatic function.","low_causes":"Chronic pancreatitis with pancreatic insufficiency, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5532","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3376","upper_optimal_position":"0.6121","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is a more specific marker of pancreatic health than amylase. Stephen's result of 44 U/L is within the laboratory range, confirming healthy pancreatic function.","low_causes":"Generally not clinically significant","high_causes":"Pancreatitis, bowel obstruction, kidney disease, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4151","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures the combined amount of all cholesterol carried in the blood, including LDL, HDL, and VLDL fractions. It provides a broad overview but is less informative on its own than the individual fractions. Stephen's total cholesterol of 4.3 mmol/L is desirable and within the optimal range, reflecting a well-balanced lipid profile.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption, certain medications","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2412","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are a type of fat circulating in the blood, used by the body for energy. Elevated levels are associated with increased cardiovascular risk, insulin resistance, and metabolic syndrome. Stephen's triglycerides at 0.82 mmol/L are within the optimal range of below 1.0, which is an excellent result and suggests that his body is managing dietary fats efficiently.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption, malnutrition","high_causes":"High carbohydrate or sugar intake, alcohol, obesity, insulin resistance, certain medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2372","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL, very low-density lipoprotein cholesterol, is produced by the liver and carries triglycerides to tissues throughout the body. It is a precursor to LDL. Stephen's VLDL at 0.37 mmol/L is well within the desirable range, consistent with his excellent triglyceride level.","low_causes":"Very low fat diet, hyperthyroidism","high_causes":"High carbohydrate diet, obesity, insulin resistance, alcohol, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5769","lower_normal":"1.04","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL, high-density lipoprotein cholesterol, is often called 'good' cholesterol because it transports cholesterol away from the artery walls and back to the liver for recycling or disposal. Higher levels are protective against cardiovascular disease. Stephen's HDL at 1.8 mmol/L is well above the 1.4 optimal threshold for men, which is an excellent result and a significant contributor to his low cardiovascular risk.","low_causes":"Sedentary lifestyle, obesity, smoking, high refined carbohydrate diet, certain medications, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol consumption, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3560","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6067","units":"mmol/L","description":"LDL, low-density lipoprotein cholesterol, is the form of cholesterol most strongly associated with atherosclerosis, the build-up of plaques inside artery walls. Lower levels are associated with lower cardiovascular risk. Stephen's LDL at 2.14 mmol/L is within the optimal range of below 2.6, which is an excellent result.","low_causes":"Hyperthyroidism, liver disease, malnutrition, certain medications","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, obesity, kidney disease, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2656","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick summary of cardiovascular risk balance. A lower ratio is better, indicating more protective HDL relative to total cholesterol. Stephen's ratio of 2.39 is well below the 4.5 threshold and below the 3.5 optimal ceiling, reflecting an excellent balance.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, high total cholesterol, high LDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"41.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5233","lower_normal":"20","upper_normal":"100","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This marker shows what percentage of total cholesterol is made up of the protective HDL fraction. A higher percentage is better. Stephen's HDL represents 41.86% of his total cholesterol, well above the 20% minimum and above the 30% optimal floor, confirming an excellent lipid balance.","low_causes":"Low HDL relative to total cholesterol, metabolic syndrome","high_causes":"High HDL, very low LDL and VLDL","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3125","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol fractions, including LDL, VLDL, and remnant cholesterol, in a single number. Stephen's non-HDL at 2.5 mmol/L is well within the desirable range of below 4.0 and within optimal range, confirming low atherogenic burden.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"High saturated fat intake, obesity, insulin resistance, hypothyroidism, familial hyperlipidaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5542","lower_normal":"1.2","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the primary protein component of HDL particles. It is essential for the reverse cholesterol transport process, moving cholesterol from tissues and artery walls back to the liver. Higher levels are protective. Stephen's ApoA1 at 1.77 g/L is well above the 1.2 minimum, confirming robust HDL function.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol consumption, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every atherogenic lipoprotein particle, including LDL, VLDL, and Lp(a). Because each particle carries exactly one ApoB molecule, this marker provides a direct count of the total number of potentially harmful particles in the blood. Many cardiologists consider it the single best predictor of cardiovascular risk from a lipid panel. Stephen's ApoB at 0.65 g/L is below the 0.8 optimal threshold, confirming a low atherogenic particle count.","low_causes":"Hyperthyroidism, liver disease, malnutrition, certain medications","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2643","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic particles (ApoB) to the number of protective particles (ApoA1). It is considered one of the most accurate single-number summaries of lipid-related cardiovascular risk. Stephen's ratio of 0.37 is well below the 0.7 lower-risk threshold, reflecting an excellent balance of harmful to protective lipoprotein particles.","low_causes":"High HDL function, low LDL particle count, genetic factors","high_causes":"High LDL particle count, low HDL, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined type of LDL particle that carries an additional protein called apolipoprotein(a). Elevated Lp(a) is an independent risk factor for cardiovascular disease and cannot be changed through diet or lifestyle. It only needs to be measured once in a lifetime because it is fixed by genetics. Stephen's Lp(a) is below 25 nmol/L, within the normal range of below 32, which is a valuable finding to record permanently. It confirms that his cardiovascular risk profile is not being influenced by an inherited Lp(a) elevation, and any future lipid changes would be driven entirely by modifiable factors.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic inheritance (non-modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1533","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a calculated marker that provides a quick estimate of insulin resistance and metabolic health. A lower ratio suggests better insulin sensitivity and lower cardiovascular risk. Stephen's ratio of 0.46 is well within the optimal range of below 0.87, which is an excellent result and, interestingly, somewhat at odds with his mildly elevated HOMA-IR. This suggests that while his cells are beginning to show early insulin resistance, his overall metabolic profile remains in good shape, and the insulin resistance is at an early and very reversible stage.","low_causes":"High insulin sensitivity, excellent metabolic health, very high HDL","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2250","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant particles, which are increasingly recognised as an independent cardiovascular risk factor. Stephen's remnant cholesterol at 0.36 mmol/L is within the optimal range of below 0.5, confirming low remnant particle burden.","low_causes":"Low triglyceride levels, healthy lipid metabolism","high_causes":"Insulin resistance, obesity, high carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1100","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein is a marker of systemic low-grade inflammation produced by the liver. It is used to assess cardiovascular risk and general inflammatory burden. Levels below 1.0 are considered optimal for long-term health. Stephen's hs-CRP at 1.1 mg/L is within the laboratory range but marginally above the optimal target of 1.0. This is not alarming and could reflect a number of factors including mild insulin resistance, seasonal allergies, or minor metabolic inflammation. Improving insulin sensitivity through lifestyle changes may help bring this below 1.0.","low_causes":"Low inflammatory burden, excellent metabolic health","high_causes":"Infection, chronic inflammation, obesity, insulin resistance, cardiovascular disease, autoimmune conditions, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR, erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour. A faster rate suggests more inflammation in the body. It is a non-specific marker, meaning it does not point to any particular cause but broadly indicates inflammatory activity. Stephen's ESR at 8 mm/hour is within both the lab range and optimal, confirming low systemic inflammation.","low_causes":"Low inflammatory burden, polycythaemia","high_causes":"Infection, inflammation, autoimmune disease, anaemia, cancer, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"146","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is an essential electrolyte that regulates fluid balance, nerve signalling, and muscle contraction. It is tightly controlled by the kidneys. Stephen's sodium at 146 mmol/L sits at the very top of the reference range. This is within normal limits but could reflect mild dehydration at the time of the blood draw. Ensuring adequate fluid intake, particularly around training, should keep this comfortably mid-range.","low_causes":"Excessive water intake, certain medications (diuretics, ACE inhibitors), adrenal insufficiency, severe vomiting or diarrhoea","high_causes":"Dehydration, excessive salt intake, certain medications, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"3.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3519","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"mmol/L","description":"Potassium is an essential electrolyte critical for heart rhythm, muscle contraction, and nerve function. Stephen's result of 3.6 mmol/L is within the laboratory range but just above the lower limit of 3.5 and below the optimal floor of 3.8. The lab notes that potassium can fall in delayed samples, so this may partly reflect pre-analytical factors. However, increasing dietary potassium through bananas, avocados, sweet potatoes, and leafy greens would be beneficial.","low_causes":"Inadequate dietary intake, excessive sweating, diarrhoea, certain medications (diuretics), alkalosis","high_causes":"Kidney disease, certain medications (ACE inhibitors, potassium-sparing diuretics), acidosis, cell damage, sample haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4615","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Chloride is an electrolyte that works with sodium and bicarbonate to maintain fluid balance and acid-base equilibrium. Stephen's chloride at 102 mmol/L is within both the laboratory and optimal ranges, confirming healthy electrolyte balance.","low_causes":"Excessive vomiting, metabolic alkalosis, certain medications","high_causes":"Dehydration, metabolic acidosis, excessive salt intake, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"23.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4242","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3485","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is a key buffer in the blood that helps maintain the body's acid-base balance. It works with the kidneys and lungs to keep blood pH within a very narrow range. Stephen's bicarbonate at 23.2 mmol/L is within the laboratory range, reflecting normal acid-base balance.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease, intense exercise","high_causes":"Metabolic alkalosis, excessive vomiting, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"24.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8750","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.5417","units":"mmol/L","description":"The anion gap is calculated from sodium, potassium, chloride, and bicarbonate. It estimates the concentration of unmeasured anions in the blood and helps assess acid-base disturbances. Stephen's calculated anion gap is 24.4, which is above the standard range of 8 to 16. However, the anion gap calculation can be significantly affected by the albumin level and by sample handling. With Stephen's sodium sitting at the top of its range at 146 and his other acid-base markers, particularly bicarbonate, being normal, and with no clinical symptoms suggesting acidosis, this is most likely a mathematical artefact of the sodium value rather than a genuine metabolic disturbance. If his sodium had been mid-range at 140, the anion gap would have been 18.4, much closer to normal. This does not require any action but would normalise if repeated with better hydration.","low_causes":"Laboratory error, hypoalbuminaemia, lithium toxicity","high_causes":"Metabolic acidosis (diabetic ketoacidosis, lactic acidosis, renal failure), dehydration, certain toxins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. The body tightly regulates blood calcium levels through the actions of parathyroid hormone and vitamin D. Stephen's calcium at 2.46 mmol/L is within both the laboratory and optimal ranges, confirming healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency, malabsorption","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D supplementation, dehydration, thiazide diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the total calcium reading for the albumin level, providing a more accurate reflection of true calcium status. This is important because roughly half the calcium in the blood is bound to albumin, so changes in albumin can make total calcium appear falsely high or low. Stephen's corrected calcium at 2.44 mmol/L is within the optimal range, confirming genuine calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6264","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4856","upper_optimal_position":"0.6230","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, protein synthesis, muscle and nerve function, blood sugar regulation, and sleep quality. Stephen's magnesium at 1.04 mmol/L is within the optimal range of 0.85 to 1.05, which is an excellent result. Maintaining this level supports insulin sensitivity, sleep quality, and recovery from exercise.","low_causes":"Inadequate dietary intake, excessive alcohol, certain medications (diuretics, PPIs), intense exercise, chronic diarrhoea","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"296","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4105","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.4821","units":"umol/L","description":"Uric acid is a waste product formed from the breakdown of purines, which are found in certain foods and are also produced by the body. It is filtered by the kidneys. Elevated levels can cause gout and are associated with cardiovascular and metabolic risk. Stephen's uric acid at 296 umol/L is within both the laboratory range and the optimal band of 200 to 380 for men, reflecting healthy purine metabolism.","low_causes":"Low purine diet, certain medications, Wilson's disease, Fanconi syndrome","high_causes":"High purine diet (red meat, shellfish, organ meats), alcohol, obesity, kidney disease, metabolic syndrome, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product of protein metabolism, produced by the liver and excreted by the kidneys. It provides a measure of both kidney filtration and protein intake. Stephen's urea at 5.1 mmol/L is within the optimal range, reflecting healthy kidney clearance and balanced protein metabolism.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding, heart failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"94","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5812","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5641","units":"umol/L","description":"Creatinine is a waste product from the normal breakdown of creatine in muscle tissue. It is filtered by the kidneys and excreted in urine. As a fairly constant product of muscle metabolism, it serves as a marker of kidney filtration rate. Stephen's creatinine at 94 umol/L is within the laboratory range. Creatinine levels can be influenced by muscle mass, dietary protein, hydration, and exercise, so they are best interpreted alongside eGFR.","low_causes":"Low muscle mass, liver disease, very low protein diet","high_causes":"Kidney disease, dehydration, high muscle mass, high protein diet, intense exercise, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"80","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"60","upper_normal":"200","lower_optimal":"90","upper_optimal":"200","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate (eGFR) calculates how efficiently the kidneys are filtering waste from the blood, based on creatinine, age, sex, and ethnicity. It is the standard measure of kidney function. Stephen's creatinine-based eGFR at 80 is above the 60 threshold that defines clinical concern but below the 90 optimal target. At 52, some decline from peak filtration rate is expected, and an eGFR of 80 is consistent with normal age-related change. With no protein in his urine and normal urea and electrolytes, there is no evidence of kidney disease.","low_causes":"Kidney disease, dehydration, certain medications, age-related decline","high_causes":"Pregnancy, high cardiac output, early diabetic nephropathy (hyperfiltration stage)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"80","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"60","upper_normal":"200","lower_optimal":"90","upper_optimal":"200","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C-based eGFR uses an alternative protein marker, Cystatin C, to estimate kidney filtration. Unlike creatinine, Cystatin C is not significantly affected by muscle mass, making it a more reliable estimate in people with unusually high or low muscle mass. Stephen's Cystatin C eGFR at 80 confirms the creatinine-based eGFR of 80, giving confidence that this is a true reflection of his kidney function rather than an artefact of muscle mass. At 52, this is consistent with normal age-related kidney function.","low_causes":"Kidney disease, age-related decline, certain medications","high_causes":"Hyperfiltration, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C"
