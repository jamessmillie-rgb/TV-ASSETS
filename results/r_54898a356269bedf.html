 adequate but could be higher, and given that B12 supports energy, nerve function and red cell production, optimising it may help with his fatigue. His folate at 15 ng/ml is excellent. His magnesium at 1.0 mmol/L is within the optimal range of 0.85 to 1.05.\n\nHis total antioxidant activity (TAA) at 1.92 mmol/L is above the upper limit of 1.77. This is typically driven by supplementation with antioxidant-containing products or a diet rich in polyphenols and is not a concern. It simply reflects a high antioxidant intake.\n\nHis prostate markers are excellent. His PSA at 0.83 ng/ml is well below the threshold of 2.5, and his free PSA ratio at 0.337 is very healthy. His tumour markers CA 19-9 and CEA are both reassuringly low.\n\nHis urine analysis is clean, with no protein, glucose, blood, white cells or nitrites detected. Bacterial culture and rheumatoid factor are pending.\n\nReturning to the bigger picture, the two findings that matter most for Joseph's long-term health are his Lp(a) at 170 nmol/L and his LDL and ApoB levels that sit above target. Because Lp(a) cannot be changed, the strategy is to reduce every modifiable risk factor as aggressively as is reasonable. His LDL and ApoB can come down through dietary modification, and if dietary changes are not sufficient within six months, pharmacological intervention with his GP becomes a conversation worth having, particularly given the Lp(a) context. His sleep restriction is the other major modifiable risk factor. Fewer than six hours on most nights is associated with increased cardiovascular risk, impaired glucose regulation, elevated inflammation, reduced recovery from training, impaired muscle protein synthesis, and accelerated biological ageing. For someone whose goals include longevity, fat loss and muscle building, sleep is arguably the single highest-return investment he can make.","links":"Joseph's cardiovascular risk profile is the priority for action, driven by his inherited Lp(a) elevation and the modifiable lipid markers sitting above target. His low-carb, high-protein diet is producing excellent metabolic results in terms of insulin sensitivity and triglycerides, but LDL and ApoB are elevated, which is a recognised pattern on low-carb diets and one that needs addressing given the Lp(a) context. The first step is to introduce more soluble fibre, which directly binds cholesterol in the gut and reduces LDL. Good sources include oats, barley, lentils, chickpeas, beans, psyllium husk, apples and flaxseed. He does not need to abandon his low-carb approach entirely, but shifting some of the protein volume toward legumes and adding a daily portion of oats or psyllium would help. Increasing oily fish to three portions per week (salmon, mackerel, sardines, anchovies) provides omega-3 fatty acids that reduce inflammation and support the HDL side of the equation. Reducing saturated fat by swapping butter and coconut oil for olive oil and avocado oil is a simple change that typically lowers LDL by 5 to 15 percent. He should aim to retest his lipid panel, including ApoB and Lp(a), in six months. If ApoB remains above 0.9 g/L despite dietary changes, he should discuss statin therapy or PCSK9 inhibitors with his GP, framing the conversation around the Lp(a) result and the cumulative lifetime risk.\n\nFor his GP, the key conversation points are: Lp(a) at 170.24 nmol/L, which should be recorded permanently and triggers testing of first-degree relatives; ApoB at 1.09 g/L with LDL at 3.68 mmol/L, both above target in the context of high Lp(a); the low bicarbonate of 18.4 and low chloride of 91, which may be diet-related but should be repeated in three months; the suppressed PTH at below 0.424, which may be a sample handling issue but should be repeated with calcium if symptoms are present; and the elevated IgE at 213, which warrants a specific allergen panel if there is any allergic history.\n\nFor calorie and protein targets, Joseph's estimated basal metabolic rate at 93 kg and 188 cm is approximately 1,950 kcal. With his training load of four sessions per week and moderate step count, a multiplier of 1.6 gives a maintenance of approximately 3,120 kcal. For fat loss while preserving muscle, a deficit of 400 to 500 kcal per day puts his target at 2,600 to 2,700 kcal per day. His protein target, at 1.6 to 2.0 g per kg of bodyweight for someone resistance training three times per week with a muscle-building goal, is 149 to 186 g per day. He should aim for at least 150 g daily, spread across four meals, to maximise muscle protein synthesis. A realistic body composition target over the next six months would be to reduce to 88 to 90 kg while maintaining or increasing lean mass, which would bring his BMI closer to 25.\n\nFor sleep, this is not a minor lifestyle footnote. Fewer than six hours on most nights is a clinical-grade sleep deficit. The most effective changes are: setting a fixed wake time seven days a week and working backwards to ensure at least seven hours of opportunity; getting outside within an hour of waking for natural light exposure, which anchors the circadian clock; cutting caffeine entirely after midday (and given that he vapes nicotine, which is a stimulant, moving the last vape to at least two hours before bed); keeping the bedroom cool, around 18 degrees Celsius; and avoiding screens for 30 minutes before sleep. If these changes do not improve sleep within four weeks, a referral to a sleep clinic or a trial of cognitive behavioural therapy for insomnia (CBTi) would be worthwhile.\n\nFor his joint stiffness, the combination of omega-3 supplementation, improved sleep (which is when the body repairs connective tissue), and investigation of the elevated IgE to rule out an allergic contribution is the sensible starting approach. If joint symptoms persist, a GP review for inflammatory markers specific to joint disease would be the next step, though his ESR at 1 and CRP at 1.1 make a significant inflammatory arthritis unlikely.\n\nRetest recommendations: lipid panel including ApoB and Lp(a) in six months; kidney profile (urea, creatinine, eGFR, electrolytes including bicarbonate and chloride) in three months; PTH with calcium in three months if any symptoms of calcium disturbance; full blood count in six months to recheck reticulocytes and monocytes; IgE with specific allergen panel at GP convenience.","flags":"CARDIOVASCULAR (GP discussion recommended):\nLp(a) 170.24 nmol/L (limit below 32 nmol/L). Genetically inherited, moderate-to-high risk category. Should be recorded permanently. First-degree relatives should be tested. All modifiable cardiovascular risk factors should be optimised aggressively.\nApoB 1.09 g/L (target below 0.9). LDL 3.68 mmol/L (target below 3.0). ApoB/A-I ratio 0.773 (target below 0.7). Total cholesterol 5.7 mmol/L (desirable below 5.18). Non-HDL cholesterol 4.0 mmol/L (at the upper limit of 4.0). In the context of high Lp(a), these modifiable lipid markers should be reduced through dietary changes and reassessed at six months, with consideration of pharmacological intervention if targets are not met.\n\nELECTROLYTES AND KIDNEY:\nChloride 91 mmol/L (range 95 to 108). Bicarbonate 18.4 mmol/L (range 20 to 31). Both below range, likely related to low-carb diet and ketone production. Urea 10 mmol/L (range 3.2 to 8.2), likely dietary protein-driven. Creatinine-based eGFR 78 and Cystatin C eGFR 85, both above 60 but below the optimal 90. Recommend repeat kidney profile in three months with dietary context noted.\n\nENDOCRINE:\nPTH below 0.424 pmol/L (range 0.98 to 4.73). May be a sample degradation artefact as noted by the lab. If symptoms of calcium disturbance are present (cramps, tingling, palpitations), recommend repeat PTH with calcium at a hospital lab for immediate processing.\n\nGLUCOSE AND INSULIN:\nInsulin 2.08 mIU/L (range 2.6 to 24.9). C-Peptide 0.252 ug/L (range 1.1 to 4.4, approximately 83 pmol/L). HOMA-IR 0.41 (range 0.5 to 1.5). All below range but in the context of fasting glucose 4.4, HbA1c 35 and a low-carb diet, this reflects low insulin demand rather than pancreatic insufficiency. Not clinically concerning.\n\nIMMUNOLOGY:\nIgE 213 IU/ml (limit below 100). Suggests allergic sensitisation. Consider specific allergen panel if clinical history supports it.\n\nHAEMATOLOGY:\nAbsolute reticulocytes 37 x10^9/L (range 50 to 100). Monocytes 0.08 x10^9/L (range 0.2 to 1). Both mildly below range. May reflect mild caloric restriction or normal variation. Haemoglobin and red cell count are healthy, so no functional impact. Recheck in six months.\n\nMARGINAL (no action required):\nMCH 32.6 pg (range 27 to 32). MCHC 347 g/L (range 315 to 345). Total protein 84 g/L (range 57 to 82). TAA 1.92 mmol/L (range 1.3 to 1.77). All marginal and clinically insignificant in context.\n\nPENDING:\nTransferrin, rheumatoid factor, bacterial count and urine culture are noted as \"to follow\" and should be reviewed when available.\n\nReassuring negatives: Thyroid function normal with negative antibodies. PSA 0.83 with healthy free ratio. CA 19-9 and CEA low. CK within range. Liver enzymes and FIB-4 reassuring. ESR 1. Glucose and HbA1c optimal. Ferritin well placed. Vitamin D optimal. Urinalysis clean. No coeliac antibodies detected. Testosterone within optimal range.","recommendations":"1. GP appointment to record Lp(a) at 170.24 nmol/L permanently and discuss lipid-lowering strategy in the context of this inherited risk. First-degree relatives should be offered Lp(a) testing.\n\n2. Dietary modification to reduce LDL and ApoB: introduce daily soluble fibre (psyllium husk, oats, legumes), increase oily fish to three portions per week, switch saturated fat sources (butter, coconut oil) to olive oil and avocado oil. Aim for ApoB below 0.9 g/L at retest.\n\n3. Prioritise sleep as a non-negotiable health intervention. Target seven or more hours per night using a fixed wake time, morning light exposure, caffeine cut-off at midday, last nicotine vape at least two hours before bed, cool bedroom at 18 degrees, and screens off 30 minutes before sleep.\n\n4. Increase overall calorie intake slightly to 2,600 to 2,700 kcal per day to support muscle building while losing fat. Protein target of 150 to 186 g per day spread across four meals.\n\n5. Increase daily steps to 7,500 to 10,000 as a baseline for cardiovascular health and fat loss. This is the simplest addition to his current routine.\n\n6. Repeat kidney profile (urea, creatinine, eGFR, electrolytes including chloride and bicarbonate) in three months with a note on the request form about high-protein, low-carb diet.\n\n7. If any symptoms of calcium disturbance (muscle cramps, tingling in fingers or around the mouth, palpitations), repeat PTH with calcium at a hospital lab for same-day processing.\n\n8. Discuss elevated IgE at 213 with GP. If any history of hay fever, eczema, asthma or unexplained reactions, request a specific allergen panel.\n\n9. Retest lipid panel including ApoB and Lp(a) in six months. Retest full blood count in six months to monitor reticulocytes and monocytes.\n\n10. Consider reducing or ceasing nicotine vaping. Nicotine is a vasoconstrictor and stimulant that contributes to arterial stiffness, elevated blood pressure, and sleep disruption, all of which compound the cardiovascular risk from Lp(a).","supplementation":"Omega-3 fish oil: 3 g of combined EPA and DHA daily, taken with his largest meal. The EPA component is anti-inflammatory and the DHA supports vascular health. In the context of elevated Lp(a) and above-target ApoB, omega-3 supplementation helps reduce inflammation at the artery wall and may modestly improve the lipid profile. He should look for a product that provides at least 1,000 mg EPA and 500 mg DHA per serving.\n\nPsyllium husk fibre: 5 to 10 g daily, mixed into water or a shake, taken before or with a meal. Psyllium is a soluble fibre that binds bile acids in the gut, forcing the liver to pull LDL cholesterol from the blood to make more. Studies consistently show a 5 to 10% reduction in LDL with regular use. He should start at 5 g and increase to 10 g over two weeks to avoid bloating.\n\nVitamin D3 (cholecalciferol): continue current intake at 2,000 IU daily with a fat-containing meal to maintain his excellent level of 99 nmol/L. Pair with vitamin K2 (MK-7 form) at 100 mcg daily, which directs calcium into bones rather than arteries, a particularly relevant benefit for someone with elevated cardiovascular risk.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. His level of 386 pg/ml is adequate but below the optimal threshold of 500. The sublingual form bypasses the gut for better absorption. B12 supports energy production, red cell formation and nerve function, all relevant to his fatigue and the slightly low reticulocyte count.\n\nMagnesium glycinate: 300 to 400 mg before bed. His serum magnesium at 1.0 is within the optimal range, but magnesium glycinate specifically supports sleep quality, muscle recovery and relaxation, addressing three of his reported concerns. The glycinate form is well tolerated and does not cause the digestive issues associated with cheaper forms like magnesium oxide.\n\nThe most important changes from this report are not supplements. They are fixing his sleep to seven or more hours per night, modifying his diet to reduce LDL and ApoB, recording his Lp(a) with his GP to ensure lifetime cardiovascular risk is managed proactively, and increasing his daily movement with more steps.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5427","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It is one of the primary screens for diabetes and pre-diabetes. Joseph's result of 4.4 mmol/L is excellent, sitting within the tighter optimal range of 4.0 to 5.4 that is associated with the lowest long-term metabolic risk. This reflects his low-carb, high-protein dietary approach keeping blood sugar tightly controlled.","low_causes":"Fasting, excessive insulin, adrenal insufficiency, liver disease, alcohol excess","high_causes":"Diabetes, pre-diabetes, stress response, corticosteroid use, Cushing's syndrome, pancreatic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, meaning sugar has attached to it. Because red blood cells live for about three months, this gives an average picture of blood sugar control over that period. Joseph's result of 5.3% is well below the pre-diabetic threshold of 6.0% and indicates excellent long-term glucose management.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Diabetes, pre-diabetes, iron deficiency, splenectomy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international IFCC units. Joseph's result of 35 mmol/mol is within the optimal range of below 36 and well below the pre-diabetic threshold of 42 mmol/mol. This confirms excellent average blood sugar control.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Diabetes, pre-diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2978","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3244","upper_optimal_position":"0.4133","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to maintain blood sugar levels. Joseph's result of 2.08 mIU/L is just below the laboratory lower limit of 2.6 but actually falls within the optimal functional range of 2 to 8 mIU/L. On a low-carb diet, the pancreas simply does not need to produce much insulin because the carbohydrate load is minimal. Combined with his excellent glucose and HbA1c, this reflects metabolic efficiency rather than any pancreatic problem.","low_causes":"Low carbohydrate intake, prolonged fasting, high insulin sensitivity, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes, obesity, polycystic ovary syndrome, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"83.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1863","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"1000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5510","units":"pmol/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It is used to measure how much insulin the pancreas is actually producing, because unlike insulin itself, C-Peptide is not cleared by the liver on first pass. Joseph's result, converted from 0.252 ug/L to approximately 83 pmol/L, is below the laboratory range. As with his insulin level, this reflects the low demand placed on the pancreas by his low-carb diet rather than pancreatic insufficiency. His normal glucose and HbA1c confirm the pancreas is producing exactly as much as is needed.","low_causes":"Low carbohydrate diet, fasting, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.41","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.2893","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.1","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2133","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation that estimates how resistant the body's cells are to insulin. Lower is better. Joseph's result of 0.41 is below the laboratory lower limit of 0.5, but this is the favourable direction: it means his cells are highly sensitive to insulin. A value below 1.0 indicates optimal insulin sensitivity. This is an excellent metabolic finding, particularly relevant for his goals of long-term health and fat loss.","low_causes":"High insulin sensitivity, low carbohydrate diet, fasting, lean body composition","high_causes":"Insulin resistance, metabolic syndrome, obesity, sedentary lifestyle, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"46.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2044","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the function of the beta cells in the pancreas, which are the cells that produce insulin. Joseph's calculated result of 46.2 is below the reference range of 80 to 200. However, this calculation assumes a standard mixed diet. On a low-carb diet, the pancreas is producing less insulin because less is needed, which mathematically lowers the HOMA-B score. Since his glucose and HbA1c are both optimal, his beta cells are meeting demand perfectly. This is not a sign of pancreatic failure.","low_causes":"Low carbohydrate diet, prolonged fasting, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance with compensatory overproduction, early type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3393","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream. Joseph's result of 38 IU/L is within the laboratory limit of 56 but above the tighter optimal threshold of 30 for men. This mild elevation is common in people who resistance train, as muscle damage from exercise can release small amounts of transaminases. It is not a concern in the context of his excellent GGT, bilirubin and FIB-4 score.","low_causes":"Very low muscle mass, vitamin B6 deficiency","high_causes":"Liver disease, fatty liver, alcohol excess, medications, intense exercise, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, muscles and other tissues. Unlike ALT, which is more liver-specific, AST rises with muscle damage from training as well. Joseph's result of 33 IU/L is well within range and within the optimal band, which is reassuring alongside his resistance training schedule.","low_causes":"Vitamin B6 deficiency, uraemia","high_causes":"Liver disease, heart attack, muscle damage, intense exercise, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1849","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol consumption, bile duct obstruction and metabolic strain on the liver. Joseph's result of 27 IU/L is within the laboratory range for men (4 to 73) but slightly above the tighter optimal threshold of below 25. At 27, this is a borderline reading and not a concern, but it is worth monitoring over time. The liver overall is in good health.","low_causes":"Hypothyroidism, very low protein intake","high_causes":"Alcohol excess, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones and other tissues. It is useful for screening bile duct problems and bone disorders. Joseph's result of 46 IU/L sits right at the lower limit of the range, which is perfectly healthy and consistent with a liver and biliary system under no strain.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia, coeliac disease","high_causes":"Bile duct obstruction, bone disease, Paget's disease, vitamin D deficiency, liver disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. Elevated bilirubin can indicate liver disease, bile duct obstruction or excessive red cell breakdown. Joseph's result of 9 umol/L is comfortably mid-range and healthy.","low_causes":"Generally not clinically significant when low","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6933","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3653","upper_optimal_position":"0.6587","units":"g/L","description":"Total protein is the sum of albumin and globulin in the blood. Joseph's result of 84 g/L is marginally above the upper limit of 82. His albumin is at the top of its range at 50, reflecting excellent nutrition and liver synthetic function, and his globulin is a healthy 34. The marginal elevation is simply the arithmetic sum of two individually healthy components and is not clinically significant.","low_causes":"Malnutrition, liver disease, kidney disease (nephrotic syndrome), malabsorption","high_causes":"Dehydration, chronic infection, chronic inflammation, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6667","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and other substances and maintains fluid balance between blood vessels and tissues. Joseph's result of 50 g/L is at the top of range, reflecting excellent liver function and good nutritional status from his high-protein diet.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6481","units":"g/L","description":"Globulins are a group of proteins in the blood that include antibodies (immunoglobulins) and transport proteins. Joseph's result of 34 g/L is within range, reflecting a healthy immune and transport protein balance.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4190","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio is calculated by dividing albumin by globulin. It helps assess the balance between these two protein groups. Joseph's calculated ratio of 1.47 is within the optimal range, indicating a healthy balance between liver-produced albumin and immune-related globulins.","low_causes":"Liver disease, autoimmune disease, chronic infection, nephrotic syndrome","high_causes":"Immune deficiency (genetic), high protein diet with good liver function","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2483","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculation that uses age, ALT, AST and platelet count to estimate the likelihood of liver fibrosis (scarring). A score below 1.3 (or below 2.0 in people over 65) is reassuring. Joseph's score of 0.72 is well within the safe range, indicating no evidence of liver fibrosis.","low_causes":"Not clinically significant when low","high_causes":"Liver fibrosis, cirrhosis, age-related changes, low platelets, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4924","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands that helps digest starch. It is used to screen for pancreatic inflammation. Joseph's result of 82 IU/L is comfortably mid-range and indicates a healthy pancreas.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5035","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6312","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is a more specific marker for pancreatic disease than amylase. Joseph's result of 51 U/L is within range and confirms healthy pancreatic function.","low_causes":"Not clinically significant when low","high_causes":"Acute pancreatitis, chronic pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5508","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL and VLDL. Joseph's result of 5.7 mmol/L is above the desirable threshold of 5.18. While total cholesterol alone is a blunt measure, it contributes to the overall picture of his lipid profile, which shows elevated atherogenic particles alongside excellent protective markers.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, genetics, hypothyroidism, obesity, metabolic syndrome, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2353","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats circulating in the blood, primarily driven by carbohydrate and alcohol intake. Joseph's result of 0.8 mmol/L is excellent, sitting within the optimal range of below 1.0. This is one of the clear metabolic benefits of his low-carb dietary approach and reflects good insulin sensitivity.","low_causes":"Malnutrition, malabsorption, hyperthyroidism, very low fat diet","high_causes":"High carbohydrate diet, alcohol, obesity, metabolic syndrome, diabetes, hypothyroidism, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2308","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. Joseph's result of 0.36 mmol/L is well within the optimal range, consistent with his excellent triglyceride level and good metabolic function.","low_causes":"Low fat diet, malnutrition","high_causes":"High carbohydrate diet, obesity, metabolic syndrome, diabetes, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5484","lower_normal":"1.04","upper_normal":"2.05","lower_optimal":"1.4","upper_optimal":"2.05","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6742","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) cholesterol is often called the 'good' cholesterol because it carries cholesterol away from artery walls back to the liver for disposal. Joseph's result of 1.7 mmol/L is above the optimal male threshold of 1.4 and represents a genuine cardiovascular positive. This strong HDL level is helping to offset some of his elevated LDL risk.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome, poor diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, high fat diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5467","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) cholesterol is the primary carrier of cholesterol into artery walls, where it can accumulate and form plaques. Joseph's result of 3.68 mmol/L is above the upper limit of 3.0 and above the more stringent optimal target of 2.6, which is particularly relevant for someone with elevated Lp(a). Each LDL particle represents a potential deposit into the artery wall, and with Lp(a) already adding to that burden, reducing LDL is the most impactful modifiable change he can make.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet (saturated fat), genetics, hypothyroidism, obesity, familial hypercholesterolaemia, low-carb diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3722","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio gives a simple snapshot of the balance between total cholesterol and protective HDL cholesterol. Joseph's ratio of 3.35 is within the desirable range of below 4.5 and within the optimal target of below 4.0. This is driven by his strong HDL of 1.7 and is a positive finding despite the elevated total cholesterol.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"29.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3728","lower_normal":"20","upper_normal":"60","lower_optimal":"25","upper_optimal":"60","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5625","upper_optimal_position":"1","units":"%","description":"This expresses HDL cholesterol as a percentage of total cholesterol. A higher percentage means a greater proportion of the total is protective HDL. Joseph's result of 29.82% is above the desirable threshold of 20% and indicates that nearly a third of his circulating cholesterol is the protective type.","low_causes":"Low HDL, high total cholesterol, metabolic syndrome","high_causes":"High HDL, low total cholesterol, active lifestyle","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially atherogenic cholesterol particles (LDL, VLDL and Lp(a)-carried cholesterol) in one number. Joseph's result of 4.0 mmol/L sits right at the upper limit. This is a useful composite metric that aligns with his elevated LDL and ApoB findings.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"High LDL, diet, obesity, genetics, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5875","lower_normal":"1.2","upper_normal":"2.0","lower_optimal":"1.4","upper_optimal":"2.0","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6250","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. It reflects the number of protective HDL particles in the blood. Joseph's result of 1.41 g/L is above the reference minimum of 1.20 and within the optimal range, consistent with his strong HDL cholesterol level.","low_causes":"Genetic factors, metabolic syndrome, smoking, sedentary lifestyle","high_causes":"Exercise, moderate alcohol, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6056","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein found on every LDL, VLDL and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, this test effectively counts the number of particles that can deposit cholesterol in artery walls. Many cardiologists consider ApoB the single best predictor of cardiovascular risk. Joseph's result of 1.09 g/L is above the desirable limit of 0.9 and above the optimal target of below 0.8. Given his Lp(a) elevation, a portion of this ApoB count is driven by Lp(a) particles, which cannot be reduced by lifestyle changes. However, the LDL-driven portion can be reduced through dietary modification.","low_causes":"Malnutrition, hyperthyroidism, liver disease, genetic hypobetalipoproteinaemia","high_causes":"High LDL, diet, genetics, hypothyroidism, familial hypercholesterolaemia, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.773","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5521","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio balances the number of atherogenic particles (ApoB) against protective particles (ApoA-I). It is considered one of the most powerful predictors of cardiovascular risk. Joseph's ratio of 0.773 falls in the average risk category (0.7 to 0.9) rather than the lower risk category (below 0.7). For someone with elevated Lp(a), the target should ideally be below 0.7, and reducing LDL through dietary changes would bring this ratio down.","low_causes":"Low LDL, high HDL, healthy lipid metabolism","high_causes":"High LDL, low HDL, metabolic syndrome, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"170.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein that the body manufactures in a fixed quantity throughout life. It cannot be changed by diet, exercise, weight loss or any currently available lifestyle intervention. Joseph's result of 170.24 nmol/L is significantly above the threshold of 32 nmol/L, placing him in the moderate-to-high risk category. Lp(a) contributes to cardiovascular risk through three mechanisms: it deposits cholesterol in artery walls like LDL does, it promotes blood clotting by competing with the body's natural clot-dissolving system, and it drives inflammation at the artery wall. This is the most important finding in the report because it is permanent, inherited, and means that all other modifiable cardiovascular risk factors should be optimised as tightly as possible. First-degree relatives should also be tested.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1569","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride-to-HDL ratio is a simple calculation that reflects insulin sensitivity and metabolic health. A lower ratio is better. Joseph's calculated ratio of 0.47 is well within the optimal range of below 0.87, reflecting his excellent triglyceride control and strong HDL level. This is one of the strongest metabolic markers in his panel.","low_causes":"Low triglycerides, high HDL, excellent metabolic health","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2000","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant particles, which are increasingly recognised as an independent cardiovascular risk factor. Joseph's result of 0.32 mmol/L is within the optimal range of below 0.5, indicating that triglyceride-rich particles are not a significant contributor to his cardiovascular risk.","low_causes":"Low triglycerides, efficient lipid clearance","high_causes":"High triglycerides, metabolic syndrome, diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1100","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a marker of systemic inflammation produced by the liver. It is used in cardiovascular risk assessment because chronic low-grade inflammation contributes to arterial plaque development. Joseph's result of 1.1 mg/L is within the laboratory range of below 5 but above the tighter optimal threshold of below 1.0. In someone with elevated Lp(a), keeping inflammation as low as possible is important. Sleep restriction, which Joseph reports, is a well-documented driver of low-grade inflammation. Improving sleep duration and quality is likely to lower this marker.","low_causes":"Not clinically significant when very low","high_causes":"Infection, chronic inflammation, obesity, sleep deprivation, smoking, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle in a tube over one hour. Faster settling indicates more inflammation. Joseph's ESR of 1 mm/hour is about as low as it gets, providing strong reassurance that there is no significant systemic inflammatory process at work. Combined with his relatively low CRP, this rules out any major inflammatory condition.","low_causes":"Not clinically significant when low","high_causes":"Infection, autoimmune disease, cancer, anaemia, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Sodium is the main electrolyte that controls fluid balance and blood pressure. Joseph's result of 141 mmol/L is mid-range and within the optimal band, indicating normal fluid balance and kidney regulation.","low_causes":"Excess fluid intake, diuretics, adrenal insufficiency, SIADH, kidney disease","high_causes":"Dehydration, excess salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3077","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride is an electrolyte that works alongside sodium and bicarbonate to maintain acid-base balance and fluid balance in the body. Joseph's result of 91 mmol/L is below the lower limit of 95. Low chloride, alongside his low bicarbonate, may reflect the metabolic effects of his low-carb diet, where ketone body production alters the body's acid-base chemistry. This combination warrants a repeat test in three months to confirm it is stable and diet-related rather than progressive.","low_causes":"Vomiting, metabolic alkalosis, diuretics, ketoacidosis compensation, chronic respiratory acidosis","high_causes":"Dehydration, kidney disease, metabolic acidosis, excess saline infusion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"18.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3030","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's main buffer against acidity. It works with the lungs and kidneys to maintain the blood's pH within a very narrow range. Joseph's result of 18.4 mmol/L is below the lower limit of 20. On a low-carb diet, the body produces ketone bodies (beta-hydroxybutyrate and acetoacetate), which are mildly acidic. The bicarbonate buffer system consumes bicarbonate to neutralise these acids, which can lower the serum level. This is the most likely explanation, but it should be confirmed as stable on repeat testing.","low_causes":"Metabolic acidosis, ketosis, diarrhoea, kidney disease, renal tubular acidosis","high_causes":"Vomiting, metabolic alkalosis, diuretics, chronic respiratory acidosis, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"10","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3400","upper_optimal_position":"0.6067","units":"mmol/L","description":"Urea is a waste product formed when the liver breaks down protein. The kidneys filter it out for excretion in urine. Joseph's result of 10 mmol/L is above the upper limit of 8.2. On a high-protein diet, the liver processes more protein and produces more urea as a natural byproduct. In the context of adequate kidney function (eGFR above 60) and no other signs of kidney damage, this is almost certainly dietary rather than pathological. Hydration also plays a role, as mild dehydration concentrates urea.","low_causes":"Low protein diet, severe liver disease, overhydration, pregnancy","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding, heart failure, catabolic states","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"102","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6496","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3462","upper_optimal_position":"0.5897","units":"umol/L","description":"Creatinine is a waste product from normal muscle metabolism. The kidneys filter it out at a steady rate, so the blood level reflects kidney filtration efficiency. Joseph's result of 102 umol/L is within the laboratory range of 65 to 104 but near the top, which is expected in a muscular man on a high-protein diet that includes meat (creatine from meat is converted to creatinine). This is why   if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };

  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
