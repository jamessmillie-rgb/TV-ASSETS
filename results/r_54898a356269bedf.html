cium and phosphate balance. A suppressed PTH typically occurs when calcium is high, because calcium feeds back to switch PTH off. Unfortunately, a serum calcium was not included in this panel, so we cannot see whether this is the case. The lab notes that PTH results should be viewed with caution if the sample was not centrifuged and separated on the day of collection, which raises the possibility of a pre-analytical artefact. We would recommend repeating PTH alongside a serum calcium and phosphate through the GP to clarify this finding.\n\nHis immune markers show a finding worth noting. IgE, the immunoglobulin most closely associated with allergic responses, is 213 IU/mL against an upper limit of 100. IgE is the antibody class that drives hay fever, asthma, eczema, food allergies, and reactions to environmental allergens like dust mites and animal dander. An elevated IgE does not tell us what Joseph is allergic to, but it confirms that his immune system is producing an allergic response to something. Given his joint stiffness and the fact that he vapes, it may be worth exploring whether there is an unrecognised environmental or dietary allergen contributing to his symptoms. IgG, IgA, and IgM are all within range, and the tissue transglutaminase IgA test for coeliac disease is negative. His tumour markers are all reassuring: PSA at 0.83 with a free-to-total ratio of 33.7% (well above the 25% reassurance threshold), CEA below 0.5, and CA 19-9 at 1.48 are all well within normal limits.\n\nHis full blood count is largely healthy. Haemoglobin at 163, red cell count at 5.01, haematocrit at 0.469, platelets at 304, and white cell count at 6.33 are all solidly within range. The neutrophil-to-lymphocyte ratio calculates to 1.22, within the optimal range of 1.0 to 2.0, which is a good sign of balanced immune surveillance without chronic stress or inflammation. There are three minor haematology findings. MCH at 32.6 pg is marginally above the upper limit of 32, and MCHC at 347 g/L is marginally above the upper limit of 345. These indices describe how much haemoglobin is packed into each red cell. At these margins, this is almost certainly within the range of laboratory variation and instrument sensitivity, particularly as the lab notes that MCHC can be affected by temperature and storage. Reticulocytes, which are young red blood cells freshly released from the bone marrow, are 0.74% as a proportion (within range) but the absolute count at 37 x10^9/L is below the lower limit of 50. This suggests the bone marrow is producing red cells at a slightly lower rate than expected. With haemoglobin solidly at 163, there is no anaemia, so this likely reflects a body that simply does not need to make red cells at a high rate right now. It is worth monitoring. Monocytes at 0.08 x10^9/L are below the lower limit of 0.2. Monocytes are white blood cells that function as part of the innate immune system, engulfing pathogens and debris and presenting antigens to other immune cells. A low monocyte count in isolation, with all other white cell lines normal and no symptoms of infection, is usually a benign finding but should be noted and monitored on repeat testing.\n\nThe total antioxidant activity at 1.92 mmol/L is above the upper limit of 1.77. This marker measures the overall antioxidant capacity of the blood. Values above range are typically driven by dietary antioxidants, supplementation, or compounds like uric acid and bilirubin. In Joseph's case, a good quality diet and possible supplementation are the most likely explanation, and this is not a concern.\n\nThe urinalysis is entirely clean: no protein, no glucose, no ketones on dipstick, no blood, no white cells, no nitrites, no casts, and no urobilinogen. The specific gravity at 1.005 is on the dilute side, suggesting good hydration at the time of the sample.\n\nPulling this together, the most important finding in this report is the significantly elevated Lp(a) at 170, which places an inherited cardiovascular risk on Joseph's profile that cannot be modified through lifestyle. This makes the management of LDL and ApoB, which are modifiable, considerably more important. The lipid profile shows the classic low-carb trade-off: excellent metabolic markers (triglycerides, HDL, HOMA-IR) but elevated LDL particle count. The electrolyte pattern is consistent with nutritional ketosis. The suppressed PTH needs clarification with a calcium level. The elevated IgE suggests an allergic process that may be worth investigating, particularly in the context of his joint symptoms. And while the blood results cannot directly explain Joseph's poor sleep and fatigue, sleeping fewer than six hours most nights is, on its own, one of the most potent drivers of inflammation, impaired recovery, reduced testosterone over time, increased appetite, and accelerated biological ageing. Addressing sleep is arguably the single highest-yield intervention available to him.","links":"Joseph's results point to several clear areas of action, and we have structured these from most important to most practical.\n\nThe Lp(a) finding should be discussed with his GP at the earliest convenient opportunity. Joseph should bring the specific number, 170.24 nmol/L, and ask for it to be recorded permanently in his medical notes. He should request that first-degree relatives (parents, siblings, and in due course his children if applicable) are offered Lp(a) testing. The GP may wish to discuss whether the combination of raised Lp(a), LDL at 3.68 mmol/L, and ApoB at 1.09 g/L warrants pharmacological intervention, specifically statin therapy, which would not reduce Lp(a) but would bring LDL and ApoB down to reduce the total atherogenic burden. PCSK9 inhibitors are the only current class that modestly lowers Lp(a) and may be discussed in specialist lipid clinics. Regardless of any medication decision, Joseph should aim to bring his ApoB below 0.9 g/L through a combination of dietary and lifestyle strategies.\n\nFor the lipid profile specifically, the low-carb diet is delivering excellent triglyceride and HDL results, but the LDL and ApoB elevation mean some dietary adjustment would help. Adding soluble fibre is the single most effective dietary tool for lowering LDL without changing the overall macronutrient approach. Good sources include psyllium husk (5 to 10g daily, stirred into water before a meal), oats if he is willing to include some carbohydrate, ground flaxseed, and chia seeds. Increasing oily fish intake to three or four portions per week (salmon, mackerel, sardines, anchovies) provides omega-3 fatty acids that lower triglycerides further and have anti-inflammatory effects. Reducing saturated fat, particularly from butter, coconut oil, and fatty cuts of red meat, in favour of olive oil, avocado, and nuts, can lower LDL by 5 to 15% without abandoning a lower-carb framework. A plant sterol or stanol supplement (2g daily) can reduce LDL absorption by a further 7 to 10%.\n\nThe suppressed PTH should be repeated through the GP alongside a serum calcium and phosphate level to determine whether this is a genuine finding or a pre-analytical artefact. Joseph should mention the specific result (below 0.424 pmol/L against a range of 0.98 to 4.73) and request the repeat.\n\nThe elevated IgE at 213 IU/mL suggests an allergic process. If Joseph experiences any symptoms such as nasal congestion, skin irritation, wheeze, or gastrointestinal discomfort, he could request a specific IgE panel (RAST test) through his GP or an allergist to identify the trigger. Environmental allergens (dust mites, pet dander, moulds) and less obvious dietary allergens are worth exploring. The joint stiffness he reports could be related to an allergic or inflammatory process, though it could equally reflect the physical demands of resistance training with suboptimal recovery from poor sleep.\n\nThe electrolyte findings (chloride 91, bicarbonate 18.4, calculated anion gap approximately 31.6) are consistent with nutritional ketosis. Joseph should ensure he stays well hydrated, aiming for at least 2.5 to 3 litres of water daily, and consider adding a pinch of salt or an electrolyte supplement to his water, particularly around training. If he experiences symptoms such as nausea, rapid breathing, or confusion, he should seek medical advice. These electrolytes should be rechecked at his next blood test.\n\nFor sleep, which is arguably the most impactful lifestyle change available to Joseph, we would recommend the following approach. A fixed wake time seven days a week anchors the circadian rhythm more effectively than a fixed bedtime. Getting outside within an hour of waking for at least 10 minutes of natural light, even on overcast days, sets the cortisol awakening response and suppresses melatonin at the right time. A hard caffeine cut-off at midday, as caffeine has a half-life of five to six hours and nicotine from vaping also disrupts sleep architecture. The bedroom should be cool (16 to 18 degrees Celsius), dark, and free from screens for at least 30 minutes before lights out. Magnesium glycinate before bed (which he may already be taking given his excellent magnesium level) supports GABA activity and can improve sleep onset. Joseph should aim for a minimum of seven hours, ideally seven and a half to eight hours, of sleep per night. The low energy and fatigue he reports are almost certainly connected to chronic sleep restriction more than any blood marker.\n\nFor nutrition, Joseph's current weight of 93 kg at 188 cm gives a BMI of 26.3. His goal of losing body fat while building muscle requires a modest calorie deficit with high protein. His estimated maintenance calories, based on his weight, height, age, and moderate activity level (resistance three times, cardio once, 5,000 to 7,500 steps), are approximately 2,650 to 2,750 kcal per day. For fat loss, a deficit of 300 to 500 kcal would place him at 2,200 to 2,400 kcal daily. Protein should be the non-negotiable foundation at 1.6 to 2.0 g/kg, which means 149 to 186 grams of protein per day. At a diet volume of 6 out of 10, Joseph is eating a moderate amount, and he should ensure the deficit does not become too aggressive, as under-eating while training hard can suppress immune function (the low monocytes and low reticulocytes could be early whispers of this). Increasing daily steps from the current 5,000 to 7,500 range towards 8,000 to 10,000 would increase non-exercise energy expenditure meaningfully without adding recovery burden.\n\nFor B12, his level of 386 pg/mL is adequate but below the optimal threshold of 500. A sublingual methylcobalamin supplement at 1,000 mcg daily would bring this into the optimal range over two to three months.\n\nA retest in six months is recommended, focusing on a full lipid panel including ApoB and Lp(a) (to confirm the Lp(a) level), PTH with calcium and phosphate, full blood count to monitor monocytes and reticulocytes, electrolytes including bicarbonate and chloride, IgE if symptoms persist, and B12 to confirm supplementation response.","flags":"CARDIOVASCULAR: Lp(a) 170.24 nmol/L (limit below 32). Significantly elevated, moderate-to-high genetic cardiovascular risk. Permanent medical record recommended. First-degree relatives should be tested. LDL 3.68 mmol/L (limit below 3.0), ApoB 1.09 g/L (limit below 0.9), ApoB/A1 ratio 0.773 (limit below 0.7). In the context of the raised Lp(a), the combined atherogenic burden warrants GP discussion regarding possible pharmacological intervention. Total cholesterol 5.7 mmol/L (desirable below 5.18), non-HDL cholesterol 4.0 mmol/L (borderline).\n\nELECTROLYTES: Chloride 91 mmol/L (range 95 to 108), bicarbonate 18.4 mmol/L (range 20 to 31). Calculated anion gap approximately 31.6 (range 8 to 16). Pattern consistent with elevated anion gap metabolic acidosis, most likely nutritional ketosis in the context of a low-carb diet with normal glucose and HbA1c. Repeat on next panel.\n\nENDOCRINE: PTH below 0.424 pmol/L (range 0.98 to 4.73). Suppressed PTH without a paired calcium level. Lab notes pre-analytical caution. Recommend repeat PTH with serum calcium and phosphate through GP.\n\nIMMUNOLOGY: IgE 213 IU/mL (limit below 100). Elevated, suggesting an allergic process. Consider specific IgE panel if symptomatic.\n\nGLUCOSE AND INSULIN: Insulin 2.08 mIU/L (range 2.6 to 24.9), C-Peptide 0.252 ug/L (range 1.1 to 4.4), HOMA-IR 0.41 (range 0.5 to 1.5). All below range in the favourable direction. Glucose 4.4 and HbA1c 35 confirm excellent glycaemic control. These reflect high insulin sensitivity on a low-carb diet, not pancreatic insufficiency.\n\nHAEMATOLOGY: Monocytes 0.08 x10^9/L (range 0.2 to 1.0). Isolated low monocytes with all other lines normal. Monitor on repeat. Reticulocytes absolute 37 x10^9/L (range 50 to 100). Mildly low absolute reticulocyte count with normal haemoglobin, suggesting reduced erythropoietic drive rather than marrow pathology. Monitor. MCH 32.6 pg (range 27 to 32), MCHC 347 g/L (range 315 to 345). Marginally above range, likely laboratory variation.\n\nHORMONES: Free testosterone (calculated) 0.4211 nmol/L (range 0.013 to 0.25). Above range, driven by relatively low SHBG (26.3 nmol/L). Clinically favourable but noted for completeness.\n\nKIDNEY: Urea 10 mmol/L (range 3.2 to 8.2). Elevated, consistent with high protein intake. eGFR (creatinine) 78, eGFR (Cystatin C) 85. True GFR likely closer to Cystatin C estimate given muscle mass and dietary protein. No concern.\n\nLIVER: Total protein 84 g/L (range 57 to 82). Marginally above, driven by strong albumin and adequate globulin. Not pathological.\n\nANTIOXIDANT: Total antioxidant activity 1.92 mmol/L (range 1.3 to 1.77). Above range, likely dietary or supplemental. Not a concern.\n\nReassuring negatives: HbA1c 35 (no diabetes), FIB-4 0.72 (no fibrosis), PSA 0.83 with free ratio 33.7% (no prostate concern), CEA below 0.5 and CA 19-9 1.48 (tumour markers clear), thyroid antibodies negative (no autoimmune thyroid disease), coeliac screen negative, ESR 1 (no systemic inflammation), urinalysis entirely clear, CK 292 (within range, no rhabdomyolysis).","recommendations":"1. Book a GP appointment to discuss the Lp(a) result of 170.24 nmol/L. Request permanent recording in medical notes. Discuss whether pharmacological lipid-lowering therapy is appropriate given the combined LDL, ApoB, and Lp(a) burden.\n\n2. Request Lp(a) testing for first-degree relatives (parents, siblings).\n\n3. Request a repeat PTH with serum calcium and phosphate through the GP to clarify the suppressed PTH finding.\n\n4. Add 5 to 10 grams of psyllium husk daily before a meal to help lower LDL cholesterol. Increase oily fish to three to four portions per week. Shift cooking fats towards olive oil and away from butter and coconut oil.\n\n5. Prioritise sleep as the single highest-impact change. Set a fixed wake time, get morning daylight, cut caffeine by midday, and aim for a minimum of seven hours per night.\n\n6. Consider a specific IgE allergy panel if experiencing nasal, skin, respiratory, or gut symptoms, given the elevated total IgE.\n\n7. Increase daily steps from the current 5,000 to 7,500 range towards 8,000 to 10,000 to support fat loss and cardiovascular health.\n\n8. Maintain calorie intake at 2,200 to 2,400 kcal daily for gradual fat loss. Ensure protein intake of at least 149 grams per day, ideally 160 to 186 grams.\n\n9. Stay well hydrated at 2.5 to 3 litres of water daily and consider adding electrolytes (sodium, potassium, magnesium) to support the low-carb electrolyte pattern.\n\n10. Begin sublingual methylcobalamin B12 at 1,000 mcg daily to bring B12 into the optimal range.\n\n11. Retest in six months: full lipid panel with ApoB and Lp(a), PTH with calcium and phosphate, full blood count, electrolytes with bicarbonate, IgE, and B12.","supplementation":"Based on Joseph's results, the following supplements are recommended.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with a meal containing fat. This supports LDL and ApoB reduction, provides anti-inflammatory benefit relevant to his CRP of 1.1 and joint stiffness, and complements the dietary increase in oily fish. Choose a high-quality triglyceride-form fish oil for best absorption.\n\nVitamin D3 (cholecalciferol): continue current intake at 2,000 IU daily with a fat-containing meal to maintain his level of 99 nmol/L within the optimal range of 75 to 120. If he is not currently supplementing and has achieved this level through sun exposure alone, he should begin 2,000 IU daily heading into autumn and winter when UVB exposure drops.\n\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside vitamin D. Vitamin K2 directs calcium into bones and teeth and away from arterial walls, which is particularly important given the cardiovascular risk context.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Sublingual delivery bypasses any absorption issues in the gut. His current level of 386 pg/mL is adequate but below the optimal threshold of 500.\n\nMagnesium glycinate: 300 to 400 mg before bed. His magnesium at 1.0 mmol/L is within the optimal range, but glycinate form specifically supports sleep quality through GABA receptor activity, and given his sleep restriction this is a worthwhile addition. It also supports muscle recovery from resistance training.\n\nPsyllium husk: 5 to 10 grams daily, stirred into water and taken 15 to 20 minutes before a main meal. This is a soluble fibre that forms a gel in the gut, binding bile acids and forcing the liver to pull LDL cholesterol from the blood to make more. It can reduce LDL by 5 to 10% over 8 to 12 weeks.\n\nPlant sterols or stanols: 2 grams daily, either as a supplement or via fortified foods. These compete with cholesterol for absorption in the gut and can reduce LDL by a further 7 to 10%.\n\nElectrolyte supplement: a daily electrolyte blend containing sodium, potassium, and magnesium, particularly on training days and first thing in the morning. This helps offset the electrolyte losses that are inherent to a low-carb diet and may help with energy levels and the low chloride and bicarbonate findings.\n\nThe most important changes from this report are not supplements. They are getting seven or more hours of sleep per night, discussing the Lp(a) and lipid profile with his GP, and making the dietary shifts to bring ApoB below 0.9. No supplement can replace those three actions.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3393","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it a sensitive marker of liver health. Joseph's ALT at 38 IU/l is within the laboratory range of below 56 but above the tighter optimal threshold of 30 for men. In the context of his resistance training and high-protein diet, mild ALT elevations can occur from muscle turnover as well as liver activity. His GGT and bilirubin are both healthy, suggesting no significant liver pathology.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, medication effects, intense exercise, high alcohol intake","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6146","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, muscles, and kidneys. It is less specific to the liver than ALT because muscle damage from exercise can also raise it. Joseph's AST at 33 IU/l is comfortably within the reference range of 13 to 45 and within the optimal band, consistent with healthy liver and muscle function.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1849","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol, bile duct issues, and metabolic stress on the liver. It is one of the earliest markers to rise when the liver is under strain. Joseph's GGT at 27 IU/l is within the laboratory range of 4 to 73 for men but slightly above the tighter optimal threshold of 25. This is a very mild elevation and not a concern, but it is worth monitoring.","low_causes":"","high_causes":"Alcohol consumption, bile duct obstruction, fatty liver disease, metabolic syndrome, medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"116","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and gut. In adults, it primarily reflects liver and bone health. Joseph's ALP at 46 IU/l sits right at the lower boundary of the reference range of 46 to 116, which is healthy and indicates no bile duct obstruction or bone turnover issues.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Elevated bilirubin can indicate liver dysfunction, bile duct obstruction, or increased red cell breakdown. Joseph's bilirubin at 9 umol/l is comfortably within the reference range of 5 to 21 and within the optimal band, indicating healthy liver clearance.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7467","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4400","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins perform critical functions including maintaining blood volume, transporting hormones and nutrients, and supporting immune function. Joseph's total protein at 84 g/l is marginally above the upper limit of 82. With albumin at 50 (top of range) and globulin at 34 (within range), this is driven by strong overall protein status rather than any disease process.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Dehydration, chronic inflammation, infections, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6667","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and drugs, and serves as a marker of liver synthetic function and nutritional status. Joseph's albumin at 50 g/l sits right at the top of the reference range of 34 to 50, reflecting excellent liver function and good nutritional intake.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6481","units":"g/l","description":"Globulins are a group of proteins that include immunoglobulins (antibodies) and transport proteins. They play a central role in immune defence and in carrying substances through the blood. Joseph's globulin at 34 g/l is within the reference range of 18 to 36 and within the optimal band, indicating a healthy immune protein level.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5952","units":"","description":"The albumin-to-globulin ratio compares the two main protein fractions in the blood. A balanced ratio indicates healthy liver function and no overproduction of immune proteins. Joseph's ratio of 1.47 is well within the reference range of 1.1 to 2.5 and within the optimal band, reflecting a good balance between liver-produced albumin and immune-related globulins.","low_causes":"Liver disease, autoimmune conditions, overproduction of immunoglobulins","high_causes":"Immune deficiency, underproduction of globulins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"Fibrosis-4 Score","group":"LIVER & METABOLIC","result":"0.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2483","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the likelihood of liver fibrosis (scarring) using age, platelet count, ALT, and AST. A score below 1.3 (or 2.0 in those over 65) suggests a low risk of significant fibrosis. Joseph's score of 0.72 is comfortably below the 1.3 threshold, indicating no suggestion of liver scarring.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5303","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands that breaks down starches. Elevated amylase can indicate pancreatic inflammation (pancreatitis). Joseph's amylase at 82 IU/L is well within the reference range of 30 to 118, indicating healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5461","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. It is more specific to the pancreas than amylase and is the preferred marker for diagnosing pancreatitis. Joseph's lipase at 51 U/L is within the reference range of 13 to 60, confirming healthy pancreatic function.","low_causes":"","high_causes":"Pancreatitis, pancreatic cancer, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5503","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures the combined amount of all cholesterol carried in the blood, including LDL, HDL, and VLDL. Joseph's total cholesterol at 5.7 mmol/l is above the desirable threshold of 5.18. However, total cholesterol alone is a crude measure. The breakdown shows excellent HDL at 1.7 and low triglycerides at 0.8, meaning a significant portion of the total is protective HDL cholesterol. The concern lies with the LDL and ApoB fractions rather than the total number.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, low-carb diets, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2353","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat circulating in the blood. They come from dietary fat and from the liver converting excess carbohydrates into fat. High triglycerides are strongly associated with insulin resistance and metabolic syndrome. Joseph's triglycerides at 0.8 mmol/l are excellent, well within the optimal range of below 1.0, reflecting the metabolic benefit of his low-carb diet and high insulin sensitivity.","low_causes":"Low-fat diet, hyperthyroidism, malabsorption","high_causes":"High carbohydrate diet, insulin resistance, obesity, alcohol, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2308","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, is produced by the liver and carries triglycerides to tissues. It is a precursor to LDL and is associated with cardiovascular risk when elevated. Joseph's VLDL at 0.36 mmol/l is well within range and within the optimal band, reflecting low triglyceride production by the liver.","low_causes":"","high_causes":"High carbohydrate diet, insulin resistance, metabolic syndrome, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6538","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL, or high-density lipoprotein, is the protective cholesterol particle that removes excess cholesterol from artery walls and transports it back to the liver for disposal, a process called reverse cholesterol transport. Higher HDL is associated with lower cardiovascular risk. Joseph's HDL at 1.7 mmol/l is excellent, well above both the minimum desirable level of 1.04 and the optimal threshold of 1.4 for men. This is a genuinely strong finding.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetic predisposition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7560","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL, or low-density lipoprotein, is the primary carrier of cholesterol to tissues and artery walls. Elevated LDL is one of the strongest modifiable risk factors for cardiovascular disease because LDL particles can cross into artery walls and trigger plaque formation. Joseph's LDL at 3.68 mmol/l is above the reference limit of 3.0 and above the optimal target of 2.6. In the context of his raised Lp(a), managing LDL downward is particularly important.","low_causes":"Hyperthyroidism, malabsorption, very low-fat diet","high_causes":"Diet high in saturated fat, genetic predisposition, low-carb diets, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3722","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol-to-HDL ratio provides a quick snapshot of cardiovascular risk balance. A lower ratio indicates a more favourable balance between total and protective cholesterol. Joseph's ratio of 3.35 is within the desirable limit of below 4.5 and within the optimal band, reflecting his strong HDL compensating for the elevated total cholesterol.","low_causes":"","high_causes":"Low HDL, elevated total cholesterol, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"29.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7455","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"The HDL percentage shows what proportion of total cholesterol is carried by protective HDL particles. A higher percentage is better, with above 20% considered desirable. Joseph's HDL percentage at 29.82% is excellent, meaning nearly a third of his total cholesterol is the protective type.","low_causes":"Metabolic syndrome, obesity, sedentary lifestyle","high_causes":"Regular exercise, low-carb diet, genetic predisposition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all atherogenic (artery-damaging) cholesterol particles including LDL, VLDL, and remnants. Joseph's non-HDL at 4.0 mmol/l sits right on the upper boundary of the reference range of below 4.0. This is a borderline result that, in the context of his raised Lp(a), supports the case for dietary modification to bring it below 3.4.","low_causes":"","high_causes":"Elevated LDL, elevated triglycerides, diet, genetic factors","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5875","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles. Each HDL particle carries one ApoA1 molecule, so this is effectively a count of HDL particles. Higher ApoA1 is protective. Joseph's ApoA1 at 1.41 g/L is above the minimum desirable level of 1.20 and just above the optimal threshold of 1.40, indicating healthy HDL particle production.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6056","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the structural protein found on every atherogenic lipoprotein particle, including LDL, VLDL, and Lp(a). Because each particle carries exactly one ApoB molecule, this is effectively a direct count of all particles that can enter artery walls and drive plaque formation. Many cardiologists consider ApoB the single best measure of cardiovascular risk. Joseph's ApoB at 1.09 g/L is above the desirable limit of 0.9 and classified as borderline high. Combined with his significantly elevated Lp(a), this is a finding that warrants clinical attention.","low_causes":"Hyperthyroidism, malabsorption, very low-fat diet","high_causes":"Elevated LDL, genetic predisposition, low-carb diets, high saturated fat intake, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.773","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5521","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB-to-ApoA1 ratio balances the number of atherogenic particles (ApoB) against protective particles (ApoA1). It is considered one of the best summary measures of lipid-related cardiovascular risk. A ratio below 0.7 indicates lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. Joseph's ratio of 0.773 falls in the average risk category. The strong ApoA1 (HDL side) is partially offsetting the elevated ApoB, but bringing ApoB below 0.9 would improve this ratio meaningfully.","low_causes":"","high_causes":"Elevated LDL/ApoB, low HDL/ApoA1, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"170.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lp(a) is a genetically determined lipoprotein particle that consists of an LDL particle with an additional apolipoprotein(a) protein attached. It contributes to cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls like LDL, it promotes blood clotting by interfering with the fibrinolytic system, and it drives localised inflammation. Lp(a) levels are entirely determined by genetics and do not change meaningfully with diet, exercise, or currently available supplements. Joseph's Lp(a) at 170.24 nmol/L is significantly above the upper limit of 32 and sits in the moderate-to-high risk bracket. This result should be recorded permanently in his medical notes, and first-degree relatives should be offered testing.","low_causes":"","high_causes":"Genetic inheritance (not modifiable by lifestyle)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1569","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride-to-HDL ratio is one of the best surrogate markers for insulin resistance and the presence of small, dense LDL particles (the most atherogenic subtype). A lower ratio indicates better metabolic health. Joseph's ratio of 0.47 is excellent, well within the optimal range of below 0.87, confirming outstanding metabolic insulin sensitivity.","low_causes":"","high_causes":"Insulin resistance, high carbohydrate diet, metabolic syndrome, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2000","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant particles (VLDL remnants and chylomicron remnants), which are increasingly recognised as independent drivers of cardiovascular risk. Joseph's remnant cholesterol at 0.32 mmol/l is within the optimal range of below 0.5, indicating minimal atherogenic remnant burden.","low_causes":"","high_causes":"Elevated triglycerides, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It is the primary screening marker for diabetes and pre-diabetes. Joseph's glucose at 4.4 mmol/l is within the optimal range of 4.0 to 5.4, indicating excellent blood sugar control consistent with his low-carb diet and high insulin sensitivity.","low_causes":"Excessive insulin, prolonged fasting, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, medications, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_pct","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin molecules that have glucose attached to them, reflecting average blood sugar control over the past two to three months. A level below 6.0% is normal. Joseph's HbA1c at 5.3% is well within the normal range and within the optimal band, confirming excellent long-term glucose control.","low_causes":"Anaemia, blood loss, haemolytic conditions","high_causes":"Diabetes, pre-diabetes, sustained high blood sugar","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the IFCC-standardised measurement of HbA1c, expressing glycated haemoglobin in mmol per mol. A level below 42 mmol/mol is normal. Joseph's HbA1c at 35 mmol/mol is below the optimal ceiling of 36, confirming excellent long-term blood sugar control.","low_causes":"Anaemia, blood loss, haemolytic conditions","high_causes":"Diabetes, pre-diabetes, sustained high blood sugar","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2696","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3063","upper_optimal_position":"0.4483","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing to keep blood sugar controlled. In the context of ideal fasting glucose (4.4) and HbA1c (35), Joseph's insulin at 2.08 mIU/L being below the laboratory range of 2.6 to 24.9 reflects extremely low insulin demand rather than pancreatic failure. The pancreas simply does not need to produce much insulin because his tissues are highly responsive to it. This is a hallmark of low-carb diets and high insulin sensitivity.","low_causes":"Low-carb diet, high insulin sensitivity, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, metabolic syndrome, obesity, high carbohydrate diet, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.252","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1965","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/l","description":"C-Peptide is released by the pancreas in equal amounts to insulin, making it a reliable measure of endogenous insulin production that is not affected by injected insulin. Joseph's C-Peptide at 0.252 ug/l (approximately 83 pmol/L) is below the laboratory range of 1.1 to 4.4. Like the insulin result, this reflects low pancreatic demand in the context of excellent glycaemic control. The lab notes that samples not separated within four hours can degrade C-Peptide, which may also contribute to the very low reading.","low_causes":"Low-carb diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.41","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.2273","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated index of insulin resistance, derived from fasting glucose and fasting insulin. Lower values indicate better insulin sensitivity. Joseph's HOMA-IR at 0.41 is below the reference range of 0.5 to 1.5, which in this context is a positive finding, indicating exceptional insulin sensitivity. A HOMA-IR below 1.0 is considered optimal, and Joseph's result is well below even that threshold.","low_causes":"Low-carb diet, high insulin sensitivity, lean body composition","high_causes":"Insulin resistance, obesity, metabolic syndrome, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"46.22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2185","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"%","description":"HOMA-B estimates pancreatic beta-cell function as a percentage, calculated from fasting insulin and glucose. Joseph's HOMA-B at approximately 46% is below the reference range of 80 to 200. When glucose and HbA1c are both ideal (as they are here), a low HOMA-B reflects low insulin demand rather than failing beta-cell function. The pancreas is producing exactly what it needs to and no more.","low_causes":"Low-carb diet, low insulin demand, late-stage beta-cell failure","high_causes":"Insulin resistance (compensatory increase), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1100","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein is a marker of systemic inflammation produced by the liver. It is used both as a general inflammation marker and as a cardiovascular risk indicator. Levels below 1.0 mg/l are considered low cardiovascular risk, 1.0 to 3.0 is average risk, and above 3.0 is higher risk. Joseph's hs-CRP at 1.1 mg/l is within the laboratory range of below 5 but just above the optimal threshold of 1.0. This mild elevation could relate to his joint pain and stiffness, training-related inflammation, or poor sleep quality.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, poor sleep, stress, cardiovascular disease risk","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"The erythrocyte sedimentation rate measures how quickly red blood cells settle to the bottom of a test tube, which increases when inflammation is present. Joseph's ESR at 1 mm/hour is about as low as it gets, indicating no systemic inflammatory process. This is a very reassuring finding.","low_causes":"","high_causes":"Infection, autoimmune disease, cancer, chronic inflammation","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/l","description":"Sodium is the primary electrolyte that regulates fluid balance, blood pressure, and nerve function. Joseph's sodium at 141 mmol/l is within the reference range of 133 to 146 and within the optimal band, indicating normal fluid balance and kidney sodium handling.","low_causes":"Excessive water intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1026","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride is a major electrolyte that works alongside sodium to maintain fluid balance, blood pressure, and acid-base equilibrium. Joseph's chloride at 91 mmol/l is below the lower limit of 95. In combination with his low bicarbonate and the calculated elevated anion gap, this pattern is consistent with an elevated anion gap metabolic acidosis, most likely driven by ketone body production on his low-carb diet.","low_causes":"Metabolic alkalosis, vomiting, elevated anion gap acidosis, chronic respiratory acidosis","high_causes":"Dehydration, renal tubular acidosis, excessive saline infusion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"18.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1879","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's primary buffer against acid, maintaining blood pH within the very narrow range compatible with life. Joseph's bicarbonate at 18.4 mmol/l is below the lower limit of 20. The body uses bicarbonate to neutralise acids, so when acid production increases, as occurs with ketone body production on a low-carb diet, bicarbonate is consumed. This is the most likely explanation in the context of his dietary approach and normal glucose.","low_causes":"Metabolic acidosis, ketosis, diarrhoea, renal tubular acidosis, lactic acidosis","high_causes":"Metabolic alkalosis, vomiting, chronic respiratory acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6379","units":"mmol/l","description":"Magnesium is an essential mineral involved in over 300 enzymatic reactions including muscle and nerve function, blood sugar regulation, blood pressure control, and sleep quality. Joseph's magnesium at 1.0 mmol/l is within the optimal range of 0.85 to 1.05, which is a positive finding especially given his training load and reported sleep issues.","low_causes":"Poor dietary intake, alcohol, diuretics, intense exercise, chronic stress","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"292","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4034","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5557","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and are produced naturally by the body. Elevated uric acid can cause gout and is associated with cardiovascular and kidney disease. Joseph's uric acid at 292 umol/l is within the reference range of 220 to 547 and within the optimal range of 200 to 380 for men, indicating healthy purine metabolism.","low_causes":"Low purine diet, overhydration, certain medications","high_causes":"High purine diet, gout, kidney disease, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"10","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7333","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3400","upper_optimal_position":"0.6193","units":"mmol/l","description":"Urea is a waste product of protein metabolism, produced by the liver and excreted by the kidneys. Elevated urea can indicate kidney impairment or, more commonly, a high-protein diet. Joseph's urea at 10 mmol/l is above the reference range of 3.2 to 8.2. Given his low-carb, high-protein diet and his normal Cystatin C-based eGFR of 85, this elevation is almost certainly dietary in origin. The kidneys are clearing urea normally; there is simply more of it to clear.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"102","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6496","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6068","units":"umol/l","description":"Creatinine is a waste product of muscle metabolism, filtered by the kidneys and excreted in urine. It is used to estimate kidney function (eGFR). Joseph's creatinine at 102 umol/l is within the reference range of 65 to 104 but near the top, which is expected in a man who resistance trains three times per week and eats a high-protein diet, as both increase creatinine production. The Cystatin C-based eGFR of 85 provides a more accurate pictu avourable for muscle building, energy, and recovery.","low_causes":"High SHBG, ageing, obesity, liver disease","high_causes":"Low SHBG, high total testosterone, insulin resistance (can lower SHBG)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"26.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3819","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3851","upper_optimal_position":"0.5930","units":"nmol/l","description":"SHBG is a protein produced by the liver that binds testosterone, making it unavailable to tissues. Higher SHBG means less free testosterone. Joseph's SHBG at 26.3 nmol/L is within the laboratory range of 17.3 to 65.8 but towards the lower end and just above the optimal threshold of 25. Low SHBG is associated with insulin resistance and metabolic syndrome, but Joseph's excellent insulin sensitivity and metabolic markers suggest his SHBG is simply naturally on the lower side, resulting in higher free testosterone availability.","low_causes":"Insulin resistance, obesity, hypothyroidism, metabolic syndrome, anabolic steroids","high_causes":"Ageing, hyperthyroidism, liver disease, oestrogen, anticonvulsants","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5278","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index is a ratio of total testosterone to SHBG, providing another estimate of bioavailable testosterone. Joseph's FAI at 73 is within the reference range roup":"VITAMINS & NUTRIENTS","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and cell division. It works closely with vitamin B12 in these processes. Joseph's folate at 15 ng/ml is within the reference range of 3 to 17 and within the optimal band above 8, indicating excellent folate status.","low_causes":"Poor dietary intake, malabsorption, alcohol, medications (methotrexate), pregnancy","high_causes":"Supplementation, excessive dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"< 0.424","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3386","upper_optimal_position":"0.6013","units":"pmol/L","description":"PTH (parathyroid hormone) is produced by the four small parathyroid glands located behind the thyroid. Its primary role is to regulate calcium and phosphate levels in the blood. When calcium drops, PTH rises to release calcium from bones, increase calcium absorption from the gut, and reduce calcium loss in the kidneys. Joseph's PTH is reported as below 0.424 pmol/L, which is below the lower limit of 0.98. A suppressed PTH typically occurs when calcium is high (because calcium feeds back to switch PTH off), but no serum calcium was measured in this panel. The lab notes that PTH results should be viewed with caution if the sample was not centrifuged and separated on the day of collection. A repeat PTH with emory.","low_causes":"Immune deficiency, medications (immunosuppressants), nephrotic syndrome","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M (IgM)","group":"IMMUNOLOGY","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgM is the first antibody produced in response to a new infection. It is large and effective at activating the complement system. Joseph's IgM at 1.5 g/l is within the reference range of 0.5 to 3, indicating a healthy acute immune response capability.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A (IgA)","group":"IMMUNOLOGY","result":"1.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4731","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgA is the predominant antibody in mucosal surfaces (gut, respiratory tract, saliva) and plays a crucial role in mucosal immunity. Joseph's IgA at 1.8 g/l is within the reference range of 0.4 to 3.5, indicating healthy mucosal immune defence. An adequate IgA level also validates the coeliac screen (TTG IgA), as IgA deficiency can cause false negatives.","low_causes":"Selective IgA deficiency (most common immune deficiency), medications","high_causes":"Chronic infection, liver disease, autoimmune disease, IgA nephropathy" bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

}
