<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Charlotte Elizabeth Bywell","dob":"29/10/1979","report_date":"2026-11-10","summary":"Patient is a 47-year-old female presenting with a BMI of 24.8, following a vegetarian diet that includes eggs and dairy, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are about average (volume 5 out of 10). She does no dedicated cardio but trains with resistance twice a week at moderate intensity, with 2,000 to 5,000 daily steps. She sleeps 7 to 8 hours a night and wakes feeling refreshed, though her energy through the day is steady and stress feels hard to manage most days. She drinks 10 to 14 alcoholic drinks a week. She reports bloating and digestive discomfort, irregular periods, low sex drive, and low energy and fatigue, all present for over a year. She has a family history of thyroid disease, cancer (bowel, breast, prostate or ovarian), and dementia. She has no diagnosed conditions. The only medication she reports is a GLP-1 receptor agonist, which she is using for weight loss. She notes various allergies tested three years ago that included gluten intolerance, a very high-pressure stressful job with lots of travel, a diet that suffers because of that travel and her food intolerances, difficulty shifting weight and is now on a GLP-1 receptor agonist, a Medichecks test in May 2025 that did not highlight anything major, recent onset of menstrual irregularity, and a desire to establish a routine for better energy, gut health, longevity, and the right supplements. Her goals are to improve digestion and gut health, improve energy levels, and improve long-term health and longevity.\n\nThe finding in this report that should go to her GP first is her bicarbonate. Bicarbonate is the body's main acid buffer, the molecule that keeps the blood at a stable pH, and her level is 12.4 against a lower limit of 22, with an anion gap, which is calculated from it, of 23 against an upper limit of 20. Taken at face value these would point to an acid-base disturbance, but there is an important caveat: her sample was collected at 10:39 and reached the laboratory that evening, and bicarbonate is known to fall in samples that wait before analysis, which also pushes the calculated anion gap up. That cannot be confirmed from this sample, and a result this low should not be left unconfirmed, so she should ask her GP promptly to repeat the bicarbonate on a fresh sample. Her kidneys are in excellent health, which makes a kidney cause unlikely. If the repeat is still low, her GP can look for a cause, including gut losses and whether the GLP-1 receptor agonist she is taking could be contributing. Her calculated serum osmolality at 277.4 is at the lower end of the reference range.\n\nThe second finding that needs a GP conversation is her Lipoprotein(a), written Lp(a). This is a genetically inherited lipoprotein particle that carries cholesterol and promotes clotting and inflammation in arterial walls. Unlike LDL cholesterol, it cannot be changed by diet, exercise, or lifestyle. Her Lp(a) is 168.2 nmol/L, well above the 75 nmol/L threshold and more than double it. At this level, Lp(a) is considered a meaningful independent driver of cardiovascular risk. What makes this finding particularly important to understand is the context around it: almost every other cardiovascular marker in her panel is exceptional. Her LDL cholesterol is 1.48, her ApoB (the protein that sits on every atherogenic lipoprotein particle and is the best single measure of how many particles are entering arterial walls) is just 55 mg/dL, her HDL is an outstanding 2.58, her triglycerides are a very healthy 0.69, her ApoB to ApoA-I ratio is 0.28 (well below the 0.6 threshold for women), and her Lp(a)-corrected LDL, which strips out the cholesterol carried inside Lp(a) particles to show only the modifiable portion, is just 0.94 mmol/L. This means that the cholesterol she can control through diet and lifestyle is already at a near-ideal level. The cardiovascular risk her lipids carry comes almost entirely from the Lp(a) she inherited. Her Cardiovascular Risk Score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 35 out of 100, and the two inputs pulling it above the ideal zone of 20 are Lp(a) and hsCRP. She should record this Lp(a) result permanently, mention it to her GP alongside the rest of her lipid panel, and consider testing first-degree relatives, because it is inherited and they may carry the same elevation without knowing.\n\nHer hsCRP, high-sensitivity C-reactive protein, a general marker of systemic inflammation, is 2.15, above the ideal threshold of 1.0. In the context of her excellent liver function, clean autoimmune screen, and no obvious acute illness, this low-grade inflammation could reflect several things: visceral fat (though her BMI is healthy at 24.8, body composition at an estimated 35% body fat means she carries more fat relative to lean mass than the BMI suggests), stress (chronic psychological stress raises CRP through cortisol-mediated immune changes), alcohol (10 to 14 drinks a week is above the recommended limit and is a recognised driver of low-grade inflammation), or gut-related inflammation, which connects to her bloating symptoms. Her interleukin-5 is elevated at 14.46 against a limit of 1.49, and interleukin-22 is elevated at 8.18 against a limit of 6.51. IL-5 is a cytokine that activates eosinophils, the white blood cells involved in allergic and parasitic responses, and its elevation alongside a low eosinophil count (0.03, just below the 0.04 lower limit) suggests those eosinophils are being recruited to tissue rather than circulating in the blood. This pattern is associated with allergic conditions, food intolerances, and gut mucosal inflammation, all of which fit her history of allergies and gluten intolerance. IL-22 plays a role in gut barrier repair and mucosal defence, and mild elevation may reflect an active repair response in the gut lining. Her HB-EGF, heparin-binding epidermal growth factor-like growth factor, is marginally above range at 136.86 against an upper limit of 135.99, which at this margin is essentially at the boundary and not a concern on its own, though HB-EGF is involved in tissue repair and wound healing. Put together, the inflammation picture suggests a combination of gut mucosal activation, possible ongoing allergic or intolerance-driven inflammation, and the metabolic and lifestyle contributions of alcohol and stress. Her IL-15, a cytokine involved in immune cell survival, is low at 0.60 against a lower limit of 0.89, and her IL-8 is reported as below the assay threshold. These may reflect the same immune rebalancing rather than a separate problem.\n\nHer blood sugar control is interesting and needs careful interpretation. Her glucose is 5.20, within the healthy range. Her HbA1c, which measures average blood sugar over the preceding two to three months, is 32.79, which is excellent and well within the optimal zone below 36. Her fructosamine, another medium-term sugar average, is 232, comfortably within range. So there is no suggestion of diabetes or prediabetes. However, her insulin is 17.1 pmol/L, which is below the laboratory lower limit of 17.8, and her C-peptide (a molecule released in equal amounts to insulin by the pancreas, and a more stable measure of insulin production) is 0.90 ng/ml, below the lower limit of 1.1. Her HOMA-IR, the insulin resistance index calculated from glucose and insulin, is a very favourable 0.57, and her HOMA-B, the index of pancreatic beta-cell output, is 29, below the reference range of 60 to 200. Her non-esterified fatty acids (NEFAs), the free fats circulating in the bloodstream, are elevated at 1.59 against a limit of 0.9, and her adiponectin, a hormone released by fat cells that improves insulin sensitivity, is elevated at 15.68 against an upper limit of 14.1. This entire pattern, low insulin, low C-peptide, low HOMA-B, high adiponectin, high NEFAs, excellent HbA1c, is consistent with the effect of a GLP-1 receptor agonist. GLP-1 drugs work by enhancing insulin secretion only when glucose is elevated and by suppressing appetite. In the fasting state, they lower baseline insulin output, which is why fasting insulin and C-peptide appear low. The high NEFAs reflect active fat mobilisation, which is exactly what happens when insulin is low and the body is drawing on fat stores for energy. The high adiponectin is a positive sign of improving insulin sensitivity and fat-cell health. This is not pancreatic failure; it is the drug doing what it is designed to do. Her three diabetes autoantibodies, GAD65 at 10.8, IA-2 at 3.5, and insulin autoantibodies below 67.4, as well as ZnT8 autoantibodies at 29.6, are all well within their reference ranges, which makes autoimmune (Type 1) diabetes very unlikely.\n\nTurning to the considerable positives in this report. Her liver is in excellent health. ALT at 13 and GGT at 21.1 are both well within the optimal range, and in the context of 10 to 14 alcoholic drinks a week, a clean GGT is worth noting because GGT is the enzyme most sensitive to alcohol-related liver strain. Her AST at 20.3, GLDH at 2.0, ALP at 50, total bilirubin at 13, direct bilirubin at 3.34, bile acids at 1.40, albumin at 42.2, aldolase at 1.0, LDH at 342, and pancreatic amylase at 42 and lipase at 55 are all within their respective ranges. Her FIB-4 index, a fibrosis screening score, is 1.73, which is above the optimal threshold of 1.3 but below the upper limit of 2.67. This score is being influenced by her low platelet count (153, just above the lower limit of 150) and her age, both of which inflate the calculation. With every actual liver enzyme clean and her APRI at a healthy 0.332, there is no suggestion of liver scarring. Her NAFLD fibrosis score at minus 0.83 sits within the reference range and makes significant fibrosis unlikely.\n\nHer kidney function is excellent. Her creatinine-based eGFR is 97, her Cystatin C is 0.76 giving an eGFR of 105, and the combined eGFR is also 105. Cystatin C is a more reliable marker of kidney filtration than creatinine because it is not affected by muscle mass, and an eGFR of 105 at 47 is very healthy. Her urea at 3.01, uric acid at 172, beta-2-microglobulin at 1.20, and microalbumin-to-creatinine ratio showing no albumin detected in the urine all confirm healthy kidneys with no protein leak. This is reassuring in the context of the low bicarbonate, because it makes a kidney cause less likely.\n\nHer thyroid is working well. TSH at 1.76 is within the optimal range of 1.0 to 2.5, Free T4 at 15.70 and Free T3 at 4.49 are both within their laboratory ranges, her FT3 to FT4 ratio at 0.286 shows adequate conversion from the storage hormone to the active form, and her TBG (the binding protein that carries thyroid hormones in the blood) at 15.3 is within range. Both thyroid antibodies are negative: anti-TPO below 8 and anti-thyroglobulin at 16.1, both well below their thresholds. Given her family history of thyroid disease, the negative antibodies and healthy TSH are particularly reassuring.\n\nHer coeliac screen is negative, with anti-tissue transglutaminase antibodies at 0.3 against a threshold of 6.99. Given her reported gluten intolerance, this suggests a non-coeliac gluten sensitivity rather than coeliac disease, which is a useful distinction because it means there is no autoimmune damage to the intestinal lining from gluten exposure, though the intolerance itself and the symptoms it causes are still real and still need to be managed. Her H. pylori antibody is negative, which makes this common stomach bacterium unlikely as a cause of her bloating.\n\nHer full autoimmune panel is clean: rheumatoid factor at 6.96, anti-CCP below 8, ANA negative, intrinsic factor antibodies below 0.5, and gastric parietal cell antibodies at 1.20 are all well within their limits. This makes autoimmune gastritis, pernicious anaemia, rheumatoid arthritis, and systemic autoimmune conditions unlikely.\n\nHer immune system is balanced. IgG at 11.08, IgA at 2.50, IgM at 1.17, complement C3 at 1.25, C4 at 0.212, haptoglobin at 1.10, and IgE at 29.5 are all within range. The IgE being within range despite her allergy history suggests her allergies are not currently in an active flare.\n\nHer Epstein-Barr virus serology shows a past infection that has resolved. EBNA IgG at 11.4 and VCA IgG at 1320 are both strongly positive, while VCA IgM at 0.406 is negative. This pattern, positive IgG with negative IgM, means she caught EBV at some point in the past (as most adults have) and has developed lasting immunity. There is no active infection.\n\nHer tumour markers are all within range: AFP at 1.0, CEA at 1.9, CA 15-3 at 21.2, CA 19-9 at 11.7, CA 125 at 13.2, hCG below 0.2, mesothelin below 2.66, and calcitonin below 0.50. Given her family history of cancer, these are reassuring, though it is important to understand that tumour markers are screening tools and a normal result reduces the likelihood of certain cancers without eliminating it entirely.\n\nHer cardiac markers are reassuring. CK-MB at 0.887, creatine kinase at 58, and myoglobin at 27.56 are all well within range, and FABP-3 at 2.79 is below its threshold. Her troponin T is 14.10 against an upper limit of 14, which is essentially at the boundary. Troponin is a protein released when heart muscle cells are damaged, and at this margin, in the absence of any symptoms of chest pain, breathlessness, or other cardiac features, this is most likely assay variation rather than a clinical finding. It does not need urgent investigation, but if she ever has it repeated for another reason, this baseline is worth knowing.\n\nHer hormonal picture is consistent with a luteal-phase sample in a woman approaching perimenopause. Her oestradiol at 809 pmol/L and progesterone at 69.20 (above the upper limit of 46.3) suggest the sample was taken during the luteal phase of her cycle, the second half after ovulation, when both hormones are naturally at their highest. This is not an abnormal finding; it is timing. Her FSH at 3.92 and LH at 2.9 are both low, which is expected in the luteal phase when high oestradiol suppresses FSH and LH through negative feedback. At 47 with newly irregular periods, she is very likely in early perimenopause, the transition phase where cycles become variable in length and hormone levels fluctuate significantly from one month to the next. One snapshot of hormones during perimenopause can look entirely normal, as this one does, and the next month could look very different. Her SHBG (sex hormone binding globulin, the protein that carries sex hormones in the blood) is elevated at 151 against an upper limit of 128. High SHBG binds more testosterone and oestradiol, reducing the amount of each that is free and available to tissues. Her total testosterone at 1.09 is within the female range of 0.29 to 1.67, but her calculated free testosterone at 0.006 nmol/L is below the optimal band of 0.008 to 0.03, though still within the laboratory range. This means that while she is producing adequate testosterone, less of it is biologically active because SHBG is binding more of it. Low free testosterone in women is associated with reduced libido, which she reports, and can contribute to difficulty building muscle and low energy. SHBG is raised by oestrogen (which is high in the luteal phase), by alcohol, by low body weight, and by thyroid hormone. At 10 to 14 drinks a week, alcohol is likely contributing. Her DHEA-S at 2.2 umol/L  and cortisol at 216 are both within range, and her prolactin at 329 is within range.\n\nHer IGF-1, insulin-like growth factor 1, a hormone produced mainly by the liver in response to growth hormone, is 9.7 nmol/L, just below the lower limit of 10.7. IGF-1 is important for muscle maintenance, bone density, tissue repair, and recovery. Low IGF-1 can be driven by low protein intake (very relevant for a vegetarian whose diet is compromised by travel and intolerances), by caloric restriction or GLP-1-mediated appetite suppression, by high alcohol intake, and by chronic stress. All four of these apply to her. Low IGF-1 connects to her difficulty building muscle and shifting weight composition, and to her fatigue.\n\nHer MCV (mean cell volume, the average size of her red blood cells) is 101.5, above the upper limit of 100, and her MCH (mean cell haemoglobin, the average amount of haemoglobin per red cell) is 32.4, above the upper limit of 32. Her MCHC at 319 is marginally below the lower limit of 320. Together, these indicate mildly macrocytic red blood cells: slightly larger than normal and carrying slightly more haemoglobin each. The two most common causes of macrocytosis are B12 and folate deficiency, and alcohol. Her B12 at 336 is within the laboratory range of 197 to 771 but below the optimal zone of 500 to 900. Her active B12 at 68.2 is within range. Her folate at 9.9 and red cell folate at 1135 are both healthy. So B12 is adequate but not optimal, and alcohol at 10 to 14 drinks a week is the more likely driver of the mild macrocytosis, because alcohol directly interferes with red blood cell maturation in the bone marrow regardless of B12 status. Her haemoglobin at 132 is healthy and she is not anaemic.\n\nHer iron studies are in good shape. Ferritin at 47.33 is within range and within the optimal band of 40 to 150 for women, iron at 25.7, TIBC at 62, transferrin at 2.97, and transferrin saturation at 41.5% are all within their ranges. The saturation is slightly above the optimal band of 25 to 40%, but within the laboratory range of 15 to 50%, and in isolation this is not a concern.\n\nHer zinc at 9.4 is below the lower limit of 10.7 and below the optimal range of 12 to 18 umol/L. Zinc is essential for immune function, gut lining repair, taste and appetite, skin health, and hormone metabolism. Low zinc is common in vegetarians because plant-based zinc is less well absorbed than animal-source zinc due to phytates in grains and legumes. Her glutathione reductase at 29 is below the lower limit of 33. Glutathione reductase is an enzyme that recycles glutathione, the body's primary internal antioxidant, and it depends on riboflavin (vitamin B2) as a cofactor. A low glutathione reductase suggests low riboflavin status, which is again more common in vegetarians whose dairy intake may be limited by intolerances. Low riboflavin and low zinc together suggest that her vegetarian diet, already under pressure from travel and food intolerances, is not delivering enough of certain micronutrients.\n\nHer vitamin D at 74 is within the laboratory range but below the optimal zone of 75 to 120. At this level, supplementation to bring it into the 75 to 100 range would support bone health (relevant with her family history of dementia, because vitamin D also plays a role in brain health), immune function, and mood.\n\nHer globulin at 22.6 is marginally below the lower limit of 23. Globulins include immunoglobulins and transport proteins, and her individual immunoglobulins are all within range, so this marginal dip is unlikely to be clinically significant. Her total protein at 64.8 is at the lower edge of the range of 64 to 83, which in a vegetarian may reflect overall protein intake on the lower side.\n\nHer platelet count at 153 is just above the lower limit of 150. At this margin, this is not a concern in isolation. Her D-dimer at 0.201 is within range, her haptoglobin is normal (making haemolysis unlikely), and her other blood counts are healthy. The white cell count at 4.87, lymphocytes at 1.58, neutrophils at 2.76, monocytes at 0.47, and basophils at 0.03 are all within their ranges. Her NLR (neutrophil-to-lymphocyte ratio) at 1.75 is within the optimal band.\n\nHer urinalysis is entirely clean: no protein, no blood, no glucose, no ketones, no nitrites, no bilirubin, and no white cells in the urine.\n\nHer PhenoAge, a biological age estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP, and white cell count, is 43.3 years against her calendar age of 47, making her biologically 3.7 years younger than her chronological age. This is a positive finding. The markers holding it down are her excellent glucose control, healthy kidney function, and good albumin. The hsCRP at 2.15 is the main input working against the score, and bringing inflammation down through the lifestyle changes in this report would improve it further.\n\nHer HER2 ECD at 0.62 and pancreastatin below 3.40 are both within range. Her soluble IL-2 receptor alpha at 0.13, soluble IL-6 receptor at 1.30, soluble TNF receptor I at 0.50, and soluble TNF receptor II at 0.21 are all within their respective ranges, as are her complement components, EGF at 121, amphiregulin at 11.56, MCP-1 at 200, GM-CSF at 0.44, MMP-9 at 432.7, ASO at 110.6, and interleukins 3, 7, 12p70, 13, 17A, and 17F.","links":"The central thread in this report is a woman whose body is metabolically healthy but under strain from three directions: chronic stress, alcohol, and a vegetarian diet that is not delivering enough of what she needs because travel and food intolerances keep getting in the way. The GLP-1 receptor agonist is doing its job well, her blood sugar control is excellent, and the low insulin and C-peptide are the expected pharmacological effect rather than a sign of pancreatic trouble. The elevated NEFAs and adiponectin confirm she is mobilising fat effectively and her insulin sensitivity is strong.\n\nThe cardiovascular picture is split into what she can control and what she cannot. Everything modifiable is in excellent condition: LDL, ApoB, triglycerides, HDL, and every derived ratio are as good as they get. The risk comes from an inherited Lp(a) of 168, which she cannot change with diet or exercise. This is the single biggest long-term risk factor in the report and the reason to have a conversation with her GP about overall cardiovascular risk management, including whether the Lp(a) level, combined with her family history of cancer and dementia, changes how aggressively other risk factors should be managed.\n\nThe inflammation and immune markers tell a coherent story. The hsCRP is mildly elevated, and the cytokine panel points toward an allergic or mucosal-immune driver rather than a systemic inflammatory condition. Elevated IL-5 with low circulating eosinophils suggests eosinophil recruitment to tissue, most likely the gut, which fits her bloating, her known gluten intolerance, and her allergy history. Elevated IL-22 supports a gut-barrier repair process. The negative coeliac screen and negative H. pylori mean the gut symptoms are not autoimmune coeliac disease or H. pylori gastritis, leaving non-coeliac gluten sensitivity, other food intolerances, and possibly small intestinal bacterial overgrowth (SIBO) or a motility issue as the most likely explanations. The bloating that has persisted for over a year, combined with this cytokine signature, suggests further investigation with a hydrogen breath test and possibly a food and symptom diary.\n\nThe macrocytosis (large red blood cells), the low zinc, the low glutathione reductase (suggesting low riboflavin), the below-optimal B12, and the low IGF-1 all share a common upstream explanation: nutritional shortfall. A vegetarian diet can deliver all of these nutrients, but it requires deliberate planning, and she has told us that her diet suffers because of travel and food intolerances. Add GLP-1-mediated appetite suppression on top, and the total nutrient intake is likely falling short of what her body needs. The low IGF-1 in particular connects to her difficulty building muscle and her fatigue, because IGF-1 drives tissue repair and recovery.\n\nThe hormonal picture is a snapshot of early perimenopause with a high SHBG amplifying the effect. Her total testosterone is adequate but free testosterone is below optimal because SHBG is binding too much of it. SHBG is being driven up by oestrogen (high in the luteal phase), by alcohol, and possibly by the GLP-1 drug's effect on liver protein synthesis. Low free testosterone is the most likely explanation for her reduced libido, and it may also be contributing to her fatigue and difficulty with body composition.\n\nThe low bicarbonate is the loose end that does not fit neatly into the rest of the picture. Bicarbonate can fall in a sample that waits before analysis, so at 12.4 it needs confirming with a repeat on a fresh sample, and this is the first action for her GP. If it is still low, gut losses and the GLP-1 drug are among the causes her GP can consider.","lifestyle":"Add a deliberate source of protein to every meal: eggs, Greek yoghurt, lentils, chickpeas, tofu, or edamame. Anchor: before anything else goes on the plate, the protein goes on first. Why: her total protein and IGF-1 are both at the lower edge, and protein is the single nutrient most likely to be short on a vegetarian diet affected by travel and intolerances. Target: at least 108 grams of protein a day, which means roughly 30 to 35 grams at each of three meals.\nBuild a small repertoire of five or six travel-proof meals you can order or carry that are protein-rich, zinc-rich, and gluten-free. Examples: pot of Greek yoghurt with seeds, boiled eggs with an avocado, a lentil and rice bowl, a tofu and vegetable stir-fry. Anchor: plan these on Sunday evening for the week ahead. Why: the zinc deficiency, low riboflavin, and below-optimal B12 all point to a diet that is not delivering enough micronutrients because travel forces poor choices.\nReduce alcohol to under seven drinks a week, ideally under four. Start by choosing two alcohol-free days a week and anchoring them to specific days (Monday and Wednesday, for example). Why: 10 to 14 drinks is the most likely driver of her macrocytosis (MCV 101.5), is raising her SHBG (which is suppressing her free testosterone and contributing to low libido), is contributing to her hsCRP of 2.15, and is working against her IGF-1 and gut health.\nWalk for 15 minutes after your largest meal each day. Anchor: plate in the sink, shoes on. Why: a post-meal walk improves glucose disposal, supports gut motility (relevant to her bloating), and adds to a daily step count that is currently 2,000 to 5,000 and could do with being closer to 7,000 to 8,000.\nAdd one more resistance training session per week, bringing the total to three. Anchor: attach it to an existing routine day. Why: resistance training is the strongest driver of IGF-1, lean muscle mass, and metabolic rate, and at two sessions a week she is not quite at the threshold that moves the needle on body composition and bone density.\nGet outside within 30 minutes of waking for at least 10 minutes of natural light. Anchor: first thing after getting dressed. Why: morning light anchors the circadian rhythm, supports cortisol's natural morning peak (relevant with her chronic stress), and may help with the fatigue she reports despite sleeping 7 to 8 hours.\nSet a caffeine cut-off at 1pm. Anchor: after lunch is the last caffeinated drink of the day. Why: even when sleep duration is adequate, caffeine in the afternoon can reduce sleep quality enough to contribute to next-day fatigue and impair recovery.\nStart a simple food and symptom diary for two weeks: what you ate, when, and whether bloating occurred within four hours. Anchor: a notes app opened at each meal, takes 30 seconds. Why: identifying which foods trigger bloating will help target the gut investigation and may resolve the symptom faster than any supplement.","flags":"Bicarbonate is 12.4 mmol/L (range 22 to 29) with a calculated anion gap of 23 (limit 20). The sample was collected at 10:39 and received by the laboratory that evening, and bicarbonate falls in samples that wait before analysis, so a sample effect is possible and the result needs confirming. Her kidney function is excellent (eGFR 105), making a renal cause unlikely. Her GP should repeat bicarbonate promptly on a fresh sample and investigate further only if it is still low.\nLipoprotein(a) is 168.2 nmol/L, well above the 75 nmol/L threshold. This is a genetically inherited and unchangeable cardiovascular risk factor. It should be recorded permanently, discussed with her GP alongside the otherwise excellent lipid panel, and first-degree relatives should consider testing.\nhsCRP is 2.15 mg/L, above the ideal threshold of 1.0 mg/L. In the context of normal liver enzymes, negative autoimmune markers, and no acute illness, this low-grade inflammation is most likely multifactorial: alcohol at 10 to 14 drinks a week, chronic stress, estimated body fat at 35%, and possible gut mucosal inflammation as suggested by the cytokine pattern.\nInterleukin-5 is 14.46 pg/mL, nearly ten times the upper limit of 1.49, alongside a low eosinophil count of 0.03 (below the 0.04 lower limit). This pattern suggests eosinophil recruitment to tissue, most likely the gut given her symptoms and allergy history. Interleukin-22 is mildly elevated at 8.18 against a limit of 6.51, consistent with gut mucosal repair activity. IL-15 at 0.60 is below the lower limit of 0.89 and IL-8 is below the assay threshold. These findings support an allergic or intolerance-driven mucosal immune response.\nIGF-1 is 9.7 nmol/L, below the lower limit of 10.7. Low IGF-1 is associated with reduced muscle maintenance, impaired recovery, and fatigue. The most likely drivers are suboptimal protein intake on a vegetarian diet compromised by travel, GLP-1-mediated appetite suppression, alcohol, and chronic stress.\nMCV is 101.5 fL, above the upper limit of 100, with MCH at 32.4 (above the limit of 32) and MCHC at 319 (marginally below 320). Mild macrocytosis in the context of 10 to 14 alcoholic drinks per week and a B12 of 336 (within range but below optimal) is most likely alcohol-driven.\nZinc is 9.4 umol/L, below the lower limit of 10.7 and below the optimal range of 12 to 18. Low zinc is common in vegetarians due to phytate-mediated reduced absorption and may be contributing to gut barrier impairment and immune function.\nGlutathione reductase is 29 IU/L, below the lower limit of 33, suggesting low riboflavin (vitamin B2) status. Riboflavin deficiency is more common in vegetarians with restricted dairy intake.\nSHBG is 151 nmol/L, above the upper limit of 128 for women. High SHBG is reducing the bioavailable fraction of testosterone and oestradiol. Drivers include luteal-phase oestradiol elevation, alcohol, and possibly the GLP-1 drug. Calculated free testosterone at 0.006 nmol/L is below the optimal band of 0.008 to 0.03, which may explain her reported low libido.\nProgesterone is 69.20 nmol/L, above the upper limit of 46.3, and oestradiol is 809 pmol/L, consistent with a luteal-phase sample. FSH at 3.92 and LH at 2.9 are suppressed by the high oestradiol. These are timing-dependent findings rather than abnormalities, though at 47 with newly irregular periods, early perimenopause is likely.\nInsulin is 17.1 pmol/L, just below the lower limit of 17.8, and C-peptide is 0.90 ng/ml, below the lower limit of 1.1 ng/ml. HOMA-B is 29, below the range of 60 to 200. Non-esterified fatty acids are 1.59, above the 0.9 limit, and adiponectin is 15.68, above the 14.1 limit. This entire pattern is consistent with the expected pharmacological effect of a GLP-1 receptor agonist suppressing baseline insulin secretion and promoting fat mobilisation. HbA1c at 32.79, glucose at 5.20, and all four diabetes autoantibodies negative confirm there is no diabetes or prediabetes.\nTroponin T is 14.10 ng/L against an upper limit of 14. At this margin, with no cardiac symptoms, normal CK-MB, CK, myoglobin, and FABP-3, this is most likely assay variation. Worth noting as a baseline if ever repeated.\nGlobulin is 22.6 g/L, marginally below the lower limit of 23, with all individual immunoglobulins within range. Not clinically significant at this margin.\nVitamin D is 74 nmol/L, within the laboratory range but just below the optimal threshold of 75. Vitamin B12 is 336 ng/L, within range but below the optimal band of 500 to 900.\nFIB-4 is 1.73, above the optimal threshold of 1.3 but well below the upper limit of 2.67. The score is being driven by the calculation (platelets at 153, age 47) rather than by any sign of liver disease: every liver enzyme is within range.\nReassuring negatives: coeliac disease is unlikely (anti-tTG 0.3), thyroid disease is unlikely (TSH 1.76, both antibodies negative), autoimmune conditions including rheumatoid arthritis are unlikely (RF, anti-CCP, ANA all negative), pernicious anaemia is unlikely (intrinsic factor and parietal cell antibodies negative), diabetes is unlikely (HbA1c 32.79, all four diabetes autoantibodies negative), kidney disease is unlikely (eGFR 105, no proteinuria), liver scarring is unlikely (all enzymes normal, APRI 0.33), haemolysis is unlikely (haptoglobin normal), active EBV infection is unlikely (VCA IgM negative), and all tumour markers are within range.\nNot reported on this occasion: Pan-ProBNP, Leptin, Resistin, IL-6, TNFa, Cystatin C (Urine), NGAL, KIM-1, Gastrin, Pepsinogen I, Pepsinogen II, PGI/II ratio, Gastrin-17, mCRP, IL-1a, IL-1b, IL-2, IL-4, IL-10, IL-23, TGF-a, VEGF, MIP-1a, E-Selectin, L-Selectin, P-Selectin, ICAM-1, VCAM-1, PD-1, NSE, FABP-4, FABP-5, FABP-6, FABP-7, FABP-9, and all cytokine autoantibody markers.","recommendations":"Ask her GP to repeat the bicarbonate promptly on a fresh venous sample. Her result is 12.4 against a lower limit of 22, and it needs confirming because bicarbonate can fall in a sample that waits before analysis. If it is still low, the cause should be investigated.\nDiscuss Lp(a) of 168.2 nmol/L with her GP. This is an inherited cardiovascular risk factor that cannot be changed by lifestyle. Her GP should record it, assess her overall cardiovascular risk in the context of her family history, and consider whether first-degree relatives should be tested.\nMention the troponin T of 14.10 (at the boundary of 14) as a baseline value. No investigation is needed now, but it is worth having on her record.\nDiscuss her newly irregular periods at 47. FSH and LH are suppressed in this luteal-phase sample, which is normal timing, but early perimenopause is the most likely explanation for the irregularity. If symptoms worsen (hot flushes, mood changes, sleep disruption), hormone support options can be explored.\nRequest a hydrogen breath test to investigate her chronic bloating in the context of known gluten intolerance, elevated IL-5, and over a year of symptoms. This tests for SIBO (small intestinal bacterial overgrowth) and carbohydrate malabsorption, both common causes of bloating that blood tests cannot detect.\nIf the repeat bicarbonate is still low, ask her GP whether the GLP-1 drug she is taking could be contributing, and ask them to review the elevated NEFA and low C-peptide in the context of her treatment.\nRetest in four to six months, repeating: bicarbonate, hsCRP, zinc, glutathione reductase, B12, vitamin D, MCV, IGF-1, liver function, and a full blood count. If her periods continue to be irregular, include FSH and oestradiol timed to day 2 to 5 of a cycle if possible.\nCalorie target approximately 1,500 to 1,600 kcal per day for gradual fat loss (her TDEE is estimated at 1,705); protein target at least 108 grams per day (1.6 g per kg). These targets should be discussed with whoever prescribes her GLP-1 to ensure they align with her medication plan.","supplementation":"Zinc bisglycinate, 25 mg, taken with her evening meal. Why: her zinc is 9.4 against a lower limit of 10.7, and vegetarian diets are the most common cause. Zinc supports gut barrier integrity, immune function, and hormone metabolism. Take it away from any calcium or iron supplement by at least two hours.\nRiboflavin (vitamin B2), 25 mg, taken with breakfast. Why: her glutathione reductase at 29 (below 33) suggests low riboflavin status. Riboflavin is the cofactor glutathione reductase needs to recycle glutathione, the body's main internal antioxidant.\nVitamin B12 as sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue. Why: her B12 at 336 is within the laboratory range but below the optimal zone of 500 to 900, and vegetarians are at higher risk of B12 insufficiency because the vitamin is found almost exclusively in animal products. Sublingual delivery bypasses gut absorption, which matters if gut function is impaired.\nVitamin D3 (cholecalciferol), 2,000 IU daily, taken with her main meal that contains fat. Pair with vitamin K2 (MK-7) at 100 mcg daily to direct calcium to bone rather than soft tissue. Why: her vitamin D at 74 is just below the optimal threshold of 75, and she has a family history of dementia, for which vitamin D plays a supportive role in brain health.\nOmega-3 fish oil (or algal omega-3 if she prefers a vegetarian source), providing 2 grams of combined EPA and DHA daily, taken with food. Why: omega-3 has anti-inflammatory effects relevant to her hsCRP of 2.15 and may support the gut mucosal inflammation suggested by her cytokine pattern. Vegetarian diets are typically low in long-chain omega-3.\nMagnesium glycinate, 300 mg, taken before bed. Why: her magnesium at 0.81 is within range but below the optimal band of 0.85 to 1.05, and magnesium supports sleep quality, stress resilience, and muscle recovery, all relevant to her goals.\nThe most important changes from this report are not supplements. They are increasing protein intake at every meal, reducing alcohol to under seven drinks a week, and investigating her chronic bloating with a hydrogen breath test.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3636","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 40 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 57.1; held to 40 by troponin above range. Weakest systems: immunology 15%, inflammation 27%, electrolytes & minerals 35%. Biggest drags: Lipoprotein (a), High Sensitivity C-Reactive Protein (hsCRP), Bicarbonate, Troponin T.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"43.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4163","lower_normal":"","upper_normal":"52","lower_optimal":"","upper_optimal":"47","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4519","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP, and white cell count). At 43.3 against a calendar age of 47, she is biologically 3.7 years younger than her chronological age. This is a positive finding. The markers pulling it in the right direction are her excellent glucose control, healthy kidney function, and good albumin. The hsCRP at 2.15 is the main marker working against the score. RDW was reported by Randox at 13.3% and used in this calculation. Reducing alcohol, managing stress, and lowering inflammation through the lifestyle changes in this report would improve PhenoAge further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 that measures the cardiovascular risk being built, regardless of age. It is not a ten-year event risk. At 35, within the acceptable range of under 40 but above the ideal of under 20, the two inputs pulling the score up are her Lp(a) at 168.2 and her hsCRP at 2.15. Every modifiable lipid marker (LDL, ApoB, triglycerides, HDL) is excellent. The risk that exists comes from the inherited Lp(a) and from inflammation that lifestyle changes can reduce.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"132.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"115","upper_normal":"165","lower_optimal":"120","upper_optimal":"155","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"g/l","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Her level at 132 is within the healthy range for women (115 to 165) and she is not anaemic. It also sits within the optimal band of 120 to 155.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia, living at high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"41.400","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"37","upper_normal":"47","lower_optimal":"38","upper_optimal":"45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"%","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. At 41.4%, this is within the healthy range and the optimal band, indicating a good balance between red cells and plasma.","low_causes":"Anaemia, overhydration, chronic disease","high_causes":"Dehydration, polycythaemia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin (MCH)","group":"HEMATOLOGY","result":"32.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6933","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH is the average amount of haemoglobin packed into each red blood cell. At 32.4, it is marginally above the upper limit of 32. This is consistent with the mildly macrocytic (large) red blood cells shown by her MCV of 101.5, and is most likely driven by alcohol intake at 10 to 14 drinks a week and a B12 that, while in range, is below optimal.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, alcohol, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration (MCHC)","group":"HEMATOLOGY","result":"319.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3250","lower_normal":"320","upper_normal":"360","lower_optimal":"330","upper_optimal":"355","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/l","description":"MCHC is the average concentration of haemoglobin within each red blood cell. At 319, it is marginally below the lower limit of 320 by a single point. At this margin, this is laboratory variation rather than a clinical finding and does not suggest any specific condition.","low_causes":"Iron deficiency, thalassaemia, macrocytic anaemia","high_causes":"Hereditary spherocytosis, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Red Blood Cell Mean Cell Volume (MCV)","group":"HEMATOLOGY","result":"101.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6875","lower_normal":"76","upper_normal":"100","lower_optimal":"80","upper_optimal":"96","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"fl","description":"MCV measures the average size of red blood cells. At 101.5, it is mildly above the upper limit of 100, indicating macrocytosis, where red cells are slightly larger than normal. The two most common causes are B12 or folate deficiency and alcohol. Her folate is healthy, her B12 is adequate but below optimal at 336, and her alcohol intake at 10 to 14 drinks a week is the most likely primary driver. Alcohol interferes directly with red blood cell maturation in the bone marrow.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol, hypothyroidism, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"redbloodcellcount","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3800","lower_normal":"3.8","upper_normal":"5.8","lower_optimal":"4.0","upper_optimal":"5.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"10^12/l","description":"The red blood cell count measures the total number of red cells circulating in the blood. At 4.08, this is within the healthy range and the optimal band for women, confirming adequate red cell production.","low_causes":"Anaemia, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophilcount","name":"Basophil Count","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4074","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"10^9/l","description":"Basophils are a type of white blood cell involved in allergic responses and inflammation. At 0.03, this is within the healthy range and unremarkable.","low_causes":"Acute allergic reaction, stress, infection","high_causes":"Allergic conditions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophilcount","name":"Eosinophil Count","group":"HEMATOLOGY","result":"0.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3241","lower_normal":"0.04","upper_normal":"0.4","lower_optimal":"0.05","upper_optimal":"0.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3426","upper_optimal_position":"0.5741","units":"10^9/l","description":"Eosinophils are white blood cells that respond to allergic reactions and parasitic infections. At 0.03, just below the lower limit of 0.04, in the context of a markedly elevated interleukin-5 (the cytokine that activates and recruits eosinophils), this pattern suggests that eosinophils are being drawn out of the bloodstream into tissue, most likely the gut lining, where they are responding to an allergic or intolerance-driven process. This fits with her known allergy history and gluten intolerance.","low_causes":"Eosinophil recruitment to tissue, acute stress, corticosteroid use","high_causes":"Allergic conditions, parasitic infection, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytecount","name":"Lymphocyte Count","group":"HEMATOLOGY","result":"1.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4107","lower_normal":"1","upper_normal":"3.5","lower_optimal":"1.5","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"10^9/l","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, recognising and remembering infections. At 1.58, this is within the laboratory range and just above the optimal lower edge. A healthy lymphocyte count confirms her adaptive immune system is functioning well.","low_causes":"Viral infection, stress, immunosuppression, autoimmune disease","high_causes":"Viral infection, chronic inflammation, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytecount","name":"Monocyte Count","group":"HEMATOLOGY","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"0.2","upper_normal":"0.8","lower_optimal":"0.25","upper_optimal":"0.65","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"10^9/l","description":"Monocytes are white blood cells that engulf pathogens and dead cells and present them to the rest of the immune system. At 0.47, this is within the healthy range and the optimal band.","low_causes":"Bone marrow disorders, aplastic anaemia","high_causes":"Chronic infection, inflammatory conditions, recovery from infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophilcount","name":"Neutrophil Count","group":"HEMATOLOGY","result":"2.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3794","lower_normal":"2","upper_normal":"7.5","lower_optimal":"2.5","upper_optimal":"6.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"10^9/l","description":"Neutrophils are the most abundant white blood cells and form the first line of defence against bacterial infection. At 2.76, this is within the laboratory range. A healthy neutrophil count alongside a healthy total white cell count confirms her innate immune defence is working well.","low_causes":"Viral infection, certain medications, bone marrow disorders, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"whitebloodcellcount","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3817","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"10^9/l","description":"The white blood cell count measures the total number of immune cells circulating in the blood. At 4.87, this is within the laboratory range and confirms her immune system is not under significant stress from infection or inflammation at present.","low_causes":"Viral infection, bone marrow disorders, autoimmune conditions","high_causes":"Infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plateletcount","name":"Platelet Count","group":"HEMATOLOGY","result":"153","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3367","lower_normal":"150","upper_normal":"450","lower_optimal":"170","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3556","upper_optimal_position":"0.5889","units":"10^9/l","description":"Platelets are the small cell fragments that clump together to form blood clots and stop bleeding. At 153, this is just above the lower limit of 150 and below the optimal range. At this margin, this is not a clinical concern in isolation but is worth noting because it contributes to a mildly elevated FIB-4 score through the calculation.","low_causes":"Viral infection, alcohol, medications, bone marrow disorders, liver disease","high_causes":"Infection, inflammation, iron deficiency, splenectomy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width (RDW)","group":"SPECIALIZED TESTS","result":"13.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4867","lower_normal":"11","upper_normal":"16","lower_optimal":"11.5","upper_optimal":"14.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"%","description":"RDW measures the variation in size among red blood cells. A normal RDW alongside a mildly elevated MCV indicates that the macrocytosis is uniform (all cells are slightly larger) rather than mixed, which is more consistent with alcohol effect than with a mixed nutritional deficiency.","low_causes":"Normal variation","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gad65","name":"Glutamic Acid Decarboxylase 65 (GAD65)","group":"SPECIALIZED TESTS","result":"10.8","within_normal":"T
