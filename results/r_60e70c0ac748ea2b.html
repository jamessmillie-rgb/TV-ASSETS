t effective way to improve her metabolic rate and body composition.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"fatmass","name":"Fat Mass (estimated)","group":"SPECIALIZED TESTS","result":"23.8","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"kg","description":"Estimated fat mass is 23.8 kg. The GLP-1 therapy, combined with the elevated NEFAs and adiponectin, suggests she is actively mobilising this fat. The goal should be gradual reduction through a modest calorie deficit and increased protein and resistance training.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"proteintarget","name":"Protein Target","group":"SPECIALIZED TESTS","result":"108","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"g/day","description":"Her protein target is 108 grams per day, based on 1.6 grams per kilogram of body weight. This target supports muscle maintenance and growth alongside her resistance training, helps recover from exercise, and is particularly important on a vegetarian diet where protein density per meal tends to be lower.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"calorietarget","name":"Calorie Target","group":"SPECIALIZED TESTS","result":"1700","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"kcal/day","description":"Her calorie target is approximately 1,700 kcal/day, estimated at maintenance level for her current activity. With the GLP-1 drug already suppressing appetite and promoting fat mobilisation, a target of 1,500 to 1,600 kcal/day would support gradual fat loss while ensuring adequate nutrition. This should be discussed with whoever prescribes her GLP-1.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"iron","name":"Iron","group":"IRON STUDIES","result":"25.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5645","lower_normal":"5.8","upper_normal":"34.5","lower_optimal":"10","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3821","upper_optimal_position":"0.6144","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood bound to transferrin. At 25.7, this is within the healthy range and the optimal band, showing adequate iron availability for red blood cell production and energy metabolism.","low_causes":"Iron deficiency, chronic disease, vegetarian diet, blood loss","high_causes":"Haemochromatosis, iron overload, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"47.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4132","lower_normal":"14.999","upper_normal":"150","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3951","upper_optimal_position":"0.6667","units":"ug/l","description":"Ferritin is the body's main iron storage protein and the best single measure of iron reserves. At 47.33, this is within the laboratory range and within the optimal band for women (40 to 150). For a vegetarian, maintaining ferritin above 40 is a good result. It is worth monitoring over time, particularly if her periods become heavier during perimenopause.","low_causes":"Iron deficiency, blood loss, vegetarian diet, malabsorption","high_causes":"Iron overload, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"62.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4935","lower_normal":"44.8","upper_normal":"80.6","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3818","upper_optimal_position":"0.5866","units":"umol/l","description":"TIBC measures the blood's total capacity to bind and transport iron. At 62, this is within the healthy range and the optimal band, confirming that her iron transport system is functioning normally and her body is not desperately seeking more iron.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5130","lower_normal":"2","upper_normal":"3.8","lower_optimal":"2.3","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/l","description":"Transferrin is the protein that carries iron through the bloodstream to where it is needed. At 2.97, within the healthy range and the optimal band, this confirms normal iron transport capacity.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"41.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5857","lower_normal":"15","upper_normal":"50","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.5714","units":"%","description":"Transferrin saturation tells us what percentage of transferrin is carrying iron. At 41.5%, this is within the laboratory range of 15 to 50% but slightly above the optimal band of 25 to 40%. This is not a concern on its own and does not suggest iron overload in the context of a normal ferritin and normal transferrin.","low_causes":"Iron deficiency, chronic disease","high_causes":"Iron overload, haemochromatosis, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4370","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol fractions in the blood, including LDL, HDL, and VLDL. At 4.37, this is well within the target of under 5. However, total cholesterol is a blunt measure; the breakdown into its components (particularly LDL, HDL, ApoB, and Lp(a)) is far more informative.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet, genetic factors, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldlcholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2467","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL cholesterol is the form that delivers cholesterol to arteries and, when elevated, drives plaque formation. At 1.48, this is well below the target of 3 and well within the optimal zone of under 2.6. This is an excellent result and means the modifiable cholesterol she can influence through diet and lifestyle is already at a very healthy level.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8323","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5161","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL cholesterol is the protective fraction that carries excess cholesterol away from arteries and back to the liver for disposal. At 2.58, this is well above the 1.55 lower limit and the 1.6 optimal threshold for women. This is an outstanding HDL level that provides significant cardiovascular protection.","low_causes":"Sedentary lifestyle, smoking, obesity, poor diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"totalcholesterolhdlchole","name":"Total Cholesterol / HDL Cholesterol Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1690","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"%","description":"This ratio divides total cholesterol by HDL cholesterol to give a summary measure of cardiovascular risk. At 1.69, well below the target of 5 and the optimal zone of 4, this is an excellent result reflecting her very high HDL.","low_causes":"","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1500","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2174","units":"mmol/l","description":"Triglycerides are fats in the blood, and elevated levels are linked to cardiovascular risk and insulin resistance. At 0.69, well below the target of 2.3 and within the optimal zone of under 1.0, this is a very healthy result that confirms she does not have the insulin-resistance-driven triglyceride elevation that affects many people.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteinai","name":"Apolipoprotein A-I","group":"LIPIDS & CARDIOVASCULAR","result":"195.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5902","lower_normal":"101","upper_normal":"223","lower_optimal":"130","upper_optimal":"220","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4126","upper_optimal_position":"0.6585","units":"mg/dl","description":"Apolipoprotein A-I is the main protein on HDL particles and reflects the number of protective HDL particles circulating. At 195, this is within the healthy range and the optimal band, consistent with her excellent HDL cholesterol level.","low_causes":"Smoking, sedentary lifestyle, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3385","lower_normal":"53","upper_normal":"182","lower_optimal":"53","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4031","units":"mg/dl","description":"Apolipoprotein B is the protein that sits on every atherogenic (artery-damaging) lipoprotein particle, including LDL, VLDL, and Lp(a). It is considered the best single measure of how many particles are available to enter arterial walls. At 55 mg/dL (0.55 g/L), this is well below the laboratory limit of 182 and below the optimal target of 80 (0.8 g/L). This is an excellent result and confirms that the number of atherogenic particles from modifiable sources is very low.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High saturated fat diet, genetics, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinbairatio","name":"Apolipoprotein B / A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1556","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"","description":"This ratio compares atherogenic particles (ApoB) to protective particles (ApoA-I) and is one of the best single predictors of cardiovascular risk. At 0.28, well below the 0.6 optimal threshold for women and the 0.9 laboratory limit, this is an excellent result. It means she has far more protective HDL particles than harmful LDL particles.","low_causes":"","high_causes":"Elevated LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteincii","name":"Apolipoprotein CII","group":"LIPIDS & CARDIOVASCULAR","result":"5.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4931","lower_normal":"1.68","upper_normal":"9.17","lower_optimal":"2.5","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3698","upper_optimal_position":"0.6146","units":"mg/dl","description":"Apolipoprotein CII activates lipoprotein lipase, the enzyme that breaks down triglycerides in the bloodstream. At 5.27, within the healthy range, this confirms her triglyceride metabolism is functioning normally.","low_causes":"Genetic deficiency, impaired triglyceride clearance","high_causes":"Hypertriglyceridaemia, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinciii","name":"Apolipoprotein CIII","group":"LIPIDS & CARDIOVASCULAR","result":"8.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4407","lower_normal":"4.5","upper_normal":"18","lower_optimal":"5","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3457","upper_optimal_position":"0.5679","units":"mg/dl","description":"Apolipoprotein CIII inhibits lipoprotein lipase and slows the clearance of triglyceride-rich particles. Elevated levels are associated with higher cardiovascular risk. At 8.85, within the healthy range, this is functioning normally.","low_causes":"Normal variation","high_causes":"Insulin resistance, hypertriglyceridaemia, genetics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteine","name":"Apolipoprotein E","group":"LIPIDS & CARDIOVASCULAR","result":"6.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6196","lower_normal":"2.2","upper_normal":"7.3","lower_optimal":"3","upper_optimal":"6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3856","upper_optimal_position":"0.5817","units":"mg/dl","description":"Apolipoprotein E plays a role in clearing cholesterol-rich particles from the bloodstream and is involved in brain lipid metabolism. At 6.58, this is within the laboratory range but above the optimal band. It is still within normal limits and not a concern at this margin.","low_causes":"Normal variation","high_causes":"Hypertriglyceridaemia, genetic variants (APOE4), liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"smallldlcholesterol","name":"Small LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"17.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1435","lower_normal":"0","upper_normal":"60.8","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2467","units":"mg/dl","description":"Small dense LDL particles are more atherogenic than larger LDL particles because they penetrate arterial walls more easily and are more susceptible to oxidation. At 17.45, well below the threshold of 60.8, this is an excellent result confirming that her LDL particles are predominantly the larger, less harmful type.","low_causes":"","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein (a)","group":"LIPIDS & CARDIOVASCULAR","result":"168.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"75","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2133","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically inherited lipoprotein particle that deposits cholesterol in arterial walls, promotes blood clotting, and drives inflammation. Unlike LDL cholesterol, it cannot be changed by diet, exercise, or any current lifestyle intervention. At 168.2 nmol/L, this is more than double the 75 nmol/L threshold and well above the ideal of under 32. This is the single largest cardiovascular risk factor in her blood panel and exists alongside otherwise exceptional lipid markers. She should record this result permanently, discuss it with her GP as part of her overall cardiovascular risk assessment, and consider whether first-degree relatives should be tested, because Lp(a) is inherited.","low_causes":"","high_causes":"Genetic inheritance (cannot be modified by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homocysteine","name":"Homocysteine","group":"LIPIDS & CARDIOVASCULAR","result":"7.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3956","lower_normal":"5","upper_normal":"20","lower_optimal":"5","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4222","units":"umol/l","description":"Homocysteine is an amino acid that, when elevated, is associated with increased cardiovascular risk and may also affect brain health. It is regulated by B12, folate, and B6. At 7.8, within the optimal zone of under 9, this is a good result and suggests her B vitamin status is adequate for this pathway. Given her family history of dementia, a healthy homocysteine is particularly reassuring.","low_causes":"","high_causes":"B12 deficiency, folate deficiency, B6 deficiency, kidney disease, genetics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High Sensitivity C-Reactive Protein (hsCRP)","group":"INFLAMMATION","result":"2.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"1","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"mg/l","description":"hsCRP is a general marker of systemic inflammation produced by the liver in response to inflammatory signals. Values below 1 suggest low cardiovascular and systemic risk; 1 to 3 suggest moderate risk; above 3 suggests high risk or an acute process. At 2.15, her hsCRP is above the ideal of under 1 and sits in the moderate-risk zone. In the context of clean liver enzymes, negative autoimmune markers, and no acute illness, the likely contributors are alcohol at 10 to 14 drinks per week, chronic stress, estimated body fat at 35%, and possible gut mucosal inflammation as suggested by her elevated IL-5 and IL-22.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, smoking, metabolic syndrome, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aso","name":"Antistreptolysin O (ASO)","group":"INFLAMMATION","result":"110.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2765","lower_normal":"0","upper_normal":"200","lower_optimal":"0","upper_optimal":"200","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"iu/ml","description":"ASO measures antibodies against streptolysin O, a toxin produced by Group A streptococcal bacteria. Elevated levels indicate a recent streptococcal infection. At 110.6, within the threshold of 200, there is no evidence of a recent streptococcal infection.","low_causes":"","high_causes":"Recent streptococcal infection, rheumatic fever, post-streptococcal glomerulonephritis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ddimer","name":"D-Dimer","group":"INFLAMMATION","result":"0.201","within_normal":"TRUE","within_o ","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"32.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3904","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated (coated with sugar) over the past two to three months, giving an average picture of blood sugar control. At 32.79, well below the 42 threshold for concern and within the optimal zone of under 36, this is an excellent result that confirms sustained healthy blood sugar control.","low_causes":"Haemolytic anaemia, blood loss, some haemoglobin variants","high_causes":"Diabetes, prediabetes, chronic hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"17.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3318","lower_normal":"17.8","upper_normal":"173","lower_optimal":"17.8","upper_optimal":"56","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4154","units":"pmol/l","description":"Insulin measures the amount of insulin the pancreas releases to keep blood sugar in check. At 17.1 pmol/L, just below the lower limit of 17.8, this reflects the expected effect of a GLP-1 receptor agonist, which lowers baseline insulin secretion by enhancing the glucose-dependent insulin response. With a glucose of 5.20 and an HbA1c of 32.79, the low insulin is a sign that very little insulin is needed to maintain excellent blood sugar control, not a sign of pancreatic failure.","low_causes":"GLP-1 receptor agonist therapy, low-carbohydrate diet, high insulin sensitivity","high_causes":"Insulin resistance, obesity, metabolic syndrome, early type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nonesterifiedfattyacids","name":"Non-Esterified Fatty Acids (NEFA)","group":"GLUCOSE & INSULIN","result":"1.590","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mmol/l","description":"Non-esterified fatty acids (NEFAs) are free fats circulating in the blood, released from fat stores when insulin is low. At 1.59, above the threshold of 0.9, this is elevated. In the context of a GLP-1 receptor agonist and low insulin, this is the expected metabolic response: with less insulin in the fasting state, the body is actively mobilising stored fat for energy. This is not a sign of metabolic dysfunction; it is a sign that fat burning is active.","low_causes":"High insulin, fed state","high_causes":"Fasting, GLP-1 therapy, low insulin, insulin resistance, uncontrolled diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cpeptide","name":"C-peptide","group":"GLUCOSE & INSULIN","result":"0.90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3131","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ng/ml","description":"C-peptide is a molecule released by the pancreas in equal amounts to insulin, making it a stable marker of how much insulin the pancreas is actually producing (it is not affected by injected insulin). At 0.90 ng/ml, below the lower limit of 1.1, this reflects the same GLP-1-mediated suppression of baseline insulin secretion seen in the insulin result. The negative diabetes autoantibodies group":"GLUCOSE & INSULIN","result":"15.68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7178","lower_normal":"3.81","upper_normal":"14.1","lower_optimal":"5","upper_optimal":"14.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3719","upper_optimal_position":"0.6667","units":"ug/ml","description":"Adiponectin is a hormone produced by fat cells that improves insulin sensitivity, reduces inflammation, and protects blood vessels. Higher levels are generally beneficial. At 15.68, mildly above the upper limit of 14.1, this is a positive finding associated with good metabolic health and may be enhanced by the GLP-1 therapy improving fat cell signalling. This is one of the markers that should move in this direction.","low_causes":"Obesity, insulin resistance, metabolic syndrome","high_causes":"Lean body composition, good insulin sensitivity, GLP-1 therapy, weight loss","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"microalbumincreatininera","name":"Microalbumin / Creatinine Ratio","group":"KIDNEY FUNCTION","result":"not detected","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"30","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/mmol","description":"This ratio measures tiny amounts of albumin protein leaking into the urine, which is one of the earliest signs of kidney damage. No albumin was detected, confirming healthy kidneys with no protein leak.","low_causes":"","high_causes":"Kidney disease, diabetes, hypertension, exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"67.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4837","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"85","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3821","upper_optimal_position":"0.6260","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism filtered by the kidneys. At 67.5, within the healthy range and optimal band for women, this confirms healthy kidney filtration.","low_causes":"Low muscle mass, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated Glomerular Filtration Rate (eGFR)","group":"KIDNEY FUNCTION","result":"97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8083","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"ml/min/1.7","description":"eGFR estimates how well the kidneys filter waste from the blood, calculated from creatinine, age, and sex. At 97, above the 90 optimal threshold and well above the 60 lower limit, this confirms healthy kidney function.","low_causes":"Kidney disease, dehydration, medications","high_causes":"Pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4653","lower_normal":"0.57","upper_normal":"1.05","lower_optimal":"0.6","upper_optimal":"0.95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5972","units":"mg/l","description":"Cystatin C is a protein produced by all cells at a constant rate and filtered by the kidneys. It is a more reliable marker of kidney function than creatinine because it is not affected by muscle mass. At 0.76, within the healthy range and optimal band, giving an eGFR of flavin status. Riboflavin deficiency is more common in vegetarians, particularly those with limited dairy intake due to food intolerances. Supplementing B2 directly should correct this.","low_causes":"Riboflavin (vitamin B2) deficiency","high_causes":"Riboflavin supplementation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"zinc","name":"Zinc","group":"VITAMINS & NUTRIENTS","result":"9.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2696","lower_normal":"10.7","upper_normal":"17.5","lower_optimal":"12","upper_optimal":"17.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3971","upper_optimal_position":"0.6667","units":"umol/l","description":"Zinc is an essential trace mineral involved in over 300 enzymatic reactions, including immune function, gut lining repair, wound healing, taste, appetite, and hormone metabolism. At 9.4, below the lower limit of 10.7 and below the optimal range of 12 to 18, she is deficient. This is common in vegetarians because plant-based zinc is less well absorbed than animal-source zinc due to phytates in grains and legumes. Low zinc may be contributing to her gut barrier impairment, reduced immune regulation, and difficulty with body composition.","low_causes":"Vegetarian diet, phytate-rich foods, malabsorption, chronic diarrhoea, stress","high_causes":"Supplementation, excessive intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folicacid","name":"Folic Acid","group":"VITAMINS & NUTRIENTS","result":"9.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4300","lower_normal":"3","upper_normal":"26.8","lower_optimal":"8","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4034","upper_optimal_position":"0.5714","units":"ug/l","description":"Folic acid (folate) is a B vitamin essential for DNA synthesis, red blood cell production, and neural development. At 9.9, within the healthy range and the optimal band of above 8, this is a good result for a vegetarian (green vegetables and legumes are rich sources of folate).","low_causes":"Poor diet, malabsorption, alcohol, certain medications","high_causes":"Supplementation, folate-rich diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"336","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4141","lower_normal":"197","upper_normal":"771","lower_optimal":"500","upper_optimal":"771","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5093","upper_optimal_position":"0.6667","units":"ng/l","description":"Vitamin B12 is essential for nerve function, DNA synthesis, and red blood cell production. At 336, within the laboratory range of 197 to 771 but below the optimal zone of 500 to 900, her B12 is adequate but not ideal. B12 is found almost exclusively in animal products, so vegetarians are at higher risk of insufficiency. Her active B12 at 68.2 is within range, confirming that her cells are still receiving adequate B12 for now, but the total level should be improved with sublingual methylcobalamin supplementation.","low_causes":"Vegetarian diet, malabsorption, pernicious anaemia, gastric acid suppression","high_causes":"Supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3579","lower_normal":"50","upper_normal":"375","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.4051","units":"nmol/l","description":"Vitamin D is essential for calcium absorption, bone health, immune function, mood regulation, and brain health. At 74, within t hin the optimal range of 1.0 to 2.5, her thyroid is receiving just the right amount of stimulation and is working well. Given her family history of thyroid disease, this is reassuring.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, thyroid medication underreplacement, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4639","lower_normal":"11.9","upper_normal":"21.6","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4055","upper_optimal_position":"0.6117","units":"pmol/l","description":"Free T4 is the unbound form of thyroxine, the main hormone produced by the thyroid. It is converted into the active form (T3) in tissues. At 15.70, within the healthy range and the optimal band of 14 to 20, the thyroid is producing adequate hormone.","low_causes":"Hypothyroidism, iodine deficiency, pituitary dysfunction","high_causes":"Hyperthyroidism, thyroid medication excess, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free Tri-iodothyronine (FT3)","group":"THYROID","result":"4.49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4586","lower_normal":"3.1","upper_normal":"6.8","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4595","upper_optimal_position":"0.6396","units":"pmol/l","description":"Free T3 is the active thyroid hormone that drives metabolism, energy, and body temperature. At 4.49, within the laboratory range but just below the optimal band of 4.5 to 6.5, conversion from T4 to T3 is adequate but could be stronger. Zinc deficiency and stress can impair T4 to T3 conversion, so correcting her zinc igh_causes":"Mid-luteal phase, pregnancy, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sexhormonebindingglobuli","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"151.00","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7469","lower_normal":"32.4","upper_normal":"128","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3598","upper_optimal_position":"0.5690","units":"nmol/l","description":"SHBG is a protein produced by the liver that binds and carries sex hormones, particularly testosterone and oestradiol, in the blood. The more SHBG there is, the less free (active) hormone is available to tissues. At 151, above the upper limit of 128, her SHBG is elevated. This is being driven by high luteal-phase oestradiol, alcohol (which stimulates liver SHBG production), and possibly the GLP-1 drug. The effect is to reduce the bioavailable fraction of her testosterone, which is the most likely explanation for her reported low libido. SHBG should come down as alcohol is reduced.","low_causes":"Obesity, insulin resistance, hypothyroidism, androgens","high_causes":"Oestrogen, alcohol, hyperthyroidism, liver disease, oral contraceptives, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeandrogenindex","name":"Free Androgen Index","group":"HORMONES","result":"0.72","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3596","lower_normal":"0.3","upper_normal":"5.62","lower_optimal":"1.0","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3772","upper_optimal_position":"0.5652","units":"%","description":"The Free Androgen Index estimates the proportion of testosterone that is not bound to SHBG and is therefore biologically active. At 0.72, within the laboratory range but below the optimal band tary working harder to maintain thyroid output","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hormonalassessment","name":"Hormonal Assessment","group":"HORMONES","result":"Perimenopause, high SHBG","within_normal":"FALSE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Luteal-phase pattern with oestradiol at 809 and progesterone at 69.20 (confirming ovulation). SHBG at 151 (elevated) is reducing free testosterone to 0.006 (below optimal). Newly irregular periods at 47 suggest early perimenopause. IGF-1 at 9.7 is below range.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3879","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone includes both free testosterone and testosterone loosely bound to albumin, representing the total fraction that can act on tissues. At 0.14, within the reference range and just within the optimal band, this is at the lower edge. It confirms that while bioavailable testosterone is technically adequate, it is not robust, consistent with the low free testosterone finding.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"5.36","within_normal":"TRUE","within_ function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
