<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Motrea Simoneac","dob":"23/02/1980","report_date":"2026-10-22","summary":"Customer is a 46-year-old female presenting with a BMI of 23.4, following an intermittent fasting pattern, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). She trains four times per week (two cardio, two resistance) at moderate intensity with 7,500 to 10,000 daily steps. She sleeps 7 to 8 hours but wakes tired most mornings, with energy at its lowest on waking; stress feels hard to manage some weeks. She does not drink alcohol. She supplements vitamin D, magnesium, omega-3 fish oil, zinc and vitamin B12. She has a diagnosis of hypothyroidism (Hashimoto's) and polycystic ovary syndrome (PCOS). Her surgical and menstrual history is significant: at 16 she had a large ovarian cyst removed from the left ovary after six months of continuous bleeding, and since then her periods have been irregular. In 2020, following a car accident, she experienced nine months without a period, and in 2021 she had a second laparoscopic cystectomy on the same ovary. She used Mounjaro from September 2025 to June 2026, losing two stone, and briefly started retatrutide in August 2026 before stopping after two injections pending a health check. She reports hot flushes since 2024, joint pain and stiffness, bloating and digestive discomfort, hair thinning, and headaches. Her periods are irregular, sometimes monthly, sometimes with gaps of up to three months. Her previous blood test was reported as normal. Her goals are to balance her hormones, improve digestion and gut health, and lose body fat. There is a family history that was not specified.\n\nThe most important finding in this report is the hormonal picture, which tells a coherent story. Her FSH, follicle-stimulating hormone, the signal the pituitary gland sends to the ovaries to produce eggs and hormones, is 25.4. This sits above the normal follicular-phase range of 2.5 to 10.2 and within the postmenopausal range of 23 to 116. Her oestradiol, the main form of oestrogen, is 111 pmol/L, which is at the low end of the follicular range and close to the postmenopausal ceiling of 118. Her progesterone is below 0.21, consistent with either the early follicular phase or with anovulation, meaning the ovaries did not release an egg in this cycle. Her LH, luteinising hormone, the partner signal to FSH, is 7.51, which is within the follicular range. Taken together, and placed alongside her irregular periods, hot flushes since 2024, and her age, this pattern is strongly suggestive of perimenopause, the transitional phase before menopause in which the ovaries produce less oestrogen and cycles become erratic. Her PCOS diagnosis adds complexity because PCOS itself causes irregular cycles, but the elevated FSH and the hot flushes point towards ovarian reserve declining rather than PCOS alone driving the irregularity. This is a conversation for her GP or a specialist in menopause and reproductive endocrinology, because hormone replacement therapy (HRT) could address the hot flushes, the joint pain, the fatigue on waking, and the hair thinning, all of which are recognised features of falling oestrogen.\n\nHer testosterone is 0.4, below the female reference range of 0.5 to 2.6, and her free testosterone, the portion not bound to proteins and available for the body to use, is 0.007, also below range at 0.01 to 0.25. Low testosterone in women is associated with fatigue, reduced libido, difficulty building or maintaining muscle, joint stiffness, and hair thinning, several of which she reports. In the context of perimenopause, testosterone production from the ovaries and the adrenal glands declines alongside oestrogen. Her DHEA-S, dehydroepiandrosterone sulphate, a precursor hormone made by the adrenal glands that the body converts into testosterone and oestrogen, is 2.1 umol/L (774 ug/dL), which is within range but not high, confirming that the adrenal contribution to androgen production is modest. Her SHBG, sex hormone binding globulin, the protein that binds testosterone and makes it unavailable, is 39.1, which is within range and not excessively high, so the low testosterone is a production issue rather than a binding issue. The bioavailable testosterone, the fraction free to act on tissues, is 0.13, just inside the lower boundary of the reference range. This reinforces the recommendation to discuss testosterone replacement alongside any oestrogen replacement with her prescriber. It is worth noting that her free androgen index of 1.02 is within the female range, which is reassuring in the context of PCOS because a high free androgen index would suggest androgen excess driving symptoms, and hers does not.\n\nBefore moving to the other findings, it is important to place the positives in this report, because there are many. Her thyroid is working well. Despite carrying a diagnosis of hypothyroidism and Hashimoto's, her TSH, the signal the pituitary sends to the thyroid to produce hormone, is 1.4, which is within the ideal range of 1.0 to 2.5. Her free T4, the storage form of thyroid hormone, is 14.6, which is within the laboratory range of 11.5 to 22.7 but sits in the lower quarter. Her free T3, the active form, is 5.1, comfortably within the ideal range, and her FT3 to FT4 ratio of 0.349 shows that she is converting T4 to T3 efficiently. Both thyroid antibodies, TPO and thyroglobulin, are negative, which is genuinely surprising given the Hashimoto's diagnosis. It may mean that her autoimmune activity has quietened, or it may mean the original diagnosis was based on antibodies that have since fallen below detection. Either way, at this point in time, the thyroid is functioning well and does not explain her fatigue.\n\nHer blood sugar control is excellent. Fasting glucose is 4.2, within the ideal range below 5.4. HbA1c, the three-month average of blood sugar, is 39 mmol/mol, within the ideal zone below 42. Insulin is 6.62, within the ideal range of 2 to 8. HOMA-IR, a calculated measure of insulin resistance that combines fasting glucose and insulin, is 1.24, within range at 0.5 to 1.5. C-peptide, a molecule released in equal amounts to insulin and used to confirm pancreatic output, is 1.57 ug/L (520 pmol/L), within range. For someone with a PCOS diagnosis, where insulin resistance is a common driver, this is a genuinely reassuring set of results. The Mounjaro and the dietary discipline have clearly made a difference here.\n\nHer kidney function is excellent. Cystatin C, a more reliable measure of kidney filtration than creatinine in women at a healthy weight, is 0.85, giving a Cystatin C eGFR of 105, well above the 90 threshold for ideal function. The combined eGFR using both creatinine and cystatin C confirms this at 105. Urea, creatinine, and the urea-to-creatinine ratio are all within their ideal ranges. Her cardiovascular markers are in good shape. Total cholesterol is 5.0, HDL is 1.6 which is at the threshold for ideal in women, triglycerides are 1.37, ApoB is 0.78 which is below both the laboratory threshold of 0.9 and the optimal target of 0.8, and the ApoB to ApoA1 ratio is 0.44, well within the lower-risk zone below 0.6. Lp(a), lipoprotein(a), an inherited marker of cardiovascular risk that cannot be changed by diet or exercise, is below 25, which is ideal and means that any future lipid management is entirely within her control through modifiable factors. The cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 10 out of 100, which is ideal. Her Lp(a)-corrected LDL, which removes the cholesterol carried by Lp(a) to show what is truly modifiable, is 2.77, within range. The atherogenic index of plasma is negative at minus 0.067, which is favourable.\n\nHer liver is healthy. ALT is 27, GGT is 16, AST is 23, bilirubin is 6, and albumin is 35. The FIB-4 score, which estimates liver scarring using age, platelets, AST and ALT, is 0.82, well below the 1.45 threshold. The APRI score is 0.231 and the NAFLD fibrosis score is minus 2.478, both confirming no evidence of liver fibrosis. The De Ritis ratio of AST to ALT is 0.85, within the ideal range. Her inflammation markers are reassuring. hs-CRP, high-sensitivity C-reactive protein, which measures low-grade systemic inflammation, is 0.6, within the ideal range below 1.0. The systemic immune-inflammation index is 223, within the ideal range, and the platelet-to-lymphocyte ratio is 109, also ideal. Creatine kinase, a marker of muscle damage, is 62, within range and showing no excessive strain from training. Her immune system looks balanced: IgA, IgM and IgE are all within range, and IgE at 5.49 is very low, which is reassuring for someone reporting no allergic symptoms. Rheumatoid factor is below 4, negative, which is useful given her joint pain and stiffness, as it makes rheumatoid arthritis unlikely. Coeliac screening with tissue transglutaminase IgA is negative, which helps narrow the causes of her bloating, though it does not exclude non-coeliac gluten sensitivity. Her tumour markers are all within range: CA125 at 17.9, CA15-3 at 14.7, CA19-9 at 11.04, and CEA at 0.56. Urinalysis is clean with no protein, glucose, blood, white cells, nitrites or bacterial growth.\n\nHer PhenoAge, an estimate of biological age derived from blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 39.8 against her calendar age of 46, meaning her blood markers suggest a body that is biologically six years younger than her chronological age. This is a strong result and reflects the quality of her diet and training.\n\nTurning to the findings that need attention. Her vitamin D is 42 nmol/L, which sits in the insufficient zone of 30 to 50 and is well below the optimal range of 75 to 120. She is supplementing vitamin D, but either the dose is too low or absorption is not optimal. At her weight and with an intermittent fasting pattern that may limit fat-containing meals (vitamin D is fat-soluble and needs dietary fat for absorption), she likely needs a higher dose, ideally 3,000 to 4,000 IU daily taken with her largest meal. Vitamin D is relevant to several of her symptoms: it plays a role in joint health, immune regulation, mood, and hormonal balance, and low vitamin D is associated with worsened PCOS outcomes.\n\nHer vitamin B12 is 425 pg/mL. This is within the laboratory range of 193 to 982 but below the optimal zone of 500 to 900. She is supplementing B12, so the form and dose should be reviewed. Sublingual methylcobalamin at 1,000 mcg daily is better absorbed than standard oral tablets and should bring this into the optimal range.\n\nHer ferritin, the body's iron storage protein, is 25 ng/mL. This is within the laboratory range of 10 to 291 but below the optimal range of 40 to 150 for women. Her transferrin saturation, which measures how much of the iron transport protein is loaded with iron, is 18.91%, barely inside the lower boundary of 18% and below the optimal range of 25 to 40%. Serum iron is 12.3, within range but in the lower third. This pattern suggests that iron stores are low, not depleted enough to cause overt anaemia (her haemoglobin is 134, within range), but low enough to contribute to fatigue, hair thinning, and the feeling of being tired on waking. In a woman with irregular periods who may occasionally have heavy bleeds, this is a common finding. The low ferritin also connects to her reticulocyte count: the absolute reticulocyte count is 31.4, below the reference range of 50 to 100. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count suggests the marrow is not producing red cells as quickly as it should, which can happen when iron stores are not sufficient to fuel robust red cell production. This is not alarming but it reinforces the case for building iron stores.\n\nHer RDW, red cell distribution width, which measures how much variation there is in the size of her red blood cells, is 14.8%, above the upper limit of 14%. A raised RDW often accompanies early iron deficiency, even before haemoglobin drops, because the marrow starts producing slightly smaller cells as iron runs low while the older, normally-sized cells are still circulating. This fits neatly with the low ferritin and low transferrin saturation.\n\nHer ESR, erythrocyte sedimentation rate, which measures how quickly red blood cells settle in a tube and acts as a general marker of inflammation, is 18, above the upper limit of 12. In a 46-year-old woman, the ESR can be mildly elevated for many reasons: hormonal fluctuations, the perimenopausal state, slightly raised globulin (hers is 36, at the upper limit of range), or low-grade inflammation that hs-CRP is too insensitive to detect at this level. Her hs-CRP is 0.6, which argues against significant systemic inflammation. Her IgG is 15.4, within range but near the upper boundary of 16, and her globulin at 36 sits at the top of its range. These two findings together could reflect mild chronic immune activation, which in a woman with autoimmune thyroid disease (even with currently negative antibodies) and PCOS would not be unusual. This is not a concern requiring investigation on its own but it is worth the GP noting alongside the ESR.\n\nHer alkaline phosphatase (ALP), an enzyme found in the liver and bones, is 44, marginally below the laboratory range of 46 to 116. Mildly low ALP is common in women around perimenopause, and at this margin it is not clinically significant. It can be associated with low zinc or magnesium, but her magnesium is 0.88, within the optimal range of 0.85 to 1.05, and she supplements zinc. It is also seen in hypothyroidism, though her thyroid function is currently well controlled. No action is needed.\n\nHer amylase is 137, above the upper limit of 118. Amylase is an enzyme produced mainly by the pancreas and the salivary glands that breaks down starch. A mildly raised amylase in the absence of abdominal pain, nausea, or clinical pancreatitis is usually a normal variant, sometimes called macroamylasaemia, where amylase binds to a protein in the blood and is cleared more slowly. Her lipase, the more specific pancreatic enzyme, is 37, comfortably within range at 13 to 60, which makes pancreatic inflammation very unlikely. She does report bloating and digestive discomfort, but these are far more likely to be related to the intermittent fasting pattern, gut motility, or food intolerances than to pancreatic pathology. If the bloating worsens or she develops upper abdominal pain radiating to the back, the amylase and lipase should be repeated, but at this level with a normal lipase, no urgent action is needed.\n\nHer cortisol is 199 nmol/L. Assuming a morning sample, the reference range is 145 to 619, placing her in the lower quarter of the range. A lower-morning cortisol fits with her symptom of feeling tired on waking and slow to get going: cortisol should peak in the first 30 to 60 minutes after waking, the cortisol awakening response, and if that peak is blunted, the result is exactly what she describes. This is not adrenal insufficiency, which would produce a cortisol well below 145, but it suggests that her circadian rhythm may be shifted, with cortisol rising later in the day rather than peaking sharply in the morning. The sleep quiz answers support this: she sleeps 7 to 8 hours but wakes tired, and her energy pattern is tired on waking. Bright light exposure within the first 30 minutes of waking, a consistent wake time, and managing the stress that is hard to handle some weeks are the most effective ways to sharpen the cortisol awakening response.\n\nHer albumin at 35 is within the laboratory range of 34 to 50 but sits at the lower end. Albumin is made by the liver and is the most abundant protein in the blood. A slightly low albumin can reflect dilution, lower protein intake, or chronic low-grade inflammation. At a diet volume of 5 out of 10 with intermittent fasting, it is possible that total protein intake is below what her body needs, particularly as she trains four times a week. This connects to the general theme of needing to optimise nutrition within her eating window.\n\nHer MCHC at 344 is one point below the upper limit of 345. This is laboratory variation and not a concern.\n\nPulling this together, the report paints a picture of a woman whose metabolic health is excellent, whose cardiovascular markers are strong, and whose biological age is six years younger than her calendar age. The two themes that need attention are the perimenopausal hormonal shift, which is driving many of her symptoms and should be discussed with a specialist, and the low iron stores and suboptimal vitamin D and B12, which are quietly contributing to fatigue, hair thinning, and the feeling of being tired on waking. Her bloating and digestive symptoms are not explained by the coeliac screen (negative), the pancreatic markers (lipase normal), or the inflammation markers (CRP ideal), which points towards functional causes: the timing and composition of meals within her eating window, possible food intolerances, and gut motility.","links":"The central thread running through this report is the perimenopausal transition. The elevated FSH at 25.4, the low-end oestradiol at 111, the flat progesterone, the below-range testosterone at 0.4 and free testosterone at 0.007 all point in the same direction: the ovaries are producing less hormone, the pituitary is sending louder signals (FSH) to compensate, and the body is feeling the effects. Hot flushes, joint stiffness, hair thinning, fatigue on waking, and difficulty losing weight despite good metabolic markers are all recognised consequences of this shift. The PCOS diagnosis adds a layer because PCOS itself causes irregular cycles, but the FSH level distinguishes the two: in PCOS alone, FSH is usually normal or low, not elevated into the postmenopausal range. The combination of PCOS and perimenopause in a 46-year-old is not unusual, and it means that hormonal management needs to address both the declining oestrogen and the androgen balance.\n\nThe second thread is iron and red cell production. Ferritin at 25, transferrin saturation at 18.91%, a low absolute reticulocyte count at 31.4, and a raised RDW at 14.8% form a consistent picture of early iron depletion. The body has enough iron to maintain haemoglobin at 134, so she is not anaemic, but the stores are thin enough to slow red cell production and widen the size distribution of red cells. In a woman with irregular periods who may occasionally bleed heavily, this is the most common cause. The fatigue and hair thinning she reports are both associated with ferritin below 50, even when haemoglobin is normal, and building iron stores is one of the most straightforward interventions in this report.\n\nThe third thread is the functional digestive symptoms. Coeliac disease has been excluded with a negative tTG-IgA. Pancreatic disease is effectively excluded by a normal lipase alongside only mildly raised amylase. Inflammatory bowel disease is unlikely given a CRP of 0.6 and an ESR only mildly raised. This leaves functional causes as the most probable explanation for the bloating: the intermittent fasting pattern may mean she eats larger volumes in a shorter window, which can distend the stomach and slow gastric emptying; certain fermentable carbohydrates (FODMAPs) may not be well tolerated; and stress, which she reports as hard to manage some weeks, directly slows gut motility through the gut-brain axis. A structured elimination approach and attention to meal spacing within the eating window are the practical next steps.\n\nThe thyroid antibody results are a positive loose end worth noting. She carries a Hashimoto's diagnosis, yet both TPO and thyroglobulin antibodies are negative, and her TSH is ideal at 1.4. This does not mean the diagnosis was wrong, as antibody levels can fluctuate and sometimes fall below detection over time, but it does mean that at this point the thyroid is not under active autoimmune attack and is functioning well. If she is on levothyroxine, the dose appears appropriate. If she is not on medication, her thyroid is managing on its own.\n\nFinally, the mildly raised ESR at 18 with a normal hs-CRP and near-upper-limit globulin and IgG is a minor finding without a single clear explanation. It could reflect the hormonal fluctuations of perimenopause, a very mild immune activation consistent with her autoimmune history, or simply normal variation. It does not warrant investigation in isolation but should be noted by the GP as part of the overall picture.","lifestyle":"Add a palm-sized portion of protein to every meal within your eating window, starting with the first meal of the day. Eggs, Greek yoghurt, chicken, fish or tofu. Anchor: prepare protein the night before so it is ready when the eating window opens. Why: your albumin is at the lower end at 35, your ferritin is low at 25, and your training needs at least 91 to 112 grams of protein a day to support muscle, hair growth and iron-carrying proteins.\nInclude an iron-rich food with each meal: red meat twice a week, lentils, spinach, or fortified cereals, paired with something containing vitamin C (peppers, tomatoes, citrus, berries) to boost absorption. Anchor: add the iron source and the vitamin C source when plating the meal. Why: your ferritin is 25 and transferrin saturation is barely inside range at 18.9%, and food-based iron alongside a supplement will rebuild stores faster.\nTake your vitamin D supplement with your largest meal, the one with the most fat, not on an empty stomach. Anchor: keep the bottle next to your plate or lunchbox. Why: vitamin D is fat-soluble and your level of 42 suggests the current dose or timing is not working; absorption improves dramatically when taken with dietary fat.\nGet outside within 30 minutes of waking, even for five minutes, without sunglasses. Anchor: tie it to the kettle boiling or the first cup of tea. Why: bright morning light sharpens the cortisol awakening response, and your cortisol of 199 sits in the lower quarter of the morning range, which fits with your pattern of waking tired and being slow to get going.\nKeep a consistent wake time seven days a week, within 30 minutes. Anchor: set the alarm for the same time on weekends. Why: your sleep quantity is adequate at 7 to 8 hours but the quality is poor, and a fixed wake time is the single most effective way to regulate circadian rhythm and deepen sleep.\nFor the bloating, try eating your first meal slowly and at a moderate portion size rather than a large meal to break the fast. Anchor: set a 20-minute timer for the meal and put cutlery down between bites. Why: intermittent fasting can lead to eating large volumes quickly, which distends the stomach and slows digestion. If this does not help within two weeks, consider a four-week low-FODMAP trial under guidance to identify specific triggers.\nContinue your four training sessions a week but prioritise the two resistance sessions with progressive overload, gradually increasing weight or reps over time. Anchor: log sets and weights in a simple note on your phone. Why: resistance training preserves bone density and muscle mass through perimenopause, both of which decline with falling oestrogen, and supports the body-fat loss goal more effectively than cardio alone.\nCalorie and protein targets: your estimated maintenance is approximately 1,850 to 1,950 kcal per day. For gradual fat loss of 0.25 to 0.5 kg per week, aim for 1,550 to 1,700 kcal per day. Protein target: 91 to 112 grams per day (1.3 to 1.6 g per kg). A reasonable weight target is 64 to 67 kg, which would bring your BMI into the 21 to 22 range. These targets should be achievable within your eating window provided meals are planned around protein first.","flags":"Testosterone 0.4 nmol/L (below range 0.5 to 2.6) and free testosterone 0.007 nmol/L (below range 0.01 to 0.25): below-range androgens in a 46-year-old woman with hair thinning, joint stiffness and fatigue, consistent with declining ovarian and adrenal production during perimenopause. Discuss testosterone replacement alongside any HRT.\nFSH 25.4 mIU/mL (above follicular range 2.5 to 10.2, within postmenopausal range 23 to 116) with oestradiol 111 pmol/L (low follicular, near postmenopausal ceiling of 118) and progesterone below 0.21 nmol/L: hormonal pattern strongly suggestive of perimenopause. Hot flushes, irregular periods, and joint pain are consistent symptoms. Recommend referral to menopause or reproductive endocrinology specialist.\nFerritin 25 ng/mL (within lab range 10 to 291 but below optimal 40 to 150), transferrin saturation 18.91% (borderline at lower limit of 18%, below optimal 25 to 40%): low iron stores contributing to fatigue and hair thinning. Not yet anaemic (Hb 134) but stores need rebuilding.\nAbsolute reticulocyte count 31.4 x10^9/L (below range 50 to 100): low young red cell production consistent with the low iron stores limiting bone marrow output.\nRDW 14.8% (above range 11.6 to 14%): raised red cell size variation, consistent with early iron depletion where newer smaller cells mix with older normal-sized cells.\nESR 18 mm/hour (above range of 12): mildly raised non-specific inflammatory marker. hs-CRP is 0.6 (ideal), making significant systemic inflammation unlikely. May reflect hormonal fluctuations of perimenopause, mildly elevated globulin (36, upper limit), or normal variation.\nVitamin D 42 nmol/L (insufficient, below optimal 75 to 120): suboptimal despite supplementation. Increase dose to 3,000 to 4,000 IU daily with a fat-containing meal, and add vitamin K2.\nVitamin B12 425 pg/mL (within lab range 193 to 982, below optimal 500 to 900): suboptimal despite supplementation. Switch to sublingual methylcobalamin 1,000 mcg daily.\nAmylase 137 IU/L (above range 30 to 118) with lipase 37 U/L (within range 13 to 60): mildly raised amylase with a normal lipase makes pancreatic pathology very unlikely. Most commonly a benign variant (macroamylasaemia). Repeat only if upper abdominal pain develops.\nALP 44 IU/L (marginally below range 46 to 116): not clinically significant at this margin; common in perimenopausal women.\nReassuring negatives: thyroid function well controlled with negative antibodies (TSH 1.4, FT4 14.6, FT3 5.1, TPO and TgAb negative); excellent insulin sensitivity (HOMA-IR 1.24, glucose 4.2, HbA1c 39, insulin 6.62); cardiovascular risk score 10 out of 100 with ApoB 0.78 below target; kidney function excellent (Cystatin C eGFR 105); liver function clean with FIB-4 0.82; coeliac screen negative; rheumatoid factor negative; CRP 0.6; tumour markers CA125, CA15-3, CA19-9 and CEA all within range; urinalysis clear; PhenoAge 39.8, biologically six years younger than calendar age.","recommendations":"Discuss the perimenopausal hormonal pattern with your GP or a menopause specialist: FSH 25.4 (postmenopausal range), oestradiol 111 (low), testosterone 0.4 and free testosterone 0.007 (both below range), hot flushes since 2024, irregular periods. HRT with oestrogen, progesterone and possibly testosterone replacement should be considered.\nAsk the GP to check your current levothyroxine dose and whether any adjustment is needed: your TSH at 1.4 and FT3 at 5.1 are ideal, but your FT4 at 14.6 sits in the lower quarter of range. If you are not on thyroid medication, this confirms the thyroid is managing well on its own and no treatment is needed at present.\nRequest a full iron panel repeat in three months after supplementation to confirm ferritin is rising above 50 and transferrin saturation is moving towards 25 to 40%.\nMention the raised ESR of 18 alongside the globulin of 36 and IgG of 15.4 to the GP for documentation. No urgent action needed but worth recording.\nMention the raised amylase of 137 with normal lipase of 37 to the GP. No investigation needed unless abdominal pain develops, but it should be on file.\nIncrease vitamin D to 3,000 to 4,000 IU cholecalciferol daily with a fat-containing meal, add vitamin K2 at 100 to 200 mcg (MK-7 form), and retest in three months aiming for 75 to 100 nmol/L.\nRetest in four to six months with the following markers to track progress: ferritin, transferrin saturation, full blood count (to confirm reticulocyte recovery and RDW normalisation), vitamin D, vitamin B12, FSH, oestradiol, testosterone, and free testosterone. Target calorie intake 1,550 to 1,700 kcal per day, protein 91 to 112 g per day, weight target 64 to 67 kg.","supplementation":"Iron: ferrous bisglycinate 25 mg daily, taken with vitamin C (a glass of orange juice or a vitamin C tablet) on an empty stomach or with a light meal, at least two hours away from thyroid medication if applicable, and away from tea, coffee or calcium supplements which block absorption. Why: ferritin is 25 and transferrin saturation is 18.9%, both below optimal, and stores need rebuilding to reduce fatigue and hair thinning.\nVitamin D3: cholecalciferol 3,000 to 4,000 IU daily, taken with your largest meal containing fat. Why: your level is 42 nmol/L, insufficient, and the current supplement is not bringing it to the optimal range of 75 to 120.\nVitamin K2: MK-7 form, 100 to 200 mcg daily, taken alongside vitamin D. Why: K2 directs the calcium mobilised by vitamin D into bones rather than arteries, and supports bone density during perimenopause when oestrogen-driven bone protection declines.\nVitamin B12: sublingual methylcobalamin 1,000 mcg daily, dissolved under the tongue. Why: your level is 425, below the optimal range of 500 to 900, despite current supplementation, suggesting the form or dose needs upgrading. Sublingual delivery bypasses gut absorption issues.\nMagnesium: magnesium glycinate 300 to 400 mg in the evening, 30 to 60 minutes before bed. Why: supports sleep quality (you wake tired despite adequate hours), muscle recovery from training, and may help with joint stiffness. Your serum level is 0.88, within optimal, but serum magnesium only reflects 1% of body stores and ongoing supplementation at this dose is appropriate.\nOmega-3: continue current fish oil at 2 to 3 g total EPA plus DHA daily, taken with food. Why: supports joint comfort (she reports joint stiffness), cardiovascular health, and may help with the inflammatory component behind the ESR of 18.\nDo not take calcium supplements without discussing with your GP. Your corrected calcium is 2.44 (within range) and PTH is 3.4 (within range). Calcium needs are better met through diet, and supplementation alongside vitamin D and K2 should only be considered if dietary intake is clearly insufficient.\nThe most important changes from this report are not supplements. They are the conversation with a menopause specialist about HRT to address the hormonal decline driving the hot flushes, joint pain, hair thinning and fatigue, and the dietary focus on protein and iron-rich foods within the eating window to rebuild iron stores and support muscle and hair.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 72.1; held to 59 by a system rated \"See your GP\". Weakest systems: digestive 28%, inflammation 32%, hematology 52%. Biggest drags: Testosterone, Red Cell Distribution Width, Reticulocytes (Absolute), Erythrocyte Sedimentation Rate.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"39.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3902","lower_normal":"","upper_normal":"51","lower_optimal":"","upper_optimal":"46","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4510","units":"years","description":"PhenoAge is an estimate of biological age based on blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 39.8 against a calendar age of 46, her blood markers suggest a body that is biologically just over six years younger than her chronological age. This is a strong result. The slightly low albumin and the raised RDW are the two markers nudging PhenoAge up from what could be an even lower figure; addressing both through increased protein intake and iron supplementation should improve this further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Car ells. At 0.39, this is within the ideal range, consistent with the healthy haemoglobin and red cell count.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"14.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7111","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.8","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"%","description":"Red cell distribution width measures how much variation there is in the size of red blood cells. A higher number means more variation. At 14.8%, this is above the upper limit of 14% and is the earliest sign of iron depletion in the blood count. What happens is that as iron stores run low, the bone marrow starts producing slightly smaller red cells while the older, normally-sized cells are still in circulation. This mix of sizes pushes the RDW up. It fits precisely with the low ferritin of 25 and the borderline transferrin saturation. As iron stores are rebuilt, this should normalise.","low_causes":"Normal red cell production","high_causes":"Iron deficiency, B12 or folate deficiency, mixed nutritional deficiency, thalassaemia trait, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"89.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5222","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"fL","description":"Mean cell volume measures the average size of red blood cells. At 89.4, this is with
