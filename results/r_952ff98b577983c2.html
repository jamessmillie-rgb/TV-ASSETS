 for total red cells) is low, indicating that while the percentage looks adequate, the actual number of new red cells being released is reduced.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow disorders, chronic kidney disease","high_causes":"Blood loss recovery, haemolytic anaemia, treatment response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"31.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2093","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of young red blood cells released from the bone marrow into the bloodstream. At 31.4, this is below the reference range of 50 to 100. This tells us the bone marrow is not producing red cells as briskly as it should. The most likely explanation is the low iron stores: ferritin at 25 and transferrin saturation at 18.9% mean the marrow does not have quite enough iron to fuel red cell production at full capacity. As iron stores are rebuilt with supplementation and dietary changes, this count should rise.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic kidney disease, aplastic anaemia","high_causes":"Blood loss recovery, haemolytic anaemia, treatment of nutritional deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"20.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index divides MCV by RBC count and helps distinguish iron deficiency anaemia from thalassaemia trait when MCV is low. At 20.5, a value above 13 favours iron deficiency over thalassaemia. Since her MCV is currently normal, this index is reported for context and is not applicable at present.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.75","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR measures how quickly red blood cells settle to the bottom of a test tube over one hour. A faster settling rate suggests more inflammation. At 18, this is above the upper limit of 12 for women. However, ESR is a non-specific marker that can be raised by many things: hormonal fluctuations, elevated globulin (hers is 36, at the upper limit), perimenopause, mild infection recovery, or autoimmune activity. Her hs-CRP, a more specific inflammation marker, is 0.6, well within the ideal range below 1.0, which argues against significant systemic inflammation. The most likely explanation is the combination of the perimenopausal hormonal state and the mildly raised globulin. Worth noting to the GP but not a concern requiring investigation on its own.","low_causes":"Normal health, polycythaemia, sickle cell disease","high_causes":"Infection, inflammation, autoimmune disease, anaemia, pregnancy, malignancy, elevated globulin","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"18.91","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3382","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3956","upper_optimal_position":"0.5289","units":"%","description":"Transferrin saturation measures what percentage of the body's iron transport protein (transferrin) is loaded with iron. At 18.91%, this barely sits inside the lower reference limit of 18% and is well below the optimal range of 25 to 40%. This confirms that the iron transport system is running with very little cargo. Combined with the low ferritin, it paints a clear picture of depleted iron stores that need rebuilding.","low_causes":"Iron deficiency, chronic disease, poor dietary iron intake, heavy menstrual bleeding","high_causes":"Iron overload, haemochromatosis, excessive supplementation, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"12.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4874","lower_normal":"9","upper_normal":"30.4","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4104","upper_optimal_position":"0.5817","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. At 12.3, this is within the laboratory range of 9 to 30.4 but below the ideal band of 14 to 25. Serum iron fluctuates during the day and with meals, so a single reading is less reliable than ferritin and transferrin saturation. Nevertheless, it adds to the pattern of low iron availability.","low_causes":"Iron deficiency, chronic disease, poor dietary intake, heavy menstrual bleeding, malabsorption","high_causes":"Iron overload, haemochromatosis, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3436","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream. At 2.59, this is within the laboratory range of 2.5 to 3.8 but in the lower portion. In iron deficiency, transferrin typically rises as the body tries to capture more iron; a normal-to-low transferrin alongside low ferritin may suggest that the iron depletion is not yet severe enough to trigger that compensatory rise, or that the protein is being held down by other factors such as mild inflammation.","low_causes":"Chronic inflammation, liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"58.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4874","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3952","upper_optimal_position":"0.6038","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind and transport iron. At 58.8, this is within the ideal range, confirming adequate transport capacity. In advanced iron deficiency, TIBC typically rises as the body tries to capture more iron; the normal value here is consistent with early depletion rather than severe deficiency.","low_causes":"Chronic disease, liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3869","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4401","upper_optimal_position":"0.5964","units":"ng/mL","description":"Ferritin is the body's iron storage protein. Each molecule of ferritin holds thousands of iron atoms, so it is the best single measure of how much iron the body has in reserve. At 25, this is within the laboratory range of 10 to 291 but well below the optimal range of 40 to 150 for women. Research consistently shows that symptoms of fatigue and hair thinning can occur at ferritin levels below 50, even when haemoglobin is normal and there is no formal anaemia. For a woman with irregular periods who may occasionally have heavier bleeds, and who is training four times a week (which increases iron turnover), a ferritin of 25 needs to be actively built up with both supplementation and dietary iron.","low_causes":"Iron deficiency, heavy menstrual bleeding, poor dietary intake, malabsorption, chronic blood loss, intensive exercise","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6103","units":"mmol/L","description":"Sodium is an essential electrolyte that regulates fluid balance, blood pressure, and nerve function. At 140, this is within the ideal range and reflects well-regulated fluid and electrolyte balance.","low_causes":"Overhydration, diuretics, kidney disease, adrenal insufficiency, heart failure","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. At 101, this is within the ideal range.","low_causes":"Vomiting, diuretics, metabolic alkalosis, Addison's disease","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"28.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5848","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.6152","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, keeping blood pH within a narrow range. At 28.3, this is within the ideal range and indicates well-balanced acid-base status.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4267","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3400","upper_optimal_position":"0.6093","units":"mmol/L","description":"Urea is a waste product of protein metabolism filtered by the kidneys. At 4.6, this is within the ideal range and reflects healthy kidney filtration and adequate hydration.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, kidney disease, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3862","lower_normal":"49","upper_normal":"90","lower_optimal":"52","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3561","upper_optimal_position":"0.5886","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism filtered by the kidneys. At 57, this is within the ideal range. In combination with the cystatin C eGFR of 105, it confirms excellent kidney function.","low_causes":"Low muscle mass, pregnancy, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood. A value above 90 indicates normal kidney function. This creatinine-based estimate confirms healthy kidneys, consistent with the cystatin C-based eGFR of 105.","low_causes":"Kidney disease, dehydration, medications, aging","high_causes":"Pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.875","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"Cystatin C is a protein produced at a constant rate by all cells and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable measure of kidney function in women. At 105, this gives an excellent eGFR well above the ideal threshold of 90.","low_causes":"Kidney disease, aging, medications","high_causes":"Thyroid disease, steroid use","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"200","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3524","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2476","upper_optimal_position":"0.5619","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines found in food and body tissues. At 200, this is within the ideal range for women. Well-controlled uric acid reduces the risk of gout and is associated with healthy kidney function and low insulin resistance.","low_causes":"Low purine diet, medications, Fanconi syndrome","high_causes":"Gout, kidney disease, high purine diet, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3864","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is the raw protein level used to calculate the cystatin C eGFR. At 0.85, this is well within the ideal range and confirms the kidneys are filtering efficiently.","low_causes":"Thyroid disease, steroid use","high_causes":"Kidney disease, inflammation, thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8750","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and cystatin C to give the most accurate estimate of kidney filtration. At 105, this confirms excellent kidney function, consistent with both individual eGFR calculations.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"80.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5594","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between pre-renal (dehydration) and intrinsic kidney causes of abnormal kidney function. At 80.7, this is within the ideal range, confirming adequate hydration and normal kidney function.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 71, this is within the ideal range and reflects adequate protein production and immune function.","low_causes":"Liver disease, malnutrition, kidney disease, malabsorption","high_causes":"Dehydration, chronic inflammation, chronic infection, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3542","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3708","upper_optimal_position":"0.6208","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It transports hormones, vitamins and minerals and helps maintain fluid balance. At 35, this is within the laboratory range of 34 to 50 but below the ideal range of 40 to 48, sitting just one point above the lower limit. A slightly low albumin can reflect modest protein intake, which may be a factor with intermittent fasting if the eating window does not include enough protein-rich meals. It can also be lowered by inflammation, though her CRP is ideal. Increasing protein intake to at least 91 grams per day should help move this towards the optimal zone.","low_causes":"Low protein intake, liver disease, inflammation, kidney disease, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/L","description":"Globulin includes all blood proteins other than albumin, primarily immunoglobulins (antibodies) and acute phase proteins. At 36, this sits at the upper limit of the laboratory range and above the optimal ceiling of 32. A higher globulin often reflects immune system activity, and her IgG is also near the top of its range at 15.4. In a woman with a history of autoimmune thyroid disease, this likely reflects mild chronic immune activation rather than anything new. It may also contribute to the raised ESR.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3048","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3905","upper_optimal_position":"0.6048","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys and gut. At 44, this is marginally below the laboratory range of 46 to 116. A mildly low ALP is common in perimenopausal women, and at just two points below the lower limit, this is not clinically significant. It can occasionally be associated with low zinc or magnesium, but her magnesium is within the optimal range at 0.88 and she supplements zinc. It can also be seen in well-controlled hypothyroidism. No action is needed.","low_causes":"Zinc deficiency, magnesium deficiency, hypothyroidism, anaemia, menopause, malnutrition","high_causes":"Liver disease, bone disease, bile duct obstruction, Paget's disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. At 6, this is within the ideal range and reflects normal red cell turnover and healthy liver clearance.","low_causes":"Normal variation","high_causes":"Gilbert's syndrome, liver disease, haemolytic anaemia, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT, alanine aminotransferase, is a liver enzyme that leaks into the blood when liver cells are damaged. The lab range runs to 56, but the optimal range for women is below 25. At 27, this is within the laboratory range but marginally above the ideal threshold. At this level it is not a concern, and with GGT at 16, bilirubin at 6, and all fibrosis scores clean, the liver is healthy.","low_causes":"Normal liver function","high_causes":"Liver disease, fatty liver, medications, alcohol, intense exercise, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5625","units":"IU/L","description":"AST, aspartate aminotransferase, is an enzyme found in the liver, heart and muscles. At 23, this is within the ideal range, confirming no significant liver or muscle cell damage.","low_causes":"Normal variation, vitamin B6 deficiency","high_causes":"Liver disease, heart attack, muscle damage, medications, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2105","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/L","description":"GGT, gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol, medications and metabolic strain. At 16, this is well within the ideal range below 25 for women, and in the context of zero alcohol intake, this is exactly where it should be. An excellent result showing the liver is under no metabolic pressure.","low_causes":"Normal variation","high_causes":"Alcohol, medications, fatty liver, bile duct disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"137","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7216","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3714","upper_optimal_position":"0.6029","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands that breaks down starch into sugars. At 137, this is above the upper limit of 118. However, a mildly raised amylase in the absence of abdominal pain, nausea or other signs of pancreatitis is usually a benign variant, often called macroamylasaemia, where amylase binds to a protein in the blood and is cleared more slowly by the kidneys. Crucially, lipase, the more specific pancreatic enzyme, is 37, well within range, which makes pancreatic inflammation very unlikely. No urgent action is needed unless symptoms of upper abdominal pain develop.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, macroamylasaemia, salivary gland disease, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4255","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3759","upper_optimal_position":"0.5816","units":"U/L","description":"Lipase is an enzyme produced by the pancreas that breaks down fats. It is the most specific marker for pancreatic inflammation. At 37, this is well within the ideal range, confirming healthy pancreatic function and effectively ruling out pancreatitis as a cause of the raised amylase.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4386","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.15","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3743","upper_optimal_position":"0.6152","units":"mmol/L","description":"Calcium is essential for bones, muscle contraction, nerve signalling and blood clotting. At 2.26, this is within the ideal range. The corrected calcium, which adjusts for the slightly low albumin, is 2.44, also within range. Combined with a normal PTH of 3.4, calcium metabolism is well regulated.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, low albumin","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, because calcium travels bound to albumin. With an albumin of 35, some of the measured calcium is lower simply because there is less albumin to carry it. The corrected value of 2.44 gives a truer picture of active calcium and is within the ideal range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4176","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.85","upper_optimal":"1.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3614","upper_optimal_position":"0.6098","units":"mmol/L","description":"Phosphate works alongside calcium for bone health and energy production. At 1.0, this is within the ideal range and reflects balanced mineral metabolism.","low_causes":"Hyperparathyroidism, vitamin D deficiency, malabsorption, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5345","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4885","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is essential for over 300 enzyme reactions, including muscle relaxation, nerve function, sleep and energy production. At 0.88, this is within the optimal range of 0.85 to 1.05, reflecting effective supplementation. Serum magnesium only represents about 1% of total body stores, so continuing supplementation at the current dose is appropriate.","low_causes":"Poor dietary intake, alcohol, diuretics, diarrhoea, diabetes, medications","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the sodium level for elevated blood glucose, which can dilute sodium. With a normal glucose of 4.2, the correction makes no change, and the sodium remains at 140. Reported for context and not applicable at present.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"288.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5633","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Calculated serum osmolality estimates the concentration of dissolved particles in the blood, reflecting fluid balance. At 288.8, this is within the ideal range of 280 to 292, confirming well-regulated fluid and electrolyte balance.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"42","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.35","lower_normal":"30","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5000","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone essential for calcium absorption, bone health, immune function, and mood regulation. At 42, this sits in the insufficient zone of 30 to 50 and is well below the optimal range of 75 to 120. Despite supplementation, the level has not reached sufficiency. This may be because the dose is too low, or because vitamin D is taken on an empty stomach or without fat, which dramatically reduces absorption. Vitamin D insufficiency is associated with joint stiffness, fatigue, low mood, and impaired immune regulation, all of which she reports. In a woman entering perimenopause, adequate vitamin D is particularly important for bone density as oestrogen-driven bone protection declines. Increasing the dose to 3,000 to 4,000 IU daily, always with a fat-containing meal, should move this into the optimal range within three months.","low_causes":"Low sun exposure, dark skin, obesity, malabsorption, insufficient supplementation, winter months","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5440","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.6044","units":"pmol/L","description":"Parathyroid hormone (PTH) regulates calcium and phosphate levels by acting on bones, kidneys and the gut. At 3.4, this is within the laboratory range of 0.98 to 4.73 and just inside the upper boundary of the ideal range. PTH tends to rise when vitamin D is low because the body needs to work harder to maintain calcium levels. Her PTH being at the upper end of ideal is consistent with the insufficient vitamin D of 42: as vitamin D rises with supplementation, PTH should drift down slightly.","low_causes":"Hypoparathyroidism, high calcium, high vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"425","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4282","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5561","upper_optimal_position":"0.6229","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. At 425, this is within the laboratory range of 193 to 982 but below the optimal range of 500 to 900. She is supplementing B12, so the form or dose needs reviewing. Sublingual methylcobalamin at 1,000 mcg daily, dissolved under the tongue for direct absorption into the bloodstream, is more effective than standard oral tablets, which rely on stomach acid and intrinsic factor for absorption. Adequate B12 supports energy, cognition, and the nerve health that underpins joint proprioception.","low_causes":"Pernicious anaemia, vegan or vegetarian diet, malabsorption, medications (metformin, PPIs), aging","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for cell division, DNA repair, and red blood cell production. At 13, this is within the ideal range, reflecting good dietary intake from the 4 to 5 portions of vegetables and fruit per day. An excellent result.","low_causes":"Poor dietary intake, malabsorption, pregnancy, medications (methotrexate, anticonvulsants), alcohol","high_causes":"Supplementation, rarely B12 deficiency masking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.06","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity CRP measures low-grade systemic inflammation. Unlike standard CRP, which detects infection and acute illness, hs-CRP picks up the subtle chronic inflammation that drives cardiovascular disease, insulin resistance and metabolic dysfunction. At 0.6, this is within the ideal range below 1.0, showing very low levels of systemic inflammation. This is a strong positive, particularly for someone with autoimmune history and PCOS.","low_causes":"Low inflammation, healthy lifestyle","high_causes":"Chronic inflammation, infection, obesity, smoking, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"17.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2557","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA-125 is a protein that can be elevated in ovarian cancer, endometriosis, ovarian cysts, and pelvic inflammatory disease. At 17.9, this is within the normal range below 35. Given her history of ovarian cysts and two surgeries, a normal CA-125 is reassuring, though it is important to note that CA-125 is a screening tool and not a definitive diagnostic test.","low_causes":"Normal health","high_causes":"Ovarian cancer, endometriosis, ovarian cysts, pelvic inflammatory disease, menstruation, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA 15-3","group":"TUMOR MARKERS","result":"14.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.245","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 15-3 is a tumour marker associated with breast cancer monitoring. At 14.7, this is within the normal range below 30. A reassuring result.","low_causes":"Normal health","high_causes":"Breast cancer, ovarian cancer, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4826","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including HDL, LDL and VLDL. At 5.0, this is within the desirable range below 5.18 and at the optimal ceiling of 5.0. On its own, total cholesterol is a blunt tool; what matters more is the breakdown between HDL (protective) and LDL (atherogenic), which in her case is favourable.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, genetics, hypothyroidism, kidney disease, obesity, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4029","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, largely driven by carbohydrate intake, alcohol, and insulin resistance. At 1.37, this is within the laboratory fasting range below 1.7 but above the ideal threshold of 1.0. Given her excellent insulin sensitivity (HOMA-IR 1.24) and zero alcohol intake, the triglycerides are likely related to dietary carbohydrate timing or the composition of meals within the intermittent fasting window. They are not concerning at this level, and a modest reduction in refined carbohydrate and an increase in omega-3 should bring them down.","low_causes":"Low-fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate intake, alcohol, obesity, insulin resistance, medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3974","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to the tissues. At 0.62, this is within the laboratory range below 0.78 and slightly above the ideal ceiling of 0.6. It tracks with the triglycerides and is not a concern.","low_causes":"Low triglycerides, fasting","high_causes":"High carbohydrate intake, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7692","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL, high-density lipoprotein, is the 'protective' cholesterol that removes excess cholesterol from the arteries and returns it to the liver for disposal. At 1.6, this meets the ideal threshold of 1.6 for women. A good result that reflects her regular exercise and healthy diet.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics, medications","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4700","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, low-density lipoprotein, carries cholesterol to the tissues and, when elevated, deposits it in arterial walls. At 2.85, this is within the laboratory range of 0.5 to 3.0 but above the optimal target of 2.6. However, the ApoB at 0.78 (below target), the Lp(a) below 25 (ideal), and the Lp(a)-corrected LDL of 2.77 all indicate that the overall atherogenic particle burden is low. The LDL is mildly above ideal but not at a level requiring medication, and dietary adjustments with increased soluble fibre (oats, beans, lentils) and two to three portions of oily fish per week should bring it down.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, kidney disease, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3478","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a simple cardiovascular risk marker. At 3.13, this is within the ideal range below 3.5, confirming a favourable balance between total and protective cholesterol.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.425","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.375","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL and captures all the potentially atherogenic cholesterol (LDL, VLDL and remnants) in one number. At 3.4, this is within the laboratory range below 4.0 but above the ideal target of 3.0. It is driven by the mildly above-ideal LDL and reflects the same dietary lever: increasing soluble fibre and oily fish while moderating saturated fat.","low_causes":"Low LDL, low triglycerides","high_causes":"High LDL, high triglycerides, diet, genetics, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6321","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein on HDL particles and is a direct measure of the number of protective cholesterol carriers in the blood. At 1.77, this is above both the 1.4 minimum and the 1.6 ideal threshold, confirming a strong HDL particle count.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome","high_causes":"Exercise, genetics, moderate alcohol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein on every LDL, VLDL and Lp(a) particle, so it counts the total number of atherogenic particles in the blood. It is considered a better predictor of cardiovascular risk than LDL cholesterol alone. At 0.78, this is below both the laboratory threshold of 0.9 and the optimal target of 0.8, which is an excellent result. It means that despite the LDL being marginally above ideal, the actual number of harmful particles is low.","low_causes":"Low LDL, low triglycerides, malnutrition","high_causes":"High LDL, familial hypercholesterolaemia, diet, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic particles (ApoB) to protective particles (ApoA1). At 0.44, this is well within the lower-risk zone below 0.6 for women, and within the ideal range below 0.5. This is the single best summary of her lipid risk, and it is excellent.","low_causes":"High HDL, low LDL, excellent cardiovascular profile","high_causes":"High LDL, low HDL, metabolic syndrome, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is an inherited form of LDL cholesterol that cannot be changed by diet, exercise or lifestyle. It contributes to cardiovascular risk by depositing cholesterol in arteries, encouraging blood clots and promoting inflammation. At below 25, this is within the ideal range below 32. This is genuinely useful information because it means any future lipid management is entirely about modifiable factors like diet, exercise and weight, rather than inherited risk.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4457","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3619","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase is an enzyme released from muscle cells when they are damaged or stressed. At 62, this is within the ideal range and shows no excessive muscle damage from training. A healthy result for someone training four times a week.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3610","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3557","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the unbound, storage form of thyroid hormone that circulates in the blood ready to be converted into active T3. At 14.6, this is within the laboratory range and just inside the lower boundary of the ideal range of 14 to 20. While it is in the lower quarter of the reference range, the TSH at 1.4 and FT3 at 5.1 show that the thyroid is maintaining excellent output and conversion. If she is on levothyroxine, this level may be adequate for her; if not, the thyroid is managing on its own despite being in the lower portion.","low_causes":"Hypothyroidism, pituitary disease, severe illness, medications","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3867","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.5280","units":"mIU/L","description":"TSH, thyroid-stimulating hormone, is the signal the pituitary gland sends to the thyroid to produce hormone. A high TSH means the pituitary is shouting because the thyroid is not producing enough. At 1.4, this is within the ideal range of 1.0 to 2.5, meaning the pituitary is sending a gentle, normal signal. For someone with a Hashimoto's diagnosis, an ideal TSH is the best indicator that thyroid function is currently well controlled.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism, energy production, body temperature and brain function. At 5.1, this is within the ideal range of 4.5 to 6.5. The body is converting FT4 into FT3 efficiently, confirming that the thyroid is delivering the hormone the cells actually use.","low_causes":"Hypothyroidism, low T4, selenium deficiency, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are autoantibodies that attack thyroid peroxidase, an enzyme the thyroid needs to produce hormone. They are the hallmark of Hashimoto's thyroiditis. At below 6.6, these are well below the 13.8 threshold, meaning no active autoimmune attack on the thyroid is detected at present. This is noteworthy given the Hashimoto's diagnosis and suggests that autoimmune activity may have quietened, or the original diagnosis was based on antibodies that have since fallen below detection.","low_causes":"No autoimmune thyroid activity","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tgantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies are a second type of thyroid autoantibody. At below 1.3, these are undetectable, consistent with more than 80% of the population. Together with the negative TPO antibodies, this confirms no detectable autoimmune thyroid activity.","low_causes":"No autoimmune thyroid activity","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.349","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3-to-FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.349, this is within the ideal range of 0.27 to 0.40, confirming healthy conversion. Good conversion depends on adequate selenium, zinc and iron, and her result shows these pathways are working well despite the lower-quarter FT4.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"11.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1492","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a tumour marker associated with pancreatic and gastrointestinal cancers. At 11.04, this is well within the normal range below 37. Combined with the normal lipase, it provides additional reassurance that the mildly raised amylase is not driven by pancreatic pathology.","low_causes":"Normal health","high_causes":"Pancreatic cancer, bile duct cancer, gastrointestinal cancers, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"0.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1217","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/mL","description":"CEA, carcinoembryonic antigen, is a protein used to monitor colorectal and other cancers. At 0.56, this is well within the normal non-smoker range of 0 to 2.3. A reassuring result.","low_causes":"Normal health","high_causes":"Colorectal cancer, other cancers, smoking, liver disease, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"15.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6281","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3860","upper_optimal_position":"0.5789","units":"g/L","description":"IgG is the most abundant immunoglobulin in the blood and forms the backbone of long-term immune memory. At 15.4, this is within the laboratory range of 6.5 to 16 but above the optimal ceiling of 14, sitting near the upper limit. A mildly elevated IgG can reflect chronic immune stimulation, which in a woman with a history of autoimmune thyroid disease is a recognised finding. It likely contributes to the elevated globulin and the raised ESR.","low_causes":"Immune deficiency, medications, kidney disease","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"g/L","description":"IgM is the first antibody the body produces in response to a new infection. At 1.6, this is within the ideal range, showing no acute infection or immune activation.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4946","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is the antibody that protects mucous membranes in the gut, lungs and urinary tract. At 2.0, this is within the ideal range. Adequate IgA is also important for interpreting the coeliac screen (tTG-IgA), as IgA deficiency can produce a false-negative coeliac result. Her IgA is normal, so the negative coeliac screen is reliable.","low_causes":"Selective IgA deficiency (most common primary immunodeficiency), medications","high_causes":"Chronic infection, liver disease, coeliac disease, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"5.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0275","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"IgE is the antibody involved in allergic reactions and defence against parasites. At 5.49, this is very low within the range below 100, indicating minimal allergic sensitisation. This makes environmental allergies or allergic-driven inflammation an unlikely contributor to her symptoms.","low_causes":"Normal health, immune deficiency","high_causes":"Allergies, asthma, eczema, parasitic infections, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"<4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Rheumatoid factor is an autoantibody associated with rheumatoid arthritis. At below 4, this is well within the negative range below 14. Given her report of joint pain and stiffness, a negative rheumatoid factor makes rheumatoid arthritis unlikely, though it does not completely exclude seronegative forms. The joint symptoms are more likely related to the perimenopausal hormonal changes: falling oestrogen reduces the anti-inflammatory and lubricating effects on joints.","low_causes":"Normal health","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.222","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0154","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA (tTG-IgA) is the primary screening test for coeliac disease, an autoimmune condition where gluten triggers inflammation in the small intestine, leading to malabsorption, bloating, fatigue and other symptoms. At 0.222, this is strongly negative (threshold 7.19). Combined with a normal IgA of 2.0, which confirms the test is reliable, coeliac disease is effectively excluded. However, this does not rule out non-coeliac gluten sensitivity, which does not produce antibodies and can only be identified through an elimination trial.","low_causes":"No coeliac disease","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6095","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4762","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, the unstable molecules that damage cells. At 1.69, this is within the ideal range, reflecting good dietary antioxidant intake from the 4 to 5 portions of vegetables and fruit daily and the omega-3 supplementation.","low_causes":"Poor diet, oxidative stress, chronic disease, smoking","high_causes":"Supplementation, high fruit and vegetable intake, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"199","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1695","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"300","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4392","upper_optimal_position":"0.5808","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It should peak in the first 30 to 60 minutes after waking (the cortisol awakening response) and gradually decline through the day. At 199, assuming a morning sample, this sits in the lower quarter of the morning range (145 to 619). A lower morning cortisol fits precisely with her reported pattern of feeling tired on waking and slow to get going. This does not indicate adrenal insufficiency, which would produce a cortisol well below 145, but it suggests the cortisol awakening response may be blunted, with cortisol rising later in the day rather than peaking sharply first thing. Bright light within 30 minutes of waking, a fixed wake time, and stress management are the most effective ways to sharpen this response.","low_causes":"Adrenal insufficiency, pituitary disease, chronic fatigue, blunted circadian rhythm","high_causes":"Chronic stress, Cushing's syndrome, medications (prednisolone), acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"111","within_normal":"TRUE","within_optimal":"FALSE","result_position":"","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the most potent form of oestrogen, produced primarily by the ovaries. It regulates the menstrual cycle, maintains bone density, supports joint lubrication, protects cardiovascular health, and influences mood and cognition. At 111, this sits at the low end of the follicular-phase range (71.6 to 529.2) and is close to the postmenopausal ceiling of 118.2. In the context of an FSH of 25.4 (within the postmenopausal range), this level is consistent with perimenopause, where oestrogen production is declining. The hot flushes, joint stiffness, hair thinning and morning fatigue she reports are all recognised consequences of falling oestrogen. Discussing hormone replacement therapy with a menopause specialist would address whether oestrogen replacement is appropriate.","low_causes":"Perimenopause, menopause, ovarian insufficiency, low body fat, excessive exercise, eating disorders","high_causes":"Ovulation, pregnancy, oestrogen-producing tumours, HRT, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"<0.21","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"0.0","upper_normal":"4.45","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is the hormone produced after ovulation that prepares the uterus for pregnancy and stabilises the menstrual cycle. At below 0.21, this is consistent with the early follicular phase of the cycle or with anovulation, meaning no egg was released in this cycle. In the context of her irregular periods and the elevated FSH, anovulatory cycles are expected during perimenopause. Low progesterone can contribute to irregular bleeding, poor sleep quality and mood changes. If HRT is discussed, combined oestrogen and progesterone replacement would be considered to protect the uterus.","low_causes":"Follicular phase, anovulation, perimenopause, menopause, luteal phase deficiency","high_causes":"Luteal phase, pregnancy, ovarian cysts, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"7.51","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"1.9","upper_normal":"12.5","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/mL","description":"LH is the hormone that, together with FSH, orchestrates the menstrual cycle. A surge in LH triggers ovulation. At 7.51, this is within the follicular-phase range of 1.9 to 12.5. In perimenopause, FSH typically rises before LH does, and the discrepancy between her elevated FSH (25.4) and the normal LH is characteristic of early perimenopausal transition. In PCOS, the LH-to-FSH ratio is often elevated; here it is the opposite, with FSH well above LH, supporting perimenopause rather than PCOS as the primary driver of her current cycle irregularity.","low_causes":"Pituitary disease, stress, eating disorders, hypothalamic amenorrhoea","high_causes":"Menopause, perimenopause, PCOS, ovarian failure, midcycle surge","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"25.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"","lower_normal":"2.5","upper_normal":"10.2","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/mL","description":"FSH is the hormone the pituitary gland sends to the ovaries to stimulate egg development and oestrogen production. When the ovaries produce less oestrogen, the pituitary raises FSH, shouting louder to get a response. At 25.4, this is well above the follicular-phase range of 2.5 to 10.2 and sits within the postmenopausal range of 23 to 116. This is the clearest marker in this report pointing to perimenopause. The elevated FSH, combined with the low-end oestradiol and the clinical symptoms of hot flushes, irregular periods, joint stiffness and hair thinning, forms a coherent picture of the ovaries transitioning towards menopause.","low_causes":"Pituitary disease, pregnancy, PCOS, stress, eating disorders","high_causes":"Perimenopause, menopause, ovarian failure, premature ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2857","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4762","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and plays a critical role in energy, muscle maintenance, bone density, libido, mood and hair growth. At 0.4, this is below the female reference range of 0.5 to 2.6. In the context of perimenopause, testosterone production declines alongside oestrogen. Low testosterone is associated with fatigue, reduced libido, difficulty building muscle, joint stiffness, and hair thinning, several of which she reports. Testosterone replacement (often as a cream or gel) alongside oestrogen replacement is increasingly recognised as beneficial for perimenopausal and postmenopausal women and should be discussed with her prescriber.","low_causes":"Perimenopause, menopause, ovarian insufficiency, adrenal insufficiency, oral contraceptives, low DHEA-S","high_causes":"PCOS, congenital adrenal hyperplasia, adrenal or ovarian tumours, anabolic steroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3907","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"0.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"","description":"The free androgen index estimates how much testosterone is biologically active, calculated from total testosterone and SHBG. At 1.02, this is within range and not elevated, which is reassuring in the context of PCOS. An elevated FAI would suggest androgen excess driving symptoms like acne, hirsutism and hair loss, but hers is low-normal, consistent with the below-range testosterone rather than androgen excess.","low_causes":"Low testosterone, high SHBG, perimenopause, menopause","high_causes":"PCOS, low SHBG, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3936","lower_normal":"0.26","upper_normal":"11","lower_optimal":"3.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4189","upper_optimal_position":"0.5741","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a precursor hormone produced by the adrenal glands that the body converts into testosterone and oestrogen. At 2.1 umol/L (774 ug/dL), this is within the laboratory range but below the ideal band. DHEA-S naturally declines with age, and a lower level at 46 is not unusual. However, combined with the below-range testosterone, it suggests that the adrenal contribution to androgen production is modest, which is part of why testosterone is low.","low_causes":"Aging, adrenal insufficiency, chronic stress, chronic illness","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"178","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"400","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production. Outside of pregnancy and breastfeeding, elevated prolactin can suppress ovulation and cause irregular periods. At 178, this is within the non-pregnant range of 59
