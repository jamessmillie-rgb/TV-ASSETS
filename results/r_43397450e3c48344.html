in cancers","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hbegf","name":"Heparin-binding EGF-like growth factor (HB-EGF)","group":"INFLAMMATION","result":"135.77","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6660","lower_normal":"17.99","upper_normal":"135.99","lower_optimal":"17.99","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5650","units":"pg/ml","description":"HB-EGF is a growth factor involved in wound healing, cell proliferation and vascular function. Her level of 135.77 sits at the very top of the laboratory range (upper limit 135.99). While technically within range, this is at the ceiling. HB-EGF can be elevated in states of metabolic stress and insulin resistance. No action is needed, but it is consistent with the metabolic picture.","low_causes":"","high_causes":"Cardiovascular disease, chronic inflammation, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcp1","name":"Monocyte Chemotactic Protein-1 (MCP-1)","group":"INFLAMMATION","result":"136","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3399","lower_normal":"130","upper_normal":"433","lower_optimal":"130","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4653","units":"pg/ml","description":"MCP-1 recruits monocytes to sites of inflammation and tissue injury. Her level of 136 is at the lower end of the laboratory range, suggesting minimal monocyte recruitment signalling.","low_causes":"","high_causes":"Chronic inflammation, atherosclerosis, obesity, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gmcsf","name":"Granulocyte Macrophage Colony Stimulating Factor (GM-CSF)","group":"INFLAMMATION","result":"<0.00","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"0","upper_normal":"1.46","lower_optimal":"0","upper_optimal":"1.46","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"pg/ml","description":"GM-CSF stimulates the bone marrow to produce granulocytes and macrophages. An undetectable level is normal and indicates no active bone marrow stimulation.","low_causes":"","high_causes":"Infection, autoimmune disease, certain cancers","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"mmp9","name":"Matrix Metalloproteinase-9 (MMP-9)","group":"INFLAMMATION","result":"447.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5663","lower_normal":"30.7","upper_normal":"626.6","lower_optimal":"30.7","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5399","units":"ng/ml","description":"MMP-9 is an enzyme that breaks down the extracellular matrix, the structural scaffolding between cells. It is involved in tissue remodelling, wound healing and immune cell migration. Her level of 447.2 is within the laboratory range but above the optimal band. MMP-9 can be elevated in states of chronic inflammation and metabolic stress, consistent with her broader inflammatory cytokine pattern.","low_causes":"","high_causes":"Chronic inflammation, cardiovascular disease, cancer, tissue remodelling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"interleukin17a","name":"Interleukin 17A","group":"INFLAMMATION","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1903","lower_normal":"0","upper_normal":"1.13","lower_optimal":"0","upper_optimal":"1.13","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"pg/ml","description":"IL-17A is a pro-inflammatory cytokine produced by Th17 cells. Unlike its sister molecule IL-17F, which is elevated in this report, IL-17A is within range. The two have overlapping but not identical roles, and the selective elevation of IL-17F without IL-17A is consistent with mucosal-predominant Th17 activation rather than systemic autoimmunity.","low_causes":"","high_causes":"Autoimmune disease, psoriasis, inflammatory bowel disease, chronic infection","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"interleukin17f","name":"Interleukin 17F","group":"INFLAMMATION","result":"0.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9886","lower_normal":"0","upper_normal":"0.44","lower_optimal":"0","upper_optimal":"0.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3409","units":"pg/ml","description":"IL-17F is a cytokine produced by Th17 cells that plays a key role in defending mucosal barriers, particularly in the gut, lungs and skin. Her level of 0.87 is roughly double the upper limit of 0.44. Elevated IL-17F is associated with gut barrier disruption, chronic mucosal inflammation, and is increasingly recognised as part of the immune signature of PCOS. This finding connects to her bloating and digestive discomfort and to the broader Th17 activation pattern seen with IL-22.","low_causes":"","high_causes":"Mucosal inflammation, autoimmune disease, gut barrier disruption, PCOS-related immune activation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"interleukin22","name":"Interleukin 22","group":"INFLAMMATION","result":"14.68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"6.51","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3840","units":"pg/ml","description":"IL-22 is produced by Th17 cells and acts on epithelial cells, particularly in the gut, to promote barrier repair and antimicrobial defence. Her level of 14.68 is more than double the upper limit of 6.51. Elevated IL-22, alongside elevated IL-17F, indicates active Th17-mediated mucosal immune response. This is the cytokine pattern most closely linked to her bloating and digestive symptoms and is part of the PCOS-associated immune phenotype.","low_causes":"","high_causes":"Gut barrier disruption, mucosal inflammation, PCOS, psoriasis, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"105.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4347","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"PLR is a ratio of platelets to lymphocytes used as a marker of systemic inflammation. Her ratio of 105.6 is within the ideal range, consistent with her excellent hsCRP.","low_causes":"","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"548","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"SII combines platelets, neutrophils and lymphocytes into a single index of immune-inflammation balance. Her value of 548 is within the reference range but above the optimal band. The slight elevation is consistent with the low-grade immune activation seen in her cytokine panel, though the conventional inflammation marker hsCRP remains excellent.","low_causes":"","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytehdlratio","name":"Monocyte:HDL Ratio","group":"INFLAMMATION","result":"0.48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"","upper_normal":"0.6","lower_optimal":"","upper_optimal":"0.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"ratio","description":"The monocyte-to-HDL ratio is a marker of chronic inflammation and cardiovascular risk. Her ratio of 0.48 is within the reference range but above the optimal of 0.4, driven by the monocyte count at the top of its range. The strong HDL of 1.65 is keeping the ratio from going higher.","low_causes":"","high_causes":"Inflammation with low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ckmb","name":"Creatine Kinase-MB (CK-MB)","group":"CARDIAC MARKERS","result":"<0.780","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0799","lower_normal":"0","upper_normal":"4.88","lower_optimal":"0","upper_optimal":"4.88","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ug/l","description":"CK-MB is an enzyme found mainly in heart muscle. It is released into the blood when heart muscle is damaged. Her level is below 0.780, well within range, confirming no evidence of heart muscle injury.","low_causes":"","high_causes":"Heart attack, myocarditis, cardiac surgery, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4552","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"IU/L","description":"Creatine kinase is an enzyme found in muscle tissue. It rises after muscle damage from exercise, injury or disease. Her level of 89 is within the ideal range for women (25 to 200), consistent with her non-training status.","low_causes":"Very low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, hypothyroidism, statin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"myoglobin","name":"Myoglobin","group":"CARDIAC MARKERS","result":"27.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2402","lower_normal":"0","upper_normal":"58","lower_optimal":"0","upper_optimal":"40","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3448","units":"ug/l","description":"Myoglobin is a protein found in heart and skeletal muscle that is released into the blood after muscle injury. Her level of 27.86 is within range and unremarkable.","low_causes":"","high_causes":"Muscle injury, rhabdomyolysis, heart attack, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"troponint","name":"Troponin T","group":"CARDIAC MARKERS","result":"<3.00","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1071","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ng/l","description":"Troponin T is a protein released from damaged heart muscle cells. It is the most specific marker of heart injury. Her level is below 3.0, well within range, confirming no heart muscle damage.","low_causes":"","high_causes":"Heart attack, myocarditis, heart failure, pulmonary embolism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fabp3","name":"Fatty Acid Binding Protein-3 (FABP-3)","group":"CARDIAC MARKERS","result":"3.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3895","lower_normal":"0","upper_normal":"4.84","lower_optimal":"0","upper_optimal":"4.84","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ng/ml","description":"FABP-3 is a protein found in heart muscle that is released during cardiac injury. Her level of 3.77 is within range, confirming no cardiac damage.","low_causes":"","high_causes":"Heart attack, myocarditis, heart failure","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Glucose","group":"GLUCOSE & INSULIN","result":"3.50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2778","lower_normal":"4","upper_normal":"7","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4889","units":"mmol/l","description":"Glucose measures the concentration of sugar in the blood at the time of the sample. Her level of 3.5 is below the lower limit of 4.0, placing it in the hypoglycaemic range. In the context of a fasting insulin of 101 pmol/L and a HOMA-IR of 2.26 (above the 2.0 limit), this suggests that insulin is pushing glucose down too aggressively, a pattern sometimes called reactive hypoglycaemia. This can cause symptoms such as fatigue, brain fog, shakiness and feeling cold, all of which she reports. This finding should be discussed with her GP, ideally with a repeat fasting glucose and insulin and consideration of an oral glucose tolerance test.","low_causes":"Excess insulin production, reactive hypoglycaemia, inadequate food intake, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress, medications, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"37.16","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4424","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the average blood sugar level over the preceding two to three months by looking at how much glucose has attached to haemoglobin in red blood cells. Her level of 37.16 is within the laboratory range (below 42, the pre-diabetic threshold) but above the optimal of 36. In the context of a glucose of 3.5 and insulin resistance, this suggests that while fasting glucose runs low, post-meal glucose peaks are running higher than ideal, and the average over three months reflects those peaks. This is an early metabolic signal and a call to act, not a cause for alarm.","low_causes":"Haemolytic anaemia, recent blood loss, low red cell lifespan","high_causes":"High blood sugar, pre-diabetes, type 2 diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"101.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5120","lower_normal":"17.8","upper_normal":"173","lower_optimal":"17.8","upper_optimal":"57.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4188","units":"pmol/l","description":"Insulin measures how much insulin the pancreas is producing. Insulin is the hormone that moves glucose from the blood into cells for energy. Her level of 101 pmol/L is within the laboratory range but above the optimal band. In the context of a glucose of 3.5, this means the pancreas is producing more insulin than it should need, pushing glucose down below the normal floor. This is the hallmark of insulin resistance: the cells are not responding efficiently to insulin, so the pancreas compensates by making more. This is the central metabolic finding in this report and the driver of her PCOS symptoms.","low_causes":"Low-carbohydrate diet, very high insulin sensitivity, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, PCOS, obesity, high-carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nonesterifiedfattyacids","name":"Non-Esterified Fatty Acids","group":"GLUCOSE & INSULIN","result":"1.400","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mmol/l","description":"Non-esterified fatty acids (NEFAs) are the fats released from fat tissue into the bloodstream to be used as fuel. In a healthy fasting state, insulin suppresses this release, keeping NEFA levels low. Her level of 1.40 is well above the upper limit of 0.9, indicating that her fat tissue is not responding properly to insulin's signal to stop releasing fat. This is a direct marker of adipose tissue insulin resistance and is one of the mechanisms that drives further insulin resistance in the liver and muscles. The excess fatty acids also generate acidic by-products, which may explain her low bicarbonate. Reducing sugar, improving meal composition and adding resistance training will improve the fat tissue's sensitivity to insulin.","low_causes":"Well-fed state, very high insulin sensitivity","high_causes":"Insulin resistance, fasting, starvation, uncontrolled diabetes, high-fat diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cpeptide","name":"C-peptide","group":"GLUCOSE & INSULIN","result":"2.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5172","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3737","upper_optimal_position":"0.5758","units":"ng/ml","description":"C-peptide is released by the pancreas in equal amounts to insulin, but it is not cleared as quickly, making it a more stable measure of how much insulin the pancreas is producing. Her level of 2.92 ng/mL is within the ideal range and confirms that her beta cells are producing insulin robustly. This is important alongside the positive ZnT8 result: it means the pancreas has not suffered significant autoimmune damage, at least not yet.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, exogenous insulin use","high_causes":"Insulin resistance, insulinoma, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fructosamine","name":"Fructosamine","group":"GLUCOSE & INSULIN","result":"224","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4966","lower_normal":"151","upper_normal":"300","lower_optimal":"180","upper_optimal":"270","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3982","upper_optimal_position":"0.5996","units":"umol/l","description":"Fructosamine measures average blood sugar over the past two to three weeks by looking at glucose attached to blood proteins. Her level of 224 is within the ideal range, suggesting that short-term glucose control has been reasonable even though HbA1c (the longer-term measure) is slightly above optimal.","low_causes":"Low protein levels, nephrotic syndrome","high_causes":"High blood sugar, diabetes, pre-diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5650","lower_normal":"0","upper_normal":"2","lower_optimal":"0","upper_optimal":"1.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"","description":"HOMA-IR estimates how resistant the body's cells are to insulin, calculated from glucose and insulin levels. A higher number means more resistance. Her level of 2.26 is above the upper limit of 2.0, confirming insulin resistance. This is the central metabolic finding in this report: the body is producing more insulin than it should need to control blood sugar, and the cells are not responding efficiently. Insulin resistance is the established driver of PCOS symptoms, including irregular periods, difficulty losing weight, and elevated testosterone. Improving insulin sensitivity through diet, resistance training and weight loss is the most impactful intervention in this report.","low_causes":"Very high insulin sensitivity, low-carbohydrate diet","high_causes":"Insulin resistance, PCOS, obesity, metabolic syndrome, high-carbohydrate diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"adiponectin","name":"Adiponectin","group":"GLUCOSE & INSULIN","result":"8.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4830","lower_normal":"3.81","upper_normal":"14.1","lower_optimal":"6","upper_optimal":"14.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6667","units":"ug/ml","description":"Adiponectin is a hormone produced by fat tissue that improves insulin sensitivity and has anti-inflammatory effects. Higher levels are protective. Her level of 8.43 is within the ideal range, which is a positive finding at BMI 28.1, because adiponectin tends to fall as body fat increases. This suggests her fat tissue is still metabolically functional even though insulin resistance has developed.","low_causes":"Obesity, insulin resistance, metabolic syndrome, type 2 diabetes","high_causes":"Low body fat, high insulin sensitivity, regular exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4429","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood glucose over the past two to three months. Her value of 6.2 mmol/L is at the boundary of the optimal range, confirming that while her average glucose is acceptable, it is not as low as would be ideal. The mismatch between a low fasting glucose and a borderline estimated average glucose suggests post-meal glucose peaks are running higher than ideal.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4659","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index estimates insulin resistance from fasting triglycerides and glucose. Her value of 8.2 is within the ideal range. Despite the HOMA-IR being above the threshold, the TyG index has not yet crossed into the abnormal zone, partly because the low fasting glucose brings the index down. This does not negate the insulin resistance found by HOMA-IR but suggests it is at an early, modifiable stage.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucoseinsulinratio","name":"Glucose:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"4.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4778","lower_normal":"4.5","upper_normal":"","lower_optimal":"7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7778","upper_optimal_position":"1.0000","units":"mg/dL per mIU/L","description":"The glucose-to-insulin ratio provides another estimate of insulin sensitivity. A lower ratio means more insulin is needed for each unit of glucose, indicating resistance. Her ratio of 4.3 is below the lower limit of 4.5, confirming insulin resistance from a third angle alongside the HOMA-IR and the clinical picture.","low_causes":"Insulin resistance","high_causes":"Very high insulin sensitivity, low-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"adiponectininsulinratio","name":"Adiponectin:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"0.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.9667","lower_normal":"0.3","upper_normal":"","lower_optimal":"0.7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"1.0000","upper_optimal_position":"1.0000","units":"ratio","description":"This ratio reflects the balance between the insulin-sensitising hormone adiponectin and insulin itself. A higher ratio is better. Her ratio of 0.58 is within the reference range but below the optimal of 0.7, driven by the relatively high fasting insulin. This will improve as insulin resistance improves.","low_causes":"Low adiponectin with high insulin, metabolically unhealthy weight","high_causes":"Very high insulin sensitivity, lean body composition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"microalbumincreatinin metabolised and when metabolic stress is high, and elevated uric acid itself worsens insulin sensitivity and promotes inflammation. Reducing sugary foods and drinks is one of the most direct ways to bring uric acid down. Staying well hydrated also helps, as water supports uric acid excretion through the kidneys.","low_causes":"Low-purine diet, medications, liver disease","high_causes":"Insulin resistance, high-purine diet, fructose intake, kidney impairment, gout, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcystatin","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7750","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR is calculated from cystatin C, which is not affected by muscle mass and provides a complementary estimate of kidney filtration to the creatinine-based eGFR. Her value of 93 is above the optimal threshold of 90, confirming healthy kidney function from a second, independent measure.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR combines both creatinine and cystatin C for the most accurate estimate of kidney function. Her value of 98 is above the optimal threshold of 90 and agrees closely with the individual estimates, giving strong confidence in healthy kidney function.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"45.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3656","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"This ratio helps distinguish between different causes of kidney function changes. Her ratio of 45.8 is within the ideal range, consistent with normal kidney function and hydration.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"zinctransporter8znt8auto","name":"Zinc Transporter 8 (ZnT8) Autoantibodies","group":"VITAMINS & NUTRIENTS","result":"432.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"56.41","lower_optimal":"0","upper_optimal":"56.41","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ng/ml","description":"ZnT8 autoantibodies target the zinc transporter 8 protein found on the surface of the insulin-producing beta cells in the pancreas. A positive result indicates the immune system has mounted a response against these cells. Her level of 432.9 is approximately eight times the upper limit of 56.41, which is a strongly positive result. However, the other three pancreatic autoantibodies tested (GAD65, IA-2 and insulin autoantibodies) are all negative, and her C-peptide at 2.92 ng/mL confirms robust insulin production. A single positive autoantibody carries a much lower risk of progression to autoimmune diabetes than two or more. This result should be discussed with her GP and may warrant referral to endocrinology for monitoring, particularly given her PCOS, insulin resistance and family history of type 2 diabetes.","low_causes":"","high_causes":"Autoimmune beta cell targeting, type 1 diabetes risk, LADA","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"copper","name":"Copper","group":"VITAMINS & NUTRIENTS","result":"10.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2599","lower_normal":"12.6","upper_normal":"24.4","lower_optimal":"14","upper_optimal":"22","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3729","upper_optimal_position":"0.5989","units":"umol/l","description":"Copper is an essential trace mineral involved in energy production, iron metabolism, connective tissue formation, and immune function. Her level of 10.0 is below the lower limit of 12.6. Low copper can contribute to fatigue, cold intolerance, impaired immune regulation, and reduced iron utilisation, several of which she reports. It may also partly explain her borderline-low ferritin, because copper is needed for the enzyme ceruloplasmin that loads iron into transferrin for transport. Zinc supplementation without adequate copper can suppress copper absorption, and if she has been taking zinc in any form, that may be a contributing factor. A repeat test with caeruloplasmin is recommended to determine whether this is a true deficiency.","low_causes":"Inadequate dietary intake, zinc supplementation, malabsorption, Menkes disease","high_causes":"Infection, inflammation, pregnancy, Wilson's disease (low copper with high free copper)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tas","name":"Total Antioxidant Status (TAS)","group":"VITAMINS & NUTRIENTS","result":"1.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":" iption":"Vitamin B12 is essential for nerve function, DNA synthesis, red blood cell production and the clearance of homocysteine. Her level of 388 is within the laboratory range but below the optimal threshold of 500. Her active B12 at 77.8 pmol/L is adequate, confirming the B12 available to cells is sufficient, but bringing total B12 above 500 with sublingual methylcobalamin should help bring homocysteine (currently 10.0) below the optimal of 9.","low_causes":"Poor dietary intake (especially vegetarian/vegan), pernicious anaemia, malabsorption, metformin use","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3703","lower_normal":"50","upper_normal":"375","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.4051","units":"nmol/l","description":"Vitamin D is a hormone that regulates calcium absorption, bone health, immune function and insulin sensitivity. Her level of 86 nmol/L is within the laboratory range and above the lower optimal threshold of 75, but below the ideal target of 100 to 120. At a BMI of 28.1, fat tissue sequesters vitamin D, so she needs a higher supplementation dose than a lean person to reach optimal. Her current supplementation is working but could be increased slightly to 3,000 IU daily.","low_causes":"Insufficient sunlight, poor diet, obesity (fat sequestration), dark skin, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"activeb12","name":"Active B12","group":"VITAMINS & NUTRIENTS","result":"77.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4589","lower_normal":"25.1","upper_normal"   if (b.within_normal === 'FALSE') return 'flag';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
