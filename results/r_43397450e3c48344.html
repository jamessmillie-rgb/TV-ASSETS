<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Patricia-Victoria Ciolac","dob":"03/12/1995","report_date":"2026-11-10","summary":"Customer is a 30-year-old female presenting with a BMI of 28.1, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are about average (volume 5 out of 10). She does no structured cardio or resistance training but is active on her feet with 10,000 to 15,000 daily steps. She sleeps 7 to 8 hours but is slow to get going on waking, with energy that is tired on waking; stress feels hard to manage most days. She does not drink alcohol. She supplements with vitamin D, omega-3 fish oil and creatine. She has a diagnosis of polycystic ovary syndrome (PCOS) and a family history of type 2 diabetes. She has had a previous blood test but never saw the results. She reports bloating and digestive discomfort, weight gain and difficulty losing weight, irregular periods, and feeling cold or having cold hands and feet, all lasting over a year. Her goals are to lose body fat, prevent disease and improve long-term health and longevity.\n\nThe most important finding in this report is a cluster of results that, taken together, paint a picture of metabolic and immune activity that needs attention and, in one case, a conversation with her GP. Her glucose has come back at 3.5, which is below the lower limit of 4.0 and technically in the hypoglycaemic range. At the same time her insulin is 101 pmol/L, which is within the reference range of 17.8 to 173, and her HOMA-IR, a calculation that estimates how resistant the body's cells are to insulin, is 2.26 against an upper limit of 2.0. Her HbA1c, which reflects average blood sugar over the past two to three months, is 37 mmol/mol, within range but above the optimal threshold of 36. Her non-esterified fatty acids (NEFAs), which are the fats released from fat stores into the bloodstream when the body needs fuel, are 1.40 against an upper limit of 0.9. And her bicarbonate, which buffers the acid produced by metabolism, is 16.1 against a lower limit of 22, which is a significant drop. Put these together and the picture is of a body that is producing enough insulin to push glucose down hard, possibly too hard, while the cells themselves are beginning to resist that insulin, and the fat tissue is releasing fatty acids as though it has not received the message that insulin is present. The low bicarbonate may reflect the metabolic cost of processing those excess fatty acids, which generate acidic by-products. This pattern sits squarely within what is expected in PCOS: insulin resistance is one of the central drivers of the condition, and it is the mechanism behind the difficulty losing weight, the irregular periods, and very likely the fatigue on waking. The family history of type 2 diabetes makes this more significant, because insulin resistance is the precursor to type 2 diabetes, and with a genetic predisposition the window for acting on it is now. The glucose of 3.5 should be mentioned to her GP. It may reflect a reactive pattern where the body overshoots with insulin after eating and drives glucose too low by the time a fasting sample is taken, but it needs confirming on a repeat test, ideally with a paired glucose and insulin, and possibly a glucose tolerance test to see what happens after a standardised carbohydrate load.\n\nHer testosterone is 2.63 nmol/L against an upper limit for women of 1.67, and her free androgen index (FAI), which measures how much of that testosterone is available to act on tissues, is 5.83 against an upper limit of 5.62. Her calculated free testosterone is 0.039 nmol/L, above the upper limit of 0.033, and her bioavailable testosterone is 0.95 nmol/L against an upper limit of 0.6. Her LH to FSH ratio is 2.24 against an upper limit of 2.0. Luteinising hormone (LH) and follicle-stimulating hormone (FSH) are the two pituitary hormones that regulate the menstrual cycle; in a textbook cycle their ratio is close to 1:1, but in PCOS the pituitary often produces relatively more LH, which drives the ovaries to produce more testosterone. This is exactly what the results show. The elevated testosterone and FAI are the hormonal signature of PCOS and are likely contributing to the irregular periods and may be contributing to the difficulty losing weight, because androgens in women promote fat storage around the abdomen. Her DHEA-S at 10.5 umol/L is within range but at the higher end, consistent with adrenal androgen production that often accompanies PCOS. Her SHBG, sex hormone binding globulin, which is the protein that binds testosterone and keeps it inactive, is 45.1 nmol/L, within range but not high enough to mop up the excess testosterone. Insulin resistance itself suppresses SHBG production, so improving insulin sensitivity is one of the most effective ways to bring testosterone down without medication. Her oestradiol at 576 pmol/L and progesterone at 28.5 nmol/L are both within the laboratory range, and their levels suggest the sample was taken in the luteal phase of her cycle, after ovulation, which is encouraging because it suggests she is still ovulating at least some of the time despite the irregular periods.\n\nThere is then a finding that should go to her GP alongside the metabolic picture. Her ZnT8 autoantibodies, which are antibodies against a zinc transporter protein found on the surface of the insulin-producing beta cells in the pancreas, are 432.9 ng/mL against an upper limit of 56.41, roughly eight times the threshold. ZnT8 autoantibodies are one of the markers used to identify autoimmune-mediated destruction of beta cells, the process that causes type 1 diabetes. The other two pancreatic autoantibody markers tested here, GAD65 at 11.5 (limit 67.7) and IA-2 at 4.1 (limit 26.6), are both comfortably negative, and insulin autoantibodies are also negative. Her HbA1c is not in the diabetic range, her C-peptide at 2.92 ng/mL (approximately 966 pmol/L) shows her pancreas is still producing insulin robustly, and her fasting insulin itself confirms that. So there is no suggestion that she has type 1 diabetes at present. However, a single strongly positive ZnT8 in a 30-year-old with a family history of type 2 diabetes and existing insulin resistance warrants further investigation. There is a slow-onset form of autoimmune diabetes sometimes called latent autoimmune diabetes in adults (LADA), which can present with features that overlap with type 2 diabetes and PCOS for years before insulin production begins to fall. The GP should be aware of this result and may wish to repeat the ZnT8, check a broader autoantibody panel, and monitor C-peptide and HbA1c over time.\n\nHer inflammatory cytokine panel shows a pattern worth noting. Several soluble receptor markers are above range: soluble IL-2 receptor alpha (sIL-2Ra) at 0.22 against 0.19, soluble IL-6 receptor at 5.14 against 3.53, and both soluble TNF receptors (sTNFR-I at 0.64 against 0.54, sTNFR-II at 0.34 against 0.32). Interleukin-17F at 0.87 against 0.44 and interleukin-22 at 14.68 against 6.51 are also above range. IL-17F and IL-22 are part of the Th17 immune pathway, which is involved in mucosal barrier defence, particularly in the gut, and is also associated with chronic low-grade inflammation and autoimmune activity. The soluble receptors reflect ongoing immune activation at a cellular level. Importantly, her conventional inflammation marker, hsCRP, is only 0.65, which is within the ideal range of below 1.0 and is genuinely impressive at a BMI of 28.1. This means the systemic, whole-body inflammation is well controlled, but there is subclinical immune activation happening beneath the surface that hsCRP does not capture. This pattern is consistent with the gut symptoms she reports, the PCOS-related immune dysregulation that is increasingly recognised in the literature, and the positive ZnT8. Her interleukin-15, a cytokine involved in maintaining immune memory cells, is slightly below range at 0.68 against a lower limit of 0.89, which in isolation is not concerning but fits a picture where the immune system's resources are being directed towards other pathways.\n\nHer IgG, one of the main classes of antibodies, is 16.27 against an upper limit of 16, which is only marginally above and unlikely to be significant on its own. Her Epstein-Barr virus (EBV) results show positive EBNA IgG and VCA IgG with negative VCA IgM, which is the pattern of past infection with immunity. This means she had glandular fever or was exposed to EBV at some point in the past and her immune system dealt with it; it is not active now.\n\nNow for the positives, and there are real ones here. Her liver is in excellent health. ALT at 12, AST below 19, GGT at 20, GLDH at 1.0, bilirubin at 8, bile acids at 2.5, albumin at 45.5, and a FIB-4 score (a fibrosis index that estimates liver scarring) of 0.58 all point to a liver under no strain whatsoever. At a BMI of 28.1 with insulin resistance, this is genuinely reassuring because fatty liver disease is one of the earliest complications of the metabolic pattern she has, and there is no sign of it here. Her NAFLD fibrosis score of minus 3.03 makes significant liver fibrosis very unlikely. Her kidneys are working well, with a creatinine of 69.9, a creatinine-based eGFR of 103, a cystatin C-based eGFR of 93, and a combined eGFR of 98, all comfortably above the optimal threshold of 90. Her microalbumin-to-creatinine ratio is undetectable, which means the kidneys are not leaking protein, another early sign of metabolic damage that is absent here. Her thyroid is working well. TSH at 0.909 is within the laboratory range and just below the optimal band of 1.0 to 2.5, which at this margin does not suggest overactivity, FT4 at 17.0 is within the ideal range of 14 to 20, FT3 at 5.73 is within the ideal range of 4.5 to 6.5, and the FT3-to-FT4 ratio at 0.337 confirms good conversion from the storage hormone to the active hormone. Both thyroid antibodies, anti-TPO and anti-thyroglobulin, are negative. This is important because thyroid disease is more common in women with PCOS and autoimmune markers, and her thyroid is clear. The feeling cold and cold hands and feet she reports is not being driven by the thyroid. It may relate to the low glucose, to peripheral circulation, or to the cortisol and stress pattern.\n\nHer lipid profile is excellent. Total cholesterol at 4.44, LDL at 2.20, HDL at 1.65 (above the 1.55 lower limit and above the optimal threshold of 1.6 for women), triglycerides at 1.30, ApoB at 61 mg/dL (well below the 80 mg/dL optimal target), and a cardiovascular risk score of 10 out of 100, which is ideal. Her Lp(a), an inherited lipoprotein that increases cardiovascular risk, is below 5.2, which is as low as the assay can measure and is genuinely excellent news: it means any future changes in her cardiovascular markers will largely be within her control through lifestyle and, if needed, medication. Her ApoB-to-ApoA-I ratio at 0.34 is well below the 0.6 threshold for women. Her small dense LDL at 22.21 is low. Her remnant cholesterol at 0.59 is within range, and her TG/HDL ratio at 0.79 is within the optimal band. The one marker that is slightly above optimal is VLDL cholesterol at 0.59 against an optimal of 0.5, which reflects the triglycerides being above the optimal threshold of 1.0; this is driven by the insulin resistance and will improve as that improves.\n\nHer iron studies are in a reasonable place but not optimal. Ferritin at 29.7 is within the laboratory range of 15 to 150 but below the optimal threshold of 40 for women. Iron at 17.5, transferrin at 2.98, TIBC at 61, and transferrin saturation at 28.7 percent (within the optimal 25 to 40 percent) all look healthy, so the stores are not critically low, but at 29.7 there is not much reserve, and with irregular periods that may include occasional heavier bleeds, it would be sensible to build them up. Her ferritin may be contributing to the fatigue on waking and the feeling cold; iron is needed to make haemoglobin, and while her haemoglobin at 136 is healthy, building ferritin above 50 often improves energy in women with borderline stores.\n\nHer vitamin D at 86 nmol/L is within the laboratory range and within a reasonable zone, though below the optimal of 100 to 120 that would be ideal given her PCOS and immune findings. The supplementation she is already taking is working but could be increased slightly. Her vitamin B12 at 388 is within range but below the optimal of 500. Her active B12 at 77.8 is within range, confirming the B12 that is available to cells is adequate, but optimising total B12 above 500 is worthwhile. Her folate at 8.6 is within range and just above the optimal threshold of 8, though her red cell folate at 2,107 is well above the upper limit of 1,257. Red cell folate reflects folate status over the preceding two to three months and a high level usually reflects supplementation or a diet very rich in folate-fortified foods; it is not harmful and does not need action, but it is worth noting.\n\nHer copper at 10.0 is below the lower limit of 12.6, and this is a finding worth flagging. Copper is essential for iron metabolism, energy production, connective tissue formation, and immune function. Low copper can contribute to fatigue, cold intolerance, and impaired immune regulation. It may also partly explain the borderline ferritin, because copper is needed for the enzyme that loads iron into transferrin. Her zinc at 12.8 is within range and within the optimal band. The zinc-to-copper balance matters: supplementing zinc without copper can suppress copper absorption, and if she has been taking zinc as part of her creatine or another supplement, that may be a factor. Her GP should be aware of the low copper, and a repeat test alongside caeruloplasmin (the main copper-carrying protein) would help clarify whether this is a true deficiency or a transient finding.\n\nHer uric acid at 367.7 is above the upper limit of 360 for women, marginally so, but worth noting because elevated uric acid is both a product and a driver of insulin resistance. The body produces more uric acid when fructose is metabolised and when cells are under metabolic stress, and elevated uric acid itself worsens insulin sensitivity. Reducing sugary foods and drinks, which she currently has some days, is one of the most direct ways to bring uric acid down.\n\nHer cardiac markers are all clear: CK-MB, troponin T, myoglobin, FABP-3 and creatine kinase are all comfortably within range. Her coeliac screen is negative. Her rheumatoid factor, anti-CCP, and ANA are all negative, making autoimmune joint disease and systemic autoimmune conditions very unlikely. Her tumour markers are all within range. Her urinalysis is clean apart from a trace of white blood cells, which in the absence of nitrites, symptoms, or significant protein is most likely a normal finding and does not suggest infection.\n\nHer magnesium at 0.72 is within the laboratory range but at the very bottom, just 0.02 above the lower limit, and below the optimal of 0.85 to 1.05. Magnesium is involved in over 300 enzymatic reactions including insulin signalling, and low magnesium is independently associated with worsening insulin resistance. Supplementing magnesium is one of the easiest and most evidence-based interventions for her metabolic picture.\n\nHer homocysteine at 10.0 is within range but above the optimal of below 9. Homocysteine is an amino acid that, when elevated, is associated with cardiovascular risk and impaired methylation, the biochemical process that supports detoxification, DNA repair and neurotransmitter production. Her B12 and folate, the two nutrients that clear homocysteine, are both in the adequate-but-not-optimal range, and bringing both up should bring homocysteine under 9.\n\nHer MCHC at 319 is 1 point below the lower limit of 320, which at this margin is laboratory variation and not clinically significant. Her HB-EGF at 135.77 is at the very top of its range of 135.99 and is not a concern.\n\nHer PhenoAge, a biological ageing score calculated from blood markers, is 21.7 against her calendar age of 30, meaning her blood markers age her 8.3 years younger than she is. This is an excellent result and reflects the low inflammation (hsCRP 0.65), healthy albumin, good kidney function, and well-controlled blood sugar on the HbA1c measure. Her cardiovascular risk score of 10 out of 100 is ideal and reflects the clean lipid profile.\n\nIn summary, the central story of this report is insulin resistance in the context of PCOS, confirmed by the HOMA-IR, the glucose-insulin mismatch, the elevated NEFAs, and the hormonal pattern of raised testosterone and LH-to-FSH ratio. Layered on top of that is an unexpectedly positive ZnT8 autoantibody that needs GP investigation, a low-grade Th17-driven immune activation pattern that may relate to her gut symptoms and her PCOS, low copper, borderline-low ferritin and magnesium, and a diet that is very low in vegetables and fruit. The positive news is substantial: her liver, kidneys, thyroid, lipids, cardiac markers, and conventional inflammation are all in excellent shape, and her PhenoAge is nearly a decade younger than her. The path forward is clear: address the insulin resistance through diet and movement, investigate the ZnT8 with her GP, and optimise the handful of nutrients that are below ideal.","links":"The thread that ties the most important findings together is insulin resistance as the metabolic engine of her PCOS. Her HOMA-IR of 2.26, her glucose of 3.5 pushed below range by an insulin of 101 pmol/L, her elevated non-esterified fatty acids of 1.40, and her low bicarbonate of 16.1 are all expressions of the same underlying problem: her cells are not responding efficiently to insulin, so her pancreas produces more of it, which drives glucose down too aggressively while fat tissue continues to release fatty acids as though insulin is not present. The excess fatty acid metabolism generates acidic by-products, which is the most likely explanation for the low bicarbonate. This metabolic picture is the established driver of the hormonal findings: insulin resistance stimulates the ovaries to produce more testosterone (hers is 2.63 against a female upper limit of 1.67), suppresses SHBG (hers is adequate at 45.1 but not high enough to buffer the excess), and disrupts the pituitary's regulation of LH and FSH (her LH-to-FSH ratio is 2.24 against a limit of 2.0). The result is the irregular periods and the difficulty losing weight that she has reported for over a year. The marginally elevated uric acid at 367.7 fits the same pattern: insulin resistance impairs the kidneys' ability to excrete uric acid, and fructose metabolism, which the sugary food some days may be contributing to, generates uric acid directly.\n\nThe ZnT8 autoantibody result at 432.9, roughly eight times the upper limit, sits outside the PCOS story and introduces a second, separate question. ZnT8 is one of four autoantibodies used to screen for autoimmune destruction of the pancreatic beta cells, the process that causes type 1 diabetes and its slower adult-onset variant, LADA. The other three autoantibodies tested here, GAD65, IA-2 and insulin autoantibodies, are all negative, which is reassuring because the risk of progressing to clinical autoimmune diabetes is much higher when two or more autoantibodies are positive. A single positive ZnT8 in an otherwise metabolically intact pancreas (C-peptide 2.92 ng/mL, insulin production clearly robust) most likely means the immune system has mounted a response against the zinc transporter protein but has not yet caused meaningful beta cell damage. However, in a 30-year-old with a family history of type 2 diabetes, existing insulin resistance, and signs of broader immune activation (the Th17 cytokine elevations), it would be unwise to ignore. The GP should arrange a repeat of the ZnT8, consider a full islet autoantibody panel, and establish a baseline C-peptide and HbA1c for monitoring.\n\nThe inflammatory cytokine pattern is the third thread worth drawing out. The conventional inflammation marker, hsCRP, is excellent at 0.65, and CRP is generally considered the best single marker of systemic inflammation. But beneath that surface, the soluble receptor markers (sIL-2Ra, sIL-6R, sTNFR-I, sTNFR-II) and the Th17-pathway cytokines (IL-17F at 0.87 against 0.44, IL-22 at 14.68 against 6.51) are elevated. This is a pattern of low-grade, compartmentalised immune activation rather than systemic inflammation. The Th17 pathway is particularly relevant because it regulates the mucosal barrier in the gut, and IL-17F and IL-22 are both produced in response to disruption of that barrier. This is plausibly connected to her bloating and digestive discomfort, and there is growing evidence that Th17 dysregulation is part of the immune landscape of PCOS itself. The low IL-15 at 0.68 against 0.89 may reflect a reallocation of immune resources towards the Th17 pathway. The mildly elevated IgG at 16.27 against 16 could be part of this picture, though at this margin it carries very little weight.\n\nWhat has been excluded is as important as what has been found. The thyroid is clear: TSH, FT4, FT3 and both antibodies are all within ideal ranges, so the feeling cold and the fatigue are not thyroid-driven. The liver shows no sign of fatty liver disease or metabolic strain despite the insulin resistance, which is genuinely positive. The kidneys are fully functional. The coeliac screen is negative, making coeliac disease very unlikely as a cause of the bloating. The autoimmune joint screen is negative. The tumour markers are all clear. The EBV pattern is past infection only. The cardiac markers are all clean.\n\nThe remaining loose ends are the low copper at 10.0 against 12.6, which needs a repeat with caeruloplasmin to determine whether it is a true deficiency, and the ferritin at 29.7, which is not critically low but is below optimal and may be contributing to the fatigue and cold intolerance. The diet, at 0 to 1 portions of vegetables and fruit a day, is almost certainly not providing enough micronutrients to support the metabolic demands her body is under, and improving it is the single biggest lever in this report.","lifestyle":"Add a portion of vegetables to lunch and dinner every day this week, starting with whatever is easiest: a handful of spinach in a meal, a side of broccoli, some sliced peppers. Anchor: before you plate the main food, put the vegetable on first. Why: at 0 to 1 portions a day, the diet is not providing the magnesium, fibre, folate or antioxidants the body needs to manage the insulin resistance behind your HOMA-IR of 2.26 and to support the immune system.\nAdd a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish, chicken, beans. Anchor: protein goes on the plate before anything else. Why: protein slows the glucose and insulin response to the meal, which directly targets the mechanism driving your PCOS, your low fasting glucose of 3.5, and your difficulty losing weight. Your target is at least 109 grams of protein a day, which means roughly 30 to 35 grams at each of three meals.\nSwap sugary snacks and drinks for whole-food alternatives on most days. A piece of fruit with nut butter, a handful of nuts, dark chocolate at 70 percent or above. Anchor: when you reach for something sweet, swap rather than resist. Why: fructose from added sugar is one of the direct drivers of uric acid production (yours is 367.7, above range) and worsens insulin resistance.\nWalk for 15 minutes after your largest meal of the day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin spike from that meal, which is the most direct way to improve the HOMA-IR and insulin sensitivity that sit at the centre of your PCOS.\nAdd two resistance training sessions a week, starting with bodyweight exercises at home if a gym feels like too much right now: squats, lunges, press-ups, rows with a bag or bottle. Anchor: pick two fixed days and treat them like appointments. Why: muscle is the biggest consumer of glucose in the body, and building even a modest amount of it improves insulin sensitivity more than any other single intervention. You currently do no resistance training and this is the most important addition.\nSet a fixed wake time seven days a week, within 30 minutes of the same time, and get outside within an hour of waking for natural light. Anchor: alarm goes off, curtains open, step outside even for five minutes. Why: you report being slow to get going and tired on waking, and fixing the circadian signal with consistent light and wake time is the most effective way to shift that pattern. It also supports cortisol rhythm and stress resilience.\nCut caffeine after 1pm. Anchor: after lunch, switch to water, herbal tea or decaf. Why: caffeine after early afternoon delays sleep onset even if you fall asleep at a normal time, reducing the quality of sleep and contributing to the tired-on-waking pattern.\nCalorie target: approximately 2,200 kcal per day (about 300 below your estimated expenditure of 2,496), which will produce steady fat loss of roughly 0.25 to 0.4 kg a week. Protein target: at least 109 grams per day (1.3 g per kg of body weight). First weight milestone: 80 kg; longer-term target range: 72 to 75 kg, at which point BMI reaches 24 to 25. These targets protect muscle while losing fat, which is essential because muscle is what will fix the insulin resistance.","flags":"Glucose 3.5 mmol/L, below the lower limit of 4.0. In the context of an insulin of 101 pmol/L and a HOMA-IR of 2.26 (above the 2.0 limit), this likely reflects reactive hypoglycaemia driven by insulin resistance. Recommend repeat glucose and insulin with the GP, and consider an oral glucose tolerance test to assess the dynamic response.\nZnT8 autoantibodies 432.9 ng/mL, approximately eight times the upper limit of 56.41. GAD65, IA-2 and insulin autoantibodies are all negative. C-peptide 2.92 ng/mL confirms intact beta cell function. A single positive ZnT8 in the absence of other autoantibodies and with a normal HbA1c does not indicate type 1 diabetes at present, but warrants GP referral for repeat testing, monitoring of C-peptide and HbA1c, and possible referral to endocrinology given the PCOS, insulin resistance and family history of type 2 diabetes.\nTestosterone 2.63 nmol/L (upper limit 1.67), free androgen index 5.83% (upper limit 5.62%), calculated free testosterone 0.039 nmol/L (upper limit 0.033), bioavailable testosterone 0.95 nmol/L (upper limit 0.6), LH:FSH ratio 2.24 (upper limit 2.0). This is the hormonal signature of PCOS and is consistent with her diagnosis, irregular periods and difficulty losing weight. Addressing insulin resistance is the primary intervention.\nHOMA-IR 2.26 (upper limit 2.0), non-esterified fatty acids 1.40 mmol/L (upper limit 0.9), HbA1c 37 mmol/mol (optimal below 36), uric acid 367.7 umol/L (upper limit 360). These collectively confirm insulin resistance with early metabolic consequences. The family history of type 2 diabetes makes intervention urgent.\nBicarbonate 16.1 mmol/L, significantly below the lower limit of 22. Most likely a metabolic acidosis driven by the elevated non-esterified fatty acids and their acidic metabolites. The GP should check a venous blood gas to confirm and exclude other causes.\nCopper 10.0 umol/L, below the lower limit of 12.6. Recommend repeat with caeruloplasmin to determine whether this is a true deficiency. Low copper can impair iron utilisation, energy production and immune function.\nElevated Th17-pathway cytokines: IL-17F 0.87 pg/mL (limit 0.44), IL-22 14.68 pg/mL (limit 6.51). Soluble receptors elevated: sIL-2Ra 0.22 ng/mL (limit 0.19), sIL-6R 5.14 ng/mL (limit 3.53), sTNFR-I 0.64 ng/mL (limit 0.54), sTNFR-II 0.34 ng/mL (limit 0.32). IL-15 0.68 pg/mL, below lower limit of 0.89. This pattern suggests low-grade, compartmentalised immune activation with Th17 predominance, consistent with mucosal barrier disruption and the PCOS immune phenotype. hsCRP at 0.65 confirms systemic inflammation is well controlled.\nFerritin 29.7 ug/L, within range but below the optimal of 40 for women. May contribute to fatigue and cold intolerance. Consider gentle iron supplementation.\nMagnesium 0.72 mmol/L, within range but at the very bottom (lower limit 0.70) and below optimal of 0.85. Magnesium supplementation is strongly indicated given its role in insulin signalling.\nRed cell folate 2,107 ug/L, above the upper limit of 1,257. Likely reflects supplementation or fortified foods. Not harmful, no action needed.\nIgG 16.27 g/L, marginally above the upper limit of 16.0. At this margin, unlikely to be significant in isolation.\nMCHC 319 g/L, 1 point below the lower limit of 320. Laboratory variation, not clinically significant.\nReassuring negatives: thyroid function and antibodies make thyroid disease very unlikely. Coeliac screen negative makes coeliac disease very unlikely. ANA, RF and anti-CCP negative make systemic autoimmune and rheumatoid disease very unlikely. All tumour markers within range. Cardiac markers clear. Liver enzymes, fibrosis scores and albumin make liver disease very unlikely. Kidney function fully preserved with no proteinuria. EBV pattern is past infection only, not active.\nNot reported on this occasion: NT-proBNP, Leptin, Resistin, IL-6, TNF-alpha, Urinary Cystatin C, NGAL, KIM-1, Pepsinogen I, Pepsinogen II, PGI/II ratio, Gastrin-17, mCRP, IL-1a, IL-1beta, IL-2, IL-4, IL-10, IL-23, TGF-alpha, VEGF, MIP-1a, E-Selectin, L-Selectin, P-Selectin, ICAM-1, VCAM-1, PD-1, NSE.","recommendations":"Discuss the ZnT8 autoantibody result of 432.9 (limit 56.41) with the GP. Request a repeat ZnT8, consider a broader islet autoantibody panel, and establish baseline C-peptide and HbA1c for monitoring. Given the PCOS, insulin resistance and family history of type 2 diabetes, referral to endocrinology may be appropriate.\nDiscuss the fasting glucose of 3.5 (below 4.0) with the GP. Request a repeat fasting glucose and insulin, and consider an oral glucose tolerance test to assess the insulin-glucose dynamic and confirm or exclude reactive hypoglycaemia.\nDiscuss the bicarbonate of 16.1 (lower limit 22) with the GP. A venous blood gas would confirm the degree of metabolic acidosis and exclude other causes.\nDiscuss the copper of 10.0 (lower limit 12.6) with the GP. A repeat copper with caeruloplasmin will clarify whether this is a true deficiency requiring supplementation.\nDiscuss the insulin resistance picture (HOMA-IR 2.26, elevated NEFAs, uric acid 367.7) and the PCOS hormonal pattern (testosterone 2.63, FAI 5.83) with the GP. Inositol may be worth discussing as an adjunct to the lifestyle changes outlined in this report, particularly given the family history of type 2 diabetes.\nDiscuss the Th17 cytokine elevations (IL-17F, IL-22) and the bloating symptoms with the GP. If bloating persists despite dietary improvement, a hydrogen breath test for SIBO or lactose intolerance would be a reasonable next step.\nCalorie target: 2,200 kcal per day, protein target: at least 109 g per day (1.3 g/kg), first weight milestone 80 kg, longer-term target 72 to 75 kg. Retest in 4 to 6 months with: fasting glucose, fasting insulin, HbA1c, C-peptide, ZnT8, HOMA-IR, testosterone, FAI, SHBG, LH, FSH, ferritin, copper, caeruloplasmin, magnesium, bicarbonate, uric acid and a full blood count.","supplementation":"Magnesium glycinate, 400 mg before bed. Why: magnesium at 0.72 is at the floor of the range and well below optimal; magnesium directly improves insulin sensitivity and supports sleep quality, both of which are central to this report.\nVitamin D3 (cholecalciferol), 3,000 IU daily with a meal containing fat, alongside vitamin K2 (MK-7) 100 mcg daily. Why: vitamin D at 86 is reasonable but below the optimal 100 to 120 for PCOS and immune health; at a BMI of 28.1 a higher dose is needed because fat tissue sequesters vitamin D. She is already supplementing but the dose may need increasing.\nOmega-3 fish oil, 2 g combined EPA and DHA daily with food. Why: omega-3 supports insulin sensitivity, reduces Th17-driven inflammation, and she is already taking it, so this confirms the dose and explains why it matters for her results.\nVitamin B12 as sublingual methylcobalamin, 1,000 mcg daily. Why: B12 at 388 is within range but below the optimal of 500, and improving B12 alongside folate should bring homocysteine (10.0, optimal below 9) under the ideal threshold.\nIron as ferrous bisglycinate, 25 mg every other day with a source of vitamin C (orange juice, berries, peppers). Why: ferritin at 29.7 is below the optimal of 40 and may be contributing to fatigue and cold intolerance. Every other day dosing improves absorption. If the GP confirms low copper, a copper-containing supplement should be added before or alongside iron, as copper is needed for iron metabolism.\nDo not take high-dose zinc supplements without ensuring copper intake. Her zinc at 12.8 is already adequate, and zinc competes with copper for absorption; additional zinc without copper could worsen the copper deficit.\nMyo-inositol 2 g twice daily (morning and evening) may be worth discussing with her GP. Inositol is well-evidenced for PCOS, improving insulin sensitivity, ovarian function and androgen levels, but given the ZnT8 finding and the need for GP involvement in the metabolic picture, it is best introduced as part of that conversation rather than independently.\nThe most important changes from this report are not supplements. They are adding vegetables and protein to every meal, reducing sugary food, walking after meals, and starting resistance training twice a week. These address the insulin resistance that drives the PCOS, the weight, the irregular periods and the fatigue.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 60.7; held to 49 by two or more systems rated \"See your GP\". Weakest systems: hormones 21%, immunology 25%, electrolytes & minerals 31%. Biggest drags: Bicarbonate, Testosterone, HOMA-IR, Soluble IL-6 Receptor (sIL-6R).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"21.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3100","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is a biological age score calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. Her PhenoAge of 21.7 against a calendar age of 30 means her blood markers age her 8.3 years younger than she is. This is an excellent result, driven by the low hsCRP (0.65), healthy albumin (45.5), good kidney function (creatinine 69.9), and controlled MCV and RDW. RDW was assumed at 13% by the pipeline as Randox does not always report it separately; it was reported at 13.3%, so the estimate is very close. The metabolic improvements recommended in this report should maintain or even improve this biological age advantage.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built, not the ten-year chance of an event. Her score of 10 out of 100 is ideal, reflecting the clean lipid profile, excellent Lp(a), low hsCRP and controlled HbA1c. This is the foundation on which to build: the insulin resistance, if left unaddressed, could erode these numbers over time, but right now her cardiovascular markers are in excellent shape.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"136.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"115","upper_normal":"165","lower_optimal":"125","upper_optimal":"155","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"g/l","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. Her level of 136 is solidly within the ideal range, meaning her blood is carrying oxygen efficiently. This is reassuring given her symptoms of fatigue and cold extremities, because it confirms that anaemia is not the cause.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders, heavy menstrual bleeding","high_causes":"Dehydration, smoking, living at altitude, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"42.700","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5233","lower_normal":"37","upper_normal":"47","lower_optimal":"38","upper_optimal":"45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"%","description":"Haematocrit measures the proportion of blood that is made up of red blood cells. Her level of 42.7% is within the ideal range, confirming good red blood cell production and hydration.","low_causes":"Anaemia, overhydration, nutritional deficiency, chronic disease","high_causes":"Dehydration, smoking, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin (MCH)","group":"HEMATOLOGY","result":"28.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4533","lower_normal":"27","upper_normal":"32","lower_optimal":"28.5","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6000","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. Her level of 28.8 is within the laboratory range but towards the lower end. This is consistent with her borderline-low ferritin of 29.7; as iron stores dip, each red blood cell carries slightly less haemoglobin. Building ved in fighting parasites and in allergic responses. Her count of 0.22 is within the ideal range and does not suggest allergic or parasitic activity.","low_causes":"Steroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infection, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytecount","name":"Lymphocyte Count","group":"HEMATOLOGY","result":"2.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5560","lower_normal":"1","upper_normal":"3.5","lower_optimal":"1.5","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"10^9/l","description":"Lymphocytes are the white blood cells that drive the adaptive immune response, producing antibodies and mounting targeted defences against infections. Her count of 2.67 is within the ideal range, confirming healthy immune function.","low_causes":"Viral infection, autoimmune disease, steroid use, chronic stress, undernutrition","high_causes":"Acute infection, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytecount","name":"Monocyte Count","group":"HEMATOLOGY","result":"0.80","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"0.2","upper_normal":"0.8","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"10^9/l","description":"Monocytes are white blood cells that engulf pathogens and dead cells and help orchestrate the immune response. Her count of 0.80 sits exactly at the upper limit of the laboratory range. This is not above range but is at the top, and monocytes at this level can reflect low-grade immune stimulation, which is consistent with the elevated soluble receptor markers and Th w disorders, autoimmune disease, medications, undernutrition","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plateletcount","name":"Platelet Count","group":"HEMATOLOGY","result":"282","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"150","upper_normal":"450","lower_optimal":"180","upper_optimal":"370","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5778","units":"10^9/l","description":"Platelets are the cell fragments responsible for blood clotting. Her count of 282 is within the ideal range, confirming normal clotting function.","low_causes":"Viral infection, autoimmune disease, bone marrow disorders, medications, alcohol","high_causes":"Iron deficiency, infection, inflammation, post-surgery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width (RDW)","group":"SPECIALIZED TESTS","result":"13.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4867","lower_normal":"11","upper_normal":"16","lower_optimal":"11.5","upper_optimal":"14.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"%","description":"RDW measures the variation in size of red blood cells. A narrow RDW means cells are consistently sized, which is healthy. Her level of 13.3% is within the ideal range, confirming uniform red blood cell production.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gad65","name":"Glutamic Acid Decarboxylase 65 (GAD65)","group":"SPECIALIZED TESTS","result":"11.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0849","lower_normal":"0","upper_normal":"67.7","lower_o pper_optimal_position":"1.0000","units":"mmol/l","description":"HDL cholesterol carries cholesterol away from the artery walls and back to the liver for disposal, which is why it is considered protective. Her level of 1.65 is above the optimal threshold of 1.6 for women, which is a genuinely good result, particularly at a BMI of 28.1 where HDL is often suppressed. Her high step count of 10,000 to 15,000 a day is likely contributing to this.","low_causes":"Sedentary lifestyle, obesity, insulin resistance, smoking, poor diet","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"totalcholesterolhdlchole","name":"Total Cholesterol / HDL Cholesterol Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2690","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"%","description":"This ratio compares total cholesterol to protective HDL cholesterol. A lower number is better. Her ratio of 2.69 is well within the ideal range and reflects the combination of a reasonable total cholesterol and a strong HDL.","low_causes":"","high_causes":"High total cholesterol, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2826","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2174","units":"mmol/l","description":"Triglycerides are fats carried in the blood, largely determined by recent carbohydrate and sugar intake and by insulin sensitivity. Her level of 1.30 is within the laboratory range but above the optimal threshold of 1.0. In the context of her insulin resistance (HOMA-IR 2.26), this is expected: when cells resist insulin, the liver produces more triglyceride-rich particles. This will improve as insulin sensitivity improves through dietary changes and resistance training.","low_causes":"Low-fat diet, hyperthyroidism, malnutrition","high_causes":"High-sugar or high-carbohydrate diet, insulin resistance, obesity, alcohol, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteinai","name":"Apolipoprotein A-I","group":"LIPIDS & CARDIOVASCULAR","result":"178.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5440","lower_normal":"101","upper_normal":"223","lower_optimal":"140","upper_optimal":"210","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4399","upper_optimal_position":"0.6311","units":"mg/dl","description":"Apolipoprotein A-I is the main structural protein of HDL particles. A higher level means more HDL particles removing cholesterol from artery walls. Her level of 178.1 is within the ideal range and reflects a healthy HDL system.","low_causes":"Sedentary lifestyle, obesity, insulin resistance, smoking","high_causes":"Regular exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3540","lower_normal":"53","upper_normal":"182","lower_optimal":"53","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4031","units":"mg/dl","description":"Apolipoprotein B (ApoB) is the single protein on each LDL, VLDL and Lp(a) particle, so the ApoB level is effectively a count of all the particles that can deposit cholesterol in artery walls. It is considered a better predictor of cardiovascular risk than LDL alone. Her level of 61 mg/dL is well within the optimal band and is an excellent result.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High-fat diet, genetic predisposition, hypothyroidism, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinbairatio","name":"Apolipoprotein B / A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1889","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"","description":"This ratio compares the number of harmful cholesterol-carrying particles (ApoB) to the number of protective particles (ApoA-I). A lower number is better. Her ratio of 0.34 is well below the 0.6 threshold for women and reflects an excellent balance between atherogenic and protective lipoproteins.","low_causes":"","high_causes":"Elevated LDL or triglycerides, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteincii","name":"Apolipoprotein CII","group":"LIPIDS & CARDIOVASCULAR","result":"3.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4210","lower_normal":"1.68","upper_normal":"9.17","lower_optimal":"2.5","upper_optimal":"6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3698","upper_optimal_position":"0.5256","units":"mg/dl","description":"Apolipoprotein CII is a cofactor for the enzyme that breaks down triglycerides in the blood. Her level of 3.65 is within the laboratory range. It functions as part of the normal triglyceride clearance system.","low_causes":"Genetic deficiency, severe liver disease","high_causes":"Hypertriglyceridaemia, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinciii","name":"Apolipoprotein CIII","group":"LIPIDS & CARDIOVASCULAR","result":"9.52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4573","lower_normal":"4.5","upper_normal":"18","lower_optimal":"4.5","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4691","units":"mg/dl","description":"Apolipoprotein CIII inhibits the clearance of triglyceride-rich particles, so higher levels tend to keep triglycerides elevated for longer. Her level of 9.52 is within the laboratory range and near the top of the optimal zone. In the context of triglycerides at 1.30, this is consistent but not concerning.","low_causes":"Genetic factors","high_causes":"Insulin resistance, metabolic syndrome, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteine","name":"Apolipoprotein E","group":"LIPIDS & CARDIOVASCULAR","result":"3.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4438","lower_normal":"2.2","upper_normal":"7.3","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3529","upper_optimal_position":"0.5490","units":"mg/dl","description":"Apolipoprotein E is involved in clearing triglyceride-rich particles from the blood and plays a role in cholesterol metabolism. Her level of 3.89 is within the ideal range.","low_causes":"","high_causes":"Hypertriglyceridaemia, type III hyperlipoproteinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"smallldlcholesterol","name":"Small LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"22.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1826","lower_normal":"0","upper_normal":"60.8","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.00 _position":"0.3333","upper_optimal_position":"0.4222","units":"umol/l","description":"Homocysteine is an amino acid produced during protein metabolism. When elevated, it is associated with increased cardiovascular risk and impaired methylation, the biochemical process that supports DNA repair, detoxification and neurotransmitter production. Her level of 10.0 is within the laboratory range but above the optimal threshold of 9. B12 and folate are the two key nutrients that clear homocysteine, and her B12 at 388 is below optimal. Optimising B12 should bring homocysteine under 9.","low_causes":"","high_causes":"Low B12, low folate, MTHFR gene variants, hypothyroidism, kidney disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High Sensitivity C-Reactive Protein (hsCRP)","group":"INFLAMMATION","result":"0.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3250","lower_normal":"0","upper_normal":"1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"mg/l","description":"hsCRP is the most widely used marker of systemic inflammation. The liver produces CRP in response to inflammatory signals from anywhere in the body. Her level of 0.65 is within the ideal range of below 1.0, and at a BMI of 28.1 with insulin resistance and PCOS, this is genuinely impressive. It means the systemic inflammation that often accompanies metabolic disease is well controlled, even though the more granular cytokine markers show low-grade immune activation beneath the surface.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aso","name":"Antistreptolysin O (ASO)","group":"INFLAMMATION","result":"117.4","within_normal":"TRUE","within_optimal":"TRUE","result_position" 89","upper_optimal":"1.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5133","units":"pg/ml","description":"IL-15 supports the survival and function of natural killer cells and memory T cells, both of which are critical for long-term immune defence. Her level of 0.68 is below the lower limit of 0.89. In isolation this is not alarming, but it is consistent with the broader immune picture in this report, where the Th17 pathway (IL-17F, IL-22) is overactive and other immune resources may be deprioritised. No specific action is needed for this finding alone, but it adds context to the overall immune profile.","low_causes":"Immune resource reallocation, chronic immune activation, undernutrition","high_causes":"Autoimmune disease, coeliac disease, chronic infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sil2ra","name":"Soluble IL-2 Receptor a (sIL-2Ra)","group":"INFLAMMATION","result":"0.22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5789","lower_normal":"0","upper_normal":"0.19","lower_optimal":"0","upper_optimal":"0.15","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3947","units":"ng/ml","description":"Soluble IL-2 receptor alpha is shed from activated T cells and is a marker of T cell activation. Her level of 0.22 is above the upper limit of 0.19, indicating that T cells are more active than expected. This is part of the broader low-grade immune activation pattern in this report and is consistent with the PCOS immune phenotype and the gut-related Th17 activity.","low_causes":"","high_causes":"T cell activation, autoimmune disease, chronic infection, lymphoma, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sil6r","name":"Soluble IL-6 Receptor (sIL-6R)","group":"INFLAMMATION","result":"5.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7280","lower_normal":"0","upper_normal":"3.53","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4249","units":"ng/ml","description":"Soluble IL-6 receptor circulates in the blood and can amplify the inflammatory signal of IL-6, a process called trans-signalling. Her level of 5.14 is above the upper limit of 3.53. Elevated sIL-6R can extend the reach of IL-6 signalling to tissues that do not normally respond to it, contributing to chronic low-grade inflammation. This is consistent with the broader cytokine pattern and the PCOS-related immune activation seen in this report.","low_causes":"","high_causes":"Chronic inflammation, autoimmune disease, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"solubletumournecrosisfacI","name":"Soluble Tumour Necrosis Factor Receptor I","group":"INFLAMMATION","result":"0.64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"0.14","upper_normal":"0.54","lower_optimal":"0.14","upper_optimal":"0.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5917","units":"ng/ml","description":"Soluble TNF receptor I is shed from cell surfaces during inflammation and reflects the activity of tumour necrosis factor, one of the body's key inflammatory signalling molecules. Her level of 0.64 is above the upper limit of 0.54, indicating ongoing TNF-pathway activation. This is part of the low-grade immune activation pattern that sits beneath her excellent hsCRP.","low_causes":"","high_causes":"Chronic inflammation, autoimmune disease, infection, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"solubletumournecrosisfacII","name":"Soluble Tumour Necrosis Factor Receptor II","group":"INFLAMMATION","
