group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"1.55","upper_normal":"3.1","lower_optimal":"1.6","upper_optimal":"3.1","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5161","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective cholesterol particle that removes excess cholesterol from arteries and returns it to the liver for disposal. Higher HDL is associated with lower cardiovascular risk. Her HDL at 1.5 is just below the 1.6 optimal target for women. In combination with her excellent triglycerides it still supports a favourable metabolic profile, but ideally it would sit slightly higher to improve the ApoB to ApoA1 ratio.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, high refined carbohydrate diet","high_causes":"Regular exercise, moderate alcohol, genetic factors, oestrogen","padding":"1","one_sided":"","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2265","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats in the blood that the body uses for energy. Elevated triglycerides are a marker of metabolic syndrome and cardiovascular risk. Her triglycerides at 0.77 are excellent, well within the optimal range, and reflect the positive effect of her Mediterranean diet, regular exercise and no alcohol. This is one of the strongest metabolic markers in the report.","low_causes":"Very low-fat diet, malnutrition, hyperthyroidism","high_causes":"High sugar and refined carbohydrate diet, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2244","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) is produced by the liver and carries triglycerides. It is a precursor to LDL. Her VLDL at 0.35 is within the optimal range, consistent with the excellent triglycerides and confirming that the liver is not overproducing triglyceride-rich particles.","low_causes":"","high_causes":"High sugar diet, alcohol, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-damaging) cholesterol fractions in one number: LDL, VLDL and intermediate-density lipoproteins. Her non-HDL at 4.8 is above the 4.0 target, driven by the elevated LDL. This metric reinforces the ApoB finding and confirms the need for intervention.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Diet, genetic factors, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio gives a quick snapshot of the balance between harmful and protective cholesterol. A lower ratio is better. Her ratio at 4.2 is within the laboratory range but above the optimal ceiling of 3.5, reflecting the elevated total cholesterol relative to the HDL of 1.5.","low_causes":"","high_causes":"Elevated LDL, low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"23.81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5952","lower_normal":"20","upper_normal":"50","lower_optimal":"28","upper_optimal":"50","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7000","upper_optimal_position":"1.0000","units":"%","description":"HDL as a percentage of total cholesterol tells us how much of the circulating cholesterol is protective. Her 23.81% is above the 20% minimum but below the 28% optimal. This is driven by the high total cholesterol denominator rather than a low HDL; as LDL comes down, this percentage will rise naturally.","low_causes":"High LDL, low HDL","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB (apolipoprotein B) is a protein present on every LDL, VLDL and Lp(a) particle. The ApoB count is the single best measure of atherogenic particle number, more predictive of cardiovascular events than LDL cholesterol alone. Her ApoB at 1.31 is classified as 'High' by the laboratory (above 1.2), and well above the 0.9 desirable threshold and the 0.8 optimal target. Each ApoB particle is capable of entering the artery wall and contributing to plaque. With her family history of premature cardiovascular disease, reducing this number is the top clinical priority.","low_causes":"Hyperthyroidism, malnutrition, genetic factors","high_causes":"Diet high in saturated fat, genetic predisposition, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5179","lower_normal":"1.4","upper_normal":"2.9","lower_optimal":"1.4","upper_optimal":"2.9","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5000","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 (apolipoprotein A1) is the main protein on HDL particles and drives their ability to remove cholesterol from arteries. Higher levels are protective. Her ApoA1 at 1.45 is just above the 1.4 normal threshold, which is consistent with her HDL of 1.5. While it is adequate, a higher ApoA1 would improve the ApoB to ApoA1 ratio.","low_causes":"Sedentary lifestyle, smoking, insulin resistance, genetic factors","high_causes":"Regular exercise, moderate alcohol, oestrogen, genetic factors","padding":"1","one_sided":"","range_type":"no upper"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic particles (ApoB) to protective particles (ApoA1). It is one of the strongest predictors of cardiovascular risk. A ratio below 0.6 is lower risk, 0.6 to 0.8 is average, and above 0.8 is higher risk. Her ratio at 0.90 is in the higher-risk band, driven by the elevated ApoB of 1.31. Reducing ApoB, whether through diet, supplements or medication, will bring this ratio down.","low_causes":"","high_causes":"High ApoB, low ApoA1, elevated LDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lp(a) (lipoprotein a) is a genetically determined variant of LDL that deposits cholesterol, promotes clotting and drives inflammation in artery walls. It cannot be changed by diet, exercise or standard medications. Her Lp(a) below 25 is ideal, and this is genuinely useful information because it means the elevated LDL and ApoB are driven entirely by modifiable factors: diet, metabolic state and, if chosen, medication.","low_causes":"","high_causes":"Inherited (genetic)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1700","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"","description":"The triglyceride to HDL ratio is a simple marker of metabolic health and insulin resistance. A lower ratio indicates better metabolic function. Her ratio at 0.51 is well within the optimal range of below 0.9, reflecting the excellent triglycerides and adequate HDL. This is one of the strongest metabolic positives in the report.","low_causes":"","high_causes":"Elevated triglycerides, low HDL, insulin resistance, high sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried by triglyceride-rich remnant particles (total cholesterol minus HDL minus LDL). These particles are atherogenic and contribute to cardiovascular risk independently of LDL. Her remnant cholesterol at 0.30 is within the optimal range, consistent with the excellent triglyceride level.","low_causes":"","high_causes":"Insulin resistance, obesity, high triglycerides, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"4.42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7367","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL subtracts the cholesterol contribution from Lp(a) particles, showing how much of the LDL is conventional and modifiable. Her Lp(a)-corrected LDL at 4.42 is barely different from the total LDL of 4.5, because her Lp(a) is ideal at below 25. This confirms that essentially all of her LDL is modifiable through diet, lifestyle and, if needed, medication.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5289","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The atherogenic index of plasma is calculated from the logarithm of triglycerides divided by HDL and predicts the size of LDL particles and cardiovascular risk. A negative value indicates predominantly large, buoyant (less dangerous) LDL particles. Her index at minus 0.29 is within the optimal range, which is one of the protective features of her metabolic profile and reflects the excellent triglycerides and adequate HDL.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4286","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The LDL to HDL ratio (Castelli II index) compares the atherogenic LDL to the protective HDL. Her ratio at 3.0 is within the reference range but above the 2.5 optimal ceiling, reflecting the elevated LDL. As LDL comes down with intervention, this ratio will improve.","low_causes":"","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It reflects how well the body manages blood sugar in the resting state. Her glucose at 5.5 is within the laboratory range but above the 5.4 optimal ceiling. In the context of her HbA1c at 41 and HOMA-IR at 1.67, this marginal elevation is consistent with early insulin resistance and is one of the numbers to watch on her retest.","low_causes":"Fasting, excessive insulin, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, medications","padding":"1","one_sided":"","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4500","units":"%","description":"HbA1c measured as a percentage. The lab reports a normal range of below 6.0%, with 6.0 to 6.4% classified as pre-diabetes. Her result of 6.0% sits right at the boundary. See the mmol/mol entry below for the full clinical interpretation.","low_causes":"","high_causes":"Sustained elevated blood sugar, insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4881","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has glucose attached to it. Because red blood cells live for about three months, HbA1c gives an average blood sugar picture over that period. Below 42 mmol/mol is normal, 42 to 47 is classified as pre-diabetes, and above 48 as diabetes. Her HbA1c at 41 mmol/mol sits one unit below the pre-diabetic threshold. Her previous test, as she reported it, showed 42, so if anything the direction of travel is favourable, though the margin is small enough to be within normal variation. Combined with the fasting glucose of 5.5 and HOMA-IR of 1.67, this confirms early insulin resistance that has not yet progressed to pre-diabetes, but given her family history of type 2 diabetes, continued monitoring is important.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Sustained high blood sugar, insulin resistance, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"6.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3964","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing in the resting state. Elevated fasting insulin is one of the earliest signs of insulin resistance, often appearing years before glucose or HbA1c rise. Her insulin at 6.82 is within the optimal band of 2 to 8, which is reassuring and tells us the pancreas is not having to overwork to maintain glucose control. The insulin itself is not the problem; the issue is that, combined with a glucose of 5.5, the HOMA-IR calculation shows the tissues are beginning to resist insulin's action slightly.","low_causes":"Low-carbohydrate diet, very high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, PCOS, excess carbohydrate intake","padding":"1","one_sided":"","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3596","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-peptide is released in equal amounts to insulin when the pancreas produces it, making it a reliable measure of how much insulin the pancreas is actually making (unlike insulin itself, which can be affected by liver clearance). Her C-peptide at 1.36 micrograms per litre (approximately 450 pmol/L) is within the optimal range, confirming the pancreas is producing a normal and appropriate amount of insulin. This is a positive finding in the context of the family history of diabetes.","low_causes":"Type 1 diabetes, low-carbohydrate diet, very lean body composition","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.67","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7233","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated by multiplying fasting insulin by fasting glucose and dividing by a constant. It estimates how resistant the body's cells are to insulin's action. Below 1.0 is optimal (insulin-sensitive), above 1.5 suggests early resistance, and above 1.9 is considered insulin resistant. Her HOMA-IR at 1.67 is above the 1.5 upper limit, indicating early insulin resistance. The lab notes that above 1.9 indicates early resistance, and she is not yet at that level, but the finding is consistent with her borderline HbA1c and slightly elevated glucose. The glucose of 5.5 is the input driving this above range.","low_causes":"High insulin sensitivity, low-carbohydrate diet, fasting","high_causes":"Insulin resistance, pre-diabetes, obesity, sedentary lifestyle, high sugar diet, genetic predisposition","padding":"1","one_sided":"","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4857","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from the HbA1c and represents the average blood glucose over the past two to three months. Her estimated average glucose at 6.8 is within the reference range but above the 6.2 optimal ceiling, consistent with the borderline HbA1c finding.","low_causes":"Low HbA1c, haemolytic conditions","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4619","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index (triglyceride-glucose index) is an alternative marker of insulin resistance calculated from fasting triglycerides and glucose. Her TyG index at 8.13 is within the optimal range, which is consistent with her excellent triglycerides keeping this index healthy even as the HOMA-IR shows early resistance from the glucose side.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1000","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/l","description":"hs-CRP (high-sensitivity C-reactive protein) is a marker of systemic inflammation produced by the liver. In the context of cardiovascular risk, a level below 1.0 is considered low risk, 1.0 to 3.0 is moderate risk, and above 3.0 is higher risk. Her hs-CRP at 1.0 sits right at the upper boundary of the optimal band. It is not alarming, but in the context of elevated ApoB and a family history of cardiovascular disease, even low-grade inflammation contributes to arterial plaque formation. Reducing insulin resistance and the omega-3 supplementation she already takes may help edge this below 1.0.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, insulin resistance, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{ _position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance, acid-base status and electrical neutrality. Her chloride at 93 is two points below the 95 lower limit, moving in step with the mildly low sodium and consistent with the dilutional pattern. Kidney function is excellent and bicarbonate at 28.1 is normal, so there is no acid-base disturbance.","low_causes":"Excess water intake, vomiting, SIADH, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"28.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5788","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6061","units":"mmol/l","description":"Bicarbonate is the body's main acid buffer, maintaining blood pH within the narrow range needed for cellular function. Her bicarbonate at 28.1 is within the optimal range, confirming normal acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4795","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.5789","units":"mmol/l","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling and blood clotting. Her calcium at 2.33 is within the optimal range, e":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5632","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions, including energy production, muscle contraction, nerve function and blood sugar regulation. Her magnesium at 0.93 is within the optimal range of 0.85 to 1.05. Adequate magnesium supports insulin sensitivity, which is particularly relevant given the early insulin resistance seen in this panel.","low_causes":"Alcohol, diuretics, poor diet, malabsorption, diabetes","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"249","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4107","lower_normal":"184","upper_normal":"464","lower_optimal":"184","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4952","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced naturally by the body. Elevated levels are associated with gout and cardiovascular risk. Her uric acid at 249 is within the optimal range for women.","low_causes":"Low purine diet, liver disease, some medications","high_causes":"High purine diet, kidney disease, gout, metabolic syndrome, alcohol","padding":"1","one_sided":"","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"132","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the measured sodium for the effect of blood glucose on fluid shifts. In this case, the corrected value of 132 is unchanged from the measured sodium because her glucose at 5.5 is not elevated enough to cause a significant shift. This is reported for context.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"273.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3117","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Serum osmolality measures the concentration of dissolved particles in the blood, including sodium, glucose and urea. Her calculated osmolality at 273.7 is just below the 275 lower limit, consistent with the mildly low sodium and chloride. This confirms the dilutional pattern and is most likely a reflection of good hydration rather than a sodium-handling disorder.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units": stimated glomerular filtration rate) from creatinine estimates how well the kidneys are filtering waste. Above 90 is considered normal. Her eGFR is reported as above 90, consistent with healthy kidney function. The Cystatin C eGFR of 109 provides a more precise figure.","low_causes":"Kidney disease, dehydration, ageing","high_causes":"High muscle mass, pregnancy (early), high cardiac output","padding":"1","one_sided":"","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3682","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not influenced by muscle mass, diet or exercise, making it a more accurate marker of kidney function, particularly in lean individuals. Her Cystatin C at 0.81 is within the optimal range and confirms excellent kidney filtration.","low_causes":"","high_causes":"Kidney disease, thyroid dysfunction, inflammation, high BMI","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"109","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9083","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and Cystatin C to give the most accurate estimate of kidney filtration. Her combined eGFR at 109 is well within the optimal range and confirms excellent kidney function function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
