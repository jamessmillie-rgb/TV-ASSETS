<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Margaret Ryan","dob":"21/09/1965","report_date":"2026-11-03","summary":"Customer is a 61-year-old female presenting with a BMI of 22.4, following a Mediterranean diet, eating 6+ portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are about average (volume 5 out of 10). She trains 7 times per week (3 cardio, 4 resistance) at moderate intensity with 10,000 to 15,000 daily steps. She sleeps 6 to 7 hours and wakes feeling refreshed, with steady energy through the day. Stress feels hard to manage some weeks. She does not drink alcohol. She supplements with a multivitamin, creatine and omega-3 fish oil. She has a family history of heart attack or stroke before 60 and type 2 diabetes across multiple family members. A previous blood test flagged results. She reports headaches that have always been present. Her goal is to improve long-term health and longevity, and she has provided detailed context: her LDL recently rose to 4.4 and her HbA1c reached the border of pre-diabetic levels at 42, which surprised her given her lifestyle. She has since added soluble fibre and plant sterols to her diet and wants to know whether those changes have moved the needle. She is pragmatic about medication if needed but prefers to minimise it where possible.\n\nBefore addressing the lipid and blood sugar questions that brought her here, there is a great deal of genuinely good news in this panel. Her PhenoAge, a composite biological age score built from nine blood markers including albumin, glucose, CRP, lymphocyte percentage, MCV and white cell count, comes in at 46.3 against a calendar age of 61. That is nearly fifteen years younger than her chronological age, and it is one of the widest favourable gaps we see. It reflects the cumulative effect of the exercise, diet and lifestyle she has built over years. Her liver is in excellent health: ALT at 14 and Gamma GT at 20 are both well within the ideal range, and the APRI score (a marker of liver scarring) at 0.227 confirms there is no fibrotic change at all. Her FIB-4 score at 1.48 is technically one tick above the 1.45 cut-off, but that score is calculated using age as a multiplier, and at 61 with pristine liver enzymes, a clean GGT and a normal APRI, the number is being driven by the formula rather than by any sign of liver disease; the lab note itself confirms that a score below 2 can be insignificant in the absence of other clinical indicators. Her kidney function is excellent, with Cystatin C at 0.81 giving a Cystatin C eGFR of 109 and a combined eGFR of 109, exactly where it should be. Her thyroid is working well: TSH at 2.82, free T4 at 17.2 and free T3 at 5.8, with both sets of thyroid antibodies negative, meaning there is no autoimmune thyroid process. The FT3 to FT4 ratio of 0.337 confirms good conversion of the storage hormone to its active form. Her triglycerides at 0.77 are genuinely excellent and, combined with her HDL of 1.5, give a triglyceride to HDL ratio of 0.51, which is well within the ideal range and tells us her metabolic machinery is handling dietary fat efficiently. Her atherogenic index of plasma at minus 0.29 is firmly in the protective range. CA125 at 7.2, CA19-9 at 32.42 and CEA below 0.5 are all reassuringly within range. Rheumatoid factor at 4 and coeliac screening negative provide further reassurance. Her CK at 78 is healthy for someone training four resistance sessions a week. Her hormonal profile is consistent with post-menopausal status, with FSH at 59.14, LH at 42.41, oestradiol below 43 and progesterone at 0.56, all where they should be. Testosterone at 1.1, free androgen index at 1.62 and bioavailable testosterone at 0.29 are all within range for a post-menopausal woman. DHEA-S at 2.4 micromol per litre is well preserved for her age. Cortisol at 429 is within the morning reference range. Her urine is clean, with no protein, no glucose, no nitrites, no casts, no significant bacteria, and red blood cells below 1.\n\nNow to the two findings she came here to check. Her LDL has risen from the 4.4 she reported previously to 4.5 on this test, with total cholesterol at 6.3, non-HDL cholesterol at 4.8 and, most importantly, ApoB at 1.31. ApoB, or apolipoprotein B, is a protein carried by every LDL particle, and the ApoB count is a more accurate measure of cardiovascular risk than LDL cholesterol alone because it tells us how many atherogenic particles are circulating rather than how much cholesterol they carry. At 1.31 she is well above the 0.9 desirable threshold and above the 1.2 level the laboratory classifies as high. Her ApoB to ApoA1 ratio (the ratio of atherogenic to protective particles) is 0.90, which is in the higher-risk band above 0.8. Her Cardiovascular Risk Score, a composite index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, comes in at 50 out of 100, above the 40 threshold for concern. That score has no age term; it measures the risk being built in the arteries right now, independent of how soon it might cause an event. Given her strong family history of heart attack and stroke before 60, this is the finding in the report that matters most. The one genuinely good piece of news within the lipid panel is her Lp(a). Lipoprotein(a) is an inherited particle that deposits cholesterol, encourages clotting and promotes inflammation in artery walls, and it cannot be changed by diet or exercise. Hers is below 25, which is ideal and means the entirety of her elevated LDL and ApoB is driven by modifiable factors: diet, metabolism and, if needed, medication. Her Lp(a)-corrected LDL is 4.42, confirming that almost all the LDL is conventional and responsive to intervention. The soluble fibre and plant sterols she has added are the right first moves, but at an ApoB of 1.31 in the context of a family history of premature cardiovascular disease, lifestyle alone may not close the gap. This is a conversation to have with her GP, because she may benefit from lipid-lowering medication alongside the dietary changes, and her own framing of being willing to take medication when necessary makes that conversation straightforward.\n\nHer HbA1c at 41 mmol/mol (reported by the lab also as 6.0%) sits one unit below the 42 mmol/mol pre-diabetic threshold. Fasting glucose at 5.5 is within the laboratory range but above the optimal ceiling of 5.4. Insulin at 6.82 is within the ideal band of 2 to 8, and C-peptide at 1.36 micrograms per litre (approximately 450 pmol/L) is within range, so the pancreas is producing an appropriate amount of insulin. HOMA-IR, a calculation that estimates insulin resistance by multiplying fasting insulin by fasting glucose and dividing by a constant, comes in at 1.67, above the 1.5 upper limit and above the 1.0 optimal mark. Taken together, these markers tell a consistent story: she is not diabetic, and her pancreas is working well, but there is early insulin resistance that is slowly pushing glucose disposal in the wrong direction. At a BMI of 22.4 with excellent exercise habits, Mediterranean diet and no alcohol, this is not the classic picture of metabolic syndrome. Her family history of type 2 diabetes across multiple family members raises the possibility that she carries a genetic predisposition to insulin resistance that lifestyle is holding at bay but not fully suppressing. The fall from her previous HbA1c of 42 to the current 41 is, on the face of it, a step in the right direction, and suggests the dietary changes may be having an early effect, though the margin is small enough that it could reflect normal day-to-day variation. The estimated average glucose from this HbA1c is 6.8, within range but above the 6.2 optimal ceiling. This does not need medication at this stage, but it needs continued attention and a repeat in six months to confirm the direction of travel.\n\nHer hsCRP at 1.0 is within the laboratory range but sits right at the upper boundary of the optimal band for cardiovascular risk. In the context of elevated ApoB and a family history of cardiovascular disease, it is worth noting because even low-grade systemic inflammation accelerates arterial plaque formation. It is not alarming, and it may simply reflect the mild metabolic strain the insulin resistance is placing on the system.\n\nHer sodium at 132 is one point below the lower limit of 133, and chloride at 93 is two points below the lower limit of 95. Her calculated serum osmolality at 273.7 is just below the 275 lower limit, which is consistent with mild dilution. These are very marginal findings, and the most likely explanation in a healthy, active woman drinking plenty of water and not on any medication is simple hydration status, which may have diluted the electrolytes slightly. Kidney function is excellent, and bicarbonate at 28.1 is normal, so there is no metabolic cause for concern. A routine repeat with her GP would confirm this if they wished.\n\nHer creatinine at 45 is below the laboratory range of 49 to 90, but creatinine is produced by muscle and is commonly low in lean women. Her Cystatin C at 0.81 and the Cystatin C eGFR of 109 confirm that kidney function is genuinely excellent, and the low creatinine reflects her body composition rather than any renal issue.\n\nHer white cell count at 3.44 is below the 4.0 lower limit, and neutrophils at 1.79 are below the 2.0 lower limit. This is a recognised normal variant rather than a sign of immune deficiency. Her lymphocytes at 1.25 are within range, her ESR at 10 is normal, and her immunoglobulins (IgG 13, IgA 3.2, IgM 0.8) are all within range, confirming the immune system is functioning well. The Systemic Immune-Inflammation Index at 362 and Platelet to Lymphocyte Ratio at 202.4 are both within their reference ranges. The low white cell count is a constitutional finding, not a clinical concern.\n\nHer reticulocyte percentage at 0.59 is within range, but the absolute reticulocyte count at 28.4 is below the 50 lower limit. Reticulocytes are young red blood cells released from the bone marrow, and a low absolute count can reflect a slightly slower rate of red cell production. Her haemoglobin at 137 is healthy and her red cell indices (MCV 83.5, MCH 28.4, MCHC 340) are all within range, so there is no anaemia and no clinical consequence. Her red blood count at 4.81 is marginally above the 4.8 upper limit, which at this margin is laboratory variation and consistent with her haemoglobin and haematocrit both being solidly within range. The low absolute reticulocyte count may reflect the same constitutional tendency toward lower cell counts that explains her white cells.\n\nHer ferritin at 32 is within the laboratory range of 10 to 291 but below the optimal floor of 40 for a woman. Iron at 23.7, transferrin saturation at 36.72% and transferrin at 2.57 are all healthy, so iron delivery is fine, but stores are on the lower side. At this level she is unlikely to feel any effect, but building ferritin toward 50 to 80 would provide a more comfortable buffer, particularly given the training load.\n\nHer PTH (parathyroid hormone, the hormone that regulates calcium and phosphate) at 4.89 is marginally above the 4.73 upper limit. Her corrected calcium at 2.31 and phosphate at 1.2 are both within range, and vitamin D at 67 is sufficient but below the 75 optimal threshold. The most likely explanation for the mildly raised PTH is the sub-optimal vitamin D: when vitamin D is below optimal, PTH rises slightly to maintain calcium levels. Raising vitamin D into the 75 to 100 range should bring PTH back within range.\n\nHer vitamin B12 at 1787 is well above the upper limit of 982. She is taking a multivitamin, which almost certainly contains B12, and this is the most likely explanation. B12 is water-soluble and excess is excreted, so there is no toxicity risk, but the level is high enough that it is worth checking whether the multivitamin contains a large B12 dose and considering one without it, since her stores are clearly replete. Folate at 10 is within range and above the optimal floor of 8.\n\nHer total antioxidant activity at 2.06 is above the 1.77 upper limit. This is driven by supplementation, specifically the multivitamin and omega-3, and is not a clinical concern. It simply reflects higher circulating antioxidant capacity from the supplements and her antioxidant-rich Mediterranean diet.\n\nHer urinary white cells at 10 are at the threshold of significance. With negative nitrites, no bacterial growth and no symptoms, this is not indicative of infection.\n\nThe De Ritis ratio (AST to ALT ratio) at 1.64 is marginally above the 1.6 upper limit. When both AST and ALT are low and healthy, as they are here at 23 and 14, a ratio slightly above range is mathematically inevitable and carries no clinical meaning.\n\nThe Castelli II ratio (LDL to HDL) at 3.0 is within the laboratory range but above the 2.5 optimal ceiling, reflecting the elevated LDL rather than any problem with HDL. The NAFLD Fibrosis Score at minus 1.812 rules out significant liver fibrosis.\n\nTo summarise: the two findings that matter are the lipid panel and the early insulin resistance, both set against a strong family history. The lipids need a GP conversation about whether medication should be added to the excellent dietary groundwork she has already laid. The insulin resistance needs continued dietary attention and a six-month retest. Everything else in this panel, from the biological age nearly fifteen years younger than calendar age to the clean liver, strong kidneys, healthy thyroid and well-functioning immune system, reflects the sustained investment she has made in her health.","links":"The two headline findings in this report, the elevated ApoB and LDL alongside the borderline HbA1c and raised HOMA-IR, are not independent. Insulin resistance, even at the mild level seen here, changes how the liver processes lipoproteins. When cells become slightly less responsive to insulin, the liver produces more VLDL particles, and the cascade that converts those into LDL particles becomes less efficient at clearing them. The result is more ApoB-carrying particles circulating for longer. This means the insulin resistance is likely contributing to the lipid elevation, and addressing one may improve the other. The family history of both heart disease and type 2 diabetes across multiple family members suggests a shared genetic susceptibility to this metabolic pattern, which explains why it is appearing despite an exemplary lifestyle.\n\nThe excellent triglycerides, the healthy HDL, the ideal Lp(a) and the protective atherogenic index tell us that the metabolic picture is not uniformly bad. The liver is handling dietary fat well; the problem is specifically with LDL particle count and clearance. The Lp(a) below 25 is particularly important because it confirms that the entire LDL burden is modifiable. If Lp(a) were high, the options would be more limited. As it stands, every particle contributing to the ApoB of 1.31 is responsive to diet, exercise and, if needed, statin therapy.\n\nThe soluble fibre and plant sterols she has introduced are mechanistically sound. Plant sterols block cholesterol absorption in the gut, and soluble fibre binds bile acids, forcing the liver to pull LDL from the blood to make more. Together they typically reduce LDL by 10 to 15 percent. At an LDL of 4.5, a 15 percent reduction would bring it to about 3.8, still above the 3.0 target. This is why the GP conversation about medication matters: lifestyle is doing a great deal, but the arithmetic suggests it may not close the gap alone, especially with the family history adding urgency.\n\nThe mildly low sodium, chloride and osmolality form a coherent pattern of dilution rather than pathology. Kidney function is strong, there is no diuretic or medication effect, and the most parsimonious explanation is hydration status. The low creatinine fits the same picture: a lean woman with good hydration will produce less creatinine and dilute it further.\n\nThe low white cell and neutrophil counts, the low absolute reticulocytes and the marginally above-range red cell count are best understood as constitutional. The immune system is clearly functional, with normal immunoglobulins, a normal ESR and no infections. This is a woman whose bone marrow runs at the lower end of output, not because it is failing but because that is her normal baseline.\n\nThe sub-optimal vitamin D driving the mildly raised PTH is the one loose end that is easily tied up with supplementation. Once vitamin D reaches the 75 to 100 range, the PTH should normalise without any further intervention.","lifestyle":"Continue the soluble fibre you have already added: aim for two to three servings a day from oats, barley, lentils, chickpeas, beans and ground flaxseed, spread across meals rather than all at once. Anchor: add a tablespoon of ground flaxseed to breakfast and include lentils or beans at lunch or dinner. Why: soluble fibre binds bile acids and pulls LDL from the blood, which is directly targeting your ApoB of 1.31.\nContinue the plant sterols at 2 grams a day, taken with your largest meal. Why: plant sterols block cholesterol absorption in the gut and work additively with soluble fibre; together they can reduce LDL by 10 to 15 percent.\nInclude oily fish (salmon, mackerel, sardines) three times a week, replacing one red meat or cheese meal each time. Anchor: designate three fixed days as fish days. Why: omega-3 from whole fish is better absorbed than supplements and helps maintain the excellent triglyceride of 0.77 while supporting the anti-inflammatory environment that protects arteries.\nAdd a small handful of walnuts, almonds or pecans as a daily snack, replacing any biscuit or sweet snack on those 'some days' when sugary food appears. Anchor: keep a bag at your desk or in your training bag. Why: nuts lower LDL and improve the ApoB to ApoA1 ratio, and the swap also helps keep HbA1c steady by reducing sugar spikes.\nAfter your largest meal each day, walk for 15 minutes. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal, which directly addresses your HOMA-IR of 1.67 and protects HbA1c.\nEnsure 25 to 30 grams of protein at every meal, especially breakfast. At 64 kg with your training load, aim for 85 to 100 grams of protein per day (approximately 1.3 to 1.6 grams per kilogram). Your maintenance calories at this activity level are approximately 2,050 to 2,150 per day (BMR of roughly 1,320 multiplied by an activity factor of 1.55 to 1.6). Why: protein supports muscle maintenance, blunts post-meal insulin spikes, and preserves the lean mass that keeps metabolic rate healthy.\nConsider shifting one of your three cardio sessions to a longer, lower-intensity walk or hike on the weekend. Why: the additional low-intensity movement improves insulin sensitivity through a different pathway than moderate-intensity cardio and complements the four resistance sessions you are already doing.\nMaintain your current sleep routine. Six to seven hours with refreshed waking and steady energy is working well. If headaches tend to cluster in the afternoon or evening, track whether they correlate with hydration, screen time or missed meals, as these are the most common triggers in someone whose bloods do not point to an underlying cause.","flags":"ApoB 1.31, well above the 0.9 desirable threshold, with LDL 4.5 (above 3.0), non-HDL cholesterol 4.8 (above 4.0), total cholesterol 6.3 (above 5.18), ApoB/A1 ratio 0.90 (above the 0.6 lower-risk threshold) and Cardiovascular Risk Score 50/100 (above 40). In the context of a strong family history of premature cardiovascular disease, this lipid profile warrants a GP conversation about whether lipid-lowering medication should be added to dietary measures. Lp(a) below 25 confirms the entire burden is modifiable.\nHbA1c 41 mmol/mol (6.0%), one unit below the 42 pre-diabetic threshold, with fasting glucose 5.5 (above the 5.4 optimal), HOMA-IR 1.67 (above the 1.5 upper limit). Early insulin resistance in the context of a family history of type 2 diabetes across multiple family members. Not diabetic, pancreatic function preserved (insulin 6.82, C-peptide 1.36), but the trajectory needs monitoring.\nSodium 132 (below 133), chloride 93 (below 95), calculated serum osmolality 273.7 (below 275). A consistent mild dilutional pattern, most likely reflecting good hydration. Kidney function is excellent. Worth a routine repeat with the GP to confirm.\nWhite cell count 3.44 (below 4.0), neutrophils 1.79 (below 2.0). Constitutional low counts; immune function confirmed by normal immunoglobulins, normal ESR and no infections. Not a clinical concern.\nAbsolute reticulocytes 28.4 (below 50). Haemoglobin 137 is healthy and red cell indices are normal; the low absolute count likely reflects the same constitutional tendency toward lower cell counts seen in the white cells.\nPTH 4.89 (above 4.73) with vitamin D 67 (below the 75 optimal). Mildly raised PTH is most likely driven by sub-optimal vitamin D. Calcium and phosphate are normal.\nFerritin 32 (below the 40 optimal for women). Iron delivery markers are healthy; stores are on the lower side and would benefit from building toward 50 to 80.\nVitamin B12 1787 (above 982). Almost certainly driven by supplementation. No clinical concern but worth reviewing the multivitamin dose.\nCreatinine 45 (below 49). Normal for a lean woman; Cystatin C eGFR 109 confirms excellent kidney function.\nRed blood count 4.81 (marginally above 4.8). At this margin, laboratory variation; haemoglobin and haematocrit are both solidly within range.\nhsCRP 1.0, at the upper boundary of the optimal band for cardiovascular risk. Not alarming but noted in the context of the lipid findings.\nDe Ritis ratio 1.64 (marginally above 1.6). Both AST and ALT are low and healthy; the ratio is an arithmetic artefact of a very low ALT denominator.\nFIB-4 1.48 (marginally above 1.45). Driven by age in the formula; all liver markers are clean, APRI 0.227 and NAFLD Fibrosis Score minus 1.812 both confirm no fibrosis.\nTotal antioxidant activity 2.06 (above 1.77). Supplement and diet driven; not a concern.\nReassuring negatives: liver enzymes clean, kidney function excellent, thyroid normal with negative antibodies, coeliac negative, rheumatoid factor negative, tumour markers (CA125, CA19-9, CEA) all within range, immunoglobulins normal, ESR normal, urine clean, Lp(a) ideal, triglycerides excellent, atherogenic index protective, CK normal.","recommendations":"Discuss the lipid panel with your GP, bringing the ApoB of 1.31, LDL of 4.5, the ApoB/A1 ratio of 0.90 and the family history of heart attack and stroke before 60. Ask whether a statin or other lipid-lowering medication is appropriate alongside the dietary changes you have already made. At a Lp(a) below 25, all of the LDL burden is modifiable.\nDiscuss the HbA1c of 41 mmol/mol and HOMA-IR of 1.67 with your GP in the context of your family history of type 2 diabetes. No medication is needed now, but the GP should be aware of the trajectory and may wish to monitor it.\nAsk your GP to repeat sodium and chloride on a routine blood draw to confirm the mildly low values (132 and 93 respectively) are hydration-related rather than persistent.\nMention the white cell count of 3.44 and neutrophils of 1.79 to your GP so they are recorded as your baseline. If you are unwell and have bloods taken, the GP needs to know your normal starting point is below the standard range.\nReview your multivitamin to check the B12 dose. Your B12 at 1787 is nearly double the upper limit, which is harmless but unnecessary. A multivitamin without B12, or a lower-dose one, would be sufficient.\nStart vitamin D3 supplementation at 2,000 to 3,000 IU daily with a fat-containing meal to bring your level from 67 into the 75 to 100 optimal range, which should also normalise the mildly raised PTH of 4.89.\nRetest in six months with a focused panel: HbA1c, fasting glucose, fasting insulin, HOMA-IR, full lipid panel including ApoB, vitamin D, PTH, ferritin, and a full blood count. This will show whether the dietary changes and any medication have shifted the lipids and confirm the HbA1c direction of travel. Calorie target: approximately 2,050 to 2,150 kcal per day at maintenance; protein target: 85 to 100 grams per day (1.3 to 1.6 g per kg of body weight).","supplementation":"Vitamin D3 (cholecalciferol): 2,000 to 3,000 IU daily, taken with your largest meal (which contains fat for absorption). Why: your vitamin D at 67 is sufficient but below the 75 optimal threshold, and raising it will also bring the mildly elevated PTH of 4.89 back within range.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bones rather than arteries, which is particularly relevant alongside your lipid findings and cardiovascular family history.\nOmega-3 fish oil: continue at 2 to 3 grams of combined EPA and DHA daily. Why: supports the excellent triglyceride of 0.77 and provides anti-inflammatory benefit relevant to the hsCRP of 1.0 and the cardiovascular risk profile.\nMagnesium glycinate: 300 mg before bed. Why: your magnesium at 0.93 is within range but supporting it through supplementation benefits sleep quality, insulin sensitivity and muscle recovery given your training load of seven sessions per week.\nConsider a low-dose iron supplement (ferrous bisglycinate 25 mg) taken every other day with vitamin C, for 8 to 12 weeks, then retest ferritin. Why: ferritin at 32 is below the 40 optimal for women; building stores to 50 to 80 provides a more comfortable buffer for your training volume. Stop if ferritin exceeds 100.\nReview your multivitamin: your B12 at 1787 is nearly double the upper limit, driven by the multivitamin. Consider switching to one without B12, or dropping the multivitamin entirely now that you are supplementing vitamin D, K2, magnesium and omega-3 individually at the right doses.\nDo not take additional B12 supplements. Your stores are more than replete.\nThe most important changes from this report are not supplements. They are the GP conversation about lipid-lowering medication, the continued soluble fibre and plant sterol intake, and the sustained dietary attention to insulin sensitivity.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4545","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 50 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 50.1. Weakest systems: lipids & cardiovascular 14%, vitamins & nutrients 20%, kidney function 30%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Vitamin B12, Creatinine.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"46.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3508","lower_normal":"","upper_normal":"66","lower_optimal":"","upper_optimal":"61","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4621","units":"years","description":"PhenoAge is a composite biological age score built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. It estimates the biological age of the body based on how these markers compare to large population studies. Her PhenoAge is 46.3 against a calendar age of 61, nearly fifteen years younger. This is an exceptional result and reflects the cumulative benefit of her exercise regime, Mediterranean diet, healthy weight and no alcohol. The markers driving this favourable gap include her low CRP (1.0), healthy albumin (43), normal RDW (13.2) and good glucose control.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term: it measures the risk being built in the arteries right now, independent of how soon it might cause an event. A score of 20 or below is ideal, 40 or below is acceptable, and above 40 is flagged. Her score of 50 is above the 40 threshold, driven primarily by the elevated ApoB of 1.31 and LDL of 4.5, with a smaller contribution from the HbA1c of 41 and hsCRP of 1.0. The excellent triglycerides and ideal Lp(a) are holding the score lower than it would otherwise be. Reducing ApoB and LDL through dietary changes and, if needed, medication will bring this score down substantially.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1250","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found mainly in liver cells. When the liver is inflamed or damaged, ALT leaks into the blood, so a rising level can be an early warning of liver strain. Her ALT at 14 is well below the optimal ceiling of 25 and indicates the liver is under no metabolic strain at all. This is a genuinely positive result, particularly in the context of her training volume.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, alcohol, medications, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart and muscles. It rises with liver damage but also after intense exercise. Her AST at 23 is comfortably within the optimal range, confirming healthy liver function alongside the clean ALT.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart injury, intense exercise, alcohol","padding":"1","one_sided":"","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4902","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/l","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol, medications and metabolic strain. It is often the first liver marker to rise when something is stressing the organ. Her GGT at 20 is well within the optimal range and, combined with no alcohol intake, confirms the liver is handling her diet and supplements without any difficulty.","low_causes":"","high_causes":"Alcohol, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4714","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bones and bile ducts. It rises with bile duct obstruction, bone disorders and some liver conditions. Her ALP at 75 is comfortably within the optimal range, which is reassuring in a post-menopausal woman where bone turnover can drive changes.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disorders, Paget's disease, vitamin D deficiency, liver disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position": t is also one of the nine inputs to the PhenoAge calculation, and a healthy albumin contributes to her excellent biological age. Her albumin at 43 is within the optimal range.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5741","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"g/l","description":"Globulin is a group of proteins including antibodies (immunoglobulins) and transport proteins. Her globulin at 31 is within the laboratory range but marginally above the optimal ceiling of 30. This is a trivial margin and consistent with a healthy, active immune system.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, inflammation, autoimmune conditions, liver disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"agratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4024","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio is a simple division of albumin by globulin. It helps assess liver function and immune status. A low ratio can suggest chronic inflammation or liver disease. Her ratio at 1.39 is within the optimal range, reflecting a healthy balance between the two protein types.","low_causes":"Liver disease, autoimmune conditions, chronic infection","high_causes":"Immune deficiency,
