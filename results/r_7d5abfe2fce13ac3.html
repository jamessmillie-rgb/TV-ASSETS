<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Ramon Valvona","dob":"17/01/1970","report_date":"2026-10-02","summary":"Ramon is a 56-year-old male presenting with a BMI of 24.5, following a low-carb, high-protein diet, eating 6+ portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). He trains five times per week (three cardio, two resistance) at hard intensity with 10,000 to 15,000 daily steps. He sleeps 7 to 8 hours and wakes feeling refreshed, with steady energy through the day and stress that rarely feels hard to manage. He drinks 5 to 9 alcoholic drinks per week. He takes no medications and supplements with vitamin D, protein powder, creatine and vitamin B12. His family history includes heart attack or stroke before 60, dementia and thyroid disease. He reports weight gain or difficulty losing weight, low sex drive and joint pain or stiffness, present for months. His goals are to lose body fat, build muscle and balance hormones.\n\nThe finding that needs attention first in this report is the ESR, the erythrocyte sedimentation rate. This is a measure of how quickly red blood cells settle in a tube over one hour, and it rises when the body is inflamed. Ramon's ESR is 50, more than four times the upper limit of 12. This is a significant elevation. Importantly, the high-sensitivity CRP, another inflammation marker that responds more quickly and specifically than ESR, is 2.7, which is above the ideal of 1.0 but well within the laboratory limit of 5. The disconnect between a very high ESR and a modestly raised CRP is clinically meaningful. ESR can be elevated by infection, autoimmune conditions, tissue injury, liver disease and certain blood disorders, but it is also pushed up by anything that increases immunoglobulins, fibrinogen or other large proteins in the blood. Ramon's IgA, one of the three main classes of immunoglobulin (the antibody that guards mucosal surfaces in the gut, airways and urinary tract), is 4.1, above the upper limit of 3.5, while his IgG and IgM are both within range. An isolated IgA elevation can reflect chronic mucosal stimulation from alcohol, gut inflammation, coeliac disease (which has been excluded here by a negative tissue transglutaminase), liver disease (which the liver panel does not support), or, rarely, an IgA-producing disorder. It may also simply be a constitutional finding in some people. The elevated IgA is very likely contributing to the raised ESR, because extra immunoglobulin increases protein concentration in the blood and makes red cells clump and settle faster. The CRP being only modestly raised rather than dramatically high supports the idea that this is not an acute inflammatory crisis, but it does not let us dismiss it either. We would recommend discussing the ESR and IgA with his GP. The GP may want to repeat the ESR alongside a serum protein electrophoresis, which separates proteins by type and can identify whether the IgA elevation has a specific cause, and a repeat CRP to confirm the pattern.\n\nThe second area that deserves careful attention is the lipid panel. Apolipoprotein B, which is the protein that sits on each LDL particle and is the best single measure of how many cholesterol-carrying particles are in the bloodstream, is 1.29, well above the 0.9 target and in the 'high' category. LDL cholesterol is 4.04 against an upper limit of 3.0. Total cholesterol is 5.6. The TC:HDL ratio is 5.09 against a target of below 4.5, and the ApoB:A1 ratio is 0.92, above the higher-risk threshold of 0.9. HDL cholesterol, the protective particle that carries cholesterol away from artery walls, is 1.1, which is above the high-risk cutoff of 1.04 but below the desirable level of 1.55 and well below the optimal of 1.4 for a man. Triglycerides at 1.11 are within the fasting target of 1.7, which is a positive, and VLDL at 0.5 is clean. Remnant cholesterol, the fraction left after subtracting HDL and LDL from total cholesterol, works out to 0.46, which is within the ideal of 0.5. The TG:HDL ratio is 1.01, within range but above the optimal of 0.87. The Lp(a), lipoprotein(a), is below 25, which is normal and genuinely useful information. Lp(a) is entirely inherited and cannot be changed by diet, exercise or medication. Because it is normal, the elevated LDL and ApoB are driven entirely by modifiable factors: diet composition, body weight, HDL metabolism and possibly thyroid-mediated clearance. The Lp(a)-corrected LDL, which strips out the genetic contribution, is 3.96, confirming that virtually all of the excess is lifestyle-driven and therefore fixable. Given the family history of heart attack or stroke before 60, this lipid pattern carries more weight than it would in someone without that history. The cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 70 out of 100. This is high. It does not predict a ten-year event probability, but it measures the amount of risk being built right now, and the three inputs driving it are the ApoB at 1.29, the LDL at 4.04 and the HDL at 1.1. Because Ramon is 56 with a family history, there is less runway to correct this than there would be at 35, and the conversation with his GP should include whether lipid-lowering medication is appropriate alongside the dietary changes below.\n\nTurning to the positives, and there are many. His thyroid is working very well. TSH at 1.32 is right in the ideal zone, free T4 at 17.5 is mid-range and healthy, free T3 at 4.9 is within the optimal band, and both thyroid antibodies are undetectable. Given the family history of thyroid disease, this is reassuring and worth recording as a clean baseline. His liver is in excellent health. GGT at 19 is well below the optimal cutoff of 25, ALT at 27 is within the optimal range for a man, AST at 30 is mid-range, bilirubin at 11 is clean, albumin at 41 is solid, and the FIB-4 score at 1.23, an index that screens for liver scarring, is comfortably below the threshold. At 5 to 9 drinks per week, the liver is handling the alcohol without visible strain. His blood sugar control is excellent. Fasting glucose at 4.8 is within the ideal range, HbA1c at 38, which reflects average blood sugar over the past three months, is below the optimal threshold of 42, and HOMA-IR at 0.59, the index of insulin resistance calculated from fasting glucose and insulin, is right at the bottom of the range, confirming that his cells respond to insulin very efficiently. This is an exceptionally good metabolic profile for a 56-year-old man and it means the low-carb diet and high activity level are doing exactly what they should for blood sugar. His kidney function is adequate. Cystatin C, a more reliable marker of kidney filtration than creatinine in lean active men because it is not affected by muscle mass, is 0.99, giving a cystatin C-based eGFR of 81. The combined creatinine-cystatin C eGFR is also 81. This is within the laboratory range of above 60 but below the optimal of 90, and at 56 it sits at the lower end of where we would expect. Creatinine at 101 is near the top of range at 104 and is partly driven by muscle mass and creatine supplementation, so the cystatin C is the better guide here. The urea:creatinine ratio at 64.4 is healthy. There is no protein in the urine and no casts, which is reassuring. We would recommend the GP keeps an eye on kidney function at future tests to confirm it remains stable. Uric acid at 419 is within the laboratory range but above the optimal of 380 for a man. Uric acid is the end product of purine metabolism, and higher levels are associated with gout risk and cardiovascular strain. The low-carb diet may be contributing, as ketone bodies compete with uric acid for excretion by the kidneys. It is not high enough to need medication but is worth watching. His prostate screen is clean. PSA at 1.06 is well below the 3.5 threshold, and the free PSA ratio at 0.226, which is above 0.19, is normal and reassuring. His calcium and bone metabolism are balanced. Corrected calcium at 2.38 is mid-range, phosphate at 1.1 is healthy, and parathyroid hormone at 4.4, the hormone that regulates calcium by pulling it from bone when levels drop, is within range though towards the upper end. Magnesium at 0.87 is within the optimal band. Creatine kinase at 220 is within range and consistent with regular hard training. The tumour markers CA19-9 and CEA are both well within range. Rheumatoid factor is negative, which, alongside the joint stiffness Ramon reports, makes rheumatoid arthritis unlikely as the cause. The urinalysis is clean across the board.\n\nRamon's insulin at 2.78 is just inside the lower limit of 2.6, and his C-peptide at 0.907 is below the lower limit of 1.1. C-peptide is a fragment released in equal measure to insulin when the pancreas produces it, so it reflects how much insulin the pancreas is making. At first glance, low insulin and low C-peptide could suggest the pancreas is underperforming, but the context here is critical. His fasting glucose is 4.8, his HbA1c is 38 and his HOMA-IR is 0.59. These three results confirm that his blood sugar is perfectly controlled with very little insulin. On a low-carb diet with high activity and excellent insulin sensitivity, the pancreas simply does not need to produce much insulin, and a low C-peptide in this setting reflects low demand rather than failing supply. HOMA-B, the index of beta-cell function calculated as (20 times insulin) divided by (glucose minus 3.5), works out to 42.8, which is below the standard range of 80 to 200, but this must be read in the same context. The denominator is small because glucose is low, and the numerator is small because insulin demand is low. If glucose were creeping up while insulin stayed low, that would be a concern, but glucose at 4.8 and HbA1c at 38 rule that out entirely. This is a pancreas producing exactly as much insulin as the body needs.\n\nRamon's testosterone at 12 is at the very floor of the laboratory range of 8.4 to 28.7, and is the level the lab annotates as 'recommended level of >12'. For a 56-year-old man reporting low libido and difficulty losing weight, this is below optimal. Free testosterone, the fraction not bound to proteins and available to act on tissues, is 0.229, within range but at the lower end. Bioavailable testosterone, which includes both free testosterone and the portion loosely bound to albumin, is 5.12, within the optimal band of 4 to 9 but in the lower half. SHBG at 37 is mid-range, so the low total testosterone is not being caused by excessive binding. DHEA-sulphate at 2 is within range but towards the lower end; DHEA is the precursor hormone from the adrenal glands that declines steadily with age. LH at 3.19 and FSH at 8.87 are both within range, which means the pituitary is not shouting at the testes to produce more, suggesting the brain's thermostat has accepted this lower level as normal. Oestradiol at 94 is within range, and progesterone below 0.21 is below the male reference range of 0.89 to 3.88, though in men progesterone is produced in small amounts and a low level is common and rarely clinically significant. The testosterone picture is one where everything is technically within range but the total sits right at the threshold, and the symptoms of low libido and difficulty losing body fat are consistent with a testosterone that is adequate on paper but not optimal in practice. This is worth discussing with the GP. A morning repeat of total and free testosterone, ideally taken before 10am when levels peak, would confirm whether this is a consistent pattern, and the GP can then decide whether further investigation or a trial of intervention is warranted.\n\nRamon's red blood cell count at 4.4 is marginally below the lower limit of 4.5, and his absolute reticulocyte count at 43.56 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count suggests the marrow is producing red cells at a slightly reduced rate. His haemoglobin at 139 is within range, haematocrit at 0.405 is just inside range, MCV at 92 is healthy, and iron studies show plenty of raw material: ferritin at 337 is above the upper limit of 322, serum iron at 21.2 is healthy, and transferrin saturation at 41.79% is within range though approaching the upper optimal of 40%. Transferrin, the protein that carries iron in the blood, is 2.02, just below the lower limit of 2.15. Transferrin is a negative acute phase reactant, meaning it falls when inflammation is present, so the modestly raised ESR and CRP may be suppressing it. However, the combination of elevated ferritin, low transferrin and a saturation above 40% can also be seen in hereditary haemochromatosis, a genetic condition where the body absorbs too much iron. The ferritin at 337 is only marginally above the male upper limit of 322 and could reflect the inflammation, the high dietary iron intake from a high-protein diet, or a genuine iron-loading tendency. We would recommend the GP requests an HFE gene test, which is a simple blood test that identifies the two most common mutations responsible for haemochromatosis. If negative, the mildly elevated ferritin can be attributed to inflammation and diet. If positive, it changes monitoring and management for life. In the meantime, Ramon should not take iron supplements.\n\nRamon's vitamin D at 64 is sufficient by NHS standards (above 50) but below the optimal of 75. Given that he already supplements with vitamin D, the dose may need increasing. His B12 at 317 is within the laboratory range but below the optimal of 500, which is slightly surprising given he supplements with B12. The form and dose may not be adequate, and switching to sublingual methylcobalamin at 1,000 micrograms daily should bring this into the optimal zone. Folate at 10 is within range and above the optimal floor of 8, reflecting the excellent vegetable intake. His cortisol at 574 is within the morning reference range of 145 to 619, sitting towards the upper end. This is consistent with a morning blood draw and is not a concern.\n\nRamon's total antioxidant activity at 2.07 is above the upper limit of 1.77. This marker measures the overall antioxidant capacity of the blood and is commonly elevated by supplementation, high fruit and vegetable intake, and certain polyphenol-rich foods. Given Ramon's 6+ portions of vegetables and fruit daily, this is the likely explanation and is not a concern.\n\nHis PhenoAge, a composite biological ageing score built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 54.5 against a calendar age of 56, meaning his blood markers suggest he is ageing one and a half years younger than his birth certificate. The markers holding this score down are his excellent glucose, healthy albumin and clean white cell count. The CRP at 2.7 is the main factor pulling it up; bringing CRP below 1.0 through the lipid and inflammation interventions would push PhenoAge further in the right direction.\n\nPulling the whole picture together, Ramon is a fit, active 56-year-old eating an excellent diet, with superb blood sugar control, a clean liver, a healthy thyroid and a prostate screen that gives no cause for concern. The areas that need action are the cardiovascular lipid profile, which carries extra weight given the family history and is entirely modifiable; the raised ESR and IgA, which need investigation to establish the cause; the borderline testosterone, which may explain the low libido and weight difficulty; the iron studies pattern, which needs a gene test to exclude haemochromatosis; and the kidney function, which is adequate but worth monitoring. His progesterone below range is a common finding in men and is not clinically significant.","links":"The thread that ties this report together runs through three separate stories, each with its own explanation and its own action.\n\nThe first is the inflammatory signal. The ESR at 50 is the headline, but it does not stand alone. The IgA at 4.1, above the upper limit of 3.5, is the most likely amplifier. Immunoglobulins are large proteins, and when their concentration rises, red blood cells aggregate more readily and settle faster, inflating the ESR out of proportion to the actual degree of tissue inflammation. The CRP at 2.7 confirms there is some low-grade inflammation but not the acute, dramatic kind that would match an ESR of 50. The transferrin at 2.02, marginally below range, and the ferritin at 337, marginally above range, both behave as expected in the presence of inflammation: transferrin falls as a negative acute phase reactant, and ferritin rises as a positive one. So the iron studies may be partly a downstream effect of whatever is driving the ESR and IgA, rather than a separate problem. That said, the transferrin saturation at 41.79% is at the upper edge, and haemochromatosis must be excluded with a gene test before attributing everything to inflammation. If the HFE test is negative, the iron picture simplifies to an inflammatory artefact. If it is positive, the iron story becomes its own thread.\n\nThe second story is the cardiovascular risk profile. ApoB at 1.29, LDL at 4.04, HDL at 1.1 and a cardiovascular risk score of 70 out of 100 paint a picture of significant atherogenic exposure. The positive is that the Lp(a) is normal, which means none of this is genetically fixed and all of it responds to intervention. The low-carb diet is delivering exceptional insulin sensitivity and blood sugar control, but it may be contributing to the LDL elevation, as low-carb diets can raise LDL in some people by increasing hepatic cholesterol production. The HDL at 1.1 is the weakest link in the lipid panel and the lever with the most room to move: it responds to aerobic exercise, moderate alcohol (which Ramon already has), omega-3 fatty acids and, if needed, medication. The family history of heart attack or stroke before 60 makes this the most consequential set of findings in the report.\n\nThe third story is the hormonal picture. Testosterone at 12, sitting on the floor of the range, with low libido and difficulty losing weight, is consistent but not dramatic. The pituitary hormones LH and FSH are not elevated, which means the brain is not recognising a deficit, and this pattern is typical of the gradual age-related decline in the hypothalamic-pituitary-gonadal axis. It is not a crisis, but it is the most plausible explanation for two of the three symptoms Ramon reports. The third symptom, joint pain and stiffness, is harder to pin down. Rheumatoid factor is negative, ruling out rheumatoid arthritis. The ESR is elevated, which can accompany inflammatory joint conditions, but the CRP is only modestly raised. The joint symptoms could be mechanical (wear and tear at 56 with hard training), could relate to the low-grade inflammation the ESR is picking up, or could have an entirely separate cause. If the joint stiffness persists after the ESR has been investigated and addressed, the GP may want to consider imaging or a rheumatology opinion.\n\nWhat was excluded and why it matters: thyroid disease has been ruled out cleanly despite the family history, which is valuable baseline data. Coeliac disease is negative. Diabetes is emphatically excluded. Liver disease is excluded. Prostate pathology is excluded. Kidney function is adequate though not optimal, and monitoring rather than investigation is appropriate at this stage. The blood count is broadly healthy, with the marginal red cell count and low reticulocytes most likely reflecting the inflammatory environment rather than a primary marrow problem.","lifestyle":"Add 400 to 500 calories of healthy fats and complex carbohydrates to your current intake. Your diet quality is excellent but the volume at 5 out of 10 with hard training five days a week means you may be under-fuelling, which can suppress testosterone production and red cell turnover. Anchor: add a handful of nuts, half an avocado or a portion of oats to one meal each day. Why: adequate energy availability supports the testosterone at 12 and the reticulocyte count at 43.56.\nIntroduce two to three portions of oily fish per week (salmon, mackerel, sardines) or supplement with 2 to 3 grams of EPA and DHA daily. Anchor: replace one red meat meal and one other protein source with oily fish each week. Why: omega-3 fatty acids raise HDL (currently 1.1, below optimal), lower triglycerides and reduce inflammation (CRP 2.7, ESR 50), and this is the single dietary change most likely to improve the cardiovascular risk score of 70.\nAdd 10 grams of soluble fibre daily from oats, flaxseed, beans, lentils or psyllium husk. Anchor: one tablespoon of ground flaxseed on breakfast and one portion of beans or lentils at lunch or dinner. Why: soluble fibre binds bile acids in the gut, forcing the liver to pull LDL cholesterol from the blood to make more, directly lowering the ApoB at 1.29 and LDL at 4.04.\nReduce saturated fat by swapping butter and coconut oil for olive oil, and choosing leaner cuts of meat two to three times per week. Anchor: when cooking at home, reach for olive oil first. Why: on a low-carb diet, saturated fat intake is often high and is a key driver of LDL particle number in people whose genetics respond to it.\nKeep alcohol to 7 or fewer drinks per week and aim for 3 to 4 alcohol-free days. Anchor: choose your drinking days at the start of each week rather than deciding in the moment. Why: the liver is handling current intake well (GGT 19), but reducing alcohol supports HDL metabolism, lowers inflammation and may help the IgA at 4.1.\nMaintain the current training schedule but ensure two full rest days per week with adequate sleep and protein around sessions. Anchor: protein shake or meal within 90 minutes of resistance training. Why: recovery supports testosterone production and muscle protein synthesis at a training intensity rated as hard.\nCalorie target: approximately 2,400 to 2,600 kcal per day to maintain weight and support training, or 2,100 to 2,300 kcal for gradual fat loss of 0.25 to 0.5 kg per week. Protein target: 110 to 135 grams per day (1.4 to 1.7 g per kg of body weight at 81 kg lean mass estimate). Current weight 84 kg at 185 cm gives a healthy BMI of 24.5; a realistic target if aiming to lose body fat while preserving muscle is 80 to 82 kg, achieved slowly over three to four months.","flags":"ESR 50, more than four times the upper limit of 12. IgA 4.1, above the upper limit of 3.5. These two findings are likely connected: elevated immunoglobulin increases ESR. The CRP at 2.7 is above the ideal of 1.0 but within the laboratory limit, suggesting low-grade rather than acute inflammation. Recommend serum protein electrophoresis and repeat ESR and CRP to characterise the IgA elevation and confirm the inflammatory pattern.\nApoB 1.29 (target below 0.9), LDL 4.04 (target below 3.0), total cholesterol 5.6 (target below 5.18), HDL 1.1 (below desirable 1.55), TC:HDL ratio 5.09 (target below 4.5), ApoB:A1 ratio 0.92 (above higher-risk threshold of 0.9), cardiovascular risk score 70 out of 100. Lp(a) below 25 confirms the entire lipid burden is modifiable. Family history of heart attack or stroke before 60 increases the clinical significance. GP should assess whether lipid-lowering medication is appropriate alongside dietary intervention.\nFerritin 337 (above male upper limit of 322), transferrin 2.02 (below lower limit of 2.15), transferrin saturation 41.79% (upper edge of range). This pattern warrants an HFE gene test to exclude hereditary haemochromatosis. If negative, the findings are consistent with the inflammatory signal.\nTestosterone 12, at the floor of the range (8.4 to 28.7), with symptoms of low libido and difficulty losing weight. LH 3.19 and FSH 8.87 within range. Recommend morning repeat of total and free testosterone before 10am to confirm the pattern.\nRed blood cell count 4.4 (below lower limit of 4.5), absolute reticulocytes 43.56 (below lower limit of 50). Haemoglobin 139 is within range. Most likely reflects the inflammatory environment suppressing erythropoiesis mildly rather than a primary marrow disorder. Will clarify when ESR and IgA are investigated.\nC-peptide 0.907 ug/L (below lower limit of 1.1), insulin 2.78 (just above lower limit of 2.6). In the context of fasting glucose 4.8, HbA1c 38 and HOMA-IR 0.59, this reflects low insulin demand on a low-carb diet rather than pancreatic insufficiency. No action required.\nVitamin D 64 (sufficient but below optimal of 75). Already supplementing; dose increase recommended.\nB12 317 (within range but below optimal of 500). Already supplementing; form and dose review recommended.\nProgesterone below 0.21 (below male range 0.89 to 3.88). Common finding in men, not clinically significant in isolation.\nTotal antioxidant activity 2.07 (above upper limit of 1.77). Consistent with high fruit and vegetable intake and supplementation. Not a concern.\nReassuring negatives: thyroid function excellent with negative antibodies despite family history of thyroid disease; coeliac screen negative; fasting glucose, HbA1c and HOMA-IR all optimal, excluding diabetes and insulin resistance; liver function and FIB-4 clean, excluding liver disease; PSA 1.06 with normal free ratio, excluding prostate pathology; rheumatoid factor negative; IgE normal; tumour markers CA19-9 and CEA normal; urinalysis clean; cortisol within morning range.","recommendations":"Discuss the ESR of 50 and IgA of 4.1 with the GP. Request a serum protein electrophoresis to characterise the IgA elevation, and a repeat ESR and CRP in four to six weeks to confirm whether the pattern is persistent.\nRequest an HFE gene test to exclude hereditary haemochromatosis, given the ferritin at 337, transferrin at 2.02 and saturation at 41.79%.\nDiscuss the lipid profile with the GP, bringing the ApoB of 1.29, LDL of 4.04, HDL of 1.1, cardiovascular risk score of 70 and the family history of premature cardiovascular disease. Ask whether a statin or other lipid-lowering therapy is appropriate alongside dietary changes, and whether a coronary artery calcium score would help risk-stratify.\nRequest a morning testosterone (total and free, taken before 10am after fasting) to confirm whether the total of 12 is a consistent finding, and discuss whether further investigation or a trial of testosterone support is warranted given the symptoms of low libido and difficulty losing body fat.\nMonitor kidney function at the next test. The combined eGFR of 81 is adequate but below optimal at 56, and a stable trend over two readings would be reassuring.\nRetest in four to six months with the following markers: ESR, CRP, IgA, full lipid panel including ApoB, ferritin, transferrin, transferrin saturation, total and free testosterone (morning), kidney function (creatinine, cystatin C), vitamin D and B12. Calorie target for gradual fat loss: 2,100 to 2,300 kcal per day. Protein target: 110 to 135 grams per day. Weight target: 80 to 82 kg over three to four months.","supplementation":"DO NOT take iron supplements. Ferritin is 337, above the upper limit, and transferrin saturation is 41.79%. Until the HFE gene test result is known, additional iron could worsen a potential iron-loading condition.\nVitamin D3 (cholecalciferol): increase to 3,000 to 4,000 IU daily, taken with a meal containing fat. Current level is 64; the target is 75 to 100. Always pair with vitamin K2 (MK-7) at 100 to 200 micrograms daily, which directs calcium into bone rather than arteries.\nVitamin B12: switch to sublingual methylcobalamin, 1,000 micrograms daily, dissolved under the tongue rather than swallowed. Current level is 317; the target is above 500. Sublingual delivery bypasses the gut and is more reliably absorbed.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This is the most evidence-based supplement for raising HDL (currently 1.1), lowering triglycerides and reducing the low-grade inflammation behind the CRP of 2.7 and ESR of 50.\nMagnesium glycinate: 300 to 400 mg before bed. Magnesium is currently 0.87, within the optimal band, but at this training volume and intensity, supplementation supports muscle recovery, sleep quality and cardiovascular function.\nContinue creatine monohydrate at 3 to 5 grams daily. It supports the resistance training goals and may mildly elevate creatinine on blood tests, which is why cystatin C is the better kidney marker for Ramon.\nContinue protein powder to help meet the 110 to 135 gram daily target, ideally within 90 minutes of resistance training.\nThe most important changes from this report are not supplements. They are adding soluble fibre and oily fish to reduce ApoB and raise HDL, ensuring adequate calorie intake to support testosterone production and red cell turnover, and getting the GP investigations done for the ESR, IgA and iron pattern.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5273","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 58 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 57.9. Weakest systems: lipids & cardiovascular 20%, inflammation 28%, immunology 34%. Biggest drags: LDL Cholesterol, Apolipoprotein B, hs-CRP, Ferritin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"52.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4320","lower_normal":"","upper_normal":"61","lower_optimal":"","upper_optimal":"56","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4590","units":"years","description":"PhenoAge is a biological ageing score calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Ramon's PhenoAge is 54.5 against a calendar age of 56, meaning his blood markers suggest he is ageing one and a half years younger than his chronological age. The markers keeping this score favourable are the excellent glucose, healthy albumin and clean white cell count. The CRP at 2.7 is the main factor pulling it upward. Note: fasting glucose was not returned by the laboratory, so the estimated average glucose from HbA1c (5.6 mmol/L) was used in its place.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8750","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the amount of cardiovascular risk being built right now, not a ten-year event probability. Ramon's score at 70 is high, driven by ApoB at 1.29, LDL at 4.04 and HDL at 1.1. With a family history of premature cardiovascular disease and a normal Lp(a), this entire score is modifiable through diet, lifestyle and, if needed, medication.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2411","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT is an enzyme found mainly inside liver cells. When the liver is healthy these cells hold onto their ALT, so a low blood level means minimal liver-cell turnover. Ramon's ALT at 27 is within the optimal range of below 30 for a man, confirming the liver is under no significant metabolic strain.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, alcohol, medications, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5312","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6146","units":"IU/l","description":"AST is an enzyme found in the liver, heart and muscles. It rises with liver damage, but also after intense exercise. Ramon's AST at 30 is mid-range and within the optimal band, consistent with a healthy liver and regular hard training.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, intense exercise, alcohol","padding":"1","one_sided":"","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1301","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4299","units":"IU/l","description":"GGT is one of the most sensitive liver enzymes and rises early with alcohol use, fatty liver and bile duct problems. Ramon's GGT at 19 is well within the optimal cutoff of 25, meaning the liver is metabolising alcohol and dietary fat efficiently despite 5 to 9 drinks per week.","low_causes":"","high_causes":"Alcohol consumption, fatty liver, bile duct obstruction, medications, obesity","padding":"1","one_sided":"","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP is an enzyme found in the liver and bones. It rises with bile duct problems, bone turnover and some medications. Ramon's ALP at 70 is mid-range and healthy, with no suggestion of liver or bone pathology.","low_causes":"Zinc deficiency, malnutrition","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_ c capacity and adequate protein intake.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5926","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"g/l","description":"Globulin is the protein fraction that includes immunoglobulins (antibodies) and transport proteins. Ramon's globulin at 32 is within the laboratory range but above the optimal of 30, consistent with the elevated IgA at 4.1 contributing extra immunoglobulin to the total.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic inflammation, infection, immune activation, liver disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"ratio","description":"The A/G ratio compares albumin to globulin and reflects the balance between liver production and immune activity. Ramon's ratio at 1.28 is within the laboratory range but just below the optimal of 1.3, pulled down slightly by the elevated globulin from the raised IgA.","low_causes":"Liver disease, chronic inflammation, immune disorders","high_causes":"Immune deficiency","padding":"1","one_sided":"","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3409","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6129","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands to break down starch. Ramon's amylase at 36 is at the lower end of the range, consistent with a low-carb diet where less starch digestion is needed. The pancreas is healthy.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction","padding":"1","one_sided":"","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5390","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"53","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6178","units":"U/L","description":"Lipase is a pancreatic enzyme that digests dietary fat. It is the most specific marker for pancreatic inflammation. Ramon's lipase at 42 is mid-range and healthy, confirming the pancreas is functioning well.","low_causes":"","high_causes":"Acute pancreatitis, chronic pancreatitis, gallstones, bowel obstruction","padding":"1","one_sided":"","range_type":"normal"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"1.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2303","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2434","units":"score","description":"FIB-4 is a fibrosis screening index calculated from age, AST, ALT and platelet count. It estimates the likelihood of liver
