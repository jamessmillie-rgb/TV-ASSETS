ational"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5406","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol fractions in the blood: LDL, HDL and VLDL. Ramon's total cholesterol at 5.6 is above the desirable target of 5.18. On its own, total cholesterol is a blunt instrument; the breakdown into LDL, HDL and ApoB tells the real story, and in Ramon's case, the elevation is driven by LDL at 4.04.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, obesity, low-carb diets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8080","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL cholesterol is the fraction most strongly associated with plaque formation in arteries. Each LDL particle carries one ApoB protein, so LDL and ApoB track together. Ramon's LDL at 4.04 is well above the target of 3.0 and the optimal of 2.6. With a normal Lp(a), this excess is entirely modifiable through diet, lifestyle and, if needed, medication.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic predisposition, low-carb diets, hypothyroidism, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3542","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"2.2","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL is the protective cholesterol fraction. HDL particles collect excess cholesterol from artery walls and return it to the liver for disposal, a process called reverse cholesterol transport. Ramon's HDL at 1.1 is above the high-risk cutoff of 1.04 but well below the optimal of 1.4 for a man. Raising HDL through oily fish, omega-3 supplementation and sustained aerobic exercise is one of the most impactful changes in this report.","low_causes":"Sedentary lifestyle, smoking, obesity, high-carb diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetic factors, omega-3 intake","padding":"1","one_sided":"","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3265","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat in the blood, rising after meals and with high carbohydrate or alcohol intake. Ramon's triglycerides at 1.11 are within the fasting target of below 1.7 but above the optimal of 1.0. This is a good result on a low-carb diet and suggests dietary fat metabolism is working well.","low_causes":"Malnutrition, hyperthyroidism, very low-fat diet","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3205","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL is the lipoprotein that carries triglycerides from the liver into the bloodstream. It is a precursor to LDL. Ramon's VLDL at 0.5 is within the optimal range, confirming that the liver is not overproducing triglyceride-rich particles.","low_causes":"","high_causes":"High carbohydrate diet, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5625","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL. It captures all the atherogenic (artery-damaging) particles in one number, including LDL, VLDL and remnant cholesterol. Ramon's non-HDL at 4.5 is above the target of 4.0, driven primarily by the elevated LDL.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Diet high in saturated fat, genetic predisposition, low-carb diets, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5656","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"ratio","description":"The TC:HDL ratio is a traditional cardiovascular risk metric. It divides total cholesterol by HDL, so a high total or a low HDL both push it up. Ramon's ratio at 5.09 is above the target of 4.5, driven by both the elevated LDL and the below-optimal HDL. It will improve as both are addressed.","low_causes":"","high_causes":"High LDL, low HDL, high triglycerides","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"19.64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4910","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5625","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a proportion of total cholesterol. Ideally, at least 20% of total cholesterol should be HDL. Ramon's percentage at 19.64 is just below the 20% cutoff, reflecting both the elevated total cholesterol and the below-optimal HDL. Raising HDL and lowering LDL will both improve this metric.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.29","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single best measure of cardiovascular risk from cholesterol. Every LDL particle carries exactly one ApoB molecule, so the ApoB level counts the number of atherogenic particles in the blood. Ramon's ApoB at 1.29 is classified as 'high', well above the desirable target of below 0.9 and the optimal of below 0.8. With a normal Lp(a), the entire particle load is modifiable. Given the family history of premature cardiovascular disease, bringing ApoB below 0.9 is a priority.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic predisposition, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.5","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles. Higher levels mean more HDL particles are circulating to remove cholesterol from arteries. Ramon's ApoA1 at 1.4 is above the minimum of 1.2 but below the optimal of 1.5, tracking with the below-optimal HDL cholesterol. Exercise, omega-3 and moderate alcohol intake support ApoA1 production.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic factors, omega-3 intake","padding":"1","one_sided":"","range_type":"no upper"},{"key":"aporatio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6571","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"ratio","description":"The ApoB:A1 ratio is the single best summary of the balance between atherogenic (artery-damaging) and protective particles. Below 0.7 is lower risk; above 0.9 is higher risk. Ramon's ratio at 0.92 is in the higher-risk category, driven by the high ApoB (too many LDL particles) and the below-optimal ApoA1 (not enough HDL particles). Both sides of this ratio are modifiable.","low_causes":"","high_causes":"High ApoB, low ApoA1, poor lipid profile","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein (a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lp(a) is a genetically determined lipoprotein that accelerates plaque formation, encourages blood clotting and drives inflammation in artery walls. It cannot be changed by diet, exercise or standard medication. Ramon's Lp(a) at below 25 is normal, which is genuinely useful information: it means the elevated LDL and ApoB are driven entirely by modifiable factors rather than a genetic risk that cannot be removed.","low_causes":"","high_causes":"Entirely inherited, cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2875","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried by triglyceride-rich remnant particles, calculated as total cholesterol minus HDL minus LDL. These remnants are highly atherogenic because they penetrate artery walls more easily than LDL. Ramon's remnant cholesterol at 0.46 is within the optimal range of below 0.5, which is a positive finding and consistent with the good triglyceride control.","low_causes":"","high_causes":"High triglycerides, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.01","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3367","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3","units":"ratio","description":"The TG:HDL ratio is a proxy for insulin resistance and small dense LDL particles. A low ratio means triglycerides are well controlled relative to HDL. Ramon's ratio at 1.01 is within the laboratory range but above the optimal of 0.9, pulled up by the below-optimal HDL. Raising HDL will bring this into the ideal zone.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"3.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6600","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL removes the small cholesterol contribution from Lp(a) particles, showing only the LDL that responds to diet, exercise and statins. Ramon's corrected LDL at 3.96 is virtually identical to the uncorrected 4.04, confirming that the Lp(a) contribution is negligible and the entire LDL burden is modifiable.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"0.004","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6099","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The Atherogenic Index of Plasma is calculated from the logarithm of triglycerides divided by HDL and predicts the size of LDL particles. A lower value suggests larger, less dangerous LDL particles. Ramon's AIP at 0.004 is within the optimal band, which is a positive finding and suggests that despite the elevated LDL particle count, the particles are predominantly the larger subtype.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"3.67","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5243","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The Castelli II index divides LDL by HDL. It reflects the balance between atherogenic and protective cholesterol. Ramon's ratio at 3.67 is above the target of 3.5, driven by the elevated LDL and below-optimal HDL. Both inputs are modifiable.","low_causes":"","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the sugar in the blood after an overnight fast. It reflects how well the body maintains blood sugar between meals. Ramon's glucose at 4.8 is within the optimal range, confirming excellent blood sugar control.","low_causes":"Fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, infection, medications","padding":"1","one_sided":"","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar over the past two to three months. Ramon's HbA1c at 5.6% is within the normal range (below 6.0%) and well clear of the pre-diabetic threshold of 6.0%.","low_causes":"Anaemia, blood loss, haemolysis","high_causes":"Pre-diabetes, diabetes, insulin resistance, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international IFCC units. Ramon's HbA1c at 38 is within the normal range of below 42 and above the optimal cutoff of 36. For a 56-year-old man, this is a healthy result and is consistent with the excellent fasting glucose and HOMA-IR. Given the family history of type 2 diabetes, maintaining this level through diet and exercise is particularly valuable.","low_causes":"Anaemia, blood loss, haemolysis","high_causes":"Pre-diabetes, diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3374","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3153","upper_optimal_position":"0.4784","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas produces to maintain blood sugar overnight. Ramon's insulin at 2.78 is at the lower end of the laboratory range and within the optimal band of 2 to 8. On a low-carb diet with high activity and excellent insulin sensitivity, the body simply does not need much insulin to keep glucose in check. This is an excellent result.","low_causes":"Low-carb diet, high insulin sensitivity, very lean body composition, type 1 diabetes (in context of high glucose)","high_causes":"Insulin resistance, pre-diabetes, obesity, high carbohydrate intake, metabolic syndrome","padding":"1","one_sided":"","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.907","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2423","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/l","description":"C-peptide is a fragment released by the pancreas in a one-to-one ratio with insulin. It measures actual pancreatic insulin production more accurately than insulin itself low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"2.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2700","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP is a protein produced by the liver in response to inflammation anywhere in the body. It is also a cardiovascular risk marker, with levels above 1.0 associated with increased arterial inflammation. Ramon's hs-CRP at 2.7 is within the laboratory limit of 5 but well above the optimal of 1.0. It is contributing to the cardiovascular risk score and is consistent with the elevated ESR, suggesting an ongoing low-grade inflammatory process.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, cardiovascular risk, autoimmune conditions, injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"2.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2917","units":"mm/hour","description":"The erythrocyte sedimentation rate measures how quickly red blood cells settle in a test tube over one hour. It rises with inflammation, infection, autoimmune conditions and elevated blood proteins. Ramon's ESR at 50 is more than four times the upper limit of 12, which is a significant elevation. The most likely amplifier is the elevated IgA at 4.1, because high immunoglobulin levels cause red cells to clump and settle faster. The CRP at 2.7, while above ideal, is not dramatically high, which suggests the ESR is being disproportionately inflated by the protein effect rather than reflecting severe systemic inflammation. This warrants GP investigation.","low_causes":"Polycythaemia, sickle cell disease, extreme leucocytosis","high_causes":"Infection, autoimmune disease, malignancy, elevated immunoglobulins, anaemia, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"206.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6584","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet-to-lymphocyte ratio is a marker of systemic inflammation. It is calculated by dividing platelet count by lymphocyte count. Ramon's PLR at 206.3 is within the laboratory range but above the optimal of 160, driven by the lymphocytes at the lower end of their range at 1.27. It is consistent with the mildly inflammatory picture seen in the ESR and CRP.","low_causes":"","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"499","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5993","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The SII combines neutrophils, platelets and lymphocytes into a single inflammation metric (neutrophils times platelets divided by lymphocytes). Ramon's SII at 499 is within the laboratory range but above the optimal of 450, consistent with the mildly inflammatory pattern seen across the ESR, CRP and PLR.","low_causes":"","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"139","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"142","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5641","units":"mmol/l","description":"Sodium is the main electrolyte in the blood, controlling fluid balance and nerve function. Ramon's sodium at 139 is within the optimal band, confirming healthy hydration and electrolyte balance.","low_causes":"Overhydration, diuretics, heart failure, kidney disease, SIADH","high_causes":"Dehydration, diabetes insipidus, excessive salt intake","padding":"1","one_sided":"","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5926","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5370","units":"mmol/l","description":"Potassium is essential for heart rhythm and muscle contraction. Ramon's potassium at 4.9 is within the laboratory range but above the optimal of 4.6. The lab notes that potassium can rise in delayed or unseparated samples, so a degree of sample artefact is possible. In the absence of kidney disease or medication that raises potassium, this is not clinically concerning.","low_causes":"Diuretics, vomiting, diarrhoea, low dietary intake","high_causes":"Kidney disease, ACE inhibitors, sample delay, potassium supplements, acidosis","padding":"1","one_sided":"","range_type":"normal"},{"key":"chloride","name ium within a very tight range through parathyroid hormone and vitamin D. Ramon's calcium at 2.35 is within the optimal band.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess, dehydration","padding":"1","one_sided":"","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate reading of how much calcium is biologically active. Ramon's corrected calcium at 2.38 is within the optimal band and confirms healthy calcium metabolism.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess","padding":"1","one_sided":"","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4598","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.6092","units":"mmol/l","description":"Phosphate works with calcium in bone health and energy metabolism. Ramon's phosphate at 1.1 is within the optimal band, confirming healthy mineral balance.","low_causes":"Vitamin D deficiency, hyperparathyroidism, refeeding, antacids","high_causes":"Kidney disease, hypoparathyroidism, vitamin D excess","padding":"1","one_sided":"","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4368","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions including muscle contraction, nerve function, energy production and heart rhythm. Ramon's magnesium at 0.87 is within the optimal band, which is a good result at his training volume.","low_causes":"Alcohol, diuretics, poor diet, malabsorption, intense exercise","high_causes":"Kidney disease, excessive supplementation","padding":"1","one_sided":"","range_type":"normal"},{"key":"aniongap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"19.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6600","lower_normal":"10","upper_normal":"20","lower_optimal":"10","upper_optimal":"18","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"mmol/l","description":"The anion gap is calculated from sodium, potassium, chloride and bicarbonate. It reflects unmeasured anions in the blood and can identify metabolic acidosis. Ramon's anion gap at 19.8 is within the laboratory range but at the upper edge and above the optimal of 18. On a low-carb diet, mild ketone production can raise the anion gap slightly. This is not a concern in the context of normal bicarbonate and healthy glucose control.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Ketoacidosis, lactic acidosis, renal failure, toxin ingestion","padding":"1","one_sided":"","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"419","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5381","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5776","units":"umol/l","description":"Uric acid is the end product of purine metabolism. High levels can crystallise in joints (gout) and are associated with cardiovascular risk and kidney strain. Ramon's uric acid at 419 is within the laboratory range but above the optimal of 380 for a man. The low-carb diet may contribute, as ketone bodies compete with uric acid for excretion by the kidneys. Adequate hydration and limiting purine-rich foods (organ meats, shellfish) can help keep it in check.","low_causes":"Low purine diet, kidney clearance, medication","high_causes":"High purine diet, alcohol, ketogenic diet, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"139","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-Corrected Sodium is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"289.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5717","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Calculated Serum Osmolality is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumincorrectedaniongap","name":"Albumin-Corrected Anion Gap","group":"ELECTROLYTES & MINERALS","result":"19.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"The albumin-corrected anion gap adjusts for the effect of albumin on unmeasured anions. With albumin at 41, close to the standard reference of 40, the correction is negligible, and the corrected value at 19.8 matches the uncalculated gap. This is reported for context.","low_causes":"Low albumin, laboratory error","high_causes":"Dietary acid load, reduced kidney clearance, ketosis, dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6200","units":"mmol/l","description":"Urea is a waste product from protein metabolism, cleared by the kidneys. On a high-protein diet, urea tends to be higher because the body is processing more amino acids. Ramon's urea at 6.5 is within the optimal band, confirming the kidneys are handling the protein load well.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, high protein diet, dehydration, gastrointestinal bleeding","padding":"1","one_sided":"","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"101","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6410","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5897","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, cleared at a constant rate by the kidneys. It is used to estimate kidney filtration. Ramon's creatinine at 101 is within the laboratory range but above the optimal of 95. In an active man taking creatine supplements, creatinine is expected to be higher because creatine is metabolised to creatinine. This makes cystatin C the more reliable marker of kidney function for Ramon.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, high muscle mass, creatine supplementation, dehydration, high protein diet","padding":"1","one_sided":"","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"71","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5917","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR estimated from creatinine provides a measure of kidney filtration rate. Ramon's creatinine-based eGFR at 71 is within the laboratory range of above 60 but below the optimal of 90. This is likely overestimating any reduction in kidney function because creatine supplementation raises creatinine artificially. The cystatin C-based eGFR at 81 is a better reflection of true kidney function.","low_causes":"Kidney disease, dehydration, heart failure","high_causes":"Hyperfiltration, pregnancy, high cardiac output","padding":"1","one_sided":"","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4545","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass or creatine supplements, making it the more accurate kidney marker for active men. Ramon's cystatin C at 0.99 is within the optimal range, giving an eGFR of 81, which is the more trustworthy estimate of his kidney function.","low_causes":"","high_causes":"Kidney disease, thyroid dysfunction, inflammation, corticosteroids","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.675","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The cystatin C-based eGFR uses cystatin C instead of creatinine to estimate kidney filtration. At 81, it is below the optimal of 90 but within the laboratory range. For Ramon, this is the more reliable kidney estimate because his creatine supplementation inflates creatinine. An eGFR of 81 at 56 is adequate and worth monitoring at future tests to ensure stability.","low_causes":"Kidney disease, dehydration, heart failure","high_causes":"Hyperfiltration, pregnancy","padding":"1","one_sided":"","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTI on":"Platelets are cell fragments that help blood clot. Ramon's platelet count at 262 is within the optimal band, confirming healthy bone marrow production and no bleeding or clotting tendency.","low_causes":"Viral infection, autoimmune disease, liver disease, medications","high_causes":"Iron deficiency, inflammation, infection, post-surgery","padding":"1","one_sided":"","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6222","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are younger and more reactive. Ramon's MPV at 9.7 is within the laboratory range but slightly above the optimal of 9.5. This is a marginal finding with no clinical significance.","low_causes":"Bone marrow underproduction, certain autoimmune conditions","high_causes":"Platelet consumption, immune thrombocytopenia, inflammation","padding":"1","one_sided":"","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"0.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4967","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.7","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells freshly released from the bone marrow. The percentage reflects how actively the marrow is producing new red cells. Ramon's reticulocyte percentage at 0.99 is within the optimal range. However, the absolute count, which accounts for the total red cell number, is below range.","low_causes":"Iron deficiency, chronic disease, s an efficient immune system rather than a deficiency.","low_causes":"Viral infection, autoimmune disease, bone marrow suppression, medications, very fit individuals","high_causes":"Infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4147","lower_normal":"2","upper_normal":"7","lower_optimal":"2","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5333","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cell, responsible for fighting bacterial infections. Ramon's neutrophils at 2.42 are within the optimal range.","low_causes":"Viral infection, medications, autoimmune disease, bone marrow suppression","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3783","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, including antibody production and viral defence. Ramon's lymphocytes at 1.27 are within the laboratory range but below the optimal of 1.5. A count at the lower end is common in healthy active men and can be influenced by cortisol and training load.","low_causes":"Viral infection, stress, corticosteroids, autoimmune disease, intense training","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"","range_type":"n ell, involved in allergic and inflammatory responses. Ramon's basophils at 0.03 are within the optimal range.","low_causes":"Stress, hyperthyroidism","high_causes":"Allergies, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"","range_type":"normal"},{"key":"nlr","name":"NLR","group":"HEMATOLOGY","result":"1.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4850","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"ratio","description":"The neutrophil-to-lymphocyte ratio is a simple marker of the balance between innate and adaptive immunity. It rises with infection, stress and systemic inflammation. Ramon's NLR at 1.91 is within the optimal band of 1 to 2, suggesting the immune system is well balanced despite the elevated ESR.","low_causes":"","high_causes":"Infection, stress, chronic inflammation, malignancy","padding":"1","one_sided":"","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"20.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index divides MCV by red blood cell count and is used to differentiate iron deficiency anaemia (above 13) from thalassaemia trait (below 13). Ramon's index at 20.9 is above 13, which is consistent with the mild anaemia being related to reduced production (inflammation-driven) rather than a thalassaemia trait. This is reported for context and is not applicable at present.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproduct  the main iron storage protein. It reflects total body iron stores and also rises as an acute phase reactant during inflammation. Ramon's ferritin at 337 is above the male upper limit of 322 and well above the optimal of 200. This elevation could reflect the inflammatory signal (ESR 50, CRP 2.7) pushing ferritin up as an acute phase protein, or it could indicate early iron overload. Combined with the low transferrin at 2.02 and transferrin saturation at 41.79%, an HFE gene test is warranted to exclude hereditary haemochromatosis.","low_causes":"Iron deficiency, blood loss, malabsorption, vegetarian diet","high_causes":"Haemochromatosis, inflammation, liver disease, alcohol, iron supplementation, chronic disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2819","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6333","units":"g/L","description":"Transferrin is the protein that carries iron in the blood. Its production reflects iron demand and inflammation. As a negative acute phase reactant, transferrin falls when the body is inflamed, which can mask iron deficiency and mimic iron overload. Ramon's transferrin at 2.02 is just below the lower limit of 2.15. This could be the inflammatory signal (elevated ESR and CRP) suppressing production, or it could reflect iron sufficiency where the body is downregulating iron transport because stores are already full. The HFE gene test will help clarify which explanation applies.","low_causes":"Inflammation, iron overload, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oestrogen therapy","padding":"1","one_sided":"","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"47.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3465","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3957","upper_optimal_position":"0.6040","units":"umol/l","description":"TIBC measures the total capacity of transferrin to bind iron. A low TIBC suggests the body is not demanding more iron transport, either because stores are full or because inflammation is suppressing transferrin production. Ramon's TIBC at 47.4 is within the laboratory range but below the optimal of 50, consistent with the low transferrin.","low_causes":"Iron overload, inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"41.79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5430","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5297","units":"%","description":"Transferrin saturation is the percentage of transferrin occupied by iron. It is one of the most important markers for detecting iron overload. Ramon's saturation at 41.79% is within the laboratory range of 18 to 55% but above the optimal upper limit of 40%. A saturation above 45% is the classic screening threshold for haemochromatosis. At 41.79%, this is approaching that threshold and, combined with the elevated ferritin and low transferrin, warrants the HFE gene test.","low_causes":"Iron deficiency, chronic disease, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3728","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, driving libido, muscle mass, fat distribution, bone density and energy. Ramon's testosterone at 12 sits at the very floor of the laboratory range (8.4 to 28.7) and at the level the lab notes as 'recommended level of >12'. For a 56-year-old man reporting low libido and difficulty losing body fat, this is below optimal and is the most plausible explanation for both symptoms. A morning repeat before 10am would confirm the pattern.","low_causes":"Ageing, obesity, low energy availability, chronic disease, medications, pituitary dysfunction","high_causes":"Testosterone replacement, anabolic steroids, adrenal tumours","padding":"1","one_sided":"","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone","group":"HORMONES","result":"0.229","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3698","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5194","upper_optimal_position":"0.6854","units":"nmol/l","description":"Free testosterone is the small fraction (about 2%) not bound to any protein, and it is the form that directly enters cells and drives testosterone's effects. Ramon's free testosterone at 0.229 is within the laboratory range but below the optimal of 0.3. This tracks with the low total testosterone and supports the symptom picture of reduced libido.","low_causes":"Low total testosterone, high SHBG, ageing, obesity","high_causes":"Testosterone replacement, low SHBG, anabolic steroids","padding":"1","one_sided":"","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"32.43","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3536","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"index","description":"The Free Androgen Index estimates the proportion of testosterone available for biological activity, calculated from total testosterone and SHBG. Ramon's FAI at 32.43 is just above the lower limit of 30 and below the optimal of 40, consistent with the borderline testosterone picture.","low_causes":"Low testosterone, high SHBG, ageing","high_causes":"Testosterone replacement, low SHBG, PCOS (in women)","padding":"1","one_sided":"","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4746","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3860","upper_optimal_position":"0.6158","units":"nmol/l","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, controlling how much of each hormone is available to tissues. Ramon's SHBG at 37 is mid-range and within the optimal band of 25 to 55. This means the low total testosterone is not being caused by excessive SHBG binding.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroids","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen, low BMI","padding":"1","one_sided":"","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3219","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1370","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men, produced mainly by conversion of testosterone in fat tissue. Small amounts are important for bone health, brain function and cardiovascular protection. Ramon's oestradiol at 94 is within the optimal range, confirming a healthy testosterone-to-oestrogen balance.","low_causes":"Low testosterone, low body fat, aromatase inhibitors","high_causes":"Obesity, liver disease, aromatisation of testosterone, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"<0.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0591","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6041","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a minor role in mood, sleep and testosterone metabolism. Ramon's progesterone at below 0.21 is below the male reference range of 0.89 to 3.88. In men, a low progesterone is a common finding and is rarely clinically significant. It does not require treatment.","low_causes":"Normal variation in men, adrenal insufficiency","high_causes":"Adrenal hyperplasia, medications","padding":"1","one_sided":"","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"3.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4049","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6026","units":"mIU/ml","description":"LH is produced by the pituitary gland and stimulates the testes to produce testosterone. Ramon's LH at 3.19 is within the optimal range. Importantly, it is not elevated, which means the pituitary is not recognising the low testosterone as a problem and is not compensating by producing more LH. This pattern is typical of the gradual age-related decline in the hypothalamic-pituitary-gonadal axis.","low_causes":"Pituitary dysfunction, anabolic steroids, obesity","high_causes":"Primary hypogonadism (testicular failure), menopause (in women)","padding":"1","one_sided":"","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"8.87","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5783","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5627","units":"mIU/ml","description":"FSH stimulates sperm production and supports testicular function. Ramon's FSH at 8.87 is within the laboratory range but above the optimal of 8. FSH tends to rise gradually with age as testicular function declines, and at 56 this is within the expected range. It does not indicate pathology but is consistent with the borderline testosterone picture.","low_causes":"Pituitary dysfunction, anabolic steroids","high_causes":"Primary hypogonadism, ageing, testicular damage","padding":"1","one_sided":"","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3903","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3485","upper_optimal_position":"0.6212","units":"uIU/ml","description":"Prolactin is a pituitary hormone that, in men, can s of blood collection or a naturally robust morning cortisol response. There is no suggestion of adrenal dysfunction.","low_causes":"Adrenal insufficiency, pituitary dysfunction","high_causes":"Stress, Cushing's syndrome, medications (prednisolone), intense exercise","padding":"1","one_sided":"","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"5.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4819","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone includes both free testosterone and the portion loosely bound to albumin, representing the testosterone available to tissues. Ramon's bioavailable testosterone at 5.12 is within the optimal band (4 to 9) but in the lower half. It is adequate but not robust.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"2.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Free Oestradiol Index estimates the proportion of oestradiol not bound to SHBG. Ramon's index at 2.54 is reported for context and is not applicable at present.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3847","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4273","upper_optimal_position":"0.5831","units":"mIU/l","description":"TSH is produced by the pituitary gland to regulate the thyroid. A high TSH means the pituitary is pushing the thyroid to produce more hormone (underactive); a low TSH means the thyroid is producing too much (overactive). Ramon's TSH at 1.32 is within the ideal zone of 1.0 to 2.5, confirming the thyroid is functioning optimally. Given the family history of thyroid disease, this is a valuable clean baseline.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, iodine deficiency, thyroid antibodies, thyroiditis","padding":"1","one_sided":"","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"17.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5119","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4131","upper_optimal_position":"0.5714","units":"pmol/l","description":"Free T4 is the inactive thyroid hormone that circulates in the blood and is converted into the active form (T3) in tissues. Ramon's free T4 at 17.5 is within the optimal band, confirming the thyroid is producing an appropriate amount of hormone.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5037","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone. It drives metabolism, energy, body temperature and mental clarity. Ramon's free T3 at 4.9 is within the optimal band, confirming effective conversion from T4 to T3.","low_causes":"Hypothyroidism, chronic illness, low-calorie diets, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies attack thyroid peroxidase, the enzyme the thyroid uses to make hormones. Elevated levels indicate autoimmune thyroid disease (Hashimoto's thyroiditis). Ramon's TPO antibodies at below 6.6 are well within range, ruling out an autoimmune attack on the thyroid. Given the family history of thyroid disease, this is particularly reassuring.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tgantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target the protein the thyroid uses as a scaffold for hormone production. Like TPO antibodies, elevated levels indicate autoimmune thyroid disease. Ramon's thyroglobulin antibodies at below 1.3 are undetectable, further confirming no autoimmune thyroid activity.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3:FT4 ratio reflects how efficiently the body converts inactive T4 into active T3. Ramon's ratio at 0.28 is within the optimal band, confirming healthy thyroid hormone conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"64","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4267","lower_normal":"50","upper_normal":"100","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood and muscle strength. It is produced by the skin in response to sunlight and is difficult to obtain in sufficient quantities from diet alone, especially in the UK. Ramon's vitamin D at 64 is sufficient by NHS standards (above 50) but below the optimal of 75. Despite supplementation, the dose is not achieving the target. Increasing to 3,000 to 4,000 IU daily should bring it into the optimal range.","low_causes":"Insufficient sun exposure, northern latitude, dark skin, low dietary intake, obesity, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"","range_type":"no upper"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"317","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3948","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5224","upper_optimal_position":"0.6370","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. Ramon's B12 at 317 is within the laboratory range but below the optimal of 500, which is surprising given he supplements with B12. The form may not be well absorbed; switching to sublingual methylcobalamin at 1,000 micrograms daily typically delivers a significant increase.","low_causes":"Low dietary intake (vegan/vegetarian), malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for cell division, DNA repair and red blood cell production. It works closely with B12. Ramon's folate at 10 is within the optimal range, reflecting the excellent intake of 6+ portions of vegetables and fruit daily.","low_causes":"Low vegetable intake, malabsorption, alcohol, medications (methotrexate)","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"","range_type":"normal"},{"key":"pth","name":"Par ing":"1","one_sided":"","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"VITAMINS & NUTRIENTS","result":"220","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase is an enzyme found in muscle cells. It rises with muscle damage, intense exercise and trauma. Ramon's CK at 220 is within the optimal range and consistent with regular hard training. It does not suggest excessive muscle breakdown.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"","range_type":"normal"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"1.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1050","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"tTG IgA is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten that damages the small intestine. Ramon's result at 1.51 is well below the cutoff of 7.19, effectively ruling out coeliac disease as a cause of any digestive symptoms. Notably, his total IgA is not deficient, so the test is reliable.","low_causes":"","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"<4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
