<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Gaynor Kimber","dob":"03/04/1967","report_date":"2026-10-10","summary":"Gaynor is a 59-year-old female presenting with a BMI of 26.6, following a Mediterranean diet, eating 6+ portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food rarely; portions are about average (volume 5 out of 10). She trains five times per week (two cardio, three resistance) at hard intensity, with 7,500 to 10,000 daily steps. She sleeps 7 to 8 hours and wakes feeling refreshed, with steady energy through the day. Stress feels hard to manage some weeks. She drinks 1 to 4 alcoholic drinks per week. She has a diagnosis of polycystic ovary syndrome (PCOS), made at age 19, which she believes is type 4. She is post-menopausal with a hormonal coil (IUS) and is on HRT. She supplements with vitamin D, omega-3 fish oil, creatine, protein powder, magnesium and a multivitamin. Her family history includes bowel, breast, prostate or ovarian cancer, an autoimmune condition and osteoporosis. A previous blood test showed everything as normal. She reports low mood and anxiety, brain fog, weight gain and difficulty losing weight, and low libido, all lasting over a year. Her goals are to build muscle, improve long-term health and longevity, and reduce stress and anxiety. She adds that she is a dentist working three days a week and that her thyroid levels have been bobbing around with her GP suggesting she may need thyroxine over the last five years.\n\nThe finding that should go straight to her GP is the thyroid. Her TSH (thyroid stimulating hormone, the signal the pituitary gland sends to the thyroid telling it to produce more hormone) is 6.36, well above the upper limit of 4.78, and her thyroid peroxidase (TPO) antibodies are 155.6, more than ten times the upper limit of 13.8. TPO antibodies are proteins the immune system produces when it mistakenly attacks the thyroid gland, and this pattern, a raised TSH alongside strongly positive TPO antibodies, is the hallmark of a condition called Hashimoto's thyroiditis. This is an autoimmune thyroid disease in which the immune system gradually damages the thyroid, reducing its ability to produce thyroid hormones. The fact that her GP has been watching her thyroid for five years and her TSH is now clearly above range suggests the thyroid is losing ground. Importantly, her free T4 (the main hormone the thyroid produces) is still 17.3, comfortably within the ideal range of 14 to 20, and her free T3 (the active form the body converts T4 into) is 4.6, which sits just at the lower edge of the ideal range of 4.5 to 6.5. This means the thyroid is still managing to produce enough hormone, but it is being pushed hard to do so, as the high TSH shows. The FT3 to FT4 ratio at 0.266 is fractionally below the optimal band of 0.27, suggesting conversion from T4 to T3 could be slightly sluggish. Her thyroglobulin antibodies are 3.4, just under the 4.4 threshold, so the autoimmune process appears to be driven by the TPO pathway rather than the thyroglobulin pathway. This is directly relevant to several of her symptoms. Underactive thyroid function is closely associated with low mood, brain fog, difficulty losing weight and low energy, and it also slows the clearance of cholesterol from the blood. Given that her TSH has now crossed above range with strongly positive antibodies, this is the point at which her GP should reassess whether levothyroxine is now indicated. The family history of autoimmune conditions adds further weight to the autoimmune thyroid picture.\n\nThe second finding for her GP is the raised ESR (erythrocyte sedimentation rate, a measure of how quickly red blood cells settle in a tube, which rises when there is inflammation in the body). Hers is 46, nearly four times the upper limit of 12. Her hs-CRP (high-sensitivity C-reactive protein, a more specific marker of acute inflammation produced by the liver) is 5.1, just above the upper limit of 5. These two markers together confirm there is genuine inflammation happening. The ESR at this level is more than a marginal elevation; it warrants investigation. Possible explanations include the autoimmune thyroid process itself, which can raise the ESR, and there may be other contributors. At 59 with a family history of autoimmune conditions, the GP should consider whether there is a second autoimmune process alongside the thyroid. Her rheumatoid factor is reassuringly below 4, which makes rheumatoid arthritis unlikely, and her immunoglobulins are all within range. The ESR can also be raised by anaemia, infection and other inflammatory conditions, and the urinalysis (discussed below) may be contributing if there is an active urinary tract infection. The GP should investigate the ESR with a clinical examination and may wish to repeat it once any urinary issue has been treated, to see whether it falls.\n\nThe urinalysis shows 340 white blood cells per microlitre (significant is above 10) and 30 red blood cells per microlitre (significant is above 25), with a trace of nitrites. The bacterial count and urine culture results are still to follow. This pattern is consistent with a urinary tract infection, and the culture result will confirm the organism and guide antibiotic choice if needed. The white cells and red cells could also be contributing to the raised ESR and CRP. Once the culture result returns, the GP can act on it, and the ESR should be rechecked afterwards.\n\nHer GGT (gamma-glutamyl transferase, a liver enzyme that rises in response to metabolic strain, alcohol, medications and bile duct issues) is 120, more than three times the female upper limit of 38. Her ALP (alkaline phosphatase, an enzyme found in liver, bone and bile ducts) is 122, above the upper limit of 116. The rest of the liver panel is reassuring: ALT is 45 (within the laboratory range of up to 56, though above the optimal female threshold of 25), AST is 26, bilirubin is 10, albumin is 41, total protein is 74, and the FIB-4 score (a fibrosis index that estimates liver scarring using age, platelets, AST and ALT) is 0.7, well within the safe range, meaning there is no sign of liver fibrosis. The APRI score at 0.198 and NAFLD fibrosis score at minus 3.386 both confirm no evidence of scarring. The De Ritis ratio (AST divided by ALT) is 0.58, fractionally below the normal lower bound of 0.6, which simply reflects the ALT being a little higher than the AST and is consistent with a metabolic or hepatocellular pattern rather than advanced liver disease. The isolated GGT elevation is the finding that matters. In a 59-year-old woman on HRT with low alcohol intake, the most likely explanations are HRT itself (oestrogen and progesterone replacement can raise GGT), the autoimmune thyroid process (hypothyroidism raises GGT), and the possibility of non-alcoholic fatty liver, although her BMI of 26.6 and excellent insulin sensitivity make the last of these less likely. The ALP at 122 is only marginally above 116 and at her age could reflect bone turnover (ALP is found in bone as well as liver, and post-menopausal women with a family history of osteoporosis can have mildly raised ALP from increased bone remodelling). The GP should be aware of the GGT and may wish to request a liver ultrasound to exclude any bile duct or structural cause, and to check whether the ALP is liver-fraction or bone-fraction if there is any clinical concern about bone density.\n\nTurning to what is working well, and there is a great deal. Her cardiovascular profile is exceptional. Total cholesterol is 4.4, LDL (low-density lipoprotein, the form of cholesterol that deposits in artery walls) is 1.75, and her ApoB (apolipoprotein B, the single best measure of the number of atherogenic particles in the blood, because every dangerous lipoprotein particle carries exactly one ApoB molecule) is 0.8, right at the desirable threshold. Her HDL (high-density lipoprotein, the protective cholesterol that carries lipid away from artery walls) is 2.3, which is outstanding. Her triglycerides at 0.82 are excellent, well below the optimal threshold of 1.0. The TG to HDL ratio at 0.36 is superb, the ApoB to ApoA1 ratio at 0.44 is well within the low-risk range, and her Lp(a) (lipoprotein-a, an inherited particle that accelerates plaque formation and cannot be changed through diet or exercise) is below 25, which is normal and means her entire lipid risk is modifiable. The Lp(a)-corrected LDL at 1.67 confirms that essentially all her LDL is diet-driven and responsive to lifestyle. The atherogenic index of plasma at minus 0.448 and the Castelli II ratio at 0.76 both sit comfortably in the optimal zone. Her cardiovascular risk score is 20 out of 100, which places her right at the upper edge of ideal and reflects the small contribution from the raised CRP; without the inflammation her score would be lower still. This is a genuinely impressive lipid profile.\n\nHer blood sugar control is excellent. Fasting glucose is 4.7, HbA1c (glycated haemoglobin, a measure of average blood sugar over the previous two to three months) is 31 mmol/mol, well below the optimal threshold of 36, and her fasting insulin is 3.4, giving a HOMA-IR (a calculation that estimates insulin resistance using fasting glucose and insulin) of 0.71, which places her firmly in the insulin-sensitive category. The estimated average glucose at 5.3 and TyG index at 8.03 both confirm excellent metabolic health. Her C-peptide (a protein released in equal amounts to insulin and used to measure how much insulin the pancreas is actually producing) is 1.05 micrograms per litre, which converts to approximately 347 picomoles per litre. The lab flags this as below the lower limit of 1.1 micrograms per litre, but in the context of a fasting glucose of 4.7, an HbA1c of 31, and a HOMA-IR of 0.71, this simply means the pancreas does not need to produce much insulin because her cells respond to it so efficiently. This is a positive finding, not a concern.\n\nHer kidney function needs a note. Cystatin C is 1.11, marginally above the upper limit of 1.1, and the cystatin C-based eGFR is 75. The creatinine-based eGFR is 82, and the combined eGFR is 75. For a 59-year-old woman this is within the expected range and above the 60 threshold that would indicate chronic kidney disease, but it is below the optimal level of 90. Creatinine at 70 is within range, urea at 5.7 is within range, and the urea to creatinine ratio at 81.4 is normal. Electrolytes are all healthy: sodium 141, potassium 4.7, chloride 102, bicarbonate 27.4. The serum osmolality at 292.4 is within range. Uric acid at 286 is within range. The kidney is functioning adequately but should be monitored over time, and the cystatin C should be repeated at the next test to establish a trend. Adequate hydration and the current Mediterranean diet are both protective.\n\nHer full blood count is largely healthy. Haemoglobin at 147 is near the top of the female range of 120 to 150, which is excellent for oxygen-carrying capacity and recovery from hard training. Red cell count, haematocrit, MCV, MCHC, platelets, MPV, RDW and reticulocytes are all within range. White cell count at 4.69 is within range, as are all the differential counts: neutrophils 2.24, lymphocytes 1.79, monocytes 0.51, eosinophils 0.10 and basophils 0.05. The neutrophil to lymphocyte ratio at 1.25 is within the ideal band, the platelet to lymphocyte ratio at 183.2 is within range, and the systemic immune-inflammation index at 410 is within range. Her MCH (mean corpuscular haemoglobin, the average amount of haemoglobin in each red blood cell) is 33, marginally above the upper limit of 32; at this margin it is a laboratory artefact with no clinical significance.\n\nHer iron studies show a healthy picture. Ferritin (the storage form of iron) is 188, within the optimal female range of 40 to 150 on the higher side but not concerning at 59, and post-menopausally ferritin naturally rises because iron is no longer lost through menstruation. Serum iron is 21.9, transferrin saturation is 43.82 percent which is within the optimal band of 25 to 40 percent on the high side, and TIBC is 47.6. Her transferrin (the protein that transports iron in the blood) is 1.99, below the lower limit of 2.5. Transferrin is a negative acute-phase protein, meaning it falls when inflammation is present, and her raised ESR and CRP explain this. It can also fall when iron stores are high, as the body downregulates the transport protein when there is plenty of iron available. In the context of a ferritin of 188 and a CRP of 5.1, the low transferrin is expected rather than alarming, but it should be rechecked once the inflammation has been investigated and treated.\n\nHer vitamins and minerals are well managed. Vitamin D at 94 is within the optimal range of 75 to 120, showing her supplementation is working. Vitamin B12 at 579 is within the optimal range of 500 to 900. Folate is above 24, above the upper limit of 17, which reflects her excellent vegetable intake and likely her multivitamin; this is not harmful. Calcium at 2.42 and corrected calcium at 2.45 are both within the optimal range. Phosphate at 1.1 is within range. Magnesium at 1.06 is at the top of range (upper limit 1.11) and just above the optimal ceiling of 1.05, which is excellent and reflects her supplementation. PTH (parathyroid hormone, which regulates calcium and bone metabolism) at 2.9 is mid-range and healthy. Total antioxidant activity at 1.73 is within the optimal range, likely supported by her high fruit and vegetable intake and omega-3 supplementation.\n\nHer hormonal picture reflects the post-menopausal state with HRT. FSH at 39.91 and LH at 40.17 are both in the post-menopausal range, confirming that her ovaries are no longer cycling, as expected. Oestradiol at 106 is within the post-menopausal reference range of 0 to 118.2; this level suggests her HRT is providing some oestrogen replacement, though it sits at the lower end of what would be considered a robust replacement level. If her symptoms of low mood, brain fog and low libido persist despite HRT, it may be worth discussing with her HRT prescriber whether a dose adjustment could bring the oestradiol higher. Progesterone at 1.14 is within the post-menopausal range and is consistent with the hormonal coil providing progestogenic cover. Total testosterone at 0.6 is within the female range of 0.5 to 2.6 but sits at the very bottom. Free testosterone (the fraction not bound to proteins and therefore available to tissues) is 0.006, below the lower limit of 0.01, and the free androgen index at 0.76 is at the low end of range. Bioavailable testosterone at 0.13 is within range but only just. SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it unavailable) is 79.2, which is in the upper half of range and is binding most of the already low testosterone. DHEA-S (a precursor hormone produced by the adrenal glands) is 1.9 micromoles per litre, which converts to approximately 700 micrograms per decilitre; this is within range but the adrenal contribution to androgens declines with age. Low free testosterone in post-menopausal women is directly associated with reduced libido, difficulty building muscle, low mood and brain fog, all of which Gaynor reports. This is a conversation for her HRT prescriber: testosterone replacement in post-menopausal women is increasingly used and evidence-based for libido, mood and body composition, and her results provide a clear rationale. Cortisol at 463 is within the morning reference range of 145.4 to 619.4; the lab has flagged it as abnormal but this is because the system does not distinguish morning from afternoon ranges. A morning cortisol of 463 is healthy and appropriate. Prolactin at 202 is within the post-menopausal range.\n\nHer immune markers are mostly reassuring. IgG, IgM and IgA are all within range. IgE (the antibody class associated with allergic responses) is 119, above the upper limit of 100. This suggests an allergic tendency; it does not point to a specific allergen but could reflect seasonal allergies, dust mite sensitivity, or a mild food sensitivity. If she has any symptoms such as nasal congestion, itchy eyes, or skin reactions, this would support investigating further with specific allergen testing. Rheumatoid factor is below 4, which is reassuring given the family history of autoimmune conditions. Tissue transglutaminase IgA is negative, effectively excluding coeliac disease while she remains on a gluten-containing diet.\n\nHer tumour markers are reassuring. CA125 at 10.7 (upper limit 31) is well within range and relevant given the family history of ovarian cancer. CA15-3 at 12.08 (upper limit 30) is normal, relevant to the breast cancer family history. CA19-9 at 2.61 and CEA below 0.5 are both normal, relevant to the bowel cancer family history. These markers are screening tools, not diagnostic tests, but the fact that all four are comfortably within range is genuinely reassuring.\n\nHer creatine kinase at 64 is well within range, showing good muscle recovery despite hard training five times a week.\n\nHer PhenoAge is 48.7 years against a calendar age of 59, which means her blood markers suggest a biological age more than ten years younger than her actual age. This is an excellent result, driven by her low glucose, low CRP (the CRP is above ideal but still low in absolute terms), healthy albumin, low white cell count and good MCV. Her Mediterranean diet, high vegetable intake, regular training and good sleep are all contributing to this.\n\nTo return to her symptoms: low mood and anxiety, brain fog, weight gain and difficulty losing weight, and low libido. The bloods do explain a significant part of this picture. The subclinical hypothyroidism with Hashimoto's antibodies is associated with all four symptoms, particularly brain fog, low mood, and difficulty losing weight, because thyroid hormone sets the metabolic rate and influences neurotransmitter function. The very low free testosterone is directly linked to low libido and difficulty building muscle, and contributes to low mood. The raised inflammatory markers may be adding to fatigue and brain fog. Addressing the thyroid with levothyroxine (if her GP agrees it is now indicated) and discussing testosterone replacement with her HRT prescriber are the two interventions most likely to improve her symptoms.","links":"The central thread in this report is the autoimmune thyroid picture and its downstream effects. TSH at 6.36 with TPO antibodies at 155.6 confirms the immune system is actively targeting the thyroid gland, and the thyroid is beginning to struggle. Free T4 is still within the ideal range at 17.3 and free T3 is just holding at 4.6, but the FT3 to FT4 conversion ratio at 0.266 is fractionally below ideal, suggesting the conversion step is starting to slow. This is the pattern of early Hashimoto's thyroiditis: the pituitary is shouting louder and louder (high TSH), the thyroid is still answering (normal T4 and T3), but the gap between demand and supply is widening. Her GP has been watching this for five years, and the crossing of TSH above the upper limit with strongly positive antibodies is the clinical inflection point.\n\nThe thyroid connects to several other findings. Hypothyroidism raises GGT independently of liver disease, and her GGT at 120, more than three times the female limit, may be partly thyroid-driven alongside HRT effects. Hypothyroidism slows LDL clearance, though in Gaynor's case her LDL is already excellent at 1.75, so this is not a current issue but would become relevant if the thyroid deteriorated further without treatment. Hypothyroidism also raises ESR and CRP, so part of her inflammatory picture may be thyroid-mediated, though the ESR at 46 is high enough that the GP should investigate it in its own right rather than attributing it entirely to the thyroid.\n\nThe second thread is the post-menopausal hormone picture and the impact of very low free testosterone. Total testosterone at 0.6 is technically within range but sits at the floor, and free testosterone at 0.006 is below the lower limit. SHBG at 79.2 is binding most of what little testosterone is available. This combination directly explains the low libido and the difficulty building muscle despite training hard five times a week with creatine and protein supplementation. The oestradiol at 106, while within the post-menopausal range, sits at the lower end of what would provide robust symptom relief on HRT, and the combination of borderline oestradiol and very low free testosterone creates a hormonal environment that makes weight gain easy and muscle gain difficult.\n\nThe inflammation is a loose end that needs resolving. ESR at 46 and CRP at 5.1 are both above range. The urinalysis showing 340 white cells with trace nitrites and pending culture raises the possibility that an active or recent urinary tract infection is driving some or all of the inflammation. The autoimmune thyroid process itself contributes to inflammation. The transferrin at 1.99, below range, is behaving as a negative acute-phase protein would when inflammation is present, so this fits the same picture. Once the urine culture returns and any infection is treated, both the ESR and CRP should be rechecked. If they remain elevated after the infection has cleared, the GP should investigate further, particularly given the family history of autoimmune conditions.\n\nWhat has been excluded is valuable. There is no insulin resistance; her HOMA-IR at 0.71 is excellent. There is no diabetes risk; her HbA1c at 31 is well below threshold. There is no liver fibrosis; FIB-4, APRI and NAFLD scores are all in the safe zone. There is no kidney disease; eGFR is above 60 and electrolytes are balanced. There is no coeliac disease. Rheumatoid factor is negative. All four tumour markers are normal. Lp(a) is normal. The cardiovascular risk score at 20 reflects a well-managed heart and metabolic profile.","lifestyle":"Continue your current Mediterranean diet with 6+ portions of vegetables and fruit a day; this is already excellent and is a major driver of your PhenoAge being ten years younger than your calendar age. Keep protein at every meal, aiming for at least 83 to 102 grams per day across the day, prioritising breakfast and the meal after training. Anchor: protein goes on the plate before anything else. Why: with free testosterone at 0.006 and a goal of building muscle, protein is the raw material and your current training will not translate into lean mass without enough of it.\nAdd two to three portions of oily fish per week (salmon, mackerel, sardines) if not already doing so, alongside your omega-3 supplement. Anchor: batch cook at the weekend for the work week. Why: omega-3 from whole fish is better absorbed than supplements alone and supports the anti-inflammatory effort your body needs with an ESR of 46.\nKeep your five training sessions per week but consider shifting one cardio session to a second recovery or mobility session. Anchor: whichever day follows your hardest resistance day. Why: hard training five times a week with suboptimal thyroid function and low free testosterone increases cortisol demand and may slow recovery; one lighter session allows adaptation.\n Keep your 7,500 to 10,000 daily steps; on rest days, aim for the upper end. Anchor: a walk after your largest meal. Why: post-meal walking lowers glucose and insulin response, supporting the excellent HOMA-IR of 0.71 you already have.\nMaintain your caffeine cut-off before early afternoon if not already doing so, and keep your sleep at 7 to 8 hours. Anchor: last coffee by 1pm. Why: your sleep is already working well (refreshed on waking, steady energy), and protecting this is one of the most powerful anti-inflammatory and recovery habits available.\nOn weeks when stress feels hard to manage, add a ten-minute breathing or meditation practice before bed or after work. Anchor: the moment you sit down after your last patient. Why: stress raises cortisol, which at 463 is healthy but at the higher end of the morning range, and chronic stress worsens autoimmune flares.\nCalorie target for gradual fat loss while preserving muscle: approximately 1,500 to 1,600 kcal per day (your estimated TDEE is around 1,850 to 1,950 kcal at moderate to high activity; a 300 to 400 kcal deficit allows slow, sustainable loss of 0.25 to 0.5 kg per week). Protein floor: 83g per day minimum, ideally 95 to 102g. Target weight range: 57 to 61 kg, approached slowly over six to twelve months. If thyroid treatment is started, weight loss should become easier and the calorie target can be reassessed.\nLimit alcohol to its current 1 to 4 drinks per week and keep to the lower end on weeks when stress is higher. Why: alcohol raises GGT, and with GGT already at 120 every drink adds to the burden.","flags":"TSH 6.36 (above upper limit of 4.78) with TPO antibodies 155.6 (above upper limit of 13.8). This is the hallmark pattern of Hashimoto's thyroiditis. Free T4 17.3 and Free T3 4.6 are still within range, meaning the thyroid is compensating but under strain. GP should assess whether levothyroxine is now indicated, particularly given five years of borderline thyroid results and symptoms of brain fog, low mood, weight gain and fatigue.\nESR 46 (above upper limit of 12) and hs-CRP 5.1 (above upper limit of 5). Genuine inflammation confirmed by two independent markers. Possible contributors include the autoimmune thyroid process, a possible urinary tract infection (urinalysis below), and potentially a second autoimmune process given the family history. GP should investigate clinically and repeat both markers once any urinary infection has been treated.\nGGT 120 (above female upper limit of 38) and ALP 122 (above upper limit of 116). ALT 45, AST 26, bilirubin 10, albumin 41, FIB-4 0.7 all reassuring. Likely contributors are HRT, the subclinical hypothyroidism, and possibly bone-origin ALP given post-menopausal status and family history of osteoporosis. GP should consider liver ultrasound to exclude structural cause and bone-specific ALP if bone density is in question.\nFree testosterone 0.006 nmol/L (below lower limit of 0.01) with total testosterone 0.6 (bottom of range 0.5 to 2.6) and SHBG 79.2 binding most of it. Directly relevant to low libido, difficulty building muscle, low mood and brain fog. HRT prescriber should discuss testosterone replacement.\nUrinalysis: WBC 340 (significant above 10), RBC 30 (significant above 25), nitrites trace. Culture and sensitivities pending. Pattern is consistent with a urinary tract infection. GP to act on culture result when it returns.\nTransferrin 1.99 (below lower limit of 2.5). Behaving as a negative acute-phase protein in the context of ESR 46 and CRP 5.1. Ferritin 188 and transferrin saturation 43.82% are within range. Recheck once inflammation resolves.\nIgE 119 (above upper limit of 100). Suggests allergic tendency; no specific allergen identified. Consider allergen testing if symptomatic.\nC-Peptide 1.05 ug/L (below lower limit of 1.1). In the context of fasting glucose 4.7, HbA1c 31 and HOMA-IR 0.71, this reflects low insulin demand from excellent insulin sensitivity. Not a concern.\nMCH 33 (marginally above upper limit of 32). At this margin, laboratory variation with no clinical significance.\nCystatin C 1.11 (marginally above upper limit of 1.1) giving cystatin C eGFR 75. Adequate function but below optimal of 90; should be trended at next test.\nDe Ritis ratio 0.58 (fractionally below lower normal of 0.6). Reflects ALT being slightly higher than AST; consistent with metabolic rather than advanced liver pattern. Not independently concerning.\nFolate above 24 (above upper limit of 17). Reflects excellent diet and multivitamin supplementation. Not harmful.\nReassuring negatives: HbA1c 31 and HOMA-IR 0.71 exclude diabetes and insulin resistance. LDL 1.75, ApoB 0.8, Lp(a) below 25 and cardiovascular risk score 20 out of 100 show excellent cardiovascular health. FIB-4 0.7, APRI 0.198 and NAFLD score minus 3.386 exclude liver fibrosis. Rheumatoid factor below 4 and coeliac screen negative. All four tumour markers (CA125, CA15-3, CA19-9, CEA) well within range. Vitamin D 94 and B12 579 are both in the optimal range. Corrected calcium 2.45 and PTH 2.9 are healthy. Kidney function adequate with no electrolyte imbalance. Full blood count healthy with no anaemia.","recommendations":"Discuss thyroid management with your GP, bringing the TSH of 6.36, TPO antibodies of 155.6, and the five-year history of borderline results. Ask whether levothyroxine should now be started, given that TSH has crossed above range with confirmed autoimmune antibodies and you have symptoms consistent with hypothyroidism.\nAsk the GP to investigate the ESR of 46 and CRP of 5.1. Once the urine culture result returns and any infection is treated, both markers should be rechecked. If they remain elevated, further investigation for autoimmune or inflammatory conditions is warranted given the family history.\nDiscuss the GGT of 120 with the GP. Request a liver ultrasound to exclude structural causes. If the GP suspects bone-origin ALP, a DEXA scan would also be relevant given the family history of osteoporosis and post-menopausal status.\nDiscuss testosterone replacement with your HRT prescriber, bringing the free testosterone of 0.006 (below the lower limit of 0.01) and total testosterone of 0.6. Testosterone replacement in post-menopausal women is evidence-based for libido, mood and body composition, and your results provide a clear rationale.\nDiscuss whether your current HRT oestradiol dose is optimal, given that oestradiol at 106 is near the top of the post-menopausal range but at the lower end of robust replacement levels, and symptoms of low mood, brain fog and weight gain persist.\nFollow up on the urine culture result when it returns. If an infection is confirmed, treat as directed and recheck ESR and CRP four to six weeks later.\nRetest in four to six months with a focus on: TSH and free T4 (to assess response if levothyroxine is started), ESR and CRP (to confirm inflammation has resolved), GGT (to assess trend), cystatin C and eGFR (to establish a kidney function trend), free testosterone (to assess response if testosterone is added to HRT), and a full metabolic panel. Target protein intake 83 to 102g per day, calorie target 1,500 to 1,600 kcal per day for gradual fat loss while preserving muscle.","supplementation":"Vitamin D3 (cholecalciferol): continue current supplementation at 2,000 IU daily, taken with a fat-containing meal. Your level at 94 is within the optimal range of 75 to 120, so the current dose is maintaining it well. Always take with vitamin K2.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside vitamin D. Why: K2 directs calcium into bone rather than soft tissue, which is particularly relevant with a family history of osteoporosis and post-menopausal status.\nMagnesium glycinate: continue current supplementation at 300 to 400mg, taken before bed. Your magnesium at 1.06 is at the top of range, showing the supplement is working well. Glycinate is the best-absorbed form and supports sleep quality and muscle recovery.\nOmega-3 fish oil: continue at 2 to 3g combined EPA and DHA daily, taken with food. Why: supports the anti-inflammatory effort needed with ESR at 46 and CRP at 5.1, and complements the oily fish in your diet.\nCreatine monohydrate: continue at 3 to 5g daily, taken at any time with water. Why: supports muscle building alongside resistance training, which is particularly important with low free testosterone limiting muscle protein synthesis.\nProtein powder: continue using to help reach the daily target of 83 to 102g. Best taken within an hour of resistance training.\nDO NOT add iron supplements. Your ferritin is 188 and transferrin saturation is 43.82 percent; additional iron is not needed and would risk pushing stores too high.\nConsider replacing the multivitamin with the individual supplements listed above, as a multivitamin often provides subtherapeutic doses of the nutrients you need and unnecessary doses of those you do not. Your folate is already above range and your B12 is optimal, so a multivitamin adds little here.\nThe most important changes from this report are not supplements. They are getting the thyroid properly assessed and treated, discussing testosterone replacement with your HRT prescriber, and investigating the cause of the raised ESR.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 57.8; held to 49 by two or more systems rated \"See your GP\". Weakest systems: inflammation 8%, urinalysis 9%, liver & metabolic 33%. Biggest drags: Gamma GT, Thyroid Stimulating Hormone, ESR, hs-CRP.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"48.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3805","lower_normal":"","upper_normal":"64","lower_optimal":"","upper_optimal":"59","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4609","units":"years","description":"PhenoAge is a biological age estimate based on nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count). Gaynor's PhenoAge is 48.7 years against a calendar age of 59, meaning her blood markers suggest a biological age more than ten years younger than her actual age. This is an excellent result, driven by her low glucose, healthy albumin, controlled CRP (which, while slightly above the ideal threshold, remains low in absolute terms), healthy white cell count and good MCV. Her Mediterranean diet, high vegetable intake, regular hard training and quality sleep are all contributing to this impressive biological age.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term, meaning it measures the risk being built rather than the ten-year probability of an event. Gaynor's score of 20 places her right at the upper edge of the ideal range (below 20). The only factor lifting her score is the CRP at 5.1; without the inflammation her score would be lower. Her lipid profile is exceptional and is the strongest protective factor in this report.","low_causes":"Excellent lipid profile, low inflammation, good met ptimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable marker of kidney function. Gaynor's result of 1.11 is marginally above the upper limit of 1.1, giving a cystatin C-based eGFR of 75. This is adequate kidney function but below the optimal eGFR of 90. At 59, some age-related decline is expected. The inflammation (ESR 46, CRP 5.1) can also transiently raise cystatin C. This should be trended at the next test to establish whether it is stable or declining.","low_causes":"Normal variation","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcystatin","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5250","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR (Cystatin C) is calculated from your measured results. It sits outside the ideal range. It is being driven by Cystatin C, which sits outside the ideal range.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"75","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500 equacy. Gaynor's result of 106 is within the post-menopausal reference range of 0 to 118.2, indicating her HRT is providing some oestrogen replacement. However, it sits near the top of the unmedicated post-menopausal range rather than at the higher levels typically associated with robust HRT symptom relief. If her symptoms of low mood, brain fog and low libido persist, it may be worth discussing with her HRT prescriber whether a dose adjustment could bring the oestradiol higher.","low_causes":"Menopause, ovarian insufficiency, low body fat, excessive exercise","high_causes":"Pregnancy, HRT, ovarian tumour, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"1.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2457","lower_normal":"0","upper_normal":"2.32","lower_optimal":"0","upper_optimal":"2.32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is a hormone that balances oestrogen and supports mood, sleep and bone health. Gaynor's result of 1.14 is within the post-menopausal reference range of 0 to 2.32, consistent with her hormonal coil (IUS) providing progestogenic cover locally rather than systemically raising blood progesterone levels.","low_causes":"Menopause, anovulation, luteal phase defect","high_causes":"Pregnancy, progesterone supplementation, ovarian cyst","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"40.17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3188","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"54","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mIU/mL","description":"LH (luteinising hormone) is produced by the pituitary gland and helps regulate the menstrual cycle and ovulation. Gaynor's result of 40.17 is within the post-menopausal reference range of 15.9 to 54, confirming post-menopausal status. The elevated LH is expected when the ovaries are no longer producing eggs.","low_causes":"Pituitary disease, hormonal contraception, hypothalamic amenorrhoea","high_causes":"Menopause, PCOS, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"39.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3948","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mIU/mL","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland to stimulate the ovaries. In menopause, FSH rises because the ovaries no longer respond with oestrogen production. Gaynor's result of 39.91 is within the post-menopausal range of 23 to 116.3, confirming post-menopausal status. The fact that FSH remains elevated despite HRT suggests the HRT is not fully suppressing the pituitary signal, which may support a discussion about dose optimisation.","low_causes":"Pituitary disease, hormonal contraception, pregnancy","high_causes":"Menopause, premature ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone (Total)","group":"HORMONES","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3381","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3476","upper_optimal_position":"0.5524","units":"nmol/L","description":"Testosterone in function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
