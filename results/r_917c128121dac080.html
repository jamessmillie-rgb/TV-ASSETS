<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"dob":"06/10/1971","flags":"Haemoglobin 159 (limit 150), red blood cell count 5.26 (limit 4.8), haematocrit 0.466 (limit 0.46), RDW 14.1 (limit 14): raised red cell indices in a smoker, most likely secondary polycythaemia from chronic carbon monoxide exposure. GP should repeat FBC, check oxygen saturation, and consider JAK2 mutation testing to exclude polycythaemia vera. Reticulocyte absolute count 48.9 (limit 50), borderline low, suggests steady-state rather than acute marrow drive.\nTPO antibodies 179.9 (limit 13.8), thyroglobulin antibodies 10.3 (limit 4.4): strongly positive thyroid autoantibodies associated with Hashimoto's thyroiditis. TSH currently 2.08 (within range). GP should monitor TSH annually and discuss management options if it rises above range.\nTotal cholesterol 7.8 (desirable below 5.18), LDL 5.64 (limit 3.0), ApoB 1.74 (desirable below 0.9), non-HDL 6.2 (limit 4.0), TC/HDL ratio 4.88 (limit 4.5), Lp(a) 151.15 (limit 32), Lp(a)-corrected LDL 5.15 (limit 3.0), Castelli II 3.52 (limit 3.5), cardiovascular risk score 100/100: very high atherogenic burden with a significant inherited (Lp(a)) component. GP should assess overall cardiovascular risk, check blood pressure, and discuss statin therapy alongside lifestyle changes. Lp(a) should be recorded permanently and first-degree relatives offered testing.\nCystatin C 1.25 (limit 1.1), cystatin C eGFR 74, combined eGFR 74: mildly reduced kidney filtration (stage G2). The creatinine-based eGFR of above 90 overstates her kidney function. Urea 8.2 at the top of range (3.2 to 8.2), urea to creatinine ratio 132.3 (limit 100), bicarbonate 19.7 (limit 20). GP should repeat cystatin C in 3 months, check blood pressure, and monitor.\nLymphocytes 3.67 (limit 3.0): mildly elevated, likely chronic immune stimulation from smoking and/or fibromyalgia. Repeat on next FBC.\nC-peptide 0.732 ug/L (range 1.1 to 4.4): below range but in the context of normal glucose, normal HbA1c and low-normal insulin, this reflects low insulin demand rather than pancreatic insufficiency. No action needed.\nPTH 0.77 (range 0.98 to 4.73): low, which can be seen with good vitamin D status (vitamin D 103). Not a concern with normal calcium.\nMPV 12 (limit 10.1): elevated, can be seen in smokers and chronic inflammatory conditions. Minor finding.\nFSH 119.48 (postmenopausal range 23 to 116.3), LH 77.68 (postmenopausal range 15.9 to 54): both above their respective postmenopausal reference ranges, confirming established menopause with strong pituitary drive.\nRheumatoid factor 14 (limit 14): at the boundary of range. Does not confirm rheumatoid arthritis but worth noting with her joint symptoms and fibromyalgia.\nUrine WBCs 50 (significant above 10), RBCs 120 (significant above 25), culture shows mixed growth with probable contamination. Most likely sample contamination. A clean repeat sample is needed to confirm the red blood cells are not persistent, as microscopic haematuria at 55 warrants investigation if confirmed.\nHs-CRP 1.3 (optimal below 1.0): low-grade inflammation, intermediate cardiovascular risk category. Smoking, poor sleep and ultra-processed food are the likely contributors.\nFIB-4 1.74 (threshold 1.45): elevated by age and very low ALT (14). All other liver markers are normal, so it most likely reflects age, but the laboratory suggests a FibroScan when FIB-4 is above 1.3, so mention it to the GP.\nDe Ritis ratio 1.64 (limit 1.6): marginally above range, driven by very low ALT denominator. Not clinically significant with clean liver enzymes.\nReassuring negatives: fasting glucose 4.5, HbA1c 40, HOMA-IR 0.83 (excellent insulin sensitivity), ALT 14, GGT 20, albumin 42, APRI 0.296 (no liver fibrosis), vitamin D 103, B12 675, folate 9, ferritin 39, transferrin saturation 34%, CK 64, CA125 3.7, CA19-9 below 1.2, CEA below 0.5, coeliac screen negative, IgE 9.83, amylase 78, lipase 46, platelets 194, ESR 1.","links":"The thread that ties the most significant findings in this report together is cardiovascular risk, and it has two distinct components. The first is inherited: her Lp(a) at 151 nmol/L is a genetic trait that loads her blood with sticky, inflammatory LDL particles that no diet or exercise can remove. The second is modifiable: even after correcting for the Lp(a) contribution, her conventional LDL is 5.15, ApoB is 1.74, and non-HDL cholesterol is 6.2, all markedly elevated. Smoking compounds both components by damaging the endothelial lining of arteries, making it easier for these particles to penetrate the vessel wall, and her hs-CRP at 1.3 confirms there is low-grade inflammation accelerating the process. This is the highest-priority conversation for her GP.\n\nThe second thread is the red cell picture. Haemoglobin at 159, red blood cells at 5.26 and haematocrit at 0.466 are all above range, and the most likely explanation is a compensatory response to chronic carbon monoxide exposure from smoking. The body cannot use the haemoglobin bound to carbon monoxide, so it makes more red cells to carry the oxygen it needs. The reticulocyte count being at the lower end of normal suggests this is a steady-state adaptation rather than an acute marrow drive, but the GP should confirm this with a repeat count and appropriate investigations.\n\nThe third thread involves her thyroid. TPO antibodies at 179.9 and thyroglobulin antibodies at 10.3 show the immune system is targeting the thyroid gland, a pattern associated with Hashimoto's thyroiditis. Her thyroid function is currently normal, which means she is in the antibody-positive, euthyroid phase. Many of her symptoms, including fatigue, brain fog, joint stiffness and difficulty sleeping, overlap with both Hashimoto's and fibromyalgia, making it difficult to attribute them to one cause. What matters clinically is that TSH is monitored, and that her GP is aware the thyroid may begin to fail over the coming years.\n\nThe fourth thread is kidney function. Cystatin C at 1.25 giving an eGFR of 74 is a mild reduction that the creatinine alone would have missed. The slightly raised urea to creatinine ratio and the low bicarbonate fit a picture of early renal impairment, even if mild. Smoking, high LDL and high blood pressure (which should be checked) are the modifiable risk factors for kidney decline, and this finding adds further urgency to the cardiovascular risk conversation.\n\nWhat has been excluded is equally important. Her blood sugar control is excellent, with HOMA-IR at 0.83 confirming strong insulin sensitivity, so diabetes is not driving the lipid picture. Her liver is clean by every measure. Coeliac disease has been excluded as a cause of her bloating. Her iron stores are adequate if not generous. Her B12, folate and vitamin D are all well maintained by supplementation. Her tumour markers are clear. Her immune system, while showing mildly raised lymphocytes, shows no pattern suggesting a serious immunological condition.\n\nThe loose ends are the urinary findings and the rheumatoid factor. The urine result most likely reflects sample contamination, but red blood cells in the urine at 55 need a clean repeat to be certain. The rheumatoid factor at the boundary of range, in someone with joint pain, does not confirm rheumatoid arthritis but should be noted alongside the fibromyalgia diagnosis.","summary":"Tracey is a 55-year-old female presenting with a BMI of 22.6, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food most days and sugary food rarely; portions are about average (volume 5 out of 10). She does no structured cardio or resistance training, with 2,000 to 5,000 daily steps. She sleeps under 6 hours a night, feels exhausted or wakes in the night, is tired on waking, and finds stress hard to manage most days. She does not drink alcohol. She smokes tobacco. She supplements with vitamin D, vitamin B12 and protein powder. She has no prescribed medications. She has a diagnosis of fibromyalgia and reports reflux issues causing swallowing difficulties, for which she eats a blended diet every four hours. She reports low energy and fatigue, brain fog, bloating and digestive discomfort, and joint pain and stiffness, all of which she describes as always present. Her previous blood test was normal. Her goal is to improve long-term health and longevity. Her symptoms have been present for as long as she can remember.\n\nThis report contains several findings that need to go to her GP, and the most important are a significantly raised cardiovascular risk profile driven by an inherited cholesterol marker, raised haemoglobin with elevated red blood cells and haematocrit that need investigating, positive thyroid antibodies suggesting early autoimmune thyroid disease, and a reduced kidney filtration rate on the cystatin C measure.\n\nStarting with the raised red cell findings. Her haemoglobin is 159, above the upper limit of 150 for women. Her red blood cell count is 5.26, above the upper limit of 4.8, and her haematocrit (the proportion of blood that is red cells) is 0.466, just above the upper limit of 0.46. Her RDW, which measures variation in red cell size, is 14.1, marginally above the limit of 14. Put together, these show she is making more red blood cells than expected. In a 55-year-old woman, the most common explanation is chronic low oxygen levels, and smoking is the most likely driver here. Smoking raises carbon monoxide levels in the blood, which reduces the oxygen each red cell can carry, and the bone marrow compensates by producing more cells. Dehydration can also concentrate the blood and push haematocrit up, which is worth considering in someone eating a blended diet and possibly not drinking enough fluid. The GP should check this with a repeat full blood count, ideally after ensuring she is well hydrated, and may want to check an oxygen saturation and consider whether a JAK2 mutation test is appropriate to exclude polycythaemia vera, a rare bone marrow condition. The reticulocyte absolute count at 48.9, just below the lower limit of 50, is borderline and suggests the bone marrow is not in overdrive, which makes a reactive (smoking-driven) process more likely than a primary marrow condition, but the GP will want to confirm this.\n\nHer thyroid function tests show TSH at 2.08 and free T4 at 16.8, both within range, and free T3 at 5.0, also within range. On the surface the thyroid is working well. However, her thyroid peroxidase antibodies (TPO) are 179.9, dramatically above the upper limit of 13.8, and her thyroglobulin antibodies are 10.3, above the limit of 4.4. TPO and thyroglobulin antibodies are proteins the immune system produces when it attacks the thyroid gland, and their presence at this level is associated with a condition called Hashimoto's thyroiditis, the most common cause of underactive thyroid. At this stage, her thyroid is still producing adequate hormone and the TSH is not yet elevated, which means she is in the antibody-positive phase before the gland begins to fail. This does not always progress, but in the majority of cases it does, and her symptoms of fatigue, brain fog, and joint stiffness are all recognised features of thyroid autoimmunity even before TSH rises. Her GP should be aware so they can monitor TSH annually and intervene with replacement therapy if and when it climbs above range. The FT3 to FT4 ratio is 0.298, which is within the ideal range and confirms good conversion of T4 to the active T3 hormone for now.\n\nHer lipid profile is the area that carries the most long-term risk. Her total cholesterol is 7.8, well above the desirable level of 5.18. Her LDL cholesterol (the particles that deposit cholesterol in artery walls) is 5.64, nearly double the upper limit of 3.0. Her ApoB, which counts the actual number of atherogenic particles in the blood and is a better predictor of cardiovascular risk than LDL alone, is 1.74, nearly double the desirable limit of 0.9 and classified as very high by the laboratory. Her non-HDL cholesterol is 6.2, well above the 4.0 limit. Her TC to HDL ratio is 4.88, above the 4.5 target. Her Castelli II ratio (LDL divided by HDL) is 3.52, just above the 3.5 target. All of these point in the same direction: there are far too many cholesterol-carrying particles in her blood.\n\nThe critical finding within this picture is her lipoprotein(a), written Lp(a). Lp(a) is a type of LDL particle that carries an extra protein called apolipoprotein(a), which makes it stickier, more inflammatory, and harder for the liver to clear. It is inherited, set by genetics, and does not change with diet, exercise, or any currently available lifestyle intervention. Her level is 151.15 nmol/L, well above the 32 nmol/L threshold and in the moderate risk category (90 to 200). This is important because it means a significant portion of her elevated LDL is Lp(a)-LDL, which she cannot modify. Her Lp(a)-corrected LDL, which estimates the modifiable portion of her LDL, is 5.15, which is still very high and shows that even after accounting for the Lp(a) contribution, her conventional LDL is markedly elevated. The cardiovascular risk score, a TrueVitals index from 0 to 100 that weighs ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c, is 100, the maximum. The two drivers are the very high ApoB and the raised Lp(a). This score measures cumulative arterial risk being built right now, not a ten-year event probability, and it means the combination of modifiable and inherited lipid burden is as high as the index can register. She should record the Lp(a) result permanently, as it will not change, and first-degree relatives should be offered testing because they have a 50% chance of inheriting the same variant.\n\nOn the positive side of the lipid profile, her HDL is 1.6, above the desirable 1.55, and her ApoA1 is 1.73, comfortably above 1.4. HDL particles carry cholesterol away from artery walls for disposal, so this is genuine protection. Her triglycerides at 1.38 are within the fasting target of 1.7, and her VLDL at 0.63 is within the laboratory range but slightly above the optimal of 0.6. The atherogenic index of plasma is -0.064, within the ideal range, which reflects the favourable triglyceride-to-HDL balance. Her TG to HDL ratio is 0.86, within the optimal band below 0.87. But these positives do not offset the ApoB and Lp(a) burden. The GP conversation here is important: given the Lp(a) level and the very high ApoB, dietary optimisation alone is unlikely to bring the numbers to target, and statin therapy is likely to be discussed. Smoking compounds the risk substantially because it damages the artery lining and accelerates the process by which LDL and Lp(a) particles penetrate the vessel wall.\n\nHer kidney function shows a split picture. Creatinine-based eGFR is reported as above 90, which looks reassuring. However, cystatin C, a more accurate filtration marker that is not affected by muscle mass, diet or age in the way creatinine is, is 1.25, above the 1.1 limit, giving a cystatin C eGFR of 74. The combined creatinine-cystatin C eGFR is also 74. An eGFR between 60 and 89 is classified as stage G2 chronic kidney disease (mildly reduced function). In a lean 55-year-old woman with low muscle mass and no resistance training, creatinine can underestimate kidney impairment, and the cystatin C result is the more reliable measure. Her urea at 8.2 sits at the very top of its range (3.2 to 8.2), and the urea to creatinine ratio is 132.3, above the upper limit of 100, which can reflect dehydration, high protein intake relative to kidney clearance, or early renal changes. The GP should repeat cystatin C and creatinine together in three months to confirm, check blood pressure if not recently done, and ensure this is being tracked. The good news is that sodium at 138, chloride at 95, and corrected calcium at 2.43 are all within range, and serum osmolality at 288.7 is within the ideal band, suggesting overall fluid and electrolyte balance is adequate.\n\nHer bicarbonate is 19.7, just below the lower limit of 20. This is a mild metabolic acidosis. In the context of a mildly reduced eGFR, the kidneys may be less efficient at reclaiming bicarbonate, which is one of their earliest functions to decline. It is not urgent but is another reason the GP should be aware of the kidney picture.\n\nHer blood sugar control is reassuring overall. Fasting glucose at 4.5 is within the ideal range. HbA1c at 40 mmol/mol (5.9%) is within the normal range but above the optimal threshold of 36 mmol/mol. Insulin at 4.13 is within range and within the optimal band, and HOMA-IR at 0.83 confirms excellent insulin sensitivity. Her estimated average glucose at 6.6 is within range though slightly above the optimal of 6.2, and the TyG index at 8.51 is at the boundary of optimal. The C-peptide is 0.732 ug/L, below the lab range of 1.1 to 4.4 ug/L. C-peptide is produced in equal amounts to insulin by the pancreas, and in this context, with a normal glucose, normal HbA1c and low-normal insulin, a low C-peptide simply reflects low insulin demand. Her pancreas is not being asked to work hard, and it is producing exactly what is needed. This is consistent with her lean frame and modest carbohydrate intake, and is not a concern.\n\nHer liver is in very good health. ALT at 14 is well below the optimal limit of 25 for women. AST at 23 is comfortably within range. GGT at 20 is within the optimal range below 25. Bilirubin at 20 is within range. Albumin at 42 and total protein at 71 are both healthy. The APRI score is 0.296, well within the optimal band below 0.5, and the NAFLD fibrosis score is -1.18, within range. The De Ritis ratio (AST divided by ALT) is 1.64, marginally above the upper limit of 1.6. This ratio is elevated not because the AST is high but because the ALT is very low (14), which shrinks the denominator. When both enzymes are this low, the ratio loses its clinical meaning and this is not a concern. The FIB-4 score is 1.74, above the 1.45 threshold, but the laboratory notes that a score below 2 can be insignificant in the absence of other clinical indicators, and at 55, age pushes this calculation up. With ALT at 14, GGT at 20, albumin at 42 and a normal APRI, there is no other sign of liver scarring. Amylase at 78 and lipase at 46 are both comfortably within range, which is reassuring given her digestive symptoms and means the pancreas is functioning well.\n\nHer inflammation markers are mostly quiet. ESR is 1, about as low as it gets. Hs-CRP is 1.3, within the laboratory range of below 5, though above the optimal threshold of 1.0 that is used for cardiovascular risk stratification. A CRP between 1 and 3 places her in the intermediate cardiovascular risk category by the American Heart Association criteria, and in someone with her lipid profile, bringing this below 1 would be beneficial. Sources of low-grade inflammation to consider include smoking (the most potent), ultra-processed food most days, poor sleep, and chronic stress. The systemic immune-inflammation index at 177 is within the ideal range. The platelet to lymphocyte ratio at 52.9 is below the lower limit of 60, pulled down by the elevated lymphocyte count.\n\nHer lymphocytes at 3.67 are above the upper limit of 3.0. In a smoker with chronic stress and fibromyalgia, a mildly raised lymphocyte count can reflect chronic immune stimulation. It is not dramatically elevated and does not suggest a lymphoproliferative disorder, but it is worth the GP noting and repeating on the next blood test. Her white cell count at 7.49, neutrophils at 3.35, monocytes at 0.39, eosinophils at 0.05 and basophils at 0.03 are all within range. The NLR (neutrophil to lymphocyte ratio) is 0.91, within the laboratory range of 0.78 to 3.53 but below the optimal band of 1.0 to 2.0, pulled down by the high lymphocyte count.\n\nHer iron studies are balanced. Serum iron at 26.7 is within range, transferrin at 3.09 is healthy, transferrin saturation at 34.41% is within the optimal band of 25 to 40%, and TIBC at 71 is within range. Her ferritin at 39 is within the laboratory range but below the optimal of 40 for women. In someone with fibromyalgia and chronic fatigue, ferritin below 50 is associated with worsening fatigue and is worth improving through diet. Given her reflux and swallowing difficulties, iron-rich foods in her blended diet (such as blended lentils, spinach, or fortified cereals) are the gentlest route.\n\nHer vitamin D at 103 is within the optimal range of 75 to 120, which reflects her supplementation and is exactly where it should be. Her B12 at 675 is within the optimal range of 500 to 900, again reflecting supplementation and in good shape. Her folate at 9 is within range and above the optimal threshold of 8. Magnesium at 1.03 is within the optimal range of 0.85 to 1.05, and corrected calcium at 2.43 is within range. Her parathyroid hormone (PTH) is 0.77, below the lower limit of 0.98. PTH regulates calcium levels by telling the bones to release calcium and the kidneys to retain it. A low PTH with a normal calcium, as here, is called relative hypoparathyroidism and can be seen when vitamin D levels are sufficient (as hers are at 103), because the body does not need PTH to drive calcium absorption. Her vitamin D supplementation is the most likely explanation. It is not a concern in itself but is worth the GP being aware of.\n\nHer hormonal picture is consistent with established menopause. FSH at 119.48 is well above the postmenopausal range of 23 to 116.3, and LH at 77.68 is above the postmenopausal range of 15.9 to 54. Oestradiol is below 43, consistent with postmenopausal levels. Progesterone at 2.1 is within the postmenopausal range. The very high FSH confirms that her ovaries have ceased producing oestrogen and the pituitary is signalling as hard as it can. Her total testosterone at 1.8 is within the female range of 0.5 to 2.6, free testosterone at 0.0206 is within range, and bioavailable testosterone at 0.47 is within the optimal range. SHBG at 66 is within range. DHEA-S at 4.7 is within range. Cortisol at 478 is within the morning reference range of 145.4 to 619.4. Prolactin at 157 is within the postmenopausal range. The hormonal picture does not explain her symptoms. However, the absence of oestrogen in established menopause is associated with joint pain and stiffness, brain fog, disrupted sleep and fatigue, all of which she reports, and this is worth discussing with her GP in the context of whether hormone replacement therapy might help her symptom burden alongside the fibromyalgia.\n\nHer immune markers are reassuring. IgG at 7.2 is within range, IgA at 1.7 is within range, and IgM at 0.6 is within range, though sitting close to the lower limit of 0.5. IgE at 9.83 is well within range and shows no allergic drive. Rheumatoid factor at 14 is at the upper limit of the range (below 14). In someone with joint pain and stiffness, this is borderline and does not confirm rheumatoid arthritis, but it is worth mentioning to the GP alongside the clinical picture. Tissue transglutaminase IgA is negative at 0.375, which with adequate IgA levels effectively excludes coeliac disease as a cause of her bloating and digestive symptoms.\n\nHer tumour markers are all reassuring. CA125 at 3.7 is well within range. CA19-9 is below 1.2, well within range. CEA is below 0.5, well within range for a smoker.\n\nHer urine shows white blood cells at 50 (above the significant threshold of 10) and red blood cells at 120 (above the significant threshold of 25), with a bacterial count of 10^4 and the laboratory calling the culture a mixed growth with probable contamination. Nitrites are negative. The most likely explanation for these findings is sample contamination rather than infection, given the mixed growth, the absence of nitrites, and the laboratory's own assessment. However, the raised white cells and red cells should not be ignored entirely. At 55, the presence of red blood cells in the urine, even if likely from contamination on this occasion, warrants a clean repeat sample to confirm they are not present. If they persist on a clean catch, the GP should investigate further with urine cytology and potentially an ultrasound. She reports no urinary symptoms, which makes true infection unlikely.\n\nHer total antioxidant activity at 1.99 is above the upper limit of 1.77. This is usually driven by supplementation, particularly vitamin C, vitamin E, or polyphenol-rich foods, and is not a concern.\n\nHer creatine kinase at 64 is comfortably within range, which is expected given she does no resistance training. Platelets at 194 are within range. MCV at 88.6, MCH at 30.2 and MCHC at 341 are all within range. MPV at 12 is above the upper limit of 10.1. MPV measures the average size of platelets, and larger platelets are younger and more active. MPV can be elevated in smokers and in chronic inflammatory conditions. On its own it is a minor finding but fits the broader picture.\n\nHer PhenoAge is 47, eight years younger than her calendar age of 55. The markers driving this favourable gap are her low CRP, low white cell count, healthy albumin, and good glucose control. Despite the significant lipid burden and the kidney finding, her body's biological clock is running younger than expected, which is a genuine positive. The lifestyle changes in this report, particularly stopping smoking and improving sleep, have the potential to maintain and extend this advantage.\n\nHer uric acid at 184 sits at the very bottom of the range (184 to 464). While within range, a very low uric acid can occasionally be seen in low protein intake or oxidative stress. In someone eating a blended diet with possible reduced protein absorption, this is worth noting but not acting on beyond ensuring adequate protein intake.","is_retest":false,"lifestyle":"Stop smoking. This is the single most impactful change in the entire report. Smoking is driving the raised haemoglobin and red cell count, accelerating the arterial damage from an already very high ApoB and Lp(a), keeping CRP above optimal, and contributing to poor sleep. Every other change in this report delivers more benefit once smoking stops. Speak to the GP or a pharmacist about nicotine replacement or a structured quit programme. Why: smoking is behind or worsening at least four separate findings in this report.\nReduce ultra-processed food from most days to once or twice a week, and replace with whole foods in blended form: soups made from real vegetables, lentils, beans, chicken or fish blended to a texture that works with your swallowing. Anchor: batch-cook and blend two soups at the weekend so they are as convenient as the processed alternative. Why: ultra-processed food raises LDL and CRP, and with an ApoB of 1.74, this is one of the biggest dietary levers available.\nAdd oily fish (salmon, mackerel, sardines) or a tinned fish soup twice a week. Blend if needed. Anchor: one weekday dinner and one weekend lunch. Why: omega-3 fatty acids lower triglycerides, reduce inflammation (bringing CRP below 1.0), and support cardiovascular health against the Lp(a) burden.\nIncrease vegetables and fruit from 2 to 3 portions to at least 5 a day. Smoothies, blended soups and stewed fruit all count. Anchor: one portion at each of your four eating times plus one extra in a smoothie. Why: soluble fibre from oats, beans, lentils and fruit lowers LDL cholesterol, and at this LDL level every reduction counts.\nEnsure at least 80 grams of protein a day across your four meals (roughly 20 grams each). Protein powder in a morning smoothie, blended chicken or fish at lunch, lentil soup at dinner, Greek yoghurt as a snack. Why: your uric acid at the bottom of range and your lean frame suggest protein intake may be marginal, and adequate protein supports muscle, bone and immune function at 55.\nWalk for 20 minutes after your largest meal, building to 30 minutes over two weeks. Anchor: plate cleared, shoes on, out the door. Why: post-meal walking lowers glucose and LDL, supports kidney function, and is the easiest entry point to exercise with fibromyalgia.\nFix a wake time seven days a week and get outside within an hour of waking for at least 10 minutes of daylight. Set a caffeine cut-off at midday. Keep the bedroom cool. Anchor: alarm, shoes on, step outside before anything else. Why: under 6 hours of sleep with exhaustion on waking drives CRP, worsens fibromyalgia pain, and impairs the body's ability to clear cholesterol.\nAim for a calorie intake of approximately 1,600 to 1,750 kcal per day (maintenance for a 55.8 kg, 157 cm, sedentary woman is approximately 1,550 kcal; a small surplus supports her lean frame and protein target). Protein target: 73 to 89 grams per day (1.3 to 1.6 g per kg at her current activity, which should increase as she adds walking).","biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","units":"/100","result":"44","padding":"1","one_sided":"0.5","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","range_type":"no upper","description":"Your TrueScore is 44 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 44.3. Weakest systems: urinalysis 0%, lipids & cardiovascular 13%, thyroid 26%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), Haemoglobin.","high_causes":"","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4000","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","units":"years","result":"47","padding":"1","one_sided":"0.5","low_causes":"Low inflammation, healthy blood counts","range_type":"no lower","description":"PhenoAge is a biological age estimate based on blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 47, her biological age is eight years younger than her calendar age of 55. The drivers of this favourable gap are her low CRP (1.3), healthy albumin (42), excellent glucose control (4.5) and low white cell count (7.49). Despite the cardiovascular and kidney findings, her body's biological clock is running younger than expected, and the lifestyle changes in this report have the potential to maintain or extend this advantage.","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","lower_normal":"","upper_normal":"60","lower_optimal":"","upper_optimal":"55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3917","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4583"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","units":"/100","result":"100","padding":"1","one_sided":"0.5","low_causes":"Low ApoB, low LDL, high HDL, low triglycerides, low Lp(a), low CRP","range_type":"no lower","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the arterial risk being built right now, not a ten-year event probability. At 100, this is the maximum the index can register. The two primary drivers are the very high ApoB (1.74) and the raised Lp(a) (151.15). An elevated hs-CRP (1.3) and very high LDL (5.64) contribute further. The Lp(a) component is inherited and will not change, but reducing the ApoB and LDL through diet and potentially statin therapy will lower this score substantially.","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","units":"mmol/L","result":"4.5","padding":"1","one_sided":"0.5","low_causes":"Fasting, excessive insulin, adrenal insufficiency","range_type":"normal","description":"Blood glucose measures the amount of sugar circulating in the bloodstream after fasting. At 4.5, this is within the ideal range of 4.0 to 5.4 and shows excellent blood sugar regulation. The pancreas is releasing just enough insulin to keep glucose tightly controlled, which is confirmed by her low insulin and excellent HOMA-IR. This is a strong positive finding.","high_causes":"Insulin resistance, diabetes, stress, infection","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","units":"%","result":"5.9","padding":"1","one_sided":"0.5","low_causes":"Iron deficiency anaemia, haemolytic anaemia, blood loss","range_type":"normal","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been coated with sugar over the previous two to three months, giving a longer-term picture of blood sugar control than a single fasting glucose. At 5.9%, this is within the normal range (below 6.0%) but above the optimal threshold of 5.7%. The laboratory classifies below 6.0% as normal, 6.0 to 6.4% as pre-diabetes, and above 6.5% as diabetes. At 5 tion":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5641"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","units":"mmol/L","result":"95","padding":"1","one_sided":"0.5","low_causes":"Vomiting, metabolic alkalosis, excessive sweating, kidney disease","range_type":"normal","description":"Chloride works alongside sodium and bicarbonate to maintain fluid balance and the acid-base balance of the blood. At 95, this is at the lower limit of the laboratory range. It is worth noting alongside the low bicarbonate of 19.7, as both sitting at the lower end of their ranges can reflect a mild metabolic acidosis. This is consistent with the mildly reduced kidney function seen on cystatin C and is not a concern in isolation but fits the broader picture.","high_causes":"Dehydration, metabolic acidosis, kidney disease","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","units":"mmol/L","result":"19.7","padding":"1","one_sided":"0.5","low_causes":"Metabolic acidosis, kidney disease, diabetic ketoacidosis, diarrhoea","range_type":"normal","description":"Bicarbonate is the body's main buffer for maintaining the acid-base balance of the blood. The kidneys regulate bicarbonate levels by reclaiming it from the urine. At 19.7, this is just below the lower limit of 20, indicating a mild metabolic acidosis. In the context of a cystatin C eGFR of 74, the kidneys may be slightly less efficient at reclaiming bicarbonate, which is one of the earliest functions to decline in mild kidney impairment. It is not urgent but is another piece of evidence for the GP to consider alongside the kidney findings.","high_causes":"Metabolic alkalosis, vomiting, diu nd on muscle mass, is a more reliable marker in her case, and her cystatin C tells a different story.","high_causes":"Kidney disease, dehydration, high muscle mass, high meat intake","lower_normal":"49","upper_normal":"90","lower_optimal":"52","upper_optimal":"80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4390","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3577","upper_optimal_position":"0.5854"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","units":"mL/min/1.73m2","result":">90","padding":"1","one_sided":"0.5","low_causes":"Chronic kidney disease, acute kidney injury, dehydration","range_type":"no upper","description":"The estimated glomerular filtration rate (eGFR) based on creatinine estimates how well the kidneys are filtering waste from the blood. Reported as above 90, this looks normal. However, creatinine-based eGFR can overestimate kidney function in people with low muscle mass, and in this case the cystatin C-based eGFR of 74 provides a more accurate picture. The GP should rely on the cystatin C measure for monitoring.","high_causes":"Pregnancy, high cardiac output states","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","units":"umol/L","result":"184","padding":"1","one_sided":"0.5","low_causes":"Low purine diet, malabsorption, liver disease, SIADH, Fanconi syndrome","range_type":"normal","description":"Uric acid is a waste product from the breakdown of purines (found in certain foods and in the body's own cells). The kidneys excrete it. At 184, this is at the very bottom of the laboratory range (184 to 464) and below the optimal upper threshold of 320 for women. Very low ur ion":"Lipoprotein(a), often written Lp(a), is a type of LDL particle that carries an extra protein called apolipoprotein(a). This extra protein makes the particle stickier, more inflammatory, and harder for the liver to clear. Importantly, Lp(a) levels are largely determined by genetics and do not change with diet, exercise or any currently available lifestyle intervention. At 151.15 nmol/L, this is well above the 32 nmol/L target and in the moderate risk category (90 to 200). This means a significant portion of her elevated LDL is Lp(a)-LDL, which she cannot modify. This result should be recorded permanently as it will not change. First-degree relatives (children, siblings, parents) should be offered Lp(a) testing, as they have a 50% chance of inheriting the same variant. The GP should factor this into the overall cardiovascular risk assessment.","high_causes":"Genetics (inherited), kidney disease","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","units":"U/L","result":"64","padding":"1","one_sided":"0.5","low_causes":"Sedentary lifestyle, low muscle mass","range_type":"normal","description":"Creatine kinase (CK) is an enzyme found in muscles (skeletal, cardiac and smooth muscle). It rises when muscle is damaged, whether from exercise, injury or disease. At 64, this is within the optimal range and reflects her current low exercise level. If she starts resistance training as recommended, a mild rise in CK after sessions would be normal and expected.","high_causes":"Intense exercise, muscle injury, myositis, statins, hypothyroidism","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","within_normal":"TRUE","within_optimal":"TRUE","res .5","low_causes":"Healthy liver","range_type":"no lower","description":"The APRI (AST to Platelet Ratio Index) estimates the likelihood of liver fibrosis and cirrhosis. At 0.296, this is within the optimal range of below 0.5 and well below 1.5. This confirms there is no evidence of significant liver fibrosis, supporting the conclusion that the elevated FIB-4 score is an artefact of the calculation rather than a sign of liver disease.","high_causes":"Liver fibrosis, cirrhosis","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0987","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","units":"score","result":"-1.18","padding":"1","one_sided":"0.5","low_causes":"Healthy liver, lean BMI, young age","range_type":"informational","description":"The NAFLD Fibrosis Score estimates the likelihood of liver fibrosis in people with non-alcoholic fatty liver disease, using age, BMI, diabetes status, ALT, AST, platelets and albumin. At -1.18, this is within the reference range and close to the optimal boundary. A score below -1.455 is low probability of fibrosis, and between -1.455 and 0.676 is indeterminate. At -1.18 she falls in the indeterminate zone, but with all liver enzymes clean, a normal APRI and no fatty liver risk factors (lean BMI, no alcohol, no diabetes), there is no clinical concern here.","high_causes":"Advanced fibrosis in fatty liver disease","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":""},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","units":"ratio","result":"1.64","padding":"1","one_sided":"0.5","low_causes":"Fatty liver, viral hepatitis","range_type":"informational","description":"The De Ritis ratio divides AST by ALT and can help distinguish between different types of liver damage. At 1.64, this is marginally above the upper limit of 1.6. However, this ratio loses its clinical meaning when both enzymes are very low, as they are here (AST 23, ALT 14). The ratio is elevated because the ALT is so low (14) that it shrinks the denominator, not because the AST is high. With all liver markers being clean, this is not a concern.","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":""}],"report_date":"2026-10-31","patient_name":"Tracey Farrall","enrich_version":"v3","system_ratings":{"gut":{"note":"Glucose 4.5, HOMA-IR 0.83, amylase and lipase within range","label":"Optimal","level":"green"},"blood":{"note":"Haemoglobin 159, RBC 5.26, haematocrit 0.466, all above range in a smoker","label":"See your GP","level":"red"},"liver":{"note":"ALT 14, GGT 20, albumin 42, APRI 0.296, all clean","label":"Optimal","level":"green"},"cardio":{"note":"ApoB 1.74, LDL 5.64, Lp(a) 151, cardiovascular risk score 100","label":"See your GP","level":"red"},"immune":{"note":"Immunoglobulins within range, coeliac negative, RF borderline at 14","label":"Mostly good","level":"lime"},"kidney":{"note":"Cystatin C eGFR 74, urea at top of range, bicarbonate just below range","label":"Needs attention","level":"orange"},"special":{"note":"CK 64 within range, TAA 1.99 above range from supplementation","label":"Mostly good","level":"lime"},"thyroid":{"note":"TPO antibodies 179.9 and thyroglobulin antibodies 10.3, function currently normal","label":"Needs attention","level":"orange"},"urinary":{"not thin optimal range, but supplementation supports sleep quality (under 6 hours with exhaustion), muscle relaxation with fibromyalgia, and cardiovascular health. Why: magnesium glycinate is the form least likely to cause digestive discomfort, which matters with her reflux.\nContinue protein powder, ideally whey or a blend providing 20 to 25 grams per serving, taken at one of her four daily meals. Why: supports her protein target of 73 to 89 grams and helps maintain lean mass postmenopausally.\nDo not take iron supplements. Her ferritin at 39 is below the optimal of 40 but within range, and with her raised haemoglobin and red cell count, supplemental iron could worsen the polycythaemia picture. Improve iron through food sources (blended lentils, spinach, fortified cereals with vitamin C to aid absorption).\nThe most important changes from this report are not supplements. They are stopping smoking, replacing ultra-processed food with whole-food soups and meals, adding oily fish twice a week, improving sleep duration, and having the GP conversation about the lipid profile, red cell findings and thyroid antibodies.","enrich_missing_inputs":["potassium"],"enrich_fallback_descriptions":1};

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
