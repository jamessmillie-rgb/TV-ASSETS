ng healthy iron transport. This is a good result.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"26.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6090","lower_normal":"9","upper_normal":"30.4","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4112","upper_optimal_position":"0.6293","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood. At 26.7 umol/L, this is within the optimal range, indicating good iron availability. Iron fluctuates through the day and with meals, so it is best interpreted alongside transferrin saturation and ferritin, all of which are healthy in this report.","low_causes":"Iron deficiency, chronic disease, blood loss, poor absorption","high_causes":"Haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"3.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4846","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream. At 3.09 g/L, this is within the optimal range, indicating the body is producing a healthy amount of this transport protein. A normal transferrin alongside normal iron and saturation confirms balanced iron metabolism.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6137","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6241","units":"umol/L","description":"TIBC measures the blood's total capacity to bind and transport iron. At 71 umol/L, this is within the optimal range and consistent with the healthy transferrin and saturation levels. A normal TIBC helps exclude both iron deficiency (where it rises) and iron overload (where it falls).","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3677","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3689","upper_optimal_position":"0.4994","units":"ng/ml","description":"Ferritin is the body's iron storage protein. At 39 ng/ml, this is within the laboratory range (10 to 291) but sits just below the optimal floor of 40 for women. It is not deficient, but for someone reporting persistent fatigue, optimising ferritin toward 50 to 80 through iron-rich foods (red meat, lentils, dark leafy greens) may help. Given her haemoglobin is already above range, iron supplementation is not recommended; dietary sources are the safer route.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, inflammation, liver disease, haemochromatosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"138","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4615","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"142","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5641","units":"mmol/L","description":"Sodium is the main electrolyte in the blood, critical for fluid balance, nerve function and muscle contraction. At 138 mmol/L, this is within the optimal range, indicating healthy fluid and electrolyte balance.","low_causes":"Overhydration, heart failure, diuretics, SIADH","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. At 95 mmol/L, this sits at the very bottom of the laboratory range. A low-normal chloride can accompany a low bicarbonate, as both are involved in acid-base balance. This is within range and not a concern on its own.","low_causes":"Vomiting, diuretics, metabolic alkalosis, overhydration","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"19.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3242","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is a buffer that helps maintain the blood's acid-base balance. At 19.7 mmol/L, this is marginally below the lower limit of 20. The kidneys play a central role in bicarbonate regulation, so a mildly low bicarbonate is consistent with the reduced cystatin C eGFR of 74 seen in this report. It can also be affected by diet, hydration, and chronic conditions. This is a minor finding on its own, but it adds context to the kidney picture and is worth the GP noting.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, dehydration","high_causes":"Vomiting, metabolic alkalosis, diuretics, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"8.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product created when the body breaks down protein, filtered out by the kidneys. At 8.2 mmol/L, this sits exactly at the upper limit of the laboratory range, above the optimal ceiling of 7.0. A urea at the top of range can reflect mild dehydration, high protein intake relative to kidney filtration, or reduced kidney clearance. In the context of a cystatin C eGFR of 74, it is consistent with the mildly reduced filtration picture.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein intake, reduced kidney function, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4390","lower_normal":"49","upper_normal":"90","lower_optimal":"52","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3577","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a steady rate. At 62 umol/L, this is within the optimal range and gives a creatinine-based eGFR above 90. However, creatinine is influenced by muscle mass, and in a woman of 55.8 kg doing no resistance training, creatinine can be low simply because there is less muscle producing it. This is why the cystatin C eGFR of 74 is the more reliable measure of her true kidney filtration.","low_causes":"Low muscle mass, small body size, vegetarian diet","high_causes":"Reduced kidney function, high muscle mass, high meat intake, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood, calculated from creatinine, age and sex. A result above 90 is within the optimal range and suggests normal kidney filtration. However, in someone with low muscle mass and no resistance training, creatinine-based eGFR can overestimate true kidney function. Her cystatin C eGFR of 74 provides a more accurate picture and suggests mildly reduced filtration.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"Low muscle mass, pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"184","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"184","upper_normal":"464","lower_optimal":"184","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4952","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced by the body. At 184 umol/L, this sits at the very bottom of the laboratory range. Low uric acid is not typically a concern and can be seen with low dietary purine intake. Given her blended diet, this likely reflects lower intake of purine-rich foods. Uric acid also has antioxidant properties, so a very low level is worth noting but does not require action.","low_causes":"Low purine diet, kidney clearance, certain medications","high_causes":"Gout, high purine diet, kidney disease, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5682","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced by all cells and filtered by the kidneys at a constant rate. Unlike creatinine, it is not affected by muscle mass, diet or exercise, making it a more reliable marker of kidney filtration, especially in someone with low muscle mass. At 1.25 mg/L, this is above the upper limit of 1.1, and gives a cystatin C eGFR of 74, indicating mildly reduced kidney function. This should be discussed with her GP and repeated in three to six months to see whether it is stable.","low_causes":"Rarely clinically significant","high_causes":"Reduced kidney function, thyroid disease, inflammation, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR combines both creatinine and cystatin C for the most accurate estimate of kidney filtration. At 74, this confirms the mildly reduced filtration seen with the cystatin C alone. Both the cystatin C eGFR and the combined eGFR agree at 74, which is more reliable than the creatinine-only eGFR of above 90. This warrants GP awareness and monitoring.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Excellent kidney function","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"132.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8461","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio compares two waste products to help distinguish between causes of raised urea. At 132.3, this is above the upper limit of 100. A high ratio can reflect mild dehydration (urea rises more than creatinine with reduced fluid intake), high protein intake relative to kidney clearance, or gastrointestinal bleeding. In the context of her cystatin C eGFR of 74 and urea at the top of its range, this is most likely reflecting the mildly reduced kidney filtration and possibly suboptimal hydration. Adequate daily fluid intake (1.5 to 2 litres) may help.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"57","upper_normal":"82","lower_optimal":"62","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6133","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood, reflecting liver function, immune status and nutritional intake. At 71 g/L, this is within the optimal range, indicating healthy protein production and no deficiency.","low_causes":"Liver disease, malnutrition, kidney disease (nephrotic syndrome)","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It transports hormones, nutrients and medications and maintains fluid balance. At 42 g/L, this is within the optimal range, reflecting healthy liver synthetic function and adequate nutritional status. Albumin is also one of the inputs to the PhenoAge calculation, and a healthy level contributes to her favourable biological age.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5370","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/L","description":"Globulins are a group of proteins including antibodies and transport proteins. At 29 g/L, this is within the optimal range. Combined with normal immunoglobulin levels, this confirms a healthy immune protein profile.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, autoimmune conditions, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4952","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"ALP is an enzyme found in the liver and bone. At 80 IU/L, this is within the optimal range. A normal ALP alongside clean ALT and GGT is reassuring for both liver and bone health. In postmenopausal women, a rising ALP can indicate increased bone turnover, so this healthy level is a good sign.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bone disease, liver disease, bile duct obstruction, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6458","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. At 20 umol/L, this is near the top of the laboratory range but within it. With her elevated red cell count and haemoglobin, the liver is processing more red cell breakdown products than usual, which could account for the higher bilirubin. Her ALT and GGT are both clean, so this is not a sign of liver disease.","low_causes":"Rarely clinically significant","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1250","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT (alanine aminotransferase) is a liver enzyme released into the blood when liver cells are damaged. At 14 IU/L, this is well within the optimal range (below 25 for women), indicating no liver cell damage. This is an excellent result.","low_causes":"Rarely clinically significant; very low values may be seen with B6 deficiency","high_causes":"Liver disease, fatty liver, alcohol excess, medications, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart and muscles. At 23 IU/L, this is within the optimal range. A healthy AST alongside a healthy ALT confirms no significant liver or muscle damage.","low_causes":"B6 deficiency, rarely significant","high_causes":"Liver disease, heart attack, muscle damage, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.74","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that estimates the likelihood of liver fibrosis (scarring). It uses age, AST, ALT and platelet count. At 1.74, this is above the standard threshold of 1.45. However, at 55, age inflates the numerator, and her very low ALT of 14 makes the denominator small, which pushes the score up mathematically. Her actual liver enzymes (ALT 14, GGT 20, AST 23), albumin (42), APRI (0.296) and NAFLD fibrosis score (minus 1.18) are all healthy. The lab notes that in the absence of other clinical indicators, a score below 2 can be insignificant. Nonetheless, because it is above the threshold, her GP may wish to arrange a FibroScan to confirm there is no early fibrosis.","low_causes":"Generally healthy liver","high_causes":"Liver fibrosis, advancing age (inflates the calculation), low ALT, low platelets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4902","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme particularly sensitive to alcohol, medications and bile duct issues. At 20 IU/L, this is within the optimal range (below 25 for women), confirming the liver is under no metabolic strain. This is a clean result.","low_causes":"Rarely significant","high_causes":"Alcohol excess, fatty liver, bile duct disease, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amy","name":"Amylase","group":"DIGESTIVE","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5152","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands. It breaks down starch. At 78 IU/L, this is within the optimal range, indicating healthy pancreatic function. This is reassuring given her digestive symptoms.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"DIGESTIVE","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5674","lower_normal":"13","upper_normal":"60","lower_optimal":"20","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3830","upper_optimal_position":"0.6312","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. At 46 U/L, this is within the optimal range, confirming healthy pancreatic function. Together with a normal amylase, this provides reassurance that her reflux and digestive symptoms are not being caused by pancreatic disease.","low_causes":"Rarely significant","high_causes":"Acute pancreatitis, chronic pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5380","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.5789","units":"mmol/L","description":"Calcium is essential for bone strength, nerve signalling, muscle contraction and heart rhythm. At 2.43 mmol/L, this is within the optimal range. Healthy calcium alongside suppressed PTH and sufficient vitamin D confirms calcium homeostasis is well managed.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, vitamin D excess, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5250","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate picture of available calcium. At 2.43 mmol/L, this is within the optimal range. With a normal albumin of 42, the corrected and uncorrected values are the same, which is expected.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, vitamin D toxicity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6207","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is essential for muscle relaxation, nerve function, sleep, bone health and hundreds of enzyme reactions. At 1.03 mmol/L, this is within the optimal range of 0.85 to 1.05. For someone with fibromyalgia, poor sleep and chronic stress, maintaining good magnesium levels is particularly important. Supplementing with magnesium glycinate before bed may help with sleep quality.","low_causes":"Poor dietary intake, alcohol, diuretics, chronic stress, malabsorption","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"138","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the sodium reading for the effect of blood glucose on sodium measurement. At 138 mmol/L, this is the same as the uncorrected sodium, which is expected when glucose is normal at 4.5. Reported for context.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"288.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5617","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Serum osmolality estimates the concentration of dissolved particles in the blood, reflecting hydration and electrolyte balance. At 288.7 mOsm/kg, this is within the optimal range, indicating adequate hydration and healthy electrolyte balance.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"103","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5857","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood and muscle strength. It is made in the skin from sunlight and is often low in the UK, especially in winter. At 103 nmol/L, this is well within the optimal range of 75 to 120, confirming her supplementation is working effectively. She should continue her current vitamin D dose through the winter months.","low_causes":"Insufficient sunlight, poor dietary intake, dark skin, malabsorption, obesity","high_causes":"Excessive supplementation (risk of toxicity above 150)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Intact Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3147","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3351","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH (parathyroid sition":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6190","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in red blood cell production and DNA repair. At 9 ng/ml, this is within the optimal range (above 8). Green leafy vegetables are the main dietary source, so increasing vegetable portions from her current 2 to 3 a day would help maintain and build on this level.","low_causes":"Poor dietary intake, alcohol, malabsorption, medications (methotrexate, anti-epileptics)","high_causes":"Supplementation, rarely significant","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7529","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol fractions in the blood: LDL, HDL, VLDL and others. At 7.8 mmol/L, this is substantially above the desirable level of 5.18. It is the individual components (particularly LDL and ApoB) that matter most for risk, and both are significantly elevated in this report. This level warrants a GP discussion about treatment.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Genetics, diet high in saturated fat, hypothyroidism, menopause, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4059","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood used for energy. They rise after meals, with excess carbohydrate intake, and with insulin resistance. At 1.38 mmol/L, this is within the laboratory range (below 1.7) but above the optimal threshold of 1.0. Reducing ultra-processed food and refined carbohydrates would be expected to bring this toward the optimal range.","low_causes":"Low fat diet, hyperthyroidism, malnutrition","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4038","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. At 0.63 mmol/L, this is within the laboratory range (below 0.78) and close to the optimal ceiling of 0.6. VLDL is linked to triglyceride levels and insulin resistance, so this is consistent with her healthy insulin and HOMA-IR.","low_causes":"Low triglyceride levels","high_causes":"High triglycerides, insulin resistance, obesity, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7692","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7692","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol that removes excess cholesterol from artery walls and carries it back to the liver for disposal. At 1.6 mmol/L, this sits just above the desirable threshold of 1.55 and at the optimal floor of 1.6 for women. This is a genuinely good level and provides some counterbalance to the elevated LDL. Regular exercise would be expected to raise HDL further.","low_causes":"Smoking, inactivity, obesity, poor diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the cholesterol particle that deposits in artery walls and drives atherosclerosis. At 5.64 mmol/L, this is nearly double the upper limit of 3.0. Even after correcting for the cholesterol carried by Lp(a) (Lp(a)-corrected LDL is 5.15), the modifiable LDL remains substantially elevated. This is the primary driver of her cardiovascular risk and needs to be addressed with both dietary change and a GP conversation about lipid-lowering treatment.","low_causes":"Hyperthyroidism, malnutrition, liver disease, very low fat diet","high_causes":"Genetics, saturated fat intake, hypothyroidism, menopause, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.88","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5422","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol, giving a summary of the balance between harmful and protective cholesterol. At 4.88, this is above the limit of 4.5. It is driven by the very high total cholesterol rather than by poor HDL, which is actually at a good level. Reducing LDL through diet and, if needed, medication would bring this ratio down.","low_causes":"Low total cholesterol, high HDL","high_causes":"High total cholesterol, low HDL, elevated LDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"20.51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5128","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6250","upper_optimal_position":"1.0000","units":"%","description":"This shows what percentage of total cholesterol is the protective HDL type. At 20.51%, this is just above the 20% threshold. While HDL itself is at a reasonable level, the total cholesterol is so high that HDL makes up a smaller proportion than ideal. Lowering LDL would improve this percentage without needing to raise HDL.","low_causes":"Low HDL, very high total cholesterol","high_causes":"High HDL, low total cholesterol, active lifestyle","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4375","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-damaging) cholesterol particles: LDL, VLDL and others. At 6.2 mmol/L against a limit of 4.0, this is substantially elevated and reflects the combined LDL and Lp(a) burden. It is one of the most reliable single markers of cardiovascular risk.","low_causes":"Low total cholesterol, high HDL","high_causes":"Elevated LDL, elevated Lp(a), high triglycerides, genetics, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6179","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5357","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main protein in HDL particles and reflects the body's capacity to remove cholesterol from artery walls. At 1.73 g/L, this is above the normal threshold of 1.4 and well within the optimal range. A healthy ApoA1 is a genuine positive and reflects good reverse cholesterol transport. However, when paired with an ApoB of 1.74, the balance between damaging and protective particles is unfavourable.","low_causes":"Smoking, inactivity, obesity, metabolic syndrome, genetics","high_causes":"Exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.74","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9667","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein carried by every LDL, VLDL and Lp(a) particle. Each atherogenic particle carries exactly one ApoB molecule, so ApoB is the best single measure of how many artery-damaging particles are in the blood. At 1.74 g/L, this is classified as very high (above 1.4) and is nearly double the desirable level of 0.9. Part of this is driven by her raised Lp(a), but the majority reflects elevated LDL particle number. This is the most important cardiovascular marker in this report and the primary reason for a GP conversation about treatment.","low_causes":"Hyperthyroidism, malnutrition, statin therapy","high_causes":"Genetics, diet high in saturated fat, familial hypercholesterolaemia, menopause","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"151.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined particle that looks like LDL but carries an extra protein (apolipoprotein(a)) that makes it stickier, more inflammatory and harder for the body to clear. At 151 nmol/L, this is in the moderate risk band (90 to 200). Lp(a) is entirely inherited, cannot be changed by diet, exercise or most medications, and is a lifelong cardiovascular risk factor. It deposits cholesterol in artery walls, promotes clotting, and drives local inflammation. This level should be recorded permanently in her medical notes, and first-degree relatives (children and siblings) may wish to have their own Lp(a) tested. Because it is fixed, the most important action is to reduce all the modifiable risk factors around it: LDL, ApoB, diet, smoking and blood pressure.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.00578","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8381","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio compares the number of atherogenic (artery-damaging) particles (ApoB) to protective particles (ApoA1). At 1.01, this is well above the 0.6 threshold for women and places her in the higher-risk category (above 0.8). This is driven by the very high ApoB of 1.74 despite a healthy ApoA1 of 1.73. This is one of the strongest summary metrics for cardiovascular risk in this report.","low_causes":"Low ApoB, high ApoA1, statin therapy, healthy lifestyle","high_causes":"Elevated ApoB, low ApoA1, metabolic syndrome, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca1","name":"CA125","group":"TUMOR MARKERS","result":"3.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0597","lower_normal":"0","upper_normal":"31","lower_optimal":"0","upper_optimal":"31","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"CA125 is a protein that can be elevated in ovarian cancer but also rises with endometriosis, fibroids, pelvic inflammation and menstruation. At 3.7 U/ml, this is well within the normal range (below 31), providing reassurance.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic inflammatory disease, menstruation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca15","name":"CA15-3","group":"TUMOR MARKERS","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1333","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"CA15-3 is a tumour marker primarily used in monitoring breast cancer. At 8 U/ml, this is well within the normal range (below 30), providing reassurance. It is not a screening test for breast cancer and should be interpreted alongside clinical assessment and imaging.","low_causes":"Not clinically significant","high_causes":"Breast cancer, liver disease, lung disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"c19","name":"CA19-9","group":"TUMOR MARKERS","result":"< 1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"CA19-9 is a tumour marker that can be elevated in pancreatic, bile duct and gastrointestinal cancers. At below 1.2 U/ml, this is well within the normal range (below 37), providing reassurance. Given her digestive symptoms, a normal CA19-9 alongside normal amylase and lipase is a reassuring combination.","low_causes":"Not clinically significant","high_causes":"Pancreatic cancer, bile duct cancer, gastrointestinal cancers, gallstones, pancreatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"< 0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0610","lower_normal":"0","upper_normal":"4.1","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2805","units":"ng/ml","description":"CEA (carcinoembryonic antigen) is a tumour marker associated with colorectal and other cancers. At below 0.5 ng/ml, this is well within range. The smoker reference range goes up to 4.1 ng/ml, so even by that standard this is very low. This is reassuring.","low_causes":"Not clinically significant","high_causes":"Colorectal cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4911","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 is the unbound, available form of the main thyroid hormone thyroxine. The thyroid gland produces T4, which is then converted into the active hormone T3 in tissues. At 16.8 pmol/L, this is within the optimal range of 14 to 20, indicating the thyroid is producing an appropriate amount of hormone. Despite positive thyroid antibodies, the thyroid is functioning normally at present.","low_causes":"Hypothyroidism, pituitary disease, sick euthyroid syndrome","high_causes":"Hyperthyroidism, excess thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4539","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland in the brain and tells the thyroid how hard to work. When thyroid hormones are low, TSH rises; when they are high, TSH falls. At 2.08 mIU/L, this is within the optimal range of 1.0 to 2.5, confirming the thyroid is receiving the right level of stimulation and producing adequate hormones. Despite positive TPO and thyroglobulin antibodies, there is no sign yet that the immune attack is affecting thyroid output. Annual monitoring of TSH is recommended to catch any future change early.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, thyroid recovery, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism, energy production and body temperature. At 5.0 pmol/L, this is within the optimal range of 4.5 to 6.5, confirming the body is converting T4 into active T3 effectively. This is a reassuring finding in the context of positive thyroid antibodies.","low_causes":"Hypothyroidism, chronic illness, low calorie intake, high stress","high_causes":"Hyperthyroidism, excess T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"179.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3261","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly targets the thyroid gland. TPO is an enzyme the thyroid uses to make thyroid hormones. At 179.9 U/ml, this is significantly above the upper limit of 13.8, confirming the presence of autoimmune thyroid antibodies. This pattern is associated with a condition called Hashimoto's thyroiditis, the most common cause of hypothyroidism. Currently her thyroid function is normal, but the presence of these antibodies means she has a higher chance of developing an underactive thyroid over time. Annual TSH monitoring is recommended.","low_causes":"Normal (absence of autoimmune thyroid disease)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibodies","group":"THYROID","result":"10.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1477","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to store and produce thyroid hormones. At 10.3 U/ml, this is above the upper limit of 4.4 (more than 80% of the population have undetectable levels below 1.3). Positive thyroglobulin antibodies alongside positive TPO antibodies strengthen the association with autoimmune thyroid disease. As with the TPO antibodies, this warrants annual TSH monitoring but does not indicate current thyroid dysfunction.","low_causes":"Normal (absence of autoimmune thyroid disease)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.298","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3-to-FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into its active form (T3). At 0.298, this is within the optimal range, confirming efficient conversion. This is reassuring in the context of positive thyroid antibodies, as impaired conversion would be an early sign of the thyroid being affected.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"7.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3579","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant immunoglobulin (antibody) in the blood, providing long-term immunity against bacteria and viruses. At 7.2 g/L, this is within the laboratory range of 6.5 to 16, sitting in the lower portion. A low-normal IgG is common and not a concern in the absence of recurrent infections.","low_causes":"Immune deficiency, medications, nephrotic syndrome","high_causes":"Chronic infection, autoimmune conditions, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first antibody produced during an initial immune response. At 0.6 g/L, this is within the laboratory range. A lower IgM is normal and suggests no acute infection at the time of testing.","low_causes":"Immune deficiency, certain medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4731","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgA protects the mucous membranes of the gut, lungs and urinary tract. At 1.7 g/L, this is within the laboratory range and at a healthy level. A normal IgA is also necessary for the coeliac screen (tissue transglutaminase IgA) to be valid, which it is in this case.","low_causes":"Selective IgA deficiency (common, usually harmless), immune deficiency","high_causes":"Liver disease, coeliac disease, chronic infection, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"9.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0491","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"IU/ml","description":"IgE is the antibody class involved in allergic reactions and parasitic infections. At 9.83 IU/ml, this is well within the normal range and low, suggesting no significant allergic drive. This makes food allergy less likely as a cause of her bloating and digestive symptoms, though food intolerance (which is not IgE-mediated) is not excluded by this test.","low_causes":"Not clinically significant","high_causes":"Allergic conditions (hay fever, asthma, eczema), parasitic infection, drug allergy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rf","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"IU/ml","description":"Rheumatoid factor is an antibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. At 14 IU/ml, this sits exactly at the upper limit of the laboratory range. A borderline result does not diagnose rheumatoid arthritis; up to 15% of healthy people have a mildly positive rheumatoid factor. In the context of fibromyalgia and joint stiffness, it is worth her GP noting this alongside the positive thyroid antibodies, as autoimmune conditions sometimes cluster. If joint symptoms change, further investigation (anti-CCP antibodies) could be considered.","low_causes":"Normal (absence of rheumatoid arthritis or autoimmune disease)","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, other autoimmune conditions, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.375","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0261","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"CU","description":"Tissue transglutaminase IgA (tTG-IgA) is the primary screening test for coeliac disease, an autoimmune condition where gluten damages the small bowel lining. At 0.375 CU against an upper limit of 7.19, this is clearly negative. Combined with a normal IgA level (which confirms the test is valid), coeliac disease is very unlikely as a cause of her bloating and digestive symptoms, provided she has been eating gluten regularly.","low_causes":"Normal (absence of coeliac disease)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8227","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals. At 1.99 mmol/L, this is above the upper limit of 1.77. A raised level is commonly seen with vitamin supplementation (she takes vitamin D and B12) and dietary antioxidant intake. This is not a concern and does not indicate oxidative stress; it simply reflects a higher-than-average antioxidant capacity.","low_causes":"Poor diet, oxidative stress, chronic disease","high_causes":"Vitamin supplementation, high antioxidant diet, bilirubin elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"478","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5672","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"250","upper_optimal":"550","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4069","upper_optimal_position":"0.6179","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It regulates metabolism, immune function, blood pressure and the sleep-wake cycle. At 478 nmol/L, this is within the morning reference range and the optimal band. Despite reporting stress most days and poor sleep, her cortisol is not suppressed, which is reassuring. However, a single morning cortisol does not capture the full picture of her stress response; her pattern of exhaustion on waking with stress most days suggests the rhythm may be disrupted even if the total output is adequate.","low_causes":"Adrenal insufficiency, pituitary disease, chronic fatigue","high_causes":"Chronic stress, Cushing's syndrome, steroid medication, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"< 43","within_normal":"TRUE","within_optimal":"","result_position":"0.4546","lower_normal":"0","upper_normal":"118.2","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the main form of oestrogen. At below 43 pmol/L, this is within the postmenopausal reference range (0 to 118.2), confirming that the ovaries have stopped producing significant oestrogen. Low oestradiol is expected in established menopause and contributes to symptoms such as joint stiffness, fatigue, brain fog and bone density loss. She may wish to discuss HRT options with her GP if these symptoms are significantly affecting her quality of life.","low_causes":"Menopause, ovarian failure, low body fat, excessive exercise","high_causes":"Ovulation, pregnancy, oestrogen therapy, obesity, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"2.1","within_normal":"TRUE","within_optimal":"","result_position":"0.6351","lower_normal":"0","upper_normal":"2.32","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is produced by the ovaries after ovulation and during pregnancy. At 2.1 nmol/L, this is within the postmenopausal range (0 to 2.32), consistent with established menopause where ovulation has ceased.","low_causes":"Menopause, anovulation, luteal phase deficiency","high_causes":"Ovulation, pregnancy, ovarian cyst, adrenal disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"77.68","within_normal":"FALSE","within_optimal":"","result_position":"0.8738","lower_normal":"15.9","upper_normal":"54","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"LH (luteinising hormone) is produced by the pituitary gland and stimulates the ovaries. At 77.68 mIU/ml, this is above the postmenopausal reference range upper limit of 54. Elevated LH is expected in menopause as the pituitary gland signals vigorously to ovaries that are no longer responding. This confirms established menopause.","low_causes":"Pituitary disease, hypothalamic amenorrhoea, anorexia","high_causes":"Menopause, primary ovarian insufficiency, PCOS (in premenopausal women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"119.48","within_normal":"FALSE","within_optimal":"","result_position":"0.6780","lower_normal":"23","upper_normal":"116.3","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"FSH (follicle stimulating hormone) drives egg development in the ovaries. At 119.48 mIU/ml, this is just above the postmenopausal upper reference limit of 116.3. Like LH, elevated FSH confirms the pituitary is working hard to stimulate ovaries that are no longer producing eggs. This confirms established menopause.","low_causes":"Pituitary disease, hypothalamic amenorrhoea, pregnancy","high_causes":"Menopause, primary ovarian insufficiency, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5397","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"1.0","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4127","upper_optimal_position":"0.6032","units":"nmol/L","description":"Testosterone in women plays a role in libido, muscle strength, bone density, energy and mood. At 1.8 nmol/L, this is within the optimal range for women (1.0 to 2.2). A healthy testosterone level after menopause is a genuine positive and supports muscle maintenance, mood and energy.","low_causes":"Ageing, adrenal insufficiency, pituitary disease, high SHBG","high_causes":"PCOS, adrenal tumour, exogenous testosterone, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"2.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4572","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is biologically active. It is calculated from total testosterone and SHBG. At 2.73, this is within the optimal range, confirming an appropriate amount of active testosterone is available.","low_causes":"High SHBG, low testosterone, menopause","high_causes":"PCOS, low SHBG, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA Sulphate","group":"HORMONES","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4711","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3873","upper_optimal_position":"0.5736","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a building block for other hormones including testosterone and oestrogen. At 4.7 umol/L, this is within the optimal range. A healthy DHEA-S at 55 reflects good adrenal function.","low_causes":"Ageing, adrenal insufficiency, chronic stress","high_causes":"Adrenal tumour, PCOS, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"157","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4345","lower_normal":"38","upper_normal":"430","lower_optimal":"59","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3512","upper_optimal_position":"0.5986","units":"uIU/ml","description":"Prolactin is a pituitary hormone primarily involved in milk production, but it also affects mood, immune function and reproductive signalling. At 157 uIU/ml, this is within the postmenopausal range (38 to 430) and the optimal band. A normal prolactin excludes pituitary adenoma as a cause of her symptoms.","low_causes":"Rarely significant in isolation","high_causes":"Pituitary adenoma, medications (antipsychotics, SSRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4411","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3677","upper_optimal_position":"0.5369","units":"nmol/L","description":"SHBG is a protein that binds to sex hormones (testosterone, oestrogen) and controls how much is free and active. At 66 nmol/L, this is within the optimal range. A moderate SHBG allows a healthy amount of free testosterone to remain available, which is confirmed by her good free androgen index and bioavailable testosterone.","low_causes":"Obesity, insulin resistance, hypothyroidism, high androgen levels","high_causes":"Oestrogen therapy, hyperthyroidism, ageing, low body weight, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ftec","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.021","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3486","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.015","upper_optimal":"0.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3403","upper_optimal_position":"0.4583","units":"nmol/L","description":"Free testosterone is the small fraction of total testosterone not bound to proteins, and is the biologically active form. At 0.021 nmol/L, this is within the optimal range, confirming that an adequate amount of active testosterone is available for muscle, bone and energy functions.","low_causes":"High SHBG, low total testosterone, ageing","high_causes":"PCOS, low SHBG, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5879","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone includes both free testosterone and testosterone loosely bound const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
