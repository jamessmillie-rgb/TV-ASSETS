const REPORT_DATA = {"patient_name":"Tracey Farrall","dob":"06/10/1971","report_date":"2026-11-03","summary":"Customer is a 55-year-old female presenting with a BMI of 22.6, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food most days and sugary food rarely; portions are about average (volume 5 out of 10). She does no structured cardio or resistance training, with 2,000 to 5,000 daily steps. She sleeps under 6 hours a night, feels exhausted or wakes in the night, and is tired on waking. Stress feels hard to manage most days. She does not drink alcohol. She smokes tobacco. She takes vitamin D, vitamin B12 and protein powder. She has fibromyalgia and reflux issues causing swallowing difficulties, and eats a blended diet every four hours as a result. Her cycle has stopped, consistent with perimenopause or menopause. She reports low energy and fatigue, brain fog, bloating and digestive discomfort, and joint pain and stiffness, all of which she describes as having been present always. Her previous blood test showed everything as normal. Her goal is to improve long-term health and longevity.\n\nThe finding in this report that should be discussed with her GP first is the combination of a significantly raised cardiovascular risk profile and a pattern of results across the red cell line and kidney function that together warrant investigation.\n\nStarting with the cardiovascular picture, because it is the most important finding for her long-term health goal. Her total cholesterol is 7.8, her LDL cholesterol (the form that deposits in artery walls) is 5.64 against an upper limit of 3.0, and her ApoB (apolipoprotein B, a direct count of the particles that carry cholesterol into artery walls) is 1.74 against a target below 0.9. These are substantially elevated. Her Lp(a), which is lipoprotein(a), an inherited particle that behaves like a sticky, inflammation-promoting version of LDL, is 151 nmol/L against an ideal below 32. At this level, Lp(a) is a moderate independent risk factor for cardiovascular disease. It is entirely genetic, cannot be changed by diet or exercise, and does not respond to standard statin therapy. Even after correcting her LDL for the cholesterol carried by Lp(a), the Lp(a)-corrected LDL is 5.15, still well above the 3.0 limit. Her ApoB to ApoA1 ratio (a summary metric comparing atherogenic to protective particles) is 1.01 against an upper limit of 0.6 for women, placing her in the higher-risk category. Her non-HDL cholesterol is 6.2 against a limit of 4.0. Her Castelli II ratio (LDL divided by HDL) is 3.52, marginally above the 3.5 limit. Her cardiovascular risk score, a TrueVitals composite index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 100 out of 100, the highest the scale reaches. This is driven by the combination of very high ApoB, very high LDL, and raised Lp(a). On the positive side, her HDL (high-density lipoprotein, the protective cholesterol that carries lipids away from artery walls) is 1.6, which is genuinely good and sits just above the desirable threshold, and her ApoA1 at 1.73 is healthy. Her triglycerides at 1.38 are within the laboratory range and her VLDL at 0.63 is within range. Her atherogenic index of plasma is negative at minus 0.064, which is favourable and reflects the reasonable triglyceride-to-HDL balance. But these positives do not offset the scale of the LDL and ApoB elevation. She needs to discuss lipid-lowering treatment with her GP, and her Lp(a) level should be recorded permanently in her medical notes because it is a lifelong inherited risk factor. First-degree relatives may wish to have their Lp(a) tested.\n\nHer red cell line shows a pattern that needs investigation. Her haemoglobin is 159 g/L, above the female upper limit of 150. Her red blood cell count is 5.26, above the upper limit of 4.8. Her haematocrit (the proportion of blood volume occupied by red cells) is 0.466, just above the upper limit of 0.46. Her RDW (red cell distribution width, a measure of how variable the size of her red cells is) is 14.1, marginally above the upper limit of 14. Together these suggest polycythaemia, which simply means more red cells than expected. This can be a secondary response to chronic low oxygen levels (smoking is the most common cause, and she smokes), or it can occasionally reflect a primary bone marrow condition. Her reticulocyte absolute count (the number of brand-new red cells being released from the bone marrow) is 48.9, just below the lower limit of 50, which suggests the marrow is not actively overproducing at the moment. The most likely explanation at this stage is smoking-related secondary polycythaemia: the carbon monoxide in cigarette smoke binds to haemoglobin and reduces its oxygen-carrying capacity, so the body compensates by making more red cells. Her GP should check this with a repeat full blood count and, if the haemoglobin remains above 150, consider a JAK2 mutation test to exclude polycythaemia vera, which is a bone marrow condition. Stopping smoking would be expected to resolve this if it is secondary.\n\nHer kidney function shows a split picture. Her creatinine-based eGFR is above 90, which looks reassuring, but her cystatin C (a more reliable marker of kidney filtration that is not affected by muscle mass, diet or exercise) is 1.25, above the upper limit of 1.1, giving a cystatin C eGFR of 74 and a combined eGFR of 74. An eGFR between 60 and 89 is classified as mildly reduced kidney function. At 55, this is below what would be expected and needs monitoring. Her urea at 8.2 sits at the very top of its range, and her urea-to-creatinine ratio at 132.3 is above the upper limit of 100, which can suggest mild dehydration, a higher protein load relative to filtration, or early reduction in filtration rate. Her bicarbonate is 19.7, just below the lower limit of 20, which can accompany reduced kidney function because the kidneys are partly responsible for maintaining the body's acid-base balance. Her uric acid at 184 sits at the very bottom of its range. Her GP should be aware of the cystatin C result and may wish to repeat it in three to six months to establish whether this is stable or changing.\n\nHer thyroid panel shows a pattern associated with autoimmune thyroid disease. Her TSH (thyroid stimulating hormone, the brain's signal telling the thyroid how hard to work) is 2.08, within the laboratory range and within the optimal band. Her free T4 at 16.8 and free T3 at 5.0 are both within range, and her FT3-to-FT4 ratio at 0.298 is within the optimal band, meaning the thyroid is converting its storage hormone to its active form efficiently. However, her thyroid peroxidase antibodies (TPO) are 179.9 against an upper limit of 13.8, and her thyroglobulin antibodies are 10.3 against an upper limit of 4.4. Both are positive. This pattern, where the immune system is producing antibodies against the thyroid gland but the gland is still working normally, is associated with a condition called Hashimoto's thyroiditis. It does not mean she has an underactive thyroid now, but it does mean her risk of developing one over the coming years is higher than average. Her GP should be aware, and her TSH should be checked annually. If she develops worsening fatigue, weight gain, or cold intolerance beyond what she already experiences, the thyroid should be rechecked at that point.\n\nTurning to the positives. Her blood sugar control is excellent. Her fasting glucose is 4.5, right in the middle of the ideal range, and her HbA1c (a measure of average blood sugar over the past two to three months) is 40 mmol/mol, within the normal range below 42. Her fasting insulin at 4.13 is within the optimal band, and her HOMA-IR (a calculation that estimates how sensitive her cells are to insulin) is 0.83, which is optimal and means she is insulin-sensitive. Her TyG index at 8.51 sits at the edge of the optimal band. For someone eating ultra-processed food most days with fibromyalgia and chronic stress, this degree of insulin sensitivity is a genuinely reassuring finding. Her estimated average glucose at 6.6 is within range. Her liver is in very good health. Her ALT at 14 and GGT at 20 are both well within range and comfortably within the optimal bands. Her AST at 23 is within range. Her bilirubin at 20 is at the top of its range but within it, and with clean ALT and GGT this is not a concern. Her albumin at 42 is healthy, her total protein at 71 and globulin at 29 are within range. Her APRI score (a fibrosis index) at 0.296 is well within the optimal band, and her NAFLD fibrosis score at minus 1.18 is within range. Her FIB-4 score is 1.74, which is above the threshold of 1.45, and the lab suggests considering a FibroScan above 1.3. At 55, age pushes the FIB-4 calculation upward, and her actual liver enzymes are all clean, so the score is likely being driven by the calculation rather than by liver disease. However, because it is above the threshold, it is worth mentioning to her GP, who may wish to arrange a FibroScan to confirm there is no early fibrosis. Her De Ritis ratio (AST divided by ALT) is 1.64, marginally above the upper limit of 1.6; with both enzymes at low absolute values, this is arithmetic rather than pathology. Her amylase at 78 and lipase at 46 are both comfortably within range, confirming healthy pancreatic function.\n\nHer iron studies are balanced. Her serum iron at 26.7 is within range, her transferrin at 3.09 is healthy, her transferrin saturation at 34.41% sits within the optimal band, and her iron binding capacity at 71 is within range. Her ferritin at 39 is within the laboratory range but sits just below the optimal band of 40 to 150 for women. This is not deficient, but given her fatigue, it would be worth building it a little through diet, particularly as her blended diet may limit red meat intake.\n\nHer vitamin D at 103 nmol/L is within the optimal range of 75 to 120, which shows her supplementation is working well. Her B12 at 675 is within the optimal band of 500 to 900, again reflecting her supplementation. Her folate at 9 is within range and above the optimal floor of 8. Her calcium at 2.43 and corrected calcium at 2.43 are both within range. Her magnesium at 1.03 is within range and within the optimal band. Her PTH (parathyroid hormone, which regulates calcium and bone metabolism) is 0.77, below the lower limit of 0.98. With her calcium in a healthy range and her vitamin D well into the sufficient zone, suppressed PTH is the expected physiological response: the body does not need to mobilise calcium from bone, so it turns PTH down. This is not a concern in the context of adequate calcium and vitamin D.\n\nHer immune markers are reassuring. Her IgG at 7.2, IgA at 1.7 and IgM at 0.6 are all within range. Her IgE at 9.83 is low and within range, suggesting no significant allergic drive. Her tissue transglutaminase IgA is negative, which makes coeliac disease very unlikely as a cause of her bloating and digestive symptoms, provided she has been eating gluten. Her rheumatoid factor at 14 sits exactly at the upper limit of 14; this is borderline and in the context of fibromyalgia and joint stiffness, her GP may wish to note it but it does not confirm rheumatoid arthritis. Her ESR at 1 is very low and her hsCRP at 1.3 is within the laboratory range though above the optimal threshold of 1.0; for someone with fibromyalgia and chronic pain, this is a relatively low level of systemic inflammation. Her white cell count at 7.49, neutrophils at 3.35, monocytes at 0.39, eosinophils at 0.05 and basophils at 0.03 are all within range. Her lymphocytes at 3.67 are above the upper limit of 3.0. Mildly raised lymphocytes can be seen with smoking, chronic inflammation, stress responses, or viral infections. In the context of her other results and the fact that the total white cell count is within range, this is worth noting but not alarming; a repeat in three to six months would confirm whether it is persistent. Her platelet-to-lymphocyte ratio at 52.9 is below the lower limit of 60, driven by the raised lymphocytes and relatively low-normal platelets; this is a reflection of those inputs rather than a separate finding. Her systemic immune-inflammation index at 177 is within the optimal band.\n\nHer tumour markers are all reassuring. CA125 at 3.7 is well within range, CA15-3 at 8 is well within range, CA19-9 is below 1.2, and CEA is below 0.5. These are screening markers and normal results are expected; they do not rule out all cancers but they provide reassurance.\n\nHer hormonal picture is consistent with established menopause. Her FSH at 119.48 and LH at 77.68 are both elevated above the postmenopausal reference ranges (FSH just above the upper postmenopausal limit of 116.3, LH well above the upper postmenopausal limit of 54), confirming that the ovaries have stopped producing eggs. Her oestradiol is below 43 pmol/L, which is within the postmenopausal range, and her progesterone at 2.1 is within the postmenopausal range. Her testosterone at 1.8 is within range, her free testosterone at 0.021 is within range, her free androgen index at 2.73 is within range, and her bioavailable testosterone at 0.47 is within the optimal band. Her SHBG at 66 is within range. Her DHEA-S at 4.7 umol/L is within range. Her prolactin at 157 is within the postmenopausal range. Her cortisol at 478 is within the morning reference range of 145 to 619. Given that she reports stress most days, exhaustion on waking, and under 6 hours of sleep, the cortisol is not suppressed, which is reassuring, but the pattern of chronic stress, poor sleep and morning exhaustion is one that lifestyle changes can meaningfully improve.\n\nHer creatine kinase at 64 is within range, which is expected given the absence of resistance training. Her total antioxidant activity at 1.99 is above the upper limit of 1.77; this is commonly raised by vitamin supplementation (she takes vitamin D and B12) and by dietary antioxidants, and is not a concern.\n\nHer urinalysis shows raised white cells at 50 (significant is above 10) and raised red cells at 120 (significant is above 25). Her nitrites are negative and the urine culture shows mixed growth with probable contamination, meaning the laboratory considers the sample likely to have been contaminated during collection rather than reflecting a genuine infection. In a 55-year-old woman, microscopic haematuria (red cells in the urine above the significant threshold) should be discussed with her GP even when the culture suggests contamination, because it warrants exclusion of other causes. Her GP should arrange a repeat clean-catch midstream urine sample and, if the red cells are confirmed, may refer for further investigation.\n\nHer PhenoAge, an estimate of biological age calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 47 against her calendar age of 55, eight years younger. This is a genuinely positive finding and is driven by her good glucose control, low inflammation and healthy albumin. Her C-peptide at 0.732 ug/L is below the lower limit of 1.1 ug/L. With her glucose and HbA1c both healthy and her HOMA-IR optimal, this reflects low insulin demand rather than pancreatic insufficiency: her body simply does not need to produce much insulin because her cells respond to it efficiently.\n\nHer serum osmolality at 288.7 is within the optimal band. Her anion gap cannot be calculated as potassium was not returned. Her MPV (mean platelet volume) at 12 is above the upper limit of 10.1; larger platelets can be seen with increased platelet turnover or mild inflammation, and in isolation this is a minor finding. Her MCHC at 341 and MCH at 30.2 are both within range. Her MCV at 88.6 is within range.\n\nIn summary, the priorities for her GP conversation are the significantly elevated cardiovascular risk profile with raised Lp(a), the polycythaemia pattern most likely related to smoking, the reduced cystatin C eGFR, the positive thyroid antibodies requiring annual monitoring, the FIB-4 above threshold worth confirming with a FibroScan, and the urinary findings needing a repeat sample. Her blood sugar control, liver health, iron balance, vitamin levels, thyroid function, and immune markers are all reassuring. Her PhenoAge eight years below her calendar age confirms that her body is ageing well at the cellular level despite the symptoms she lives with. The biggest modifiable risk factors in this report are smoking and the lipid profile, and addressing those two things would have the largest impact on her longevity goal.","links":"The most striking feature of this report is the disconnect between a body that is metabolically healthy in many respects and a cardiovascular risk profile that is among the highest this panel can produce. Her glucose, insulin, HOMA-IR and liver markers are all excellent, her inflammation is low, and her PhenoAge is eight years below her calendar age. Yet her ApoB at 1.74, LDL at 5.64, and Lp(a) at 151 combine to give a cardiovascular risk score of 100 out of 100. The Lp(a) is inherited and fixed; the remaining LDL and ApoB elevation is the modifiable portion, but even correcting for Lp(a), her LDL is still 5.15 against a target of 3.0. This level of ApoB-driven risk at 55, combined with a genetic Lp(a) load, is likely to need pharmacological treatment alongside dietary change.\n\nThe polycythaemia pattern ties directly to smoking. Carbon monoxide from cigarettes binds to haemoglobin and reduces its ability to carry oxygen, so the body responds by producing more red cells. Her haemoglobin, red cell count and haematocrit are all above range, and her reticulocyte absolute count is marginally below range, suggesting the marrow has reached a new steady state rather than actively ramping up production. Her raised RDW fits this picture too, as the marrow produces cells of slightly more variable size under chronic stimulation. If she were to stop smoking, these values would be expected to normalise over weeks to months.\n\nHer cystatin C eGFR of 74 is the finding that does not fit neatly into the rest of the picture. Cystatin C is not affected by muscle mass, making it more reliable than creatinine-based eGFR in a woman of her build and activity level. The creatinine-based eGFR says above 90 because her creatinine is low, partly because she has relatively little muscle mass with no resistance training. The cystatin C tells a different story: mildly reduced filtration. Her borderline-low bicarbonate and urea at the top of its range are consistent with this. Whether this is a long-standing baseline or a recent change is unknown because her previous blood test did not include cystatin C. A repeat in three to six months will establish the trajectory.\n\nThe thyroid antibodies are a separate, parallel finding. Hashimoto's thyroiditis can coexist with other autoimmune tendencies; her rheumatoid factor sitting at the exact upper limit of its range is an interesting data point alongside fibromyalgia and joint stiffness, though it does not confirm a rheumatoid diagnosis. Her thyroid is functioning well at present, with TSH, FT4 and FT3 all in good positions, so the antibodies represent a future risk rather than a current problem.\n\nHer symptoms of fatigue, brain fog, joint pain, and bloating are real and persistent, but the blood results that might explain them (thyroid, anaemia, iron, B12, folate, coeliac, glucose, inflammation) are all either normal or positive. Her coeliac screen is negative, her iron is adequate, her B12 and folate are healthy, her thyroid hormones are normal, and her inflammation is low. The most likely drivers of her symptoms are the ones blood cannot measure: under 6 hours of sleep with nighttime waking, stress that feels hard to manage most days, fibromyalgia itself (which disrupts pain processing, sleep architecture and energy regulation), the reflux and swallowing difficulties that limit her diet to blended food every four hours, smoking, and the hormonal changes of established menopause. Addressing sleep, stress and smoking is where the largest symptomatic improvement is likely to come from.\n\nThe urinary findings are a loose end. The culture suggests contamination, but 120 red cells per microlitre is well above the significant threshold even accounting for sample quality. A repeat clean-catch sample will settle whether the haematuria is genuine. If confirmed, it needs urological investigation to exclude structural causes.","lifestyle":"Set a fixed wake time seven days a week, even on weekends, and get outside within thirty minutes of waking for natural light. Anchor: alarm goes off, curtains open or step outside before anything else. Why: a consistent wake time and morning light are the two most effective ways to improve sleep quality and reset the cortisol rhythm behind your pattern of exhaustion on waking and stress most days.\nAim for seven hours in bed with the room cool and dark, phone charging outside the bedroom from one hour before bed. Anchor: set a phone bedtime alarm one hour before your target. Why: under six hours of sleep drives fatigue, brain fog and inflammation, and improving it is the single biggest lever for your energy and your fibromyalgia symptoms.\nAdd a palm-sized portion of protein to every blended meal: Greek yoghurt, silken tofu, eggs, or your protein powder if needed. Anchor: protein goes in the blender first, before anything else. Why: at 55.8 kg you need roughly 73 to 89 grams of protein a day to maintain muscle and bone; with a blended diet and no resistance training, protein intake can easily fall short.\nSwap the ultra-processed convenience foods for home-prepared blended meals where possible, starting with one meal a day this week. Batch-cook soups, stews and smoothie bases at the weekend. Anchor: Sunday afternoon becomes your prep window. Why: ultra-processed food most days drives LDL cholesterol and ApoB higher, and reducing it is the dietary change with the biggest impact on your cardiovascular risk score of 100.\nBuild vegetables into your blended meals to move from 2 to 3 portions toward 5 a day. Spinach, cooked carrots, roasted beetroot and frozen peas all blend well. Anchor: add one extra vegetable to each blended meal. Why: soluble fibre from vegetables helps lower LDL cholesterol and supports the gut, which may help your bloating.\nWalk for fifteen minutes after your largest meal, every day. Anchor: last spoonful finished, shoes on, out the door. Why: a post-meal walk improves insulin sensitivity (already good, worth protecting), aids digestion, and adds to your step count toward 5,000 to 7,000 a day.\nBegin two short resistance sessions a week, even ten minutes of bodyweight exercises (squats, wall press-ups, step-ups). Anchor: attach them to a fixed day and time, for example Tuesday and Friday after your morning walk. Why: resistance training builds muscle that protects bone density in menopause, raises creatinine into a healthier range, and helps with fibromyalgia pain and joint stiffness.\nSpeak to your GP or a smoking cessation service about stopping smoking. Why: smoking is the most likely cause of your raised haemoglobin and red cell count, it worsens cardiovascular risk on top of an already high lipid profile, and it accelerates bone loss after menopause.","flags":"Cardiovascular risk: ApoB 1.74 (target below 0.9, classified as very high), LDL 5.64 (limit 3.0), non-HDL 6.2 (limit 4.0), total cholesterol 7.8, ApoB/A1 ratio 1.01 (limit 0.6 for women), Lp(a) 151.15 nmol/L (ideal below 32, moderate risk band), cardiovascular risk score 100/100. Lp(a)-corrected LDL 5.15, confirming the modifiable LDL fraction is still substantially elevated. HDL 1.6 and triglycerides 1.38 are favourable. GP discussion about lipid-lowering therapy is recommended, and Lp(a) should be recorded permanently. First-degree relatives may wish to have Lp(a) tested.\nPolycythaemia pattern: haemoglobin 159 (limit 150), red blood cell count 5.26 (limit 4.8), haematocrit 0.466 (limit 0.46), RDW 14.1 (limit 14). Reticulocyte absolute count 48.9, marginally below the lower limit of 50. Most likely smoking-related secondary polycythaemia. GP should repeat FBC and, if haemoglobin remains above 150, consider JAK2 mutation testing to exclude polycythaemia vera.\nReduced kidney filtration: cystatin C 1.25 (limit 1.1), cystatin C eGFR 74, combined eGFR 74. Urea 8.2 at the top of range, urea-to-creatinine ratio 132.3 (limit 100), bicarbonate 19.7 (lower limit 20). GP should be aware; repeat cystatin C in three to six months to establish trajectory.\nThyroid antibodies positive: TPO antibodies 179.9 (limit 13.8), thyroglobulin antibodies 10.3 (limit 4.4). TSH 2.08, FT4 16.8 and FT3 5.0 are all within range, so thyroid function is currently normal. This pattern is associated with Hashimoto's thyroiditis and warrants annual TSH monitoring.\nFIB-4 score 1.74, above the threshold of 1.45. ALT 14, GGT 20, AST 23, bilirubin 20, albumin 42 and APRI 0.296 are all normal. At 55, age inflates the FIB-4 calculation. The lab suggests considering a FibroScan above 1.3. GP may wish to arrange one to confirm no early fibrosis.\nLymphocytes 3.67, above the upper limit of 3.0. Total white cell count 7.49 is within range. May reflect smoking, chronic inflammation or stress. Worth repeating in three to six months.\nC-peptide 0.732 ug/L, below the lower limit of 1.1. With glucose 4.5, HbA1c 40 and HOMA-IR 0.83, this reflects low insulin demand and insulin sensitivity, not pancreatic insufficiency.\nUrinalysis: WBCs 50 (significant above 10), RBCs 120 (significant above 25), nitrites negative, culture shows mixed growth with probable contamination. The RBC count warrants a repeat clean-catch midstream sample. If haematuria is confirmed, further investigation is appropriate.\nMPV 12 fL, above the upper limit of 10.1. Isolated finding, may reflect increased platelet turnover. Minor.\nPTH 0.77 pmol/L, below the lower limit of 0.98. With calcium 2.43 and vitamin D 103, this is the expected physiological suppression and not a concern.\nTotal antioxidant activity 1.99, above the upper limit of 1.77. Likely driven by vitamin supplementation. Not a concern.\nReassuring negatives: glucose 4.5, HbA1c 40, HOMA-IR 0.83 and insulin 4.13 do not suggest diabetes or insulin resistance. ALT 14 and GGT 20 exclude significant liver injury. ESR 1 and hsCRP 1.3 exclude significant systemic inflammation. Coeliac screen negative. CA125 3.7, CA15-3 8, CA19-9 below 1.2 and CEA below 0.5 are all well within range. IgG, IgA, IgM and IgE within range. Vitamin D 103, B12 675 and folate 9 are all sufficient. Thyroid hormones within range. Testosterone and free testosterone within range for a postmenopausal woman.","recommendations":"Discuss the lipid profile with your GP, bringing these numbers: ApoB 1.74 (target below 0.9), LDL 5.64 (limit 3.0), Lp(a) 151 nmol/L (inherited, moderate risk band). Given the combined burden of elevated ApoB and raised Lp(a) at 55, lipid-lowering medication is likely to be recommended alongside dietary changes. Ask the GP to record the Lp(a) level permanently.\nAsk the GP to review the polycythaemia pattern: haemoglobin 159 (limit 150), RBC 5.26 (limit 4.8), haematocrit 0.466 (limit 0.46). A repeat FBC should be arranged. If haemoglobin remains above 150, a JAK2 mutation test would exclude polycythaemia vera. Smoking cessation is the most important intervention.\nAsk the GP to note the cystatin C eGFR of 74, which suggests mildly reduced kidney filtration. A repeat cystatin C in three to six months will establish whether this is stable or declining.\nMention the positive thyroid antibodies: TPO 179.9 (limit 13.8) and thyroglobulin 10.3 (limit 4.4). Thyroid function is normal now, but annual TSH monitoring is recommended to catch any future decline early.\nMention the FIB-4 score of 1.74 (threshold 1.45). All liver enzymes are clean, so this is likely age-driven, but the GP may wish to arrange a FibroScan to confirm.\nAsk for a repeat clean-catch midstream urine sample to investigate the raised urinary red cells at 120 (significant above 25). If confirmed, further urological investigation may be appropriate.\nDiscuss smoking cessation support. Smoking is the most likely driver of the polycythaemia, adds to the cardiovascular risk, and worsens bone density after menopause.\nCalorie and protein targets: maintenance calories are approximately 1,500 to 1,600 per day (BMR roughly 1,230 multiplied by a sedentary factor of 1.3), which at her current weight and BMI of 22.6 is appropriate for weight maintenance. Protein target: 73 to 89 grams per day (1.3 to 1.6 g per kg at a target activity level including resistance training). On retest in four to six months, repeat: FBC, cystatin C, TSH, lipid profile including ApoB, and a clean-catch urine sample.","supplementation":"Continue vitamin D3 (cholecalciferol) at 2,000 IU daily, taken with a fat-containing meal. Her level at 103 nmol/L is within the optimal range, so the current dose is maintaining it well. If her brand gives more than 2,000 IU, she could reduce to 2,000 to stay in the 75 to 120 sweet spot.\nAdd vitamin K2 (MK-7), 100 mcg daily, taken at the same time as vitamin D. Why: K2 directs calcium into bone rather than arteries, which matters both for bone density after menopause and for cardiovascular health with her lipid profile.\nContinue vitamin B12 as sublingual methylcobalamin, 1,000 mcg daily. Her B12 at 675 is within the optimal band, so the current approach is working.\nMagnesium glycinate, 300 mg, taken before bed. Why: magnesium supports sleep quality (she is getting under six hours with nighttime waking), muscle relaxation (relevant for fibromyalgia), and her current level of 1.03 is within range but would benefit from staying there.\nOmega-3 fish oil, 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 has a modest LDL-lowering effect and a stronger triglyceride-lowering effect, supports the anti-inflammatory environment her fibromyalgia needs, and complements whatever lipid-lowering medication her GP may prescribe.\nContinue protein powder as needed to reach 73 to 89 grams of protein per day. A whey or plant-based isolate blended into meals is practical given her blended diet.\nDO NOT take iron supplements. Her ferritin at 39 is adequate and her transferrin saturation at 34% is within the optimal range. With a haemoglobin already above range, additional iron would worsen the polycythaemia.\nThe most important changes from this report are not supplements. They are stopping smoking, discussing lipid-lowering treatment with her GP, improving sleep to at least seven hours, reducing ultra-processed food, and beginning resistance training.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 44 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 44.1. Weakest systems: urinalysis 0%, lipids & cardiovascular 12%, thyroid 26%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), Haemoglobin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3917","lower_normal":"","upper_normal":"60","lower_optimal":"","upper_optimal":"55","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4583","units":"years","description":"PhenoAge is a biological age estimate calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 47 against a calendar age of 55, this places her biological age eight years younger than her actual age. This is a genuinely positive finding, driven by her healthy glucose, low inflammation, good albumin and normal MCV. It confirms that at the cellular level, her body is ageing well, and the lifestyle changes recommended in this report should help maintain or widen this gap.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"100","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built right now, not a ten-year event probability. At 100, this is the maximum the scale reaches, driven by the very high ApoB (1.74), very high LDL (5.64) and raised Lp(a) (151). The Lp(a) is inherited and cannot change, but reducing ApoB and LDL through diet and medication would bring this score down significantly. A score below 20 is ideal and below 40 is acceptable.","low_causes":"Low ApoB, low LDL, high HDL, low triglycerides, low Lp(a), low CRP","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose is the amount of sugar circulating in the bloodstream after fasting. At 4.5 mmol/L, this sits comfortably within the optimal range of 4.0 to 5.4, meaning her body is regulating blood sugar efficiently. Combined with a healthy HbA1c and low insulin, this confirms excellent glucose control despite chronic stress and poor sleep, both of which can push glucose upward.","low_causes":"Fasting, excessive insulin production, adrenal insufficiency","high_causes":"Insulin resistance, diabetes, stress, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4917","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4750","units":"%","description":"HbA1c expressed as a percentage. At 5.9%, this is just below the 6.0 pre-diabetes threshold and within the normal range, though it sits above the optimal ceiling of 5.7%. This reflects average blood sugar over two to three months. Her red cell turnover (raised haemoglobin and RBC count) could modestly affect this reading. When combined with her excellent fasting glucose and low insulin, overall glucose control is reassuring.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Poor blood sugar control, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4762","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin with sugar attached to it, reflecting average blood sugar control over two to three months. At 40 mmol/mol, this is within the normal range (below 42) and above the optimal ceiling of 36. While the number is healthy, it sits in the upper portion of normal. With fasting glucose at 4.5 and insulin at 4.13, the overall picture is one of good glucose control. Reducing ultra-processed food and increasing vegetable intake would be expected to edge this lower over time.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Insulin resistance, pre-diabetes, diabetes, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3562","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. At 4.13 mIU/L, this is within the optimal range of 2 to 8, indicating that her cells respond well to insulin and the pancreas does not need to work hard. This is an excellent result and, combined with her glucose of 4.5 and HOMA-IR of 0.83, confirms she is insulin-sensitive.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, high carbohydrate diet, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.732","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2962","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"4.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"ug/L","description":"C-peptide is released in equal amounts to insulin when the pancreas produces it, and is a reliable measure of how much insulin the body is making. At 0.732 ug/L, this is below the lower limit of 1.1. However, when glucose is 4.5, HbA1c is 40 and HOMA-IR is 0.83, a low C-peptide simply means the pancreas does not need to produce much insulin because her cells are responding efficiently. This is a sign of insulin sensitivity, not pancreatic insufficiency.","low_causes":"Insulin sensitivity, low carbohydrate intake, type 1 diabetes","high_causes":"Insulin resistance, pancreatic tumour (insulinoma), obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4433","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) estimates how resistant the body's cells are to insulin. It is calculated from glucose and insulin. At 0.83, this is within the optimal range and below 1.0, which the laboratory considers insulin-sensitive. This is an excellent result confirming her body handles blood sugar efficiently.","low_causes":"High insulin sensitivity, low carbohydrate intake","high_causes":"Insulin resistance, obesity, high sugar and refined carbohydrate diet, physical inactivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4714","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood sugar over two to three months. At 6.6 mmol/L, this is within the reference range (below 7) but above the optimal ceiling of 6.2. This is consistent with the HbA1c of 40, which sits in the upper portion of normal. With a fasting glucose of 4.5 and HOMA-IR of 0.83, her glucose control is good overall.","low_causes":"Low HbA1c, haemolytic conditions","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4835","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index (triglyceride-glucose index) is an alternative marker of insulin resistance derived from triglycerides and glucose. At 8.51, this is within the reference range (below 8.8) and at the edge of the optimal ceiling of 8.5. This is consistent with her other metabolic markers showing good insulin sensitivity, with a minor contribution from triglycerides being slightly above optimal.","low_causes":"Excellent insulin sensitivity, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"159","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7667","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. At 159 g/L, this is above the female upper limit of 150. Elevated haemoglobin alongside a raised red blood cell count and haematocrit suggests polycythaemia. The most common cause in someone who smokes is carbon monoxide exposure reducing oxygen-carrying capacity, prompting the body to make more red cells. This should be discussed with her GP.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders","high_causes":"Smoking, dehydration, chronic hypoxia, polycythaemia vera","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8200","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. At 5.26, this is above the female upper limit of 4.8 and consistent with the elevated haemoglobin and haematocrit. Together these three markers form the polycythaemia pattern most likely driven by smoking.","low_causes":"Anaemia, blood loss, bone marrow suppression, B12 or folate deficiency","high_causes":"Smoking, dehydration, chronic hypoxia, polycythaemia vera","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.466","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6867","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.466, this is just above the female upper limit of 0.46. It moves in tandem with haemoglobin and red cell count, and its mild elevation is part of the same polycythaemia pattern. A repeat with the GP will confirm whether it remains above range.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Smoking, dehydration, chronic hypoxia, polycythaemia vera","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"14.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6806","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.8","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5972","units":"%","description":"RDW measures how much variation there is in the size of red blood cells. At 14.1%, this is marginally above the upper limit of 14. A mildly raised RDW can occur when the bone marrow is producing red cells at an increased rate (as with the polycythaemia pattern seen here) or when there is a nutritional deficiency. With her iron, B12 and folate all within range, the most likely explanation is the increased red cell production driven by smoking.","low_causes":"Rarely clinically significant","high_causes":"Iron, B12 or folate deficiency, mixed anaemia, chronic disease, increased red cell production","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"88.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4370","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fL","description":"MCV measures the average size of each red blood cell. At 88.6 fL, this is within the optimal range, indicating that the red cells are a normal size. This helps exclude iron deficiency (which shrinks cells) and B12 or folate deficiency (which enlarges them).","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"30.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"pg","description":"MCH measures the average amount of haemoglobin inside each red blood cell. At 30.2 pg, this is within the optimal range, confirming the red cells are well filled with haemoglobin and functioning normally.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcgl","name":"MCHC","group":"HEMATOLOGY","result":"341","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6222","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC is the average concentration of haemoglobin within each red blood cell. At 341 g/L, this is within the normal and optimal range, meaning each red cell is carrying an appropriate density of haemoglobin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, severe dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"194","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3897","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that clot the blood when a vessel is damaged. At 194, this is within the normal and optimal range, confirming healthy platelet production and no clotting concerns.","low_causes":"Viral infections, bone marrow disorders, autoimmune conditions, medications","high_causes":"Iron deficiency, inflammation, infection, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8778","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are younger and more reactive. At 12 fL, this is above the upper limit of 10.1. A raised MPV can be seen with increased platelet turnover, smoking, mild inflammation, or simply as a normal variant. With a normal platelet count and no other haematological concerns beyond the polycythaemia pattern, this is a minor finding in isolation.","low_causes":"Bone marrow suppression, aplastic anaemia","high_causes":"Increased platelet turnover, smoking, inflammation, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"7.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5272","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"White blood cells are the immune system's defence force. At 7.49, this is within the optimal range, indicating a normally active immune system without signs of infection or immune suppression.","low_causes":"Viral infection, autoimmune conditions, bone marrow suppression, low energy availability","high_causes":"Infection, inflammation, smoking, stress, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"3.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4233","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. At 3.35, this is within the optimal range, confirming healthy immune function with no evidence of bacterial infection or immune suppression.","low_causes":"Viral infection, autoimmune conditions, medications, low energy availability","high_causes":"Bacterial infection, inflammation, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"3.67","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7783","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for the adaptive immune response, including fighting viral infections and producing antibodies. At 3.67, this is above the upper limit of 3.0. Mildly raised lymphocytes can be seen with smoking, chronic stress, low-grade viral responses, or autoimmune conditions. With a normal total white cell count and no other concerns, this is worth repeating in three to six months to check if it is persistent rather than a one-off finding.","low_causes":"Acute stress, steroid use, HIV, autoimmune conditions","high_causes":"Viral infection, smoking, chronic inflammation, stress, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4125","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf dead cells and pathogens and help coordinate the immune response. At 0.39, this is within the optimal range, suggesting no chronic infection or inflammatory process driving monocyte production.","low_causes":"Bone marrow disorders, steroid use","high_causes":"Chronic infection, inflammation, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and parasitic infections. At 0.05, this is low within the normal range, consistent with her low IgE and suggesting no significant allergic or parasitic process.","low_causes":"Steroid use, acute stress","high_causes":"Allergies, asthma, parasitic infection, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells, involved in allergic and inflammatory responses. At 0.03, this is within the normal range and unremarkable.","low_causes":"Rarely clinically significant","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4050","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.6","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells freshly released from the bone marrow. As a percentage, 0.93% is within the normal range, suggesting a normal rate of new red cell production relative to total red cells. The absolute count below gives a more precise picture.","low_causes":"Bone marrow suppression, iron or B12 deficiency, chronic disease","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocyte Absolute Count","group":"HEMATOLOGY","result":"48.918","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3261","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of immature red blood cells being released from the bone marrow. At 48.9, this is marginally below the lower limit of 50. With haemoglobin, red cell count and haematocrit all above range, a marginally low absolute reticulocyte count suggests the bone marrow has reached a new steady state rather than actively increasing production. This is a useful data point for the GP when assessing the polycythaemia pattern.","low_causes":"Bone marrow suppression, iron or B12 deficiency, chronic kidney disease, aplastic anaemia","high_causes":"Blood loss, haemolysis, recovery from anaemia, erythropoietin therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"16.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index (MCV divided by red blood cell count) is used to help distinguish iron deficiency anaemia from thalassaemia trait. At 16.8, with a normal MCV, the index is not applicable and is reported for context only.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle in a tube over an hour, which increases when there is inflammation in the body. At 1 mm/hour, this is very low and well within range, suggesting no significant inflammatory process. Combined with an hsCRP of 1.3, this rules out major systemic inflammation, which is reassuring given her fibromyalgia
