ormal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and cystatin C for a more accurate estimate of kidney filtration than either alone. At 93, this is within the optimal range and confirms healthy kidney function at 20.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"51.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3978","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between pre-renal (dehydration, high protein), renal, and post-renal causes of kidney changes. At 51.6, this is within the optimal range and indicates normal kidney physiology and adequate hydration.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4400","upper_optimal_position":"0.6400","units":"g/L","description":"Total protein measures the combined albumin and globulin in the blood. At 74, this is within the optimal range and indicates healthy protein levels overall.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3958","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It transports hormones, vitamins, and drugs, and maintains fluid balance. At 37, this is within the laboratory range but below the optimal floor of 40. In a 20-year-old with good nutrition, albumin should ideally be above 40. The slightly low level may be influenced by the systemic inflammation (CRP 6.8), as albumin is a negative acute-phase reactant, meaning it falls when inflammation is present. It should rise once the inflammation resolves.","low_causes":"Inflammation, liver disease, kidney disease, malnutrition","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6852","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"33","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/L","description":"Globulin is the protein fraction that includes the immunoglobulins (antibodies) and other proteins involved in immune function and inflammation. At 37, this is marginally above the upper limit of 36. With all individual immunoglobulins (IgG, IgM, IgA) within their normal ranges, the slight elevation is most likely driven by the immune activation reflected in the raised CRP. It is not a concern on its own and should normalise as the inflammation resolves.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5381","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.6381","units":"IU/L","description":"ALP is an enzyme found in the liver, bones, and bile ducts. At 89, this is within range. At 20, ALP can still be slightly elevated from bone growth, but 89 is comfortably mid-range and unremarkable.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bone growth, liver disease, bile duct obstruction, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced from the breakdown of red blood cells. At 9, this is within the optimal range and indicates normal red cell turnover and healthy liver clearance.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1518","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT is an enzyme concentrated in the liver that leaks into the blood when liver cells are damaged or inflamed. At 17, well below the male optimal ceiling of 30, this indicates the liver is under no strain. A clean ALT alongside a clean GGT is one of the strongest reassuring markers for liver health.","low_causes":"","high_causes":"Liver disease, fatty liver, medication, alcohol, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/L","description":"AST is an enzyme found in the liver, heart, and muscles. At 23, this is within the optimal range. It is not specific to the liver, but alongside a clean ALT, it is reassuring.","low_causes":"","high_causes":"Liver disease, muscle damage, heart disease, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1310","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3448","units":"","description":"FIB-4 is a calculated score that uses age, AST, ALT and platelet count to estimate the likelihood of liver fibrosis (scarring). At 0.38, this is very low and makes significant liver fibrosis extremely unlikely.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, advancing age, low platelets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4348","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4348","units":"IU/L","description":"GGT is a liver enzyme that is particularly sensitive to alcohol, medication, and metabolic stress. At 25, this is within the laboratory range and right at the optimal ceiling. For a 20-year-old who does not drink alcohol, this is a normal level and indicates the liver is not under metabolic strain.","low_causes":"","high_causes":"Alcohol, liver disease, medication, metabolic syndrome, bile duct disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5341","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas to break down starch. At 83, this is mid-range and indicates the pancreas is producing this enzyme normally. This makes pancreatitis very unlikely as a cause of the bloating.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4823","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3475","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a digestive enzyme produced by the pancreas to break down fats. At 34, this is within the optimal range and confirms the pancreas is functioning normally.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4971","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is essential for bones, muscle contraction, nerve signalling, and blood clotting. At 2.36, this is within the optimal range and well maintained despite the very low vitamin D.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, cancer, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5750","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.3","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the calcium level for the albumin concentration, giving a more accurate picture when albumin is low or high. At 2.49, this is within the optimal range. Despite the vitamin D deficiency, the body is maintaining calcium well, which is partly why the PTH has not risen.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption","high_causes":"Hyperparathyroidism, cancer, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6954","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is essential for over 300 enzyme reactions in the body, including energy production, muscle contraction, and nerve function. At 1.16, this is above the upper laboratory limit of 1.11. Mild magnesium elevation is most commonly caused by supplementation. If supplementing, the dose should be reduced or paused and the level rechecked. If not supplementing, a repeat test would be useful to confirm.","low_causes":"Poor dietary intake, alcohol, diuretics, gastrointestinal loss","high_causes":"Supplementation, kidney impairment, excessive intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"29","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2333","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood, and muscle recovery. At 29, this is classified as deficient (below 30 nmol/L), well below the sufficient threshold of 50 and far from the optimal range of 75 to 120. This is despite supplementation, which means the dose being taken is not high enough. Vitamin D deficiency is associated with impaired immune function, which is relevant to the frequent illness, and with poor muscle recovery, which is relevant to the exercise recovery complaints. A loading course of 4,000 IU daily for at least 12 weeks, taken with a fat-containing meal, is needed.","low_causes":"Insufficient sunlight, low dietary intake, inadequate supplementation, malabsorption, dark skin","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3796","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3351","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH is released by the parathyroid glands to raise blood calcium when it falls, partly by activating vitamin D. At 1.5, this is within the optimal range. Despite the vitamin D being deficient at 29, PTH has not risen, most likely because the corrected calcium at 2.49 is well maintained, so the parathyroid glands have not been triggered.","low_causes":"Hypoparathyroidism, magnesium deficiency, high calcium","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"462","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4470","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. At 462, this is within the laboratory range but below the optimal floor of 500, despite supplementation. Switching to sublingual methylcobalamin at 1,000 mcg daily, which dissolves under the tongue and bypasses the gut for better absorption, should raise the level into the optimal range.","low_causes":"Poor dietary intake (vegan or vegetarian), malabsorption, pernicious anaemia","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6429","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis and red blood cell production. At 16, this is near the top of the range and well within optimal. A healthy folate level makes folate deficiency very unlikely as a contributor to the anaemia, confirming iron as the limiting factor.","low_causes":"Poor dietary intake, malabsorption, coeliac disease, pregnancy, medication","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"6.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6800","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP is a marker of systemic inflammation. Unlike the standard CRP used to detect infection, hs-CRP is sensitive enough to pick up the low-grade inflammation that drives cardiovascular disease, metabolic dysfunction, and immune impairment. At 6.8, this is above the laboratory limit of 5 and well above the optimal of below 1.0. In a lean, non-drinking 20-year-old, this level is significant and could be driven by recurrent infection (he reports frequent illness), an inflammatory process in the gut, or the metabolic stress of training hard while anaemic. The low ESR at 2 suggests the inflammation is recent or localised rather than chronic. This should be rechecked once the anaemia is treated.","low_causes":"","high_causes":"Infection, chronic inflammation, autoimmune disease, metabolic syndrome, obesity, gut inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol fractions in the blood: LDL, HDL, and VLDL. At 3.7, this is well within the desirable range of below 5.18 and indicates a healthy overall cholesterol level.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, genetics, hypothyroidism, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3529","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat in the blood, derived from dietary fat and sugar. At 1.2, this is within the laboratory range of below 1.7 but above the optimal ceiling of 1.0. Reducing sugar intake and refined carbohydrates should bring this below 1.0, which would also improve the TG/HDL ratio.","low_causes":"Very low fat diet, malnutrition, hyperthyroidism","high_causes":"High sugar or refined carbohydrate intake, alcohol, obesity, insulin resistance, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3526","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to the tissues. At 0.55, this is within range and reflects the triglyceride level being within the laboratory range. It will improve further as the triglycerides come down.","low_causes":"Low fat diet, malnutrition","high_causes":"High sugar intake, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6731","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6731","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL, or high-density lipoprotein, is the protective cholesterol particle that removes excess cholesterol from artery walls and returns it to the liver. At 1.4, this is above the minimum desirable of 1.04 but right at the male optimal floor. A level above 1.55 would place it in the high-desirable category. Regular exercise and omega-3 intake can help raise HDL further.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, poor diet","high_causes":"Regular exercise, moderate alcohol, genetics, omega-3 intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein, carries cholesterol to the tissues and can deposit it in artery walls if present in excess. At 1.8, this is well within the optimal range of below 2.6 and is an excellent level, particularly for long-term cardiovascular health alongside the raised Lp(a).","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2933","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a simple measure of cardiovascular risk. At 2.64, this is well within the ideal range and indicates a healthy balance between total and protective cholesterol.","low_causes":"","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"37.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9460","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"%","description":"HDL as a percentage of total cholesterol. At 37.84%, this is well above the 20% threshold and indicates that a healthy proportion of total cholesterol is in the protective HDL fraction.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol includes all the potentially harmful cholesterol fractions (LDL, VLDL, and Lp(a)). At 2.3, this is well within the optimal range and is a good overall measure of atherogenic cholesterol burden.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"Poor diet, genetics, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7333","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main structural protein of the protective HDL particle. At 1.76, this is well above the 1.2 threshold and indicates a healthy level of protective lipoprotein function.","low_causes":"Sedentary lifestyle, smoking, obesity, genetics","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.83","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single best measure of the number of atherogenic (artery-damaging) particles in the blood, because every LDL, VLDL, and Lp(a) particle carries exactly one ApoB molecule. At 0.83, this is below the 0.9 desirable threshold but above the optimal ceiling of 0.8. Part of this ApoB count is carried by the Lp(a) particles, which cannot be reduced by lifestyle. The Lp(a)-corrected LDL of 1.33 shows that the modifiable ApoB is already at a very good level.","low_causes":"Malnutrition, hyperthyroidism, genetic conditions","high_causes":"High saturated fat diet, genetics, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.471591","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3369","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB to A1 ratio summarises the balance between atherogenic and protective lipoproteins in a single number. At 0.47, this is well within the lower-risk category of below 0.7 and indicates a healthy lipid balance overall.","low_causes":"","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"145.59","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lp(a) is an inherited lipoprotein particle whose level is genetically determined and does not change with diet, exercise, or medication (aside from a few specific therapies in development). It works by depositing cholesterol into artery walls, promoting blood clot formation, and driving local inflammation. At 145.59 nmol/L, this is in the moderate risk category (90 to 200 nmol/L). At 20, the ten-year risk of a cardiovascular event is very low regardless, but the lifetime exposure to this particle matters. This should be recorded permanently in the medical notes, and first-degree relatives (parents, siblings) should be offered testing because the level is inherited. The excellent modifiable lipid profile (LDL 1.8, ApoB 0.83, triglycerides 1.2) is an important counterbalance and should be maintained.","low_causes":"","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"129","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4393","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3452","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found predominantly in muscle. It leaks into the blood after muscle damage from exercise or injury. At 129, this is mid-range and indicates normal muscle turnover without excessive damage from training.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4345","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"FT4 is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form (T3) in the tissues. At 14.9, this is within the optimal range and indicates the thyroid is producing adequate hormone.","low_causes":"Hypothyroidism, pituitary disease, sick euthyroid syndrome","high_causes":"Hyperthyroidism, over-replacement with levothyroxine, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3515","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland to tell the thyroid how much hormone to make. At 0.78, this is within the laboratory range but slightly below the optimal band of 1.0 to 2.5. A low-normal TSH with normal FT4 and FT3 is not a concern and may simply reflect this individual's set-point. Both thyroid antibodies are negative, which is reassuring.","low_causes":"Hyperthyroidism, pituitary disease, over-replacement with thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"FT3 is the active thyroid hormone that drives metabolism, energy, and body temperature. At 5.1, this is within the optimal range and confirms the thyroid is converting FT4 to the active form effectively.","low_causes":"Hypothyroidism, sick euthyroid syndrome, low energy availability, chronic illness","high_causes":"Hyperthyroidism, thyroiditis, over-replacement","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3623","units":"U/mL","description":"TPO antibodies are immune proteins that attack the thyroid gland. Elevated levels are associated with autoimmune thyroid disease, particularly Hashimoto's thyroiditis. At below 6.6, this is negative and makes autoimmune thyroid disease very unlikely.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3409","units":"U/mL","description":"Thyroglobulin antibodies target the protein used by the thyroid to produce hormones. At below 1.3, this is undetectable and is a further reassuring negative for autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.342","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5227","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body is converting the storage thyroid hormone (T4) into the active form (T3). At 0.342, this is within the optimal range and confirms good peripheral conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1960","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"ng/mL","description":"PSA, or prostate-specific antigen, is a protein produced by the prostate gland. It is used as a screening marker for prostate health. At 0.98, this is well within the age-appropriate limit and is reassuring for prostate hea // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
