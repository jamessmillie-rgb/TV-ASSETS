const REPORT_DATA = {"patient_name":"Oliver Crisp-McNeil","dob":"30/08/2006","report_date":"2026-11-11","summary":"Customer is a 20-year-old male presenting with a BMI of 20.2, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are larger than average (volume 7 out of 10). He trains five times per week (three cardio, two resistance) at hard intensity with 2,000 to 5,000 daily steps. He sleeps eight or more hours but wakes tired most mornings, with an afternoon energy crash; stress feels hard to manage some weeks. He does not drink alcohol, takes no medications, and supplements with vitamin D and vitamin B12. A previous blood test flagged something, though the detail is not recorded. He reports low energy and fatigue, bloating and digestive discomfort, poor exercise recovery, and frequent illness, and these symptoms have been present for as long as he can remember. His goals are to improve sleep quality, boost his immune system, and improve digestion and gut health.\n\nThe finding that should go to his GP before anything else in this report is the full blood count. His haemoglobin is 114, well below the male lower limit of 130, which means he is anaemic. His red blood cell count is 4.23, below the lower limit of 4.5, and his haematocrit, which is the proportion of blood made up of red cells, is 0.35 against a lower limit of 0.40. His MCV, the average size of each red cell, is 82.8, just below the lower limit of 83, and his MCH, the average amount of haemoglobin packed into each cell, is 26.9 against a lower limit of 27. His RDW, which measures how much variation there is in the size of his red cells, is 19.1 against an upper limit of 15. Taken together, this is a microcytic anaemia with significant anisocytosis: the red cells are slightly too small, slightly underfilled, and very variable in size, and there are not enough of them. The most common explanation for this pattern in a 20-year-old man is iron deficiency, and his iron studies support that. His ferritin is 24, which is technically within the laboratory range of 22 to 322, but 24 in a young man is functionally depleted: the optimal range starts at 50, and below 30 the bone marrow does not have enough stored iron to build red cells properly. His serum iron is 12.9, just inside the lower limit of 11.6, and his transferrin saturation, which shows how much of the iron-carrying protein in the blood is actually loaded with iron, is 21 percent against an optimal of 25 to 40. The transferrin itself is 2.41, within range, and the total iron binding capacity is 56.5, also within range, which means the body has not yet upregulated its iron-absorption machinery to its maximum. This suggests the deficiency is relatively recent or moderate rather than severe and longstanding, but the haemoglobin has already dropped below the threshold for anaemia, and this needs investigating. The GP should confirm the iron deficiency with a repeat blood count and iron studies, look for an underlying cause (dietary intake is the most likely explanation at 20 with only 0 to 1 portions of vegetables and fruit a day and a diet low in iron-rich foods, but occult blood loss from the gut should be excluded, particularly given his bloating), and start iron replacement. This single finding explains a great deal of what he is experiencing: fatigue, poor exercise recovery, frequent illness, and waking tired despite eight hours of sleep are all recognised consequences of iron-deficiency anaemia. The blood simply cannot carry enough oxygen to meet the demands of hard training five days a week.\n\nHis monocytes are 0.06, below the lower limit of 0.2. Monocytes are the white blood cells that mature into macrophages in the tissues and are part of the first line of immune defence. A low monocyte count in isolation, without suppression of the other white cell lines, is unusual. His total white cell count is 9.54, his neutrophils are 6.96, and his lymphocytes are 2.24, all comfortably within range, so this is not a picture of generalised bone marrow suppression. A monocyte count this low can be seen with certain viral infections, with bone marrow stress from severe nutrient deficiency, or as a laboratory artefact. Given the iron-deficiency anaemia and the report of frequent illness, the GP should note this and repeat it alongside the full blood count. If it persists, further investigation may be warranted.\n\nHis CRP, which is a general marker of inflammation in the body, is 6.8 against an upper limit of 5 and an optimal of below 1.0. In a lean 20-year-old with no chronic conditions, a CRP of 6.8 is meaningful. It could reflect a recent infection or illness (he reports frequent illness), an inflammatory process in the gut (he reports bloating and digestive discomfort), or the physiological stress of training hard on an anaemic body. It is not high enough to suggest a serious acute infection, but it is well above the level associated with good long-term health. The GP should be aware of this, and it should be rechecked once the anaemia has been corrected. If it remains elevated, the GP may want to investigate further.\n\nHis insulin is 23.87 against an upper limit of 24.9, which is technically within the laboratory range but well above the optimal ceiling of 8. His fasting glucose is 4.6, which is excellent, and his HbA1c is 36, which is also excellent, meaning his average blood sugar over the past three months has been well controlled. But the HOMA-IR, which is calculated from the fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's signal, is 4.88 against an upper limit of 1.5 and an optimal of below 1.0. This means the pancreas is having to produce a large amount of insulin to keep the blood sugar at 4.6. The body is insulin resistant. At a BMI of 20.2, this is surprising, because insulin resistance is most commonly associated with excess body fat, particularly visceral fat around the organs. In a lean, active 20-year-old, the most likely drivers are dietary: sugary food some days, very low vegetable and fruit intake, and a large portion size could be delivering high glycaemic loads despite the lean frame. The elevated CRP adds another layer, because systemic inflammation itself impairs insulin signalling. And iron-deficiency anaemia has been shown in research to worsen insulin resistance independently of weight. So the insulin resistance here is likely a combination of diet quality, inflammation, and the metabolic stress of anaemia rather than a weight-driven problem. The good news is that this makes it highly reversible. Correcting the anaemia, lowering the inflammatory load, increasing vegetable intake, and reducing sugar frequency should bring the insulin down substantially without any need for medication. His C-peptide is 2.6,  within the reference range, confirming the pancreas is producing insulin normally and this is a resistance problem rather than a secretion problem.\n\nHis Lp(a) is 145.59 nmol/L, which is raised. Lp(a), or lipoprotein little a, is an inherited lipoprotein particle that the body produces at a genetically determined level. It does not change with diet, exercise, or lifestyle. It works by depositing cholesterol into artery walls, encouraging blood clot formation, and driving local inflammation, and at levels above 125 nmol/L it is considered to add meaningful cardiovascular risk over a lifetime. At 20, his ten-year risk of a cardiovascular event is very low regardless of this number, but the lifetime exposure matters, and this is information he should carry permanently. His GP should record it, and first-degree relatives (parents, siblings) should be offered testing because it is inherited. The rest of his lipid profile, however, is genuinely excellent. His total cholesterol is 3.7, his LDL is 1.8, his ApoB, which is the best single measure of the number of atherogenic particles in the blood, is 0.83, below the 0.9 threshold. His HDL is 1.4, which is within range though below the male optimal of above 1.4, and his triglycerides are 1.2, within the desirable range. His ApoA1, the protein on the protective HDL particle, is 1.76, and his ApoB to A1 ratio is 0.47, well below the 0.7 lower-risk threshold. His Lp(a)-corrected LDL, which strips out the cholesterol carried by Lp(a) to show the modifiable portion, is 1.33, which is very low. This means the cholesterol he can control through diet and lifestyle is already at an excellent level. The Lp(a) is the one cardiovascular risk factor he cannot change, and that makes it all the more important to keep the modifiable factors, particularly ApoB, insulin resistance, and CRP, as low as possible.\n\nHis cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 50 against a target of below 40 and an ideal of below 20. The two inputs driving this score are the Lp(a) at 145.59 and the CRP at 6.8. If the CRP comes down with treatment of the anaemia and the dietary changes, the score will fall. The Lp(a) contribution cannot be changed.\n\nHis PhenoAge, a biological age estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count, is 44.3 against a calendar age of 20, a difference of over 24 years. This is a striking number, but it is important to understand what is driving it rather than being alarmed by it in isolation. The two strongest contributors are the CRP at 6.8 and the RDW at 19.1: both of these are heavily weighted in the PhenoAge formula, and both are consequences of the iron-deficiency anaemia and inflammation. The MCV being marginally low also contributes. If the anaemia is corrected and the CRP comes down, his PhenoAge will fall dramatically. This is not a reflection of accelerated ageing; it is a reflection of the current metabolic stress his body is under.\n\nHis vitamin D is 29, which is classified as deficient at below 30 nmol/L. He is supplementing with vitamin D, but either the dose is too low or the form is not being absorbed. At a BMI of 20.2, fat sequestration is not the issue, so this is most likely a dosing problem. The optimal range is 75 to 120 nmol/L, and he needs a loading course followed by a higher maintenance dose. His PTH, or parathyroid hormone, which rises when vitamin D or calcium are low, is 1.5, at the lower end of its range, which is slightly unusual: one would expect PTH to be rising in response to a vitamin D of 29. The fact that it is not may simply reflect that his calcium is well maintained at 2.49 (corrected), so the PTH has not been triggered. His magnesium is 1.16, above the upper limit of 1.11. Magnesium at this level is mildly elevated and is most commonly seen with supplementation. If he is taking a magnesium supplement, the dose should be reviewed. If not, a repeat to confirm the level would be sensible.\n\nHis vitamin B12 is 462. He is supplementing, and while 462 is within the laboratory range of 193 to 982, it is below the optimal of 500. The supplementation may not be raising his level as much as expected, which could be a question of form: sublingual methylcobalamin is better absorbed than oral tablets. His folate is 16, close to the top of its range and above the optimal floor of 8, which is good.\n\nTurning to the positives, there is a lot working well. His thyroid is functioning normally: TSH is 0.78, FT4 is 14.9, FT3 is 5.1, and both thyroid antibodies are negative, which makes autoimmune thyroid disease very unlikely. His liver is clean. ALT at 17 and GGT at 25 are both within optimal limits, his FIB-4 score is 0.38, which makes any liver scarring extremely unlikely, and his amylase and lipase, the pancreatic enzymes, are both mid-range. His kidney function is sound: creatinine is 93, cystatin C is 1.05 just inside its limit, and the combined eGFR is 93, healthy for his age. His uric acid at 314 is within the optimal male range. His testosterone is 18.9, within the optimal band of 18 to 30, his free testosterone is 0.486 and his bioavailable testosterone is 9.87, both within range, and his SHBG at 27.6 is keeping the balance appropriate. His cortisol at 273 is within the morning reference range. LH, FSH, prolactin, oestradiol, progesterone and DHEA-S are all within their male reference ranges. His immunoglobulins, IgG, IgM, IgA and IgE, are all within range, which means his immune system's antibody-producing arms are intact. His rheumatoid factor is negative and his coeliac screen, tissue transglutaminase IgA, is negative, which makes coeliac disease very unlikely while he is eating gluten. His PSA is 0.98, well within the age-appropriate limit, and all tumour markers are clear. His urinalysis is unremarkable, with no protein, no glucose, no blood, and an insignificant culture.\n\nHis globulin is 37, marginally above the upper limit of 36. Globulin is the protein fraction that includes the immunoglobulins, and a level just above range with all individual immunoglobulins within their limits is most likely driven by the mild inflammatory and immune activation reflected in the CRP. It is not a concern on its own but should settle as the inflammation resolves. His total antioxidant activity is 1.85, above the upper limit of 1.77. This is likely influenced by his supplementation and is not a concern. His ESR is 2, which is reassuringly low and contrasts with the elevated CRP: this pattern is more consistent with a short-lived or localised inflammatory process than a chronic systemic one. His Systemic Immune-Inflammation Index at 904 is above the optimal ceiling of 450 and above the upper reference limit of 600, driven by the relatively high neutrophil count at 6.96; this is consistent with the inflammatory picture already described.\n\nThe symptoms he reports, fatigue, poor recovery, frequent illness, and waking tired, are all well explained by the iron-deficiency anaemia. The bloating and digestive discomfort are not directly explained by any marker in this panel. The coeliac screen is negative, the pancreatic enzymes are normal, and there is no sign of liver or biliary dysfunction. The most likely causes for ongoing bloating at 20 are food intolerances (lactose or fructose malabsorption), irritable bowel syndrome, or small intestinal bacterial overgrowth. A hydrogen breath test for lactose and fructose intolerance, and a food and symptom diary kept for two to three weeks, would be the most useful next steps. The low vegetable intake may also be contributing: gut bacteria thrive on fibre, and 0 to 1 portions of vegetables and fruit a day provides very little of it.","links":"The central finding in this report is iron-deficiency anaemia, and it connects to nearly every other abnormal result. The haemoglobin at 114, the low red cell count, the low haematocrit, the small and variable red cells (MCV 82.8, RDW 19.1), and the near-depleted ferritin at 24 are all one story: the bone marrow does not have enough iron to produce red blood cells at the rate and quality the body needs. At 20 with hard training five days a week, the demand for oxygen-carrying capacity is high, and the supply is falling short.\n\nThe CRP at 6.8 is the second thread. In a lean, non-drinking 20-year-old with no diagnosed conditions, a CRP this high is unusual and needs an explanation. It could be driven by the physiological stress of training hard while anaemic, by a recent or recurrent infection (he reports frequent illness), or by a low-grade inflammatory process in the gut contributing to the bloating. The SII at 904 supports the same picture. The ESR at 2 is important context: it is very low, which suggests the inflammation is recent or localised rather than chronic and systemic. If the CRP remains elevated after the anaemia is treated and the gut symptoms are addressed, the GP should look further.\n\nThe insulin resistance connects to both the anaemia and the inflammation. A HOMA-IR of 4.88 at a BMI of 20.2 is unusual, and the explanation is likely threefold: a diet delivering high glycaemic loads from sugar and refined carbohydrates despite normal portion sizes, the direct effect of CRP-driven inflammation on insulin signalling, and the independent association between iron deficiency and worsened insulin sensitivity documented in metabolic research. This is not the insulin resistance of obesity, and it should respond to treating the root causes.\n\nThe Lp(a) at 145.59 is a separate, inherited finding that does not connect to the anaemia or the inflammation. It is genetically determined, it will not change, and it adds a lifetime cardiovascular risk that makes it even more important to keep the modifiable risk factors, particularly ApoB, CRP, and insulin resistance, as low as possible. The modifiable lipids are already excellent: LDL 1.8, ApoB 0.83, triglycerides 1.2, Lp(a)-corrected LDL 1.33. The cardiovascular risk score of 50 is being driven almost entirely by the Lp(a) and the CRP; if the CRP falls to below 1.0 with treatment, the score will improve substantially.\n\nThe vitamin D deficiency at 29 is a standalone finding. He is supplementing but not reaching even the sufficient threshold of 50, let alone the optimal of 75. The dose needs to increase. The elevated magnesium at 1.16 may reflect supplementation or dietary intake and is minor.\n\nWhat has been excluded is as important as what has been found. The thyroid is working well, which removes a common cause of fatigue and weight issues. The coeliac screen is negative. The liver and kidneys are healthy. The immunoglobulin levels are intact, which means the frequent illness is not caused by an antibody deficiency. The testosterone is optimal at 18.9, which means the fatigue and poor recovery are not hormonal in origin. The tumour markers and PSA are all clear.","lifestyle":"Build up to 5 portions of vegetables and fruit a day over the next four weeks, adding one portion per week. Start with whatever is easiest: a banana with breakfast, a handful of spinach in a shake, carrot sticks with lunch. Anchor: add one portion to each of your three main meals. Why: fibre feeds the gut bacteria behind your bloating, and the vitamin C in fruit and vegetables dramatically improves iron absorption from food, which your ferritin of 24 needs.\nInclude a source of iron-rich food at two meals a day: red meat three to four times a week, eggs, lentils, chickpeas, dark leafy greens, or fortified cereals. Pair each with a source of vitamin C (a glass of orange juice, peppers, tomatoes, or berries). Anchor: plan the protein on your plate first. Why: your ferritin is 24 and your haemoglobin is 114, both below where they need to be, and dietary iron alongside supplementation is the fastest route back.\nReduce sugary food and drink from some days to once or twice a week at most, and when you do have it, have it as part of a meal rather than on its own. Anchor: swap the sugary snack for Greek yoghurt with berries or a handful of nuts. Why: your fasting insulin is 23.87 and your HOMA-IR is 4.88, meaning your body is producing far more insulin than it should need; reducing the sugar load is the most direct lever.\nAdd a portion of protein to every meal: eggs, chicken, fish, Greek yoghurt, beans, or a protein shake if needed. Target at least 90 to 110 grams of protein per day across the day. Anchor: protein goes on the plate first, before the carbohydrate. Why: protein slows the glucose and insulin response to a meal, supports muscle recovery from your five training sessions, and helps the immune system repair.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin spike, which is the mechanism behind your HOMA-IR of 4.88.\nConsider reducing training intensity to moderate for four to six weeks while the anaemia is being treated. Your body is trying to fuel hard sessions with a haemoglobin of 114, which means less oxygen reaching the muscles, slower recovery, and greater immune suppression. Once the haemoglobin is above 130, build the intensity back up.\nAim to get outside within an hour of waking, even for ten minutes. Anchor: before breakfast or on the way to your first activity. Why: morning light resets the circadian rhythm, and your pattern of waking tired despite eight hours of sleep and crashing in the afternoon suggests the rhythm may be shifted.\nCalorie target: approximately 2,600 to 2,800 kcal per day (based on a BMR of roughly 1,740 and a moderate-to-active multiplier of 1.6, noting that training intensity should drop temporarily). Protein target: 90 to 110 grams per day (1.3 to 1.6 g per kg at 69 kg). There is no need for a calorie deficit at a BMI of 20.2; if anything, ensure you are eating enough to support recovery and red blood cell production.","flags":"Haemoglobin 114 (lower limit 130), red blood cell count 4.23 (lower limit 4.5), haematocrit 0.35 (lower limit 0.40), MCV 82.8 (lower limit 83), MCH 26.9 (lower limit 27), RDW 19.1 (upper limit 15): microcytic anaemia with significant anisocytosis, most likely iron-deficiency anaemia given the borderline iron studies. Ferritin at 24 is functionally depleted (optimal above 50), serum iron 12.9 is near the floor, and transferrin saturation at 21 percent is below optimal. The GP should confirm with a repeat full blood count and iron studies, investigate for occult blood loss (faecal occult blood or referral), and start iron replacement.\nMonocytes 0.06 (lower limit 0.2): isolated low monocyte count with all other white cell lines normal. Should be repeated alongside the full blood count. If persistent, further investigation may be warranted.\nhs-CRP 6.8 (upper limit 5, optimal below 1.0): elevated inflammatory marker in a lean, non-drinking 20-year-old. May reflect the physiological stress of training while anaemic, recurrent infection, or a low-grade gut inflammatory process. ESR at 2 is reassuringly low, suggesting the inflammation is recent or localised. Should be rechecked once the anaemia is corrected.\nFasting insulin 23.87 (upper limit 24.9, optimal 2 to 8), HOMA-IR 4.88 (upper limit 1.5, optimal below 1.0): significant insulin resistance despite a BMI of 20.2 and excellent glucose and HbA1c. Likely driven by diet quality, systemic inflammation, and iron deficiency. Reversible with dietary change and treatment of the anaemia.\nLp(a) 145.59 nmol/L (upper limit 32): raised inherited lipoprotein. Does not change with lifestyle. Adds lifetime cardiovascular risk. GP should record permanently and first-degree relatives should be offered testing. Modifiable lipids (ApoB 0.83, LDL 1.8, triglycerides 1.2) are excellent, making it important to maintain them.\nVitamin D 29 nmol/L (deficient below 30, optimal 75 to 120): deficient despite supplementation. Dose needs to increase with a loading course.\nGlobulin 37 (upper limit 36): marginally above range with all individual immunoglobulins within their limits. Likely driven by the inflammatory and immune activation reflected in the CRP. Not a concern on its own.\nMagnesium 1.16 (upper limit 1.11): mildly elevated. If supplementing, review the dose. If not, a repeat to confirm would be sensible.\nSII 904 (upper limit 600, optimal 150 to 450): elevated systemic immune-inflammation index, driven by the neutrophil count at 6.96. Consistent with the inflammatory picture.\nPhenoAge 44.3 against a calendar age of 20: driven primarily by the CRP at 6.8 and the RDW at 19.1. Will fall substantially once the anaemia and inflammation are corrected.\nCardiovascular risk score 50 (target below 40, ideal below 20): driven by Lp(a) 145.59 and CRP 6.8. The Lp(a) cannot be changed; the CRP component is expected to improve with treatment.\nReassuring negatives: thyroid function is normal with negative antibodies, making autoimmune thyroid disease very unlikely. Coeliac screen is negative. Liver function is clean with a FIB-4 of 0.38, making fibrosis extremely unlikely. Kidney function is healthy with a combined eGFR of 93. Testosterone is optimal at 18.9. Immunoglobulins are all within range, making antibody deficiency unlikely. Tumour markers and PSA are clear. Urinalysis is unremarkable.\nNot reported on this occasion: potassium.","recommendations":"See your GP with this report to discuss the anaemia: haemoglobin 114 (limit 130), ferritin 24 (optimal above 50), transferrin saturation 21 percent (optimal 25 to 40 percent). The GP should confirm with a repeat full blood count and iron studies, investigate for occult blood loss (particularly given the digestive symptoms), and start iron replacement therapy.\nMention the low monocyte count of 0.06 (lower limit 0.2) and ask for it to be included in the repeat blood count.\nMention the hs-CRP of 6.8 (limit 5, optimal below 1.0) and ask for a repeat once the anaemia has been treated, to see whether it normalises.\nDiscuss the HOMA-IR of 4.88 (limit 1.5): the GP should be aware that there is significant insulin resistance despite a healthy BMI, likely driven by diet, inflammation, and iron deficiency. No medication is needed at this stage, but fasting glucose and insulin should be rechecked after six months of dietary change and anaemia treatment.\nAsk the GP to record the Lp(a) of 145.59 nmol/L permanently in your medical notes. This is inherited, does not change, and adds lifetime cardiovascular risk. First-degree relatives (parents, siblings) should be offered testing.\nDiscuss the bloating and digestive discomfort: with a negative coeliac screen and normal pancreatic enzymes, a hydrogen breath test for lactose and fructose intolerance would be a useful next step.\nRetest in four to six months with a full blood count, iron studies, fasting insulin, fasting glucose, CRP, and vitamin D to track the response to iron replacement, dietary changes, and increased vitamin D supplementation.","supplementation":"Iron: ferrous bisglycinate, 25 mg once daily, taken on an empty stomach with a glass of orange juice or another source of vitamin C to aid absorption. Do not take at the same time as tea, coffee, or calcium. Why: your ferritin is 24 and your haemoglobin is 114, both indicating iron deficiency. Continue until the GP confirms ferritin is above 50 and haemoglobin is above 130, then reassess.\nVitamin D3: cholecalciferol, 4,000 IU daily for 12 weeks as a loading dose, then reassess. Take with your largest meal containing fat. Why: your vitamin D is 29, which is deficient despite current supplementation. The dose you are taking is not sufficient to raise your level.\nVitamin K2: MK-7, 100 mcg daily, taken with the vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bones rather than soft tissues. Always pair with vitamin D supplementation.\nVitamin B12: switch to sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue. Why: your B12 is 462 despite supplementation; sublingual methylcobalamin bypasses the gut and is better absorbed, and the optimal level is above 500.\nOmega-3 fish oil: 2 g combined EPA and DHA daily, taken with a meal. Why: omega-3 is anti-inflammatory, and your CRP at 6.8 would benefit from every lever available. It also supports insulin sensitivity, relevant to your HOMA-IR of 4.88.\nDO NOT take a magnesium supplement at this time. Your magnesium is 1.16, already above the upper limit of 1.11. If you are currently taking one, stop it and recheck at your next test.\nThe most important changes from this report are not supplements. They are treating the iron-deficiency anaemia through diet and GP-guided replacement, increasing vegetable and fruit intake from 0 to 1 portions to at least 5 a day, reducing sugar frequency, and temporarily reducing training intensity until the haemoglobin recovers.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4091","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 45 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 45. Weakest systems: inflammation 6%, hematology 23%, glucose & insulin 23%. Biggest drags: HOMA-IR, Haemoglobin, Haematocrit, hs-CRP.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"44.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8860","lower_normal":"","upper_normal":"25","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count). At 44.3 against a calendar age of 20, the difference of over 24 years is striking. However, this is being driven almost entirely by the CRP at 6.8 and the RDW at 19.1, both of which are heavily weighted in the formula and both of which are consequences of the iron-deficiency anaemia and inflammation. Once the anaemia is corrected and the CRP normalises, PhenoAge is expected to fall dramatically towards or below the calendar age.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It has no age term, so it measures the risk being built, not the ten-year chance of an event. At 50, this is above the acceptable threshold of 40. The two inputs driving the score are the Lp(a) at 145.59 nmol/L and the CRP at 6.8. The Lp(a) is inherited and cannot be changed. If the CRP comes down to below 1.0 with treatment of the anaemia and inflammation, the score will improve. At 20, the ten-year cardiovascular event risk is very low regardless, but the gap between the low short-term risk and the high score is the window for acting on the modifiable factors.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after an overnight fast. At 4.6, this is within the optimal range of 4.0 to 5.4 and indicates excellent short-term blood sugar control. This is reassuring alongside the HbA1c and confirms the body is maintaining glucose levels well despite the elevated insulin.","low_causes":"Fasting, excessive insulin, adrenal insufficiency","high_causes":"Diabetes, insulin resistance, stress, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4750","units":"%","description":"HbA1c expressed as a percentage. At 5.5%, this is within the normal range (below 6.0%) and well below the pre-diabetes threshold of 6.0 to 6.4%. This indicates that average blood sugar control over the past two to three months has been good.","low_causes":"","high_causes":"Diabetes, pre-diabetes, chronically high blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar over the past two to three months. At 36 mmol/mol, this is at the optimal ceiling and well below the pre-diabetes threshold of 42. This confirms that despite the elevated insulin, the body is keeping blood sugar under excellent control for now. It is worth noting that iron-deficiency anaemia can affect HbA1c accuracy, sometimes lowering or raising it, so this should be re-interpreted once the anaemia is corrected.","low_causes":"","high_causes":"Diabetes, pre-diabetes, chronically elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"23.87","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6513","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to maintain blood sugar levels after a fast. At 23.87, this is technically within the laboratory range but nearly three times the optimal ceiling of 8. This means the body's cells are not responding efficiently to insulin's signal, and the pancreas is compensating by producing much more of it. At a BMI of 20.2, this level of insulin resistance is unusual and is likely driven by dietary sugar and refined carbohydrate intake, the systemic inflammation reflected in the CRP, and the metabolic effects of iron-deficiency anaemia.","low_causes":"Low carbohydrate diet, high insulin sensitivity, prolonged fasting","high_causes":"Insulin resistance, high carbohydrate or sugar intake, systemic inflammation, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4848","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4747","units":"ug/L","description":"C-peptide is released by the pancreas in equal amounts to insulin and is a reliable measure of how much insulin the pancreas is actually producing, because unlike insulin itself it is not cleared by the liver on first pass. At 2.6 ug/L, this is within the laboratory range and confirms the pancreas is producing insulin normally. The elevated fasting insulin is a resistance problem at the tissue level, not a pancreatic production problem.","low_causes":"Low insulin production, type 1 diabetes, low carbohydrate diet","high_causes":"Insulin resistance, type 2 diabetes, pancreatic tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"4.88","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is calculated from fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A score below 1.0 is optimal, meaning the body is highly insulin-sensitive. At 4.88, this is significantly above the upper limit of 1.5, placing it in the range of significant insulin resistance. At a BMI of 20.2, this is unusual and is most likely driven by dietary factors (sugar some days, low fibre, larger portions of refined carbohydrate), systemic inflammation (CRP 6.8), and the metabolic effects of iron-deficiency anaemia. It is highly reversible with dietary change and treatment of the underlying causes.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, lean physique","high_causes":"Insulin resistance, high sugar or refined carbohydrate intake, systemic inflammation, obesity, iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4357","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood sugar over the past two to three months. At 6.1, this is within the optimal range and confirms good glycaemic control, consistent with the excellent HbA1c.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4767","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index uses fasting triglycerides and glucose to estimate insulin resistance and metabolic syndrome risk. At 8.39, this is within the optimal range. The TyG index uses different inputs from HOMA-IR (triglycerides and glucose rather than insulin and glucose), so the two can diverge. The normal TyG alongside a raised HOMA-IR confirms that the insulin resistance has not yet distorted the lipid metabolism significantly.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"21.31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3632","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures what percentage of the body's iron-carrying protein (transferrin) is actually loaded with iron. At 21.31%, this is within the laboratory range but below the optimal of 25 to 40%, meaning less iron is being transported to the bone marrow and tissues than is ideal. Combined with the low ferritin and the anaemia, this confirms the body is running short of iron for red blood cell production.","low_causes":"Iron deficiency, chronic disease, poor dietary iron intake","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"12.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3553","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.5601","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. At 12.9, this is just inside the lower limit of 11.6 and below the optimal floor of 14. Iron fluctuates throughout the day and with meals, but this low level is consistent with the wider picture of iron deficiency alongside the low ferritin and transferrin saturation.","low_causes":"Iron deficiency, poor dietary intake, blood loss, chronic disease","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3911","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.2","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3444","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that carries iron through the blood to the bone marrow and tissues. At 2.41, this is within both the laboratory and optimal ranges. In established iron deficiency, the body typically raises transferrin to try to capture more iron, but this has not happened yet, suggesting the deficiency is moderate rather than severe or longstanding.","low_causes":"Chronic disease, inflammation, liver disease, iron overload","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"56.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4631","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3437","upper_optimal_position":"0.6033","units":"umol/L","description":"Total iron binding capacity measures the blood's total capacity to carry iron, reflecting the amount of transferrin available. At 56.5, this is within range. In more advanced iron deficiency, TIBC typically rises as the body tries to absorb more iron. The fact that it has not risen yet is consistent with a moderate, relatively recent iron deficiency.","low_causes":"Chronic disease, inflammation, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3356","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/mL","description":"Ferritin reflects the body's stored iron reserves. At 24, this is just above the laboratory lower limit of 22 but well below the optimal floor of 50 for men. Below 30, the bone marrow does not have enough stored iron to produce healthy red blood cells at the rate needed, and this is the most likely cause of the anaemia seen in this report. Iron stores need to be rebuilt through a combination of dietary iron and GP-guided supplementation.","low_causes":"Poor dietary iron intake, blood loss, heavy training, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"114","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2000","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. The male reference range starts at 130. At 114, this is significantly below that threshold and confirms anaemia. This means the blood is carrying less oxygen than the body needs, which directly explains the fatigue, poor exercise recovery, and feeling tired on waking despite adequate sleep. This is the most important finding in the report and needs GP investigation and treatment.","low_causes":"Iron deficiency, B12 or folate deficiency, blood loss, chronic disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia, living at altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2433","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells in the blood. At 4.23, this is below the male lower limit of 4.5, consistent with the iron-deficiency anaemia. The bone marrow is not producing enough red cells because it lacks the iron needed to build them.","low_causes":"Iron deficiency, B12 or folate deficiency, blood loss, chronic disease, bone marrow suppression","high_causes":"Dehydration, polycythaemia, smoking, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1667","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.49","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"L/L","description":"Haematocrit is the proportion of blood volume made up of red blood cells. At 0.35, this is below the male lower limit of 0.40, reflecting the reduced number and size of red cells. It is part of the same iron-deficiency anaemia pattern.","low_causes":"Anaemia, blood loss, overhydration, bone marrow failure","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"19.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"%","description":"RDW measures how much variation there is in the size of red blood cells. A high RDW means the cells are coming out of the bone marrow in very different sizes, which is a hallmark of iron deficiency: newer cells are being produced smaller than older ones because there is not enough iron to fill them properly. At 19.1, well above the upper limit of 15, this is significant anisocytosis and is one of the markers driving the elevated PhenoAge calculation.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiency, chronic disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"82.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3296","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV measures the average size of each red blood cell. At 82.8, just below the lower limit of 83, this confirms the cells are slightly smaller than they should be, which is the characteristic finding of iron-deficiency anaemia. In iron deficiency, the body produces smaller red cells because there is not enough iron to fill them with haemoglobin. This classifies the anaemia as microcytic.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, liver disease, alcohol, hypothyroidism, medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"26.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3267","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. At 26.9, just below the lower limit of 27, this confirms each cell is carrying slightly less haemoglobin than it should, consistent with iron deficiency. The cells are both smaller (low MCV) and underfilled (low MCH).","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"325","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC measures the average concentration of haemoglobin within each red blood cell. At 325, this is within range. In iron deficiency, MCHC is often preserved until the deficiency becomes more severe, because the cell shrinks proportionally to the haemoglobin it loses.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"291","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5141","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"370","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.6154","units":"x10^9/L","description":"Platelets are the small cell fragments that help the blood clot. At 291, this is comfortably within range. Platelet counts can sometimes rise in iron deficiency as a reactive response, and 291 is at the higher end of optimal but within normal limits.","low_causes":"Viral infection, bone marrow suppression, medication, liver disease","high_causes":"Iron deficiency (reactive), inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"9.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6333","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"fL","description":"MPV measures the average size of platelets. At 9.8, this is within the laboratory range of 7.1 to 10.1 but slightly above the optimal ceiling of 9.5. Marginally large platelets can be seen with increased platelet turnover or mild inflammation. At this margin, it is not a concern.","low_causes":"Bone marrow suppression, medication","high_causes":"Increased platelet turnover, inflammation, iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"9.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6411","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The total white blood cell count reflects the overall activity of the immune system. At 9.54, this is within the laboratory range but above the optimal ceiling of 8. A higher white cell count, driven primarily by the neutrophils at 6.96, is consistent with the elevated CRP and suggests the immune system is responding to an inflammatory or infectious stimulus.","low_causes":"Viral infection, bone marrow suppression, autoimmune disease, low energy availability","high_causes":"Infection, inflammation, stress, smoking, medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"6.96","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6640","lower_normal":"2","upper_normal":"7","lower_optimal":"3","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cell and the first responders to bacterial infection and inflammation. At 6.96, this is near the top of the laboratory range and above optimal. Elevated neutrophils alongside a raised CRP point to an active inflammatory or infectious process.","low_causes":"Viral infection, medication, autoimmune disease, bone marrow suppression","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5400","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are the white blood cells that drive the adaptive immune response, including the production of antibodies and the killing of virus-infected cells. At 2.24, this is within the optimal range and indicates the adaptive immune system is functioning well.","low_causes":"Viral infection (early), steroid use, stress, HIV","high_causes":"Viral infection, chronic lymphocytic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.06","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2750","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that mature into macrophages in the tissues, where they engulf pathogens and debris and play a central role in the immune response. At 0.06, this is well below the lower limit of 0.2. This is an isolated finding, with all other white cell lines within range. It could reflect a recent viral infection, bone marrow stress from the iron deficiency, or a laboratory artefact. The GP should repeat this alongside the full blood count to determine whether it persists.","low_causes":"Bone marrow suppression, hairy cell leukaemia, severe infection, glucocorticoid use","high_causes":"Chronic infection, inflammatory disease, recovery from acute infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4097","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in the response to parasites and in allergic reactions. At 0.13, this is within the optimal range and indicates no significant allergic or parasitic activation.","low_causes":"Steroid use, stress response","high_causes":"Allergic conditions, parasitic infection, asthma, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest white blood cells, involved in allergic reactions and inflammation. At 0.02, this is within range and unremarkable.","low_causes":"Steroid use, acute infection, thyrotoxicosis","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4867","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are newly produced red blood cells released from the bone marrow. At 1.42%, this is within range. In iron-deficiency anaemia, the reticulocyte count is often inappropriately normal, meaning the bone marrow is not ramping up production as it should because it lacks the raw material (iron) to do so. A healthy response to anaemia would be to see reticulocytes rise above 2%, and the fact that they have not is consistent with the iron deficiency limiting production.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow failure, chronic disease","high_causes":"Blood loss recovery, haemolysis, treatment response (iron, B12)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteabsolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"60.066","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4004","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the total number of new red blood cells being released by the bone marrow. At 60, this is within range but at the lower end of optimal. In the context of anaemia, this represents an inadequate bone marrow response, limited by the iron deficiency.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression","high_causes":"Recovery from blood loss, haemolysis, treatment with iron or B12","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"19.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by RBC count to help distinguish between iron-deficiency anaemia and thalassaemia trait. An index above 13 favours iron deficiency, while below 13 favours thalassaemia. At 19.6, this strongly favours iron deficiency as the cause of the microcytic anaemia, which is consistent with the low ferritin and transferrin saturation. The MCV is only marginally low, so the pipeline notes the index does not formally apply, but the result is still useful context.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.74","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1850","lower_normal":"2","upper_normal":"","lower_optimal":"3","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"index","description":"Reticulocyte Production Index is calculated from your measured results. It sits outside the ideal range. It is being driven by Haemoglobin, which sits outside the ideal range.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, is a non-specific marker of inflammation that measures how quickly red blood cells settle in a tube over an hour. At 2, this is very low and is reassuring. The contrast between a low ESR and a raised CRP suggests the inflammation is recent or localised rather than a chronic systemic process.","low_causes":"","high_causes":"Infection, autoimmune disease, cancer, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/L","description":"Sodium is the main electrolyte that controls fluid balance and blood pressure. At 142, this is within the optimal range and indicates healthy fluid and electrolyte balance.","low_causes":"Overhydration, diuretics, adrenal insufficiency, vomiting, diarrhoea","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"EL is is within the optimal range and indicates healthy kidney clearance and a normal level of protein intake relative to kidney function.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5726","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.6325","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism filtered by the kidneys. At 93, this is within the optimal range and indicates the kidneys are filtering well. At a lean BMI of 20.2 with resistance training, this is an expected level.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney impairment, dehydration, high muscle mass, creatine supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR estimates how efficiently the kidneys are filtering waste from the blood, calculated from creatinine, age, and sex. At above 90, this is within the optimal range and indicates healthy kidney function.","low_causes":"Kidney disease, dehydration, medications","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION",
