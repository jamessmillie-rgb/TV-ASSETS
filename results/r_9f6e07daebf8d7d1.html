<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Daniel Barbu","dob":"22/01/1990","report_date":"2026-09-24","is_retest":true,"summary":"This is Daniel's second TrueVitals report, taken six weeks after his baseline test. The previous report flagged several urgent findings: polycythaemia with a haematocrit of 0.555, massively elevated inflammatory markers with a CRP of 36 and ESR of 30, a very poor lipid profile driven by anabolic compound use, and complete suppression of the hypothalamic-pituitary-gonadal (HPG) axis with testosterone at 89.7 and LH and FSH flatlined. His quiz answers are unchanged: he is still training more than ten times per week, still smoking and vaping, and still reports low mood, anxiety, and joint pain. His diet quality remains high at 9 out of 10 with a volume of 6 out of 10. His goal is to build muscle. The quiz still lists anabolic steroid or PED use, and the hormone profile confirms ongoing use, although likely at a lower dose or during a transition phase compared to six weeks ago.\n\nThe single most important change in this report is the collapse in inflammatory markers. His CRP has fallen from 36 to 1.1, a thirty-two-fold reduction. His ESR has fallen from 30 to 4. His D-dimers have fallen from 582 to 177, well within range. His white cell count has normalised from 11.8 to 7.27, his neutrophils from 8.51 to 3.94, and his monocytes from 1.25 to 0.73. Six weeks ago, every inflammatory and coagulation marker in the report was raised, painting a picture of significant systemic inflammation with clotting activation. That picture has cleared almost entirely. Whatever was driving it, whether an acute illness, an injection-site reaction, an acute-phase response to a compound change, or a combination, has resolved. CRP at 1.1 is still marginally above the optimal threshold of 1.0, but it is a different universe from 36. This is genuinely reassuring.\n\nHis blood sugar control remains excellent. Glucose is 4.6, HbA1c is 34 (5.3%), insulin is 4.98, C-peptide is 1.37 ug/L, and HOMA-IR is 1.02. These numbers describe a body that is highly insulin-sensitive, responding to glucose with a small, efficient insulin release. At a BMI of 30.5 with this training volume, this is a strong result. His thyroid is working well, with TSH at 1.16 within the ideal band of 1.0 to 2.5, FT4 at 17.9 in the ideal range, FT3 at 6.2 which is strong, and both antibody screens negative. The FT3 to FT4 ratio of 0.346 confirms healthy conversion. His kidney function is adequate but has shifted from the last test: Cystatin C has risen from 0.79 to 1.0, and the combined eGFR has come down from around 111 to 88. An eGFR of 88 is within the laboratory reference range (above 60) but below the optimal threshold of 90, and at 36 it is worth watching. This may reflect the metabolic load on the kidneys from the compounds and the very high training volume, or it could be a transient effect from hydration status, creatine intake, or the timing of the sample. It is not urgent, but it should be repeated in three months. His liver shows no scarring: FIB-4 is 0.6, APRI is 0.34, and the NAFLD fibrosis score is minus 2.37, all comfortably within range. His Gamma GT at 28 is within range and only marginally above the ideal threshold of 25. His AST at 29 is clean. His ALT, however, has risen from 52 to 68, now above the laboratory limit of 56 and well above the optimal ceiling of 30. The De Ritis ratio (AST divided by ALT) is 0.43, below the normal floor of 0.6, which tells us the ALT is disproportionately elevated relative to AST. In the context of anabolic compound use, an isolated ALT rise with a clean GGT and clean fibrosis scores usually reflects hepatocellular metabolic stress rather than structural liver disease. The liver is working harder to process the compounds. It is not dangerous at this level, but it is trending in the wrong direction from 52 to 68, and it needs monitoring. His pancreatic enzymes are within ideal. His coeliac screen is negative. His immune antibodies are all within range. His IgE at 4.16 is very low, ruling out any significant allergic driver for his joint symptoms. His rheumatoid factor at 5 is well within range, which is reassuring given the joint pain he reports. His prostate markers are excellent, with PSA at 0.89 and a healthy free-to-total ratio of 0.247. His tumour markers Ca19-9 and CEA are both within ideal. His creatine kinase at 287 is within range and consistent with his very heavy training load. His B12 at 655 is within the ideal band. His folate at 16 is within ideal. His corrected calcium at 2.5 is healthy, phosphate at 1.1 is within range, and PTH at 1.114 is within range. His vitamin D at 102 is within the ideal band of 75 to 120, down from 119 but still well-placed. His urinalysis is clear, with bacterial culture and sensitivities still pending.\n\nNow the findings that need attention, starting with the most important.\n\nThe polycythaemia has barely changed. His haemoglobin has risen from 185 to 192, further above the limit of 170. His haematocrit has moved from 0.555 to 0.548, still well above the limit of 0.50. His red blood cell count has risen from 5.84 to 5.96, above the limit of 5.5. Polycythaemia means the blood contains too many red blood cells, making it thicker than it should be, which increases the risk of blood clots, stroke, and heart attack. In the previous report this was flagged as urgent, and it remains urgent. The fact that the inflammatory markers and D-dimers have normalised removes one layer of thrombotic risk, which is good news, but the blood itself is still too thick. Anabolic compounds are the clear driver: they stimulate the kidneys to produce more erythropoietin, which tells the bone marrow to make more red cells. His MCH at 32.2 is marginally above the limit of 32, and his MCHC at 350 is marginally above the limit of 345. Both are being pushed up by the sheer volume of haemoglobin packed into each cell, and neither is independently concerning, but they confirm that the red cell line is being overstimulated. Smoking adds a second stimulus because carbon monoxide from cigarettes binds to haemoglobin, reducing its oxygen-carrying capacity, and the body compensates by making more. He has two independent drivers of polycythaemia operating at the same time, and the haematocrit has not improved despite six weeks. Therapeutic venesection, where a unit of blood is removed to bring the haematocrit below 0.50, should be discussed with his GP. This is not optional at a haematocrit of 0.548.\n\nHis hormone profile confirms ongoing anabolic compound use but at what appears to be a lower dose or a different compound compared to six weeks ago. His testosterone has fallen from 89.7 to 13.4, which is now within the laboratory range of 8.4 to 28.7 but below the optimal band of 18 to 30. His SHBG (sex hormone binding globulin, the protein that binds testosterone and controls how much is free in the bloodstream) has risen from 5.6 to 11.1, still well below the lower limit of 17.3. His free androgen index has fallen from 1601 to 120.7, which is now within range. His LH at 0.08 and FSH at 0.94 are both still below range (limits 1.5 and 1.4 respectively). LH and FSH are the pituitary hormones that tell the testes to produce testosterone and sperm. When exogenous testosterone or anabolic compounds are present, the pituitary detects the high androgen levels and shuts down its own signalling. The fact that LH and FSH are still suppressed confirms the HPG axis has not recovered, which means the body is still detecting exogenous androgen activity. His oestradiol at 164 is above the male limit of 146.1, down from 556 but still elevated. Oestradiol rises in men on anabolic compounds because the enzyme aromatase converts excess testosterone into oestrogen. Elevated oestradiol contributes to water retention, mood disturbance, and potentially gynaecomastia. The low mood and anxiety he reports could be partly driven by this hormonal picture: suppressed natural testosterone production, a suppressed SHBG leaving hormones poorly regulated, and oestradiol sitting above range. His DHEA-S at 7.8 umol/L (equivalent to approximately 2875 ug/dL) is within the laboratory range. His cortisol at 404 is within the morning reference range. His progesterone at 1.28 is within range. His prolactin at 167 is within range, which is reassuring because some compounds can elevate prolactin.\n\nHis lipid profile has improved meaningfully but remains a significant concern. His total cholesterol has fallen from 6.2 to 5.2. His LDL has fallen from 4.7 to 3.47, still above the laboratory limit of 3.0 and well above the optimal ceiling of 2.6. His ApoB has fallen from 1.37 to 1.17, a genuine improvement but still above the 0.9 target and classified as borderline high. ApoB is the protein carried by every LDL particle, and it is the most accurate single measure of how many atherogenic (artery-damaging) particles are circulating. His ApoB/A-I ratio has fallen from 1.37 to 0.90, right at the boundary between average and higher risk, down from firmly in the higher risk category. His ApoA-1 has improved from 1.0 to 1.3, now above the 1.2 threshold, which is a positive shift. His HDL remains at 1.2, unchanged, still below the optimal target of 1.4 for a male. His triglycerides have risen from 0.78 to 1.28, still within range but no longer in the ideal band below 1.0. The TG/HDL ratio at 1.07 is within the laboratory range but above the optimal of 0.87, and remnant cholesterol at 0.53 is marginally above the optimal 0.5 ceiling. His Lp(a) is below 25, confirming there is no inherited lipoprotein(a) component, which means the entire lipid picture is driven by modifiable factors, primarily the effect of anabolic compounds on liver cholesterol metabolism and, to a lesser extent, smoking, diet and body composition. The Lp(a)-corrected LDL at 3.39 confirms that virtually all of his LDL is the conventional modifiable type. His cardiovascular risk score, a TrueVitals index scored from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 80 out of 100, which is high. This score has no age adjustment because it measures the risk being built in the arteries right now, not the ten-year probability of an event. At 36 his ten-year absolute risk remains low, but the score tells him that his arteries are accumulating damage at a rate far above where they should be, and the window to reverse that is now, not at 50.\n\nHis iron studies show a new pattern that was not present six weeks ago. His serum iron at 31.7 is above the limit of 31.3. His transferrin saturation at 57.38% is above the limit of 55%. His ferritin has dropped from 169 to 109, which is within range, and his transferrin at 2.2 and iron binding capacity at 53 are both within range. The combination of high serum iron and high saturation with a normal transferrin and a ferritin that is not elevated suggests the body is absorbing and circulating more iron than it is storing. This is a pattern that can be seen with anabolic compound use (androgens increase iron absorption) and with red meat-heavy diets, but it should also prompt exclusion of hereditary haemochromatosis, a genetic condition where the body absorbs too much iron. An HFE gene test would settle this definitively. Given the polycythaemia requiring venesection, each unit of blood removed would also reduce his iron load, so the two problems share a solution.\n\nHis total antioxidant activity (TAA) at 0.58 is significantly below the laboratory range of 1.3 to 1.77. This was 1.91 in the previous test, within ideal, and has dropped dramatically. TAA is a broad measure of how well the body can neutralise free radicals, the reactive molecules that damage cells. A fall this large in six weeks suggests a significant increase in oxidative stress that is consuming his antioxidant reserves faster than they are being replenished. The most likely drivers are the polycythaemia itself (excess red cells generate more oxidative stress), smoking (a potent source of free radicals), the heavy training volume, and the metabolic processing of anabolic compounds. This is worth addressing through diet and supplementation.\n\nHis magnesium at 0.81 is within the laboratory range but below the optimal band of 0.85 to 1.05. Magnesium supports muscle function, sleep quality, recovery, and blood pressure regulation. At his training volume, magnesium is being used up faster than a typical person, and a level sitting below optimal may be contributing to the joint stiffness and recovery demands.\n\nHis uric acid at 442 is within the laboratory range of 220 to 547 but above the optimal ceiling of 380. Uric acid is a waste product of purine metabolism, and when it rises it can deposit crystals in joints, contributing to pain and stiffness. Given that joint pain is one of Daniel's reported symptoms, a uric acid sitting above optimal is worth noting, though it is within range and not at a level that typically causes gout on its own. His high training volume and high protein intake may be contributing.\n\nRegarding the symptoms Daniel reports: his low mood and anxiety are most likely connected to the hormonal picture. Suppressed LH and FSH, a natural testosterone level that has fallen to the lower end of range now that exogenous levels have dropped, oestradiol above range, and a very low SHBG all contribute to mood instability. Smoking and nicotine also affect mood regulation. The blood results have excluded thyroid dysfunction, B12 deficiency, anaemia (his haemoglobin is high, not low), and severe inflammation as causes. His joint pain and stiffness has no inflammatory or autoimmune explanation in the blood: rheumatoid factor is normal, CRP is near-normal, ESR is low, and IgE is very low. The most likely contributors are the very high training volume with heavy resistance work, the effect of fluctuating androgen and oestrogen levels on connective tissue, the uric acid sitting above optimal, and smoking, which impairs blood flow to joints and tendons.\n\nTo summarise the direction of travel: the inflammatory picture has resolved dramatically and that is the biggest positive in this report. The lipid profile has improved meaningfully. The hormonal picture has shifted from supraphysiological to suppressed-but-transitioning, though the HPG axis remains shut down. The polycythaemia has not improved and remains the most pressing clinical issue. The ALT has worsened. The kidney filtration has decreased. The iron saturation has risen. And the antioxidant reserve has collapsed. The overall trajectory is mixed: some genuine improvements alongside some new concerns that need action.","links":"The findings in this report are connected by two central threads: the ongoing effects of anabolic compound use and the cumulative impact of smoking alongside very high training volume.\n\nThe first thread ties the polycythaemia, the iron pattern, the hormone profile, the ALT, and the lipid picture together. Anabolic compounds stimulate erythropoietin production, driving the haemoglobin to 192 and haematocrit to 0.548. They increase intestinal iron absorption, explaining the new finding of serum iron and transferrin saturation above range. They suppress the HPG axis, which is why LH at 0.08 and FSH at 0.94 are both flatlined despite testosterone now sitting at 13.4 rather than 89.7. They alter hepatic cholesterol metabolism, suppressing HDL production and increasing LDL particle count, which is why ApoB at 1.17 and LDL at 3.47 remain elevated despite the improvement from the previous test. And they place a metabolic load on the liver that explains the ALT rising from 52 to 68 while the structural markers (GGT, FIB-4, APRI) remain clean.\n\nThe second thread ties the antioxidant collapse, the marginal CRP, the cardiovascular risk score, and the symptoms together. Smoking generates free radicals directly, and when combined with the oxidative stress of polycythaemia (excess red cells produce more reactive oxygen species) and very high training volume (exercise generates transient oxidative stress that is normally beneficial but becomes harmful at extreme volume without adequate recovery), the body's antioxidant reserves are being consumed faster than they are replaced. The TAA falling from 1.91 to 0.58 in six weeks is a measurable expression of this. The CRP at 1.1 is not alarming in isolation, but in the context of a cardiovascular risk score of 80, it adds one more ingredient to an atherogenic environment.\n\nWhat has been excluded is clinically useful. The dramatic normalisation of CRP (36 to 1.1), ESR (30 to 4), D-dimers (582 to 177), and white cell count (11.8 to 7.27) tells us that whatever acute process was driving those results six weeks ago, whether infection, injection-site reaction, or acute-phase response, has resolved completely. The current picture is one of chronic low-grade risk rather than acute danger, with the exception of the haematocrit.\n\nThe loose end is the kidney function. The eGFR dropping from around 111 to 88 could be a genuine early signal that the kidneys are feeling the strain of processing anabolic compounds, or it could be a snapshot effect from hydration, creatine supplementation, or sample timing. A single reading at 88 in a 36-year-old is not a diagnosis, but it does need a repeat in three months to establish whether it is a trend or a one-off.\n\nThe joint pain remains unexplained by inflammatory or autoimmune markers. The combination of extremely high training volume, fluctuating androgen and oestrogen levels affecting connective tissue integrity, uric acid above optimal at 442, and the vascular effects of smoking is the most likely explanation, but it is a clinical rather than a laboratory diagnosis.","lifestyle":"Add 400g of colourful vegetables and two portions of berries to your daily intake, spread across meals. Anchor: prep a box each evening for the next day. Why: antioxidant-rich foods are the fastest way to rebuild the TAA that has fallen from 1.91 to 0.58, and your diet quality is already high so this is about increasing the volume of the right foods.\nReplace one high-purine protein source per day (organ meats, shellfish, game) with chicken, eggs, tofu or white fish. Anchor: make it the post-training meal. Why: your uric acid at 442 is above optimal and purine reduction is the dietary lever that lowers it, which may help the joint stiffness.\nEat two to three portions of oily fish per week (salmon, mackerel, sardines). Anchor: fixed days, such as Monday and Thursday dinners. Why: omega-3 fatty acids lower triglycerides (yours have risen from 0.78 to 1.28), raise HDL (yours is stuck at 1.2), and reduce the inflammatory tone that drives your cardiovascular risk score of 80.\nAdd 30g of soluble fibre daily from oats, beans, lentils, or psyllium husk. Anchor: oats at breakfast, beans or lentils with one other meal. Why: soluble fibre binds bile acids in the gut and forces the liver to pull LDL cholesterol from the blood to make more, directly lowering your ApoB of 1.17.\nReduce or stop smoking. This is the single highest-impact change in the report. Smoking drives polycythaemia alongside the compounds, depletes antioxidants, impairs joint and tendon blood flow, and accelerates arterial damage. Even halving the number of cigarettes per day would reduce the oxidative burden measurably.\nAim for a calorie intake of approximately 2,600 to 2,800 kcal per day with a protein target of 140 to 155g per day (1.6 to 1.8g per kg). Your diet volume is 6 out of 10 and your goal is to build muscle, so you need adequate fuel without excess that would push lipids or uric acid higher. Anchor: track for two weeks to calibrate, then eat to pattern.\nSet a fixed wake time seven days a week and get outside within the first hour for at least ten minutes. Anchor: alarm, shoes on, walk. Why: consistent circadian signalling supports cortisol rhythm, mood regulation, and recovery, all of which are under pressure from the hormonal fluctuations and the training load.\nConsider reducing total training volume from 10-plus sessions to 7 or 8 per week for the next three months. Why: at your current volume, oxidative stress is outstripping antioxidant capacity, the kidneys are working harder than expected, and recovery is likely incomplete. Slightly less volume with the same intensity will still support your muscle-building goal while giving the body more room to recover.","flags":"Haemoglobin 192 (above 170), HCT 0.548 (above 0.50), RBC 5.96 (above 5.5). Polycythaemia persists and has worsened slightly from the previous test (Hb 185, HCT 0.555, RBC 5.84). Driven by anabolic compound use and smoking. Haematocrit remains well above the 0.50 threshold for therapeutic venesection. MCH 32.2 (above 32) and MCHC 350 (above 345) are secondary to the polycythaemia.\nALT 68 (above 56, previously 52). Rising trend over six weeks. GGT 28, FIB-4 0.6 and APRI 0.34 are all within range, indicating metabolic hepatocellular stress rather than structural damage. De Ritis ratio 0.43 (below 0.6) confirms ALT-predominant elevation consistent with drug metabolism. Monitor.\nApoB 1.17 (above 0.9, previously 1.37). LDL 3.47 (above 3.0, previously 4.7). HDL 1.2 (below optimal 1.4, unchanged). ApoB/A-I ratio 0.90 (above 0.7, previously 1.37). Lipid profile has improved significantly but remains above target. Lp(a) below 25, confirming modifiable aetiology. Cardiovascular risk score 80 out of 100.\nLH 0.08 (below 1.5) and FSH 0.94 (below 1.4). HPG axis remains suppressed. Testosterone 13.4, within laboratory range but below optimal (18 to 30). SHBG 11.1 (below 17.3). Oestradiol 164 (above 146.1, previously 556). Free androgen index 120.7 (within range, previously 1601). Bioavailable testosterone 9.89 (above upper normal of 9, reflecting the very low SHBG). Consistent with ongoing but reduced anabolic compound use.\nSerum iron 31.7 (above 31.3). Transferrin saturation 57.38% (above 55%, previously 24.21%). New finding. Ferritin 109 (within range, previously 169). Transferrin 2.2 and TIBC 53 both within range. Pattern could reflect androgen-driven iron absorption or hereditary haemochromatosis. HFE gene test recommended.\nTotal antioxidant activity 0.58 (below 1.3, previously 1.91). Dramatic decline in six weeks suggesting oxidative stress from polycythaemia, smoking and high training volume is overwhelming antioxidant defences.\nMagnesium 0.81 (within range but below optimal of 0.85). Uric acid 442 (within range but above optimal of 380).\nCystatin C 1.0 (within range), combined eGFR 88 (within range but below optimal of 90, previously approximately 111). Decline in kidney filtration over six weeks. May be transient. Repeat in three months.\nCRP 1.1 (within range, marginally above optimal of 1.0, previously 36). ESR 4 (within range, previously 30). D-dimers 177 (within range, previously 582). WBC 7.27 (within range, previously 11.8). Dramatic resolution of the acute inflammatory picture from the previous test.\nReassuring negatives: thyroid function normal with negative antibodies, blood sugar control excellent (HOMA-IR 1.02), coeliac screen negative, rheumatoid factor normal, immunoglobulins normal, IgE very low, PSA 0.89 with healthy free ratio, tumour markers normal, urinalysis clear, pancreatic enzymes normal, vitamin D, B12, folate, calcium and parathyroid hormone all within range.\nNot returned by the laboratory: bacterial count and urine culture and sensitivities are pending.","recommendations":"Discuss therapeutic venesection with your GP to bring haematocrit below 0.50. Current HCT is 0.548 with haemoglobin 192, both well above safe limits, driven by anabolic compound use and smoking. Bring the report showing the trend from 0.555 and 185 to 0.548 and 192.\nRequest an HFE gene test to exclude hereditary haemochromatosis. Serum iron 31.7 and transferrin saturation 57.38% are above range. Venesection for the polycythaemia will also address the iron load.\nDiscuss the ALT trend with your GP: 52 six weeks ago, now 68 (limit 56). GGT and fibrosis scores are clean, but the trajectory warrants monitoring. If compound use continues, a repeat ALT and GGT in six to eight weeks is appropriate.\nDiscuss the lipid profile: ApoB 1.17 (target below 0.9), LDL 3.47 (target below 3.0), cardiovascular risk score 80. Improved from the previous test but still elevated. The GP should assess whether lipid-lowering medication is appropriate given the compound use and smoking.\nDiscuss the HPG axis suppression: LH 0.08 and FSH 0.94, both below range. If discontinuation of compounds is planned, the GP should be aware to monitor recovery and consider fertility implications.\nRepeat kidney function (Cystatin C and eGFR) in three months. The combined eGFR has fallen from approximately 111 to 88, which may be transient but needs confirmation.\nCalorie target 2,600 to 2,800 kcal per day. Protein target 140 to 155g per day. Retest in three months with a focus on: full blood count with haematocrit, ALT and GGT, lipid panel with ApoB, Cystatin C eGFR, iron studies, and TAA.","supplementation":"Vitamin C: 500mg twice daily (total 1,000mg), taken with meals. Why: vitamin C is a potent water-soluble antioxidant and your TAA has collapsed from 1.91 to 0.58. It also supports collagen synthesis for joint health and enhances iron regulation.\nOmega-3 fish oil: 3g combined EPA and DHA daily, taken with your largest meal. Why: omega-3 lowers triglycerides (yours have risen from 0.78 to 1.28), supports HDL (yours is 1.2, below ideal), reduces inflammatory tone, and is associated with joint pain reduction.\nMagnesium glycinate: 400mg before bed. Why: your magnesium at 0.81 is below the optimal band of 0.85 to 1.05. Glycinate is the best-absorbed form and supports sleep quality, muscle recovery, and blood pressure.\nVitamin D3: 2,000 IU daily with a fat-containing meal, paired with vitamin K2 MK-7 100mcg. Why: your vitamin D at 102 is within ideal but has dropped from 119. Maintenance dosing will hold it in the optimal band through winter. K2 directs calcium to bones rather than arteries.\nN-Acetyl Cysteine (NAC): 600mg twice daily. Why: NAC replenishes glutathione, the body's primary intracellular antioxidant, and supports liver detoxification. With ALT at 68 and TAA at 0.58, both the liver and the antioxidant system need support.\nCoenzyme Q10 (ubiquinol form): 200mg daily with food. Why: CoQ10 is a fat-soluble antioxidant that supports mitochondrial energy production and is depleted by high oxidative stress. It may also support cardiovascular health given the lipid profile.\nDO NOT take iron supplements. Your serum iron at 31.7 and transferrin saturation at 57.38% are both above range. Additional iron would worsen the overload and increase oxidative damage.\nThe most important changes from this report are not supplements. They are stopping or reducing smoking, discussing venesection with your GP to bring the haematocrit below 0.50, and addressing the lipid profile through dietary changes and a GP conversation about the cardiovascular risk score of 80.","system_ratings":{"blood":{"level":"red","label":"See your GP","note":"Haemoglobin 192 and HCT 0.548, polycythaemia requiring venesection"},"hormones":{"level":"red","label":"See your GP","note":"LH 0.08 and FSH 0.94 suppressed, SHBG 11.1 below range, oestradiol 164 above range"},"cardio":{"level":"orange","label":"Needs attention","note":"ApoB 1.17 above 0.9, LDL 3.47 above 3.0, cardiovascular risk score 80"},"liver":{"level":"orange","label":"Needs attention","note":"ALT 68 above 56 and rising, De Ritis 0.43 below range"},"immune":{"level":"green","label":"Optimal","note":"IgG, IgM, IgA, IgE all within range, rheumatoid factor normal"},"kidney":{"level":"amber","label":"Room to improve","note":"Combined eGFR 88 below optimal of 90, Cystatin C 1.0 at upper end"},"thyroid":{"level":"green","label":"Optimal","note":"TSH 1.16, FT4 17.9, FT3 6.2, antibodies negative"},"gut":{"level":"green","label":"Optimal","note":"Glucose 4.6, HbA1c 34, HOMA-IR 1.02, amylase and lipase ideal"},"vitamins":{"level":"amber","label":"Room to improve","note":"TAA 0.58 well below range, vitamin D and B12 within ideal"},"minerals":{"level":"lime","label":"Mostly good","note":"Magnesium 0.81 marginally below optimal of 0.85, calcium and phosphate fine"},"iron":{"level":"orange","label":"Needs attention","note":"Serum iron 31.7 and transferrin saturation 57.38% both above range"},"prostate":{"level":"green","label":"Optimal","note":"PSA 0.89, free ratio 0.247, no concern"},"screening":{"level":"green","label":"Optimal","note":"Ca19-9 and CEA within ideal"},"urinary":{"level":"green","label":"Optimal","note":"Clear urinalysis, culture pending"}},"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 59; held to 49 by two or more systems rated \"See your GP\". Weakest systems: hematology 23%, lipids & cardiovascular 32%, hormones 41%. Biggest drags: Apolipoprotein B, Haemoglobin, LDL Cholesterol, Sex Hormone Binding Globulin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"33 within_optimal":"FALSE","result_position":"0.7879","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found mainly inside liver cells. When liver cells are stressed or damaged, ALT leaks into the bloodstream and the level rises. Daniel's ALT is 68, above the laboratory limit of 56 and well above the optimal ceiling of 30. This has risen from 52 six weeks ago, an upward trend consistent with the metabolic load placed on the liver by anabolic compound processing. The reassurance is that GGT and the fibrosis scores are clean, suggesting metabolic stress rather than structural damage, but the trend needs monitoring.","low_causes":"","high_causes":"Anabolic compound metabolism, high training volume, obesity, alcohol, fatty liver disease, viral hepatitis, medications","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"52","baseline_date":"2026-08-10"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8333","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart and muscles. Daniel's AST at 29 is comfortably within range. Importantly, it has not risen in line with the ALT, which tells us the liver stress is ALT-predominant, a pattern more consistent with hepatocellular metabolic processing than with significant structural liver injury.","low_causes":"","high_causes":"Liver disease, heavy exercise, muscle damage, cardiac events","padding":"1","one_sided":"","range_typ e in his iron panel. A saturation above 45% should prompt investigation for hereditary haemochromatosis, a genetic condition where the body absorbs too much iron. An HFE gene test will confirm or exclude this. In the meantime, venesection for the polycythaemia will also reduce iron levels.","low_causes":"Iron deficiency, chronic disease","high_causes":"Haemochromatosis, iron supplementation, anabolic compounds, liver disease","padding":"1","one_sided":"","range_type":"normal","baseline_result":"24.21","baseline_date":"2026-08-10"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"13.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4080","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, energy, mood and libido. Daniel's testosterone at 13.4 is within the laboratory range of 8.4 to 28.7 but well below the optimal band of 18 to 30. It has fallen from 89.7 in the previous test, which was supraphysiological from exogenous anabolic compound use. The current level most likely reflects the body's own production being suppressed (LH and FSH are still flatlined) while the exogenous compound dose has been reduced or changed.","low_causes":"HPG axis suppression from AAS, hypogonadism, aging, obesity, stress, sleep deprivation","high_causes":"Exogenous testosterone/AAS, testicular tumour","padding":"1","one_sided":"","range_type":"normal","baseline_result":"89.7","baseline_date":"2026-08-10"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.463","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5329","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_op function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  this.value=f;
});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
