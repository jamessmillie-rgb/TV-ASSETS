<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Gabriel Cockram","dob":"06/05/1996","report_date":"2026-10-21","summary":"This is a 30-year-old male presenting with a BMI of 22.1, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food most days and sugary food daily; portions are about average (volume 5 out of 10). He trains 3 times per week (1 cardio, 2 resistance) at hard intensity with 7,500 to 10,000 daily steps. He sleeps 7 to 8 hours but wakes tired most mornings, with steady energy through the day. Stress is rarely hard to manage. He does not drink alcohol. He vapes nicotine. He has a six-year diagnosis of ulcerative colitis managed with Adalimumab, which he last took three weeks ago. He reports bloating and digestive discomfort, poor exercise recovery, hair thinning, and feeling cold or having cold hands and feet, all present for over a year. His goals are to build muscle, improve digestion and gut health, and improve long-term health and longevity.\n\nThe standout positive in this report is his cardiovascular profile, which is excellent across the board. His total cholesterol is 4.1, his LDL is 2.44 (well within the ideal target of below 2.6 when corrected for his Lp(a)), and his ApoB, which is the best single measure of the number of cholesterol-carrying particles in the bloodstream, is 0.7, comfortably below both the standard threshold of 0.9 and the ideal target of 0.8. His triglycerides at 0.81 are below the ideal 1.0 mark, and his HDL at 1.3, while sitting between the lab reference and the tighter ideal of above 1.4, is a reasonable level for a 30-year-old man. His Lp(a), a genetically inherited lipoprotein that independently drives cardiovascular risk and cannot be changed by diet or exercise, is below 25, which is genuinely useful information: it means his already-good lipid profile is entirely the product of modifiable factors, and it rules out one inherited risk permanently. His Cardiovascular Risk Score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), high-sensitivity CRP and HbA1c, is 15 out of 100, which places him in the ideal band of 20 or below. His ApoB to ApoA1 ratio at 0.53 is well within the lower-risk zone of below 0.7.\n\nHis blood sugar control is excellent. Fasting glucose at 4.5 and HbA1c at 36 are both within the ideal range, and his fasting insulin at 2.86 is low in a healthy way: his body requires very little insulin to keep glucose in check. His HOMA-IR, which estimates how resistant the tissues are to insulin, is 0.57, right at the bottom of the range, confirming strong insulin sensitivity. This is the metabolic picture of someone whose blood sugar machinery is working efficiently.\n\nHis liver is in good health. Gamma GT at 15 is well below the ideal threshold of 25, ALT at 32 is within the laboratory range (it sits just above the tighter optimal of below 30 for males but is not concerning in isolation), and AST at 34 is comfortably within range. His FIB-4 score, a calculation that estimates liver scarring from age, platelets, ALT and AST, is 1.13, well below the threshold that would prompt further investigation. His bilirubin, albumin, alkaline phosphatase, amylase and lipase are all within healthy limits. There is no sign of liver strain or fatty liver disease.\n\nHis thyroid is working well. TSH at 0.85, which is the signal from the pituitary gland telling the thyroid how hard to work, sits within the ideal range of 1.0 to 2.5 (marginally below, which in the context of normal thyroid hormones simply reflects efficient thyroid output rather than overactivity). Free T4 at 15.5 is within the laboratory range, and Free T3, the active thyroid hormone that cells actually use, is 6.1, sitting in the upper part of the ideal band of 4.5 to 6.5. The FT3 to FT4 ratio at 0.39 confirms healthy conversion. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease. This is relevant because his symptoms of feeling cold and hair thinning are classic thyroid presentations, and this panel shows the thyroid is not the explanation.\n\nHis testosterone is 28.5, right at the top of the laboratory range and well within the ideal band of 18 to 30 for a 30-year-old man. Free testosterone, which is the fraction available for the tissues to use, is 0.736, healthy and well supported by an SHBG (sex hormone binding globulin, the protein that binds testosterone and controls how much is free) of 30.2, which is within the ideal band. His LH and FSH, the pituitary hormones that drive testosterone production, are both within range. Cortisol at 249 is mid-range for a morning sample. DHEA-S at 4.2, prolactin at 178 and oestradiol at 146 are all within their respective ranges. His hormonal profile is strong and supports his muscle-building goal.\n\nHis PhenoAge, a biological ageing score calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 22.6, which is 7.4 years younger than his calendar age of 30. This is a genuinely positive result and reflects the combined effect of his healthy blood sugar, low inflammation and clean liver and kidney markers.\n\nHis kidney function, assessed by creatinine, cystatin C and urea, is working normally. The creatinine-based eGFR is above 90 and the cystatin C-based eGFR is 89, which places him just below the optimal threshold of 90. Cystatin C at 1.05, while within the laboratory range of below 1.1, is slightly higher than expected for a lean 30-year-old and is worth keeping an eye on at retest. The combined eGFR of 89 is the most accurate estimate and sits just at the borderline of optimal. Urea, sodium, chloride, uric acid and calculated serum osmolality are all within healthy limits.\n\nHis prostate markers are clean, with a PSA of 0.76 and a free-to-total ratio of 46 percent, and his tumour markers CA19-9 and CEA are both well within range. His immunoglobulins IgG, IgA, IgM and IgE are all within range. Rheumatoid factor is negative, and tissue transglutaminase IgA is negative, which rules out coeliac disease as a contributor to his bloating and malabsorption symptoms. His ESR at 2 is low, and his hsCRP at 0.9 is within the ideal band of below 1.0, which is particularly reassuring given his ulcerative colitis: it suggests the disease is not currently driving systemic inflammation.\n\nTurning to the findings that need attention, there are four linked patterns worth discussing.\n\nThe first is his phosphate, which at 0.6 is below the lower limit of 0.78. Phosphate is an essential mineral for energy production, bone health and muscle function. It is absorbed in the small intestine, and in the context of ulcerative colitis, where chronic gut inflammation can impair absorption, low phosphate is a recognised consequence. His corrected calcium at 2.36 and PTH at 3.2 are both normal, which means the body is not pulling phosphate out of bone to compensate, and this is more likely a straightforward absorption issue. Low phosphate could contribute to his poor exercise recovery and his feeling of cold, because phosphate is directly involved in the production of ATP, the molecule muscles use for energy. This should be discussed with his GP, and a repeat phosphate alongside a check of his vitamin D status (which at 100 is healthy) and dietary phosphate intake would be reasonable.\n\nThe second is his neutrophil count at 1.92, which sits just below the lower limit of 2.0. Neutrophils are the most abundant white blood cell and the body's first-line defence against bacterial infection. A mildly low neutrophil count in a man of European ancestry can be a normal variant (benign ethnic neutropaenia is well described), but in the context of Adalimumab, which is an immunosuppressant that works by blocking tumour necrosis factor alpha, a mild suppression of neutrophil production is a recognised side effect. His total white cell count at 4.02 is right at the lower boundary of range, and his lymphocytes, monocytes, eosinophils and basophils are all within range, so the immune suppression, if present, is limited to the neutrophil line. His NLR (neutrophil-to-lymphocyte ratio, a broad marker of the balance between innate and adaptive immunity) at 1.22 is within the ideal band. This is not an urgent finding, but it is worth mentioning to his gastroenterologist or GP, particularly if he notices he is picking up infections more easily or more frequently than usual.\n\nThe third is his C-Peptide, which at 0.672 micrograms per litre (roughly 222 picomoles per litre) is below the laboratory range of 1.1 to 4.4. C-Peptide is released by the pancreas in equal amounts to insulin and is the best measure of how much insulin the pancreas is actually producing. However, in the context of a fasting glucose of 4.5, an HbA1c of 36 and a HOMA-IR of 0.57, this low C-Peptide simply reflects the fact that his body does not need much insulin. His pancreas is producing a small amount because a small amount is all that is required. The lab note mentions that C-Peptide can degrade if the sample is not separated within four hours, which may also have contributed to the low reading. This is not a sign of pancreatic failure and does not require action, but it is worth noting for context.\n\nThe fourth is his ferritin at 38, which is within the laboratory range of 22 to 322 but below the optimal threshold of 50 for a male. Ferritin is the body's stored iron, and at 38 it is not low enough to cause anaemia (his haemoglobin at 153, red cell count, MCV and MCH are all healthy), but it is lower than ideal, particularly for someone training hard and wanting to build muscle. Iron is absorbed in the duodenum and upper small intestine, and in ulcerative colitis, even when inflammation is well controlled, subtle malabsorption can keep iron stores from building. His transferrin saturation at 24.4 percent sits just below the ideal band of 25 to 40 percent, and his serum iron at 18, transferrin at 2.94 and iron binding capacity at 70.4 are all within range. This pattern is consistent with iron stores that are adequate to prevent anaemia but not optimal for performance and recovery. His hair thinning could be partly related: ferritin below 50 to 70 is associated with increased hair shedding in some individuals, though the mechanism is not fully established. An increase in dietary iron from red meat, liver, dark leafy greens or legumes would be the first step, with a low-dose iron supplement as a second option.\n\nHis creatine kinase (CK) at 354 is above the laboratory upper limit of 320. CK is an enzyme released from muscle cells when they are damaged or under heavy load. In someone training at hard intensity with two resistance sessions a week, a mildly elevated CK is entirely expected and reflects muscle breakdown from training rather than any disease process. If this were in the thousands, or if he had dark urine after training, it would be a concern, but at 354 with a single-digit margin above range, this is a normal training response. It does, however, reinforce his report of poor exercise recovery: his muscles are breaking down as expected, but the repair process may be limited by his sub-optimal iron stores and his relatively modest protein and calorie intake.\n\nHis bicarbonate at 31.1 is marginally above the upper limit of 31. Bicarbonate is the body's main acid buffer in the blood. At this margin, 0.1 above the upper limit, this is laboratory variation and not clinically meaningful.\n\nHis total antioxidant activity (TAA) at 1.8 is marginally above the upper range of 1.77. This marker measures the blood's capacity to neutralise free radicals, and a result above range is not harmful; it simply reflects a higher-than-average antioxidant capacity, which may come from his fruit and vegetable intake, or from nicotine's complex effects on oxidative stress pathways.\n\nHis oestradiol at 146 is right at the upper boundary of the male range of below 146.1. At this level, with a testosterone of 28.5 and no symptoms of oestrogen excess (gynaecomastia, water retention), this is physiologically balanced. A high testosterone will naturally produce more oestradiol through the aromatase enzyme, and the ratio between the two is healthy.\n\nPutting his symptoms together with the bloods: his bloating and digestive discomfort are most likely driven directly by his ulcerative colitis, even though his inflammatory markers are reassuringly low. Ulcerative colitis causes structural changes to the gut lining that affect motility, gas handling and the gut microbiome, all of which produce bloating even during remission. The low phosphate is consistent with some degree of malabsorption. His poor exercise recovery is likely a combination of sub-optimal ferritin, the mild CK elevation showing adequate muscle damage but possibly inadequate repair substrate, and his diet: ultra-processed food most days and sugary food daily does not provide the micronutrient density or protein quality needed to fuel recovery from hard training. His hair thinning could relate to his borderline ferritin, though at 30 with a testosterone of 28.5, androgenetic alopecia (male-pattern hair loss) is also a possibility and would not show on a blood test. His feeling cold is harder to pin down: his thyroid is healthy, his haemoglobin is good, his iron is borderline but not deficient, and his BMI of 22.1 means he has relatively little insulating body fat. In lean individuals who train regularly, peripheral vasoconstriction (the body directing blood to the core) can cause cold hands and feet, and nicotine from vaping is a vasoconstrictor that compounds this.\n\nHis urinalysis is clean, with no protein, glucose, blood, white cells, nitrites or casts.","links":"The central thread in this report is a lean, insulin-sensitive 30-year-old whose blood sugar, cardiovascular and hormonal health are genuinely strong, but whose ulcerative colitis and dietary habits are creating a gap between where his body is and where it could be.\n\nThe low phosphate, the borderline ferritin and the low transferrin saturation form one connected picture. All three minerals are absorbed in the upper gut, and ulcerative colitis, even when well controlled on Adalimumab with low inflammatory markers, can cause subtle malabsorption that keeps stores from reaching optimal. Phosphate below range is the clearest signal, but ferritin sitting at 38 in a young man who trains hard tells the same story from a different angle. These nutritional gaps likely contribute to at least two of his four reported symptoms: poor exercise recovery and hair thinning.\n\nThe mildly low neutrophil count connects to his treatment rather than his disease activity. Adalimumab suppresses TNF-alpha, which plays a role in neutrophil survival and production. With an hsCRP of 0.9 and an ESR of 2, the colitis itself does not appear to be driving inflammation or immune suppression. The immune picture is therefore one of controlled disease with a mild, expected medication side effect rather than active flare.\n\nThe low C-Peptide, when set alongside a perfect fasting glucose, HbA1c and HOMA-IR, is a reflection of efficient physiology rather than pathology. His pancreas produces little insulin because little is needed. This is worth noting because it could look alarming in isolation, and the sample handling note adds a further reason to interpret it conservatively.\n\nThe dietary pattern is the loose end. Ultra-processed food most days and daily sugary food, with only 2 to 3 portions of vegetables and fruit, is at odds with his goals. For someone with an inflammatory bowel condition, diet quality has a direct effect on gut symptoms, microbiome diversity and the inflammatory load the Adalimumab is managing. For someone wanting to build muscle, the quality and quantity of protein, the micronutrient density and the overall calorie composition matter as much as training. His cardiovascular and metabolic markers are excellent now, at 30, but the dietary pattern he describes is the kind that erodes those numbers over the next decade. Addressing the diet is the single biggest lever in this report, both for his gut health and his performance goals.\n\nThe symptoms that the bloods do not fully explain, feeling cold and waking tired, are most likely driven by factors blood cannot measure. Nicotine from vaping constricts blood vessels and could account for the cold hands and feet. Waking tired despite 7 to 8 hours of sleep suggests poor sleep quality rather than inadequate duration, and vaping nicotine, particularly in the evening, is a stimulant that fragments sleep architecture even when total hours look adequate.","lifestyle":"Cut back on ultra-processed food to no more than twice a week, replacing it with whole-food meals built around protein, vegetables and complex carbohydrates. Anchor: when you would normally order takeaway or reach for a ready meal, cook a simple alternative (chicken and rice, eggs on toast with vegetables, a stir-fry). Why: your diet is the biggest lever in this report; ultra-processed food is associated with worse gut symptoms in ulcerative colitis, and your low phosphate and borderline ferritin suggest your current diet is not delivering the micronutrients your body needs.\nAdd a palm-sized portion of protein to every meal, aiming for at least 115 to 130 grams of protein per day. Anchor: protein goes on the plate first, before anything else. Why: at 72 kg training hard, you need 1.6 to 1.8 grams per kilogram to support muscle growth and recovery, and your CK of 354 shows your muscles are breaking down from training but may not have the substrate to rebuild.\nReplace daily sugary food and drink with whole fruit, Greek yoghurt or dark chocolate. Anchor: when you crave something sweet, swap rather than restrict. Why: your blood sugar control is excellent now; this habit keeps it that way into your 40s and reduces the inflammatory load on your gut.\nEat more iron-rich and phosphate-rich foods: red meat twice a week, eggs, lentils, beans, nuts, seeds and dark leafy greens. Anchor: add one of these to lunch or dinner daily. Why: your ferritin at 38 and phosphate at 0.6 are both below optimal, and dietary sources are the safest first step given your gut condition.\nIncrease vegetable and fruit portions from 2 to 3 up to at least 5 a day. Anchor: add one extra portion to lunch and one to dinner this week. Why: fibre diversity feeds the gut microbiome, which is directly relevant to your ulcerative colitis and bloating, and vegetables are a primary source of the phosphate, magnesium and folate your body needs.\nStop vaping at least two hours before bed, and ideally begin reducing nicotine concentration with the aim of stopping. Anchor: set a fixed cut-off time in the evening. Why: nicotine is a stimulant that fragments sleep (you wake tired despite adequate hours) and a vasoconstrictor that explains your cold hands and feet.\nKeep a fixed wake time seven days a week, and get outside within 30 minutes of waking. Anchor: alarm goes off, curtains open, walk outside before coffee. Why: morning light resets the circadian clock and improves sleep quality, which is the missing piece behind waking tired.\nCalorie target: approximately 2,500 to 2,700 kcal per day to support training and a slight surplus for muscle gain. Protein target: 115 to 130 g per day (1.6 to 1.8 g per kilogram). These numbers assume continued training at current intensity; if training increases, calories should increase with it.","flags":"Phosphate 0.6, below the lower limit of 0.78. Low phosphate in the context of ulcerative colitis suggests gut malabsorption. Phosphate is essential for ATP production, bone mineralisation and muscle function. Recommend repeat testing, dietary review and discussion with his gastroenterologist about whether supplementation is warranted.\nNeutrophils 1.92, below the lower limit of 2.0. Mild neutropaenia is a recognised effect of Adalimumab (anti-TNF therapy). His total white cell count at 4.02 is borderline low but within range, and all other white cell lines are normal. Worth monitoring; the gastroenterologist or GP should be aware.\nC-Peptide 0.672 ug/L (approximately 222 pmol/L), below the lower limit of 1.1 ug/L. In the context of a fasting glucose of 4.5, HbA1c of 36, insulin of 2.86 and HOMA-IR of 0.57, this reflects low insulin demand rather than pancreatic insufficiency. Sample degradation may also contribute. No action required.\nFerritin 38, within the laboratory range (22 to 322) but below the optimal threshold of 50 for a male. Transferrin saturation 24.4 percent, just below the ideal of 25 percent. Sub-optimal iron stores in a man with ulcerative colitis training at hard intensity. Dietary optimisation first; low-dose supplementation if ferritin does not improve.\nCreatine kinase 354, above the upper limit of 320 by a small margin. Expected finding in someone training at hard intensity with two resistance sessions per week. Not a sign of muscle disease at this level.\nBicarbonate 31.1, marginally above the upper limit of 31. At 0.1 above range, this is laboratory variation and not clinically significant.\nTotal antioxidant activity 1.8, marginally above the upper range of 1.77. An above-range TAA is not harmful and reflects higher antioxidant capacity.\nCystatin C 1.05, within range (below 1.1) but slightly higher than expected for a lean 30-year-old. Combined creatinine-cystatin C eGFR is 89, just below the optimal threshold of 90. Worth repeating at next test to establish a trend.\nReassuring negatives: hsCRP 0.9 (no systemic inflammation despite ulcerative colitis), ESR 2, thyroid function and antibodies normal (excludes thyroid as cause of cold intolerance and hair thinning), coeliac screen negative, PSA and tumour markers clean, immunoglobulins within range, rheumatoid factor negative, urinalysis clean, HbA1c 36, fasting glucose 4.5, testosterone 28.5, liver panel clean with FIB-4 1.13, lipid profile excellent with ApoB 0.7 and Lp(a) below 25.","recommendations":"Discuss the low phosphate of 0.6 (below 0.78) with your GP or gastroenterologist. A repeat phosphate level on a fresh sample, alongside a review of whether your ulcerative colitis management needs adjustment to improve mineral absorption, would be appropriate.\nMention the neutrophil count of 1.92 (below 2.0) to your gastroenterologist at your next review. Ask whether this is being monitored as part of your Adalimumab treatment and whether any adjustment is needed.\nAsk your GP to check ferritin again in three to four months after increasing dietary iron intake. If it has not risen above 50, a trial of low-dose ferrous bisglycinate (25 mg with vitamin C) would be reasonable, though gut tolerance should be discussed given your ulcerative colitis.\nDiscuss the hair thinning with your GP. If ferritin does not improve it, a referral to dermatology to assess for androgenetic alopecia would be the next step.\nIf cold hands and feet persist after reducing or stopping nicotine, mention it at your next GP visit for a clinical assessment of peripheral circulation.\nRetest in four to six months with a focused panel: ferritin, phosphate, full blood count (to recheck neutrophils), cystatin C and CK. This will show whether the dietary changes have moved the needle.","supplementation":"Vitamin D3 (cholecalciferol): 2,000 IU daily, taken with your largest meal (which contains fat for absorption). Your level at 100 is at the lower boundary of optimal; this dose maintains it through winter. Always take with vitamin K2.\nVitamin K2 (MK-7): 100 mcg daily, taken with vitamin D3. Vitamin K2 directs calcium into bone rather than arteries and is an essential partner to vitamin D supplementation.\nMagnesium glycinate: 300 mg before bed. Your magnesium at 0.9 is within range but a glycinate form supports sleep quality (you wake tired) and muscle recovery (you report poor recovery), and glycinate is the best-tolerated form for people with gut conditions.\nOmega-3 fish oil: 2 g EPA and DHA combined daily, taken with food. Omega-3 has anti-inflammatory properties that are specifically relevant to ulcerative colitis, and supports cardiovascular health long-term.\nDo not take iron supplements without discussing with your GP or gastroenterologist first. Your ferritin is below optimal but not deficient, and iron supplements can irritate the gut in ulcerative colitis. Dietary iron is the safer first step; if supplementation is agreed, ferrous bisglycinate 25 mg with vitamin C on an empty stomach is the gentlest option.\nThe most important changes from this report are not supplements. They are reducing ultra-processed and sugary food, increasing protein to 115 to 130 g per day, eating more iron-rich and phosphate-rich whole foods, and addressing the nicotine that is fragmenting your sleep and constricting your blood vessels.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6727","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 74 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 80.7; held to 74 by a system rated \"Needs attention\". Weakest systems: electrolytes & minerals 45%, specialized tests 53%, hormones 65%. Biggest drags: Phosphate, White Cell Count, C-Peptide, Creatine Kinase.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"22.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3229","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is a biological ageing score calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. RDW was assumed at 13% as the laboratory did not report it separately. His PhenoAge of 22.6 is 7.4 years younger than his calendar age of 30, indicating that his body is ageing more slowly than average. The main drivers of this favourable score are his low CRP of 0.9, healthy glucose of 4.5, low white cell count and normal MCV. Maintaining his metabolic health and improving his diet will help preserve this advantage.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built by current biomarker levels, not a ten-year event probability. His score of 15 is within the ideal band of 20 or below, driven by his excellent ApoB of 0.7, low triglycerides, healthy LDL and low CRP. The only input pulling it upward is his HDL of 1.3 sitting just below ideal.","low_causes":"Excellent lipid profile, low inflammation, healthy blood sugar","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5600","units":"mmol/l","description":"Fasting blood glucose is the concentration of sugar in the blood after an overnight fast. His result of 4.5 sits within the ideal range of 4.0 to 5.4, reflecting healthy blood sugar regulation. Combined with his excellent HbA1c and low insulin, this confirms strong metabolic control.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress response, high-carbohydrate diet, medications such as corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3889","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5467","units":"%","description":"HbA1c measured as a percentage reflects the average blood sugar level over the past two to three months. His result of 5.5% is well within the normal range (below 6.0%) and corresponds to an HbA1c ensitivity, early type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, excess carbohydrate intake, obesity, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.672","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1937","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5909","units":"ug/l","description":"C-Peptide is released by the pancreas in equal amounts to insulin and is the most reliable measure of actual insulin production. His result of 0.672 is below the laboratory range of 1.1 to 4.4. However, in the context of a fasting glucose of 4.5, HbA1c of 36 and HOMA-IR of 0.57, this low result reflects the fact that his body simply does not need much insulin. The lab notes that C-Peptide can degrade in samples not separated quickly, which may also have contributed. This is not a sign of pancreatic failure.","low_causes":"Low insulin demand from high insulin sensitivity, low carbohydrate diet, sample degradation, early type 1 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease reducing clearance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4033","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.3","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2667","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) estimates how resistant the body's tissues are to insulin, calculated from fasting glucose and fasting insulin. His resu // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){

  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');

    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
