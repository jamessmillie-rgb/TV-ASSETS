<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Irina Goikhberg","dob":"16/03/1965","report_date":"2026-10-28","summary":"Customer is a 61-year-old female presenting with a BMI of 22.7, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). She does no dedicated cardio but trains with resistance four times per week at easy intensity, with 10,000 to 15,000 daily steps. She sleeps 6 to 7 hours, wakes feeling refreshed, and her energy is steady through the day. Stress feels hard to manage some weeks. She drinks 1 to 4 alcoholic drinks per week. She takes no medications and has no diagnosed conditions. She supplements with vitamin D, vitamin B12 and protein powder. This is her first blood test with TrueVitals. She reports no symptoms. Her goals are to improve long-term health and longevity, prevent disease and boost her immune system.\n\nThis is an excellent set of results for a 61-year-old woman. Her PhenoAge, a composite biological ageing score built from nine blood markers including albumin, glucose, CRP, lymphocyte percentage and white cell count, comes in at 48.6 against a calendar age of 61, meaning her blood is ageing roughly twelve and a half years younger than her birth certificate. That is a genuinely impressive result and reflects the combined effect of a healthy weight, good diet, consistent training and low inflammation.\n\nHer metabolic health is outstanding. Blood glucose at 5.4 sits right at the upper boundary of the optimal range, and HbA1c at 37 mmol/mol, a measure of average blood sugar over three months, is within the reference range below 42, just above the optimal ceiling of 36. Insulin at 5.79 is well within the optimal window of 2.6 to 8, meaning the pancreas is producing a modest amount of insulin and the cells are responding to it efficiently. HOMA-IR, an index that multiplies glucose by insulin to estimate insulin resistance, comes in at 1.39, within the healthy range and below the 1.5 upper limit. C-Peptide at 2.11 ug/L confirms the pancreas is producing insulin at a healthy, measured rate. The TyG index, another insulin resistance marker built from triglycerides and glucose, is 8.37 and within the optimal band. This is a metabolic profile that most people half her age would be pleased with.\n\nHer liver is in excellent health. ALT at 15 and GGT at 14 are both well below the optimal thresholds, meaning the liver is under no metabolic strain. AST at 19 is healthy. The De Ritis ratio, which compares AST to ALT, is 1.27 and within the optimal range. The APRI score, a fibrosis screening tool that uses AST and platelets, is 0.219, well below the 0.5 optimal ceiling. FIB-4, a broader fibrosis score that factors in age and platelets, is 1.38. At 61, age pushes this calculation upward, and the score is below the age-adjusted threshold of 2.0 that applies to patients over 65, while all the actual liver enzymes are clean. The NAFLD Fibrosis Score at minus 1.625 sits within the optimal band, ruling out any suggestion of fatty liver scarring. Albumin at 42, bilirubin at 13, total protein at 71 and the amylase and lipase pancreatic enzymes are all healthy. This liver is working beautifully.\n\nHer kidney function is solid. Cystatin C at 1.0 gives a Cystatin C eGFR of 82, and the combined creatinine and Cystatin C eGFR is also 82. These sit above the 60 threshold for concern but below the 90 optimal line. At 61, some decline from the peak filtration rate of the twenties is entirely expected, and an eGFR in the low eighties is age-appropriate and healthy. Urea at 4.7, creatinine at 67 and the urea-to-creatinine ratio at 70.1 are all within ideal ranges. Uric acid at 273 is well within the female optimal range. Electrolytes are balanced: sodium 143, potassium 4.4, chloride 106, bicarbonate 29.3 and calculated osmolality at 296.1, which is marginally above the reference ceiling of 295 but clinically insignificant at this margin.\n\nHer thyroid is working well. TSH at 2.0, the signal from the pituitary gland that tells the thyroid how hard to work, is right in the middle of the optimal 1.0 to 2.5 window. Free T4 at 19.1, the main circulating thyroid hormone, is in the upper part of the optimal range. Free T3 at 5.7, the active form the cells actually use, is within the optimal band of 4.5 to 6.5. The FT3-to-FT4 ratio at 0.298 confirms good conversion from storage hormone to active hormone. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. The absence of these antibodies is particularly reassuring.\n\nHer inflammatory markers are exceptionally low. High-sensitivity CRP at 0.2, a marker of systemic inflammation and an independent cardiovascular risk factor, is well below the 1.0 optimal ceiling and about as low as this marker gets. ESR at 4 is clean. The Platelet-to-Lymphocyte Ratio at 153.9 and the Systemic Immune-Inflammation Index at 311 are both within their optimal ranges. Rheumatoid factor is negative, and IgE at 4.58 is very low, showing no allergic or parasitic immune activation.\n\nHer immune system is healthy. IgG at 9.5, IgA at 1.8 and IgM at 1.6, the three main classes of antibody, are all within their reference ranges, showing balanced immune function. Tissue transglutaminase IgA is negative, ruling out coeliac disease. Her iron studies show a healthy picture: ferritin at 54 is within the female optimal range of 40 to 150, serum iron at 16.6 is healthy, and transferrin saturation at 27.31 percent is within the optimal 25 to 40 percent window. Her full blood count is largely reassuring, with haemoglobin at 134, red cell count at 4.21, platelets at 217 and MCV at 91.6 all sitting comfortably within range. Reticulocyte percentage at 1.02 is healthy. Creatine kinase at 118 is normal for someone doing four resistance sessions a week. Calcium at 2.36, phosphate at 1.4, magnesium at 0.87 and parathyroid hormone at 2.248 are all within their optimal ranges, and calcium alongside PTH confirms bone mineral metabolism is well regulated. The tumour markers CA125 at 5.2, CA15-3 at 4.82, CA19-9 below 1.2 and CEA below 0.5 are all reassuringly low. Cortisol at 366 is within the expected morning range. Prolactin at 344 is within the postmenopausal reference. DHEA-S at 1.8 umol/L is within range.\n\nHer hormonal profile confirms postmenopausal status. FSH at 104.21, a hormone released by the pituitary gland to stimulate the ovaries, is well above the 23 threshold that confirms the menopause. LH at 38.57 is consistent with this. Oestradiol, the main oestrogen, is below 43 pmol/L, which is within the postmenopausal reference of 0 to 118.2 and expected at this stage. Progesterone at 1.07 is within the postmenopausal range. These are not abnormal findings; they are the expected hormonal pattern after menopause. Total testosterone at 0.7 is within the female reference range. However, free testosterone, calculated at 0.008 nmol/L, sits just below the lower limit of 0.01. SHBG at 61.5, the protein that binds testosterone and makes it unavailable to cells, is within range but sitting in the upper half, which explains why free testosterone is low: SHBG is binding most of the already modest total testosterone. Bioavailable testosterone at 0.19 is within range. Free testosterone is the fraction the muscles, brain and libido actually respond to, and at this level it may contribute to difficulty building muscle despite consistent resistance training, or to subtle changes in energy, motivation or libido. She reports no symptoms, so this is a finding to be aware of rather than to act on urgently, but it is worth mentioning to her GP if she notices any of those changes in the future.\n\nTurning to the findings that need attention. Her Cardiovascular Risk Score, a TrueVitals composite index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 35 out of 100. This is within the acceptable range below 40 but above the ideal ceiling of 20, and the markers driving it are LDL and ApoB. Her total cholesterol at 6.4 is above the desirable threshold of 5.18. LDL cholesterol at 3.81 is above the 3.0 upper limit, and non-HDL cholesterol at 4.2 is above the 4.0 target. ApoB at 0.97, a direct count of the number of potentially harmful cholesterol-carrying particles in the blood, is above the 0.9 desirable threshold and above the 0.8 optimal target. Lp(a), an inherited lipoprotein that adds to cardiovascular risk and cannot be changed by diet or exercise, is below 25 nmol/L, which is ideal and below the 32 threshold. This is genuinely useful information because it means the elevated LDL and ApoB are driven entirely by modifiable factors, not by genetics. The Lp(a)-corrected LDL at 3.73 confirms this. The positive side of her lipid profile is excellent: HDL at 2.2 is outstanding, well above the 1.6 optimal threshold for women, and represents strong reverse cholesterol transport. Triglycerides at 1.0 are at the optimal ceiling. The TG-to-HDL ratio at 0.45, one of the best surrogate markers for insulin resistance and small dense LDL particles, is excellent. The ApoB-to-ApoA1 ratio at 0.505 is below the 0.6 lower-risk threshold, meaning the balance between harmful and protective particles still favours protection. The Atherogenic Index of Plasma at minus 0.342 is within the optimal range, confirming the particle pattern is not atherogenic. In summary, the lipid picture is mixed: the protective markers are exceptional, but the LDL and ApoB are above the levels associated with long-term cardiovascular health, and given her goals of disease prevention and longevity, bringing ApoB below 0.9 and ideally below 0.8 is the single most impactful change this report can offer. The levers are dietary: increasing soluble fibre from oats, beans, lentils and barley, eating oily fish two to three times per week, moderately reducing saturated fat from butter, cheese and red meat, and maintaining the already healthy weight. If these do not move the numbers within six months, a conversation with her GP about whether medication is appropriate would be reasonable.\n\nHer vitamin D at 81 is above the sufficiency threshold of 50 and within the optimal range of 75 to 120, reflecting her supplementation. Vitamin B12 at 470 is within range and above the deficiency threshold but below the 500 optimal floor. Given she already supplements with B12, it may be worth checking the form: sublingual methylcobalamin is absorbed more reliably than standard oral tablets, and the dose may need a small increase to push the level above 500. Folate at 17 sits right at the top of the reference range, which is healthy.\n\nHer white cell count at 3.91 is fractionally below the lower limit of 4.0. Neutrophils at 2.02 are at the very bottom of the range, and lymphocytes at 1.41 are within range. A white cell count marginally below 4.0 in a lean, healthy 61-year-old woman with no symptoms, no infections and very low inflammatory markers is most likely benign ethnic or constitutional neutropenia, a normal variant seen in a significant proportion of the population, particularly those of European ancestry. The rest of the immune system, the immunoglobulins, ESR and CRP, shows no sign of immune compromise. This is worth noting on her records so that future tests are interpreted in context, but it does not need treatment.\n\nHer absolute reticulocyte count at 42.9 is marginally below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a count just below range alongside a healthy haemoglobin of 134, a healthy MCV and adequate iron stores simply means the bone marrow is producing red cells at a steady, unhurried rate because there is no demand for more. This is not a concern.\n\nTransferrin at 2.42 is marginally below the lower limit of 2.5. Transferrin is the protein that carries iron in the blood, and a level just below range with healthy ferritin, healthy iron and a healthy saturation percentage is clinically insignificant. Transferrin rises when iron stores are low and falls when they are adequate, so a level fractionally below range with a ferritin of 54 simply reflects a body that is not asking for more iron transport capacity.\n\nMCHC at 348 is marginally above the upper limit of 345. MCHC measures the average concentration of haemoglobin within each red cell, and at this margin, this is usually a measurement variation rather than a true abnormality. It has no clinical significance.\n\nTotal Antioxidant Activity at 1.96 is above the upper reference of 1.77. This marker measures the combined antioxidant capacity of the blood, and a level above range is a positive finding, likely reflecting her good vegetable intake and supplementation. It is not a concern.\n\nHer urinalysis shows one finding worth noting. White blood cells in the urine are at 50 per microlitre, above the significance threshold of 10. However, nitrites are negative, bacterial count is below 1, the culture shows no growth, and she reports no urinary symptoms such as pain, frequency or urgency. In a postmenopausal woman, white cells in the urine without bacteria or symptoms can reflect vaginal contamination of the sample, mild mucosal irritation related to lower oestrogen levels, or a transient finding. This does not need treatment, but if she develops any urinary symptoms in the future, a repeat sample would be sensible. The remainder of her urinalysis, including protein, glucose, ketones and red blood cells, is clean.","links":"The dominant story in this report is one of excellent health maintenance at 61. The metabolic, hepatic, thyroid, inflammatory and immune systems are all functioning at or near optimal levels, and the PhenoAge of 48.6 reflects the cumulative effect of a healthy weight, consistent activity and a good diet. The twelve-and-a-half-year gap between biological and chronological age places her well ahead of the curve for long-term health and disease prevention, which are her stated goals.\n\nThe one area where the results diverge from the otherwise clean picture is the lipid panel. LDL at 3.81, ApoB at 0.97 and non-HDL at 4.2 are all above their targets, and these are the markers most directly linked to the gradual accumulation of plaque in artery walls over decades. The fact that Lp(a) is below 25 means none of this is driven by an inherited lipoprotein she cannot change; the entire elevation is modifiable through diet and, if needed, medication. The protective side of the lipid panel, HDL at 2.2, triglycerides at 1.0, an ApoB-to-ApoA1 ratio below 0.6 and an atherogenic index well in the negative, is genuinely excellent and means the net risk is lower than the LDL number alone would suggest. The Cardiovascular Risk Score of 35 captures this balance: above the ideal 20 but within the acceptable 40, with LDL and ApoB as the clear drivers.\n\nThe hormonal picture is entirely consistent with postmenopausal physiology. FSH above 100, oestradiol below 43 and progesterone at 1.07 confirm the ovaries have ceased cycling. Free testosterone at 0.008, just below range, is the one hormonal finding that could become relevant. SHBG at 61.5 is binding the majority of an already modest total testosterone, leaving very little in the free fraction that tissues can use. She is asymptomatic, so this is a finding to monitor rather than treat, but it connects to her resistance training goals because free testosterone supports muscle protein synthesis and recovery.\n\nThe mildly low white cell count, low absolute reticulocytes and marginally low transferrin form a loose cluster that might look concerning in isolation but makes sense together. At 61, lean, with no symptoms, no inflammation and no infection, a white cell count of 3.91 is most likely a constitutional baseline. The bone marrow is producing red cells at a rate that matches demand, no more, and transferrin is low because iron stores are adequate and the transport system is not being asked to work harder. None of these findings suggest pathology.\n\nWhat was excluded matters as much as what was found. The thyroid panel, including both antibody tests, is entirely normal. Her glucose, insulin and HbA1c are all within healthy ranges, providing reassurance on metabolic grounds. These are markers worth monitoring every twelve to eighteen months, and the fact that they are clean at 61 is genuinely reassuring.","lifestyle":"Add a serving of soluble fibre to breakfast every day: a bowl of porridge oats, or oats stirred into yoghurt, or a handful of oat bran sprinkled on whatever you already eat. Anchor: first thing in the kitchen, before the kettle. Why: soluble fibre binds cholesterol in the gut before it reaches the bloodstream and is one of the most effective dietary tools for lowering LDL from 3.81 toward the 3.0 target.\nEat oily fish (salmon, mackerel, sardines, trout) two to three times per week, replacing one red meat or cheese-based meal each time. Anchor: weekly shop, pick two fish meals for the week. Why: omega-3 from oily fish lowers triglycerides, raises HDL (already excellent at 2.2) and provides anti-inflammatory benefit, while reducing saturated fat intake helps lower ApoB from 0.97 toward the 0.8 target.\nAdd one or two portions of beans, lentils or chickpeas per week to meals you already cook, as a side dish, in soups, or stirred into stews. Anchor: when you plan dinners for the week, one gets legumes. Why: legumes provide soluble fibre, plant protein and resistant starch, all of which support cholesterol reduction and blood sugar stability.\nAdd one dedicated cardio session per week alongside your four resistance sessions. A 30 to 40 minute brisk walk, cycle or swim at a pace where you can talk but not sing. Anchor: pick a fixed day and time, treat it like a resistance session. Why: regular cardiovascular exercise directly lowers LDL and ApoB and supports the long-term heart health and disease prevention goals at the centre of this report. Your daily step count is already excellent; this adds a sustained elevated heart rate.\nKeep your protein intake at 83 to 102 grams per day, which is 1.3 to 1.6 grams per kilogram of bodyweight. Your protein powder supplement is helping. Distribute it across three meals rather than concentrating it in one. Anchor: palm-sized protein portion at every meal. Why: even protein distribution supports muscle protein synthesis across the day, which matters more as free testosterone sits at the lower boundary.\nMaintain your current sleep of 6 to 7 hours. If you can extend to 7 to 7.5 hours on most nights, this supports immune function (relevant given a white cell count at the lower boundary), muscle recovery from resistance training, and long-term cognitive health. Anchor: set a fixed wind-down time 30 minutes before your target bedtime, screens off. Why: sleep is the single most under-appreciated lever for the longevity and disease prevention goals in this report.\nYour daily calorie target to maintain your healthy weight of 64 kg is approximately 1,900 to 2,050 calories. Your BMR is roughly 1,320 calories, and with four resistance sessions per week and 10,000 to 15,000 daily steps, a multiplier of 1.45 to 1.55 is appropriate. There is no need to lose weight; maintain current intake and focus on food quality.","flags":"LDL cholesterol 3.81 mmol/L, above the 3.0 upper limit. ApoB 0.97 g/L, above the 0.9 desirable threshold and the 0.8 optimal target. Non-HDL cholesterol 4.2, above the 4.0 target. Total cholesterol 6.4, above the 5.18 desirable level. These are the main modifiable cardiovascular risk factors in this report. Lp(a) below 25 confirms the elevation is entirely lifestyle-driven. The protective markers (HDL 2.2, triglycerides 1.0, ApoB/A1 ratio 0.505, atherogenic index minus 0.342) are all excellent, so the net risk is moderate rather than high. Dietary soluble fibre, oily fish and modest saturated fat reduction are the first-line approach; if six months of dietary change does not bring ApoB below 0.9, discuss statin therapy with her GP.\nFree testosterone (calculated) 0.008 nmol/L, below the lower limit of 0.01. Total testosterone 0.7 is within range, but SHBG at 61.5 is binding most of it. She is asymptomatic, so this is a finding to monitor. If she develops difficulty building muscle, low libido, low motivation or fatigue, this should be revisited with her GP.\nWhite cell count 3.91, marginally below the lower limit of 4.0, with neutrophils at 2.02 at the floor of range. In a lean, healthy woman with no symptoms, no infections, and CRP 0.2 and ESR 4, this is most likely a constitutional baseline. Worth recording so future tests are interpreted in context.\nAbsolute reticulocyte count 42.9, below the lower limit of 50, alongside a healthy haemoglobin of 134 and adequate iron stores. The bone marrow is producing red cells at a rate that matches demand. Not a concern.\nTransferrin 2.42 g/L, marginally below the lower limit of 2.5. With ferritin 54, serum iron 16.6 and saturation 27 percent all healthy, this reflects adequate iron stores rather than pathology.\nMCHC 348 g/L, marginally above the upper limit of 345. At this margin, usually a measurement variation. No clinical significance.\nUrine white blood cells 50 per microlitre, above the significance threshold of 10. Nitrites negative, culture no growth, no symptoms. In a postmenopausal woman, likely vaginal contamination or mild mucosal changes. No treatment needed; repeat if urinary symptoms develop.\nReassuring negatives: thyroid function and both antibodies normal, HbA1c 37 and HOMA-IR 1.39 within healthy ranges, liver enzymes all clean with fibrosis scores normal, kidney function age-appropriate, CRP 0.2 and ESR 4 (no systemic inflammation), all tumour markers within range, coeliac screen negative, immunoglobulins balanced, calcium and PTH normal, vitamin D sufficient, urinalysis otherwise clean.","recommendations":"Discuss her lipid results with her GP: LDL 3.81 (target below 3.0), ApoB 0.97 (target below 0.9), non-HDL 4.2 (target below 4.0). Explain that Lp(a) is ideal, so the elevation is modifiable. Ask whether dietary intervention alone is reasonable for six months before considering medication, given her excellent protective markers (HDL 2.2, TG/HDL 0.45, ApoB/A1 0.505).\nMention the white cell count of 3.91 to her GP so it is noted on her records as a likely constitutional baseline. No investigation is needed unless it drops further or she develops recurrent infections.\nMention the free testosterone of 0.008 to her GP for awareness. No action is needed while she is asymptomatic, but if symptoms develop (difficulty building muscle, low libido, fatigue, low mood), it provides a starting point for investigation.\nIf she develops any urinary symptoms (burning, frequency, urgency), repeat a midstream urine sample. The current finding of white cells without bacteria or symptoms does not need treatment.\nRetest in six months with a focused lipid panel (total cholesterol, LDL, HDL, triglycerides, ApoB, ApoA1) to assess the impact of dietary changes. A full panel repeat at twelve months. Calorie target: 1,900 to 2,050 calories per day to maintain weight. Protein target: 83 to 102 grams per day (1.3 to 1.6 g/kg).","supplementation":"Vitamin D3 (cholecalciferol): continue current supplementation at 2,000 IU daily, taken with a meal containing fat. Her level at 81 is within the optimal range of 75 to 120 and the current dose is maintaining it well. Why: supports bone density, immune function and long-term disease prevention.\nVitamin K2 (MK-7): 100 mcg daily, taken alongside the vitamin D. Why: vitamin K2 directs calcium into bones and teeth and away from artery walls, complementing both the vitamin D and her cardiovascular goals.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Her level at 470 is within range but below the 500 optimal floor despite current supplementation. Switching to a sublingual methylcobalamin form, if not already using one, will improve absorption. Why: B12 supports red blood cell production, neurological function and energy metabolism.\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily, taken with food. Why: omega-3 supports the reduction of ApoB and LDL, lowers triglycerides, and provides anti-inflammatory benefit. This is the supplement most directly targeted at her lipid findings.\nMagnesium glycinate: 300 mg before bed. Her serum magnesium at 0.87 is within the optimal range, but magnesium glycinate supports sleep quality, muscle recovery from resistance training, and stress resilience on the weeks stress feels harder to manage. Why: glycinate is the best-absorbed form and has a mild calming effect that supports the transition from 6 to 7 hours of sleep.\nThe most important changes from this report are not supplements. They are adding soluble fibre and oily fish to the diet to bring LDL and ApoB into the optimal range, and adding one cardiovascular training session per week to support long-term heart health.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6545","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 72 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 71.6. Weakest systems: lipids & cardiovascular 27%, hematology 79%, electrolytes & minerals 92%. Biggest drags: LDL Cholesterol, Apolipoprotein B, White Blood Cell Count, Total Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"48.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3682","lower_normal":"","upper_normal":"66","lower_optimal":"","upper_optimal":"61","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4621","units":"years","description":"PhenoAge is a composite biological ageing score built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Her PhenoAge of 48.6 against a calendar age of 61 means her blood is ageing approximately twelve and a half years younger than her chronological age. The main drivers of this favourable gap are her very low CRP at 0.2, healthy albumin at 42, normal glucose at 5.4 and well-controlled RDW at 13. This is an exceptional result and one of the strongest indicators of long-term health in the report.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built, not a ten-year event probability. Her score at 35 is within the acceptable range below 40 but above the ideal ceiling of 20. The two markers driving the score are ApoB at 0.97 and LDL at 3.81. The protective factors, HDL at 2.2, triglycerides at 1.0 and CRP at 0.2, are keeping the score from being higher. Bringing ApoB below 0.9 through dietary changes is the most direct way to lower this score.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1339","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT is an enzyme found mainly inside liver cells. When the liver is under stress, whether from alcohol, medication, fatty deposits or inflammation, ALT leaks into the bloodstream and the level rises. Her ALT at 15 is well below both the laboratory upper limit of 56 and the tighter optimal ceiling of 25 for women, meaning the liver cells are healthy and intact with no sign of metabolic strain.","low_causes":"","high_causes":"Fatty liver disease, alcohol, medications, hepatitis, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST is an enzyme found in the liver, heart gest single predictors of cardiovascular risk. Her ratio at 0.505 is below the 0.6 lower-risk threshold for women, meaning the balance between atherogenic and protective particles still favours protection despite the elevated ApoB. This is a reassuring counterweight to the LDL and ApoB findings.","low_causes":"","high_causes":"High ApoB with low ApoA1","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lp(a) is a genetically determined lipoprotein that adds to cardiovascular risk independently of LDL. It cannot be changed by diet or exercise. Her Lp(a) below 25 is within the ideal range below 32, and this is genuinely useful information: it means her elevated LDL and ApoB are driven entirely by modifiable lifestyle factors, not by an inherited lipoprotein. This makes her lipid profile highly responsive to dietary changes.","low_causes":"","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1500","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"ratio","description":"The triglyceride-to-HDL ratio is one of the best surrogate markers for insulin resistance and the predominance of small, dense LDL particles. Her ratio at 0.45 is well within the optimal range below 0.87, confirmin const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

  const st = statusOf(b);

  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail

  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;

  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">

      <span class="bc-tick tick-${col}"></span>

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
