<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Jessie Thomas","dob":"05/01/1988","report_date":"2026-09-02","summary":"Jessie is a 38-year-old female presenting with a BMI of 19.1, following a Mediterranean diet rated 8 out of 10 for quality with a volume of 4 out of 10. She trains four times per week, split evenly between two cardio and two resistance sessions, with 7,500 to 10,000 daily steps. She vapes nicotine. She reports low energy and fatigue, hair thinning and hair loss, and brain fog. Her goals are to improve energy levels, balance hormones, and reduce stress and anxiety.\n\nTwo findings from this panel warrant a conversation with her GP before anything else in the report. The first is her amylase, which at 164 is significantly above the upper limit of 118, and her lipase, which at 79 is above the upper limit of 60. Amylase and lipase are enzymes produced primarily by the pancreas to help digest food. When both are elevated together, it raises the possibility of pancreatic inflammation, a condition called pancreatitis, or less commonly a structural issue such as a blocked duct. At Jessie's age and with no alcohol intake reported, the most likely explanations are either a subclinical episode of pancreatic irritation or salivary gland contribution to the amylase, since amylase is also produced by the salivary glands. However, lipase is more specific to the pancreas, and having both elevated together makes this a finding that her GP should investigate, ideally with a repeat fasting sample and clinical assessment. If she has experienced any upper abdominal pain, nausea, or discomfort after eating, these would be worth mentioning at that appointment.\n\nThe second finding for GP attention is her CA-125, a tumour marker, which at 42.4 is above the upper limit of 35. CA-125 is a protein that can be released by ovarian tissue and by the lining of the abdomen and pelvis. It is important to understand that CA-125 is elevated in a wide range of benign conditions. Endometriosis, ovarian cysts, fibroids, pelvic inflammatory disease, and even menstruation itself can all raise CA-125. At 38, a mildly elevated CA-125 is far more commonly explained by one of these benign causes than by anything sinister. However, NICE guidelines recommend that any CA-125 above 35 should prompt further investigation, typically a pelvic ultrasound, and her GP should arrange this. It may be worth noting where Jessie was in her menstrual cycle when the blood was drawn, as a sample taken during or just after a period can produce a transient rise.\n\nWith those two findings addressed, there is a great deal of positive news in this panel. Jessie's metabolic health is exceptional. Her fasting glucose at 4.4 sits comfortably within the optimal range, her HbA1c at 31 mmol/mol is well below the 36 threshold that marks optimal long-term blood sugar control, and her HOMA-IR, a measure of how sensitively the body responds to insulin, is 0.66, which places her firmly in the insulin-sensitive category. Her insulin at 3.4 and C-peptide at 1.24 are both within range, reflecting a pancreas that is producing just enough insulin to keep blood sugar perfectly controlled without overworking. This is textbook metabolic efficiency.\n\nHer cardiovascular and lipid profile is equally impressive. Total cholesterol at 4.6 is healthy, but it is the composition that stands out. Her HDL, the protective cholesterol that carries fat away from artery walls, is 2.0, which is outstanding. Her LDL at 2.41 is within the optimal range below 2.6, and her triglycerides at 0.36 are remarkably low. Her ApoB, the protein that carries LDL particles into the arterial wall and is considered the single best marker of cardiovascular risk, is 0.64, well below the 0.8 optimal threshold. Her ApoB to ApoA-I ratio at 0.44 is in the lower risk category, and her Lp(a), an inherited and unchangeable cardiovascular risk marker, is below 25, which means her genetic cardiovascular risk from this marker is low. This is genuinely useful information because it means her already excellent lipid profile is not masking any hidden inherited risk. Her remnant cholesterol at 0.19 and TG/HDL ratio at 0.18 are both well within optimal ranges. Her hs-CRP, the most sensitive measure of systemic inflammation, is 0.4, which at this level indicates virtually no inflammatory activity. Taken together, her cardiovascular risk profile is among the best that can be achieved.\n\nHer liver is in excellent health. ALT at 12 is well below the optimal female threshold of 25, Gamma GT at 17 is clean, AST at 23 is mid-range, bilirubin at 12 is healthy, and her FIB-4 score, a composite measure of liver fibrosis risk, is 1.1, comfortably below the threshold. Albumin at 41 confirms good synthetic liver function. Her kidneys are performing well, with an eGFR above 90 by the standard calculation and a Cystatin C-based eGFR of 107, which is a more accurate measure of true kidney filtration. Her Cystatin C itself at 0.82 is healthy. Urea and creatinine are both within range.\n\nHer thyroid is functioning normally. TSH at 2.22 sits within the optimal range of 1.0 to 2.5, Free T4 at 17.6 is within the optimal band of 14 to 20, and Free T3 at 4.6 is at the lower edge of the optimal range of 4.5 to 6.5. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease as a contributor to her fatigue or hair thinning. Her immune system markers, IgG, IgM, IgA, and IgE, are all within their respective ranges, her rheumatoid factor is negative, and her coeliac screen is negative, ruling out coeliac disease as a cause of her symptoms.\n\nHer hormonal picture is consistent with either the follicular or early luteal phase of her cycle. Oestradiol at 218 and progesterone at 2.1 would fit a follicular phase pattern. LH at 9.28 and FSH at 9.19 are within follicular ranges and, importantly, FSH is well below the levels that would suggest perimenopausal changes. Her testosterone at 0.7 is within the female range, and her free androgen index at 1 is healthy. SHBG at 70 is within range, though towards the upper half. DHEA-S at 5.9 umol/L, equivalent to approximately 2,174 ug/dL, is comfortably within range, and prolactin at 143 is normal. Cortisol at 268 is within the expected morning range. Overall, there is no obvious hormonal imbalance driving her symptoms.\n\nNow, the findings that connect directly to how Jessie feels. Her transferrin saturation is 14.37%, below the lower limit of 18%, and her ferritin is 35, which while within the laboratory range of 10 to 291, is below the optimal threshold of 40 for women. Her serum iron at 9.2 is right at the floor of the range. Transferrin saturation measures how much of the body's iron-carrying protein is actually loaded with iron, and at 14% it means her transport system is running underfilled. Ferritin represents stored iron, and at 35 there is not much in reserve. These findings sit alongside an absolute reticulocyte count of 26.8, which is below the lower limit of 50. Reticulocytes are newly made red blood cells released from the bone marrow, and a low count suggests the bone marrow is not producing red cells at full pace, which is exactly what happens when iron supply is insufficient to support production. Her haemoglobin at 124 is within range but sits near the lower boundary of 120, and her haematocrit at 0.363 is right at the floor of its range.\n\nPut these together, and the picture is of early iron depletion. She has not yet developed frank anaemia, but her iron stores are thin, her transport is underfilled, and her bone marrow has already slowed its output in response. This is a pattern that directly causes fatigue, brain fog, and hair thinning, which are exactly the symptoms she reports. The mechanism is straightforward: iron is essential for oxygen transport in the blood, for energy production inside cells, and for the rapid cell turnover that hair follicles require. When supply runs short, the body prioritises oxygen delivery to vital organs and quietly downgrades functions like hair growth.\n\nThe likely driver is her diet volume. At a BMI of 19.1, Jessie is already at the lower end of a healthy weight, and she rates her eating volume at just 4 out of 10. A Mediterranean diet rated 8 for quality is excellent in composition, but if the total amount of food is insufficient, even a perfect diet cannot deliver enough iron. Menstrual losses further deplete iron each month, and if intake is not keeping pace with losses, the stores gradually thin. This is not a crisis, but it is the single most actionable finding in this report and the most likely explanation for all three of her symptoms.\n\nHer chloride at 109 is marginally above the upper limit of 108. In isolation, a one-point elevation in chloride is rarely significant. It can reflect mild dehydration at the time of sampling or a slightly more acidic metabolic environment, which is loosely supported by her bicarbonate sitting at 20.4, right at the floor of its range. Together, these could suggest a mild tendency towards metabolic acidosis, but at these margins this is more likely a hydration effect than a clinical concern. If she was not fasting with adequate water intake before the sample, this alone could explain it.\n\nHer MPV, mean platelet volume, at 10.3 is marginally above the upper limit of 10.1. MPV measures the average size of platelets, and slightly larger platelets simply indicate that the bone marrow is producing younger, more active platelets. At this margin, it is not a concern and does not require any action.\n\nHer vitamin D at 96 is within the optimal range of 75 to 120, her B12 at 630 is within the optimal range of 500 to 900, and her folate at 16 is healthy. Calcium, corrected calcium, phosphate, and parathyroid hormone are all within range, confirming her bone mineral metabolism is working well. Her magnesium at 0.82 is within the laboratory range but falls just below the optimal lower bound of 0.85, which is worth addressing given her goals around stress and anxiety, as magnesium plays a central role in nervous system regulation and sleep quality.\n\nHer total antioxidant activity at 1.38 is within range, her creatine kinase at 128 is healthy for her training load, and her uric acid at 296 is within the optimal female range. Her urinalysis is entirely clean, with no protein, no glucose, no blood, no white cells, no nitrites, no bacteria, and no growth on culture.\n\nIn summary, Jessie has exceptional metabolic, cardiovascular, liver, kidney, and thyroid health. The two findings that need GP attention are the elevated amylase and lipase, which need investigation to exclude a pancreatic cause, and the mildly elevated CA-125, which warrants a pelvic ultrasound. The finding most likely to be driving her day-to-day symptoms of fatigue, brain fog, and hair thinning is early iron depletion in the context of insufficient calorie intake for her body's needs. Addressing her diet volume and iron stores is the single change most likely to make her feel different.","links":"Jessie's results point to three areas of action: a GP conversation for the pancreatic enzymes and CA-125, targeted nutritional changes to address her iron status and energy availability, and a small number of supplements to support recovery.\n\nThe most important conversation is with her GP, and she should bring three numbers: amylase 164 (upper limit 118), lipase 79 (upper limit 60), and CA-125 42.4 (upper limit 35). For the pancreatic enzymes, her GP will likely want to repeat the test fasting and may arrange an abdominal ultrasound to look at the pancreas and biliary system. For the CA-125, NICE guidelines recommend a pelvic ultrasound as a next step when the result exceeds 35. Jessie should mention where she was in her menstrual cycle when the blood was drawn, as this affects interpretation.\n\nFor her iron status, the priority is increasing total food intake. At 47.6 kg and 158 cm with four training sessions per week and 7,500 to 10,000 daily steps, Jessie's estimated maintenance calorie requirement is approximately 1,750 to 1,900 calories per day using a moderate activity multiplier. Rating her diet volume at 4 out of 10 suggests she may be eating significantly below this. She does not need to gain weight aggressively, but consistently eating below maintenance will continue to deplete iron stores and suppress bone marrow output. A target of 1,800 to 1,950 calories per day would support her training, her iron needs, and her energy levels without driving unwanted weight gain. Her protein target should be approximately 62 to 76 grams per day, based on 1.3 to 1.6 g/kg of bodyweight for her activity level.\n\nIron-rich foods should feature prominently: red meat two to three times per week, dark poultry meat, lentils, chickpeas, spinach, and fortified cereals. Pairing plant-based iron sources with vitamin C, such as peppers, tomatoes, or citrus, significantly improves absorption. Tea and coffee should be consumed between meals rather than with them, as the tannins inhibit iron uptake.\n\nFor stress and anxiety management, her magnesium sitting just below optimal is worth addressing both through diet and supplementation. Magnesium-rich foods include pumpkin seeds, almonds, dark chocolate, avocado, and leafy greens. Given her goals around stress, ensuring adequate sleep is important: a fixed wake time, daylight exposure within an hour of rising, a caffeine cut-off by early afternoon (noting that nicotine from vaping also disrupts sleep architecture), and a cool, dark bedroom environment all support better sleep quality and lower cortisol.\n\nRegarding vaping, nicotine is a vasoconstrictor that can impair blood flow to the hair follicle and has been associated with hair thinning. It also raises baseline cortisol and can worsen anxiety. Reducing or stopping vaping would support both her hair and her stress-related goals.\n\nA retest in 12 weeks should include a full blood count, iron studies (ferritin, transferrin saturation, serum iron), reticulocyte count, amylase, lipase, and CA-125. This will confirm whether her iron stores are responding to dietary changes and supplementation, whether the reticulocyte count has recovered, and whether the pancreatic enzymes and CA-125 have normalised.","flags":"GP-URGENT FINDINGS:\n\nAmylase 164 IU/L (upper limit 118) and Lipase 79 U/L (upper limit 60): Both pancreatic enzymes elevated simultaneously. Recommend repeat fasting sample and clinical assessment. Abdominal ultrasound to assess pancreas and biliary tree. Enquire about abdominal symptoms.\n\nCA-125 42.4 U/mL (upper limit 35): Mildly elevated. Per NICE NG12, recommend pelvic ultrasound. Consider timing relative to menstrual cycle. Benign causes (endometriosis, ovarian cyst, fibroids) are statistically far more likely at age 38.\n\nIRON AND HAEMATOLOGY:\n\nTransferrin saturation 14.37% (lower limit 18%): Iron transport underfilled. Serum iron 9.2 at the floor of range (9 to 30.4). Ferritin 35 ng/mL, within lab range but below optimal threshold of 40 for women. Absolute reticulocyte count 26.8 x10^9/L (lower limit 50): Suppressed red cell production consistent with early iron-restricted erythropoiesis. Haemoglobin 124 and haematocrit 0.363 both at the lower boundary of their ranges. Pattern consistent with pre-anaemic iron depletion, likely driven by insufficient caloric intake combined with menstrual losses. Directly relevant to reported fatigue, brain fog, and hair thinning.\n\nELECTROLYTES:\n\nChloride 109 mmol/L (upper limit 108): Marginal elevation, one point above range. Bicarbonate 20.4 at the floor of range (20 to 31). Pattern could suggest mild metabolic acidosis but more likely reflects hydration status at time of sampling. No action required unless persistent on retest.\n\nMINOR:\n\nMPV 10.3 fL (upper limit 10.1): Marginally above range. Reflects younger, larger platelets. Not clinically significant at this margin.\n\nMagnesium 0.82 mmol/L: Within lab range (0.53 to 1.11) but below optimal threshold of 0.85. Relevant to stress, anxiety, and sleep quality goals.\n\nReassuring negatives: Thyroid function normal with negative antibodies. Coeliac screen negative. Rheumatoid factor negative. All immunoglobulins within range. Liver enzymes and FIB-4 normal. Kidney function excellent (Cystatin C eGFR 107). Metabolic markers optimal (HbA1c 31, HOMA-IR 0.66). Lipid profile excellent (ApoB 0.64, Lp(a) below 25, TG/HDL 0.18). hs-CRP 0.4. Urinalysis clean. FSH and LH within premenopausal range. CEA, CA 15-3, and CA 19-9 all normal.","recommendations":"1. Book a GP appointment within two weeks. Bring this report and highlight amylase 164, lipase 79, and CA-125 42.4. Request repeat fasting pancreatic enzymes, abdominal ultrasound, and pelvic ultrasound.\n\n2. Increase total daily food intake to 1,800 to 1,950 calories per day. This is the single most impactful change from this report. Track intake for two weeks to establish a baseline and identify the gap.\n\n3. Increase protein intake to 62 to 76 grams per day to support training, recovery, and hair growth.\n\n4. Include iron-rich foods at least once daily: red meat two to three times per week, dark poultry, lentils, chickpeas, fortified cereals. Pair plant iron sources with vitamin C. Avoid tea and coffee within an hour of iron-rich meals.\n\n5. Begin iron supplementation as detailed in the supplementation section.\n\n6. Begin magnesium supplementation to support sleep quality and stress management.\n\n7. Maintain current vitamin D status with a low-dose maintenance supplement through autumn and winter.\n\n8. Consider reducing or stopping nicotine vaping to support hair health, anxiety levels, and sleep quality.\n\n9. Prioritise sleep hygiene: fixed wake time, morning daylight exposure, caffeine cut-off by 1pm, cool dark bedroom.\n\n10. Retest in 12 weeks: full blood count, reticulocyte count, iron studies, amylase, lipase, CA-125.","supplementation":"Iron: Ferrous bisglycinate, 25 mg daily, taken on an empty stomach or with a vitamin C source such as a small glass of orange juice. Take at least two hours away from tea, coffee, or calcium-containing foods. This is to address her transferrin saturation of 14.37% and ferritin of 35, both below optimal, and to support recovery of her reticulocyte count. Ferrous bisglycinate is the best-tolerated form with fewer gastrointestinal side effects than ferrous sulphate.\n\nVitamin C: 200 mg taken alongside the iron supplement. This converts non-haem iron into its more absorbable form and can double absorption rates.\n\nMagnesium: Magnesium glycinate, 300 mg, taken 30 to 60 minutes before bed. Her magnesium at 0.82 sits just below the optimal threshold of 0.85, and glycinate is the form best suited to supporting relaxation, sleep quality, and nervous system regulation, which directly addresses her goals around stress and anxiety.\n\nVitamin D3: Cholecalciferol, 1,000 to 2,000 IU daily, taken with her largest meal containing fat. Her vitamin D at 96 is within the optimal range, but as this sample was taken in late August at peak sun exposure, a maintenance dose through autumn and winter will prevent the seasonal decline that typically drops levels by 30 to 50 nmol/L.\n\nVitamin K2: MK-7 form, 100 mcg daily, taken with the vitamin D supplement. K2 directs calcium into bones and teeth rather than soft tissue, and should always accompany vitamin D supplementation.\n\nThe most important changes from this report are not supplements. They are eating more food, consistently reaching 1,800 to 1,950 calories per day with adequate protein, and discussing the elevated pancreatic enzymes and CA-125 with her GP.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It reflects how well the body manages blood sugar in the absence of recent food. Jessie's result of 4.4 is within the optimal range of 4.0 to 5.4, indicating excellent blood sugar regulation. This is consistent with her strong insulin sensitivity shown by her HOMA-IR result.","low_causes":"Prolonged fasting, excess insulin production, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress response, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"3.8","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.6061","units":"%","description":"HbA1c percentage measures the proportion of haemoglobin in red blood cells that has become coated with sugar over the previous two to three months. It provides a longer-term picture of blood sugar control than a single fasting glucose reading. Jessie's result of 5.0% is well within the normal range, confirming sustained excellent glucose management.","low_causes":"Shortened red blood cell lifespan, blood loss, haemolytic anaemia","high_causes":"Chronic elevated blood sugar, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3690","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5556","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised mmol/mol units. Jessie's result of 31 is well below the optimal ceiling of 36 and far below the 42 threshold that marks pre-diabetes. This confirms excellent long-term blood sugar control.","low_causes":"Shortened red blood cell lifespan, blood loss","high_causes":"Chronic elevated blood sugar, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin Levels","group":"GLUCOSE & INSULIN","result":"3.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3453","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.4156","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas needs to produce to maintain healthy blood sugar levels. A low-normal result like Jessie's 3.4 is desirable because it means the body's cells are responding efficiently to insulin, so the pancreas does not need to produce large amounts. Combined with her normal glucose, this confirms excellent insulin sensitivity.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, lean body composition","high_causes":"Insulin resistance, excess carbohydrate intake, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3485","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4576","units":"ug/l","description":"C-peptide is a protein released in equal amounts alongside insulin when the pancreas produces insulin. It provides a reliable measure of how much insulin the pancreas is actually making, because unlike insulin itself, C-peptide is not broken down by the liver on its first pass. Jessie's result of 1.24 ug/L (equivalent to approximately 410 pmol/L) is within the laboratory range and confirms adequate pancreatic insulin production. The low-normal value is consistent with her lean body composition and efficient insulin sensitivity.","low_causes":"Type 1 diabetes, low carbohydrate intake, high insulin sensitivity","high_causes":"Insulin resistance, type 2 diabetes, pancreatic tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, the Homeostatic Model Assessment of Insulin Resistance, uses the fasting glucose and insulin values to estimate how efficiently the body responds to insulin. A score below 1.0 indicates strong insulin sensitivity, meaning the cells respond readily to insulin and blood sugar is managed with minimal effort. Jessie's score of 0.66 is optimal and reflects excellent metabolic health.","low_causes":"High insulin sensitivity, lean body composition, low carbohydrate diet","high_causes":"Insulin resistance, obesity, metabolic syndrome, excess caloric intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"75.56","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2963","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the functional capacity of the pancreatic beta cells, the cells responsible for producing insulin. It is calculated from fasting insulin and glucose. Jessie's result of 75.6 is marginally below the lower reference of 80, but in the context of a perfectly normal fasting glucose of 4.4, an HbA1c of 31, and a HOMA-IR of 0.66, this reflects low insulin demand from an insulin-sensitive body rather than any impairment of the pancreas. The pancreas is producing exactly what the body needs; the calculation simply underrepresents this when insulin demand is very low.","low_causes":"Low insulin demand due to high insulin sensitivity, lean body composition, low carbohydrate diet","high_causes":"Insulin resistance requiring higher insulin output, early compensatory phase of type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT, alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood, so elevated levels indicate liver stress. Jessie's result of 12 is well below the optimal female threshold of 25, indicating a liver under no metabolic strain whatsoever.","low_causes":"Normal finding, vitamin B6 deficiency (rare)","high_causes":"Liver inflammation, fatty liver disease, alcohol excess, medication effects, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5312","units":"IU/l","description":"AST, aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. Like ALT, it rises when these tissues are damaged. Jessie's result of 23 is comfortably within the optimal range, consistent with healthy liver and muscle tissue.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Liver damage, muscle injury, heart damage, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2237","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5326","units":"IU/l","description":"Gamma GT, gamma-glutamyl transferase, is a liver enzyme particularly sensitive to alcohol consumption, bile duct problems, and metabolic liver stress. It is often the first liver marker to rise when the liver is under strain. Jessie's result of 17 is well within the optimal range, indicating a healthy liver with no signs of metabolic or toxic stress.","low_causes":"Normal finding","high_causes":"Alcohol excess, bile duct obstruction, fatty liver disease, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"IU/l","description":"ALP, alkaline phosphatase, is an enzyme found in the liver, bile ducts, and bones. Elevated levels can indicate bile duct obstruction or bone disease. Jessie's result of 60 is comfortably within range, supporting healthy liver and bone function.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia","high_causes":"Bile duct obstruction, bone disease, pregnancy, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Elevated levels can indicate liver disease or excessive red blood cell destruction. Jessie's result of 12 is within the optimal range, indicating normal red blood cell turnover and healthy liver processing.","low_causes":"Normal finding","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"57","upper_normal":"82","lower_optimal":"62","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6133","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. It provides a general overview of nutritional status and immune function. Jessie's result of 69 is within the optimal range, suggesting adequate protein intake and normal liver synthetic function despite her low diet volume.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic inflammation, infection, dehydration, immune disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and helps maintain fluid balance. It is also a useful marker of liver synthetic function and nutritional status. Jessie's result of 41 is within the optimal range.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins in the blood that includes antibodies and transport proteins. It reflects immune function and inflammatory status. Jessie's result of 28 is within the optimal range, indicating healthy immune protein production.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, inflammation, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4190","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main types of protein in the blood. It helps assess liver function, kidney function, and immune status. Jessie's calculated ratio of 1.46 is within the optimal range, reflecting a healthy balance between these protein groups.","low_causes":"Liver disease, autoimmune conditions, kidney disease","high_causes":"Immune deficiency (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3793","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis, or scarring, using age, ALT, AST, and platelet count. A score below 1.3 in adults under 65 indicates a very low probability of significant liver fibrosis. Jessie's score of 1.1 is reassuring and consistent with her healthy liver enzyme results.","low_causes":"Normal finding, young age","high_causes":"Liver fibrosis, cirrhosis, older age, low platelets, low ALT","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"164","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6949","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6061","units":"IU/L","description":"Amylase is a digestive enzyme produced primarily by the pancreas and salivary glands. It breaks down starches into sugars. Elevated levels can indicate pancreatic inflammation (pancreatitis), salivary gland inflammation, or a blocked pancreatic duct. Jessie's result of 164 is significantly above the upper limit of 118. Combined with her elevated lipase, this warrants investigation by her GP to assess pancreatic health.","low_causes":"Chronic pancreatitis with pancreatic insufficiency, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, pancreatic duct obstruction, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7376","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a digestive enzyme produced almost exclusively by the pancreas. It breaks down fats. Because lipase is more specific to the pancreas than amylase, its elevation is a stronger indicator of pancreatic involvement. Jessie's result of 79 is above the upper limit of 60. The combination of elevated lipase and elevated amylase together increases the clinical significance and warrants GP investigation.","low_causes":"Chronic pancreatitis with loss of pancreatic function","high_causes":"Acute pancreatitis, pancreatic duct obstruction, gallstones, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4440","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol types in the blood, including HDL (protective), LDL (potentially harmful), and VLDL. On its own it provides limited information, as a high total cholesterol can be driven by healthy HDL. Jessie's result of 4.6 is within the desirable range, and her detailed breakdown shows an excellent composition with very high HDL and low LDL.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1059","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats circulating in the blood, derived from dietary fat and excess calories. High triglycerides are associated with increased cardiovascular risk, insulin resistance, and metabolic syndrome. Jessie's result of 0.36 is exceptionally low and reflects her excellent metabolic health and insulin sensitivity.","low_causes":"Very low fat or calorie intake, hyperthyroidism, malabsorption","high_causes":"Excess calorie intake, high sugar/refined carbohydrate diet, alcohol, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1026","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, very low-density lipoprotein, carries triglycerides from the liver to tissues around the body. It is closely linked to triglyceride levels. Jessie's very low VLDL of 0.16 is consistent with her excellent triglyceride result and reflects efficient fat metabolism.","low_causes":"Low triglyceride levels, low caloric intake","high_causes":"High triglycerides, insulin resistance, obesity, excess alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6250","lower_normal":"1.55","upper_normal":"3.2","lower_optimal":"1.6","upper_optimal":"3.2","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/l","description":"HDL, high-density lipoprotein, is known as the protective cholesterol because it carries excess cholesterol away from artery walls back to the liver for disposal. Higher HDL levels are associated with lower cardiovascular risk. Jessie's result of 2.0 is excellent, well above the desirable threshold of 1.55 and the optimal female threshold of 1.6. This is one of the strongest markers in her cardiovascular profile.","low_causes":"Sedentary lifestyle, obesity, smoking, insulin resistance, high refined carbohydrate diet","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE" ion":"ApoA-I is the main protein component of HDL particles. It reflects the functional capacity of the HDL system to remove cholesterol from artery walls. Jessie's result of 1.44 is above the desirable threshold of 1.4, consistent with her excellent HDL level.","low_causes":"Genetic factors, smoking, sedentary lifestyle, obesity","high_causes":"Regular exercise, healthy diet, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3556","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein carried by every LDL particle. Each LDL particle carries exactly one ApoB molecule, so the ApoB level directly reflects the number of LDL particles in the blood. Many experts consider this the single best blood marker of cardiovascular risk. Jessie's result of 0.64 is well below the optimal threshold of 0.8, meaning she has a low number of atherogenic particles.","low_causes":"Low LDL production, hyperthyroidism, malnutrition","high_causes":"High LDL particle number, familial hypercholesterolaemia, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA-I ratio compares the number of harmful cholesterol particles (ApoB) to the functional capacity of the protective HDL system (ApoA-I). It is considered one of the best summary metrics of cardiovascular risk. A ratio below 0.6 for women places Jessie in the lower risk category. Her ratio of 0.44 is excellent.","low_causes":"High HDL function, low LDL particle number","high_causes":"High LDL particle number, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined variant of LDL that carries additional risk for cardiovascular disease. Unlike other cholesterol markers, Lp(a) cannot be meaningfully changed through diet or lifestyle; it is inherited and largely fixed for life. Jessie's result below 25 is within the normal range, which is genuinely useful information because it rules out this inherited risk factor. This means any future changes in her lipid profile would be driven entirely by modifiable factors. This result only needs to be measured once in a lifetime.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic inheritance (not modifiable by diet or exercise)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0600","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a calculated marker that serves as a proxy for insulin resistance and cardiovascular risk. A low ratio indicates excellent metabolic health and low levels of small, dense LDL particles. Jessie's ratio of 0.18 is exceptional, reflecting her excellent triglycerides and high HDL.","low_causes":"Excellent metabolic health, high insulin sensitivity","high_causes":"Insulin resistance, high triglycerides, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1188","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich lipoproteins (VLDL and intermediate-density particles). It is calculated as total cholesterol minus HDL minus LDL. Elevated remnant cholesterol is an independent risk factor for cardiovascular disease. Jessie's result of 0.19 is within the optimal range below 0.5, reflecting efficient clearance of triglyceride-rich particles.","low_causes":"Efficient lipid metabolism, low triglycerides","high_causes":"High triglycerides, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0400","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) is the most sensitive blood marker of systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. Levels below 1.0 are considered optimal and associated with low cardiovascular risk. Jessie's result of 0.4 indicates very low systemic inflammation, which is an excellent finding.","low_causes":"Low inflammation, healthy lifestyle","high_causes":"Infection, chronic inflammation, autoimmune disease, obesity, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates more inflammation, as inflammatory proteins cause red cells to clump together. Jessie's ESR of 4 is low, confirming the absence of significant systemic inflammation alongside her low hs-CRP.","low_causes":"Low inflammation, polycythaemia","high_causes":"Infection, inflammation, autoimmune disease, anaemia, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"139","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"142","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6026","units":"mmol/l","description":"Sodium is a key electrolyte that regulates fluid balance, blood pressure, and nerve and muscle function. It is tightly controlled by the kidneys. Jessie's result of 139 is within the optimal range, confirming normal fluid balance and kidney regulation.","low_causes":"Excess water intake, diuretics, heart failure, kidney disease, adrenal insufficiency","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is essential for normal heart rhythm, muscle contraction, and nerve signalling. Both high and low potassium can be dangerous, so the body maintains it within a tight range. Jessie's result of 4.5 is within the optimal range.","low_causes":"Diuretics, vomiting, diarrhoea, low dietary intake","high_causes":"Kidney disease, ACE inhibitors, potassium supplements, haemolysed sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"109","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6923","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride is an electrolyte that works closely with sodium and bicarbonate to maintain fluid balance, acid-base balance, and electrical neutrality in the blood. Jessie's result of 109 is one point above the upper limit of 108. A marginally elevated chloride alongside a bicarbonate at the floor of its range (20.4) can suggest a mild tendency towards metabolic acidosis, though at this margin it is most likely related to hydration status at the time of sampling rather than any significant clinical issue.","low_causes":"Vomiting, diuretic sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.82","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4483","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4310","upper_optimal_position":"0.6264","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, and blood sugar regulation. It plays a critical role in sleep quality, stress response, and anxiety management. Jessie's result of 0.82 is within the laboratory range but just below the optimal threshold of 0.85. Given her goals around reducing stress and anxiety, optimising magnesium through diet and supplementation could be beneficial.","low_causes":"Inadequate dietary intake, alcohol excess, diuretics, gastrointestinal losses","high_causes":"Kidney disease, excess supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"296","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2476","upper_optimal_position":"0.5619","units":"umol/l","description":"Uric acid is produced when the body breaks down purines, substances found in certain foods and in the body's own cells. Elevated levels can cause gout and are associated with cardiovascular and kidney disease. Jessie's result of 296 is within the optimal female range of 160 to 320, indicating normal purine metabolism.","low_causes":"Low purine diet, liver disease, some medications","high_causes":"High purine diet, kidney disease, gout, metabolic syndrome, excess alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"14.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/l","description":"The anion gap is a calculated value using sodium, potassium, chloride, and bicarbonate. It helps identify the type and cause of metabolic acidosis. Jessie's calculated anion gap of 14.1 (sodium 139 + potassium 4.5 minus chloride 109 minus bicarbonate 20.4) is within the normal range of 8 to 16, which is reassuring despite the marginal chloride elevation.","low_causes":"Laboratory error, hypoalbuminaemia","high_causes":"Diabetic ketoacidosis, lactic acidosis, kidney failure, toxic ingestion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3534","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5600","units":"mmol/l","description":"Urea is a waste product formed when the liver breaks down protein. It is filtered out of the blood by the kidneys and excreted in urine. Jessie's result of 3.5 is at the lower end of the laboratory range, which likely reflects her low diet volume and relatively modest protein intake. It is within the normal range and confirms normal kidney function.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4634","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3821","upper_optimal_position":"0.5854","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. It provides a rough measure of kidney function. Jessie's result of 65 is within the optimal range, consistent with healthy kidney filtration.","low_causes":"Low muscle mass, malnutrition","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood. A value above 90 is considered normal. Jessie's result is reported as above 90, and her Cystatin C-based eGFR of 107 provides a more precise measure confirming excellent kidney function.","low_causes":"Kidney disease, dehydration, certain medications","high_causes":"Hyperfiltration in early diabetes, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3727","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","unit function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}
