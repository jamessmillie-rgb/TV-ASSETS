<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Nicholas Ranson","dob":"21/09/1993","report_date":"2026-10-20","summary":"Nicholas is a 33-year-old man with a BMI of 24.2. He follows a standard mixed diet with 2 to 3 portions of vegetables and fruit a day, has takeaway or ultra-processed food weekly and something sugary on some days. He does two hard cardio sessions a week, no resistance training, and takes fewer than 2,000 steps a day. He sleeps eight hours or more but wakes tired most mornings with low energy all day, and finds stress hard to manage some weeks. He drinks 1 to 4 drinks a week, uses painkillers such as ibuprofen or paracetamol frequently, takes no supplements or prescribed medication, and has a family history of heart attack or stroke before 60. This is his first blood test. For several weeks he has had low energy, brain fog and low mood or anxiety, and his goals are more energy and long-term health.\n\nStarting with what is most likely behind how he feels, because the blood gives clear, fixable answers. His vitamin D is 31 nmol/L, which is deficient (the range starts at 50 and the ideal is 75 to 120). Vitamin D deficiency is one of the best-established causes of fatigue, low mood and poor concentration, and with fewer than 2,000 steps a day, little time outdoors and no supplement, it is no surprise. His vitamin B12 is 261 and active B12 35.6, both within range but in the lower part, and his folate is 7.4, just below the ideal of 8. B12 and folate are needed for energy production in every cell and for making the brain chemicals that regulate mood, and their effect shows up in his homocysteine (below). His copper is 9.7, below the range that starts at 11; copper helps the body use iron and produce energy, and his ferritin (iron stores) at 38.8 is in range but below the ideal of 50 or more. His testosterone is 13.5, within range but below the ideal of 18 for his age, which can contribute to low energy, low mood and poor motivation. Put together, these are genuine biochemical contributors to the fatigue, brain fog and low mood he describes, and all of them respond to straightforward changes.\n\nThe rest of the explanation is in his lifestyle answers, and it matters as much as the blood. Fewer than 2,000 steps a day is very sedentary, and low daily movement on its own is strongly linked with tiredness, low mood and poor focus; it also suppresses testosterone and keeps vitamin D low through lack of daylight. Sleeping eight hours or more yet waking tired points to sleep quality rather than quantity. His stress hormone cortisol is normal at 207, and his thyroid is working well (TSH 1.29, free T4 16.0, free T3 4.98, antibodies negative), so neither of those explains the tiredness. If he still wakes unrefreshed once the vitamin D, B vitamins and activity are addressed, it would be worth asking his GP about sleep quality, including whether sleep apnoea should be ruled out.\n\nBecause of his family history of heart attack or stroke before 60, his cardiovascular markers were the other key question, and they are reassuring. ApoB, the most accurate single count of the particles that deposit cholesterol in artery walls, is 0.55 g/L, comfortably below the ideal of 0.8. LDL is 1.42, total cholesterol 3.96 and HDL, the protective cholesterol, is a strong 1.81. His Lipoprotein(a), an inherited cholesterol particle that cannot be changed by lifestyle, is 56.7 nmol/L, within the normal range (below 75) and well below the level of 125 at which it is generally considered to add meaningful risk. It is worth knowing his number, and worth mentioning to his GP alongside the family history, but it is not a concern on its own. His high-sensitivity CRP is below 0.30, meaning no measurable inflammation in the arteries, small dense LDL is low and apolipoprotein E is normal. His Cardiovascular Risk Score is 5 out of 100, comfortably in the ideal zone below 20. The one lipid to improve is triglycerides at 1.61, within range but above the ideal of below 1.0, which tends to respond to less sugar and more movement.\n\nHis homocysteine is 13.1, within the laboratory range of 5 to 20 but above the ideal of below 10. Homocysteine is an amino acid that builds up when B12 and folate are short, and a raised level is linked with higher cardiovascular risk over time, which is relevant given his family history. With B12 and folate both on the low side, they are the most likely cause, and bringing them up should bring his homocysteine down.\n\nHis blood sugar control is good: fasting glucose 4.27, HbA1c 34.6 and HOMA-IR 1.89. His HOMA-B, an estimate of how hard the pancreas is working, is 258, above the ideal, meaning he is producing a little more insulin than needed to keep his glucose in check. This is an early, easily reversed pattern rather than a problem, and it sits alongside the triglycerides of 1.61: both respond directly to more daily movement and less sugar.\n\nHis hormones beyond testosterone are reassuring. Free testosterone at 0.263 and SHBG at 34 are in range, and LH at 6.6 and FSH at 2.96 show the brain is signalling normally to the testes, so the lower testosterone is most likely lifestyle-driven: very low daily activity, no resistance training and possibly sleep quality. Resistance training is the most effective natural way to raise it. Prolactin is 300, within range but near the upper limit of 324; it can rise with stress, poor sleep and some medicines, and is worth repeating on a morning sample if symptoms persist. His progesterone at 0.71 is marginally above the male range, which has no clinical significance.\n\nHis organ health is excellent. His liver is in very good shape (ALT 13.7, GGT 22.3, AST 23.2, FIB-4 0.9), which is reassuring given frequent painkiller use. His kidneys are working very well (cystatin C 0.81, combined eGFR 119, no protein in the urine). There is no sign of heart muscle strain (troponin T, CK-MB, myoglobin and FABP-3 all clear), no inflammation, no autoimmune markers (ANA, rheumatoid factor and anti-CCP negative), a negative coeliac screen, healthy immune proteins, and all tumour markers including PSA (0.70) are clear. His urine is entirely normal. His PhenoAge, a biological age calculated from nine blood markers, is 25.6, which is 7.4 years younger than his calendar age, a genuinely good result.\n\nA few minor findings complete the picture. His MCHC (the concentration of haemoglobin inside red cells) is 311, just below the range that starts at 320; with haemoglobin normal at 146, this is not anaemia, and it may reflect the lower iron stores and copper. His LDH at 215 is just below range, which has no clinical significance. His AST to ALT ratio is 1.69, slightly high only because his ALT is very low, which is a healthy finding.\n\nOn the painkillers: his liver and kidneys show no strain, which is good news. Regular ibuprofen can irritate the gut lining over time, which may reduce absorption of nutrients such as copper and iron, so it is worth reviewing with his GP what the pain is and whether there is a better long-term option.\n\nTaking a step back, Nicholas has very healthy organs, excellent cholesterol for someone with his family history, no inflammation and a biological age well below his real age. The fatigue, brain fog and low mood have clear, fixable contributors: deficient vitamin D, low-normal B12 and folate with a raised homocysteine, low copper and iron stores, testosterone below its ideal, and a very low level of daily movement. Correcting the vitamin D and B vitamins, walking daily, adding resistance training and cutting back on sugar should make a noticeable difference within two to three months, and a retest then will show the progress.","links":"Fatigue, brain fog and low mood: vitamin D deficient (31), B12 (261) and folate (7.4) low-normal with homocysteine raised (13.1), copper low (9.7), ferritin below ideal (38.8) and testosterone below ideal (13.5). Each is a recognised contributor, and together they are a plausible explanation. Thyroid and cortisol are normal, so they are not the cause.\nVery low daily activity (fewer than 2,000 steps) links most of these: less daylight keeps vitamin D low, inactivity lowers testosterone, and it raises insulin demand (HOMA-B 258) and triglycerides (1.61).\nFamily history of early heart disease: ApoB 0.55, LDL 1.42, HDL 1.81, hsCRP below 0.30 and a Cardiovascular Risk Score of 5 are all reassuring. Lp(a) 56.7 is within the normal range (below 75). Homocysteine (13.1) is the one cardiovascular marker to bring down, through B12 and folate.\nWaking tired despite 8 hours or more: points to sleep quality. If it persists after the nutrient and activity changes, ask the GP about sleep, including sleep apnoea.\nFrequent painkillers: liver and kidneys show no strain. Long-term ibuprofen can affect the gut lining and nutrient absorption, a possible contributor to the low copper and iron stores.","lifestyle":"Walk every day after your largest meal. Anchor: plate in the sink, shoes on, out of the door for 15 minutes. Why: walking after eating lowers insulin demand (HOMA-B 258) and triglycerides (1.61), and daily movement is one of the most effective treatments for fatigue and low mood.\nBuild to 7,000 steps a day within four weeks with a morning walk outside. Anchor: before your first coffee, 10 minutes outdoors. Why: morning daylight helps reset your body clock, which matters when you wake tired despite 8 hours, and gets more sunlight on your skin while your vitamin D (31) recovers.\nAdd two resistance sessions a week, starting with bodyweight exercises or a simple gym programme. Anchor: on your existing two cardio days, or two separate days. Why: resistance training is the strongest natural way to raise testosterone (13.5, ideal above 18) and it improves energy and mood.\nCut back on sugary foods and drinks on at least five days a week. Anchor: if you want something sweet, have it with a meal, not on its own. Why: triglycerides (1.61) and insulin demand (HOMA-B 258) both respond directly to less sugar.\nAdd nutrient-dense foods daily: leafy greens, nuts and seeds, and shellfish or red meat a few times a week. Anchor: one extra portion with lunch and one with dinner. Why: they supply folate (7.4), copper (9.7) and iron (ferritin 38.8), all below ideal.\nKeep a consistent sleep and wake time, and avoid screens for 30 minutes before bed. Anchor: phone on charge outside the bedroom at the same time each night. Why: you sleep long but wake unrefreshed, so sleep quality is the target.","flags":"Vitamin D 31 nmol/L (below 50, ideal 75 to 120). Deficient. Likely contributor to fatigue, low mood and brain fog. Supplement; GP may prescribe a loading dose.\nHomocysteine 13.1 (ideal below 10) with B12 261, active B12 35.6 and folate 7.4 low-normal. Correct B12 and folate; recheck. Relevant to family history of early heart disease.\nCopper 9.7 (below 11), with ferritin 38.8 below the ideal of 50. Dietary first; GP to review if still low on retest.\nTestosterone 13.5 (ideal 18 and above) with normal free testosterone (0.263), SHBG (34), LH (6.6) and FSH (2.96). Likely lifestyle-driven; resistance training and activity first.\nHOMA-B 258 (ideal below 150) and triglycerides 1.61 (ideal below 1.0), with normal glucose (4.27), HbA1c (34.6) and HOMA-IR (1.89). Early, reversible pattern; responds to movement and less sugar.\nProlactin 300, within range but near the upper limit of 324. Repeat on a morning sample if symptoms persist.\nLipoprotein(a) 56.7 nmol/L, within the normal range (below 75). Worth knowing given the family history; not a concern on its own.\nMCHC 311 (just below 320) with normal haemoglobin (146). Not anaemia; may reflect lower iron and copper.\nMinor, no action: progesterone 0.71 (marginally above the male range), LDH 215 (just below range), AST to ALT ratio 1.69 (raised only because ALT is very low).\nReassuring: ApoB 0.55, LDL 1.42, HDL 1.81, hsCRP below 0.30, Cardiovascular Risk Score 5, thyroid normal with negative antibodies, liver and kidney markers excellent, no heart muscle strain, coeliac and autoimmune screens negative, all tumour markers and PSA (0.70) clear, PhenoAge 25.6 (7.4 years younger than his age).","recommendations":"Discuss the vitamin D deficiency (31 nmol/L) with your GP. Supplementing is appropriate, and the GP may prescribe a short loading dose. Recheck in 3 months.\nMention the homocysteine of 13.1 alongside your family history of heart attack or stroke before 60, together with the low-normal B12 (261) and folate (7.4).\nAsk your GP to review the low copper (9.7) if it is still low on retest after dietary changes.\nReview your painkiller use with your GP: what the pain is, and whether there is a better long-term option than frequent ibuprofen.\nIf you still wake unrefreshed after 6 to 8 weeks of the changes in this report, ask your GP about sleep quality, including whether sleep apnoea should be ruled out.\nMention your Lipoprotein(a) (56.7 nmol/L, within the normal range) to your GP so it is on record given your family history.\nRetest in 3 months: vitamin D, B12, active B12, folate, homocysteine, copper, ferritin, testosterone, prolactin (morning sample), triglycerides and HOMA-B.","supplementation":"Vitamin D3, 4,000 IU daily with your largest meal. Why: your level is 31 nmol/L, which is deficient; this dose should bring it into the 75 to 120 range over about 3 months. Your GP may prefer to prescribe a loading dose first.\nVitamin K2 (MK-7), 100 mcg daily, taken with the vitamin D. Why: K2 helps direct calcium into bone while vitamin D is being replenished.\nVitamin B12 (methylcobalamin), 1,000 mcg daily. Why: your B12 is 261 and active B12 35.6, both low-normal; raising them supports energy, mood and clearing homocysteine (13.1).\nMethylfolate, 400 mcg daily. Why: your folate is 7.4, just below the ideal of 8, and folate works with B12 to bring homocysteine down.\nMagnesium glycinate, 200 to 300 mg in the evening. Why: magnesium (0.91) is in range but not high, and glycinate can support sleep quality, which is the target when you wake tired despite a full night.\nDo not take a separate copper supplement without your GP's advice. Why: copper is best raised through food first (nuts, seeds, shellfish, dark chocolate), and too much copper can be harmful.\nThe most important changes are not supplements: daily walking, two resistance sessions a week and less sugar.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 82.9; held to 59 by a system rated \"See your GP\". Weakest systems: vitamins & nutrients 48%, hematology 64%, hormones 71%. Biggest drags: Vitamin D, Mean Cell Haemoglobin Concentration (MCHC), HOMA-B, Progesterone.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"25.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3368","lower_normal":"","upper_normal":"38","lower_optimal":"","upper_optimal":"33","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4342","units":"years","description":"PhenoAge is a biological ageing estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. At 25.6, this is 7.4 years younger than his calendar age of 33, which is a genuinely positive result. His excellent CRP (below 0.30), healthy glucose (4.27), strong albumin (45) and balanced white cell count are the main drivers pulling his biological age below his actual age. RDW is not measured on this panel, so a typical 13.0% was assumed; the effect on the estimate is small. As he addresses vitamin D, B12 and activity levels, PhenoAge should remain stable or improve further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0625","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is 5 out of 100, in the ideal zone below 20. It is a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, and it measures the risk being built in the arteries rather than the ten-year chance of an event. His ApoB (0.55), LDL (1.42), HDL (1.81) and hsCRP (below 0.30) are all excellent and his Lp(a) (56.7) is within the normal range; the only small contribution is remnant cholesterol from triglycerides of 1.61.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"Alanine Aminotransferase (ALT)","group":"LIVER & METABOLIC","result":"13.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4163","lower_normal":"0","upper_normal":"55","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5152","units":"IU/L","description":"ALT is a liver enzyme released when liver cells are damaged or inflamed. His ALT at 13.7 is well below the optimal ceiling of 30 for a male and comfortably within the laboratory range of below 55. This confirms the liver is under no metabolic strain, which is reassuring given his frequent use of painkillers such as ibuprofen and paracetamol, both of which can affect the liver over time.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, alcohol, medication, viral hepatitis, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"30","upper_normal":"120","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"IU/L","description":"ALP is an enzyme found in the liver and bones. At 84, it sits comfortably within both the laboratory range and the optimal band, indicating healthy liver and bone metabolism.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bone growth, liver disease, bile duct obstruction, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ast","name":"Aspartate Aminotransferase (AST)","group":"LIVER & METABOLIC","result":"23.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"0","upper_normal":"40","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscle. At 23.2, it is within range and within optimal, confirming no damage to any of these tissues. The slightly higher AST relative to ALT produces a De Ritis ratio of 1.69, but this is driven by the very low ALT rather than by elevated AST.","low_causes":"","high_causes":"Liver damage, muscle injury, heart disease, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ggt","name":"Gamma-Glutamyltransferase (GGT)","group":"LIVER & METABOLIC","result":"22.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4384","lower_normal":"10","upper_normal":"71","lower_optimal":"10","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4153","units":"IU/L","description":"GGT is a liver enzyme particularly sensitive to alcohol, medications and bile duct problems. At 22.3, it sits below the optimal ceiling of 25 and well below the laboratory limit of 71. This is a clean result, and with 1 to 4 drinks per week and frequent painkiller use, it confirms the liver is handling both without visible strain.","low_causes":"","high_causes":"Alcohol, medication, bile duct disease, fatty liver, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ldh","name":"Lactate Dehydrogenase (LDH)","group":"LIVER & METABOLIC","result":"215","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2681","lower_normal":"230","upper_normal":"460","lower_optimal":"230","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5797","units":"IU/L","description":"LDH is an enzyme found in nearly all cells and is released during normal tissue turnover. At 215, it sits marginally below the lower limit of 230. A mildly low LDH is not clinically significant and most likely reflects low muscle mass or low levels of physical activity, consistent with fewer than 2,000 daily steps and no resistance training.","low_causes":"Low muscle mass, low physical activity, genetic variation","high_causes":"Tissue damage, haemolysis, liver disease, intense exercise, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gldh","name":"Glutamate Dehydrogenase (GLDH)","group":"LIVER & METABOLIC","result":"3.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4714","lower_normal":"0","upper_normal":"7","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"IU/L","description":"GLDH is a liver-specific enzyme found in the mitochondria of liver cells. At 3.3, well within range, it confirms no deep liver cell damage.","low_causes":"","high_causes":"Liver cell necrosis, toxic liver injury, severe hepatitis","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"totalbilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4495","lower_normal":"0","upper_normal":"21","lower_optimal":"0","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6032","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells break down. At 9.44, it is comfortably within range and indicates normal red cell turnover and liver processing.","low_causes":"","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"directbilirubin","name":"Direct Bilirubin","group":"LIVER & METABOLIC","result":"1.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4355","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"umol/l","description":"Direct bilirubin is the water-soluble form that has been processed by the liver. At 1.83, it is well within range, confirming healthy liver conjugation and bile flow.","low_causes":"","high_causes":"Bile duct obstruction, liver disease, Dubin-Johnson syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"bileacids","name":"Bile Acids","group":"LIVER & METABOLIC","result":"9.20","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4600","lower_normal":"0","upper_normal":"10","lower_optimal":"0","upper_optimal":"6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5333","units":"umol/l","description":"Bile acids are produced by the liver to aid fat digestion and are reabsorbed from the gut. At 9.20, they sit within the laboratory range of below 10 but above the optimal threshold. This is a borderline reading and may reflect the timing of the sample relative to a meal. It does not suggest liver disease given all other liver markers are clean.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, intestinal malabsorption, recent meal","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"45.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"35","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and is a marker of liver synthetic function and nutritional status. At 45, it is in the optimal band and confirms the liver is producing protein effectively.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"27.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"23","upper_normal":"35","lower_optimal":"24","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"g/l","description":"Globulin includes the immunoglobulins and transport proteins. At 27.2, it sits comfortably within range, consistent with a healthy immune system and adequate protein intake.","low_causes":"Immune deficiency, malnutrition, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"aldolase","name":"Aldolase","group":"LIVER & METABOLIC","result":"<1.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2434","lower_normal":"0","upper_normal":"7.6","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5526","units":"IU/L","description":"Aldolase is an enzyme involved in sugar metabolism, found in muscle and liver. At below 1.85, it is well within range, confirming no muscle or liver cell damage.","low_causes":"","high_causes":"Muscle disease, liver damage, certain cancers","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"pancreaticamylase","name":"Pancreatic Amylase","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"13","upper_normal":"53","lower_optimal":"15","upper_optimal":"45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6000","units":"IU/L","description":"Pancreatic amylase is an enzyme produced by the pancreas to digest starch. At 40, within both the laboratory and optimal ranges, the pancreas is functioning normally.","low_causes":"Chronic pancreatitis, pancreatic insufficiency","high_causes":"Acute pancreatitis, pancreatic duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"43.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5483","lower_normal":"5","upper_normal":"65","lower_optimal":"10","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"IU/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fat. At 43.7, it is within range and optimal, confirming healthy pancreatic function.","low_causes":"Pancreatic insufficiency","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3960","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"mmol/l","description":"Total cholesterol is the combined measurement of LDL, HDL and a portion of triglycerides. At 3.96, it is well within range. On its own total cholesterol tells a limited story, but his breakdown into LDL, HDL and triglycerides is where the detail lies.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, genetics, hypothyroi t with ApoB this low the absolute number of these particles is small.","low_causes":"Low LDL overall, healthy diet","high_causes":"High triglycerides, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein (a)","group":"LIPIDS & CARDIOVASCULAR","result":"56.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3780","lower_normal":"0","upper_normal":"75","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2133","units":"nmol/l","description":"Lipoprotein(a) is an inherited cholesterol-carrying particle; its level is set by genes and barely changes with diet or exercise. At 56.7 nmol/L his level is within the laboratory range (below 75) and below the level of about 125 at which it is generally considered to add meaningful cardiovascular risk. Given his family history of heart attack or stroke before 60, it is worth having on record with his GP, but it is not a concern on its own.","low_causes":"","high_causes":"Genetics (100% inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"homocysteine","name":"Homocysteine","group":"LIPIDS & CARDIOVASCULAR","result":"13.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3275","lower_normal":"5","upper_normal":"20","lower_optimal":"5","upper_optimal":"9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2250","units":"umol/l","description":"Homocysteine is an amino acid produced during the metabolism of methionine. Elevated levels are associated with increased cardiovascular risk, impaired methylation (which affects energy production, neurotransmitter synthesis and DNA repair) and cognitive decline. At 13.1, it is within the laboratory range of 5 to 20 but above the optimal ceiling of 9. His sub-optimal B12 at 261 and folate at 7.4 are the most likely drivers, as these B vitamins are the key cofactors that convert homocysteine to harmless metabolites. Supplementing B12 and folate should bring this down.","low_causes":"","high_causes":"Low B12, low folate, low B6, genetics (MTHFR variants), kidney disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucose","name":"Glucose","group":"GLUCOSE & INSULIN","result":"4.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4423","lower_normal":"4","upper_normal":"7","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4810","units":"mmol/l","description":"Fasting glucose measures the sugar level in the blood after an overnight fast. At 4.27, it sits in the ideal zone between 4.0 and 5.4, confirming healthy blood sugar regulation.","low_causes":"Fasting, insulin excess, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, infection, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"34.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4124","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c reflects average blood sugar over the past 2 to 3 months. At 34.64, it is below the optimal ceiling of 36 and well below the diabetic threshold of 48. This is an excellent result that confirms sustained healthy blood sugar control.","low_causes":"Haemolytic anaemia, blood loss, low-carbohydrate diet","high_causes":"Diabetes, pre-diabetes, high carbohydrate or sugar intake","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insu tory properties. Higher levels are generally better. At 4.43, it is within range and optimal.","low_causes":"Obesity, insulin resistance, metabolic syndrome","high_causes":"Lean body composition, exercise, healthy diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4214","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood sugar over the past 2 to 3 months. At 5.9, it is within the optimal ceiling of 6.2 and confirms sustained healthy glucose control.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4892","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines triglycerides and glucose to estimate insulin resistance. At 8.61, it is within the laboratory range of below 8.8 but above the optimal of below 8.5, driven by the triglycerides at 1.61. Reducing dietary sugar should bring both the triglycerides and this index into the optimal zone.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.89","within_normal":"TRUE","within_optimal":"FALSE","re function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
