t fat: muscle, bone, organs, water). At 76.9 kg, this represents his non-fat mass. Preserving lean mass during weight loss is critical, which is why the protein target is set at 133g per day and resistance training is recommended.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"fatmass","name":"Fat Mass (estimated)","group":"SPECIALIZED TESTS","result":"25.1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"kg","description":"Estimated fat mass from the Deurenberg body fat percentage. At 25.1 kg, this represents the excess tissue that is driving the elevated oestradiol, low adiponectin, and suppressed HDL. Reducing this towards approximately 15 to 18 kg (by reaching the 88 kg weight target) would address multiple findings in this report.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"proteintarget","name":"Protein Target","group":"SPECIALIZED TESTS","result":"133","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"g/day","description":"Daily protein target set at 1.3g per kg of body weight. At 133g per day, this supports muscle preservation during the recommended calorie deficit and supports recovery from the resistance training being added. Spread across three to four meals, this is approximately 33 to 44g of protein per meal.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"calorietarget","name":"Calorie Target","group":"SPECIALIZED TESTS","result":"2700","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"kcal/day","description":"Calorie target set approximately 300 kcal below estimated total daily energy expenditure of 2,994. At 2,700 kcal per day, this creates a sustainable deficit for steady fat loss of roughly 0.25 to 0.5 kg per week while maintaining energy for training and daily life.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"weighttarget","name":"Weight Target","group":"SPECIALIZED TESTS","result":"88","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"kg","description":"Target weight at which BMI reaches the top of the healthy range at 24.9, based on his height of 188 cm. A first milestone of 95 kg gives a BMI of around 26.8 and would already improve HDL, oestradiol, adiponectin, and long-term diabetes risk. The longer-term target is 88 kg.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"0.775","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3608","lower_normal":"0.35","upper_normal":"5.5","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3754","upper_optimal_position":"0.4725","units":"miu/l","description":"TSH is the pituitary hormone that tells the thyroid how much hormone to produce. At 0.775, it is within the laboratory range but below the optimal floor of 1.0. A low-normal TSH with a high-normal FT4 and FT3 at the upper limit suggests the thyroid is producing ample hormone and the pituitary does not need to push hard. This is a healthy functional pattern, not hyperthyroidism, and no action is needed.","low_causes":"Excess thyroid hormone (hyperthyroidism), thyroid medication overdose, pituitary insufficiency","high_causes":"Hypothyroidism, iodine deficiency, thyroid hormone resistance, TSH-secreting pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"20.50","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6289","lower_normal":"11.9","upper_normal":"21.6","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4055","upper_optimal_position":"0.6117","units":"pmol/l","description":"FT4 is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form, FT3, in the tissues. At 20.50, it is within the laboratory range but above the optimal ceiling of 20 by a small margin. Combined with a low-normal TSH and strong FT3, this shows a thyroid that is producing generously. No concern.","low_causes":"Hypothyroidism, iodine deficiency, pituitary insufficiency","high_causes":"Hyperthyroidism, thyroid medication, thyroiditis, early Graves' disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free Tri-iodothyronine (FT3)","group":"THYROID","result":"6.79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6658","lower_normal":"3.1","upper_normal":"6.8","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4595","upper_optimal_position":"0.6396","units":"pmol/l","description":"FT3 is the active thyroid hormone that drives metabolism, energy, and brain function. At 6.79, it sits just inside the upper limit of 6.8, so it is within range rather than raised. A strong FT3 is consistent with efficient conversion from FT4 and good metabolic activity. This is not hyperthyroidism, as TSH would be suppressed below 0.35 if it were.","low_causes":"Hypothyroidism, non-thyroidal illness (sick euthyroid syndrome), low T4","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igf1","name":"Insulin-like Growth Factor-1 (IGF-1)","group":"HORMONES","result":"34.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6219","lower_normal":"16.8","upper_normal":"36.9","lower_optimal":"25","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4693","upper_optimal_position":"0.6517","units":"nmol/l","description":"IGF-1 is a growth factor produced mainly by the liver in response to growth hormone. It reflects growth hormone activity and supports muscle growth, repair, and recovery. At 34.2, within the ideal range and towards the upper end, his growth hormone axis is functioning well, which is expected at 27.","low_causes":"Growth hormone deficiency, malnutrition, liver disease, ageing","high_causes":"Acromegaly, high protein diet, puberty, growth hormone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"83","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3001","lower_normal":"138","upper_normal":"690","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3708","upper_optimal_position":"0.5519","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a strong daily rhythm, peaking in the early morning to drive the waking response and falling throughout the day. At 83, well below the lower limit of 138, this is a result that needs investigation. A morning cortisol below 138 raises the possibility of inadequate adrenal output, which could explain his all-day fatigue, low mood, brain fog, and poor recovery. His sample was taken at 09:12, close to the expected morning peak. Cortisol is sensitive to the timing of the draw relative to waking, and steroid medicines (including inhalers, nasal sprays and creams) can lower it, so a formal 9am repeat with his GP within the next week or two is the next step, and if still low, a short Synacthen test to check whether the adrenal glands can respond. If he feels faint, dizzy on standing, or develops vomiting or severe abdominal pain, he should seek urgent medical help.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary insufficiency, late sample timing, poor sleep, stress","high_causes":"Cushing's syndrome, acute stress, corticosteroid medication, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folliclestimulatinghormo","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"1.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3183","lower_normal":"1.5","upper_normal":"12.4","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3486","upper_optimal_position":"0.5321","units":"iu_l","description":"FSH is a pituitary hormone that stimulates the testes to produce sperm and supports testosterone production. At 1.01, below the lower limit of 1.5, this is below range. In a young male with adequate testosterone (18.5), a low FSH suggests the pituitary is being suppressed, possibly by the elevated oestradiol feeding back to reduce gonadotrophin output. This does not necessarily affect fertility at present, but the pattern warrants discussion with a GP as part of a broader pituitary hormone assessment.","low_causes":"Pituitary suppression (oestrogen feedback, anabolic steroids), pituitary tumour, stress, caloric deficit","high_causes":"Primary testicular failure, Klinefelter syndrome, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"luteinisinghormone","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"3.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4251","lower_normal":"1.7","upper_normal":"8.6","lower_optimal":"2.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3720","upper_optimal_position":"0.5894","units":"iu_l","description":"LH is a pituitary hormone that stimulates the testes to produce testosterone. At 3.6, within the ideal range, this shows the pituitary is producing enough LH to maintain testosterone at 18.5. The contrast with the low FSH is notable: FSH appears more suppressed than LH, which can happen because oestrogen selectively suppresses FSH more than LH.","low_causes":"Pituitary suppression, anabolic steroid use, stress, caloric deficit","high_causes":"Primary testicular failure, Klinefelter syndrome, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"175","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4580","lower_normal":"86","upper_normal":"324","lower_optimal":"100","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3529","upper_optimal_position":"0.6050","units":"miu/l","description":"Prolactin is a pituitary hormone involved in immune regulation and reproductive function. In males, high prolactin can suppress testosterone and cause sexual dysfunction. At 175, within the ideal range, his prolactin is normal. This is relevant because a pituitary tumour (prolactinoma) can cause both high prolactin and low FSH, and a normal prolactin here makes that less likely.","low_causes":"Dopamine agonist medication","high_causes":"Prolactinoma, stress, medications (antipsychotics, SSRIs), hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"Dehydroepiandrosterone Sulphate (DHEAs)","group":"HORMONES","result":"4.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3930","lower_normal":"1.5","upper_normal":"17.7","lower_optimal":"5.0","upper_optimal":"12.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4053","upper_optimal_position":"0.5494","units":"umol/l","description":"DHEA-S is a precursor hormone produced by the adrenal glands, converted into testosterone and oestrogen as needed. It is a marker of adrenal function. At 4.4 umol/L, it is within the laboratory range but below the optimal floor of 5.0. A borderline low DHEA-S at 27 is consistent with the low cortisol finding, as both are produced by the adrenal glands. This adds weight to investigating adrenal function with the GP.","low_causes":"Adrenal insufficiency, ageing, chronic stress, pituitary insufficiency","high_causes":"Adrenal tumour, PCOS, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"18.500","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4948","lower_normal":"8.64","upper_normal":"29","lower_optimal":"18","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4866","upper_optimal_position":"0.6667","units":"nmol/l","description":"Testosterone is the primary male sex hormone, driving muscle mass, bone density, mood, energy, libido, and red blood cell production. At 18.5, it is at the lower edge of the optimal range of 18 to 30, which at 27 is adequate but not generous. Losing body fat would be expected to reduce aromatase conversion to oestradiol and allow more testosterone to remain in its active form, potentially pushing this higher.","low_causes":"Ageing, obesity, pituitary suppression, chronic illness, medications, sleep deprivation","high_causes":"Anabolic steroid use, testicular tumour, adrenal conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"175.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7120","lower_normal":"41.4","upper_normal":"159","lower_optimal":"60","upper_optimal":"140","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3861","upper_optimal_position":"0.6128","units":"pmol/l","description":"Oestradiol is the primary form of oestrogen. Men produce it in small amounts, and it plays a role in bone health, brain function, and libido. At 175, above the upper limit of 159, his oestradiol is elevated. At a BMI of 28.9 with an estimated body fat of 24.6%, the enzyme aromatase in adipose tissue converts testosterone into oestradiol. This elevated oestradiol feeds back to the pituitary and is likely suppressing FSH. Losing body fat is the most effective way to reduce oestradiol in this context, and doing so would also benefit testosterone, HDL, and insulin sensitivity.","low_causes":"Low body fat, aromatase inhibitor medication, hypogonadism","high_causes":"Obesity (aromatase activity), liver disease, exogenous oestrogen, aromatase excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"0.47","lower_optimal":"","upper_optimal":"0.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4255","units":"nmol/l","description":"Progesterone is present in small amounts in males, produced mainly by the adrenal glands. At 1.03, above the upper limit of 0.47, this is elevated. In the context of low cortisol and borderline ,"lower_optimal_position":"0.4147","upper_optimal_position":"0.6100","units":"nmol/l","description":"Free testosterone is the fraction of testosterone not bound to SHBG or albumin, and it is the form directly available to tissues. At 0.426, within the ideal range of 0.3 to 0.6, this confirms that despite the borderline total testosterone, enough is reaching the tissues. The relatively low SHBG helps here.","low_causes":"Low total testosterone, high SHBG, ageing, obesity","high_causes":"Low SHBG, anabolic steroid use, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio (NLR)","group":"INFLAMMATION","result":"1.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3891","lower_normal":"0.78","upper_normal":"3.53","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3600","upper_optimal_position":"0.4812","units":"","description":"The neutrophil-to-lymphocyte ratio is a simple marker of systemic inflammation and immune balance. A ratio between 1 and 2 is considered ideal. At 1.24, this is excellent and confirms a low inflammatory state, consistent with his healthy hsCRP of 0.52.","low_causes":"Low neutrophils (benign ethnic neutropenia), high lymphocytes","high_causes":"Infection, inflammation, stress, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tghdlratio","name":"Triglyceride/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3067","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.87","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is a quick proxy for insulin resistance and atherogenic risk. At 0.92, it is within the laboratory range of below 1.5 but above the ideal of below 0.87. The slightly above-optimal ratio is driven by the combination of triglycerides at 1.10 (just above ideal) and HDL at 1.19 (below range). Improving HDL through exercise and body composition changes would bring this into the optimal zone.","low_causes":"High HDL, low triglycerides","high_causes":"Low HDL, high triglycerides, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3125","lower_normal":"","upper_normal":"0.8","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried by triglyceride-rich particles after they have delivered their fat. It is calculated as total cholesterol minus HDL minus LDL. At 0.50, right at the optimal threshold of 0.5, this is a healthy result.","low_causes":"Low triglycerides, efficient lipid clearance","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, familial dysbetalipoproteinaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4714","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin-to-globulin ratio reflects the balance between the liver's main protein output (albumin) and the immune system's protein output (globulins). At 1.68, within the ideal range, this confirms ba Low neutrophils, low platelets","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytehdlratio","name":"Monocyte:HDL Ratio","group":"INFLAMMATION","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2917","lower_normal":"","upper_normal":"0.6","lower_optimal":"","upper_optimal":"0.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"ratio","description":"The monocyte-to-HDL ratio combines an inflammatory cell count with a protective lipid marker. A higher ratio is associated with cardiovascular inflammation. At 0.35, within the ideal range, this is a healthy result.","low_causes":"Low monocytes, high HDL","high_causes":"Inflammation with low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"liverassessment","name":"Liver Assessment","group":"LIVER & METABOLIC","result":"Mild metabolic load","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"ALT at 45.2 is above the male optimal of below 30, and GGT at 30 is above the optimal of below 25, though both are within laboratory ranges. All fibrosis scores (FIB-4 0.4, APRI 0.247, NAFLD minus 3.489) are low. No liver scarring; the mild elevation reflects early metabolic load from body composition.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0749","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2434","units":"score","description":"FIB-4 is a calculated score that estimates liver fibrosis (scarring) from age, AST, ALT, and platelet count. At 0.4, well within the ideal range of below 1.3, this confidently rules out significant liver fibrosis.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.247","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0823","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"APRI is another liver fibrosis score, calculated from AST and platelet count. At 0.247, well within the ideal range of below 0.5, this confirms no significant liver fibrosis or cirrhosis.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-3.489","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3698","lower_normal":"-4","upper_normal":"0.676","lower_optimal":"-4","upper_optimal":"-1.455","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5148","units":"score","description":"The NAFLD Fibrosis Score estimates the likelihood of advanced fibrosis in non-alcoholic fatty liver disease, using age, BMI, platelet count, albumin, AST, and ALT. At minus 3.489, well within the ideal range, this confidently rules out advanced fatty liver fibrosis.","low_causes":"No fibrosis, young age, healthy BMI","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"0.49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2967","lower_normal":"0.6","upper_normal":"1.6","lower_optimal":"0.8","upper_optimal":"1.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5667","units":"ratio","description":"The De Ritis ratio divides AST by ALT. A ratio below 1.0, particularly below 0.6, is typical of metabolic or fatty liver conditions where ALT rises more than AST. At 0.49, below the lower limit of 0.6, the ratio is driven by his mildly elevated ALT of 45.2 against a healthy AST of 22. With all fibrosis scores low and GGT normal, this supports a metabolic rather than a structural liver issue, and body composition improvement is the answer.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rfactor","name":"R Factor","group":"LIVER & METABOLIC","result":"2.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2050","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2000","units":"ratio","description":"The R factor divides ALT by ALP (using their upper limits of normal) to help classify liver injury as hepatocellular (R above 5), cholestatic (R below 2), or mixed. At 2.05, this sits at the mixed boundary, driven by his mildly elevated ALT. With normal ALP, GGT, and bilirubin, there is no cholestatic or significant hepatocellular injury.","low_causes":"Cholestatic pattern, normal ALT","high_causes":"Hepatocellular pattern of liver injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"kidneyassessment","name":"Kidney Assessment", function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

// ============================================================
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

// tooltip for body map
const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = st.note ? `<strong>${esc(sys.label)}</strong>${esc(st.label)} · ${esc(st.note)}` : `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';

  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });

document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
