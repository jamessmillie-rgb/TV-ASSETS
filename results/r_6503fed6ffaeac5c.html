<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Wessameldin Hassan","dob":"17/02/1999","report_date":"2026-11-02","summary":"Patient is a 27-year-old male presenting with a BMI of 28.9, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are about average (volume 5 out of 10). He trains twice per week with cardio at moderate intensity but does no resistance training, averaging 5,000 to 7,500 daily steps. He sleeps 7 to 8 hours but wakes tired most mornings, with energy low all day. Stress feels hard to manage some weeks. He drinks 1 to 4 alcoholic drinks per week. He supplements with vitamin D and omega-3 fish oil. He has a family history of type 2 diabetes. He reports low energy and fatigue, low mood and anxiety, brain fog, and poor exercise recovery, all present for weeks. His goals are to improve energy levels, improve mood, and improve cardiovascular fitness.\n\nThe finding that should go to his GP first is a combination of hormonal results that, taken together, suggest the pituitary gland may not be driving the reproductive axis as hard as it should. His follicle-stimulating hormone, or FSH, which is produced by the pituitary gland to stimulate sperm production and support the testes, is 1.01, below the lower limit of 1.5. His cortisol, the body's main stress and waking hormone produced by the adrenal glands, is 83, well below the lower limit of 138. His oestradiol, a form of oestrogen that men produce in small amounts and which plays a role in bone health, brain function, and libido, is 175, above the upper limit of 159. His progesterone, a hormone present in small amounts in men, is 1.03, above the upper limit of 0.47. His blood was drawn at 09:12, when cortisol should be near its daily peak, so a value of 83 raises the possibility of inadequate adrenal output, a situation called adrenal insufficiency. Cortisol does follow a sharp daily rhythm and a single result can be affected by the time he woke, so it needs confirming before anything is concluded. Steroid medicines, including inhalers, nasal sprays, creams and injections, are a common cause of a low cortisol, so the GP will want to know about anything like this he uses. The fact that he wakes tired most mornings and feels low all day is entirely consistent with a flattened cortisol curve, but the number is low enough that it needs a formal repeat soon, within the next week or two rather than at a routine review, ideally a 9am cortisol with the GP, and if still low, a short Synacthen test to check whether the adrenal glands can respond to stimulation. The low FSH alongside a testosterone that is actually within the optimal range at 18.5 is an unusual combination. Normally the pituitary raises FSH and LH when testosterone is not high enough; here, testosterone is adequate and FSH is below range, which could suggest the pituitary is being partially suppressed. The elevated oestradiol may be contributing: oestrogen feeds back to the pituitary and can lower FSH secretion, and at a BMI of 28.9 with an estimated body fat of 24.6%, there is enough adipose tissue to drive higher aromatase activity, the enzyme that converts testosterone into oestradiol. Progesterone above range in a man is unusual and could reflect adrenal steroid production or the same broader hormonal signal. None of these findings alone would be alarming, but together they form a pattern the GP should see. The most important next step is a repeat morning cortisol and a pituitary hormone profile.\n\nThe other finding that warrants attention is his Cystatin C, a small protein filtered by the kidneys that gives a very accurate picture of kidney filtration. His Cystatin C is 1.11, above the upper limit of 1.05, and the eGFR calculated from it is 77, below the optimal threshold of 90. The creatinine-based eGFR is 97, which is normal, and the combined eGFR using both markers is 86. Creatinine is influenced by muscle mass, and at 102 kg with a reasonable amount of lean mass the creatinine eGFR may be slightly flattering. A Cystatin C eGFR of 77 at 27 is below where it should be. His urea, urea-to-creatinine ratio, microalbumin, and Beta-2-Microglobulin are all normal, and his urinalysis is completely clean with no protein, no blood, and no glucose, which is reassuring. This is most likely a single-sample variation, but it is worth a repeat in three to six months, and the GP should be aware of the number.\n\nTurning to the positives, and there are many. His cardiovascular profile is genuinely excellent for a 27-year-old with a family history of type 2 diabetes. His total cholesterol is 3.75, his LDL is 2.06, and his ApoB, which is the single best measure of the number of cholesterol-carrying particles in the blood, is 61, comfortably below the ideal threshold of 80. His Lp(a), an inherited lipoprotein that adds cardiovascular risk and cannot be changed by lifestyle, is 16.1, well within the ideal range of below 32. This is genuinely useful information because it means any future lipid changes would be entirely driven by modifiable factors like diet and exercise. His triglycerides are 1.10, his ApoB-to-ApoA-I ratio is 0.45, and his Cardiovascular Risk Score is 10 out of 100, which is ideal. His hsCRP, a marker of systemic inflammation, is 0.52, below the ideal threshold of 1.0, which at a BMI of 28.9 is a positive finding because carrying extra weight often pushes CRP higher. His D-Dimer, a clotting marker, is very low. His PhenoAge, a biological age estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, alkaline phosphatase, and white cell count, is 18.1 against a calendar age of 27, which places him nearly nine years younger biologically. The markers driving that favourable gap are his low CRP, healthy glucose, and good albumin.\n\nHis blood sugar control is excellent and particularly reassuring given his family history of type 2 diabetes. His fasting glucose is 5.18, his HbA1c, which reflects average blood sugar over two to three months, is 32, well below the ideal of 36, and his HOMA-IR, which estimates how sensitive his cells are to insulin, is 1.53, within the reference range of below 2.0 but just above the ideal threshold of 1.5. His fasting insulin is 46.1 pmol/L, which converts to approximately 6.6 mIU/L, within the ideal band of 2 to 8. His C-peptide, which confirms how much insulin the pancreas is making, is healthy at 1.87 ng/ml. His fructosamine, another short-term sugar average, is 222, well within range. Given the family history, maintaining this level of insulin sensitivity through diet, exercise, and body composition is one of the most protective things he can do.\n\nHis liver is working well. ALT at 45.2 is within the laboratory range of below 55 but sits above the tighter optimal threshold of below 30 for a male. AST is 22, GGT is 30, bilirubin is 10.76, and albumin is 47.1. The FIB-4 score, which estimates liver scarring, is 0.4, the APRI is 0.247, and the NAFLD Fibrosis Score is well in the healthy zone at minus 3.489. There is no sign of fatty liver or fibrosis. The mildly elevated ALT is worth noting because at 27 with a BMI of 28.9 and sugary food some days, it may reflect early metabolic load on the liver. Losing body fat and reducing sugar would be expected to bring this into the optimal zone. His aldolase, an enzyme found in muscle and liver, is 9.44, above the upper limit of 7.6. Aldolase can rise after exercise, and with creatine kinase and the other muscle and liver markers normal, this mild rise is unlikely to be clinically significant.\n\nHis thyroid is functioning well. TSH is 0.775, FT4 is 20.50, and FT3 is 6.79. The FT3 sits just inside the upper limit of 6.8, so it is within range, and a strong FT3 shows excellent conversion from T4 to the active hormone. Both thyroid antibodies are negative, so autoimmune thyroid disease is unlikely. The FT3-to-FT4 ratio is 0.331, within the optimal range, confirming efficient conversion.\n\nHis full blood count is healthy across the board. Haemoglobin is 156, haematocrit 47.3%, and all red cell indices are within the ideal range. His white blood cell count is 4.66, towards the lower end of the 4 to 10 range but within it, and the differential, including neutrophils, lymphocytes, monocytes, eosinophils, and basophils, is balanced. Platelets are 223, comfortably mid-range. His iron studies are solid: ferritin is 118, transferrin saturation is 25%, and TIBC and transferrin are normal.\n\nHis vitamin D is 105, within the ideal range of 75 to 120, which confirms his supplementation is working well. His B12 is 774, marginally above the upper limit of 771, and his active B12, which measures the portion the body can actually use, is 127, within range. A B12 just above range with a normal active B12 is common and not a concern; the normal active B12 confirms there is no functional excess. His folate is 9.0 and red cell folate is 949, both healthy. His homocysteine, which rises when B12 or folate are low and is linked to cardiovascular risk, is 8.2, below the ideal of 9, which is excellent. His zinc is 15.5, within the optimal range, and his copper is 12.7, at the lower end of the 11 to 24 range but within it. His total antioxidant status is 1.81, above the threshold of 1.3.\n\nHis immune markers are reassuring. IgG, IgA, and IgM are all within range. IgE is low, so there is no sign of an allergic drive. Complement C4 is normal. Haptoglobin is 0.52, low-normal but within range, and with no sign of haemolysis from the blood count this is not a concern. His autoimmune screen is clean: coeliac antibodies are negative, rheumatoid factor is negative, anti-CCP is negative, ANA is negative, and both thyroid antibodies are negative. Gastric parietal cell antibodies are negative, so autoimmune gastritis is unlikely. His Epstein-Barr Nuclear Antigen IgG is 92.1, which is positive and indicates past infection with the Epstein-Barr virus, the virus that causes glandular fever. The VCA IgM is negative, meaning there is no active or recent infection. This pattern, positive EBNA IgG with negative VCA IgM, is the expected fingerprint of previous exposure and lifelong immunity. Most adults carry this and it does not explain his current symptoms.\n\nHis tumour markers are reassuring. AFP, CEA, CA 19-9, hCG, mesothelin, and calcitonin are all normal. His PSA is 0.55, very low and expected at 27. His Prostate Cancer Risk Score shows decreased risk. His NSE, neuron-specific enolase, is 17.40, marginally above the upper limit of 16.3. At this margin, with every other tumour marker clean and no symptoms, this is not clinically significant.\n\nHis cardiac markers are all normal: CK-MB is below the detection threshold, troponin T is 3.31 against a limit of 14, myoglobin is 16.49, and creatine kinase is 82. His heart is under no strain.\n\nHis digestive panel is clean. H. pylori antibodies are 24.78, well below the 81.07 threshold, and gastrin is 28.60, mid-range. Pancreatic amylase and lipase are both normal. Bile acids are 8.30, within range.\n\nHis electrolytes are all within range. Sodium, potassium, chloride, bicarbonate, calcium, phosphate, and magnesium are normal. His magnesium at 0.81 sits just below the optimal floor of 0.85, which is a minor finding but worth addressing with supplementation given his fatigue and poor exercise recovery. His parathyroid hormone is 2.8, mid-range, and his Dickkopf-1, a marker involved in bone metabolism, is 2129, within range.\n\nLooking at the inflammation panel in more detail, two interleukin results stand out. His IL-5, which is involved in eosinophil activation and allergic pathways, is 50.05, dramatically above the upper limit of 1.49. His IL-17F, which plays a role in mucosal immunity and inflammatory responses, is 2.34, above the upper limit of 0.44. His IL-8 is reported as below 4.94, the lower detection limit, which is not a concern. His ASO titre, or antistreptolysin O, which rises after a streptococcal infection, is 238.6, above the 200 threshold. An elevated ASO means the immune system has recently encountered a streptococcal bacterium, commonly a throat or skin infection. This could have been subclinical. The elevated IL-5 is striking. An IL-5 this high in isolation would usually prompt consideration of eosinophilic conditions, allergic disease, or parasitic infection, yet his eosinophil count is 0.07, which is low-normal, and his IgE is below 19.6. The disconnect between a very high IL-5 and a low eosinophil count and low IgE argues against an established allergic or eosinophilic process. IL-5 and IL-17F are specialist markers without well-established clinical cut-offs, so they are best read as something to recheck rather than a diagnosis. These findings are not dangerous but are worth mentioning to the GP, particularly if he has had a sore throat, skin infection, or any respiratory symptoms in the weeks before the test. A repeat in three months would show whether these are settling.\n\nHis HDL cholesterol is 1.19, below the laboratory's lower limit of 1.55. While every other lipid marker is excellent, HDL is the exception. HDL particles help remove cholesterol from artery walls and return it to the liver, and higher levels are protective. At 27 with a BMI of 28.9, no resistance training, and moderate cardio only twice a week, the most likely explanation is a combination of body composition and activity level. HDL responds strongly to regular vigorous exercise, to losing excess body fat. Adding resistance training and increasing overall activity would be the most effective way to raise it. His adiponectin, a hormone produced by fat cells that improves insulin sensitivity and is inversely related to visceral fat, is 1.56, just above the lower limit of 1.44. The adiponectin-to-insulin ratio is 0.24, below the 0.3 threshold, which together suggest that while his insulin sensitivity is good by HOMA-IR, the adipose tissue is producing less adiponectin than ideal, likely reflecting the extra body fat. Losing weight would improve both.\n\nHis De Ritis ratio, the AST-to-ALT ratio, is 0.49, below the lower limit of 0.6. This ratio being below 1.0 with a mildly elevated ALT is typical of metabolic or fatty liver patterns rather than anything more serious. With no scarring on the fibrosis scores and clean GGT, this is not a concern but supports the recommendation to bring ALT down through body composition changes.\n\nReturning to his symptoms of fatigue, low mood, brain fog, and poor exercise recovery, the bloods do not provide a single clear explanation, and that is actually useful information. His thyroid is working well, his iron stores are healthy, his B12 and folate are replete, his blood sugar control is excellent, there is no anaemia, no significant inflammation by CRP, no coeliac disease, and his testosterone is within the optimal range. The low cortisol is the one result that could directly contribute to all four symptoms, because cortisol drives the waking response, sustains energy through the day, supports mood, and aids recovery from exercise. If the repeat confirms a genuinely low cortisol, addressing it could make a meaningful difference. Beyond that, his sleep quality is poor despite adequate hours, he wakes tired, and his energy is low all day, which together point towards sleep that is not restorative. At a BMI of 28.9, obstructive sleep apnoea is worth considering, particularly in a young man who wakes unrefreshed. A simple screening questionnaire with his GP or a home sleep study could rule this in or out. His diet, while not poor, has room for improvement: 2 to 3 portions of fruit and vegetables is below the 5-a-day minimum, sugary food some days adds glycaemic load, and without resistance training his body composition is drifting towards a higher fat percentage than is ideal for his age. The combination of better sleep investigation, body composition improvement through resistance training and dietary changes, and the cortisol investigation would cover the most likely explanations for how he feels.","links":"The thread running through this report is a 27-year-old man whose metabolic health is genuinely good but whose hormonal axis and body composition are not quite where they should be, and whose symptoms may be explained by something the bloods can partially but not fully capture. His cardiovascular and metabolic markers are excellent, his PhenoAge is nearly nine years younger than his calendar age, and his blood sugar control is a particular strength given his family history of type 2 diabetes. The body is doing a great deal right.\n\nThe hormonal findings are the most important clinical thread. A cortisol of 83 against a lower limit of 138, an FSH of 1.01 below the 1.5 floor, an oestradiol of 175 above the 159 ceiling, and a progesterone of 1.03 above the 0.47 limit form a pattern that could share a common explanation: the hypothalamic-pituitary-adrenal and hypothalamic-pituitary-gonadal axes may not be functioning optimally. The elevated oestradiol, driven by aromatase activity in adipose tissue at BMI 28.9, feeds back to suppress FSH. The low cortisol may reflect a separate issue at the adrenal or pituitary level, or it may be a consequence of poor sleep quality and a disrupted cortisol rhythm. The progesterone excess could originate from adrenal precursors. A repeat 9am cortisol is the priority, followed by a broader pituitary assessment if confirmed.\n\nThe kidney finding, a Cystatin C of 1.11 with an eGFR of 77, stands apart from the hormonal story. Every other kidney marker is normal, the urinalysis is clean, and the creatinine eGFR is 97. This could be a single-sample variation, but at 27 it deserves a repeat. It is not connected to the hormonal findings.\n\nThe inflammatory cytokine results, with a strikingly elevated IL-5, a raised IL-17F, and an ASO above threshold, need a sensible follow-up rather than alarm. The raised ASO points to a streptococcal infection in recent months. IL-5 and IL-17F are specialist markers without well-established clinical cut-offs, and the very high IL-5 alongside low eosinophils and low IgE argues against an established allergic or eosinophilic condition. A repeat in 3 months, discussed with the GP, is the right next step. A repeat in three months would confirm resolution.\n\nThe low HDL, the mildly elevated ALT, the below-optimal adiponectin-to-insulin ratio, and the BMI of 28.9 are all connected by one factor: body composition. He carries more fat mass than ideal at 25.1 kg estimated, he does no resistance training, and his diet includes sugary food some days with only 2 to 3 portions of vegetables. Improving body composition through resistance training, increased protein, and dietary quality would be expected to raise HDL, lower ALT into the optimal zone, improve adiponectin output, and reduce oestradiol by lowering aromatase activity, which would in turn help normalise the FSH. This is the most actionable lever in the report.\n\nThe loose end is his symptoms. Low energy, low mood, brain fog, and poor recovery are real and have been present for weeks. The bloods exclude anaemia, thyroid disease, coeliac disease, B12 or folate deficiency, diabetes, and significant systemic inflammation. The low cortisol is the strongest candidate from the bloods, but unrestorative sleep despite adequate hours is the strongest candidate from the quiz, and the two may be linked. Investigating both, through a repeat cortisol and a sleep quality assessment, gives the best chance of finding the explanation.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish, or leftover meat. Anchor: protein goes on the plate before anything else. Why: protein supports muscle retention, improves satiety, and helps the body shift towards a leaner composition, which will lower oestradiol and raise HDL over time. Your target is at least 133g of protein per day.\nSwap sugary snacks and drinks for whole-food alternatives on the days you currently have them. A piece of fruit with nuts, dark chocolate at 85% or above, or yoghurt with berries. Anchor: keep the snack habit, change what fills it. Why: reducing sugar lowers the glycaemic load on your liver, which is behind the ALT sitting at 45 rather than in the ideal zone below 30, and protects the good insulin sensitivity you have now.\nIncrease fruit and vegetable portions from 2 to 3 to at least 5 a day. Add a portion at lunch and a portion at dinner as the minimum. Anchor: every plate gets at least one fist-sized portion of vegetables before anything else is added. Why: fibre feeds gut bacteria, improves cholesterol clearance, and the micronutrients support the immune and hormonal pathways that are slightly off.\nStart resistance training twice a week. Whole-body sessions with compound movements: squats, deadlifts, presses, rows. Even bodyweight to start. Anchor: pick two fixed days that do not clash with your cardio days. Why: resistance training is the single most effective way to raise HDL (yours is 1.19 against a 1.55 target), improve body composition, increase insulin sensitivity, reduce oestradiol by lowering body fat, and improve exercise recovery. It also raises testosterone output and lowers cortisol over time.\nWalk for 15 minutes after your largest meal of the day. Anchor: plate in the sink, shoes on. Why: post-meal walking improves glucose disposal and helps protect the insulin sensitivity that is currently excellent despite your family history of type 2 diabetes.\nFix your wake time to the same time every day, including weekends, and get outside within 30 minutes of waking for at least 10 minutes of daylight. Anchor: alarm goes off, curtains open, outside before checking your phone. Why: morning light resets the cortisol awakening response, which is the mechanism behind waking refreshed rather than tired, and your cortisol at 83 suggests this rhythm may be blunted.\nSet a caffeine cut-off at 1pm. Anchor: after lunch, switch to water or herbal tea. Why: caffeine has a half-life of 5 to 7 hours. Drinking it in the afternoon fragments deep sleep, which would explain waking tired despite sleeping 7 to 8 hours.\nAim for a calorie intake of around 2,700 kcal per day. This is roughly 300 below your estimated expenditure of 2,994 and will support steady fat loss of about 0.25 to 0.5 kg per week while preserving muscle, provided you keep protein at 133g or above. Your first milestone is 95 kg; your longer-term target is around 88 kg, the weight at which your BMI reaches 24.9.","flags":"Cortisol 83 nmol/L, below the lower limit of 138. Drawn at 09:12, a morning cortisol this low warrants a prompt repeat 9am cortisol with the GP, within the next week or two, and a review of any steroid-containing medicines. If confirmed, a short Synacthen test should be performed to assess adrenal reserve. His symptoms of all-day fatigue, low mood, and poor recovery are consistent with inadequate cortisol output.\nFSH 1.01 IU/L, below the lower limit of 1.5, alongside oestradiol 175 pmol/L above the upper limit of 159 and progesterone 1.03 nmol/L above the upper limit of 0.47. This pattern suggests partial pituitary suppression of the gonadal axis, possibly driven by elevated oestradiol from aromatase activity at BMI 28.9. Testosterone is adequate at 18.5, so the clinical impact may be limited, but the GP should assess this as part of a pituitary hormone profile.\nCystatin C 1.11 mg/L, above the upper limit of 1.05, giving an eGFR of 77 from Cystatin C against 97 from creatinine and 86 combined. All other kidney markers are normal and urinalysis is clean. A repeat in three to six months is recommended to confirm or exclude a genuine reduction in filtration at age 27.\nIL-5 50.05 pg/mL, markedly above the upper limit of 1.49. IL-17F 2.34 pg/mL, above the upper limit of 0.44. ASO 238.6 IU/mL, above the upper limit of 200. The raised ASO points to a streptococcal infection in recent months. IL-5 and IL-17F are specialist markers without well-established clinical cut-offs. Eosinophils are low-normal and IgE is low, arguing against an established eosinophilic or allergic condition. Worth mentioning to the GP, particularly if there has been a recent sore throat or skin infection. Repeat in three months to confirm resolution.\nHDL 1.19 mmol/L, below the laboratory's lower limit of 1.55. Adiponectin 1.56 ug/mL, just above the lower limit of 1.44, and adiponectin-to-insulin ratio 0.24, below the 0.3 threshold. Driven by body composition and low activity. Resistance training and fat loss are the most effective interventions.\nALT 45.2 IU/L, within the laboratory range of below 55 but above the male optimal of below 30. De Ritis ratio 0.49, below the 0.6 floor. All fibrosis scores are low and GGT is normal. Likely early metabolic load from body composition and sugar intake rather than liver disease. Expected to improve with dietary changes and weight loss.\nAldolase 9.44 IU/L, above the upper limit of 7.6. Aldolase often rises after exercise; creatine kinase and the other muscle and liver markers are normal. Not clinically significant in isolation.\nNSE 17.40 ug/L, marginally above the upper limit of 16.3. At this margin, with every other tumour marker normal, this is not clinically significant.\nVitamin B12 774 ng/L, marginally above the upper limit of 771. Active B12 is 127 pmol/L, within range. Not a concern.\nFT3 6.79 pmol/L, just inside the upper limit of 6.8 and within range. Thyroid function is excellent with negative antibodies.\nReassuring negatives: excellent cardiovascular risk profile with ApoB 61 and Lp(a) 16.1; blood sugar control with HbA1c 32 and HOMA-IR 1.53 (in range) despite family history of type 2 diabetes; thyroid function normal with negative antibodies; coeliac screen negative; autoimmune screen negative (ANA, RF, anti-CCP all negative); no anaemia with haemoglobin 156 and ferritin 118; CRP 0.52; liver fibrosis scores all low; urinalysis completely clean; cardiac markers all normal; tumour markers all normal; EBV showing past immunity only.\nNot reported on this occasion: Apolipoprotein CII, Apolipoprotein CIII, Pan-ProBNP, Leptin, Resistin, IL-6, TNF-alpha, Cystatin C (Urine), NGAL, KIM-1, Pepsinogen I, Pepsinogen II, PGI/II ratio, Gastrin-17, Glutathione Reductase, C3, IL-1a, IL-1beta, IL-2, IL-3, IL-4, IL-7, IL-10, IL-12p70, IL-13, IL-23, sIL-2Ra, sIL-6R, sTNFR-I, sTNFR-II, Amphiregulin, TGF-alpha, VEGF, MIP-1a, MMP-9, E-Selectin, L-Selectin, P-Selectin, ICAM-1, VCAM-1, PD-1, EBV VCA IgG, Intrinsic Factor Antibodies, TBG, Nicked PSA, FABP-4, FABP-5, FABP-6, FABP-7, FABP-9, and multiple autoantibody panels.","recommendations":"Book a repeat 9am cortisol with the GP within the next week or two, bringing the result of 83 nmol/L against a lower limit of 138. If confirmed low, request a short Synacthen test to assess adrenal reserve. Mention the symptoms of all-day fatigue, low mood, brain fog, and poor exercise recovery. Tell the GP about any steroid medicines, including inhalers, nasal sprays and creams, and any hormone or bodybuilding supplements, as these can affect cortisol and the hormone results below.\nAsk the GP to review the full hormonal picture: FSH 1.01 (below 1.5), oestradiol 175 (above 159), progesterone 1.03 (above 0.47), alongside a normal testosterone of 18.5 and LH of 3.6. A pituitary hormone profile including prolactin (already normal at 175) and a repeat FSH and LH would clarify whether there is genuine pituitary suppression.\nDiscuss the Cystatin C of 1.11 (above 1.05) and eGFR of 77 from Cystatin C. Request a repeat Cystatin C in three to six months. If confirmed, a renal ultrasound and urine protein-to-creatinine ratio would be appropriate.\nMention the ASO of 238.6 (above 200) and ask whether a recent streptococcal infection was noticed. If he has had joint pain, skin rashes, or a sore throat, the GP may wish to examine for post-streptococcal complications.\nDiscuss sleep quality: he sleeps 7 to 8 hours but wakes tired with low energy all day. At a BMI of 28.9, a screening questionnaire for obstructive sleep apnoea (such as STOP-Bang) is reasonable, and a home sleep study if the score is elevated.\nRetest in three to four months. Repeat cortisol (9am fasting), FSH, LH, oestradiol, progesterone, Cystatin C, eGFR, ALT, HDL, IL-5, IL-17F, and ASO. These will show whether the hormonal pattern has shifted with body composition changes, whether the kidney finding persists, whether the immune activation has resolved, and whether lifestyle changes have moved ALT and HDL.\nCalorie target: approximately 2,700 kcal per day (about 300 below the estimated expenditure of 2,994). Protein target: at least 133g per day (1.3g per kg). First weight milestone: 95 kg. Longer-term target: around 88 kg. These targets support steady fat loss while preserving muscle mass, and the resulting body composition change is the single biggest lever for improving HDL, lowering oestradiol, and protecting against the type 2 diabetes in his family history.","supplementation":"Magnesium glycinate, 300 to 400mg elemental magnesium, taken before bed. His magnesium is 0.81, below the optimal floor of 0.85, and supplementation supports sleep quality, exercise recovery, and muscle function, all of which are relevant to his symptoms.\nContinue Vitamin D3 (cholecalciferol) at the current dose. His level is 105 nmol/L, within the ideal range of 75 to 120, which confirms supplementation is working. Add Vitamin K2 (MK-7), 100 to 200 mcg daily, taken with the vitamin D and a meal containing fat. Vitamin K2 directs calcium into bone rather than arteries, and is a standard companion to vitamin D supplementation.\nContinue omega-3 fish oil. Aim for a combined dose of at least 2g of EPA and DHA per day. Omega-3 supports cardiovascular health, reduces systemic inflammation, and may help with mood, all of which align with his goals.\nDo not start iron supplements. His ferritin is 118 and transferrin saturation is 25%, both healthy. Additional iron at these levels risks pushing stores into a range that increases oxidative stress.\nThe most important changes from this report are not supplements. They are adding resistance training twice a week, improving diet quality by increasing vegetables to at least five portions and reducing sugar, achieving a calorie deficit to move towards 88 kg, investigating the low cortisol with his GP, and addressing sleep quality through a fixed wake time and morning light exposure.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 70.7; held to 59 by a system rated \"See your GP\". Weakest systems: hormones 30%, immunology 35%, inflammation 40%. Biggest drags: Cortisol, Oestradiol, Cystatin C, Progesterone.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"18.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2828","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"27","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4219","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW (estimated at 13% as this panel does not measure it), alkaline phosphatase, and white cell count. At 18.1, against a calendar age of 27, his biological age is nearly nine years younger. The markers driving this favourable gap are his low CRP of 0.52, healthy glucose of 5.18, strong albumin of 47.1, and normal kidney and liver function. The lifestyle changes in this report, particularly improving body composition and sleep, are likely to maintain or widen this gap.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP, and HbA1c. It has no age term: it measures the risk being built, not the ten-year probability of an event. At 10, well within the ideal range of 20 or below, his cardiovascular risk profile is excellent. The only input pulling it slightly upwards is the low HDL at 1.19; every other input is strong.","low_causes":"Excellent lipid profile, low inflammation, good blood sugar control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ha ition":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"0.4222","units":"umol/l","description":"Homocysteine is an amino acid that, when elevated, is associated with increased cardiovascular risk, brain fog, and poor methylation. It is kept in check by adequate B12, folate, and B6. At 8.2, well below the ideal of 9, his homocysteine is excellent and confirms that his B-vitamin status is supporting healthy methylation.","low_causes":"Adequate B12, folate, and B6","high_causes":"B12 or folate deficiency, MTHFR variants, kidney disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High Sensitivity C-Reactive Protein (hsCRP)","group":"INFLAMMATION","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2600","lower_normal":"","upper_normal":"1","lower_optimal":"","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"mg/l","description":"hsCRP is the most sensitive marker of systemic inflammation in the body. Levels below 1.0 are considered ideal, and below 3.0 is the laboratory threshold. At 0.52, his inflammation is low and well within the ideal range. At a BMI of 28.9, this is a particularly positive finding because carrying extra body fat often raises CRP.","low_causes":"Low inflammation, healthy body composition, good diet","high_causes":"Infection, chronic inflammation, obesity, metabolic syndrome, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aso","name":"Antistreptolysin O (ASO)","group":"INFLAMMATION","result":"238.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5965","lower_normal":"","upper_normal":"200","lower_optimal":"","upper_optimal":"150","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"iu/ml","description":"Antistreptolysin O is an antibody the immune system produces in response to infection with Group A Streptococcus, the bacterium that causes strep throat and skin infections. At 238.6, above the upper limit of 200, his immune system has recently encountered this bacterium. The infection may have been mild or subclinical. ASO titres typically take weeks to months to return to normal after an infection. It is worth mentioning to the GP, especially if he has had joint pain, a rash or any change in his urine.","low_causes":"No recent streptococcal exposure","high_causes":"Recent streptococcal infection (throat, skin), rheumatic fever, post-streptococcal glomerulonephritis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ddimer","name":"D-Dimer","group":"INFLAMMATION","result":"0.059","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0666","lower_normal":"","upper_normal":"0.443","lower_optimal":"","upper_optimal":"0.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3386","units":"ug/ml","description":"D-Dimer is a fragment produced when blood clots are broken down. It is used to rule out active clotting disorders. At 0.059, his level is very low, confirming no abnormal clot formation or breakdown.","low_causes":"Normal haemostasis","high_causes":"Deep vein thrombosis, pulmonary embolism, DIC, surgery, trauma, infection, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"il5","name":"Interleukin-5 (IL-5)","group":"INFLAMMATION","result":"50.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"1.49","lower_optimal":"","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3356","units":"pg/ml","description":"Interleukin-5 is a cytokine, a chemical messenger of the immune system, that stimulates the production and activation of eosinophils, a type of white blood cell involved in allergic responses and parasite defence. At 50.05, his level is dramatically above the upper limit of 1.49. However, his eosinophil count is low-normal at 0.07 and his IgE is low, which is unusual because a sustained high IL-5 would typically drive both eosinophils and IgE upwards. IL-5 is a specialist marker without well-established clinical cut-offs, and a single raised value with normal eosinophils does not point to a specific condition. A repeat in three months would confirm resolution. If it persists, the GP may wish to consider eosinophilic conditions or parasitic exposure.","low_causes":"Normal immune state","high_causes":"Eosinophilic disorders, allergic disease, parasitic infection, post-infectious immune activation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"il8","name":"Interleukin-8 (IL-8)","group":"INFLAMMATION","result":"<4.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"4.94","upper_normal":"240.09","lower_optimal":"4.94","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4681","units":"pg/ml","description":"Interleukin-8 is a cytokine that attracts neutrophils to sites of infection. His level is below the detection threshold of 4.94, which is flagged as below the laboratory range. In practice, a low IL-8 simply means there is no active neutrophilic inflammation. This is not a concern.","low_causes":"Low neutrophilic inflammation, normal state","high_causes":"Bacterial infection, tissue injury, chronic inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"il15","name":"Interleukin-15 (IL-15)","group":"INFLAMMATION","result":"1.04","within_normal":"TRUE","within_optimal":"TRUE","result_position r and barrier function in the gut and skin. At 2.61, well within range, this confirms healthy mucosal barrier maintenance.","low_causes":"Normal variation","high_causes":"Inflammatory bowel disease, psoriasis, hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ckmb","name":"Creatine Kinase-MB (CK-MB)","group":"CARDIAC MARKERS","result":"<0.780","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0636","lower_normal":"","upper_normal":"6.13","lower_optimal":"","upper_optimal":"4.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3263","units":"ug/l","description":"CK-MB is an enzyme found predominantly in heart muscle. When heart muscle is damaged, CK-MB is released into the blood. At below 0.780, essentially undetectable, there is no sign of heart muscle injury.","low_causes":"Normal state","high_causes":"Myocardial infarction, myocarditis, cardiac surgery, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3833","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3452","upper_optimal_position":"0.5833","units":"IU/L","description":"Creatine kinase is an enzyme found in muscles, including the heart. It rises after exercise or muscle damage. At 82, within the ideal range and relatively low for an active male, there is no significant muscle damage or strain.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, myocardial infarction, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"myoglobin","name":"Myoglobin","group":"CARDIAC MARKERS","result":"16.49","wi al range, there is no cardiac or significant muscle injury.","low_causes":"Normal state","high_causes":"Myocardial infarction, heart failure, skeletal muscle damage","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Glucose","group":"GLUCOSE & INSULIN","result":"5.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4644","lower_normal":"4","upper_normal":"7","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4889","units":"mmol/l","description":"Fasting glucose measures the amount of sugar in the blood after not eating. At 5.18, it is within the ideal range of 4.0 to 5.4, reflecting healthy blood sugar regulation. This is particularly reassuring given the family history of type 2 diabetes.","low_causes":"Fasting, excess insulin, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress, corticosteroid use, high carbohydrate meal before test","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"32.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3812","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c reflects average blood sugar control over the previous two to three months by measuring how much glucose has attached to haemoglobin. At 32, well within the ideal of below 36, his long-term blood sugar control is excellent. This confirms his daily glucose readings are consistently healthy.","low_causes":"Low blood sugar, haemolytic anaemia, blood loss","high_causes":"Prediabetes, type 2 diabetes, high carbohydrate diet, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"46.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3941","lower_normal":"17.8","upper_normal":"173","lower_optimal":"17.8","upper_optimal":"56","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4154","units":"pmol/l","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar in check. At 46.1 pmol/L, which is approximately 6.6 mIU/L, his level is within the ideal band of 2 to 8 mIU/L. This points to good insulin sensitivity: the pancreas does not need to overwork to control his blood sugar. This is a particularly strong result given his family history of type 2 diabetes.","low_causes":"Low-carbohydrate diet, high insulin sensitivity, pancreatic insufficiency (with raised glucose)","high_causes":"Insulin resistance, high carbohydrate diet, obesity, polycystic ovary syndrome, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nonesterifiedfattyacids","name":"Non-Esterified Fatty Acids","group":"GLUCOSE & INSULIN","result":"0.370","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2056","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mmol/l","description":"Non-esterified fatty acids are free fats in the blood, released from fat stores between meals. At 0.370, within the ideal range, this shows normal fat metabolism and confirms that insulin is adequately suppressing fat release during fasting.","low_causes":"Fed state, high insulin","high_causes":"Insulin resistance, diabetes, fasting, stress, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4111","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3434","upper_optimal_position":"0.5758","units":"ng/ml","description":"C-peptide is produced in equal amounts to insulin and is a reliable measure of how much insulin the pancreas is making, unaffected by external insulin. At 1.87 ng/ml, his pancreatic output is healthy and proportionate to his glucose level, confirming normal beta-cell function.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, exogenous insulin use","high_causes":"Insulin resistance, insulinoma, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fructosamine","name":"Fructosamine","group":"GLUCOSE & INSULIN","result":"222","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4922","lower_normal":"151","upper_normal":"300","lower_optimal":"170","upper_optimal":"270","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.5996","units":"umol/l","description":"Fructosamine reflects average blood sugar over the previous two to three weeks, shorter than the three-month window of HbA1c. At 222, within the ideal range, his short-term blood sugar control is consistent with his excellent HbA1c.","low_causes":"Low blood sugar, low albumin","high_causes":"High blood sugar, diabetes, prediabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3825","lower_normal":"","upper_normal":"2","lower_optimal":"","upper_optimal":"1.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"","description":"HOMA-IR, the Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting glucose and insulin and estimates how sensitive the body's cells are to insulin. Below 2.0 is within the reference range, and below 1.5 is ideal. At 1.53, he is just above the ideal threshold of 1.5 but well within the reference range, confirming very good insulin sensitivity. At a BMI of 28.9 and with a family history of type 2 diabetes, this is a reassuring result that shows his body is handling glucose very efficiently.","low_causes":"High insulin sensitivity, low-carbohydrate diet, fasting","high_causes":"Insulin resistance, obesity, metabolic syndrome, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"adiponectin","name":"Adiponectin","group":"GLUCOSE & INSULIN","result":"1.56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3402","lower_normal":"1.44","upper_normal":"7.27","lower_optimal":"3.0","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4225","upper_optimal_position":"0.6512","units":"ug/ml","description":"Adiponectin is a hormone produced by fat cells that improves insulin sensitivity, reduces inflammation, and protects blood vessels. Higher levels are better. At 1.56, he is just above the lower limit of 1.44, which is low. Adiponectin falls as visceral (belly) fat increases, and at a BMI of 28.9 with an estimated body fat of 24.6%, the low level likely reflects his body composition. Losing weight and adding resistance training would be expected to improve adiponectin output and further protect his insulin sensitivity.","low_causes":"Excess visceral fat, obesity, metabolic syndrome, insulin resistance","high_causes":"Low body fat, exercise, weight loss, female sex","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"microalbumincreatininera","name":"Microalbumin / Creatinine Ratio","group":"KIDNEY FUNCTIO n":"1.0000","units":"ml/min/1.7","description":"eGFR from creatinine estimates how well the kidneys filter waste. At 97, this is above the optimal threshold of 90 and healthy. However, creatinine-based eGFR can be flattering at higher body weights because of the muscle mass effect. The Cystatin C eGFR of 77 gives a more accurate picture and is discussed separately.","low_causes":"Chronic kidney disease, dehydration, heart failure, medication","high_causes":"High muscle mass, high protein diet, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7083","lower_normal":"0.57","upper_normal":"1.05","lower_optimal":"0.6","upper_optimal":"0.95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5972","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all cells, filtered freely by the kidneys, and not affected by muscle mass, making it a more accurate measure of kidney filtration than creatinine, especially at higher body weights. At 1.11, above the upper limit of 1.05, his level suggests kidney filtration may be slightly below expected for a 27-year-old. The eGFR derived from this is 77, below the optimal threshold of 90. All other kidney markers are normal and the urinalysis is clean, which is reassuring. This could be a single-sample variation, but it warrants a repeat in three to six months to confirm.","low_causes":"Normal or high kidney function","high_causes":"Reduced kidney filtration, inflammation, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"beta2microglobulin","name":"Beta-2-Microglobulin","group":"KIDNEY FUNCTION","result":"2.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5222","lower_normal":"0.9","
