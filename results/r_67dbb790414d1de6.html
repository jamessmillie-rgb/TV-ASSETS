<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Mark Leeming","dob":"28/12/1979","report_date":"2026-09-22","sample_date":"2026-09-09","panel":"Signature","lab":"Randox Health","summary":"Mark is a 46-year-old male presenting with a BMI of 29.9, following a standard mixed diet rated 7 out of 10 for quality with a volume of 7 out of 10. He does no structured cardio or resistance training and walks 2,000 to 5,000 steps a day. He has type 2 diabetes. He reports vaping nicotine and using anabolic steroids or performance-enhancing drugs. He reports low energy and fatigue, low mood or anxiety, and brain fog. His goals are to prevent disease, improve his energy and lose body fat.\n\nThis report has a clear centre, and it is his diabetes. It is not controlled at the moment, and almost everything else that needs attention follows from that. His fasting glucose is 12.1 against a limit of 7.0. His HbA1c, which reflects average blood sugar over three months, is 69.4 mmol/mol against a limit of 42 and a well-controlled target of 53; in older units that is about 8.5 percent. Fructosamine, which reflects the last two to three weeks, is 484 against a limit of 300, so this is not a summer blip. There is glucose in his urine, and a trace of protein, which only happens once blood sugar sits above roughly 10 for much of the day, and it is a likely reason for thirst and passing more urine. His fasting insulin is 214 pmol/L against a limit of 173, his C-peptide is 5.50 against a limit of 4.4, and his HOMA-IR, the index of insulin resistance, is 16.6 against a limit of 2 and an ideal below 1.5. In plain terms, his pancreas is still producing large amounts of insulin and his body is barely responding to it. That is the mechanism behind the tiredness, the brain fog and the low mood far more than anything else on this panel. It is also why his PhenoAge, a biological age estimated from nine blood markers, comes out at 58 against a calendar age of 46 (calculated with an assumed red cell distribution width, which Randox does not report): the glucose alone accounts for most of that gap, and it closes as control returns. Adiponectin, the fat-tissue hormone that keeps the body insulin-sensitive, is 0.93 against a limit of 1.44, and it is suppressed by both abdominal fat and anabolic steroids. The good news inside this is that a pancreas producing this much insulin responds well when the resistance is reduced, so this is a picture that improves quickly with the right changes and the right medication review.\n\nThe second finding is the earliest sign of the diabetes reaching his kidneys. Creatinine is 107.5 against a limit of 104, which in a 197 cm man with a lot of muscle would be easy to dismiss. Cystatin C is not affected by muscle mass, and at 1.18 against a limit of 1.05 it says the reduction in filtration is real, giving an eGFR of 74 where 90 or above is ideal at his age. The urine albumin to creatinine ratio is 3.4, above the 2.5 ideal and at the 3.0 threshold where early diabetic kidney damage is defined. Homocysteine at 15.5 sits well above the 9 ideal despite excellent B12 and folate, which points to the kidneys rather than diet. And bicarbonate is 18.8 against a limit of 20: in someone with a fasting glucose of 12 a low bicarbonate deserves a proper look, though his urine ketones are negative and his anion gap is only modestly raised, so this is not ketoacidosis and reduced kidney filtration is the likelier explanation. None of these individually is dramatic. Together they are the reason this report says GP within the week rather than at the next routine visit. Diabetic kidney strain caught at this stage is reversible; caught five years later it is not.\n\nThe third finding is his heart. FABP-3, a marker released early when heart muscle is under strain, is 5.49 against a limit of 4.84. Troponin T, the most specific marker of heart muscle injury, is 11.1, below the 14 limit but well above the ideal of under 6. Myoglobin is 68.6, just under its 72 limit. CK-MB is normal, which is reassuring, and FABP-3 can rise with kidney impairment, which he has. But three cardiac muscle markers sitting high at the same time in a 46-year-old with uncontrolled diabetes, an HDL of 0.71 and a testosterone of 60.6 is a combination that needs an ECG and a repeat troponin, not an explanation. This is not an emergency. Chest pain, breathlessness or palpitations would make it one, and he should not wait for an appointment if any of those appear.\n\nHis cholesterol tells a story that a standard test would miss. Total cholesterol at 3.97 and LDL at 1.51 both look good, and ApoB at 76 mg/dl, the count of artery-damaging particles, is within the ideal. Lipoprotein (a) is undetectable, so none of his cardiovascular risk is inherited. The problem is the other half of the panel: HDL, the protective cholesterol, is 0.71 against a limit of 1.55, and triglycerides are 3.86 against a limit of 2.3. This is the lipid pattern of uncontrolled diabetes, and anabolic steroids suppress HDL further. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 that scores the lipids, inflammation and blood sugar without any age term, is 95, driven by the HDL, triglycerides and HbA1c. The score measures the risk being built rather than his chance of an event this year, but at 46 with these kidney and cardiac results the two are closer together than they would be for a younger man. Triglycerides and HDL both respond quickly to glucose control and exercise, and they will move before the HbA1c does.\n\nHis hormones read exactly as expected for someone taking testosterone or anabolic steroids, which he told us he does. Testosterone is 60.6 against a limit of 29, free testosterone is 1.606 against a limit of 0.569, and FSH and LH are both fully suppressed because the brain has stopped signalling the testes. Oestradiol is 170 against a limit of 159, because there is so much testosterone to convert from, and raised oestradiol in men contributes to water retention, breast tissue changes and low mood. Haematocrit is 50.4 percent, inside the laboratory range but above the 49 ideal; testosterone thickens the blood, and above about 52 the clotting and stroke risk rises, so this needs monitoring every few months while he continues. IGF-1 is 10.3 against a limit of 11.3, which poorly controlled diabetes lowers and which usually recovers with glucose control. This report does not tell him what to do about steroids. It does say that the combination of steroids with uncontrolled diabetes is what makes the cardiac and blood-thickness findings more serious than either would be alone, and that if he continues, it should be with medical supervision and regular monitoring of haematocrit, lipids, liver and kidney function. PSA at 0.76 is reassuring, since testosterone raises it, and hCG is undetectable.\n\nHis liver shows the metabolic strain that goes with the glucose: GGT at 56 is within the laboratory range but nearly double the ideal, ALT at 37 and AST at 35.6 are both above the 30 ideal, and GLDH at 6.0 is above ideal. Bilirubin, albumin and bile acids are all fine, so this is fat in the liver rather than damage, and oral steroids can add to it. Lipase at 63 sits just under its 65 limit; triglycerides at this level put the pancreas under strain, and any upper abdominal pain should be reported promptly. Ferritin is 27, within the laboratory range but well below the 50 to 200 ideal for a man, with transferrin saturation of 22.6 percent below ideal too. Low iron stores in a man need an explanation rather than just a supplement, and a GP would normally ask about the gut. Magnesium at 0.84 is a fraction below the ideal floor, which uncontrolled diabetes causes by losing magnesium in the urine, and low magnesium worsens insulin resistance in return.\n\nThe immune panel contains one finding to follow up and one that explains it. Anti-CCP, the most specific antibody for rheumatoid arthritis, is 18.3 against a limit of 17. Rheumatoid factor is negative, IL-17 is low, ANA is negative and he reports no joint symptoms, so this is a low positive rather than a diagnosis. ASO is 656 against a limit of 200, which means he has had a streptococcal infection within the last few months, noticed or not, and a recent strep infection is a recognised cause of a transient anti-CCP rise. The right response is a repeat in three months, and a rheumatology referral only if it stays positive or if he develops morning stiffness or swollen joints. IL-8 is high in range for the same reason. hsCRP at 1.13 is marginally above the 1.0 limit, which is lower than expected for his metabolic picture. The Epstein-Barr antibodies show a past infection, not a current one.\n\nThe remaining findings are minor. Platelets at 145 are marginally below the 150 limit and MCHC at 319 marginally below its limit; the sample arrived outside its stability window, which lowers both, so a repeat rather than concern. Red cell folate at 1405 is above range, which is harmless and usually a supplement. Vitamin D at 119, B12 at 690, zinc and copper are all excellent, and the thyroid is working well with negative antibodies. Every cancer screening marker is within range, including the prostate risk score at decreased risk. Kidney injury marker NGAL is normal, so the kidney picture is chronic strain rather than an acute insult.\n\nConnecting the symptoms to the results: fatigue, brain fog and low mood with a HOMA-IR of 16.6 and a fasting glucose of 12 do not need another explanation. Cells that cannot take up glucose are cells running short of fuel, and the swings that follow a glucose of 12 feel exactly like fog and flatness. The raised oestradiol from the testosterone adds to the mood side, and the low iron stores and low magnesium each take a little more off his energy. The thyroid, B12, vitamin D and cortisol are all healthy and can be set aside. This is one of the clearer symptom-to-result pictures we see, and it means the fix is also clear.","links":"Everything on this panel that needs attention runs back to one process: diabetes that is not currently controlled, in a body that has become severely resistant to its own insulin. A HOMA-IR of 16.6, a fasting insulin of 214 and a C-peptide of 5.50 describe a pancreas working flat out against cells that have stopped listening; the HbA1c of 69.4, the fructosamine of 484 and the glucose in his urine describe the result. The triglycerides of 3.86 and the HDL of 0.71 are what that glucose does to fat metabolism, the GGT of 56 and the ALT of 37 are what it does to the liver, the adiponectin of 0.93 is what visceral fat does to insulin sensitivity, and the fatigue, fog and low mood are what all of it feels like from the inside.\n\nThe kidneys are where the damage has started to show. Creatinine 107.5, cystatin C 1.18, an eGFR of 74, an albumin to creatinine ratio at the 3.0 threshold and a homocysteine of 15.5 with perfect B vitamins all point the same way, and the bicarbonate of 18.8 is most likely the same story. Diabetic kidney strain at this stage reverses with glucose and blood pressure control. That is why the timing in this report is \"this week\" rather than \"when convenient\".\n\nThe cardiac markers are the reason for the ECG. FABP-3 above range, troponin T high in its range and myoglobin at its ceiling, in a man with uncontrolled diabetes, an HDL of 0.71 and a testosterone of 60.6, is a pattern to check rather than reassure. CK-MB being normal and kidney impairment inflating FABP-3 are both real caveats, and a normal ECG with a repeat troponin would settle it.\n\nThe anabolic steroid use sits across all of this. It explains the hormone panel exactly, and it worsens the three things that matter most here: it lowers HDL, it thickens the blood (haematocrit 50.4 and climbing towards the 52 line), and it adds strain to a heart and a set of kidneys already under pressure from the glucose. His fertility axis is fully suppressed while he uses it. This report takes no position on whether he continues, but it does say that continuing without medical supervision and without regular haematocrit, lipid, liver and kidney monitoring is where the risk lies.\n\nWhat has been excluded is worth stating. His thyroid is normal with negative antibodies. His B12, active B12, folate, vitamin D and zinc are excellent. His ApoB and Lp(a) mean his cholesterol risk is not inherited and his particle number is fine. Every cancer screening marker, including PSA and the prostate risk score, is normal. Coeliac disease, H. pylori, lupus and pernicious anaemia are all negative. The Epstein-Barr infection is in the past. The two loose ends are the low-positive anti-CCP, which a recent strep infection can explain and a three-month repeat will settle, and the low ferritin in a man, which a GP should ask about rather than simply top up.","lifestyle":"Start with the honest picture: a diet rated 7 out of 10 is not the problem here, and neither is willpower. The problem is that his cells have become almost deaf to insulin, and the two levers that reverse that fastest are movement and the type of carbohydrate he eats. Nothing below is a diet plan; each habit attaches to something he already does, and each one moves the numbers in this report.\nWalk for fifteen minutes straight after every meal, starting with the biggest one today. Anchor: plate in the sink, shoes on, out of the door. Why: muscle takes up glucose without insulin when it is moving, and a walk after eating flattens the glucose spike that a fasting reading of 12 is built from. Three short walks a day also take his steps from under 5,000 towards 10,000 without a gym.\nTwo twenty-minute resistance sessions a week, bodyweight or dumbbells, the same two days every week. Anchor: after the post-lunch walk on those days. Why: muscle is where insulin does its work, and he has a lot of it. Training it is the single most effective thing he can do for a HOMA-IR of 16.6, and it raises HDL from 0.71 more reliably than any food change.\nPut a palm-sized portion of protein on the plate first at every meal, before anything else. Eggs at breakfast, meat, fish, Greek yoghurt or beans later. Anchor: protein goes on the plate before the carbohydrate, every time. Why: protein first slows the glucose rise from the rest of the meal, and it protects muscle while he loses fat.\nSwap one white carbohydrate for a slow one, one meal at a time, starting with breakfast this week: oats instead of cereal or toast, then potatoes with skins, wholegrain rice or lentils at dinner the week after. Anchor: change breakfast only until it is automatic. Why: the same carbohydrate in a slower form produces a smaller insulin response, which is what his pancreas needs.\nMake sugary drinks, juice and alcohol a weekend-only thing, and put water where they used to be. Anchor: fill a bottle when he makes his morning coffee. Why: liquid sugar goes straight to a glucose of 12 and to triglycerides of 3.86, and alcohol pushes triglycerides and GGT further.\nBring the vape into the plan rather than treating it as separate: set a fixed number of sessions a day and drop one every two weeks. Anchor: no vape until after the post-meal walk. Why: nicotine raises glucose and constricts blood vessels, and with his cardiac and kidney markers it is working against everything else here.\nFix the wake time seven days a week and get outside within an hour of waking. Anchor: alarm, then out with the water bottle. Why: poor and irregular sleep raises morning glucose and cortisol, and consistent sleep is one of the quieter levers on insulin resistance and mood.","flags":"Fasting glucose 12.1 (range 4 to 7), HbA1c 69.4 mmol/mol (limit 42), fructosamine 484 (range 151 to 300), fasting insulin 214 pmol/L (range 17.8 to 173), C-peptide 5.50 (range 1.1 to 4.4), HOMA-IR 16.6 (limit 2), adiponectin 0.93 (range 1.44 to 7.27), urine glucose 100 mg/dl. Type 2 diabetes, known, currently uncontrolled, with severe insulin resistance and preserved beta-cell output. GP review of treatment this week.\nCreatinine 107.5 (range 64 to 104), cystatin C 1.18 (range 0.57 to 1.05), eGFR 74 (ideal 90 or above), urine ACR 3.4 (ideal below 2.5, threshold 3.0), homocysteine 15.5 (ideal below 9) with normal B12 and folate. Early diabetic kidney strain; cystatin C confirms it is not a muscle-mass artefact. Blood pressure check, repeat renal profile and ACR.\nBicarbonate 18.8 (range 20 to 31) with urine ketones negative and calculated anion gap modestly raised. Not ketoacidosis; most likely reduced renal filtration. Repeat with a venous blood gas at the GP review.\nFABP-3 5.49 (limit 4.84), troponin T 11.1 (limit 14, ideal below 6), myoglobin 68.6 (limit 72), CK-MB 1.99 normal. Three cardiac muscle markers high together in a diabetic man with HDL 0.71 and exogenous testosterone. ECG and repeat troponin; FABP-3 may be partly renal. Chest pain, breathlessness or palpitations: same-day care.\nHDL 0.71 (limit 1.55), triglycerides 3.86 (limit 2.3), total to HDL ratio 5.59 (limit 5.0). Diabetic dyslipidaemia worsened by anabolic steroids. LDL 1.51, ApoB 76 mg/dl and Lp(a) undetectable are all favourable, so the risk sits in the triglyceride-rich particles. Cardiovascular Risk Score high.\nTestosterone 60.6 (range 8.64 to 29), free testosterone 1.606 (range 0.148 to 0.569), FSH below 0.30 (range 1.5 to 12.4), LH 0.4 (range 1.7 to 8.6), oestradiol 170 (range 41.4 to 159). Exogenous testosterone or anabolic steroid use, declared. Full suppression of the hypothalamic-pituitary-testicular axis; fertility suppressed while in use. Haematocrit 50.4 percent (ideal below 49): monitor every three months while use continues, and act above 52.\nIGF-1 10.3 (range 11.3 to 28). Lowered by poorly controlled glucose; repeat after glucose control improves rather than investigate now.\nAnti-CCP 18.3 (limit 17) with rheumatoid factor negative, ANA negative, IL-17A and 17F low, no joint symptoms reported. Low positive. ASO 656 (limit 200) shows a recent streptococcal infection, a recognised cause of transient anti-CCP rise. Repeat anti-CCP in three months; rheumatology referral only if persistent or symptomatic.\nGGT 56 (ideal 10 to 30), ALT 37 (ideal below 30), AST 35.6 (ideal below 30), GLDH 6.0 (ideal below 5), LDH 400 (ideal below 380). Metabolic fatty liver pattern with bilirubin, albumin and bile acids normal. Lipase 63 (limit 65) high in range with triglycerides 3.86; repeat once triglycerides fall, report any upper abdominal pain.\nFerritin 27 (ideal 50 to 200 for a man), transferrin saturation 22.6 percent (ideal 25 to 45). Iron stores low for a man without anaemia. GP to consider cause, including gut, before supplementing.\nMagnesium 0.84 (ideal 0.85 to 1.05). Urinary magnesium loss from uncontrolled glucose; replace.\nhsCRP 1.13 (limit 1.0), IL-8 190.6 (ideal below 60), HB-EGF 134.4 (limit 136), IgA 4.14 (limit 4.5). Mild inflammatory and vascular stress signals consistent with the recent strep infection, vaping and the metabolic picture.\nPlatelets 145 (limit 150), MCHC 319 (limit 320). Sample received outside stability time, which lowers both. Repeat with the next blood test.\nRed cell folate 1405 (limit 1257). Harmless; supplement or fortified intake. B12 690 and active B12 129 are excellent.\nEpstein-Barr EBNA IgG and VCA IgG positive, VCA IgM negative: past infection, not active.\nReassuring negatives: thyroid normal with both antibodies negative; ApoB 76 mg/dl ideal and Lp(a) undetectable; every cancer screening marker within range including PSA 0.76 and prostate risk score at decreased risk; hCG undetectable; coeliac, H. pylori, ANA, intrinsic factor and parietal cell antibodies negative; vitamin D 119, B12 690, zinc 16.4 all excellent; NGAL normal so no acute kidney injury; urine ketones, protein, blood and white cells negative.\nNot returned by the laboratory: D-dimer (sample stability), leptin, resistin, IL-6, TNF-alpha, pepsinogens I and II, gastrin-17, thyroxine-binding globulin, cystatin C (urine), NGAL (urine), KIM-1, the FABP 4 to 9 series, the cytokine autoantibody series and a further set of interleukins and adhesion molecules. IL-6 and leptin would have added to the insulin resistance picture and are worth requesting next time. PhenoAge calculated with an assumed RDW of 13 percent because Randox does not report it.","recommendations":"Book a GP appointment this week and bring this report. The reasons in order: HbA1c 69.4 with fasting glucose 12.1 and HOMA-IR 16.6 (diabetes treatment needs reviewing, including whether he is on metformin, an SGLT2 inhibitor or a GLP-1, all of which also protect the kidneys and heart); cystatin C 1.18 with creatinine 107.5 and ACR 3.4 (early diabetic kidney strain, blood pressure and repeat renal profile); bicarbonate 18.8 (venous blood gas).\nAsk for an ECG and a repeat troponin, given FABP-3 5.49, troponin T 11.1 and myoglobin 68.6 together. If chest pain, breathlessness or palpitations occur before then, seek same-day care rather than waiting.\nTell the GP about the testosterone or anabolic steroid use, with the numbers: testosterone 60.6, FSH and LH suppressed, oestradiol 170, haematocrit 50.4. Whatever he decides about continuing, haematocrit, lipids, liver and kidney function should be monitored every three months while he does, and the GP should know when advising on the heart and kidney results.\nRepeat anti-CCP in three months. It is 18.3 against a limit of 17 with a negative rheumatoid factor and a recent streptococcal infection (ASO 656), so a transient rise is likely. Rheumatology referral only if it persists or joints become stiff or swollen.\nAsk the GP about the ferritin of 27. Low iron stores in a man without anaemia usually get a cause found before a supplement is started; diet, absorption and the gut are the usual questions.\nRecheck lipase and liver enzymes once triglycerides have come down, and report any upper abdominal pain promptly.\nTargets: about 2,300 calories a day with 150 grams of protein and 30 grams of fibre built up over a few weeks, aiming for 108 kg then 100 kg. Retest in three months. The markers that will show the plan is working, in the order they move: fasting glucose, triglycerides, GGT, HDL, HbA1c, then cystatin C and ACR.","supplementation":"Magnesium glycinate 300 to 400 mg in the evening. His magnesium at 0.84 is just below the ideal floor, uncontrolled glucose loses magnesium in the urine, and magnesium improves insulin sensitivity and sleep.\nOmega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily, with a meal. At this dose omega-3 lowers triglycerides meaningfully, and his are 3.86.\nVitamin D3: no supplement needed. At 119 he is at the top of the ideal range; if he already takes one, reduce it and recheck in six months.\nBerberine 500 mg twice daily with meals is an evidence-based option for insulin resistance at this level, but it interacts with diabetes medication and must be cleared with his GP first, ideally at the same review as the treatment change.\nIron: do not start a supplement yet. Ferritin 27 is low for a man and the GP should look for a cause first; an iron bisglycinate 25 mg every other day can follow once that conversation has happened.\nDo not take a multivitamin containing folate; red cell folate is already above range. B12, zinc and copper need nothing.\nThe most important changes are not supplements. They are a GP treatment review this week, a walk after every meal, two resistance sessions a week, protein first at every meal, and slower carbohydrate.","biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3636","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 40 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 40.4; held to 40 by HbA1c 64 or above. Weakest systems: glucose & insulin 8%, hormones 19%, immunology 21%. Biggest drags: Glucose, HbA1c, Insulin, Fructosamine.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"58","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5686","lower_normal":"","upper_normal":"51","lower_optimal":"","upper_optimal":"46","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4510","units":"years","description":"PhenoAge is a biological age estimated from nine blood markers (Levine 2018). Randox does not report red cell distribution width, so a typical value of 13 percent was assumed for that input. It sits above his calendar age of 46, pulled up by the glucose, the creatinine and the CRP, and it will fall as glucose control improves.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, with no age term; 20 or below is ideal. At 95 it is high, driven by HDL 0.71, triglycerides 3.86 and HbA1c 69.4, while ApoB 76 mg/dl and undetectable Lp(a) pull it down. At 46 with early kidney strain and raised cardiac markers, this score and his real risk are closer together than they would be for a younger man.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Glucose","group":"GLUCOSE & INSULIN","units":"mmol/l","description":"Fasting glucose is the sugar in the blood before eating. At 12.1 it is well above the 7.0 limit and nearly three times the ideal ceiling. This is not borderline: it is the fasting glucose of diabetes that is not currently controlled, and every other metabolic result on the panel follows from it.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"12.10","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"4","upper_normal":"7","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4889","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","units":"mmol/mol","description":"HbA1c is average blood sugar over the past three months. At 69.4 mmol/mol it is far above the 42 limit; in the older units it is about 8.5 percent. Diabetes is usually considered well controlled below 53, and at this level the risk of damage to the kidneys, eyes, nerves and arteries accumulates year on year. Bringing this down is the single most important thing in the report, and it is entirely possible.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"69.40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8262","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"38","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4524","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","units":"pmol/l","description":"Fasting insulin is the hormone that moves sugar out of the blood. At 214 pmol/L it is above the 173 limit and roughly four times the ideal. High insulin next to high glucose means the pancreas is still working hard but the body has stopped responding, which is insulin resistance at an advanced stage. Anabolic steroids and abdominal fat both worsen it.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"214.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7547","lower_normal":"17.8","upper_normal":"173","lower_optimal":"14","upper_optimal":"56","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3252","upper_optimal_position":"0.4154","range_type":"normal"},{"key":"nonesterifiedfattyacids","name":"Non-Esterified Fatty Acids","group":"GLUCOSE & INSULIN","units":"mmol/l","description":"NEFA are free fatty acids released from fat stores. At 0.74 they are within range but above the ideal, consistent with insulin no longer suppressing fat release.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"0.740","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4111","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3333","range_type":"no lower"},{"key":"cpeptide","name":"C-peptide","group":"GLUCOSE & INSULIN","units":"ng/ml","description":"C-peptide is released with insulin and shows how hard the pancreas is working. At 5.50 it is above the 4.4 limit, confirming the insulin: the pancreas has not failed, it is over-producing against resistance. That is good news in one sense, because a pancreas that still produces this much insulin responds well when the resistance is reduced.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"5.50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7778","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4747","range_type":"normal"},{"key":"fructosamine","name":"Fructosamine","group":"GLUCOSE & INSULIN","units":"umol/l","description":"Fructosamine reflects average blood sugar over the past two to three weeks. At 484 it is well above the 300 limit and agrees with the HbA1c that control has been poor recently, not just over the summer.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"484","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"151","upper_normal":"300","lower_optimal":"151","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5548","range_type":"normal"},{"key":"adiponectin","name":"Adiponectin","group":"GLUCOSE & INSULIN","units":"ug/ml","description":"Adiponectin is a hormone made by fat tissue that keeps the body sensitive to insulin. At 0.93 it is below the 1.44 limit and a long way below ideal. It falls as visceral fat rises and as insulin resistance deepens, and anabolic steroids suppress it further. It rises with weight loss and exercise.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"0.93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3042","lower_normal":"1.44","upper_normal":"7.27","lower_optimal":"4","upper_optimal":"7.27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4797","upper_optimal_position":"0.6667","range_type":"normal"},{"key":"metabolicassessment","name":"Metabolic Assessment","group":"GLUCOSE & INSULIN","units":"","description":"Glucose 12.1, HbA1c 69.4, fructosamine 484, insulin 214, C-peptide 5.50, HOMA-IR 16.6, adiponectin 0.93, glucose in urine. Severe insulin resistance with preserved insulin output. The central finding.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"Uncontrolled type 2 diabetes","within_normal":"FALSE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"10.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7786","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Average glucose estimated from HbA1c, about 11 mmol/L. Confirms that blood sugar sits far above the ideal most of the time.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"10.53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5983","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines triglycerides and glucose as a marker of insulin resistance. Well above ideal, agreeing with HOMA-IR.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"16.57","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"2.5","lower_optimal":"","upper_optimal":"1.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"ratio","description":"HOMA-IR estimates insulin resistance from fasting glucose and insulin together. At 16.6, against a limit of 2 and an ideal below 1.5, it is among the highest values we see. It is the clearest single statement on the panel of why he feels tired, foggy and low, and it is the number that will fall fastest when the plan takes hold.","low_causes":"","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homab","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"72","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3619","lower_normal":"60","upper_normal":"200","lower_optimal":"80","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"%","description":"HOMA-B estimates how hard the insulin-producing cells are working. Far above range: the pancreas is compensating heavily, which is why this picture responds well when resistance is reduced.","low_causes":"Beta cell exhaustion","high_causes":"Compensation for insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucoseinsulinratio","name":"Glucose:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"7.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7889","lower_normal":"4.5","upper_normal":"","lower_optimal":"7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7778","upper_optimal_position":"1.0000","units":"mg/dL per mIU/L","description":"The glucose to insulin ratio, in mg/dL per mIU/L. At 7.1 it is above the 4.5 limit only because the glucose itself is so high; it should not be read as reassurance.","low_causes":"Insulin resistance","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"adiponectininsulinratio","name":"Adiponectin:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"0.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0500","lower_normal":"0.3","upper_normal":"","lower_optimal":"0.7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"1.0000","upper_optimal_position":"1.0000","units":"ratio","description":"The adiponectin to insulin ratio. At 0.03 it is far below the 0.3 limit: very low adiponectin against very high insulin.","low_causes":"Low adiponectin with high insulin, metabolically unhealthy weight","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"microalbumincreatinineratio","name":"Microalbumin / Creatinine Ratio","group":"KIDNEY FUNCTION","units":"mg/mmol","description":"The urine albumin to creatinine ratio detects the earliest leak of protein through the kidney filters. At 3.4 it is within the laboratory range but above the 2.5 ideal and at the threshold of 3.0 where early diabetic kidney damage is defined. With creatinine and cystatin C both above range, this is the third signal pointing the same way. It is early and it is reversible with glucose and blood pressure control, but only if it is acted on.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.0567","lower_normal":"","upper_normal":"30","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.0417","range_type":"no lower"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","units":"umol/l","description":"Creatinine is a muscle waste product cleared by the kidneys. At 107.5 it is above the 104 limit. In a 197 cm man with a lot of muscle, creatinine runs high naturally, which is why cystatin C matters more here.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"107.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6958","lower_normal":"64","upper_normal":"104","lower_optimal":"64","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6333","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","units":"mg/l","description":"Cystatin C is a filtration marker unaffected by muscle mass, so it is the fairest kidney test for a large, muscular man. At 1.18 it is above the 1.05 limit. This is the result that confirms the kidneys are filtering below where they should at 46, and with diabetes at this level of control the most likely cause is early diabetic kidney strain. Testosterone and steroid use, high protein intake and dehydration can each add a little.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"1.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7569","lower_normal":"0.57","upper_normal":"1.05","lower_optimal":"0.57","upper_optimal":"0.95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","range_type":"normal"},{"key":"beta2microglobulin","name":"Beta-2-Microglobulin","group":"KIDNEY FUNCTION","units":"mg/l","description":"Beta-2-microglobulin is cleared by the kidneys and rises with immune activation. At 2.50 it is within the laboratory range but above the ideal, in step with the other kidney results.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"2.50","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5873","lower_normal":"0.9","upper_normal":"3","lower_optimal":"0.9","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5079","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","units":"mmol/l","description":"Urea is a protein waste product cleared by the kidneys. At 7.69 it is within the laboratory range but above the ideal, consistent with a high protein intake and kidneys under some strain.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"7.69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6597","lower_normal":"2.5","upper_normal":"7.8","lower_optimal":"3","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3648","upper_optimal_position":"0.5849","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","units":"umol/l","description":"Uric acid rises with insulin resistance, fructose and alcohol. At 327 it is within the ideal range, which is a pleasant surprise given the glucose picture.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"327.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5175","lower_normal":"200","upper_normal":"430","lower_optimal":"200","upper_optimal":"360","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5652","range_type":"normal"},{"key":"neutrophilgelatinaseassociatedli","name":"Neutrophil Gelatinase-Associated Lipocalin (NGAL)","group":"KIDNEY FUNCTION","units":"ng/ml","description":"NGAL rises with acute kidney injury. At 1212 it is within the laboratory range, so there is no sudden kidney insult on top of the chronic picture.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"1212.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5897","lower_normal":"515.9","upper_normal":"1421.5","lower_optimal":"515.9","upper_optimal":"1421.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","range_type":"normal"},{"key":"kidneyassessment","name":"Kidney Assessment","group":"KIDNEY FUNCTION","units":"","description":"Cystatin C 1.18 and creatinine 107.5 above range, eGFR 74, ACR 3.4 at the 3.0 threshold, homocysteine 15.5, bicarbonate 18.8. NGAL normal, so chronic strain rather than acute injury. GP this week; reversible at this stage.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"Early diabetic strain","within_normal":"FALSE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"kim1","name":"Kidney Injury Molecule-1 (KIM-1)","group":"KIDNEY FUNCTION","units":"","description":"Kidney Injury Molecule-1 (KIM-1) is part of the Signature panel but was reported by Randox as not available on this sample. NGAL was returned and is normal, which covers the acute kidney injury question.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"Not returned","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"egfrcreatinine","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","units":"ml/min/1.73m2","description":"eGFR from creatinine alone, as reported by Randox. At 74 it is above the 60 limit but below the 90 ideal for 46; cystatin C confirms the reduction is real.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"","range_type":"no upper"},{"key":"egfrcystatin","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR estimated from cystatin C, unaffected by muscle mass. Below the 90 ideal, confirming the kidney strain is real rather than a muscle artefact.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"71","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5917","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR combining creatinine and cystatin C, the most accurate estimate available. Below ideal for 46.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"71.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps separate hydration and diet from kidney disease. Within the expected range, pointing to filtration rather than dehydration.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinekinasemb","name":"Creatine Kinase-MB (CK-MB)","group":"CARDIAC MARKERS","units":"ug/l","description":"CK-MB is the heart-muscle form of creatine kinase. At 1.99 it is within range and within ideal, which is reassuring against the FABP-3 result.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"1.989","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1622","lower_normal":"","upper_normal":"6.13","lower_optimal":"","upper_optimal":"6.13","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.5000","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","units":"IU/L","description":"Creatine kinase leaks from muscle after exertion or damage. At 118 it is within the ideal range.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"118","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4262","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","range_type":"normal"},{"key":"myoglobin","name":"Myoglobin","group":"CARDIAC MARKERS","units":"ug/l","description":"Myoglobin is released from damaged muscle, heart or skeletal. At 68.6 it is within the laboratory range but close to the 72 limit and above the ideal. Taken with the FABP-3 and troponin below, three muscle-injury markers sit high at once, and that pattern deserves a GP review rather than being explained away.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"68.64","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4767","lower_normal":"","upper_normal":"72","lower_optimal":"","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3472","range_type":"no lower"},{"key":"troponint","name":"Troponin T","group":"CARDIAC MARKERS","units":"ng/l","description":"Troponin T is the most specific marker of heart muscle injury. At 11.1 it is below the 14 limit but well above the ideal, where a healthy heart sits under 6. A troponin in this zone in a 46-year-old with uncontrolled diabetes, very low HDL and testosterone use is not an emergency, but it is a clear reason for a GP appointment and an ECG in the coming days, and for a repeat troponin. Anyone with chest pain, breathlessness or palpitations should not wait for that appointment.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"11.10","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3964","lower_normal":"","upper_normal":"14","lower_optimal":"","upper_optimal":"6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2143","range_type":"no lower"},{"key":"fattyacidbindingprotein3","name":"Fatty Acid Binding Protein-3 (FABP-3)","group":"CARDIAC MARKERS","units":"ng/ml","description":"FABP-3 is released early when heart muscle is under strain. At 5.49 it is above the 4.84 limit. With troponin near its limit and myoglobin high in range, this is the finding that turns the cardiac markers from background into something to act on. It can also rise with kidney impairment, which he has, so the GP should read it alongside the creatinine and cystatin C.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"5.49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5671","lower_normal":"","upper_normal":"4.84","lower_optimal":"","upper_optimal":"4.84","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.5000","range_type":"no lower"},{"key":"haemolysisscreen","name":"Haemolysis Screen","group":"CARDIAC MARKERS","units":"","description":"Haptoglobin 0.74 within range, LDH 400 above ideal but explained by the sample delay and muscle turnover. No sign of red cells breaking down.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"Negative","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"cardiacrisk","name":"Cardiac Risk Assessment","group":"CARDIAC MARKERS","units":"","description":"FABP-3 5.49 above range, troponin T 11.1 high in range, myoglobin 68.6 at its ceiling, CK-MB normal. Not an emergency, but a pattern to check with an ECG and a repeat troponin this week. Chest pain, breathlessness or palpitations: same-day care.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"ECG and repeat troponin advised","within_normal":"FALSE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol particles. At 3.97 it is within the ideal range. On its own this looks reassuring; it is not, because the HDL and triglyceride results below show the real problem is the type of particle, not the amount.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"3.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3970","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"4.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4500","range_type":"no lower"},{"key":"ldlcholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","units":"mmol/l","description":"LDL is the cholesterol in the particles that deposit in artery walls. At 1.51 it is well within ideal. Low LDL with very high triglycerides is the classic pattern of diabetic dyslipidaemia, where the danger sits in triglyceride-rich particles that a standard LDL number does not capture.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"1.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2517","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4333","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","units":"mmol/l","description":"HDL is the protective cholesterol. At 0.71 it is well below the 1.55 limit and the 1.2 ideal for men. This is the single worst lipid result on the panel. Two things drive it down this far: insulin resistance, and anabolic steroids, which suppress HDL directly. Low HDL alongside high triglycerides multiplies cardiovascular risk more than a high LDL would.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"0.71","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2290","lower_normal":"1.55","upper_normal":"","lowe ove the 5.0 limit.","low_causes":"","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogeniccoefficient","name":"Atherogenic Coefficient","group":"LIPIDS & CARDIOVASCULAR","result":"4.59","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7650","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"ratio","description":"The atherogenic coefficient, non-HDL divided by HDL. At 4.59 it is above the 3.0 limit.","low_causes":"","high_causes":"Low HDL, high non-HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldlcholesterol","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8750","lower_normal":"","upper_normal":"1","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"mmol/L","description":"VLDL is estimated from triglycerides and carries them out of the liver. At 1.75 it is above the 1.0 limit, more than three times the ideal.","low_causes":"","high_causes":"Raised triglycerides, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldlhdlratio","name":"LDL:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3043","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2857","units":"ratio","description":"LDL divided by HDL. At 2.13 it is within range and just above ideal, held down by the low LDL.","low_causes":"","high_cause  blood, lowering HDL to 0.71, raising oestradiol, and, together with the diabetes, putting his heart under strain. If he is going to continue, it should be under medical supervision with regular blood monitoring.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"60.600","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"8.64","upper_normal":"29","lower_optimal":"18","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4866","upper_optimal_position":"0.6667","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","units":"pmol/l","description":"Oestradiol is the main oestrogen, produced in men by converting testosterone. At 170 it is above the 159 limit because there is so much testosterone to convert from. High oestradiol in men drives water retention, breast tissue growth and mood changes, and it may be contributing to the low mood he reports.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"170.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6978","lower_normal":"41.4","upper_normal":"159","lower_optimal":"60","upper_optimal":"130","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3861","upper_optimal_position":"0.5845","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","units":"nmol/l","description":"Progesterone in men is a minor hormone. At 0.24 it is within range.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"0.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2553","lower_normal":"","upper_normal":"0.47","lower_optimal":"","upper_optimal":"0.47","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.5000","range_type":"no lower"},{"key":"sexhormonebindingglobulin","nam const data = REPORT_DATA;
