sm, malignancy, excess vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6475","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.6034","units":"mmol/L","description":"Phosphate works alongside calcium in bone health and energy production. At 1.6, this is within the laboratory range of 0.78 to 1.65 but slightly above the optimal ceiling of 1.45. At this level this is not a concern and may reflect normal dietary variation or the timing of the blood draw relative to food intake. Phosphate and calcium are in balance, which is the key finding.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malabsorption, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excess dietary phosphate, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6093","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5195","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body including muscle contraction, nerve function, energy production, and sleep quality. At 1.01, this is within both the laboratory range and the optimal band of 0.85 to 1.05, showing good magnesium status. Given the training volume of seven sessions per week and the sleep quality concern, maintaining this level is important.","low_causes":"Poor dietary intake, alcohol, diuretics, malabsorption, excessive sweating","high_causes":"Kidney disease, excess supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the sodium result for the blood glucose level. At a glucose of 4.9, the correction is minimal and the result remains 140, confirming that the true sodium level is the same as the measured one. This is reported for context and is not applicable at present.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"290","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Serum osmolality estimates the concentration of dissolved particles in the blood, reflecting hydration status and kidney function. At 290, this sits comfortably within both the normal and optimal ranges, confirming healthy fluid balance.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product of protein metabolism filtered out by the kidneys. At 5.1, this is a healthy mid-range result, confirming the kidneys are effectively clearing protein waste. On a high-protein diet, urea can rise; this healthy level shows the kidneys are handling the protein load without strain.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5381","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3414","upper_optimal_position":"0.5122","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism filtered by the kidneys. At 74, this is within the laboratory range of 49 to 90. Creatinine is influenced by muscle mass and creatine supplementation, both of which are relevant here. The slightly higher reading is likely influenced by the creatine supplement and resistance training rather than any kidney concern, which is confirmed by the normal cystatin C and urea.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6667","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"The estimated glomerular filtration rate measures how well the kidneys filter waste from the blood. The creatinine-based eGFR is above 90, which is in the optimal range for kidney function. This confirms healthy kidneys despite the creatinine being slightly above the optimal band, which as noted above is likely due to creatine supplementation.","low_causes":"Kidney disease, dehydration, age-related decline, certain medications","high_causes":"Normal finding in young healthy adults, early diabetic nephropathy (hyperfiltration)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcystatinc","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"The cystatin C-based eGFR provides a second measure of kidney filtration that is less influenced by muscle mass and creatine supplementation than the creatinine-based version. At 85, this is within the normal range above 60 but below the optimal threshold of 90. The difference between the creatinine eGFR above 90 and the cystatin C eGFR of 85 is likely partly due to the creatine supplementation pushing creatinine slightly higher, making the creatinine-based estimate slightly more generous. At 30 years old with no other kidney concerns, this is a borderline result that most likely reflects normal variation and is worth monitoring at the next test.","low_causes":"Kidney disease, dehydration, inflammation, thyroid dysfunction","high_causes":"Normal in young healthy adults","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4773","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a protein produced by all cells in the body and cleared by the kidneys, making it a useful marker of kidney function that is not affected by muscle mass or creatine supplements. At 1.05, this is within the laboratory range below 1.1 but above the optimal ceiling of 0.9. This is consistent with the cystatin C-based eGFR of 85 and is worth monitoring at the next test, though at 30 years old with no other kidney markers of concern it is not alarming.","low_causes":"Normal finding","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"351","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5310","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3048","upper_optimal_position":"0.5524","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines found in certain foods and produced by the body. At 351, this is within the laboratory range of 184 to 464 but above the optimal ceiling of 320 for women. Mildly elevated uric acid can be associated with insulin resistance, which is present here, and with higher BMI. It is not at a level that causes gout but it may come down naturally as insulin sensitivity improves and body fat reduces.","low_causes":"Low purine diet, Wilson's disease, Fanconi syndrome","high_causes":"High purine diet, insulin resistance, obesity, kidney disease, alcohol, dehydration, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7083","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and cystatin C to give the most accurate estimate of kidney filtration. At 85, this is within the normal range above 60 but below the optimal threshold of 90. The creatine supplementation may be influencing both the creatinine level and the cystatin C slightly, making this estimate slightly conservative. At 30 years old with no proteinuria, no haematuria, and no risk factors for kidney disease, this is a borderline result to monitor rather than investigate.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Normal in young healthy adults","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"68.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4939","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between causes of elevated urea or creatinine. At 68.9, this is within both the normal and optimal ranges, confirming the kidney markers are in proportion and there is no sign of dehydration, upper GI bleeding, or protein excess overwhelming the kidneys.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4400","upper_optimal_position":"0.6400","units":"g/L","description":"Total protein measures all the protein in the blood, including albumin made by the liver and globulins made by the immune system. At 80, this is within both normal and optimal ranges, confirming healthy protein production by both the liver and the immune system.","low_causes":"Liver disease, kidney disease, malnutrition, malabsorption","high_causes":"Dehydration, chronic infection, autoimmune disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It maintains fluid balance, transports hormones and nutrients, and is a reliable marker of liver function and nutritional status. At 46, this is within both normal and optimal ranges, confirming excellent liver synthetic function and good nutritional health.","low_causes":"Liver disease, kidney disease, inflammation, malnutrition","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE" cation effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0974","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2434","units":"score","description":"The FIB-4 score estimates liver fibrosis (scarring) using age, AST, ALT, and platelets. At 0.52, this is well within both the normal and optimal ranges, confirming there is no liver scarring. This is an excellent result that rules out significant liver disease.","low_causes":"Healthy liver with no fibrosis","high_causes":"Liver fibrosis, cirrhosis, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.172","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0573","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"The APRI score estimates liver fibrosis using AST and platelet count. At 0.172, this is well within both the normal and optimal ranges, confirming there is no liver scarring. Combined with the FIB-4, this gives high confidence that the liver is structurally healthy.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-3.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3818","lower_normal":"-4","upper_normal":"0.676","lower_optimal":"-4","upper_optimal":"-1.455","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5148","units":"score","description":"The NAFLD fibrosis score estimates the likelihood of advanced fibrosis in non-alcoholic fatty liver disease using age, BMI, diabetes status, ALT, AST, platelets, and albumin. At negative 3.32, this is within the optimal range below negative 1.455, which confidently rules out advanced fibrosis. This is an excellent result given the BMI of 28.7 and the insulin resistance, and means the liver has not developed any structural damage from the metabolic stress.","low_causes":"Healthy liver with no fibrosis","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"1.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The De Ritis ratio compares AST to ALT to help differentiate between causes of liver enzyme elevation. At 1.19, this is within both normal and optimal ranges. Both enzymes are healthy, so the ratio is academic here, but it confirms there is no pattern suggesting alcohol-related liver damage or muscle breakdown.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4318","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is an  than the breakdown: the HDL is healthy at 1.5 and the triglycerides excellent at 0.89, so the slightly elevated total is driven primarily by the LDL at 3.13.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet, genetic factors, hypothyroidism, insulin resistance, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2618","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood, largely influenced by carbohydrate intake, alcohol, and body composition. At 0.89, this is an excellent result within both the normal range below 1.7 and the optimal range below 1.0. This reflects the benefit of the low-carb diet and is a genuine positive that shows carbohydrate metabolism at the dietary level is well controlled, even though insulin resistance is present.","low_causes":"Very low fat or carbohydrate diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate or alcohol intake, insulin resistance, obesity, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2564","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL carries triglycerides from the liver to the tissues. At 0.4, this is well within both normal and optimal ranges, consistent with the e the optimal ceiling of 2.6. This is a mild elevation that could be influenced by two factors: the early thyroid autoimmune process (subclinical hypothyroidism slows LDL receptor activity, meaning less LDL is cleared from the blood) and the insulin resistance. Given the excellent triglycerides, healthy HDL, low Lp(a), and favourable ApoB/ApoA1 ratio, this is a borderline finding that should respond to the dietary and body composition changes in the plan, with a retest in four to six months.","low_causes":"Hyperthyroidism, malabsorption, severe liver disease, very low fat diet","high_causes":"Dietary saturated fat, genetic factors, hypothyroidism, insulin resistance, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3700","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a simple summary of cardiovascular risk. At 3.33, this is within both the normal range below 4.5 and the optimal range below 3.5, indicating the balance between total and protective cholesterol is favourable.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, high total cholesterol, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol includes all the potentially harmful cholesterol particles: LDL, VLDL, and remnant cholesterol. At 3.5, this is within the laboratory range below 4 but above the optimal ceiling of 3.0. This is consistent with the marginally elevated LDL and is the number the lifestyle changes are targeting to bring down.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption","high_causes":"Diet, genetic factors, hypothyroidism, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5571","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the structural protein of HDL particles. It is a more accurate measure of protective cholesterol than HDL cholesterol alone. At 1.56, this is above both the desirable threshold of 1.4 and the optimal floor of 1.5, confirming good HDL function and healthy reverse cholesterol transport.","low_causes":"Low HDL, insulin resistance, obesity, smoking, sedentary lifestyle","high_causes":"Exercise, moderate alcohol, genetic factors, healthy body composition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4944","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein carried by every LDL particle, meaning the ApoB number effectively counts how many atherogenic (artery-damaging) particles are in the blood. It is a more accurate predictor of cardiovascular risk than LDL cholesterol alone. At 0.89, this is just below the desirable threshold of 0.9 but above the optimal ceiling of 0.8. This is a borderline result that, combined with the marginally elevated LDL, confirms there is a modestly elevated particle count. Given the low Lp(a) and the excellent ApoB/ApoA1 ratio of 0.57, the overall atherogenic risk is manageable and should improve with the dietary changes and body composition goals.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption","high_causes":"High saturated fat diet, genetic factors, hypothyroidism, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aporatio","name":"ApoB/ApoA1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio is the single best summary measure of the balance between harmful and protective cholesterol particles. At 0.57, this is within the lower-risk band below 0.6. This means the number of protective particles relative to harmful ones is favourable, and the overall atherogenic balance is good despite the individual LDL and ApoB being borderline.","low_causes":"Excellent lipid balance, high HDL, low LDL","high_causes":"High LDL particle count, low HDL, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"26.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4186","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically inherited lipoprotein that adds cardiovascular risk independently of lifestyle. Unlike LDL, it cannot be changed with diet or exercise. At 26.79, this is below the ideal threshold of 32, which is genuinely useful information given the family history of heart attack and stroke before 60. It means the slightly elevated LDL and ApoB are driven entirely by modifiable factors rather than inherited Lp(a), so the dietary and body composition changes will be fully effective at reducing the risk.","low_causes":"Genetic (inherited, not modifiable)","high_causes":"Genetic (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2313","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is what remains after subtracting HDL and LDL from total cholesterol. It represents the cholesterol carried by triglyceride-rich particles and is an independent cardiovascular risk factor. At 0.37, this is within both the normal and optimal ranges, reflecting the excellent triglyceride level and good carbohydrate metabolism.","low_causes":"Healthy lipid metabolism, low triglycerides","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"TG:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1967","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is a strong marker of insulin resistance and cardiovascular risk. At 0.59, this is within both the normal range below 1.5 and the optimal range below 0.87. This is an excellent result and one of the most positive findings in the lipid profile, showing that despite the insulin resistance measured by HOMA-IR, the lipid-metabolic picture is favourable. The low-carb diet deserves credit for this.","low_causes":"Excellent insulin sensitivity, healthy diet, high HDL","high_causes":"Insulin resistance, high carbohydrate diet, metabolic syndrome, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"3.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5067","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL subtracts the cholesterol contribution of Lp(a) from the total LDL, leaving only the modifiable LDL that responds to diet and lifestyle. At 3.04, this is marginally above the 3.0 threshold, confirming that almost all of the LDL is modifiable. With the Lp(a) at 26.79 contributing only a small amount of cholesterol to the LDL total, the dietary and body composition changes should be effective at bringing the true LDL into range.","low_causes":"Low LDL, low Lp(a)","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.227","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5463","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The atherogenic index of plasma is calculated from triglycerides and HDL and predicts the size of LDL particles. A negative value suggests larger, less harmful LDL particles. At negative 0.227, this is within both normal and optimal ranges, indicating the LDL particles are likely a healthy size despite the mildly elevated LDL number. This is a reassuring finding.","low_causes":"High HDL, low triglycerides, large LDL particles","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"2.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2986","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The Castelli II ratio compares LDL to HDL, providing a simple measure of the balance between harmful and protective cholesterol. At 2.09, this is within both the normal range below 3.5 and the optimal range below 2.5, confirming a favourable balance.","low_causes":"High HDL, low LDL","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3200","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for bone health, immune regulation, mood, and muscle function. At 48, this falls in the insufficient band between 30 and 50, below the sufficient threshold of 50 and well below the optimal range of 75 to 120. Vitamin D plays a role in immune regulation, and there is evidence that adequate levels may help modulate autoimmune processes including the Hashimoto's pattern seen in this report. At a BMI of 28.7, fat tissue sequesters vitamin D, meaning she needs a higher supplementation dose than a lean person to reach the same blood level. With a family history of osteoporosis, maintaining vitamin D above 75 is especially important for long-term bone health.","low_causes":"Insufficient sun exposure, low dietary intake, obesity (fat sequesters vitamin D), malabsorption, dark skin","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.792","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4883","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3922","upper_optimal_position":"0.6039","units":"pmol/L","description":"Parathyroid hormone regulates calcium and phosphate levels in the blood by controlling how much calcium is absorbed from food, released from bones, and retained by the kidneys. At 1.792, this is within both normal and optimal ranges, confirming the parathyroid glands are functioning well. Despite the insufficient vitamin D, PTH has not risen to compensate, which is reassuring and suggests the vitamin D insufficiency is relatively mild and recent.","low_causes":"Excess calcium, excess vitamin D, magnesium deficiency, hypoparathyroidism","high_causes":"Low calcium, low vitamin D, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"416","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4276","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4561","upper_optimal_position":"0.5866","units":"pg/mL","description":"Vitamin B12 is essential for red blood cell production, nerve function, DNA synthesis, and energy metabolism. At 416, this is within the laboratory range of 193 to 982 but below the optimal floor of 500. On a low-carb, high-protein diet that presumably includes meat, fish, and eggs, a level below optimal is slightly surprising and could contribute to the fatigue she reports. Sublingual methylcobalamin is recommended to bring this into the optimal range.","low_causes":"Vegan or vegetarian diet, malabsorption, pernicious anaemia, metformin use, gastric issues","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate, or vitamin B9, is essential for DNA synthesis, cell division, and red blood cell production. At 13, this is within both normal and optimal ranges, reflecting the 4 to 5 portions of vegetables and fruit a day. Good folate status supports healthy red cell production and, alongside B12, protects against elevated homocysteine.","low_causes":"Poor dietary intake, malabsorption, alcohol, pregnancy, medication effects","high_causes":"Supplementation, high green vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"595","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4737","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"250","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4037","upper_optimal_position":"0.5717","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a natural daily rhythm, peaking in the early morning to help you wake up and falling through the day. At 595, this is within the morning laboratory range of 145.4 to 619.4 but at the very top, well above the optimal ceiling of 500. A single morning cortisol cannot diagnose a cortisol disorder, but sitting at the top of range is consistent with a stress response that is running high. Combined with her report of being slow to get going in the morning (when cortisol should be providing its strongest wake-up signal) and crashing in the afternoon (when it should be providing sustained energy), this pattern suggests the cortisol rhythm may be slightly dysregulated. The stress-reduction habits in the lifestyle section are designed to address this.","low_causes":"Adrenal insufficiency, pituitary disorders, chronic stress (late stage)","high_causes":"Acute or chronic stress, Cushing's syndrome, steroid medication, intense exercise, sleep disruption","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"100","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3955","upper_optimal_position":"0.6050","units":"pmol/L","description":"Oestradiol is the primary female sex hormone, responsible for the menstrual cycle, bone density, cardiovascular protection, and mood regulation. At 143, this falls within the follicular phase range of 71.6 to 529.2, confirming the sample was taken in the first half of the menstrual cycle. The level is appropriate for this phase and confirms the ovaries are producing oestrogen normally.","low_causes":"Menopause, perimenopause, low body fat, excessive exercise, hypothalamic amenorrhoea, polycystic ovary syndrome","high_causes":"Mid-cycle surge, pregnancy, ovarian cysts, HRT, obesity (peripheral conversion)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5582","units":"nmol/L","description":"Progesterone is the hormone produced after ovulation to prepare the uterine lining for pregnancy. At 0.82, this is within the follicular phase range of 0 to 4.45, when progesterone is naturally low because ovulation has not yet occurred. This is an expected finding for the follicular phase. Progesterone would need to be tested on day 21 of the cycle (roughly seven days after ovulation) to assess whether ovulation is occurring properly, if that becomes relevant.","low_causes":"Follicular phase (normal), anovulation, luteal phase deficiency, PCOS, stress","high_causes":"Luteal phase (normal), pregnancy, ovarian cysts, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"9.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5706","lower_normal":"1.9","upper_normal":"12.5","lower_optimal":"3.0","upper_optimal":"10.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3770","upper_optimal_position":"0.6145","units":"mIU/mL","description":"Luteinising hormone is produced by the pituitary gland and triggers ovulation. At 9.93, this is within the follicular phase range of 1.9 to 12.5. The LH-to-FSH ratio is approximately 1.5 to 1, which is within normal limits and does not suggest polycystic ovary syndrome (where the ratio is typically above 2 to 1).","low_causes":"Pituitary disorder, stress, low body weight, excessive exercise","high_causes":"Menopause, polycystic ovary syndrome, pituitary tumour, mid-cycle surge","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"6.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4858","lower_normal":"2.5","upper_normal":"10.2","lower_optimal":"3.5","upper_optimal":"8.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3766","upper_optimal_position":"0.5974","units":"mIU/mL","description":"FSH stimulates the ovaries to develop follicles containing eggs. At 6.44, this is within both the follicular range and the optimal band, confirming the pituitary is sending appropriate signals to the ovaries. Combined with a healthy LH and regular cycles, the reproductive hormone axis is functioning well.","low_causes":"Pituitary disorder, stress, low body weight, hormonal contraception","high_causes":"Menopause, perimenopause, primary ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women supports muscle mass, bone density, libido, and energy. At 1.2, this is within both the laboratory range of 0.5 to 2.6 and the optimal band. While the level is healthy for a woman, she reports low libido, which in the context of a high cortisol and the autoimmune thyroid process may be more about the interaction between stress, thyroid function, and overall energy availability than about testosterone itself.","low_causes":"Oral contraception, adrenal insufficiency, pituitary disorder, ageing","high_causes":"Polycystic ovary syndrome, congenital adrenal hyperplasia, adrenal or ovarian tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"4.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4300","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"","description":"The free androgen index estimates how much testosterone is biologically active by factoring in SHBG. At 4.08, this is within both normal and optimal ranges, confirming a healthy level of active testosterone. An elevated FAI above 6.5 can suggest polycystic ovary syndrome, so this normal result helps exclude that diagnosis.","low_causes":"High SHBG, low testosterone, oral contraception","high_causes":"Low SHBG, polycystic ovary syndrome, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4438","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3869","upper_optimal_position":"0.5634","units":"umol/L","description":"DHEA-S is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. At 4.7 umol/L (1,732 ug/dL), this is a healthy mid-range result within both normal and optimal bands, confirming the adrenal glands are producing an appropriate amount of this precursor hormone for her age.","low_causes":"Adrenal insufficiency, ageing, chronic stress, pituitary disorders","high_causes":"Adrenal hyperplasia, adrenal tumour, polycystic ovary syndrome, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"251","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4196","lower_normal":"59","upper_normal":"619","lower_optimal":"100","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4065","upper_optimal_position":"0.5327","units":"uIU/mL","description":"Prolactin is a pituitary hormone primarily associated with breastfeeding but also involved in immune function and reproductive health. At 251, this is within both normal and optimal ranges, ruling out prolactinoma or hyperprolactinaemia as a cause of the low libido or menstrual issues.","low_causes":"Dopamine agonist medication","high_causes":"Prolactinoma, hypothyroidism, stress, medication effects (antipsychotics, antidepressants), chest wall irritation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"29.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3469","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4364","upper_optimal_position":"0.5445","units":"nmol/L","description":"SHBG is a protein that binds sex hormones including testosterone and oestrogen, controlling how much is free and biologically active. At 29.4, this is just above the lower limit of 27.8 but below the optimal floor of 40 for women. Low SHBG is commonly associated with insulin resistance and higher BMI, both of which are present here. As insulin sensitivity improves and body composition changes, SHBG typically rises. A low SHBG means more free testosterone is available, which can contribute to acne or hair-related concerns in some women, though her free androgen index is currently within normal range.","low_causes":"Insulin resistance, obesity, hypothyroidism, polycystic ovary syndrome, high androgen states","high_causes":"Oral contraception, oestrogen therapy, hyperthyroidism, ageing, liver disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.022","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3833","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.015","upper_optimal":"0.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5000","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to SHBG or albumin, and therefore available for the body to use. At 0.022, this is within both normal and optimal ranges, confirming an appropriate level of biologically active testosterone.","low_causes":"High SHBG, low total testosterone, oral contraception","high_causes":"Low SHBG, polycystic ovary syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6424","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone includes both free testosterone and testosterone loosely bound to albumin, representing the total amount available for the body to use. At 0.56, this is within the laboratory range but just above the optimal ceiling of 0.55. The slightly higher bioavailable testosterone is consistent with the low SHBG: with less binding protein, more testosterone is available. This is not a concern and does not reach the level associated with androgenic symptoms.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"4.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol that is unbound and biologically active. At 4.86, this is reported for context and reflects the balance between oestradiol and SHBG. The lower SHBG means more oestradiol is free and available, which is consistent with the overall hormone picture.","low_causes":"High SHBG, low oestradiol","high_causes":"Low SHBG, high oestradiol","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"2.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5124","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4399","upper_optimal_position":"0.5459","units":"mIU/L","description":"TSH is the signal the pituitary gland sends to the thyroid, telling it to produce more hormone. A higher TSH means the pituitary is pushing the thyroid harder. At 2.8, this is within the laboratory range of 0.55 to 4.78 but above the optimal ceiling of 2.5. In isolation, 2.8 would be unremarkable. In the context of positive TPO antibodies at 30.6, it becomes significant because it suggests the thyroid is beginning to struggle under immune attack and the pituitary is having to push slightly harder to maintain output. This is the marker the GP should monitor every six months.","low_causes":"Hyperthyroidism, pituitary disorder, thyroid medication overreplacement","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness, early morning timing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4821","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the main thyroid hormone circulating in the blood. It is converted into the active form, T3, in the tissues. At 16.7, this is within both the laboratory and optimal ranges of 14 to 20, confirming the thyroid is still producing adequate hormone output despite the autoimmune process indicated by the TPO antibodies. This is the expected picture in early Hashimoto's: antibodies are positive but the gland has not yet been damaged enough to reduce output.","low_causes":"Hypothyroidism, pituitary disorder, iodine deficiency, severe illness","high_causes":"Hyperthyroidism, thyroiditis (acute phase), excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5407","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells actually use for metabolism, energy, and temperature regulation. At 5.4, this is within both the laboratory and optimal ranges of 4.5 to 6.5, showing the body is converting T4 to T3 efficiently. Despite the autoimmune process and the slightly above-optimal TSH, the end product, active thyroid hormone, is in an ideal range. This means the thyroid is still compensating successfully, which is why the GP has found thyroid function 'normal' in the past.","low_causes":"Hypothyroidism, selenium deficiency, sick euthyroid syndrome, calorie restriction","high_causes":"Hyperthyroidism, thyroiditis, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"30.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3623","units":"U/mL","description":"Thyroid peroxidase antibodies are proteins produced by the immune system that attack thyroid peroxidase, an enzyme the thyroid needs to make its hormones. At 30.6, this is more than double the upper limit of 13.8, which is a clear positive result. Positive TPO antibodies are the hallmark of autoimmune thyroid disease, most commonly Hashimoto's thyroiditis, and are found in roughly 90% of people with that condition. This is the most important finding in this report. It explains why the TSH is drifting above optimal, and it is the most likely driver of the progressive hair loss, the fatigue, the afternoon energy crash, and potentially the low libido. The GP has previously checked thyroid function and found it normal because TSH and T4 remain within laboratory range, but the antibodies have not been tested before and they change the picture entirely. This finding should be taken to the GP for a monitoring plan.","low_causes":"Normal immune function, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, post-partum thyroiditis, family history of autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3409","units":"U/mL","description":"Thyroglobulin antibodies are a second type of thyroid antibody that can be present in autoimmune thyroid disease. At less than 1.3, this is negative and well below the autoimmune threshold of 4.4. More than 80% of the population have undetectable levels. The negative thyroglobulin antibodies alongside positive TPO antibodies is the most common pattern in early Hashimoto's thyroiditis.","low_causes":"Normal immune function","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.323","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4973","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.   const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
