const REPORT_DATA = {"patient_name":"Ewelina Gliniecka","dob":"23/04/1996","report_date":"2026-10-26","summary":"Customer is a 30-year-old female presenting with a BMI of 28.7, following a low-carb, high-protein diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food rarely; portions are about average (volume 5 out of 10). She trains seven times per week, four cardio and three resistance sessions at moderate intensity, with 7,500 to 10,000 daily steps. She sleeps 7 to 8 hours but is slow to get going on waking, with an afternoon energy crash. Stress feels manageable on most days. Alcohol intake is 1 to 4 drinks per week. She takes creatine and protein powder. She has no diagnosed conditions and takes no medications. Her family history is significant: heart attack or stroke before 60, type 2 diabetes, bowel, breast, prostate or ovarian cancer, osteoporosis, and dementia on her mother's side, with many unknowns on her father's side. She has not had blood tests through TrueVitals before, though she has had thyroid and diabetes checks through her GP in the past, all reported as normal. She reports hair thinning and hair loss as her primary concern, having lost roughly three quarters of her hair volume over the past year, alongside low energy and fatigue, bloating and digestive discomfort, and low sex drive. Her goals are to balance her hormones, lose body fat, and reduce stress and anxiety. She has expressed frustration that previous GP visits have not progressed beyond a basic thyroid and diabetes screen, and she wants actionable answers.\n\nThe finding that should go to her GP first is her thyroid peroxidase (TPO) antibody result. TPO antibodies are proteins produced by the immune system that mistakenly target thyroid peroxidase, an enzyme the thyroid gland needs to manufacture its hormones. Her level is 30.6, more than double the upper limit of 13.8, which is a clear positive result. Her thyroglobulin antibodies, the other antibody associated with autoimmune thyroid disease, are negative at less than 1.3. Positive TPO antibodies in the presence of a TSH of 2.8 raise the possibility of early Hashimoto's thyroiditis, the most common cause of underactive thyroid. TSH, or thyroid stimulating hormone, is the signal the pituitary gland sends to the thyroid telling it to produce more hormone; 2.8 is within the laboratory range of 0.55 to 4.78 but sits above the optimal band of 1.0 to 2.5, which in the context of positive antibodies is meaningful. Her free T4, the main circulating thyroid hormone, is 16.7, comfortably within range. Her free T3, the active form that cells actually use, is 5.4, which is within the optimal band. The FT3 to FT4 ratio of 0.323 confirms the thyroid is converting T4 to T3 efficiently. So the thyroid is still working, and working well enough to keep T3 and T4 in healthy territory, but the immune system is producing antibodies against it, and TSH is already drifting upward. This is the pattern that precedes clinical hypothyroidism, sometimes by years, and it matters enormously here because Hashimoto's thyroiditis is one of the most common causes of diffuse hair loss in women of her age. The hair loss she describes, progressive thinning over almost a year rather than patchy bald spots, is exactly the pattern associated with subclinical thyroid dysfunction. It can also drive fatigue, difficulty waking, afternoon energy crashes, low mood, and reduced libido, all of which she reports. This does not mean the thyroid is the only explanation for all of her symptoms, but it is far and away the most important finding in this report and it deserves proper investigation. She should take this result to her GP and ask for a referral or, at minimum, a six-monthly TSH and antibody monitoring plan with a clear threshold for starting treatment.\n\nThe second finding that needs attention is her insulin resistance. HOMA-IR is a calculation that combines fasting glucose and fasting insulin to estimate how effectively the body's cells are responding to insulin; a score below 1.0 is considered insulin-sensitive and optimal, above 1.9 suggests early resistance, and above 2.9 indicates significant resistance. Her HOMA-IR is 3.39, well above the 2.9 threshold and more than double the upper limit of 1.5. Her fasting insulin is 15.58, within the laboratory range of 2.6 to 24.9 but well above the optimal ceiling of 8. Her fasting glucose at 4.9 is healthy, and her HbA1c, a measure of average blood sugar over the previous two to three months, is 34 mmol/mol, comfortably below the pre-diabetes threshold of 42 and within the optimal band below 36. So her blood sugar control is still excellent, but her pancreas is having to produce a lot of insulin to achieve that control. At 30 with a BMI of 28.7 and a family history of type 2 diabetes, this is the metabolic signal to act on now rather than later. The good news is that insulin resistance at this stage is entirely reversible with the right changes, and she is already doing many of the right things: her diet is low-carb and high-protein, her training volume is high, and her sugar intake is rare. The most likely driver is total energy balance and body composition rather than food quality, and the plan below addresses that directly. Her TyG index, another measure of metabolic health built from triglycerides and glucose, is 8.15, within both the normal and optimal ranges, and her triglycerides at 0.89 are excellent, so the metabolic picture is not alarming. It is, however, a clear signal that the body is working harder than it should to keep blood sugar in check.\n\nHer hs-CRP, a measure of systemic inflammation, is 3.7. CRP below 5 is within the laboratory reference range, but the optimal level is below 1.0 and most healthy 30-year-olds sit well below 2. At 3.7, this is mildly elevated and could reflect several things: the insulin resistance itself drives low-grade inflammation, as does carrying extra body fat around the middle; the autoimmune thyroid process can contribute; and training load at seven sessions a week with moderate intensity could be adding an inflammatory burden if recovery is not keeping pace. Her ESR, another inflammation marker that measures how quickly red blood cells settle in a tube, is 22, above the upper limit of 12 for women. ESR is a slower, less specific marker than CRP, and it can be raised by elevated globulin or immunoglobulin levels, by the menstrual cycle, and by body composition, but alongside a CRP of 3.7 it confirms there is a genuine low-grade inflammatory process. This is not a level that suggests serious disease, but it is worth understanding what is driving it, and the thyroid antibodies, the insulin resistance, and the body composition are the three most likely contributors.\n\nHer ferritin, the body's iron storage protein, is 34. This is within the laboratory range of 10 to 291 but below the optimal floor of 40 for women. In the context of hair loss, ferritin is one of the most important markers. Hair follicles are among the most rapidly dividing cells in the body and are particularly sensitive to iron status; ferritin below 40 to 50 is associated with increased hair shedding even when it does not meet the formal definition of iron deficiency. Her serum iron is 20.7, healthy, her transferrin saturation is 28.92%, within the optimal band of 25 to 40%, and her transferrin and iron binding capacity are both normal, so there is no iron deficiency anaemia, but the stores are lower than ideal for someone losing hair at the rate she describes. Building ferritin to at least 50, ideally closer to 70 to 80, is one of the most straightforward interventions in this report.\n\nHer vitamin D is 48 nmol/L, which falls in the insufficient band between 30 and 50. The optimal range is 75 to 120. Vitamin D plays a role in immune regulation, and there is evidence that adequate vitamin D levels may help modulate autoimmune processes including Hashimoto's. At a BMI of 28.7, fat tissue sequesters vitamin D, meaning she needs a higher supplementation dose than a lean person to reach the same blood level. This is a straightforward fix with supplementation.\n\nHer vitamin B12 is 416, within the laboratory range of 193 to 982 but below the optimal floor of 500. On a low-carb, high-protein diet that presumably includes animal products, this is slightly surprising and worth nudging upward, particularly because B12 is involved in red blood cell production, neurological function, and energy metabolism.\n\nThere are several genuinely positive findings worth highlighting. Her liver is in excellent health. ALT at 16 is well below the optimal ceiling of 25 for women, GGT at 17 is comfortably below 25, AST at 19 is mid-range, bilirubin at 12 is normal, albumin at 46 is strong, and her FIB-4 score at 0.52 and APRI at 0.172 both confirm there is no liver fibrosis or scarring whatsoever. The NAFLD fibrosis score of negative 3.32 sits within the optimal band, ruling out non-alcoholic fatty liver disease. For someone with insulin resistance and a BMI approaching 29, a completely clean liver is a genuine positive. Her lipid profile is largely favourable. Total cholesterol at 5.0 is at the desirable threshold. Her triglycerides at 0.89 are excellent, reflecting good dietary carbohydrate control. Her HDL, the protective cholesterol, is 1.5, just below the high-desirable threshold of 1.55 but a good level. Her ApoA1, the protein that carries HDL, is 1.56, above the desirable threshold of 1.4. Her ApoB to ApoA1 ratio is 0.57, within the lower-risk band below 0.6, which is the single best summary of her atherogenic risk and it reads well. Her Lp(a), a genetically inherited lipoprotein that adds cardiovascular risk independently of lifestyle, is 26.79, below the ideal threshold of 32. This is genuinely useful information given her family history of heart attack and stroke before 60, because it means any future cholesterol management is entirely about modifiable factors. Her LDL at 3.13 is marginally above the 3.0 upper limit, and her ApoB at 0.89 is just at the desirable threshold of 0.9, so the atherogenic particle count is borderline rather than clearly elevated. Her Lp(a)-corrected LDL is 3.04, confirming that almost all of the LDL is modifiable rather than driven by Lp(a). Her cardiovascular risk score is 30 out of 100, within the acceptable range below 40 but above the ideal threshold of 20, driven primarily by the CRP and the borderline LDL and ApoB rather than by anything severely abnormal. Her atherogenic index of plasma at negative 0.227 and her Castelli II ratio at 2.09 are both within optimal ranges, confirming the overall cardiovascular picture is acceptable and the direction of travel with the lifestyle changes below should bring it comfortably into the ideal zone.\n\nHer kidney function is solid. Creatinine at 74, urea at 5.1, and cystatin C at 1.05 are all within range. Cystatin C is a more reliable measure of kidney filtration than creatinine alone because it is less affected by muscle mass; her cystatin C-derived eGFR is 85, which is below the optimal threshold of 90 but at 30 years old and with the creatinine-based eGFR above 90, this is a borderline result that most likely reflects day-to-day variation rather than any kidney concern. The combined creatinine plus cystatin C eGFR confirms this at 85. Her uric acid at 351 is within range for women. Her electrolytes are balanced: sodium 140, chloride 101, bicarbonate 27.6, magnesium 1.01 within the optimal band of 0.85 to 1.05, phosphate 1.6, and corrected calcium 2.36 with a healthy PTH of 1.792. Her serum osmolality at 290 sits within the optimal range.\n\nHer hormones, beyond the thyroid, paint a consistent picture of someone in the follicular phase of her menstrual cycle with a regular cycle. Oestradiol at 143 fits the follicular range of 71.6 to 529.2, and progesterone at 0.82 fits the follicular range of 0 to 4.45, confirming the sample was taken in the first half of her cycle. LH at 9.93 and FSH at 6.44 are both within follicular ranges and the ratio does not suggest polycystic ovary syndrome. Testosterone at 1.2 is within the female range of 0.5 to 2.6, and her free androgen index at 4.08 is within range. Her SHBG at 29.4 is just above the lower limit of 27.8 but below optimal; SHBG tends to be lower with insulin resistance and higher BMI, which fits. Her bioavailable testosterone at 0.56 sits at the top of the reference range, which is fine. Her DHEA-S at 4.7 is healthy, and prolactin at 251 is well within the non-pregnant range. Cortisol at 595 is within the morning reference range of 145.4 to 619.4 but sits at the very top of that range. A single morning cortisol cannot diagnose a cortisol problem, but at 595, combined with her report of an afternoon energy crash and being slow to get going in the morning, this is consistent with a stress response that is running high. It does not require investigation unless symptoms worsen or other features develop, but it does mean the stress-reduction goal in her plan is not optional.\n\nHer full blood count shows a few findings worth noting. Her red blood cell count at 5.15 is above the female upper limit of 4.8. Her haemoglobin at 150 sits exactly at the upper limit of the female range. Taken together, this is mild erythrocytosis, an increase in red cell production. In a 30-year-old woman who is training seven days a week, the most likely explanation is physiological adaptation to exercise and the mild dehydration that comes with it. Her MCV at 85.8, MCH at 29.1, and MCHC at 339 are all normal, so the red cells are a normal size and properly filled with haemoglobin. Her reticulocyte percentage at 0.7 is within range, but her absolute reticulocyte count at 36.05 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow; a low absolute count in the presence of adequate haemoglobin means the marrow has slowed production because it does not need to replace cells at the moment, which is appropriate. Her white cell count at 4.05 is just at the lower boundary of 4.0. Monocytes at 0.17 are marginally below the 0.2 lower limit, and basophils at 0.01 are marginally below 0.02. These are tiny absolute numbers and at these margins represent normal variation rather than any immune deficiency. Her neutrophils at 2.26 and lymphocytes at 1.56 are both within range, giving a neutrophil-to-lymphocyte ratio of 1.45, which is within the optimal band of 1.0 to 2.0 and a marker of well-balanced immune function. Her platelets at 276 are healthy, and her MPV, the average size of her platelets, at 10.3 is marginally above the upper limit of 10.1, which at this margin is normal variation and not a concern. Her platelet-to-lymphocyte ratio at 176.9 is within range, and her systemic immune-inflammation index at 400 is within normal and optimal limits.\n\nHer immunoglobulins are reassuring. IgG at 13.2, IgA at 1.0, and IgM at 1.3 are all within their reference ranges, showing a normally functioning immune system with no excess or deficiency. Her rheumatoid factor is less than 4, well below the threshold, and her tissue transglutaminase IgA is negative at 0.2, effectively ruling out coeliac disease as a cause of her bloating and hair loss. Her tumour markers are all clean: CA125 at 9.5, CA15-3 at 5.49, CA19-9 at 2.26, and CEA at 0.63 are all well within their reference ranges. Given her family history of multiple cancers, this is a reassuring baseline. Her amylase at 62 and lipase at 42 are both within range, confirming normal pancreatic function. Her creatine kinase at 101 is mid-range, appropriate for someone training regularly. Her total antioxidant activity at 2.0 is above the upper limit of 1.77, which reflects supplementation with creatine and protein powder, both of which can contribute to antioxidant capacity, and possibly the high vegetable intake. This is not a concern. Her urinalysis is clean: no protein, glucose, ketones, blood, white cells, or nitrites, with a normal specific gravity and pH.\n\nHer PhenoAge, a biological ageing estimate built from nine blood markers including albumin, glucose, CRP, and white cell count, is 22.5 against her calendar age of 30, meaning her blood markers are ageing seven and a half years younger than her birthday suggests. This is an excellent result and reflects the quality of her diet, her training consistency, and the overall health of her liver, kidneys, and immune system.\n\nTo bring this together for the GP conversation: the positive TPO antibodies at 30.6 with a TSH drifting above optimal at 2.8 is the most important finding and the one most likely to explain the hair loss, the fatigue, the afternoon crash, and possibly the low libido. The GP has checked thyroid function before and found TSH within range, which it still is, but the antibodies have never been tested, and they change the picture entirely. The insulin resistance with a HOMA-IR of 3.39, the low ferritin at 34, the insufficient vitamin D at 48, and the low-grade inflammation with a CRP of 3.7 and ESR of 22 are all addressable and will all respond to the plan below. Her bloating and digestive discomfort are not explained by these blood results: coeliac disease has been excluded, pancreatic enzymes are normal, and there is no marker of gut inflammation in this panel. The most likely causes are food intolerances, gut motility issues, or the volume and timing of meals, and a food and symptom diary for two to three weeks would be the most useful next step to identify triggers. If bloating persists, a hydrogen breath test for lactose intolerance or small intestinal bacterial overgrowth (SIBO) would be a reasonable investigation to discuss with her GP.","links":"The thread running through this report is the interplay between an early autoimmune thyroid process, insulin resistance, and the symptoms that sit between them. The positive TPO antibodies at 30.6 with a TSH of 2.8 suggest the immune system is targeting the thyroid gland, and while the gland is still producing adequate T4 and T3 today, the upward drift in TSH is the earliest sign that it is being asked to work harder. Subclinical thyroid dysfunction, even at this early stage, slows metabolism, reduces the rate at which the body clears LDL cholesterol from the blood, and is one of the most well-documented causes of diffuse hair loss in women. Her borderline LDL of 3.13 and ApoB of 0.89 may partly reflect thyroid-driven slowing of LDL receptor activity rather than purely dietary factors, which means treating the thyroid process could improve the lipid numbers independently of any dietary change.\n\nThe insulin resistance, with a HOMA-IR of 3.39, sits alongside the thyroid finding rather than being caused by it, but the two share common ground. Insulin resistance promotes low-grade inflammation, and her CRP of 3.7 and ESR of 22 confirm that inflammation is present. Inflammation in turn can worsen autoimmune thyroid activity, creating a cycle where the thyroid process and the metabolic stress feed each other. Breaking this cycle through improving insulin sensitivity, reducing body fat, and managing the inflammatory load is likely to benefit both systems. Her BMI of 28.7, the family history of type 2 diabetes, and the fact that her pancreas is already producing more than double the optimal amount of insulin to maintain a healthy blood sugar all point to body composition as the central modifiable lever.\n\nThe low ferritin at 34 and the insufficient vitamin D at 48 are separate findings but both contribute to the hair loss and fatigue picture. Hair follicles need ferritin above 40 to 50 to maintain their growth cycle, and vitamin D receptors are present in hair follicles and play a role in the cycling between growth and rest phases. Both are straightforward to correct with supplementation, and both should be retested in three to four months to confirm they have reached target.\n\nWhat has been positively excluded matters here. Coeliac disease is negative, ruling it out as a cause of malabsorption, bloating, or hair loss. Polycystic ovary syndrome is unlikely given normal testosterone, a normal free androgen index, and a normal LH-to-FSH ratio. Iron deficiency anaemia is excluded by normal haemoglobin, normal MCV, and adequate serum iron and transferrin saturation. Liver and kidney disease are excluded. The tumour markers and immunoglobulins are clean. The one loose end that blood cannot answer is the bloating: with coeliac excluded and pancreatic enzymes normal, the next investigation is a food and symptom diary to identify triggers, followed by a hydrogen breath test if a pattern does not emerge.","lifestyle":"Build each main meal around a palm-and-a-half of protein first: chicken, fish, eggs, Greek yoghurt, or legumes before anything else on the plate. Anchor: plate goes down, protein goes on first. Why: protein blunts the insulin response behind your HOMA-IR of 3.39 and supports the muscle you are building with three resistance sessions a week. Your daily target is 100 to 125g of protein.\nKeep your total daily intake to around 1,600 to 1,750 calories, aiming for a gentle deficit that loses roughly 0.3 to 0.5kg per week toward a target weight of 68 to 72kg. Why: reducing body fat is the single most effective way to reverse insulin resistance at your stage, lower CRP, and reduce the inflammatory load on the thyroid.\nAdd one extra portion of oily fish per week (salmon, mackerel, sardines) and increase soluble fibre with oats, lentils, or beans at one meal a day. Anchor: swap one of your weekly protein sources for oily fish on the same day each week. Why: oily fish provides omega-3 that lowers inflammation and the soluble fibre will help bring LDL from 3.13 below 3.0 and support gut regularity.\nKeep a simple food and symptom diary for three weeks: write what you ate and any bloating, gas, or discomfort within four hours. Anchor: a note in your phone after each meal, ten seconds. Why: your bloods have excluded coeliac and pancreatic causes of bloating, so the answer is most likely a specific food trigger or eating pattern that only a diary will catch.\nWalk for fifteen minutes after your largest meal of the day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal, which directly targets the mechanism behind your HOMA-IR of 3.39.\nKeep your current seven training sessions but ensure at least one full rest day per week with no structured exercise. Why: your CRP of 3.7 and ESR of 22 suggest your body is carrying more inflammation than ideal, and recovery is where adaptation happens. Consider swapping one cardio session for a yoga, mobility, or gentle walk session.\nSet a fixed wake time seven days a week and get outside within 30 minutes of waking for natural light. Cut caffeine after 1pm. Anchor: alarm goes off, curtains open immediately, coffee only before lunch. Why: you report being slow to get going and crashing in the afternoon, which is a pattern that responds to anchoring the circadian rhythm with morning light and removing afternoon caffeine.\nSet a 10-minute wind-down before bed with no screens: breathing exercises, stretching, or reading. Anchor: phone on charge in another room at a set time. Why: your cortisol at 595 is at the top of the morning range and stress management is one of your goals; a consistent wind-down lowers evening cortisol and improves sleep quality, which helps the thyroid, the insulin, and the hair.","flags":"TPO antibodies 30.6, more than double the upper limit of 13.8, with TSH 2.8 above the optimal ceiling of 2.5. Thyroglobulin antibodies negative. FT4 16.7 and FT3 5.4 both within range. This pattern is consistent with early Hashimoto's thyroiditis and is the most likely driver of the progressive hair loss, fatigue, and afternoon energy crash. Recommend GP referral for antibody monitoring and a plan for treatment if TSH rises further.\nHOMA-IR 3.39, above the significant insulin resistance threshold of 2.9. Fasting insulin 15.58, above the optimal ceiling of 8. Fasting glucose 4.9 and HbA1c 34 both within optimal ranges, so blood sugar control is being maintained but at the cost of excess insulin production. Family history of type 2 diabetes makes this a priority. Lifestyle intervention is the first-line approach.\nhs-CRP 3.7, above the optimal threshold of 1.0. ESR 22, above the upper limit of 12. Low-grade systemic inflammation present, likely driven by a combination of the autoimmune thyroid process, insulin resistance, and body composition. Not at a level suggesting acute disease.\nFerritin 34, below the optimal floor of 40 for women and below the 50 level associated with maintained hair growth. Iron, transferrin saturation, and haemoglobin are all normal, so this is suboptimal stores rather than deficiency anaemia. Supplementation recommended.\nVitamin D 48, in the insufficient band below 50 and well below the optimal floor of 75. Supplementation at a higher dose needed given BMI of 28.7.\nLDL 3.13, marginally above the 3.0 upper limit. ApoB 0.89, at the desirable threshold of 0.9. Lp(a) 26.79, below the ideal threshold of 32. Cardiovascular risk score 30, within the acceptable range below 40 but above the ideal of 20. The borderline lipids may be partly thyroid-driven and should improve with lifestyle changes and thyroid management.\nRed blood cell count 5.15, above the female upper limit of 4.8. Haemoglobin 150, at the upper limit. Most likely physiological adaptation to high training volume and mild dehydration. No action needed unless it rises further.\nAbsolute reticulocytes 36.05, below the lower limit of 50. Appropriate marrow suppression given adequate haemoglobin. Not a concern.\nMonocytes 0.17, marginally below 0.2. Basophils 0.01, marginally below 0.02. At these absolute numbers this is normal variation.\nMPV 10.3, marginally above the upper limit of 10.1. Not clinically significant at this margin.\nCortisol 595, at the top of the morning range of 145.4 to 619.4. Within range but consistent with a heightened stress response. Does not require investigation at present but supports the stress-reduction goal.\nCystatin C eGFR 85 and combined eGFR 85, both below the optimal threshold of 90 but with creatinine-based eGFR above 90 and normal creatinine at 74. Most likely reflects normal day-to-day variation. Worth rechecking at next test.\nVitamin B12 416, within range but below the optimal floor of 500. Supplementation recommended.\nTotal antioxidant activity 2.0, above the upper limit of 1.77, reflecting supplementation. Not a concern.\nSHBG 29.4, just above the lower limit of 27.8 and below optimal, consistent with insulin resistance.\nReassuring negatives: coeliac screen negative, all tumour markers well within range (CA125 9.5, CA15-3 5.49, CA19-9 2.26, CEA 0.63), liver function excellent (ALT 16, GGT 17, FIB-4 0.52), pancreatic enzymes normal, rheumatoid factor negative, immunoglobulins balanced, urinalysis clean, Lp(a) below ideal threshold, PhenoAge 22.5 against calendar age 30.\nNot reported on this occasion: C-Peptide, IgE, bacterial count, urine culture and sensitivities.","recommendations":"Take this report to your GP and ask specifically about the positive TPO antibodies at 30.6 with a TSH of 2.8. Request a monitoring plan with TSH and TPO antibodies repeated every six months, with a clear agreement on the TSH threshold at which treatment with levothyroxine would begin. Mention the progressive hair loss over the past year, as this pattern alongside positive antibodies may change the treatment threshold.\nAsk your GP to check your ferritin specifically when they next do bloods, and discuss whether iron supplementation to a target of 50 to 80 is appropriate given the hair loss. Bring the ferritin result of 34 and explain the hair loss timeline.\nDiscuss the insulin resistance with your GP: HOMA-IR 3.39, fasting insulin 15.58, with a family history of type 2 diabetes. The plan is lifestyle-led, but the GP should be aware and may want to monitor HbA1c and fasting glucose annually.\nAsk about a referral to a dermatologist or trichologist for the hair loss if the GP is not able to investigate further. The combination of low ferritin, insufficient vitamin D, positive TPO antibodies, and elevated CRP gives the specialist several targets to work with.\nIf the bloating persists after three weeks of the food and symptom diary, discuss a hydrogen breath test for lactose intolerance or SIBO with your GP.\nMention the CRP of 3.7 and ESR of 22 to your GP as part of the overall picture. These are not alarming but they confirm low-grade inflammation and give a baseline to track improvement.\nAt your next retest in four to six months, repeat: TSH, TPO antibodies, ferritin, vitamin D, fasting insulin, HOMA-IR, hs-CRP, ESR, full blood count, and a lipid panel. Target calorie intake 1,600 to 1,750 kcal per day, protein 100 to 125g per day, targeting a weight of 68 to 72kg.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with your largest meal that contains fat. Why: your level is 48, in the insufficient band, and at a BMI of 28.7 you need a higher dose because fat tissue sequesters vitamin D. Target: above 75 on retest in four months.\nVitamin K2 (MK-7): 200 mcg daily, taken with the vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bones rather than arteries, and with your family history of osteoporosis this is especially relevant.\nIron (ferrous bisglycinate): 25mg every other day, taken with a source of vitamin C such as orange juice or a kiwi, away from tea, coffee, and dairy. Why: your ferritin is 34, below the 50 level associated with maintained hair growth. Bisglycinate is the gentlest form on the gut, which matters given your bloating. Every other day is more effective for absorption than daily.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: your B12 is 416, below the optimal floor of 500. Sublingual bypasses the gut for better absorption.\nOmega-3 fish oil: 2g combined EPA and DHA daily, taken with food. Why: omega-3 lowers inflammation (CRP 3.7), supports thyroid health, and helps bring LDL and ApoB into the optimal range. It also supports brain and mood function, relevant to your stress and anxiety goal.\nMagnesium glycinate: 300mg before bed. Why: your magnesium at 1.01 is within the optimal band but glycinate supports sleep quality and stress recovery, and you report being slow to get going and having an afternoon crash. It also supports insulin sensitivity.\nDo not take biotin supplements for hair loss without discussing with your GP first, as biotin can interfere with thyroid blood tests and mask changes in TSH and antibody levels that need to be tracked.\nThe most important changes from this report are not supplements. They are getting the thyroid antibodies properly investigated and monitored by your GP, reducing body fat to reverse the insulin resistance, and building ferritin and vitamin D to levels that support hair regrowth.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 64.8; held to 59 by a system rated \"See your GP\". Weakest systems: inflammation 8%, hematology 45%, thyroid 45%. Biggest drags: LDL Cholesterol, Vitamin D 25(OH), Red Blood Cell Count, Reticulocytes (Absolute).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"22.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3214","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is a biological ageing estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count. At 22.5 against a calendar age of 30, her blood markers are ageing seven and a half years younger than her birthday suggests. This is an excellent result driven by healthy albumin, glucose, liver markers, and white cell count. The CRP of 3.7 is the one marker pulling PhenoAge upward; reducing inflammation through the plan below should bring PhenoAge down even further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP, and HbA1c. It measures the cardiovascular risk being built, not the ten-year chance of an event. At 30, this is within the acceptable range below 40 but above the ideal threshold of 20. The two inputs driving the score above ideal are the CRP of 3.7 and the borderline LDL and ApoB. With the Lp(a) below the ideal threshold and the triglycerides and TG:HDL ratio excellent, the score should respond well to the anti-inflammatory and body composition changes in the plan.","low_causes":"Excellent lipid profile, low inflammation, optimal metabolic health","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose measures the amount of sugar circulating in the bloodstream after fasting. At 4.9, this sits comfortably within both the laboratory range and the tighter optimal band of 4.0 to 5.4, meaning the body is maintaining healthy blood sugar levels. This is a reassuring result, particularly given the family history of type 2 diabetes, and shows that despite the elevated insulin, blood sugar itself is well controlled.","low_causes":"Fasting, excessive exercise, reactive hypoglycaemia, insulin-producing tumour","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3833","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"3.5","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6267","units":"%","description":"HbA1c as a percentage represents average blood sugar over the past two to three months. At 5.3%, this is well below the pre-diabetes threshold of 6.0% and confirms excellent long-term blood sugar control. This is the same test the GP has checked before, and it remains reassuringly normal.","low_causes":"Low carbohydrate diet, anaemia with rapid red cell turnover","high_causes":"Pre-diabetes, type 2 diabetes, sustained high blood sugar","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"HbA1c in mmol/mol is the standard unit for measuring average blood sugar over the preceding two to three months. At 34, this is comfortably below the normal threshold of 42 and within the optimal band below 36. Combined with the healthy fasting glucose, this confirms that the body is keeping blood sugar tightly controlled despite the insulin resistance shown by the HOMA-IR.","low_causes":"Low carbohydrate diet, anaemia, rapid red cell turnover","high_causes":"Pre-diabetes, diabetes, sustained high blood sugar","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"15.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5279","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5480","units":"mIU/L","description":"Insulin is the hormone the pancreas produces to move sugar from the blood into cells for energy. At 15.58, this is within the laboratory range of 2.6 to 24.9 but nearly double the optimal ceiling of 8.0. This means the pancreas is producing significantly more insulin than ideal to maintain the healthy blood sugar shown above. In the context of a BMI of 28.7 and a family history of type 2 diabetes, this is a clear early warning that the cells are becoming resistant to insulin's signal. The good news is that at this stage, lifestyle changes to diet and body composition can reverse the resistance entirely.","low_causes":"Low carbohydrate diet, high insulin sensitivity, prolonged fasting, type 1 diabetes","high_causes":"Insulin resistance, high carbohydrate intake, excess body fat, early type 2 diabetes, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ug/L","description":"C-Peptide is a protein released alongside insulin and serves as a reliable measure of how much insulin the pancreas is producing. This result is pending and will be reviewed when available.","low_causes":"Low insulin production, type 1 diabetes, prolonged fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4143","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into a daily average blood sugar reading to help visualise what the body experiences day to day. At 5.8, this is within both the normal and optimal ranges, confirming that daily blood sugar levels are well managed. This is derived from the HbA1c of 34 and is consistent with the healthy fasting glucose of 4.9.","low_causes":"Very low carbohydrate intake, prolonged fasting","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4631","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines triglycerides and fasting glucose to provide another estimate of insulin resistance and metabolic health. At 8.15, this sits within both the normal range below 8.8 and the optimal range below 8.5. This is a more favourable reading than the HOMA-IR because it reflects the excellent triglyceride level of 0.89, which suggests the low-carb diet is doing a good job of managing fat metabolism even while overall insulin sensitivity needs improvement.","low_causes":"High insulin sensitivity, very low carbohydrate intake","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"150","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. At 150, this sits exactly at the upper limit of the female range of 120 to 150 and above the optimal ceiling of 145. In a 30-year-old woman training seven days a week, a haemoglobin at the top of range is most likely a physiological response to the high training volume and possibly mild dehydration at the time of the blood draw. It is not a concern but worth noting alongside the elevated red blood cell count.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, high altitude, heavy exercise, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7833","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"x10^12/L","description":"Red blood cell count measures the total number of red cells per litre of blood. At 5.15, this is above the female upper limit of 4.8. In a young, healthy, heavily training woman with a haemoglobin at the top of range, this most likely represents mild erythrocytosis driven by training adaptation and possibly mild dehydration. The red cells themselves are normal in size (MCV 85.8) and properly filled with haemoglobin (MCH 29.1, MCHC 339), so this is not a sign of a blood disorder. It is worth repeating on the next test to confirm it does not rise further.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, high altitude training, polycythaemia vera, chronic hypoxia, heavy exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.442","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5753","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.442, this is within the laboratory range of 0.36 to 0.46 and just above the optimal ceiling of 0.44. This is consistent with the slightly elevated red blood cell count and haemoglobin, and in the context of high training volume is most likely a normal physiological finding.","low_causes":"Anaemia, overhydration, blood loss, nutritional deficiency","high_causes":"Dehydration, heavy exercise, polycythaemia, smoking, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"13.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5972","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.8","upper_optimal":"13.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6389","units":"%","description":"RDW measures how much variation there is in the size of red blood cells. A higher number means more variation, which can indicate nutritional deficiency or chronic disease. At 13.5, this is within both the laboratory and optimal ranges, confirming the red cells are uniform in size and production is stable.","low_causes":"Normal finding","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, chronic liver disease, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"85.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"fL","description":"MCV measures the average size of red blood cells. Small cells suggest iron deficiency, large cells suggest B12 or folate deficiency. At 85.8, this is within both the laboratory and optimal ranges, confirming the red cells are a normal size and there is no suggestion of iron, B12, or folate-related production issues.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"29.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"27","upper_normal":"32","lower_optimal":"27.5","upper_optimal":"31.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. At 29.1, this is within both normal and optimal ranges, confirming each red cell is carrying an appropriate amount of oxygen-transporting protein.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"339","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC measures the concentration of haemoglobin within each red blood cell. At 339, this is within both normal and optimal ranges, confirming the red cells are properly loaded with haemoglobin and functioning efficiently.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, severe dehydration, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"276","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4949","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"370","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5641","units":"x10^9/L","description":"Platelets are small cell fragments that help blood clot when needed. At 276, this is a healthy mid-range result, confirming normal clotting function and no sign of excessive production or consumption.","low_causes":"Viral infection, autoimmune disease, bone marrow suppression, medication effects","high_causes":"Iron deficiency, inflammation, infection, after surgery or trauma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"10.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6333","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are younger and more active. At 10.3, this is marginally above the upper limit of 10.1. At this margin, this is normal variation and does not indicate any platelet disorder. Platelet count is normal at 276, which is reassuring.","low_causes":"Bone marrow suppression, inflammatory bowel disease, chemotherapy","high_causes":"Increased platelet production, recovery from low platelets, mild inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3389","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"White blood cells are the immune system's primary defence against infection and disease. At 4.05, this is just at the lower boundary of the laboratory range of 4 to 10 and below the optimal floor of 4.5. In a lean, active 30-year-old, a white cell count at the lower end of normal is a common finding and does not suggest immune deficiency. The individual white cell types are explored below.","low_causes":"Exercise, lean body composition, viral infection, autoimmune disease, nutritional deficiency","high_causes":"Infection, inflammation, stress, smoking, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3853","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cell type and the first responders to bacterial infection. At 2.26, this is within the laboratory range of 2 to 7 but below the optimal floor of 2.5. In a healthy, active young woman, this is a normal finding reflecting a lean, efficient immune system rather than any deficiency.","low_causes":"Exercise, lean body composition, viral infection, autoimmune disease, medication effects","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4267","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5000","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes include T cells and B cells, which coordinate the immune response and produce antibodies. At 1.56, this is within both the laboratory range and the optimal band of 1.5 to 2.5, showing a balanced adaptive immune system.","low_causes":"Viral infection, stress, autoimmune disease, corticosteroid use","high_causes":"Viral infection, chronic inflammation, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2917","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf pathogens and dead cells and help coordinate the immune response. At 0.17, this is marginally below the lower limit of 0.2. The absolute number is very small and at this margin the difference is unlikely to be clinically significant. It reflects the overall pattern of a white cell count sitting at the lower end of normal in an active, healthy woman.","low_causes":"Normal variation, high training load, bone marrow suppression","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, haematological disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in the response to parasitic infections and allergic reactions. At 0.05, this is near the bottom of range, which is a normal and healthy finding showing no allergic or parasitic activity.","low_causes":"Normal finding, steroid use, acute stress","high_causes":"Allergies, parasitic infection, asthma, eczema, drug reactions, eosinophilic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2917","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cell type, involved in allergic and inflammatory responses. At 0.01, this is marginally below the lower limit of 0.02. The absolute number is so small that a difference of 0.01 is within normal measurement variation and has no clinical significance.","low_causes":"Normal variation, acute allergic reaction, thyrotoxicosis, steroid use","high_causes":"Allergic reactions, chronic inflammation, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells that have just been released from the bone marrow. The percentage at 0.7 is within the normal range, showing the bone marrow is producing new red cells at an appropriate rate relative to the total red cell population.","low_causes":"Iron deficiency, B12 deficiency, bone marrow suppression, chronic disease","high_causes":"Recovery from blood loss or anaemia, haemolysis, treatment response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"36.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2067","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the total number of young red blood cells in the circulation rather than the percentage. At 36.05, this is below the lower limit of 50. However, in the context of a haemoglobin of 150 and a red blood cell count of 5.15, both at or above the top of range, the bone marrow has appropriately throttled back production because the body does not need more red cells. This is an expected physiological response, not a sign of bone marrow underperformance.","low_causes":"Adequate haemoglobin with no stimulus to produce more cells, iron deficiency, B12 deficiency, bone marrow suppression","high_causes":"Recovery from blood loss, haemolytic anaemia, treatment response after deficiency correction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"16.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by the red blood cell count to help distinguish between iron deficiency anaemia and thalassaemia trait. At 16.7, this is above 13, which favours iron deficiency as the cause of any microcytosis rather than thalassaemia. However, since MCV is normal at 85.8, the Mentzer index is reported for context rather than because it is clinically relevant here.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9167","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR measures how quickly red blood cells settle in a tube over one hour. A faster settling rate suggests inflammation, infection, or increased protein in the blood. At 22, this is above the upper limit of 12 for women. ESR is a non-specific marker, meaning it tells us inflammation is present but not what is causing it. In this report, the most likely contributors are the autoimmune thyroid process (positive TPO antibodies), the insulin resistance, and the excess body fat, all of which drive low-grade systemic inflammation. This is not at a level suggesting serious disease but it confirms the inflammatory picture seen with the CRP of 3.7.","low_causes":"Low inflammation, polycythaemia, sickle cell disease","high_causes":"Inflammation, infection, autoimmune disease, anaemia, pregnancy, obesity, elevated immunoglobulins","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3700","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein is produced by the liver in response to inflammation anywhere in the body. It is one of the most useful markers for cardiovascular risk assessment because chronic low-grade inflammation damages blood vessel walls. At 3.7, this is within the laboratory range below 5 but well above the optimal threshold of 1.0. Most healthy 30-year-olds sit well below 2. The likely drivers in this case are the autoimmune thyroid process, the insulin resistance with its associated metabolic inflammation, and excess body fat. Reducing body fat and improving insulin sensitivity should bring this down significantly.","low_causes":"Low inflammation, healthy body composition, anti-inflammatory diet","high_causes":"Infection, autoimmune disease, obesity, insulin resistance, cardiovascular disease, chronic inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"28.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4654","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of iron-carrying transferrin protein that is actually loaded with iron. At 28.92%, this is within both the laboratory and optimal ranges of 25 to 40%, showing iron transport is functioning well. The iron is reaching where it needs to go; the issue is the stores (ferritin) being lower than ideal rather than the transport system.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron overload, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"20.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5153","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3738","upper_optimal_position":"0.6168","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. At 20.7, this is a healthy mid-range result within both normal and optimal bands. Combined with the healthy transferrin saturation, this confirms that iron availability is not a problem; the concern is the storage level (ferritin) rather than the circulating supply.","low_causes":"Iron deficiency, chronic blood loss, poor dietary intake, malabsorption","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4231","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream to the bone marrow and other tissues. At 2.85, this is within both normal and optimal ranges, showing the body has an appropriate amount of iron transport capacity and is not over- or under-producing transferrin in response to iron status.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"66.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5627","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3955","upper_optimal_position":"0.6247","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind and transport iron. At 66.1, this is within both normal and optimal ranges, confirming the body's iron transport system is functioning appropriately. TIBC rises when iron stores are depleted as the body tries to capture more iron from the diet; a normal TIBC alongside a low-normal ferritin means the stores are slightly low but the body has not yet upregulated its capture mechanisms.","low_causes":"Iron overload, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3619","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4397","upper_optimal_position":"0.8299","units":"ng/mL","description":"Ferritin is the protein that stores iron inside cells, acting as the body's iron reserve. At 34, this is within the laboratory range of 10 to 291 but below the optimal floor of 40 for women and below the 50 level that research consistently associates with maintained hair growth. In the context of the progressive hair loss over the past year, this is one of the most actionable findings. Hair follicles are among the most rapidly dividing cells in the body and are exquisitely sensitive to iron stores; ferritin below 40 to 50 is associated with increased shedding (telogen effluvium) even when formal iron deficiency criteria are not met. Building ferritin to 50 to 80 with gentle iron supplementation is a priority.","low_causes":"Insufficient dietary iron, heavy menstrual periods, chronic blood loss, malabsorption, high training load","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is the main electrolyte that regulates fluid balance and blood pressure. At 140, this is a healthy mid-range result within both normal and optimal bands, confirming proper fluid balance and kidney regulation.","low_causes":"Excess fluid intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5897","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance, blood pressure, and the acid-base balance of the blood. At 101, this is within both normal and optimal ranges, confirming healthy electrolyte regulation.","low_causes":"Vomiting, diuretics, adrenal disorders, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"27.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5636","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is a buffer that helps maintain the blood's pH in the ideal range. At 27.6, this is within both normal and optimal ranges, confirming the body's acid-base balance is healthy. This is particularly relevant for someone training at moderate intensity seven days a week, as exercise produces acid
