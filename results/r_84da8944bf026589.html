et, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL and Lp(a) particle, so it counts the total number of potentially harmful cholesterol particles in the blood. It is considered a more accurate cardiovascular risk marker than LDL alone. At 0.86 this is below the desirable threshold of 0.9 but above the optimal target of 0.8. In the context of her outstanding HDL, low triglycerides and low ApoB/A1 ratio, the overall risk profile is favourable. Reducing saturated fat and increasing soluble fibre (oats, beans, lentils) could bring this below 0.8.","low_causes":"Low cholesterol, statins, healthy diet, hyperthyroidism","high_causes":"High saturated fat diet, familial hypercholesterolaemia, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.488636","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4072","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"ratio","description":"The ApoB/A1 ratio is considered one of the best single markers of cardiovascular risk because it balances harmful particles (ApoB) against protective ones (ApoA1). At 0.49 this is well below the lower-risk threshold of 0.6 for women and within the optimal range, confirming a favourable balance between atherogenic and protective lipoproteins.","low_causes":"High ApoA1, low ApoB, excellent lipid balance","high_causes":"High ApoB, low ApoA1, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a cholesterol particle similar to LDL but with an additional protein called apolipoprotein(a) attached. Its level is almost entirely genetically determined and does not change with diet or exercise. At below 25 this is ideal, well below the normal limit of 32. This is genuinely useful information because it confirms that any elevation in LDL or ApoB is driven entirely by modifiable factors such as diet and lifestyle, not by an inherited particle that cannot be changed.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"178","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6248","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Creatine kinase is an enzyme released from muscle cells when they are damaged or under strain. At 178 this is within range. CK can be elevated by intense exercise, but given she does no structured training, this level simply reflects normal muscle metabolism. Her creatine supplementation may contribute to a slightly higher baseline.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 is the unbound, active form of thyroxine, the storage thyroid hormone. The thyroid releases T4, which is then converted into the more active T3 in the tissues. At 18.7 this is within the optimal range of 14 to 20, confirming that her levothyroxine dose is producing a good level of T4 in the blood.","low_causes":"Hypothyroidism, inadequate levothyroxine dose, pituitary disease","high_causes":"Hyperthyroidism, excessive levothyroxine, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"2.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4586","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH is released by the pituitary gland to tell the thyroid how much hormone to produce. A high TSH means the pituitary is shouting at the thyroid to work harder; a low TSH means it is whispering because enough hormone is circulating. At 2.14 this is within the optimal range of 1.0 to 2.5, confirming that her levothyroxine dose is well calibrated and the pituitary is satisfied with the thyroid hormone level.","low_causes":"Hyperthyroidism, excessive levothyroxine, pituitary disease","high_causes":"Hypothyroidism, inadequate levothyroxine dose, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 is the most active thyroid hormone, responsible for driving metabolism, energy and brain function at the cellular level. At 4.6 this is within range and just inside the optimal band of 4.5 to 6.5, sitting at the lower end. The FT3:FT4 ratio of 0.246 suggests that conversion from T4 to T3 could be slightly more efficient. Selenium and adequate iron support this conversion process.","low_causes":"Poor T4-to-T3 conversion, low selenium or iron, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"TPO antibodies are produced by the immune system when it attacks the thyroid gland, as occurs in Hashimoto's thyroiditis, the most common cause of hypothyroidism. At below 6.6 these are negative, well below the threshold of 13.8. Combined with the negative thyroglobulin antibodies, this makes autoimmune thyroid disease very unlikely, which is a genuinely positive finding because it suggests her hypothyroidism is stable and non-progressive.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce hormones. Like TPO antibodies, elevated levels suggest autoimmune thyroid disease. At below 1.3 these are negative, confirming no autoimmune attack on the thyroid.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.246","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.246 this is within the reference range but below the optimal band of 0.27 to 0.4, suggesting conversion could be slightly more efficient. This is driven by the FT3 sitting at the lower end of optimal (4.6) while FT4 is comfortably in the middle (18.7). Selenium, zinc and adequate iron all support the deiodinase enzymes responsible for this conversion. Improving iron delivery (transferrin saturation currently 19.9 percent) and adding selenium may help improve this ratio.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ca1","name":"CA-125","group":"TUMOR MARKERS","result":"3.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0597","lower_normal":"0","upper_normal":"31","lower_optimal":"0","upper_optimal":"31","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"CA-125 is a protein that can be elevated in ovarian cancer, but also in endometriosis, fibroids, pregnancy and menstruation. It is used as a screening marker. At 3.7 this is well within range and provides reassurance.","low_causes":"Normal","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic inflammation, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca15","name":"CA 15-3","group":"TUMOR MARKERS","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"CA 15-3 is a protein used primarily in monitoring breast cancer. At 10 this is well within range and provides reassurance.","low_causes":"Normal","high_causes":"Breast cancer, ovarian cancer, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"c19","name":"CA 19-9","group":"TUMOR MARKERS","result":"11.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1576","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"CA 19-9 is a protein used primarily in monitoring pancreatic and gastrointestinal cancers. At 11.66 this is well within range and provides reassurance.","low_causes":"Normal","high_causes":"Pancreatic cancer, bile duct cancer, bowel cancer, pancreatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3543","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ng/mL","description":"CEA (carcinoembryonic antigen) is a protein used in monitoring bowel, lung and other cancers. At 1.63 this is within range and provides reassurance.","low_causes":"Normal","high_causes":"Bowel cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"Immunoglobulin G","group":"IMMUNOLOGY","result":"11.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4982","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against infections. At 11.2 this is within range, confirming a healthy adaptive immune system with adequate antibody production.","low_causes":"Immune deficiency, medication effects","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M","group":"IMMUNOLOGY","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. At 1 this is within range, confirming normal initial immune response capability.","low_causes":"Immune deficiency","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A","group":"IMMUNOLOGY","result":"3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6129","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces including the gut, respiratory tract and urinary tract. At 3 this is within range, confirming healthy mucosal immunity. IgA is also used to assess the coeliac screen: a normal IgA confirms the coeliac antibody test is reliable.","low_causes":"IgA deficiency (common, 1 in 500), which makes the coeliac IgA test unreliable","high_causes":"Chronic infection, liver disease, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E","group":"IMMUNOLOGY","result":"313","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"IU/mL","description":"IgE is the antibody produced in response to allergens and parasites. At 313 this is more than three times the upper limit of 100, confirming the immune system is mounting a significant allergic response. This could be environmental (dust mites, pet dander, pollen, mould), dietary, or related to a skin condition such as eczema. It does not identify the specific allergen but confirms there is one. The elevated eosinophils (0.53) and basophils (0.18) are part of the same allergic pathway. Her GP may suggest allergy testing to identify the trigger.","low_causes":"Normal, immune deficiency","high_causes":"Allergies, asthma, eczema, parasitic infection, drug reactions, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rf","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/mL","description":"Rheumatoid factor is an antibody often elevated in rheumatoid arthritis, an autoimmune condition that attacks the joints. At 6 this is well below the threshold of 14 and negative. Given her reported joint pain and stiffness, this is an important reassuring negative because it makes rheumatoid arthritis very unlikely as the cause. Her joint symptoms are more likely related to the menopausal transition, where declining oestrogen and low testosterone contribute to joint stiffness and inflammation.","low_causes":"Normal, no rheumatoid arthritis","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.887","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0617","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"CU","description":"Tissue transglutaminase IgA is the primary screening antibody for coeliac disease, a condition where gluten damages the lining of the small intestine, causing malabsorption and inflammation. At 0.887, with a negative result, this makes coeliac disease very unlikely while she is on a gluten-containing diet. Her IgA is normal at 3.0, confirming the test is reliable.","low_causes":"No coeliac disease","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5532","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, the unstable molecules that damage cells and accelerate ageing. At 1.61 this is within the optimal range, reflecting good dietary antioxidant intake from her 4 to 5 daily portions of vegetables and fruit and her supplementation.","low_causes":"Poor dietary intake of fruit and vegetables, oxidative stress, chronic disease","high_causes":"High antioxidant diet, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"126","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Cortisol is the body's main stress hormone, following a daily rhythm with a peak in the early morning and a decline through the day. At 126 this is below the morning reference range of 145.4 to 619.4 but within the afternoon range of 94.9 to 462.4. The significance depends on when the sample was taken. If collected in the early morning, it could suggest a blunted cortisol awakening response, which fits her pattern of being slow to get going and experiencing an afternoon energy crash. If collected later, this is entirely expected. It is not a concern on its own but adds context to her energy pattern.","low_causes":"Adrenal insufficiency, pituitary disease, late-day sampling","high_causes":"Stress, Cushing's syndrome, early morning sampling, steroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"152","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the primary oestrogen in women, essential for bone health, brain function, cardiovascular protection and mood. At 152 this is above the postmenopausal range of 0 to 118.2, consistent with HRT replacement. Her FSH at 45.2, which is in the postmenopausal range, confirms that this oestradiol is coming from her HRT rather than her own ovarian production. Whether 152 is the optimal level for her symptoms is a conversation for her HRT prescriber, particularly given her persisting brain fog, joint stiffness and low libido.","low_causes":"Menopause, premature ovarian failure, low body weight, pituitary disease","high_causes":"HRT, ovulation, pregnancy, ovarian tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"0.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is produced by the ovaries after ovulation and is essential for regulating the menstrual cycle and supporting early pregnancy. At 0.94 this is within the postmenopausal range of 0 to 2.32 and below the luteal phase range, consistent with her FSH confirming she is postmenopausal. If her HRT includes a progestogen component (which it typically should if she has a uterus), the timing of her last dose relative to the blood draw may affect this level.","low_causes":"Menopause, anovulation, luteal phase deficiency","high_causes":"Ovulation, pregnancy, HRT with progesterone, ovarian cysts","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"18.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/mL","description":"LH is produced by the pituitary gland and helps regulate the menstrual cycle and ovulation. At 18.57 this is above the follicular range and consistent with the perimenopausal to postmenopausal transition, alongside the FSH of 45.2. The combination of elevated FSH with LH in this range confirms declining ovarian function.","low_causes":"Pituitary disease, stress, low body weight, hormonal contraception","high_causes":"Menopause, polycystic ovary syndrome, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"45.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/mL","description":"FSH is produced by the pituitary gland to stimulate the ovaries to produce eggs and oestrogen. At 45.2 this is in the postmenopausal range of 23 to 116.3, confirming that her own ovarian function has significantly declined. The pituitary is sending a strong signal to the ovaries, which are no longer responding. This is expected at 50 and is the reason she is on HRT. Despite the HRT providing oestradiol, FSH remains elevated because the exogenous oestrogen does not fully suppress the pituitary's drive.","low_causes":"Pregnancy, hormonal contraception, pituitary disease","high_causes":"Menopause, premature ovarian failure, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"0.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and is essential for libido, muscle building, bone density, energy and mood. At 0.5 this sits right at the floor of the female range of 0.5 to 2.6 and well below the optimal band of 0.8 to 2.0. Combined with the very low free testosterone of 0.004 and the high SHBG of 104.1, this means there is very little testosterone available to the tissues. This pattern is strongly associated with her reported low libido, brain fog and hair thinning, and can make her goal of building muscle harder, and should be discussed with her HRT prescriber.","low_causes":"Menopause, adrenal insufficiency, pituitary disease, high SHBG, oral contraceptives","high_causes":"PCOS, adrenal disorders, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"0.48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3322","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The free androgen index is a calculation that estimates how much testosterone is biologically active by accounting for SHBG. It divides total testosterone by SHBG. At 0.48 this is below the lower limit of 0.5, confirming that too little testosterone is available for the tissues. The high SHBG of 104.1, likely driven by HRT and the menopausal hormonal shift, is binding most of the already-low testosterone, leaving very little free to act on target tissues like muscle, brain and the libido centres.","low_causes":"High SHBG, low testosterone, menopause, oral oestrogen","high_causes":"PCOS, high testosterone, low SHBG, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA Sulphate","group":"HORMONES","result":"2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3873","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.5","upper_optimal":"7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4029","upper_optimal_position":"0.5425","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a precursor hormone produced by the adrenal glands that the body converts into both oestrogen and testosterone. At 2 umol/L this is within range but below the optimal band. DHEA-S naturally declines with age, and at 50 this level is expected. However, a lower DHEA-S contributes to the low testosterone picture because there is less raw material for the body to convert into active hormones.","low_causes":"Ageing, adrenal insufficiency, chronic disease","high_causes":"Adrenal tumour, PCOS, Cushing's syndrome, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"217","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4274","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"619","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, primarily involved in lactation. Elevated levels can affect the menstrual cycle and libido. At 217 this is within the non-pregnant reference range of 59 to 619. Some medications, including SNRIs, can elevate prolactin, but at 217 it remains within range.","low_causes":"Dopamine agonists, pituitary underfunction","high_causes":"Pituitary tumour (prolactinoma), stress, medications (antidepressants, antipsychotics), hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"104.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5485","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3677","upper_optimal_position":"0.4805","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, making them unavailable to tissues. At 104.1 this is within range but well above the optimal band of 40 to 80 for women. High SHBG is commonly driven by oral oestrogen (the liver increases SHBG in response), the menopausal hormonal shift, and low body weight. It is the main reason her free testosterone is so low at 0.004, despite a total testosterone that is technically within range. If her HRT includes oral oestrogen, switching to a transdermal form (patch or gel) could reduce SHBG and free up more testosterone. This is worth discussing with her HRT prescriber.","low_causes":"Insulin resistance, obesity, PCOS, hypothyroidism","high_causes":"Oral oestrogen, HRT, liver disease, hyperthyroidism, ageing, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ftec","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.004","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3250","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5278","units":"nmol/L","description":"Free testosterone is the portion of testosterone not bound to proteins, making it the fraction directly available to tissues including muscle, brain and bone. At 0.004 this is below the lower limit of 0.01, confirming that virtually no testosterone is reaching the tissues that need it. This is driven by the combination of a total testosterone at the floor of range (0.5) and a high SHBG (104.1) binding what little there is. This is the most clinically relevant hormonal finding in the report and strongly correlates with her symptoms of low libido, brain fog, hair thinning and difficulty building muscle.","low_causes":"High SHBG, low total testosterone, menopause, oral oestrogen","high_causes":"PCOS, adrenal disorders, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3576","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone estimates the testosterone available to tissues after accounting for SHBG binding, including both free testosterone and the loosely albumin-bound fraction. At 0.09 this is within the reference range but below the optimal band of 0.12 to 0.55. It confirms the picture: there is not enough usable testosterone reaching the tissues that need it for libido, muscle building, mood and cognitive function.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"1.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol not bound to SHBG and therefore available to tissues. At 1.46 this is reported for context. With SHBG at 104.1, a significant proportion of oestradiol is bound, but at an oestradiol of 152, there appears to be enough free oestradiol for basic function, though her persisting symptoms suggest the balance may not be optimal for her individually.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ph","name":"Urine pH","group":"URINALYSIS","result":"5","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH measures how acidic or alkaline the urine is. At 5 this is mildly acidic, which is normal and can be influenced by diet, hydration and time of day.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pru","name":"Urine Protein","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine protein tests for protein leaking into the urine, which can indicate kidney damage. Negative is the expected result and confirms healthy kidney function, consistent with the excellent eGFR.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ket","name":"Urine Ketones","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine ketones appear when the body burns fat for fuel instead of glucose, as occurs during fasting, low-carbohydrate diets or uncontrolled diabetes. Negative is the expected result on a standard mixed diet.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gu","name":"Urine Glucose","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine glucose tests for sugar spilling into the urine, which typically occurs when blood sugar exceeds the kidneys' reabsorption threshold (around 10 mmol/L). Negative confirms that blood sugar is being kept well within normal limits, consistent with her excellent fasting glucose and HbA1c.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sg","name":"Specific Gravity","group":"URINALYSIS","result":"1.025","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Specific gravity measures the concentration of the urine. At 1.025 this is towards the concentrated end (range 1.005 to 1.030), consistent with the slightly high serum osmolality at 294.6 and suggesting she could benefit from drinking a little more water through the day.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ubr","name":"Urobilinogen","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urobilinogen is a byproduct of bilirubin metabolism in the gut. Small amounts in urine are normal. Negative is a normal result and confirms healthy liver function and bilirubin processing.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cas","name":"Urine Casts","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine casts are cylindrical structures formed in the kidney tubules. Their presence can indicate kidney disease. Negative is the expected result and confirms healthy kidneys.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"norm // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
