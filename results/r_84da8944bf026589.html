const REPORT_DATA = {"patient_name":"Sophia Kotretsos","dob":"05/11/1976","report_date":"2026-11-06","summary":"Customer is a 50-year-old female following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are about average (volume 5 out of 10). She does no structured cardio or resistance training, with 5,000 to 7,500 daily steps. She sleeps 7 to 8 hours but is slow to get going on waking, with an afternoon energy crash; stress feels hard to manage some weeks. She does not drink alcohol. She has a diagnosis of hypothyroidism and is taking levothyroxine, HRT, a GLP-1 receptor agonist (Mounjaro, Wegovy or Ozempic), and an SNRI. She supplements with omega-3 fish oil, vitamin B12, vitamin D, magnesium, creatine and a multivitamin. Her cycle is irregular. She reports brain fog, low sex drive, hair thinning and joint pain or stiffness. Her goals are to build muscle, improve mood and improve long-term health and longevity.\n\nHer PhenoAge is 38.2 against a calendar age of 50, which means her blood markers are ageing roughly twelve years younger than her birth certificate. That is a genuinely excellent result and reflects good metabolic health across several systems, particularly albumin, glucose, white cell count and inflammatory markers. Her Cardiovascular Risk Score is 20 out of 100, sitting right at the top of the ideal bracket, driven by an LDL and ApoB that are close to but not above threshold and offset by outstanding HDL and triglycerides.\n\nThere is a great deal of good news in this report. Her liver is in excellent health. ALT at 19, AST at 26 and Gamma GT at 18 are all comfortably within range, and the FIB-4 score of 1.24, an index that combines age, platelets and liver enzymes to estimate whether there is any scarring in the liver, is well below the threshold for concern. Her amylase at 117 and lipase at 51, both markers of pancreatic function, sit at the top of their ranges but within them, confirming the pancreas is healthy. Her kidney function is strong, with a Cystatin C of 0.88 giving an eGFR of 97, which is exactly where it should be at 50. Urea, creatinine and uric acid are all within comfortable limits, and the urinalysis is entirely clean with no protein, no blood, no glucose and no white cells. Her thyroid, which is being managed with levothyroxine, is well controlled on her current dose. TSH at 2.14, which is the signal from the pituitary gland telling the thyroid how hard to work, sits right in the middle of the ideal range. Free T4, the active storage form of thyroid hormone, is 18.7, comfortably within the ideal band. Free T3, the form the body actually uses at the cellular level, is 4.6, which is within the optimal band of 4.5 to 6.5, sitting at the lower end. Crucially, both thyroid antibody tests are negative: TPO antibodies are below 6.6 and thyroglobulin antibodies are below 1.3, which makes autoimmune thyroid disease (Hashimoto's thyroiditis, where the immune system attacks the thyroid) very unlikely despite her hypothyroidism diagnosis. This is a positive finding. Her full blood count is largely healthy. Haemoglobin at 136 is well within range, red cell indices are balanced, and white cell count at 6.28 with a healthy neutrophil-to-lymphocyte ratio of 1.32 suggests her immune system is functioning normally. Her vitamin D at 112 is excellent, well within the optimal range of 75 to 120, and her supplementation is clearly working. B12 at 511 is within the optimal band of 500 to 900, reflecting her supplementation. Folate at 16 is healthy. Magnesium at 0.92 is within the optimal range. Calcium and corrected calcium are both normal, and parathyroid hormone at 3.3 is within range, confirming calcium regulation is working as it should. Her lipid profile is, on balance, very encouraging. HDL cholesterol at 2.1 is outstanding, well above the optimal threshold of 1.6 for women, and this is one of the strongest protective markers in the panel. Triglycerides at 0.88 are excellent, comfortably below 1.0. Her ApoA1 at 1.76, the protein that carries HDL and removes cholesterol from artery walls, is healthy. Her ApoB to ApoA1 ratio at 0.49 is well below the lower risk threshold of 0.6, and her TG/HDL ratio at 0.42 is superb. Lp(a), an inherited cholesterol particle that cannot be changed by diet or exercise, is below 25, which is ideal. This is genuinely useful information because it confirms that any elevation in her other lipid markers is driven entirely by modifiable factors. Her total antioxidant activity at 1.61 is healthy. Immunoglobulins IgG, IgM and IgA are all within range. Rheumatoid factor is negative at 6, which is reassuring given her joint symptoms. The coeliac screen is negative. All three tumour markers, CA125 at 3.7, CA15-3 at 10 and CA19-9 at 11.66, are well within their limits, and CEA at 1.63 is normal. Creatine kinase at 178 is within range. Her prolactin and cortisol are within expected limits.\n\nThe most important finding in this report is her insulin resistance. Her fasting insulin is 15.43, which is within the laboratory range of 2.6 to 24.9 but well above the optimal ceiling of 8. Her HOMA-IR, a calculation that combines fasting insulin and fasting glucose to estimate how resistant the body's cells are to insulin's signal, is 3.09, which is above 2.9, the threshold for significant insulin resistance. Her fasting glucose at 4.5 and HbA1c at 30 mmol/mol are both excellent, which tells a clear story: the pancreas is working hard to keep blood sugar in check, and it is succeeding, but it is having to produce roughly double the insulin it should need to do so. The C-peptide at 2.01 ug/L, a byproduct of insulin production that confirms how much insulin the pancreas is actually releasing, supports this. The TyG index at 8.06 is within range, and the good news is that her triglycerides and glucose are not yet showing the downstream effects of the resistance. This pattern is common at 50, particularly around the perimenopause when oestrogen levels shift, and it is the single biggest lever for her long-term health goal. She is already taking a GLP-1 receptor agonist, which works partly by improving insulin sensitivity and reducing appetite, and this is working in the right direction, but the HOMA-IR at 3.09 shows there is still ground to cover. The combination of dietary changes, specifically reducing refined carbohydrates and adding resistance training, alongside her GLP-1 medication, is the approach most likely to bring this number down.\n\nHer hsCRP is 3.6, which is above the optimal threshold of 1.0. HsCRP, or high-sensitivity C-reactive protein, is a broad marker of inflammation in the body. At 3.6 it is within the laboratory range of less than 5 but above the level at which it is considered a cardiovascular risk marker. In the context of her excellent lipid profile, this is unlikely to be driven by arterial disease. Insulin resistance itself is a common driver of low-grade inflammation, and bringing the HOMA-IR down will likely bring CRP down with it. Her ESR, the erythrocyte sedimentation rate, which measures how quickly red blood cells settle in a tube and rises with inflammation, is 24, above the limit of 12. Taken together, the raised CRP and ESR suggest a genuine inflammatory signal. This could be partly driven by the insulin resistance, partly by her joint symptoms, or partly by something else entirely. It is worth mentioning to her GP so that it can be tracked alongside the insulin work, and if her joint pain persists, the GP may wish to investigate further.\n\nHer oestradiol is 152 pmol/L, which is above the postmenopausal range of 0 to 118.2 and consistent with HRT replacement. Her FSH at 45.2 is in the postmenopausal range of 23 to 116.3, confirming that her own ovarian function has declined and the oestradiol she has is coming from her HRT. Her LH at 18.57 and progesterone at 0.94 are consistent with this picture. The irregular cycle she reports is expected during this transition. Her HRT is producing oestradiol at a reasonable level, but whether it is the right level for her symptoms is a conversation for her prescriber, particularly given her persisting brain fog, low libido and joint stiffness, all of which are recognised features of the perimenopause and menopause that HRT aims to address.\n\nHer testosterone is 0.5, sitting right at the bottom of the female range of 0.5 to 2.6, and her free testosterone, which is the portion not bound to proteins and therefore available to tissues, is 0.004 nmol/L, below the lower limit of 0.01. Her free androgen index at 0.48 is also below range. Her SHBG, sex hormone binding globulin, the protein that binds testosterone and makes it unavailable, is 104.1, which is within range but high and is the reason so little testosterone is free. This pattern, total testosterone at the floor with high SHBG mopping up what little there is, is strongly associated with low libido, brain fog and hair thinning, which she reports, and can make building muscle, one of her goals, harder. This is one of the most actionable findings in the report and should be discussed with her HRT prescriber, because testosterone replacement in women, typically as a cream or gel, is now recognised as part of menopause management when free testosterone is this low and symptoms match.\n\nHer bioavailable testosterone, a calculation that estimates the testosterone available to tissues after accounting for SHBG binding, is 0.09, below the optimal band of 0.12 to 0.55 but within the reference range. This confirms the picture: there is not enough usable testosterone reaching the tissues that need it.\n\nHer IgE is 313, more than three times the upper limit of 100. IgE is the antibody the immune system produces in response to allergens, and a level this high suggests an allergic process is active. This could be environmental (dust mites, pet dander, pollen), dietary, or related to a skin condition such as eczema. It does not pinpoint the allergen, but it suggests the immune system is reacting to something. This is worth discussing with her GP, who may suggest allergy testing or a referral if symptoms warrant it. It is possible this is also contributing to her inflammatory markers.\n\nHer eosinophils at 0.53 are marginally above the upper limit of 0.5, and her basophils at 0.18 are above the upper limit of 0.1. Both of these white cell types are involved in allergic and inflammatory responses, and their elevation fits the IgE story perfectly. The eosinophils and basophils are mildly raised because the immune system is mounting an allergic response to something, and all three findings share the same explanation.\n\nHer reticulocyte absolute count at 38.9 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count means the marrow is producing them at a slower rate than expected. Her haemoglobin is healthy at 136 and her iron stores are adequate, so this is not anaemia. At 50, and with a mildly low transferrin saturation at 19.9 percent (just above the lower limit of 18 and below the optimal of 25), the most likely explanation is that iron delivery to the bone marrow is slightly below what it needs to produce red cells at the optimal rate. Her ferritin at 62 is within the optimal range for women, but the transferrin saturation, which measures how much of the iron-carrying protein is actually loaded with iron, tells us the iron is not being delivered as efficiently as it could be. This is a minor finding and not a concern, but it is worth monitoring.\n\nHer FT3 to FT4 ratio is 0.246, which sits just below the optimal band of 0.27 to 0.4. This ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.246 it is within the laboratory range but suggests conversion could be slightly better. This could contribute to her brain fog and afternoon energy crash, because T3 is the hormone that actually drives cellular energy. Selenium, zinc and adequate iron all support T3 conversion, and her current supplementation does not include selenium. This is a minor finding but worth addressing.\n\nHer serum osmolality at 294.6 is at the top of the range of 275 to 295, just above the optimal ceiling of 292. This is a calculated estimate of how concentrated the blood is and most commonly reflects hydration. At this margin it simply suggests she could drink a little more water through the day.\n\nHer potassium at 5.1 is within range but towards the upper end of 3.5 to 5.3. This is worth a routine repeat with her GP to confirm. Her kidney function is excellent, which is reassuring.\n\nHer cortisol at 126 is below the morning reference range of 145.4 to 619.4. Cortisol follows a daily rhythm, peaking in the early morning and falling through the day, so this result depends on when the sample was taken. If it was drawn later in the morning or in the afternoon, 126 is expected. If it was an early morning sample, it could suggest a lower-than-ideal cortisol awakening response, which would fit with her pattern of being slow to get going on waking and crashing in the afternoon. This is not a concern on its own but adds context to her energy pattern.\n\nHer DHEA-S at 2 umol/L is within range. Her globulin at 36 sits at the top of its range, which is not a concern but is consistent with the immune activation shown by the IgE.\n\nTo summarise the key actions: the insulin resistance at HOMA-IR 3.09 is the biggest modifiable risk factor and the most important target for her long-term health goal. The very low free testosterone with high SHBG should be discussed with her HRT prescriber as it is likely driving her low libido, brain fog and difficulty building muscle. The raised IgE at 313 with elevated eosinophils and basophils suggests an active allergic process that warrants investigation. The raised ESR and CRP should be tracked alongside the insulin and allergy work. And her iron delivery, while adequate, could be optimised to support red cell production and thyroid hormone conversion.","links":"The thread that ties several of these findings together is the interaction between insulin resistance, inflammation and the hormonal transition of the menopause. Insulin resistance drives low-grade inflammation, and inflammation raises both CRP and ESR. At the same time, the menopausal transition has shifted her hormonal landscape: FSH at 45.2 confirms that ovarian function has declined, and while HRT is replacing oestradiol to a reasonable level at 152, her testosterone is at the floor and SHBG at 104.1 is binding almost all of it. The result is a body that is metabolically working harder than it should (high insulin to maintain normal glucose), inflamed at a low level, and running on very little free testosterone. Her symptoms of brain fog, low libido, hair thinning, joint stiffness and afternoon fatigue are the predictable output of this combination.\n\nThe second thread is the allergic one. IgE at 313 with eosinophils and basophils both above range is a separate process from the insulin resistance. This is the immune system responding to an allergen, and it may be contributing to the inflammatory markers independently of the metabolic picture. Until the allergen is identified and managed, the CRP and ESR are unlikely to fall to their ideal levels even if the insulin resistance improves.\n\nThe third thread is iron delivery. Ferritin at 62 shows adequate stores, but transferrin saturation at 19.9 percent, just above the lower limit, means iron is not being loaded onto its transport protein efficiently. The consequence is a mildly low reticulocyte count at 38.9, meaning the bone marrow is producing red cells a little slowly, and possibly suboptimal T4-to-T3 conversion reflected in the FT3:FT4 ratio of 0.246. Neither finding is alarming, but both could contribute to her fatigue and brain fog at the margins, and both would improve with better iron delivery.\n\nWhat has been positively excluded is important. Her liver is clean across every marker. Her kidneys are strong. Her thyroid is well controlled on levothyroxine with negative antibodies. Her blood sugar control is excellent at the glucose and HbA1c level. Rheumatoid factor is negative, making inflammatory arthritis unlikely despite her joint symptoms. The coeliac screen is negative. All tumour markers are normal. Lp(a) is ideal, confirming her cardiovascular risk is entirely modifiable. Her lipid profile, apart from a total cholesterol of 5.2 that is driven almost entirely by her excellent HDL, is protective rather than harmful.\n\nThe one loose end is the cortisol at 126. If drawn in the morning, this is low and could explain her slow starts and afternoon crashes through a blunted cortisol rhythm. If drawn in the afternoon, it is expected. This is worth noting but does not require investigation unless symptoms persist after the other changes are made.","lifestyle":"Start resistance training twice a week, even with bodyweight exercises or light dumbbells at home, for 20 to 30 minutes. Anchor: pick two fixed days and a fixed time, and lay out your kit the night before. Why: resistance training is the single most effective way to improve insulin sensitivity (your HOMA-IR is 3.09), build the muscle you are aiming for, and increase free testosterone, which is critically low at 0.004.\nAdd a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish or leftover meat. Anchor: protein goes on the plate before anything else. Why: protein blunts the insulin spike behind your fasting insulin of 15.43, supports muscle building which is one of your goals, and keeps you full through the afternoon when your energy crashes.\nReduce refined carbohydrates at one meal at a time, starting with the meal where you eat the most bread, pasta or white rice. Swap for oats, sweet potato, lentils or wholegrain alternatives. Anchor: this week, change one meal; next week, add a second. Why: slower carbohydrates reduce the insulin demand that is driving your HOMA-IR of 3.09.\nReduce sugary food from some days to once a week or less. Anchor: keep one planned treat occasion per week and remove the unplanned ones. Why: sugar drives the insulin resistance and contributes to the inflammatory signal behind your CRP of 3.6.\nWalk for 15 minutes after your largest meal of the day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal, directly targeting the mechanism behind your HOMA-IR.\nGet outside within 30 minutes of waking, even for five minutes. Anchor: before your first cup of tea or coffee. Why: morning light resets your cortisol rhythm, which may help with your slow starts and afternoon crashes given your cortisol of 126.\nSet a caffeine cut-off at 1pm. Anchor: after lunch, switch to water or herbal tea. Why: caffeine after early afternoon delays melatonin release and reduces sleep quality, which affects next-day energy and insulin sensitivity.\nAim for 2 to 2.5 litres of water across the day, front-loaded in the morning and around meals. Anchor: a full glass with each meal and one between each meal. Why: your serum osmolality at 294.6 suggests mild under-hydration.","flags":"HOMA-IR 3.09, above the threshold of 2.9 for significant insulin resistance. Fasting insulin at 15.43 is within range but well above optimal (2 to 8). Fasting glucose at 4.5 and HbA1c at 30 are excellent, showing the pancreas is compensating successfully but working harder than it should. This is the most important modifiable finding and should be discussed with her GP alongside her GLP-1 medication.\nFree testosterone 0.004 nmol/L, below the lower limit of 0.01. Free androgen index 0.48, below range. Total testosterone 0.5, at the floor of the female range. SHBG 104.1, within range but high, binding almost all available testosterone. Bioavailable testosterone 0.09, below optimal. This pattern is strongly associated with her reported low libido, brain fog and hair thinning, and can make her goal of building muscle harder, and should be discussed with her HRT prescriber as testosterone replacement may be appropriate.\nIgE 313 IU/ml, more than three times the upper limit of 100. Eosinophils 0.53, marginally above the upper limit of 0.5. Basophils 0.18, above the upper limit of 0.1. Together these suggest an active allergic process and should be discussed with her GP, who may suggest allergy testing.\nESR 24 mm/hour, above the limit of 12. hsCRP 3.6 mg/L, above the optimal threshold of 1.0. Both markers suggest a low-grade inflammatory process, likely driven by a combination of insulin resistance and the allergic response. Worth tracking as the insulin and allergy findings are addressed.\nReticulocyte absolute count 38.9, below the lower limit of 50. Haemoglobin is healthy at 136, so this is not anaemia. Transferrin saturation at 19.9 percent is just above the lower limit and below optimal, suggesting iron delivery to the bone marrow is slightly below what is needed for optimal red cell production. A minor finding to monitor.\nCortisol 126 nmol/L, below the morning reference range of 145.4 to 619.4. The significance depends on the time of sampling. If drawn after mid-morning this is expected; if drawn early morning it may reflect a blunted cortisol awakening response contributing to her slow mornings and afternoon crashes.\nPotassium 5.1 mmol/L, within range but towards the upper end. Worth a routine repeat with her GP to confirm, given that kidney function is excellent.\nTotal cholesterol 5.2 mmol/L, marginally above the desirable threshold of 5.18. In the context of an HDL of 2.1, this is driven by protective cholesterol rather than harmful particles. ApoB at 0.86 is below 0.9 and the ApoB/A1 ratio at 0.49 is well within the low-risk bracket.\nFT3:FT4 ratio 0.246, just below the optimal band of 0.27 to 0.4, suggesting thyroid hormone conversion could be slightly more efficient.\nReassuring negatives: liver function is excellent across all markers with FIB-4 at 1.24 making fibrosis very unlikely. Kidney function is strong with eGFR at 97. Thyroid is well controlled with negative antibodies making autoimmune thyroid disease unlikely. Rheumatoid factor is negative making inflammatory arthritis unlikely. Coeliac screen is negative. All tumour markers are within range. Lp(a) is ideal at below 25. Urinalysis is entirely clean.\n","recommendations":"Discuss insulin resistance with your GP: HOMA-IR is 3.09, above the significant resistance threshold of 2.9, with fasting insulin at 15.43. Your GLP-1 medication is working in the right direction but the resistance persists. Your GP may wish to review the dose or add dietary and exercise targets alongside it. Bring these numbers: HOMA-IR 3.09, fasting insulin 15.43, fasting glucose 4.5, HbA1c 30.\nDiscuss testosterone replacement with your HRT prescriber: free testosterone is 0.004 (below 0.01 limit), total testosterone is 0.5 (floor of range), free androgen index is 0.48 (below range), SHBG is 104.1 (high, binding available testosterone). These are likely contributors to your low libido, brain fog and hair thinning, and can make building muscle harder. Testosterone cream or gel is now part of recognised menopause management.\nDiscuss the raised IgE of 313 with your GP: this suggests an active allergic process. Your GP may suggest skin prick testing or specific IgE panels to identify the allergen. Mention the raised eosinophils (0.53) and basophils (0.18) as supporting evidence.\nAsk your GP to repeat the ESR (currently 24) and hsCRP (currently 3.6) in three to four months to track whether the inflammatory signal improves as the insulin resistance and allergy are addressed.\nAsk your GP to repeat potassium (currently 5.1) to confirm.\nDiscuss your energy pattern (slow mornings, afternoon crash) with your GP if it persists after starting resistance training, improving diet and optimising hydration. If cortisol was drawn early morning at 126, your GP may wish to repeat a 9am cortisol.\nProtein target: 80 to 100g per day, spread across meals, which matters more while taking a GLP-1 medication and starting resistance training. No calorie target is set, because the quiz did not include her weight and her GLP-1 medication already reduces appetite. Retest in four to five months, repeating: fasting insulin, HOMA-IR, hsCRP, ESR, full blood count (reticulocytes), free testosterone, SHBG, free androgen index, IgE, potassium and transferrin saturation.","supplementation":"Continue vitamin D3 (cholecalciferol) at 2,000 IU daily with a fat-containing meal. Her level at 112 is in the optimal range of 75 to 120, so current dosing is maintaining it well. Always take with vitamin K2 (MK-7) 100mcg daily to direct calcium into bone rather than soft tissue.\nContinue vitamin B12 as sublingual methylcobalamin 1,000mcg daily. Her level at 511 is within the optimal band of 500 to 900, confirming her supplementation is working.\nContinue magnesium glycinate 300 to 400mg before bed. Her level at 0.92 is within the optimal range. This form also supports sleep quality and may help her slow mornings.\nContinue omega-3 fish oil at 2 to 3g total EPA and DHA daily. Her lipid profile is already excellent, but omega-3 supports the anti-inflammatory pathway relevant to her CRP of 3.6 and her joint stiffness.\nAdd selenium 200mcg daily (selenomethionine form), taken with breakfast. Why: selenium is essential for the enzyme that converts T4 into the active T3, and her FT3:FT4 ratio of 0.246 suggests this conversion could be more efficient. It also supports immune regulation.\nAdd zinc 15mg daily (as zinc picolinate or bisglycinate), taken with a meal separate from any iron-containing food. Why: zinc supports thyroid hormone conversion, immune function and is important for testosterone activity. Her zinc was not measured separately but the combination of low free testosterone and suboptimal T3 conversion makes it a reasonable addition. Check her multivitamin first: if it already contains selenium or zinc, count that towards these amounts.\nContinue creatine monohydrate at 3 to 5g daily. Creatine supports muscle building, which is one of her goals, and there is evidence it supports cognitive function, which is relevant to her brain fog.\nDO NOT add iron supplements. Her ferritin at 62 is within the optimal range and additional iron could push stores too high. The transferrin saturation issue is about delivery efficiency, not total iron.\nLevothyroxine should be taken on its own on an empty stomach, at least 4 hours apart from the zinc and magnesium, which can reduce how much is absorbed; her GP or pharmacist can confirm the best timing.\nThe most important changes from this report are not supplements. They are starting resistance training twice a week, adding protein to every meal, reducing refined carbohydrates and sugar, and discussing testosterone replacement with her HRT prescriber.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 55.1; held to 49 by two or more systems rated \"See your GP\". Weakest systems: inflammation 6%, immunology 19%, glucose & insulin 34%. Biggest drags: HOMA-IR, Basophils, Reticulocytes (Absolute), Erythrocyte Sedimentation Rate.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"38.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3473","lower_normal":"","upper_normal":"55","lower_optimal":"","upper_optimal":"50","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4545","units":"years","description":"PhenoAge is a biological age calculator built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 38.2 against a calendar age of 50, her blood is ageing approximately twelve years younger than her birth certificate. The main drivers of this favourable result are her excellent albumin (42), healthy glucose (4.5), good lymphocyte count and low RDW. Her CRP at 3.6 is the one marker pulling PhenoAge slightly higher than it might otherwise be; bringing the CRP down through addressing insulin resistance and the allergic process could push PhenoAge even lower.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a 0 to 100 index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the risk being built, not the ten-year chance of an event. At 20 this sits right at the top of the ideal bracket of 0 to 20. The score is held down by the outstanding HDL (2.1), excellent triglycerides (0.88) and ideal Lp(a), but pushed up by the ApoB (0.86) and CRP (3.6). Bringing those two down through diet and addressing the inflammation would push the score further into ideal territory.","low_causes":"Excellent lipid profile, low inflammation, good metabolic health","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose is the concentration of sugar circulating in the bloodstream at the moment the sample was taken. At 4.5 this is comfortably within the optimal range of 4.0 to 5.4 and confirms excellent short-term blood sugar control. In the context of a fasting insulin of 15.43 and a HOMA-IR of 3.09, this normal glucose tells us the pancreas is working hard enough to keep sugar perfectly controlled, even though more insulin than ideal is needed to achieve it.","low_causes":"Fasting, excessive insulin, medication effects","high_causes":"Insulin resistance, diabetes, high carbohydrate intake, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghbi","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been coated with sugar over the previous two to three months. It gives a longer-term picture of blood sugar control than a single glucose reading. At 30 mmol/mol this is excellent, well below the normal threshold of 42 and within the optimal range. Combined with the normal fasting glucose, it confirms that blood sugar has been very well controlled over recent months, despite the insulin resistance shown by HOMA-IR.","low_causes":"Low carbohydrate diet, red blood cell disorders, blood loss","high_causes":"Sustained high blood sugar, insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"15.43","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5251","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone released by the pancreas to move glucose from the blood into cells. A fasting level tells us how hard the pancreas is working to maintain normal blood sugar. At 15.43 this is within the laboratory range but nearly double the top of the optimal band of 2 to 8. This means the body's cells are not responding efficiently to insulin's signal, so the pancreas has to produce more of it. It is the key driver of the HOMA-IR of 3.09 and the most important actionable finding in this report. Resistance training, reducing refined carbohydrates and maintaining protein at every meal are the most effective ways to bring this down.","low_causes":"Low carbohydrate diet, high insulin sensitivity, prolonged fasting","high_causes":"Insulin resistance, high carbohydrate diet, excess body fat, sedentary lifestyle, hormonal changes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.01","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4253","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4242","units":"ug/L","description":"C-peptide is a protein released by the pancreas in equal amounts to insulin. Because it is not cleared by the liver the way insulin is, it gives a reliable picture of how much insulin the pancreas is truly producing. At 2.01 ug/L this is within range but just above the optimal ceiling of 2.0, confirming that the pancreas is producing a substantial amount of insulin to maintain normal glucose levels, consistent with the insulin resistance shown by HOMA-IR.","low_causes":"Low insulin demand, type 1 diabetes, low carbohydrate diet","high_causes":"Insulin resistance, high insulin output, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"3.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR stands for Homeostatic Model Assessment of Insulin Resistance. It combines fasting glucose and fasting insulin into a single number that estimates how resistant the body's cells are to insulin. Below 1.0 is optimal, above 1.9 indicates early resistance, and above 2.9 indicates significant resistance. At 3.09 this is consistent with significant insulin resistance. The body needs roughly three times the ideal amount of insulin to keep glucose at 4.5. This is the most important modifiable finding in this report and the primary target for lifestyle change and medical review.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, excess body fat, sedentary lifestyle, high carbohydrate diet, hormonal changes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3714","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an approximate average blood sugar level over the past two to three months. At 5.2 this is within the optimal range and confirms excellent long-term blood sugar control.","low_causes":"Low carbohydrate diet, excellent insulin sensitivity","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4580","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines fasting triglycerides and glucose into a single marker of insulin resistance and metabolic risk. At 8.06 this is within the optimal range, which is interesting because the HOMA-IR at 3.09 shows significant resistance. The TyG being normal reflects the excellent triglyceride and glucose levels and suggests the insulin resistance has not yet caused the typical downstream metabolic damage.","low_causes":"Good insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"136","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to the tissues. At 136 this is comfortably within the optimal range for women and confirms there is no anaemia. Good oxygen delivery supports energy, brain function and exercise tolerance.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, smoking, altitude, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5233","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the number of red cells in a litre of blood. At 4.37 this is within the optimal range and consistent with the healthy haemoglobin at 136, confirming good red cell production and no anaemia.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow disorders, chronic disease","high_causes":"Dehydration, smoking, polycythaemia, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.399","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. At 0.399 this is within the optimal range, consistent with the healthy haemoglobin and red cell count.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"12.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"%","description":"RDW measures how much variation there is in the size of red blood cells. At 12.2 this is within the optimal range, meaning the red cells are uniform in size. A high RDW can indicate iron or B12 deficiency or mixed anaemias, so this normal result is reassuring.","low_causes":"Normal variation","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"91.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4870","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV is the average size of a red blood cell. At 91.3 this is within the optimal range, confirming normal-sized red cells. Small cells (low MCV) suggest iron deficiency; large cells suggest B12 or folate deficiency. A normal MCV makes both unlikely.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH is the average amount of haemoglobin in each red blood cell. At 31 this is within the optimal range, confirming that each cell is carrying an adequate amount of oxygen-transporting protein.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcgl","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"340","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"315","upper_normal":"345","lower_optimal":"325","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC is the average concentration of haemoglobin within each red blood cell. At 340 this is within range and optimal, confirming that the red cells are appropriately packed with haemoglobin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory variation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"240","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4487","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3654","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are the small cell fragments responsible for blood clotting. At 240 this is within the optimal range, confirming healthy platelet production and no clotting risk from either direction.","low_causes":"Bone marrow disorders, medications, viral infections, alcohol","high_causes":"Infection, inflammation, iron deficiency, post-surgery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"9.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6444","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"8.0","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6000","units":"fL","description":"MPV is the average size of platelets. Larger platelets tend to be younger and more active. At 9.9 this is within range but towards the upper end, suggesting the bone marrow is producing slightly larger platelets, which can be associated with inflammation or increased platelet turnover. In the context of otherwise normal platelet count and mild inflammatory markers, this is a minor finding.","low_causes":"Bone marrow suppression, aplastic anaemia","high_causes":"Increased platelet turnover, inflammation, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"6.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. At 6.28 this is within the optimal range, confirming a healthy and normally functioning immune system.","low_causes":"Viral infection, bone marrow disorders, medications, autoimmune conditions","high_causes":"Infection, inflammation, stress, smoking, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"2.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3973","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5333","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. At 2.96 they are within the optimal range, confirming healthy innate immune function.","low_causes":"Viral infection, medications, autoimmune conditions, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for the adaptive immune system, including fighting viruses and producing antibodies. At 2.25 they are within the optimal range, confirming a healthy and active adaptive immune system.","low_causes":"Viral infection, immunodeficiency, steroids, stress","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that help clean up damaged tissue and fight chronic infections. At 0.36 they are within the optimal range, confirming normal function.","low_causes":"Bone marrow disorders, overwhelming infection","high_causes":"Chronic infection, chronic inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6875","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and fighting parasites. At 0.53 they are marginally above the upper limit of 0.5. This mild elevation, alongside the significantly raised IgE of 313 and raised basophils, confirms an active allergic process. The three findings share the same explanation: the immune system is responding to an allergen. Identifying and managing the allergen is the next step.","low_causes":"Steroid use, acute stress","high_causes":"Allergies, asthma, eczema, parasitic infection, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells and play a role in allergic and inflammatory reactions by releasing histamine. At 0.18 they are above the upper limit of 0.1. Like the raised eosinophils and IgE, this elevation is part of the allergic response pattern. Basophils, eosinophils and IgE work together in the allergic pathway, and all three are elevated here.","low_causes":"Steroid use, acute allergic reaction (consumed into tissues)","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Percentage","group":"HEMATOLOGY","result":"0.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3983","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"The reticulocyte percentage shows what proportion of red cells are young, freshly released cells. At 0.89 percent this is within range, confirming that the bone marrow is producing new red cells at a normal rate as a proportion of total red cells.","low_causes":"Bone marrow suppression, iron or B12 deficiency, chronic disease","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"38.893","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2593","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the total number of young red blood cells in a litre of blood, not just the percentage. At 38.9 this is below the lower limit of 50, meaning the bone marrow is producing new red cells at a slower rate than expected in absolute terms. Haemoglobin is healthy at 136 so this is not anaemia, and ferritin at 62 shows adequate iron stores. However, transferrin saturation at 19.9 percent, just above the lower limit, suggests that iron delivery to the bone marrow may be slightly below what is needed for optimal red cell production. This is a mild finding to monitor rather than a concern.","low_causes":"Iron deficiency, bone marrow suppression, chronic disease, low erythropoietin","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"20.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by red blood cell count and is used to distinguish iron deficiency anaemia from thalassaemia trait when MCV is low. Her MCV is normal at 91.3, so the index does not apply. Reported for context.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR measures how quickly red blood cells settle to the bottom of a tube over one hour. A faster rate suggests inflammation somewhere in the body. At 24 this is twice the upper limit of 12 and confirms a genuine inflammatory signal. In the context of the raised hsCRP at 3.6, raised IgE at 313 and the insulin resistance pattern, this inflammation is likely driven by a combination of the allergic response and the metabolic strain of insulin resistance. It is worth tracking alongside those findings.","low_causes":"Normal variation, polycythaemia","high_causes":"Infection, inflammation, autoimmune disease, anaemia, malignancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"3.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP is a marker of general inflammation produced by the liver. It is used both as a general inflammation marker and as a cardiovascular risk marker. Below 1.0 is optimal, 1.0 to 3.0 is moderate cardiovascular risk, and above 3.0 is higher risk. At 3.6 this is within the laboratory range but above the optimal and cardiovascular risk thresholds. In this context, with excellent lipids and no other cardiovascular risk markers, the CRP is more likely reflecting the allergic process (IgE 313) and insulin resistance (HOMA-IR 3.09) than arterial inflammation. It should improve as those two findings are addressed.","low_causes":"Low inflammation, statins, healthy lifestyle","high_causes":"Infection, chronic inflammation, insulin resistance, obesity, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"19.91","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3505","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation tells us what percentage of the iron-carrying protein transferrin is actually loaded with iron. At 19.91 percent this is within the laboratory range but below the optimal band of 25 to 40 percent. It means that while total iron stores are adequate (ferritin 62), the transport system is not fully loaded, so iron delivery to the bone marrow and other tissues is slightly below optimal. This may explain the mildly low reticulocyte count and could contribute to suboptimal T3 conversion.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"12.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3910","lower_normal":"9","upper_normal":"30.4","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4112","upper_optimal_position":"0.5826","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. At 12.7 this is within the laboratory range but below the optimal band of 14 to 25. Serum iron fluctuates through the day and with meals, so it is best read alongside ferritin and transferrin saturation for the full picture. In this context, it is consistent with the slightly low transferrin saturation suggesting iron delivery could be improved.","low_causes":"Iron deficiency, chronic disease, inflammation, heavy periods","high_causes":"Iron overload, haemochromatosis, liver disease, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3436","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. At 2.54 it is within range but at the lower end. The body normally increases transferrin when iron stores are low and decreases it when stores are adequate, so at ferritin 62, a lower transferrin is expected. However, transferrin is also a negative acute-phase protein, meaning inflammation can push it down. With CRP at 3.6 and ESR at 24, mild inflammation may be suppressing transferrin slightly, contributing to the low transferrin saturation.","low_causes":"Chronic disease, inflammation, iron overload, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"55.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4507","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3437","upper_optimal_position":"0.6033","units":"umol/L","description":"Total iron binding capacity measures the blood's capacity to bind and transport iron. At 55.3 this is within the optimal range. A high TIBC suggests iron deficiency (the body is making more binding capacity to catch what little iron is available), and a low TIBC can indicate iron overload or chronic disease. This normal result is consistent with adequate iron stores.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3950","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3689","upper_optimal_position":"0.4994","units":"ng/mL","description":"Ferritin is the main storage form of iron in the body. At 62 this is within the optimal range of 40 to 150 for women and confirms that total iron stores are healthy. Ferritin can be falsely elevated by inflammation, but at 62 with a CRP of 3.6, this level is a reliable reflection of true iron stores.","low_causes":"Iron deficiency, heavy periods, vegetarian diet, coeliac disease","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease","padding":"1","one_sided":"0.5","ra ost entirely driven by her excellent HDL of 2.1. When HDL makes up 40 percent of total cholesterol, as it does here, the total number overstates risk. The ApoB and ApoB/A1 ratio are much more useful measures, and both are in healthy territory.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2588","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, mainly from dietary carbohydrates and alcohol. At 0.88 this is within the optimal range of below 1.0, which is an excellent result. Low triglycerides alongside high HDL is a strongly protective pattern and makes insulin resistance from excess liver fat less likely.","low_causes":"Low carbohydrate diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2564","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to the tissues. At 0.4 this is within the optimal range, consistent with the healthy triglyceride level.","low_causes":"Low fat diet, malnutrition","high_causes":"High carbohydrate diet, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7692","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol that removes excess cholesterol from the arteries and returns it to the liver for disposal. At 2.1 this is outstanding, well above the optimal threshold of 1.6 for women. This is one of the strongest protective markers in the panel and significantly reduces cardiovascular risk.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6320","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the cholesterol most associated with arterial plaque build-up. At 2.74 this is within the laboratory range but above the optimal target of below 2.6. However, the Lp(a)-corrected LDL of 2.66 shows that very little of this is driven by the inherited Lp(a) particle. The ApoB at 0.86, which counts the actual number of atherogenic particles, is below the desirable threshold of 0.9 and below the optimal target of 0.8 but close. The combination of a slightly elevated LDL with an outstanding HDL, excellent triglycerides and a low ApoB/A1 ratio means the overall lipid risk is low.","low_causes":"Low fat diet, statins, hyperthyroidism, malabsorption","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"Total Cholesterol/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2756","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"ratio","description":"This ratio divides total cholesterol by HDL. The lower the number, the better the cardiovascular risk profile. At 2.48 this is excellent, well below the threshold of 4.5, confirming that the proportion of protective cholesterol is very high relative to total cholesterol.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL Percentage of Total","group":"LIPIDS & CARDIOVASCULAR","result":"40.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"%","description":"This shows what proportion of total cholesterol is made up of the protective HDL. At 40.38 percent this is excellent, well above the minimum of 20 percent and above optimal levels. It confirms that the slightly elevated total cholesterol is driven by healthy protective cholesterol rather than harmful particles.","
